name: Increment 52 shared-process ownership materializer

on:
  push:
    branches:
      - agent/increment-52-nested-control-flow-clean
    paths:
      - .github/workflows/increment-52-overlap-debug.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out the triggering repair carrier commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize the reviewed production patch
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/increment-52-overlap-debug.yml > /tmp/increment-52-carrier.yml
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/increment-52-carrier.yml').read_text(encoding='utf-8').splitlines()
          start = next(
              index for index, line in enumerate(lines)
              if line == "          python3 - <<'PY'"
          ) + 1
          end = next(
              index for index in range(start, len(lines))
              if lines[index] == '          PY'
          )
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines[start:end]
          )
          exec(compile(script, '/tmp/increment-52-production-patch.py', 'exec'))
          PY
          rm .github/workflows/increment-52-overlap-debug.yml
          git diff --check

      - name: Commit the production repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala
          git add -u .github/workflows
          git commit -m 'fix: partition shared native processes by branch evidence'
          git push origin HEAD:agent/increment-52-nested-control-flow-clean

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Validate source boundary and focused Increment 52 contracts
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl/scripts/check-native-int-nested-control-flow-boundary.sh
          /tmp/morphhdl-mill morph[2.12.18].testOnly \
            morphhdl.NativeIntNestedSymbolicControlFlowTests
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.NativeIntNestedSymbolicControlFlowTests

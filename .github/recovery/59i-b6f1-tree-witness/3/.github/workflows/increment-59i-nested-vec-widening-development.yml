name: Increment 59i nested-Vec widening development

on:
  push:
    branches: ['agent/increment-59i-combined-reduction-closure']
    paths:
      - '.github/workflows/increment-59i-nested-vec-widening-development.yml'
      - 'morphhdl/repair-59i-nested-vec-widening/write-focused-test.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-59i-nested-vec-widening-development
  cancel-in-progress: true

jobs:
  test:
    name: Nested-Vec widening Scala ${{ matrix.scala }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        scala: ['2.12.18', '2.13.12']
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      SCALA_VERSION: ${{ matrix.scala }}
      COURSIER_REPOSITORIES: https://repo.maven.apache.org/maven2
      COURSIER_CACHE: /sbt/.cache/coursier/v1
      JAVA_TOOL_OPTIONS: '-Xmx5G -XX:ActiveProcessorCount=4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Write exact test-only probe
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-nested-vec-widening"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/head.txt"
          python3 morphhdl/repair-59i-nested-vec-widening/write-focused-test.py \
            2>&1 | tee "$out/application.log"
          git diff --check
          git diff --binary > "$out/test-only.diff"
          changed=$(git diff --name-only)
          test "$changed" = 'morphhdl/src/test/scala/spinal/core/internals/TypedBalancedReductionNestedVecWideningTests.scala'
          test -z "$(git diff --name-only | grep '/src/main/' || true)"

      - name: Bootstrap pinned SBT
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-nested-vec-widening"
          version=$(sed -n 's/^sbt.version=//p' project/build.properties)
          test "$version" = '1.10.0'
          curl --fail --location --retry 5 --retry-all-errors \
            "https://repo.maven.apache.org/maven2/org/scala-sbt/sbt-launch/$version/sbt-launch-$version.jar" \
            -o "$out/sbt-launch.jar"
          printf '[repositories]\nlocal\nmaven-central: https://repo.maven.apache.org/maven2\n' > "$out/repositories"
          cat > "$out/sbt.sh" <<'SH'
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-nested-vec-widening"
          java -Xmx4G -Dsbt.log.noformat=true -Dsbt.supershell=false \
            -Dsbt.boot.directory=/sbt/.sbt/boot -Dsbt.global.base=/sbt/.sbt \
            -Dsbt.ivy.home=/sbt/.ivy2 -Duser.home=/sbt \
            -Dsbt.repository.config="$out/repositories" -Dsbt.override.build.repos=true \
            -jar "$out/sbt-launch.jar" "++$SCALA_VERSION" "$@"
          SH

      - name: Compile and run nested-Vec plus inherited widening suites
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-nested-vec-widening"
          status=0
          bash "$out/sbt.sh" 'morph/Test/compile' \
            'morph/Test/testOnly spinal.core.internals.TypedBalancedReductionNestedVecWideningTests spinal.core.internals.TypedBalancedReductionCompositeWideningTests spinal.core.internals.TypedBalancedReductionCompositeTests spinal.core.internals.TypedBalancedReductionNestedResultTests' \
            > "$out/tests.log" 2>&1 || status=$?
          tail -n 400 "$out/tests.log"
          test "$status" -eq 0
          grep -q 'All tests passed' "$out/tests.log"
          ! grep -q '\*\*\* FAILED \*\*\*' "$out/tests.log"
          mkdir -p "$out/test-reports"
          find morphhdl/target -type f -name '*.xml' -exec cp {} "$out/test-reports/" \; 2>/dev/null || true
          cp morphhdl/src/test/scala/spinal/core/internals/TypedBalancedReductionNestedVecWideningTests.scala "$out/"
          sha256sum "$out/TypedBalancedReductionNestedVecWideningTests.scala" > "$out/source-sha256.txt"

      - name: Upload exact development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59i-nested-vec-widening-${{ matrix.scala }}-${{ github.sha }}
          path: target/increment-59i-nested-vec-widening
          if-no-files-found: error
          retention-days: 14

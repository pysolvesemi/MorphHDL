          printf '59I_AUDIT_BEGIN 3 87eab41ddda49f9a8d3b4bda8eebf9ede40bf6fe86dee916f59fc95d84538c18 %s\n' "$(date +%s)"
          python3 morphhdl/scripts/check-wa10-source-scope.py

          printf '59I_AUDIT_BEGIN 7 82dff91fb8d697899a8bb3097c5eaea5235641d6bd1f3a00ead2341479f5b4c3 %s\n' "$(date +%s)"
          python3 morphhdl/scripts/test-increment-59i-widening-source-review.py
          printf '59I_AUDIT_END 7 82dff91fb8d697899a8bb3097c5eaea5235641d6bd1f3a00ead2341479f5b4c3 %s\n' "$(date +%s)"
          printf '59I_AUDIT_BEGIN 8 115e71e65f32441db0b71ee5dd6755f702fff42bcf051f5f298cf5fca6394b57 %s\n' "$(date +%s)"
          python3 morphhdl/scripts/test-increment-59i-widening-successor.py
          printf '59I_AUDIT_END 8 115e71e65f32441db0b71ee5dd6755f702fff42bcf051f5f298cf5fca6394b57 %s\n' "$(date +%s)"
          printf '59I_AUDIT_BEGIN 9 ad29226d06d11f381792d8bf197c5b1aae18a38a819be686b0ece20d333d4dab %s\n' "$(date +%s)"
          python3 morphhdl/scripts/check-increment-59i-source-review.py
          printf '59I_AUDIT_END 9 ad29226d06d11f381792d8bf197c5b1aae18a38a819be686b0ece20d333d4dab %s\n' "$(date +%s)"
          printf '59I_AUDIT_BEGIN 10 77e5e923c5b70f8adce674347e0c5edd06e8ed9e40d621749a891c746c74c45c %s\n' "$(date +%s)"
          python3 morphhdl/scripts/test-increment-59i-review-composition.py
          printf '59I_AUDIT_END 10 77e5e923c5b70f8adce674347e0c5edd06e8ed9e40d621749a891c746c74c45c %s\n' "$(date +%s)"
          printf '59I_AUDIT_BEGIN 11 7457f2b954a74a7a1b8878192822957f6a4a73db0a604283ba38a17dea0ba4a8 %s\n' "$(date +%s)"
          python3 morphhdl/scripts/check-increment-60g-source-scope.py
          printf '59I_AUDIT_END 11 7457f2b954a74a7a1b8878192822957f6a4a73db0a604283ba38a17dea0ba4a8 %s\n' "$(date +%s)"
          printf '59I_AUDIT_BEGIN 12 eea744a3ae11db1438444335c31d23dcf41ee1aeeef741a9c84f6dd4134c764a %s\n' "$(date +%s)"
          python3 morphhdl/scripts/check-increment-60g-source-scope.py --self-test
          printf '59I_AUDIT_END 12 eea744a3ae11db1438444335c31d23dcf41ee1aeeef741a9c84f6dd4134c764a %s\n' "$(date +%s)"
          printf '59I_AUDIT_BEGIN 13 7e541621b5ce22cbf8f081aee207f82d52d000d8d1824e67532fd44f8eb0940c %s\n' "$(date +%s)"
          python3 morphhdl/scripts/check-increment-60g-default-rollout.py self-test
          printf '59I_AUDIT_END 13 7e541621b5ce22cbf8f081aee207f82d52d000d8d1824e67532fd44f8eb0940c %s\n' "$(date +%s)"
        } 2>&1 | tee "$out/source-audits.log"
    - name: Run inherited audit shard 59h
      if: matrix.shard == '59h'
      shell: bash
      run: |
        set -euo pipefail
        out="$GITHUB_WORKSPACE/target/increment-59i-rollout-composition"
        {
          printf '59I_AUDIT_BEGIN 14 1c11b583791bff0fb9e4423fd2c346225d949a7cdec6c003caa1f90f7db718b0 %s\n' "$(date +%s)"
          python3 morphhdl/scripts/check-increment-59g-source-review.py
          printf '59I_AUDIT_END 14 1c11b583791bff0fb9e4423fd2c346225d949a7cdec6c003caa1f90f7db718b0 %s\n' "$(date +%s)"
          printf '59I_AUDIT_BEGIN 15 91882c82969b2eb13dfae504cc44586da57762ff8a3cce36138c51132678800f %s\n' "$(date +%s)"
          python3 morphhdl/scripts/check-increment-59h-source-review.py
          printf '59I_AUDIT_END 15 91882c82969b2eb13dfae504cc44586da57762ff8a3cce36138c51132678800f %s\n' "$(date +%s)"
          printf '59I_AUDIT_BEGIN 16 fdea50af041d803db6cd7c7a2a51f24be3d89b1997abbb8893136bc16fcfba32 %s\n' "$(date +%s)"
          python3 morphhdl/scripts/test-increment-59h-inherited-source-scope.py
          printf '59I_AUDIT_END 16 fdea50af041d803db6cd7c7a2a51f24be3d89b1997abbb8893136bc16fcfba32 %s\n' "$(date +%s)"
        } 2>&1 | tee "$out/source-audits.log"
    - name: Run inherited audit shard wa07b
      if: matrix.shard == 'wa07b'
      shell: bash
      run: |
        set -euo pipefail
        out="$GITHUB_WORKSPACE/target/increment-59i-rollout-composition"
        {
          printf '59I_AUDIT_BEGIN 17 71028f9a9c55abe14f5be6bba52a048f03f27dd45d1b16e924655102f0358ef8 %s\n' "$(date +%s)"
          python3 morphhdl/scripts/check-wa07b-inherited-review.py
          printf '59I_AUDIT_END 17 71028f9a9c55abe14f5be6bba52a048f03f27dd45d1b16e924655102f0358ef8 %s\n' "$(date +%s)"
          printf '59I_AUDIT_BEGIN 18 53c500051fc09fe96426ef18f8f51ec692b82ace5912dc78692676b0f0c6f644 %s\n' "$(date +%s)"
          python3 morphhdl/scripts/test-wa07b-inherited-review.py
          printf '59I_AUDIT_END 18 53c500051fc09fe96426ef18f8f51ec692b82ace5912dc78692676b0f0c6f644 %s\n' "$(date +%s)"
        } 2>&1 | tee "$out/source-audits.log"
    - name: Run inherited audit shard 60f
      if: matrix.shard == '60f'
      shell: bash
      run: |
        set -euo pipefail
        out="$GITHUB_WORKSPACE/target/increment-59i-rollout-composition"
        {
          printf '59I_AUDIT_BEGIN 19 0f4e5e950ee3241211289600ac6146217abbf9f5f0d290814ddb1d6743b635bf %s\n' "$(date +%s)"
          python3 morphhdl/scripts/test-increment-60f-source-budget.py
          printf '59I_AUDIT_END 19 0f4e5e950ee3241211289600ac6146217abbf9f5f0d290814ddb1d6743b635bf %s\n' "$(date +%s)"
          printf '59I_AUDIT_BEGIN 20 952991f944e470f089474e4423dc0e7ca4a6a96c214f21b1a7bb524460ee3b90 %s\n' "$(date +%s)"
          python3 morphhdl/scripts/test-increment-59i-inherited-audit-budgets.py
          printf '59I_AUDIT_END 20 952991f944e470f089474e4423dc0e7ca4a6a96c214f21b1a7bb524460ee3b90 %s\n' "$(date +%s)"
          printf '59I_AUDIT_BEGIN 21 4db4c5646fa013684a55ecc6da787f0251fa8d2681c3237c472d97eca82adea8 %s\n' "$(date +%s)"
          python3 morphhdl/scripts/check-increment-60f-equivalence-closure.py --source-only
          printf '59I_AUDIT_END 21 4db4c5646fa013684a55ecc6da787f0251fa8d2681c3237c472d97eca82adea8 %s\n' "$(date +%s)"
          printf '59I_AUDIT_BEGIN 22 a7651fe4869ab9bd658e69409091de8262c5a92a87d7c8a90c917999c5c511e5 %s\n' "$(date +%s)"
          python3 morphhdl/scripts/test-increment-60f-integration-reader.py -v
          printf '59I_AUDIT_END 22 a7651fe4869ab9bd658e69409091de8262c5a92a87d7c8a90c917999c5c511e5 %s\n' "$(date +%s)"
          printf '59I_AUDIT_BEGIN 23 672db17038a98ec71253a9cca0d5a3ef0aa0e30462d57f6cf793b3e91667f02b %s\n' "$(date +%s)"
          python3 morphhdl/scripts/test-increment-60f-inherited-source-scope.py
          printf '59I_AUDIT_END 23 672db17038a98ec71253a9cca0d5a3ef0aa0e30462d57f6cf793b3e91667f02b %s\n' "$(date +%s)"
        } 2>&1 | tee "$out/source-audits.log"
    - name: Run inherited audit shard 59f-59c
      if: matrix.shard == '59f-59c'
      shell: bash
      run: |
        set -euo pipefail
        out="$GITHUB_WORKSPACE/target/increment-59i-rollout-composition"
        {
          printf '59I_AUDIT_BEGIN 24 dd5a6e7404b77d8daebcdd3ef1f6a7972cf9b76355ea229e213735ec95f525c4 %s\n' "$(date +%s)"
          python3 morphhdl/scripts/test-increment-59f-source-scope.py
          printf '59I_AUDIT_END 24 dd5a6e7404b77d8daebcdd3ef1f6a7972cf9b76355ea229e213735ec95f525c4 %s\n' "$(date +%s)"
          printf '59I_AUDIT_BEGIN 25 0e22139f0677ce2694b45a54b65b23ec91730217938e9ea2139bd16930fe56d3 %s\n' "$(date +%s)"
          python3 morphhdl/scripts/test-increment-59c-inherited-source-scope.py
          printf '59I_AUDIT_END 25 0e22139f0677ce2694b45a54b65b23ec91730217938e9ea2139bd16930fe56d3 %s\n' "$(date +%s)"
          printf '59I_AUDIT_BEGIN 26 98402ff1e0f1b14b0200b14d3d32d005bf71d3ade79debcf4c92c5383a1943e6 %s\n' "$(date +%s)"
          python3 morphhdl/scripts/check-increment-60f-artifacts.py self-test
          printf '59I_AUDIT_END 26 98402ff1e0f1b14b0200b14d3d32d005bf71d3ade79debcf4c92c5383a1943e6 %s\n' "$(date +%s)"
        } 2>&1 | tee "$out/source-audits.log"
    - name: Require unchanged source and write a complete shard receipt
      shell: bash
      env:
        AUDIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        AUDIT_SHARD: ${{ matrix.shard }}
      run: |
        set -euo pipefail
        python3 morphhdl/scripts/check-increment-59i-production-successor.py
        python3 -B morphhdl/scripts/check-increment-59i-audit-shards.py record \
          --directory "$GITHUB_WORKSPACE/target/increment-59i-rollout-composition" \
          --head "$AUDIT_HEAD" --shard "$AUDIT_SHARD"
    - name: Upload exact composition evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: increment-59i-inherited-source-qualification-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
        path: target/increment-59i-rollout-composition
        if-no-files-found: error
        retention-days: 21
    name: inherited source (${{ matrix.shard }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard:
        - composition
        - 59h
        - wa07b
        - 60f
        - 59f-59c
  complete:
    name: source
    needs:
    - source
    if: always() && (github.event_name != 'pull_request' || github.head_ref == 'agent/increment-59i-combined-reduction-closure')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      FEATURE_PARENT: ee2e7f2613e54f23158ce1eacae6028409a91ed6
      TARGET_PARENT: 2ebaa2ef5561eab35aa0ba9caced5c5a314d59f6
    steps:
    - name: Require successful completion of every matrix job
      shell: bash
      env:
        SHARD_RESULT: ${{ needs.source.result }}
      run: |
        set -euo pipefail
        test "$SHARD_RESULT" = success
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        pattern: increment-59i-inherited-source-qualification-shard-*
        path: ${{ runner.temp }}/59i-audit-shards
    - name: Authenticate the exact head and all command receipts
      shell: bash
      env:
        AUDIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/target/increment-59i-rollout-composition"
        python3 morphhdl/scripts/check-increment-59i-production-successor.py
        python3 -B morphhdl/scripts/check-increment-59i-audit-shards.py aggregate \
          --directory "$RUNNER_TEMP/59i-audit-shards" --head "$AUDIT_HEAD" \
          --output "$GITHUB_WORKSPACE/target/increment-59i-rollout-composition/shards.json"
    - name: Verify merged PR189 source synchronization
      shell: bash
      run: python3 -B morphhdl/scripts/test-increment-59i-pr189-sync.py
    - name: Validate immutable native source reviews at both exact parents
      shell: bash
      run: |
        set -euo pipefail
        out="$GITHUB_WORKSPACE/target/increment-59i-rollout-composition"
        feature_native=/tmp/59i-rollout-native-feature
        target_native=/tmp/59i-rollout-native-target
        rm -rf "$feature_native" "$target_native"
        cleanup_native_worktrees() {
          git worktree remove --force "$feature_native" >/dev/null 2>&1 || true
          git worktree remove --force "$target_native" >/dev/null 2>&1 || true
        }
        trap cleanup_native_worktrees EXIT
        git worktree add --detach "$feature_native" "$FEATURE_PARENT"
        git worktree add --detach "$target_native" "$TARGET_PARENT"
        (cd "$feature_native" && python3 morphhdl/scripts/check-native-source-preservation.py) \
          | tee "$out/native-feature-parent.log"
        (cd "$feature_native" && python3 morphhdl/scripts/check-typed-native-source-overlay.py) \
          | tee "$out/overlay-feature-parent.log"
        (cd "$target_native" && python3 morphhdl/scripts/check-native-source-preservation.py) \
          | tee "$out/native-target-parent.log"
        (cd "$target_native" && python3 morphhdl/scripts/check-typed-native-source-overlay.py) \
          | tee "$out/overlay-target-parent.log"
        cleanup_native_worktrees
        trap - EXIT
    - name: Upload exact composition evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: increment-59i-inherited-source-qualification-attempt-${{ github.run_attempt }}
        path: target/increment-59i-rollout-composition
        if-no-files-found: error
        retention-days: 21

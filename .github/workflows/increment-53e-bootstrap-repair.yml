name: Increment 53e bootstrap selector repair

on:
  push:
    branches:
      - agent/increment-53e-streamfifo-cc-parameterization

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-streamfifo-cc-parameterization
          fetch-depth: 0

      - name: Replace the brittle operator-case selector
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/increment-53e-bootstrap-v2.yml')
          value = path.read_text()
          old = '''          assignment_case_marker = ''' + "'''" + '''        case Apply(Select(left, operatorName), List(right))
              if Set("^", "===", "=/=").contains(decoded(operatorName)) =>
          ''' + "'''" + '''
          assignment_case = ''' + "'''" + '''        case Apply(Select(target, operatorName), List(source))
              if inNativeStreamFifo && decoded(operatorName) == ":=" =>
            rewriteNativeAssignment(tree, target, source)
          ''' + "'''" + '''
          rewrite_expression = plugin.index('    private def rewriteExpression(')
          assignment_at = plugin.index(assignment_case_marker, rewrite_expression)
          plugin = plugin[:assignment_at] + assignment_case + plugin[assignment_at:]
'''
          new = '''          assignment_case = ''' + "'''" + '''        case Apply(Select(target, operatorName), List(source))
              if inNativeStreamFifo && decoded(operatorName) == ":=" =>
            rewriteNativeAssignment(tree, target, source)
          ''' + "'''" + '''
          rewrite_expression = plugin.index('    private def rewriteExpression(')
          tree_match_marker = '      tree match {\\n'
          tree_match = plugin.index(tree_match_marker, rewrite_expression) + len(tree_match_marker)
          plugin = plugin[:tree_match] + assignment_case + plugin[tree_match:]
'''
          count = value.count(old)
          if count != 1:
              raise SystemExit(f'expected one brittle selector block, found {count}')
          path.write_text(value.replace(old, new, 1))
          PY

      - name: Publish repaired bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/increment-53e-bootstrap-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/increment-53e-bootstrap-v2.yml .github/workflows/increment-53e-bootstrap-repair.yml
          git diff --cached --check
          git commit -m 'Increment 53e: make assignment selector source-version independent'
          git push origin HEAD:agent/increment-53e-streamfifo-cc-parameterization

name: Increment 53e generic SpinalHDL continuation

on:
  push:
    branches:
      - agent/increment-53e-generic-spinalhdl-proof

permissions:
  contents: write

concurrency:
  group: increment-53e-generic-spinalhdl-proof
  cancel-in-progress: false

jobs:
  materialize-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    timeout-minutes: 240
    env:
      MORPHDL_RUN_STREAMFIFOCC_PROOF: "1"
      MORPHDL_STREAMFIFOCC_PROOF_WORKSPACE: /tmp/increment-53e-proof
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-generic-spinalhdl-proof
          fetch-depth: 0

      - name: Prepare stable checkout
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin parameterized-verilog agent/increment-53e-generic-spinalhdl-proof
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/increment-53e-generic-spinalhdl-proof)"
          git merge --no-edit origin/parameterized-verilog

      - name: Materialize generic native-parameter support
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            morphhdl/scripts/apply-increment-53e-address-role-repair.py
            morphhdl/scripts/apply-increment-53e-implicit-child-width-formals.py
            morphhdl/scripts/apply-increment-53e-canonical-implicit-formal-identity.py
            morphhdl/scripts/apply-increment-53e-modular-literal-proof.py
            morphhdl/scripts/apply-increment-53e-materialized-auto-resize-proof.py
            morphhdl/scripts/apply-increment-53e-unfixed-literal-width-inference.py
            morphhdl/scripts/apply-increment-53e-full-domain-width-equivalence.py
            morphhdl/scripts/apply-increment-53e-generic-retained-domain-v2.py
            morphhdl/scripts/apply-increment-53e-generic-retained-domain-v4.py
            morphhdl/scripts/apply-increment-53e-generic-root-schema-equivalence.py
            morphhdl/scripts/apply-increment-53e-generic-retained-expression-evaluator.py
            morphhdl/scripts/apply-increment-53e-generic-native-runtime-selection.py
            morphhdl/scripts/apply-increment-53e-generic-native-compiler-selection.py
            morphhdl/scripts/apply-increment-53e-generic-comment-cleanup.py
            morphhdl/scripts/apply-increment-53e-proof-command-helper.py
            morphhdl/scripts/apply-increment-53e-proof-api-alignment.py
            morphhdl/scripts/apply-increment-53e-proof-api-alignment-v2.py
          )
          for script in "${scripts[@]}"; do
            if test -f "$script"; then
              echo "Applying $script"
              python3 "$script"
            fi
          done
          git diff --check

      - name: Enforce reusable genericity and native-source preservation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only origin/parameterized-verilog -- core/src/main lib/src/main idslplugin/src/main)"
          if test -x morphhdl/scripts/check-increment-53e-generic-production.sh; then
            morphhdl/scripts/check-increment-53e-generic-production.sh
          else
            bash morphhdl/scripts/check-increment-53e-generic-production.sh
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          engine_paths = [
              Path('morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala'),
              Path('morphruntime/src/main/scala/spinal/core/ExternalNativeIntCompilerRuntime.scala'),
              Path('morphruntime/src/main/scala/spinal/core/ExternalNativeIntShadowRegistry.scala'),
              Path('morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedDomainEquivalence.scala'),
              Path('morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala'),
              Path('morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogHierarchy.scala'),
              Path('morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogMemories.scala'),
          ]
          forbidden = re.compile(
              r'(?<![A-Za-z0-9_])(?:StreamFifoCC|StreamFifo|BufferCC|pushToPopGray|popToPushGray)(?![A-Za-z0-9_])'
              r'|/lib/src/main/scala/spinal/lib/(?:Stream|CrossClock)\.scala'
          )
          failures = []
          for path in engine_paths:
              if not path.exists():
                  raise SystemExit(f'missing reusable engine source: {path}')
              text = path.read_text()
              text = re.sub(r'/\*.*?\*/', '', text, flags=re.S)
              text = re.sub(r'//.*', '', text)
              if forbidden.search(text):
                  failures.append(str(path))
          if failures:
              raise SystemExit('component-specific recognition remains in reusable production code:\n' + '\n'.join(failures))
          plugin = engine_paths[0].read_text()
          if '/lib/src/main/scala/spinal/' not in plugin or '/core/src/main/scala/spinal/' not in plugin:
              raise SystemExit('compiler plugin is not enabled generically for native SpinalHDL core/lib sources')
          if 'RetainedWidthExpressionParser' not in engine_paths[4].read_text():
              raise SystemExit('generic retained-width parser is missing')
          PY
          grep -R --line-number --fixed-strings 'new spinal.lib.StreamFifoCC' \
            morphhdl/src/test/scala/morphhdl/NativeStreamFifoCC*.scala

      - name: Install pinned Mill
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            -o /tmp/mill
          chmod +x /tmp/mill

      - name: Compile complete test corpus on both Scala lanes
        shell: bash
        run: |
          set -euo pipefail
          /tmp/mill 'morph[2.12.18].test.compile' 2>&1 | tee /tmp/53e-compile-2.12.log
          /tmp/mill 'morph[2.13.12].test.compile' 2>&1 | tee /tmp/53e-compile-2.13.log

      - name: Run generic and native contract tests on Scala 2.12.18
        shell: bash
        run: |
          set -euo pipefail
          /tmp/mill 'morph[2.12.18].testOnly' \
            morphhdl.GenericImplicitPackedShapeTests \
            morphhdl.GenericAutoResizeWidthTests \
            morphhdl.GenericFullDomainWidthEquivalenceTests \
            spinal.core.internals.ExternalParameterizedDomainEquivalenceTests \
            morphhdl.ParameterizedStreamFifoCCTests \
            2>&1 | tee /tmp/53e-contract-2.12.log

      - name: Run generic and native contract tests on Scala 2.13.12
        shell: bash
        run: |
          set -euo pipefail
          /tmp/mill 'morph[2.13.12].testOnly' \
            morphhdl.GenericImplicitPackedShapeTests \
            morphhdl.GenericAutoResizeWidthTests \
            morphhdl.GenericFullDomainWidthEquivalenceTests \
            spinal.core.internals.ExternalParameterizedDomainEquivalenceTests \
            morphhdl.ParameterizedStreamFifoCCTests \
            2>&1 | tee /tmp/53e-contract-2.13.log

      - name: Run independent-clock simulation, synthesis and formal proof on Scala 2.12.18
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/increment-53e-proof && mkdir -p /tmp/increment-53e-proof
          if test -f morphhdl/src/test/scala/morphhdl/NativeStreamFifoCCProofTests.scala; then
            /tmp/mill 'morph[2.12.18].testOnly' morphhdl.NativeStreamFifoCCProofTests
          else
            /tmp/mill 'morph[2.12.18].testOnly' \
              morphhdl.NativeStreamFifoCCImplementationProofTests \
              morphhdl.NativeStreamFifoCCFormalEquivalenceTests
          fi 2>&1 | tee /tmp/53e-proof-2.12.log

      - name: Run independent-clock simulation, synthesis and formal proof on Scala 2.13.12
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/increment-53e-proof && mkdir -p /tmp/increment-53e-proof
          if test -f morphhdl/src/test/scala/morphhdl/NativeStreamFifoCCProofTests.scala; then
            /tmp/mill 'morph[2.13.12].testOnly' morphhdl.NativeStreamFifoCCProofTests
          else
            /tmp/mill 'morph[2.13.12].testOnly' \
              morphhdl.NativeStreamFifoCCImplementationProofTests \
              morphhdl.NativeStreamFifoCCFormalEquivalenceTests
          fi 2>&1 | tee /tmp/53e-proof-2.13.log

      - name: Publish only a fully passing materialization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/morphhdl/parameterized-verilog-todo.md')
          text = path.read_text()
          opened = '- [ ] **Increment 53e — Native StreamFifoCC parameterization without source edits**'
          closed = '- [x] **Increment 53e — Native StreamFifoCC parameterization without source edits**'
          if closed not in text:
              if text.count(opened) != 1:
                  raise SystemExit('Increment 53e roadmap marker is missing or ambiguous')
              path.write_text(text.replace(opened, closed, 1))
          PY
          rm -rf morphhdl/diagnostics .morphhdl
          rm -f morphhdl/scripts/apply-increment-53e-*.py
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only origin/parameterized-verilog -- core/src/main lib/src/main idslplugin/src/main)"
          git commit -m 'Increment 53e: generic native StreamFifoCC parameterization'
          git push origin HEAD:agent/increment-53e-generic-spinalhdl-proof

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53e-generic-spinalhdl-continuation-evidence
          path: |
            /tmp/53e-compile-2.12.log
            /tmp/53e-compile-2.13.log
            /tmp/53e-contract-2.12.log
            /tmp/53e-contract-2.13.log
            /tmp/53e-proof-2.12.log
            /tmp/53e-proof-2.13.log
          if-no-files-found: ignore

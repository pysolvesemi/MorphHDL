@functools.lru_cache(maxsize=8)
def _wa08_review_cached(root_text: str, head: str):
    root = Path(root_text)
    path = root / "morphhdl/scripts/check-wa08-inherited-source-overlay.py"
    if not (path.exists() or path.is_symlink()):
        return None
    require(path.is_file() and not path.is_symlink(), "missing regular WA-08 overlay reviewer")
    spec = importlib.util.spec_from_file_location("wa08_inherited_overlay", path)
    require(spec is not None and spec.loader is not None, "cannot import WA-08 overlay reviewer")

name: Roadmap parallel dependency fix

on:
  push:
    branches:
      - agent/roadmap-parallel-dependencies

permissions:
  contents: write

jobs:
  fix-roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/roadmap-parallel-dependencies
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Correct final closure range
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/morphhdl/parameterized-verilog-todo.md')
          text = path.read_text()
          replacements = {
              'remain composable with that later API. Prove that literal `Mem(..., 5)`\n  remains concrete,\n  `Mem(..., DEPTH)` emits `[0:DEPTH-1]`,':
                  'remain composable with that later API. Prove that literal `Mem(..., 5)`\n  remains concrete, while `Mem(..., DEPTH)` emits `[0:DEPTH-1]`,',
              'gates for Increments 29 through 53.':
                  'gates for Increments 29 through 54.',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one match for {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm -- .github/workflows/roadmap-parallel-dependency-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/morphhdl/parameterized-verilog-todo.md .github/workflows/roadmap-parallel-dependency-fix.yml
          git commit -m 'docs: complete parallel dependency closure'
          git push origin HEAD:agent/roadmap-parallel-dependencies

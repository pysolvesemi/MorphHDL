name: Increment 43 bootstrap

on:
  push:
    branches:
      - agent/increment-43-native-memory-reuse
    paths:
      - .github/workflows/increment-43-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: increment-43-bootstrap
  cancel-in-progress: false

jobs:
  implement:
    name: Apply Increment 43 implementation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/spinalhdl/docker:latest
    steps:
      - name: Check out exact Increment 43 branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-43-native-memory-reuse
          fetch-depth: 0

      - name: Apply, approve and publish Increment 43 source
        shell: bash
        run: python3 morphhdl/scripts/increment-43-bootstrap.py

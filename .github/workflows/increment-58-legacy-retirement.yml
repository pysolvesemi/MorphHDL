name: Increment 58 legacy adapter and shadow-path retirement

on:
  push:
    branches:
      - parameterized-verilog
      - 'agent/increment-58-*'
  pull_request:
    branches:
      - parameterized-verilog

permissions:
  contents: read

concurrency:
  group: increment-58-legacy-retirement-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Route exact Increment 58 revision
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.route.outputs.run }}
      base: ${{ steps.route.outputs.base }}
    steps:
      - name: Check out exact head with complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Select the immutable comparison base
        id: route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          run=false
          base=''
          workflow=.github/workflows/increment-58-legacy-retirement.yml

          if [[ "$EVENT_NAME" == pull_request ]]; then
            if ! git cat-file -e "$PR_BASE:$workflow" 2>/dev/null; then
              base="$PR_BASE"
              run=true
            fi
          elif [[ "$EVENT_NAME" == push && "$REF_NAME" == agent/increment-58-* ]]; then
            git fetch --no-tags origin parameterized-verilog
            base="$(git rev-parse origin/parameterized-verilog)"
            git merge-base --is-ancestor "$base" HEAD
            run=true
          elif [[ "$EVENT_NAME" == push && "$REF_NAME" == parameterized-verilog ]]; then
            if [[ ! "$BEFORE" =~ ^[0-9a-f]{40}$ || "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
              printf '%s\n' 'parameterized-verilog push has no immutable prior revision' >&2
              exit 1
            fi
            if ! git cat-file -e "$BEFORE:$workflow" 2>/dev/null; then
              base="$BEFORE"
              run=true
            fi
          fi

          if [[ "$run" == true ]]; then
            test -n "$base"
            test "$(git rev-parse --verify "$base^{commit}")" = "$base"
            git merge-base --is-ancestor "$base" HEAD
          fi
          printf 'run=%s\n' "$run" >> "$GITHUB_OUTPUT"
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"

  source-contract:
    name: Retirement boundaries and exact source contract
    needs: route
    if: needs.route.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact head with complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate Increment 58 and inherited retirement boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -s morphhdl/contracts/increment-58-retirement.contract
          test -f morphhdl/scripts/check-increment-58-retirement.py
          python3 -m py_compile \
            morphhdl/scripts/check-increment-58-retirement.py \
            morphhdl/scripts/check-production-retirement.py \
            morphhdl/scripts/check-typed-layering-ir.py \
            morphhdl/scripts/check-native-source-preservation.py \
            morphhdl/scripts/check-typed-native-source-overlay.py
          python3 morphhdl/scripts/check-increment-58-retirement.py --self-test
          python3 morphhdl/scripts/check-increment-58-retirement.py
          python3 morphhdl/scripts/check-production-retirement.py --self-test
          python3 morphhdl/scripts/check-production-retirement.py
          python3 morphhdl/scripts/check-typed-layering-ir.py --self-test
          python3 morphhdl/scripts/check-typed-layering-ir.py
          python3 morphhdl/scripts/check-native-source-preservation.py --self-test
          python3 morphhdl/scripts/check-native-source-preservation.py
          python3 morphhdl/scripts/check-typed-native-source-overlay.py --self-test
          python3 morphhdl/scripts/check-typed-native-source-overlay.py

          test -x morphhdl/scripts/check-native-typed-library-surface-boundary.sh
          bash -n morphhdl/scripts/check-native-typed-library-surface-boundary.sh
          bash morphhdl/scripts/check-native-typed-library-surface-boundary.sh --self-test
          bash morphhdl/scripts/check-native-typed-library-surface-boundary.sh

          test -x morphhdl/scripts/check-broad-native-library-migration-boundary.sh
          bash -n morphhdl/scripts/check-broad-native-library-migration-boundary.sh
          bash morphhdl/scripts/check-broad-native-library-migration-boundary.sh --self-test
          bash morphhdl/scripts/check-broad-native-library-migration-boundary.sh --check

          test -x morphhdl/scripts/check-native-streamfifocc-boundary.sh
          bash -n morphhdl/scripts/check-native-streamfifocc-boundary.sh
          bash morphhdl/scripts/check-native-streamfifocc-boundary.sh --self-test
          bash morphhdl/scripts/check-native-streamfifocc-boundary.sh --check

          test -x morphhdl/scripts/check-native-streamfifocc-width-formal-boundary.sh
          bash -n morphhdl/scripts/check-native-streamfifocc-width-formal-boundary.sh
          bash morphhdl/scripts/check-native-streamfifocc-width-formal-boundary.sh --self-test
          bash morphhdl/scripts/check-native-streamfifocc-width-formal-boundary.sh --check

          inherited_boundaries=(
            morphhdl/scripts/check-native-int-shadow-provenance-boundary.sh
            morphhdl/scripts/check-native-int-shadow-expression-boundary.sh
            morphhdl/scripts/check-native-int-symbolic-conditional-boundary.sh
            morphhdl/scripts/check-native-int-nested-control-flow-boundary.sh
            morphhdl/scripts/check-external-formalization-boundary.sh
            morphhdl/scripts/check-typed-primitive-closure-boundary.sh
            morphhdl/scripts/check-external-memory-boundary.sh
            morphhdl/scripts/check-native-stream-width-adapter-boundary.sh
            morphhdl/scripts/check-native-streamfifo-structure-boundary.sh
            morphhdl/scripts/check-typed-vec-boundary.sh
            morphhdl/scripts/check-external-structural-process-boundary.sh
          )
          for boundary in "${inherited_boundaries[@]}"; do
            test -f "$boundary"
            bash -n "$boundary"
            bash "$boundary"
          done

      - name: Validate the read-only pass adapter boundary
        shell: bash
        run: |
          set -euo pipefail
          bash -n morphhdl-passes/scripts/test-boundary-guard.sh
          bash morphhdl-passes/scripts/test-boundary-guard.sh
          python3 -m py_compile \
            morphhdl-passes/scripts/check-wa02-adapter-boundary.py \
            morphhdl-passes/scripts/check-wa03-gates.py
          python3 morphhdl-passes/scripts/check-wa02-adapter-boundary.py --self-test
          python3 morphhdl-passes/scripts/check-wa02-adapter-boundary.py
          python3 morphhdl-passes/scripts/check-wa03-gates.py --self-test
          python3 morphhdl-passes/scripts/check-wa03-gates.py

      - name: Verify the sealed exact Increment 58 delta
        shell: bash
        env:
          BASE_COMMIT: ${{ needs.route.outputs.base }}
        run: |
          set -euo pipefail
          scope=morphhdl/contracts/increment-58-source-scope.txt
          sentinel='# INCREMENT-58-SOURCE-SCOPE-UNSEALED'
          todo=docs/morphhdl/parameterized-verilog-todo.md
          test -s "$scope"
          if grep -Fqx "$sentinel" "$scope"; then
            printf '%s\n' 'Increment 58 source scope is not sealed' >&2
            exit 1
          fi
          test "$(cat "$scope")" = "$(LC_ALL=C sort -u "$scope")"
          if grep -Eq '^[[:space:]]*$|^#|^/' "$scope"; then
            printf '%s\n' \
              'Increment 58 source scope must contain only repository-relative paths' >&2
            exit 1
          fi
          while IFS= read -r path; do
            test -e "$path"
          done < "$scope"
          test "$(grep -Ec '^- \[( |x)\] \*\*Increment 58 — Legacy adapter and shadow-path retirement\*\*$' "$todo")" = 1
          grep -Fqx '  **Dependencies:** Increment 57b implemented and merged.' "$todo"

          base="$BASE_COMMIT"
          test -n "$base"
          test "$(git rev-parse --verify "$base^{commit}")" = "$base"
          git merge-base --is-ancestor "$base" HEAD
          TODO_PATH="$todo" python3 - <<'PY'
          import os
          import subprocess

          base = os.environ["BASE_COMMIT"]
          path = os.environ["TODO_PATH"]
          unchecked = "- [ ] **Increment 58 — Legacy adapter and shadow-path retirement**"
          checked = unchecked.replace("[ ]", "[x]", 1)

          def blob(revision):
              return subprocess.run(
                  ["git", "show", f"{revision}:{path}"],
                  check=True,
                  stdout=subprocess.PIPE,
                  text=True,
              ).stdout

          before = blob(base)
          after = blob("HEAD")
          if before.count(unchecked) != 1 or before.count(checked) != 0:
              raise SystemExit("base roadmap does not contain exactly one unchecked Increment 58")
          expected_checked = before.replace(unchecked, checked, 1)
          if after not in (before, expected_checked):
              raise SystemExit(
                  "roadmap delta must be empty or exactly the Increment 58 checkbox transition"
              )
          PY

          actual="$(git diff --no-renames --name-only --diff-filter=ACMRTD \
            "$base"...HEAD \
            | awk '$0 != "docs/morphhdl/parameterized-verilog-todo.md"' \
            | LC_ALL=C sort -u)"
          expected="$(cat "$scope")"
          if [[ "$actual" != "$expected" ]]; then
            printf '%s\n' 'Unexpected Increment 58 file inventory' >&2
            printf '%s\n' '--- expected ---' "$expected" >&2
            printf '%s\n' '--- actual ---' "$actual" >&2
            exit 1
          fi
          git diff --check "$base"...HEAD

  focused-handoff:
    name: Focused typed handoff Scala ${{ matrix.scala_version }}
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Test canonical handoff schema and native pre-emission publication
        run: |
          sbt -batch "++${{ matrix.scala_version }}" \
            "morphir/testOnly morphhdl.ir.v1.CanonicalIrHandoffSpec"
          sbt -batch "++${{ matrix.scala_version }}" \
            "morph/testOnly morphhdl.MorphCanonicalIrHandoffTests"

      - name: Test the standalone read-only adapter and safety contracts
        working-directory: morphhdl-passes
        run: >-
          sbt -batch "++${{ matrix.scala_version }}"
          "testOnly morphhdl.passes.adapter.CanonicalIrPassAdapterSpec morphhdl.passes.api.PassContractsSpec morphhdl.passes.safety.WireAliasSafetyGateSpec"

  compatibility:
    name: Binary source and concrete parity Scala ${{ matrix.scala_version }}
    needs:
      - route
      - source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - name: Check out exact head with complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Prove JVM compatibility with the selected upstream baseline
        run: >-
          bash morphhdl/scripts/check-binary-compatibility.sh
          --scala-version "${{ matrix.scala_version }}"

      - name: Prove MorphHDL report ABI against the exact prior increment
        shell: bash
        env:
          BASE_COMMIT: ${{ needs.route.outputs.base }}
          SCALA_VERSION: ${{ matrix.scala_version }}
        run: |
          set -euo pipefail
          test -n "$BASE_COMMIT"
          test "$(git rev-parse --verify "$BASE_COMMIT^{commit}")" = "$BASE_COMMIT"
          compatibility_root="$(mktemp -d /tmp/morphhdl-report-abi.XXXXXX)"
          baseline_root="$compatibility_root/baseline"
          cleanup() {
            status=$?
            git worktree remove --force "$baseline_root" >/dev/null 2>&1 || true
            rm -rf -- "$compatibility_root"
            return "$status"
          }
          trap cleanup EXIT
          git worktree add --quiet --detach "$baseline_root" "$BASE_COMMIT"

          (
            cd "$baseline_root"
            sbt -batch "++$SCALA_VERSION" "morph / Compile / packageBin"
          )
          sbt -batch "++$SCALA_VERSION" "morph / Compile / packageBin"

          scala_binary="${SCALA_VERSION%.*}"
          artifact() {
            root=$1
            mapfile -t candidates < <(find \
              "$root/morphhdl/target/scala-$scala_binary" \
              -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-tests.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
              | LC_ALL=C sort)
            test "${#candidates[@]}" = 1
            printf '%s\n' "${candidates[0]}"
          }
          baseline_jar="$(artifact "$baseline_root")"
          current_jar="$(artifact "$GITHUB_WORKSPACE")"
          python3 morphhdl/scripts/check-jvm-binary-compatibility.py \
            --label "morph-report-$SCALA_VERSION" \
            --baseline "$baseline_jar" \
            --current "$current_jar"

      - name: Prove source linkage and ordinary SpinalVerilog parity
        run: >-
          bash morphhdl/scripts/check-concrete-spinalverilog-parity.sh
          --scala "${{ matrix.scala_version }}"

      - name: Prove the external inspection boundary against Increment 0
        run: >-
          bash morphhdl/scripts/check-external-spinal-boundary.sh
          "${{ matrix.scala_version }}"

  sbt-full:
    name: SBT full suite and fresh JAR closure Scala ${{ matrix.scala_version }}
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Compile every production and test source
        run: sbt -batch "++${{ matrix.scala_version }}" compile Test/compile

      - name: Run frontend canonical IR MorphHDL and native simulation suites
        run: |
          sbt -batch "++${{ matrix.scala_version }}" frontend/test
          sbt -batch "++${{ matrix.scala_version }}" morphir/test
          sbt -batch "++${{ matrix.scala_version }}" morph/test
          sbt -batch "++${{ matrix.scala_version }}" \
            "tester/testOnly spinal.lib.CounterTester spinal.lib.SpinalSimStreamFifoTester spinal.lib.SpinalSimStreamFifoCCTester spinal.lib.SpinalSimStreamWidthAdapterTester"

      - name: Package fresh production modules and enforce JAR retirement
        shell: bash
        run: |
          set -euo pipefail
          sbt -batch "++${{ matrix.scala_version }}" clean \
            frontend/package idslplugin/package morphir/package paramrtl/package \
            morphruntime/package morphplugin/package morph/package verilogBackend/package
          (
            cd morphhdl-passes
            sbt -batch "++${{ matrix.scala_version }}" clean package
          )
          mapfile -t jars < <(find \
            frontend idslplugin morphir paramrtl morphruntime morphplugin morphhdl \
            backends/verilog morphhdl-passes \
            -regextype posix-extended -type f \
            -regex '.*/target/scala-[^/]+/[^/]+\.jar' | LC_ALL=C sort -u)
          test "${#jars[@]}" -ge 9
          arguments=()
          for jar in "${jars[@]}"; do
            arguments+=(--jar "$jar")
          done
          python3 morphhdl/scripts/check-increment-58-retirement.py \
            --require-jar "${arguments[@]}"
          python3 morphhdl/scripts/check-production-retirement.py \
            --require-jar "${arguments[@]}"
          python3 morphhdl/scripts/check-typed-layering-ir.py \
            --require-jar "${arguments[@]}"

  mill-full:
    name: Mill affected full suite Scala ${{ matrix.scala_version }}
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Mill
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/mill
          chmod +x /tmp/mill

      - name: Compile and test all affected modules
        run: |
          /tmp/mill \
            core[${{ matrix.scala_version }}].compile \
            frontend[${{ matrix.scala_version }}].compile \
            morphir[${{ matrix.scala_version }}].compile \
            paramrtl[${{ matrix.scala_version }}].compile \
            morphruntime[${{ matrix.scala_version }}].compile \
            morph[${{ matrix.scala_version }}].compile \
            verilogBackend[${{ matrix.scala_version }}].compile
          /tmp/mill frontend[${{ matrix.scala_version }}].test
          /tmp/mill morphir[${{ matrix.scala_version }}].test
          /tmp/mill morph[${{ matrix.scala_version }}].test
          /tmp/mill tester[${{ matrix.scala_version }}].testOnly \
            spinal.lib.CounterTester \
            spinal.lib.SpinalSimStreamFifoTester \
            spinal.lib.SpinalSimStreamFifoCCTester \
            spinal.lib.SpinalSimStreamWidthAdapterTester

  v2001-and-formal:
    name: Strict V2001 and inherited formal gates Scala ${{ matrix.scala_version }}
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
      MORPHDL_RUN_STREAMFIFOCC_CDC_PROOF: '1'
      MORPHDL_RUN_TYPED_VEC_FORMAL_EQUIVALENCE: '1'
      MORPHDL_RUN_TYPED_PRIMITIVE_CLOSURE_FORMAL_EQUIVALENCE: '1'
      MORPHDL_RUN_STREAMFIFO_FORMAL_EQUIVALENCE: '1'
      MORPHDL_RUN_NATIVE_LIBRARY_MIGRATION_FORMAL_EQUIVALENCE: '1'
      MORPHDL_RUN_NATIVE_AXI4_FORMAL_EQUIVALENCE: '1'
      MORPHDL_STREAMFIFOCC_CDC_WORKSPACE: ${{ github.workspace }}/formal-artifacts/scala-${{ matrix.scala_version }}/streamfifocc-cdc
      MORPHDL_TYPED_VEC_FORMAL_WORKSPACE: ${{ github.workspace }}/formal-artifacts/scala-${{ matrix.scala_version }}/vec
      MORPHDL_TYPED_PRIMITIVE_FORMAL_WORKSPACE: ${{ github.workspace }}/formal-artifacts/scala-${{ matrix.scala_version }}/closure
      MORPHDL_STREAMFIFO_FORMAL_WORKSPACE: ${{ github.workspace }}/formal-artifacts/scala-${{ matrix.scala_version }}/streamfifo
      MORPHDL_NATIVE_LIBRARY_MIGRATION_FORMAL_WORKSPACE: ${{ github.workspace }}/formal-artifacts/scala-${{ matrix.scala_version }}/library-migration
      MORPHDL_NATIVE_AXI4_FORMAL_WORKSPACE: ${{ github.workspace }}/formal-artifacts/scala-${{ matrix.scala_version }}/axi4
      MORPHDL_NATIVE_AXI4_ARTIFACT_DIR: ${{ github.workspace }}/formal-artifacts/scala-${{ matrix.scala_version }}/axi4-rtl
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Verify strict and formal toolchains
        shell: bash
        run: |
          set -euo pipefail
          command -v verilator
          command -v iverilog
          command -v vvp
          command -v yosys
          command -v sby
          command -v yices-smt2
          command -v ghdl
          verilator --version
          iverilog -V
          ghdl --version
          yosys_version="$(yosys -V)"
          grep -Eq '^Yosys 0\.41([ +]|$)' <<<"$yosys_version"
          sby_help="$(sby -h 2>&1)"
          grep -q 'usage: sby' <<<"$sby_help"
          yosys -Q -p 'help abc' >/tmp/morphhdl-yosys-abc-help.txt 2>&1
          grep -q ABC /tmp/morphhdl-yosys-abc-help.txt

      - name: Run strict Verilog-2001 lint simulation synthesis and typed RTL contracts
        run: |
          mkdir -p target/morphhdl/phase-inventory
          mkdir -p target/morphhdl/generated-contracts
          mkdir -p "${MORPHDL_NATIVE_AXI4_ARTIFACT_DIR}"
          mkdir -p "${MORPHDL_STREAMFIFOCC_CDC_WORKSPACE}"
          sbt -batch "++${{ matrix.scala_version }}" \
            "core/Test/runMain spinal.core.internals.ValidationParityInventoryWriter --output ${GITHUB_WORKSPACE}/target/morphhdl/phase-inventory/validation-phase-ids.txt"
          sbt -batch "++${{ matrix.scala_version }}" \
            "morph/Test/runMain morphhdl.MorphContractFixtureGenerator --output-dir ${GITHUB_WORKSPACE}/target/morphhdl/generated-contracts"
          bash morphhdl/scripts/check-contracts.sh \
            --require-tools \
            --generated-dir target/morphhdl/generated-contracts \
            --live-phase-ids target/morphhdl/phase-inventory/validation-phase-ids.txt
          sbt -batch "++${{ matrix.scala_version }}" \
            "morph/testOnly morphhdl.MorphCanonicalIrHandoffTests morphhdl.NativeStreamFifoCCParameterizedTests morphhdl.NativeStreamFifoCCCdcProofTests morphhdl.NativeLibraryMigrationTests morphhdl.NativeAxi4SlaveFactoryParameterizedOffsetTests morphhdl.ExternalHierarchyBoolLiteralBindingTests morphhdl.NativeTypedLibraryCallSurfaceTests spinal.core.TypedPrimitiveClosureTests morphhdl.TypedParameterizedVecTests morphhdl.NativeLibraryReuseTests"

      - name: Validate representative bus RTL with strict Verilog-2001 tools
        shell: bash
        run: |
          set -euo pipefail
          parameterized="${MORPHDL_NATIVE_AXI4_ARTIFACT_DIR}/native_axi4_parameterized.v"
          concrete64="${MORPHDL_NATIVE_AXI4_ARTIFACT_DIR}/native_axi4_concrete_top.v"
          concrete36="${MORPHDL_NATIVE_AXI4_ARTIFACT_DIR}/native_axi4_concrete_block.v"
          test -s "$parameterized"
          test -s "$concrete64"
          test -s "$concrete36"

          iverilog -g2001 -Wall -Wimplicit \
            -s NativeAxi4SlaveFactoryParameterizedTop \
            -o /tmp/native_axi4_parameterized_default.vvp \
            "$parameterized"
          iverilog -g2001 -Wall -Wimplicit \
            -P NativeAxi4SlaveFactoryParameterizedTop.OFFSET_WORD=20 \
            -s NativeAxi4SlaveFactoryParameterizedTop \
            -o /tmp/native_axi4_parameterized_offset_80.vvp \
            "$parameterized"
          iverilog -g2001 -Wall -Wimplicit \
            -s NativeConcreteAxi4SlaveFactoryTopOffset64 \
            -o /tmp/native_axi4_concrete_64.vvp \
            "$concrete64"
          iverilog -g2001 -Wall -Wimplicit \
            -s NativeConcreteAxi4SlaveFactoryTopOffset36 \
            -o /tmp/native_axi4_concrete_36.vvp \
            "$concrete36"

          verilator --lint-only --language 1364-2001 -Wall -Wno-fatal \
            --top-module NativeAxi4SlaveFactoryParameterizedTop \
            "$parameterized"
          verilator --lint-only --language 1364-2001 -Wall -Wno-fatal \
            -GOFFSET_WORD=20 \
            --top-module NativeAxi4SlaveFactoryParameterizedTop \
            "$parameterized"
          verilator --lint-only --language 1364-2001 -Wall -Wno-fatal \
            --top-module NativeConcreteAxi4SlaveFactoryTopOffset64 \
            "$concrete64"
          verilator --lint-only --language 1364-2001 -Wall -Wno-fatal \
            --top-module NativeConcreteAxi4SlaveFactoryTopOffset36 \
            "$concrete36"

          yosys -q -p "read_verilog -noautowire $parameterized; hierarchy -check -top NativeAxi4SlaveFactoryParameterizedTop; proc; opt; check -assert; synth -top NativeAxi4SlaveFactoryParameterizedTop; check -assert"
          yosys -q -p "read_verilog -noautowire $parameterized; chparam -set OFFSET_WORD 20 NativeAxi4SlaveFactoryParameterizedTop; hierarchy -check -top NativeAxi4SlaveFactoryParameterizedTop; proc; opt; check -assert; synth -top NativeAxi4SlaveFactoryParameterizedTop; check -assert"
          yosys -q -p "read_verilog -noautowire $concrete64; hierarchy -check -top NativeConcreteAxi4SlaveFactoryTopOffset64; proc; opt; check -assert; synth -top NativeConcreteAxi4SlaveFactoryTopOffset64; check -assert"
          yosys -q -p "read_verilog -noautowire $concrete36; hierarchy -check -top NativeConcreteAxi4SlaveFactoryTopOffset36; proc; opt; check -assert; synth -top NativeConcreteAxi4SlaveFactoryTopOffset36; check -assert"

      - name: Prove all inherited typed equivalence and live mutation controls
        run: |
          sbt -batch "++${{ matrix.scala_version }}" \
            "morph/testOnly morphhdl.NativeLibraryMigrationFormalEquivalenceTests morphhdl.NativeAxi4SlaveFactoryFormalEquivalenceTests morphhdl.TypedStreamWidthAdapterFormalEquivalenceTests morphhdl.TypedParameterizedVecFormalEquivalenceTests morphhdl.TypedPrimitiveClosureFormalEquivalenceTests morphhdl.NativeStreamFifoFormalEquivalenceTests"
          sbt -batch "++${{ matrix.scala_version }}" \
            "tester/testOnly spinal.lib.CounterFormalTester spinal.tester.scalatest.FormalFifoCCTester"

      - name: Retain proof statuses mutation counterexamples and strict RTL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-58-formal-scala-${{ matrix.scala_version }}
          path: formal-artifacts/scala-${{ matrix.scala_version }}
          if-no-files-found: error
          retention-days: 14

  streamfifocc-width-formal:
    name: Inherited Increment 57b StreamFifoCC proof rerun Scala ${{ matrix.scala_version }}
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
      MORPHDL_RUN_STREAMFIFOCC_FORMAL_EQUIVALENCE: '1'
      MORPHDL_STREAMFIFOCC_FORMAL_WORKSPACE: ${{ github.workspace }}/formal-artifacts/scala-${{ matrix.scala_version }}/streamfifocc-depth-width
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Verify StreamFifoCC proof toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v yosys
          command -v sby
          command -v yices-smt2
          yosys_version="$(yosys -V)"
          grep -Eq '^Yosys 0\.41([ +]|$)' <<<"$yosys_version"
          sby_help="$(sby -h 2>&1)"
          grep -q 'usage: sby' <<<"$sby_help"
          yosys -Q -p 'help abc' >/tmp/morphhdl-yosys-abc-help.txt 2>&1
          grep -q ABC /tmp/morphhdl-yosys-abc-help.txt

      - name: Rerun the inherited 64-case width depth reset and clock-ratio matrix
        run: |
          mkdir -p "${MORPHDL_STREAMFIFOCC_FORMAL_WORKSPACE}"
          sbt -batch "++${{ matrix.scala_version }}" \
            "morph/testOnly morphhdl.NativeStreamFifoCCFormalEquivalenceTests"

      - name: Retain inherited StreamFifoCC proof statuses and width-five counterexample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-58-streamfifocc-depth-width-scala-${{ matrix.scala_version }}
          path: formal-artifacts/scala-${{ matrix.scala_version }}/streamfifocc-depth-width
          if-no-files-found: error
          retention-days: 14

  determinism:
    name: Typed handoff and concrete determinism Scala ${{ matrix.scala_version }}
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Prove byte-identical handoff replay and concrete preservation
        run: |
          sbt -batch "++${{ matrix.scala_version }}" \
            'morph/testOnly morphhdl.MorphCanonicalIrHandoffTests morphhdl.NativeStreamFifoCCParameterizedTests morphhdl.NativeLibraryMigrationTests morphhdl.NativeAxi4SlaveFactoryParameterizedOffsetTests morphhdl.ExternalHierarchyBoolLiteralBindingTests morphhdl.NativeTypedLibraryCallSurfaceTests'
          sbt -batch "++${{ matrix.scala_version }}" \
            'morph/testOnly morphhdl.MorphVerilogTests -- -z "repeated successful runs are byte-identical"'
          sbt -batch "++${{ matrix.scala_version }}" \
            'morph/testOnly morphhdl.MorphSingleSourceVerilogTests morphhdl.StreamFifoCompatibilityTests'
          git diff --exit-code -- .

  closure:
    name: Increment 58 canonical closure
    if: always() && (needs.route.result != 'success' || needs.route.outputs.run == 'true')
    needs:
      - route
      - source-contract
      - focused-handoff
      - compatibility
      - sbt-full
      - mill-full
      - v2001-and-formal
      - streamfifocc-width-formal
      - determinism
    runs-on: ubuntu-latest
    steps:
      - name: Require every canonical gate
        env:
          ROUTE: ${{ needs.route.result }}
          SOURCE: ${{ needs.source-contract.result }}
          FOCUSED: ${{ needs.focused-handoff.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          SBT: ${{ needs.sbt-full.result }}
          MILL: ${{ needs.mill-full.result }}
          V2001_FORMAL: ${{ needs.v2001-and-formal.result }}
          STREAMFIFOCC_FORMAL: ${{ needs.streamfifocc-width-formal.result }}
          DETERMINISM: ${{ needs.determinism.result }}
        run: |
          test "$ROUTE" = success
          test "$SOURCE" = success
          test "$FOCUSED" = success
          test "$COMPATIBILITY" = success
          test "$SBT" = success
          test "$MILL" = success
          test "$V2001_FORMAL" = success
          test "$STREAMFIFOCC_FORMAL" = success
          test "$DETERMINISM" = success

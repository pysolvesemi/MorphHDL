name: Increment 52 residual ownership repair

on:
  pull_request:
    branches:
      - parameterized-verilog

permissions:
  contents: write

concurrency:
  group: increment-52-residual-ownership-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/increment-52-post-merge-overlap-fix' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out Increment 52 closure branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-52-post-merge-overlap-fix
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize structural ownership and concrete hierarchy repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_increment52_residual_ownership.py
          python3 .github/scripts/fix_increment52_containing_claimant.py

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              'morphhdl/src/main/scala/spinal/core/internals/'
              'ExternalParameterizedVerilogHierarchy.scala'
          )
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one site, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''          connectionEvidence(
            parent,
            child,
            actualByName(name),
            assignments,
            s"concrete port '$name' of instance '$instanceName'"
          ).foreach { expression =>
''',
              '''          connectionEvidence(
            parent,
            child,
            actualByName(name),
            assignments,
            s"concrete port '$name' of instance '$instanceName'",
            allowConcreteInternal = true
          ).foreach { expression =>
''',
              'concrete-port hierarchy evidence',
          )

          replace_once(
              '''  private def connectionEvidence(
      parent: Component,
      child: Component,
      port: BaseType,
      assignments: Vector[DataAssignmentStatement],
      context: String
  ): Vector[BindingExpr] = {
''',
              '''  private def connectionEvidence(
      parent: Component,
      child: Component,
      port: BaseType,
      assignments: Vector[DataAssignmentStatement],
      context: String,
      allowConcreteInternal: Boolean = false
  ): Vector[BindingExpr] = {
''',
              'connectionEvidence concrete-internal flag',
          )

          replace_once(
              '''          Vector(bindingOf(parent, assignment.source, context))
''',
              '''          Vector(
            bindingOf(
              parent,
              assignment.source,
              context,
              allowConcreteInternal
            )
          )
''',
              'child-input binding flag',
          )

          replace_once(
              '''          Vector(bindingOf(parent, assignment.finalTarget, context))
''',
              '''          Vector(
            bindingOf(
              parent,
              assignment.finalTarget,
              context,
              allowConcreteInternal
            )
          )
''',
              'child-output binding flag',
          )

          replace_once(
              '''  private def bindingOf(
      parent: Component,
      expression: Expression,
      context: String
  ): BindingExpr = expression match {
''',
              '''  private def bindingOf(
      parent: Component,
      expression: Expression,
      context: String,
      allowConcreteInternal: Boolean
  ): BindingExpr = expression match {
''',
              'bindingOf concrete-internal flag',
          )

          replace_once(
              '''        case None if value.isIo => LiteralBinding(value.getBitsWidth)
        case None =>
''',
              '''        case None if value.isIo || allowConcreteInternal =>
          LiteralBinding(value.getBitsWidth)
        case None =>
''',
              'concrete internal binding acceptance',
          )

          path.write_text(text, encoding='utf-8')
          PY

          git show c37cfba9e8ed0d5ffa64cb0d631a35b986a30632:.github/workflows/morphhdl-native-int-nested-control-flow.yml \
            > .github/workflows/morphhdl-native-int-nested-control-flow.yml
          rm -f .github/workflows/increment-52-overlap-diagnostic.yml
          rm -f .github/workflows/increment-52-native-verilog-diagnostic.yml
          rm -f .github/workflows/increment-52-current-ownership-diagnostic.yml
          rm -f .github/increment-52-current-ownership.txt
          rm -f .github/scripts/apply_increment52_shared_process_fix.py
          rm -f .github/scripts/apply_increment52_residual_ownership.py
          rm -f .github/scripts/fix_increment52_containing_claimant.py
          rm -f .github/scripts/instrument_increment52_plan_diagnostic.py
          git diff --check

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Validate Increment 52 and inherited hierarchy contracts on both Scala lanes
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl/scripts/check-native-int-nested-control-flow-boundary.sh
          for scala_version in 2.12.18 2.13.12; do
            set +e
            /tmp/morphhdl-mill morph[$scala_version].testOnly \
              morphhdl.NativeIntNestedSymbolicControlFlowTests \
              morphhdl.HierarchyParameterBindingTests \
              > /tmp/increment52-$scala_version.log 2>&1
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "===== Increment 52 Scala $scala_version diagnostic ====="
              grep -E 'FAILED|SPINAL-PARAMETERIZED|MorphVerilogException|ParameterizedVerilogException|error\]|Exception|Tests: succeeded|TESTS FAILED|capacities=' \
                /tmp/increment52-$scala_version.log | tail -n 240 || true
              echo "===== Increment 52 Scala $scala_version tail ====="
              tail -n 200 /tmp/increment52-$scala_version.log
              exit "$status"
            fi
            tail -n 60 /tmp/increment52-$scala_version.log
          done

      - name: Commit repaired production tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala \
                  morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogHierarchy.scala \
                  .github/workflows/morphhdl-native-int-nested-control-flow.yml
          git add -u .github
          git commit -m 'fix: close nested structural ownership and concrete hierarchy binding'
          git push origin HEAD:agent/increment-52-post-merge-overlap-fix

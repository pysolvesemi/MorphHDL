name: Publish Increment 53d direct typed adapter v3

on:
  push:
    branches:
      - agent/increment-53d-typed-elabint-pivot
    paths:
      - .github/workflows/increment-53d-direct-typed-fast-publisher-v3.yml
      - morphhdl/scripts/increment-53d-direct-typed-adapter.patch.gz.b64
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-53d-direct-typed-publisher-v3
  cancel-in-progress: true

jobs:
  prove-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-typed-elabint-pivot
          fetch-depth: 0
      - name: Install pinned Mill
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/mill
          chmod +x /tmp/mill
      - name: Apply direct typed source candidate
        shell: bash
        run: |
          set -euo pipefail
          base64 -d morphhdl/scripts/increment-53d-direct-typed-adapter.patch.gz.b64 \
            | gzip -d \
            | git apply --whitespace=nowarn
          python3 - <<'PY'
          from pathlib import Path
          p = Path(
              'morphhdl/src/test/scala/morphhdl/'
              'ParameterizedStreamWidthAdapterTests.scala'
          )
          text = p.read_text()
          old = 'morphhdl.frontend.Bits('
          if old not in text:
              raise SystemExit(f'expected legacy proof factory {old!r}')
          p.write_text(text.replace(old, 'spinal.core.Bits('))
          PY
          git diff --check
      - name: Prove normal direct typed input declaration
        id: normal
        continue-on-error: true
        shell: bash
        run: |
          set +e
          /tmp/mill 'morph[2.13.12].testOnly' \
            morphhdl.ParameterizedStreamWidthAdapterTests \
            > /tmp/increment-53d-normal.log 2>&1
          status=$?
          cat /tmp/increment-53d-normal.log
          printf '%s\n' "$status" > /tmp/increment-53d-normal.status
          exit "$status"
      - name: Retest with explicit direction after typed construction
        id: explicit
        if: steps.normal.outcome != 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(
              'morphhdl/src/test/scala/morphhdl/'
              'ParameterizedStreamWidthAdapterTests.scala'
          )
          text = p.read_text()
          text, count = re.subn(
              r'in\((spinal\.core\.Bits\([^\n]+?\))\)',
              r'\1.asInput()',
              text,
          )
          if count == 0:
              raise SystemExit('no direct typed Bits input declaration was rewritten')
          p.write_text(text)
          PY
          git diff --check
          set +e
          /tmp/mill 'morph[2.13.12].testOnly' \
            morphhdl.ParameterizedStreamWidthAdapterTests \
            > /tmp/increment-53d-explicit.log 2>&1
          status=$?
          cat /tmp/increment-53d-explicit.log
          printf '%s\n' "$status" > /tmp/increment-53d-explicit.status
          exit "$status"
      - name: Determine selected typed port form
        shell: bash
        run: |
          set -euo pipefail
          normal_status="$(cat /tmp/increment-53d-normal.status)"
          explicit_status=1
          if [ -f /tmp/increment-53d-explicit.status ]; then
            explicit_status="$(cat /tmp/increment-53d-explicit.status)"
          fi
          if [ "$normal_status" -eq 0 ]; then
            printf '%s\n' normal > /tmp/increment-53d-selected
          elif [ "$explicit_status" -eq 0 ]; then
            printf '%s\n' explicit > /tmp/increment-53d-selected
          else
            cat /tmp/increment-53d-normal.log > /tmp/increment-53d-selected-failure.log
            if [ -f /tmp/increment-53d-explicit.log ]; then
              printf '\n\n===== explicit direction candidate =====\n' \
                >> /tmp/increment-53d-selected-failure.log
              cat /tmp/increment-53d-explicit.log \
                >> /tmp/increment-53d-selected-failure.log
            fi
            exit 1
          fi
      - name: Verify selected source boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          stream = Path('lib/src/main/scala/spinal/lib/Stream.scala').read_text()
          start = stream.index('object StreamWidthAdapter {')
          end = stream.index('//padding=true allow', start)
          body = stream[start:end]
          for token in (
              'widthOfExpr(input.payload)',
              'widthOfExpr(output.payload)',
              'ElabInt.requireSingleSymbolicRoot',
          ):
              assert token in body, token
          assert 'NativeIntShadow' not in body
          assert 'withWidthFunctionBoundary' not in body

          test = Path(
              'morphhdl/src/test/scala/morphhdl/'
              'ParameterizedStreamWidthAdapterTests.scala'
          ).read_text()
          fixture_start = test.index('object ParameterizedStreamWidthAdapterSmoke {')
          fixture_end = test.index('class ParameterizedStreamWidthAdapterTests', fixture_start)
          fixture = test[fixture_start:fixture_end]
          for token in ('equalWidth: ElabInt', 'downWidth: ElabInt', 'upWidth: ElabInt'):
              assert token in fixture, token
          assert '.asElabInt' in fixture
          assert 'spinal.core.Bits(' in fixture
          assert 'morphhdl.frontend.Bits(' not in fixture
          assert 'NativeIntShadow' not in fixture
          assert 'formalComponent' not in fixture
          assert 'SPINAL-ELAB-INT-INDEPENDENT-ROOTS-UNSUPPORTED' in test
          PY
      - name: Publish validated direct typed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MorphHDL Agent'
          git config user.email 'morphhdl-agent@users.noreply.github.com'
          git add \
            docs/morphhdl/increment-53d-typed-native-change-manifest.md \
            lib/src/main/scala/spinal/lib/Stream.scala \
            morphhdl/src/test/scala/morphhdl/ParameterizedStreamWidthAdapterTests.scala
          git diff --cached --check
          git commit -m 'Use direct ElabInt widths in StreamWidthAdapter'
          git pull --rebase origin agent/increment-53d-typed-elabint-pivot
          git push origin HEAD:agent/increment-53d-typed-elabint-pivot

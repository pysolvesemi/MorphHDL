name: Increment 61 apply reviewed compatibility matrix

on:
  push:
    branches: ['agent/increment-61-one-file-per-component']
    paths:
      - '.github/workflows/increment-61-apply-compatibility.yml'
      - '.github/repair-61-compatibility/**'

permissions:
  contents: write

concurrency:
  group: increment-61-apply-compatibility
  cancel-in-progress: true

jobs:
  apply:
    if: github.repository == 'pysolvesemi/MorphHDL' && github.ref == 'refs/heads/agent/increment-61-one-file-per-component'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and apply the exact reviewed test patch
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-compatibility-application
          payload=.github/repair-61-compatibility
          mkdir -p "$output"
          git rev-parse HEAD > "$output/staging-head.txt"
          test "$(git rev-parse HEAD^)" = 6c66856d67508005b43960511404cbe018c65aa8
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD | sort)
          expected=(
            .github/repair-61-compatibility/chunk-00
            .github/repair-61-compatibility/chunk-01
            .github/repair-61-compatibility/metadata.json
            .github/workflows/increment-61-apply-compatibility.yml
          )
          test "${changed[*]}" = "${expected[*]}"
          test "$(sha256sum "$payload/metadata.json" | cut -d' ' -f1)" = 5f04139fa1c1e3c155a90aecd0f6a612511ca3b0c629c7d534f2f6a95877f3b6
          python3 - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          payload = Path('.github/repair-61-compatibility')
          meta = json.loads((payload / 'metadata.json').read_text())
          assert meta['schema'] == 1 and meta['base'] == '6c66856d67508005b43960511404cbe018c65aa8'
          assert meta['chunks'] == 2
          target = Path(meta['path'])
          assert target.as_posix() == 'morphhdl/src/test/scala/morphhdl/Increment61PerComponentPublicationTests.scala'
          assert hashlib.sha256(target.read_bytes()).hexdigest() == meta['before_sha256']
          encoded = b''.join((payload / f'chunk-{index:02d}').read_bytes() for index in range(meta['chunks']))
          assert hashlib.sha256(encoded).hexdigest() == meta['encoded_sha256']
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == meta['compressed_sha256']
          patch = lzma.decompress(compressed)
          assert len(patch) == meta['patch_bytes']
          assert hashlib.sha256(patch).hexdigest() == meta['patch_sha256']
          output = Path('target/increment-61-compatibility-application/reviewed.patch')
          output.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--whitespace=error', str(output)], check=True)
          subprocess.run(['git', 'apply', '--index', '--whitespace=error', str(output)], check=True)
          assert hashlib.sha256(target.read_bytes()).hexdigest() == meta['after_sha256']
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert changed == [meta['path']], changed
          PY
          git diff --cached --check
      - name: Commit and publish only the reviewed test expansion
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-compatibility-application
          original=$(cat "$output/staging-head.txt")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '61: add broad per-component compatibility corpus' \
            -m 'Exercise exact split ownership across named-field Vec hierarchy, StreamFifo, StreamFifoCC, signed memory and hierarchy, recursive generate, balanced and nested reductions, and typed BlackBox bindings. Retain deterministic source lists and independent external/tool support files. Qualification and completion remain pending.'
          remote=$(git ls-remote origin refs/heads/agent/increment-61-one-file-per-component | cut -f1)
          test "$remote" = "$original"
          git push origin HEAD:refs/heads/agent/increment-61-one-file-per-component
          git rev-parse HEAD > "$output/head.txt"
          git rev-parse 'HEAD^{tree}' > "$output/tree.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-61-compatibility-application
          path: target/increment-61-compatibility-application
          if-no-files-found: error
          retention-days: 14

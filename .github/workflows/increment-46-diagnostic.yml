name: Increment 46 Diagnostic

on:
  push:
    branches:
      - agent/increment-46-formal-parameter-identity
  pull_request:
    branches:
      - parameterized-verilog
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-46-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal-parameter-identity:
    name: Formal parameter identity Scala 2.13
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out Increment 46 branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-46-formal-parameter-identity
          fetch-depth: 0

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0-mill.sh \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Apply candidate source repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          package_path = Path("frontend/src/main/scala/morphhdl/frontend/package.scala")
          package_text = package_path.read_text()
          old_factories = '''  def Bits(width: ParameterizedBitCount): spinal.core.Bits =
            ParameterizedWidth.Bits(width)
          def Bits(width: BitCount): spinal.core.Bits = spinal.core.Bits(width)

          def UInt(width: ParameterizedBitCount): spinal.core.UInt =
            ParameterizedWidth.UInt(width)
          def UInt(width: BitCount): spinal.core.UInt = spinal.core.UInt(width)

          def SInt(width: ParameterizedBitCount): spinal.core.SInt =
            ParameterizedWidth.SInt(width)
          def SInt(width: BitCount): spinal.core.SInt = spinal.core.SInt(width)
          '''
          new_factories = '''  def Bits(width: ParameterizedBitCount): spinal.core.Bits =
            ExternalFormalParameterRegistry.attach(ParameterizedWidth.Bits(width), width)
          def Bits(width: BitCount): spinal.core.Bits = spinal.core.Bits(width)

          def UInt(width: ParameterizedBitCount): spinal.core.UInt =
            ExternalFormalParameterRegistry.attach(ParameterizedWidth.UInt(width), width)
          def UInt(width: BitCount): spinal.core.UInt = spinal.core.UInt(width)

          def SInt(width: ParameterizedBitCount): spinal.core.SInt =
            ExternalFormalParameterRegistry.attach(ParameterizedWidth.SInt(width), width)
          def SInt(width: BitCount): spinal.core.SInt = spinal.core.SInt(width)
          '''
          if old_factories in package_text:
              package_path.write_text(package_text.replace(old_factories, new_factories, 1))
          elif new_factories not in package_text:
              raise SystemExit("frontend factory anchor not found")

          registry_path = Path("frontend/src/main/scala/spinal/core/ExternalFormalParameterRegistry.scala")
          registry_text = registry_path.read_text()
          old_anchor = '''    byKey.get(binding.declarationKey) match {
          '''
          new_anchor = '''    byKey.values.find { existing =>
              existing.ownerClassName == binding.ownerClassName &&
              existing.formal.name == binding.formal.name &&
              existing.declarationKey != binding.declarationKey
            }.foreach { existing =>
              fail(
                "SPINAL-PARAMETERIZED-VERILOG-FORMAL-DUPLICATE-DECLARATION",
                s"component definition '${binding.ownerClassName}' declares formal slot '${binding.formal.name}' at multiple explicit call sites",
                binding.sourceLocation.orElse(existing.sourceLocation)
              )
            }

            byKey.get(binding.declarationKey) match {
          '''
          if old_anchor in registry_text:
              registry_path.write_text(registry_text.replace(old_anchor, new_anchor, 1))
          elif new_anchor not in registry_text:
              raise SystemExit("formal declaration anchor not found")
          PY

      - name: Run focused Increment 46 regression
        shell: bash
        run: |
          set +e
          /tmp/morphhdl-mill morph[2.13.12].test > /tmp/increment-46-test.log 2>&1
          status=$?
          echo "=== Increment 46 failure markers ==="
          grep -nE 'FormalParameterIdentity|AssertionError|Exception|FAILED|FAILURE|error:|SPINAL-PARAMETERIZED-VERILOG-FORMAL|assertion failed' /tmp/increment-46-test.log | tail -n 240 || true
          echo "=== Increment 46 final test tail ==="
          tail -n 260 /tmp/increment-46-test.log
          exit "$status"

      - name: Publish validated source repair
        shell: bash
        run: |
          if git diff --quiet -- \
            frontend/src/main/scala/morphhdl/frontend/package.scala \
            frontend/src/main/scala/spinal/core/ExternalFormalParameterRegistry.scala; then
            echo "Validated repair is already committed."
            exit 0
          fi
          git config user.name "MorphHDL Increment Agent"
          git config user.email "actions@users.noreply.github.com"
          git add \
            frontend/src/main/scala/morphhdl/frontend/package.scala \
            frontend/src/main/scala/spinal/core/ExternalFormalParameterRegistry.scala
          git commit -m "Fix Increment 46 formal metadata transfer"
          git push origin HEAD:agent/increment-46-formal-parameter-identity

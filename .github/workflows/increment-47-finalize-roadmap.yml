name: Finalize Increment 47 roadmap state

on:
  push:
    branches:
      - agent/increment-47-completion-repair
    paths:
      - .github/workflows/increment-47-finalize-roadmap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-47-finalize-roadmap
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/increment-47-completion-repair

      - name: Mark Increment 47 complete after green validation
        shell: bash
        run: |
          set -euo pipefail
          roadmap=docs/morphhdl/parameterized-verilog-todo.md
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/morphhdl/parameterized-verilog-todo.md')
          text = path.read_text()
          old = '- [ ] **Increment 47 — External formalization boundary for native `Int` APIs**'
          new = '- [x] **Increment 47 — External formalization boundary for native `Int` APIs**'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one unchecked Increment 47 roadmap entry')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check -- "${roadmap}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${roadmap}"
          git commit -m 'Complete Increment 47 roadmap item'
          git push origin HEAD:agent/increment-47-completion-repair

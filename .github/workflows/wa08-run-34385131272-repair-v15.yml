name: WA-08 run 34385131272 repair v15

on:
  push:
    branches:
      - agent/wa-08-production-handoff
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wa08-run-34385131272-repair-v15
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wa-08-production-handoff
          fetch-depth: 0
          submodules: recursive
      - name: Reconstruct the reviewed generator and seal only permanent files
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin parameterized-verilog

          repair_path=morphhdl/scripts/repair-wa08-run-34385131272-v12.py
          found=0
          for revision in $(git log --format=%H --all -- "$repair_path"); do
            if git show "$revision:$repair_path" > /tmp/wa08-repair.py 2>/dev/null && \
               grep -q 'def patch_wa07b' /tmp/wa08-repair.py && \
               grep -q 'def patch_rollout' /tmp/wa08-repair.py; then
              found=1
              break
            fi
          done
          test "$found" = 1

          rm -f .github/workflows/wa08-run-34385131272-repair*.yml
          rm -f .github/workflows/wa08-reopen-trigger.txt
          rm -f morphhdl/scripts/repair-wa08-run-34385131272.py
          rm -f "$repair_path"

          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/wa08-repair.py').read_text()
          virtual = Path.cwd() / 'morphhdl/scripts/repair-wa08-run-34385131272-v12.py'
          namespace = {'__name__': '__main__', '__file__': str(virtual)}
          exec(compile(source, str(virtual), 'exec'), namespace)
          PY

          rm -f morphhdl/scripts/repair-wa08-run-34385131272-v12.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement Increment 62 WA-08 source-audit closure"

          python3 morphhdl/scripts/check-wa08-inherited-source-overlay.py --self-test
          python3 morphhdl/scripts/check-wa08-inherited-source-overlay.py
          python3 morphhdl/scripts/check-wa07b-inherited-review.py --self-test
          python3 morphhdl/scripts/check-wa07b-inherited-review.py
          python3 morphhdl/scripts/check-increment-60g-source-scope.py --self-test
          python3 morphhdl/scripts/check-increment-60g-source-scope.py
          python3 morphhdl/scripts/check-increment-60f-equivalence-closure.py --source-only
          python3 morphhdl/scripts/check-increment-59c-source-review.py --self-test
          python3 morphhdl/scripts/check-increment-59c-source-review.py
          python3 morphhdl/scripts/check-increment-59g-source-review.py --self-test
          python3 morphhdl/scripts/check-increment-59g-source-review.py
          bash morphhdl-passes/scripts/check-boundary.sh
          python3 morphhdl-passes/scripts/validate_wire_assignment_equivalence.py --self-test

          git push origin HEAD:agent/wa-08-production-handoff

name: Increment 59b native operator replay formal proof

on:
  push:
    branches: ['agent/increment-59b-*', parameterized-verilog]
    paths:
      - '.github/workflows/increment-59b-operator-replay.yml'
      - 'core/**'
      - 'lib/**'
      - 'morphhdl/**'
  pull_request:
    branches: [parameterized-verilog]
    paths:
      - '.github/workflows/increment-59b-operator-replay.yml'
      - 'core/**'
      - 'lib/**'
      - 'morphhdl/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-59b-operator-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  concrete-native-replay:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref || github.ref_name, 'agent/increment-59b-') ||
      (github.ref == 'refs/heads/parameterized-verilog' && contains(github.event.head_commit.message, '59b'))
    name: Concrete replay formal Scala ${{ matrix.scala }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scala: ['2.12.18', '2.13.12']
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      COURSIER_REPOSITORIES: https://repo.maven.apache.org/maven2
      COURSIER_CACHE: /sbt/.cache/coursier/v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Validate source and bootstrap the repository-pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-59b-operator-replay"
          mkdir -p "$output/bootstrap"
          git archive HEAD | gzip > "$output/source.tar.gz"
          git rev-parse HEAD > "$output/head.txt"
          python3 morphhdl/scripts/check-native-source-preservation.py
          python3 morphhdl/scripts/check-increment-58-retirement.py
          version=$(sed -n 's/^sbt.version=//p' project/build.properties)
          test "$version" = '1.10.0'
          base="https://repo.maven.apache.org/maven2/org/scala-sbt/sbt-launch/$version/sbt-launch-$version.jar"
          curl --fail --location --retry 5 --retry-all-errors "$base" -o "$output/bootstrap/sbt-launch.jar"
          curl --fail --location --retry 5 --retry-all-errors "$base.sha1" -o "$output/bootstrap/sbt-launch.jar.sha1"
          python3 - <<'PY'
          import hashlib, re
          from pathlib import Path
          root = Path('target/increment-59b-operator-replay/bootstrap')
          expected = (root / 'sbt-launch.jar.sha1').read_text().strip()
          assert re.fullmatch('[0-9a-fA-F]{40}', expected)
          assert hashlib.sha1((root / 'sbt-launch.jar').read_bytes()).hexdigest() == expected.lower()
          PY
          printf '[repositories]\nlocal\nmaven-central: https://repo.maven.apache.org/maven2\n' > "$output/bootstrap/repositories"
      - name: Exercise real native body replay and independently regenerate both sides
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-59b-operator-replay"
          java -Xmx3G -Dsbt.log.noformat=true -Dsbt.supershell=false \
            -Dsbt.boot.directory=/sbt/.sbt/boot -Dsbt.global.base=/sbt/.sbt \
            -Dsbt.ivy.home=/sbt/.ivy2 -Duser.home=/sbt \
            -Dsbt.repository.config="$output/bootstrap/repositories" -Dsbt.override.build.repos=true \
            -jar "$output/bootstrap/sbt-launch.jar" "++${{ matrix.scala }}" \
            'morph/Test/testOnly spinal.core.internals.TypedBalancedReductionOperatorReplayTests' \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionOperatorArtifactWriter $output/a" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionOperatorArtifactWriter $output/b" \
            > "$output/sbt.log" 2>&1 || { tail -n 120 "$output/sbt.log"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          paths = list(Path('morphhdl/target').rglob('*TypedBalancedReductionOperatorReplayTests.xml'))
          assert len(paths) == 1, paths
          suite = ET.parse(paths[0]).getroot()
          assert int(suite.get('tests', '0')) == 23, suite.attrib
          assert all(int(suite.get(k, '0')) == 0 for k in ('failures', 'errors', 'skipped')), suite.attrib
          print('Executed native replay suite:', suite.attrib)
          PY
      - name: Strict HDL, independent arithmetic and exhaustive concrete replay equivalence
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-59b-operator-replay"
          python3 morphhdl/scripts/check-increment-59b-operator-replay.py "$output/a" "$output/b"
          printf '%s\n' 'Concrete native operator replay passed all 32 shapes and a formal mutation counterexample. This is not parameterized COUNT stage-publication proof.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain exact-head operator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59b-operator-replay-${{ matrix.scala }}
          path: |
            target/increment-59b-operator-replay
            morphhdl/target/test-reports
          if-no-files-found: error
          retention-days: 30

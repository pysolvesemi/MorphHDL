name: Synchronize Increment 53c with parameterized-verilog

on:
  push:
    branches:
      - agent/increment-53c-native-axi4-slave-factory-offsets

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Increment 53c branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53c-native-axi4-slave-factory-offsets
          fetch-depth: 0

      - name: Merge the live base and resolve the controlling roadmap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags origin parameterized-verilog

          merge_status=0
          git merge --no-ff --no-commit origin/parameterized-verilog || merge_status=$?
          if [[ "${merge_status}" -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ "${#conflicts[@]}" -ne 1 || "${conflicts[0]}" != "docs/morphhdl/parameterized-verilog-todo.md" ]]; then
              printf 'Unexpected merge conflicts:\n' >&2
              printf '%s\n' "${conflicts[@]}" >&2
              exit 1
            fi
            git checkout --theirs docs/morphhdl/parameterized-verilog-todo.md
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("docs/morphhdl/parameterized-verilog-todo.md")
          text = path.read_text()

          dependency_old = """- Increment 53b depends only on the merged Increment 53. Increments 53a and 53b
            may execute independently, but both must complete before Increment 54.
          - Increments 54 through 58 then form a strict sequential closure chain after
            Increments 53a and 53b.
          """
          dependency_new = """- Increment 53b depends only on the merged Increment 53. Increments 53a and 53b
            may execute independently.
          - Increment 53c depends on the merged Increment 53b and may overlap Increment
            53a once Increment 53b is merged.
          - Increment 54 requires the merged Increments 53a and 53c. Increments 54
            through 58 then form a strict sequential closure chain.
          """
          if dependency_old not in text:
              raise SystemExit("latest dependency graph did not match the approved 53a/53b base")
          text = text.replace(dependency_old, dependency_new, 1)

          text = re.sub(
              r"\n- \[[ x]\] \*\*Increment 53c — Native AXI4 Slave Factory parameterized offsets\*\*.*?(?=\n- \[ \] \*\*Increment 54 —)",
              "",
              text,
              count=1,
              flags=re.S,
          )

          marker = "\n- [ ] **Increment 54 — MorphHDL module extraction and native-tree cleanup**\n"
          if text.count(marker) != 1:
              raise SystemExit("Increment 54 marker was missing or ambiguous")

          increment_53c = """
          - [ ] **Increment 53c — Native AXI4 Slave Factory parameterized offsets**

            **Dependencies:** Increment 53b implemented and merged.

            Preserve bounded symbolic register-map offsets while application source uses
            the real, untouched `spinal.lib.bus.amba4.axi.Axi4SlaveFactory`. MorphHDL may
            add only compiler/runtime provenance, exact-object metadata and
            parameter-aware native case-key lowering. It must not modify upstream-owned
            SpinalHDL `core`, `lib` or `idslplugin` production sources, reimplement or
            replace the factory, duplicate AXI/register-map algorithms, recognize
            emitted module or signal text, or infer symbolic identity from equal
            concrete addresses. Prove direct and derived offsets, unrelated fixed-address
            isolation, deterministic dual-Scala `MorphVerilog`, ordinary concrete
            `SpinalVerilog` parity and strict Verilog-2001 lint/synthesis. Generate
            independent native-`Int` concrete witnesses at offsets `0x010`, `0x040` and
            `0x070`, specialize the single MorphHDL definition to each matching offset,
            and prove the complete top-level AXI/register behavior sequentially
            equivalent after a shared reset under arbitrary shared AXI inputs. Compare
            response payloads only while their valid outputs are asserted, and require a
            deliberately mutated MorphHDL observable to produce a genuine assertion
            counterexample. Run all positive proofs and the mutation control on Scala
            2.12.18 and 2.13.12 in the pinned formal toolchain while retaining the native
            source-preservation boundary.
          """
          text = text.replace(marker, increment_53c + marker, 1)

          dependency_54_old =
              "  **Dependencies:** Increments 53a and 53b implemented and merged."
          dependency_54_new =
              "  **Dependencies:** Increments 53a and 53c implemented and merged."
          if text.count(dependency_54_old) != 1:
              raise SystemExit("Increment 54 dependency line was missing or ambiguous")
          text = text.replace(dependency_54_old, dependency_54_new, 1)

          path.write_text(text)
          PY

          git rm --force .github/workflows/morphhdl-increment-53c-sync.yml
          git add docs/morphhdl/parameterized-verilog-todo.md
          git diff --cached --check
          git commit -m "Merge parameterized-verilog into Increment 53c"
          git push origin HEAD:agent/increment-53c-native-axi4-slave-factory-offsets

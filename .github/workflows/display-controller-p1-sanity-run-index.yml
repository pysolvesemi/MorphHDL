name: Display Controller P1 sanity run index

on:
  push:
    branches:
      - validation/display-controller-p1-sanity-00
    paths-ignore:
      - validation/display-controller-p1-sanity-00/ci-results/**
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture all workflow runs for this validation commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result_dir=validation/display-controller-p1-sanity-00/ci-results
          mkdir -p "${result_dir}"
          raw="${result_dir}/runs-${GITHUB_SHA}.raw.json"
          index="${result_dir}/runs-${GITHUB_SHA}.json"

          # Give every workflow triggered by the same push time to register.
          for attempt in 1 2 3 4 5; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              -o "${raw}"
            run_count=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1])).get("workflow_runs", [])))' "${raw}")
            if [[ "${run_count}" -ge 2 ]]; then
              break
            fi
            sleep 5
          done

          python3 - "${raw}" "${index}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          source = json.loads(Path(sys.argv[1]).read_text())
          runs = []
          for run in source.get("workflow_runs", []):
              runs.append({
                  "id": run.get("id"),
                  "name": run.get("name"),
                  "event": run.get("event"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "head_sha": run.get("head_sha"),
                  "run_number": run.get("run_number"),
                  "run_attempt": run.get("run_attempt"),
                  "html_url": run.get("html_url"),
              })
          payload = {
              "schema": "display-controller-p1-sanity-run-index/v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "head_sha": os.environ["GITHUB_SHA"],
              "index_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "runs": sorted(runs, key=lambda item: (item["name"] or "", item["id"] or 0)),
          }
          Path(sys.argv[2]).write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
          rm -f "${raw}"
          cat "${index}"

      - name: Publish run index without retriggering validation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/display-controller-p1-sanity-00/ci-results/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(validation): publish P1 sanity run index [skip ci]"
          git push origin HEAD:validation/display-controller-p1-sanity-00

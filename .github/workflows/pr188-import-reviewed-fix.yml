name: Recover PR188 target history and reviewed audit blobs
on:
  push:
    branches: [agent/independent-parameter-domain-composition]
    paths: ['.github/workflows/pr188-import-reviewed-fix.yml']
permissions:
  contents: write
  actions: write
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b07c35ba3513644b250d0fd072ad6f4d9444d9f8
          fetch-depth: 0
          persist-credentials: false
      - name: Retain immutable history and upload reviewed audit blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess, urllib.request, urllib.parse, urllib.error
          from pathlib import Path
          repo='pysolvesemi/MorphHDL'
          branch='agent/independent-parameter-domain-composition'
          source='b07c35ba3513644b250d0fd072ad6f4d9444d9f8'
          target='61d1fe0dcac0b52856620944a2d7426fd1390a48'
          assert os.environ['GITHUB_REPOSITORY']==repo and os.environ['GITHUB_REF']=='refs/heads/'+branch
          def git(*a, raw=False):
              b=subprocess.check_output(['git',*a]); return b if raw else b.decode().strip()
          def api(path,data=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,
                data=None if data is None else json.dumps(data).encode(),method='GET' if data is None else 'POST',
                headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=120) as f:
                  b=f.read(); return json.loads(b) if b else {}
          assert git('rev-parse','HEAD')==source and git('rev-parse','HEAD^{tree}')=='86a5fc20deba3b1d5fcbd7b642f70b7e19ad2e78'
          assert git('rev-parse','refs/remotes/origin/parameterized-verilog')==target
          evidence=Path(os.environ['RUNNER_TEMP'])/'pr188-object-recovery'; evidence.mkdir()
          subprocess.run(['git','bundle','create',str(evidence/'history.bundle'),'HEAD','refs/remotes/origin/parameterized-verilog','^3b547ae5622ae212c17f6e67cc96924127a46a41'],check=True)
          helper=Path('morphhdl/scripts/check-increment-62-wa08-source-overlay.py')
          manifest=Path('morphhdl/contracts/increment-62-wa08-source-overlay.json')
          old=json.loads(manifest.read_text()); ns={'__name__':'reviewed_overlay'}
          exec(compile(helper.read_text(),str(helper),'exec'),ns)
          digest=lambda b:hashlib.sha256(b).hexdigest()
          paths=sorted(p for p in git('diff','--name-only','--no-renames',old['base'],source).splitlines() if ns['governed'](p) and p not in (str(helper),str(manifest)))
          assert len(paths)==156
          records=[]
          for path in paths:
              mode,kind,sha=git('ls-tree',source,'--',path).split()[:3]
              assert kind=='blob'
              before=git('ls-tree',old['base'],'--',path)
              records.append(dict(path=path,mode=mode,before_sha256=digest(git('show',old['base']+':'+path,raw=True)) if before else None,after_sha256=digest(git('show',source+':'+path,raw=True))))
          index={v['path']:v for v in records}
          for entry in old['files']:
              assert entry['path'] in index and index[entry['path']]['before_sha256']==entry['before_sha256']
          content=helper.read_bytes(); normalized=ns['normalized_helper'](content)
          value=dict(old,files=records,final_source_commit=source,helper_normalized_sha256=digest(normalized))
          raw=(json.dumps(value,indent=2)+'\n').encode()
          updated=re.sub(rb'^CONTRACT_SHA256 = "[^"]+"$',('CONTRACT_SHA256 = "'+digest(raw)+'"').encode(),content,count=1,flags=re.M)
          assert ns['normalized_helper'](updated)==normalized
          entries=[]
          for path,data in ((manifest,raw),(helper,updated)):
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              result=api('git/blobs',dict(content=base64.b64encode(data).decode(),encoding='base64'))
              assert result['sha']==sha
              entries.append(dict(path=str(path),mode='100644',type='blob',sha=sha))
              (evidence/path.name).write_bytes(data)
          (evidence/'audit-blobs.json').write_text(json.dumps(dict(source=source,target=target,entries=entries),indent=2)+'\n')
          for status in ('queued','in_progress','waiting'):
              query=urllib.parse.urlencode(dict(branch=branch,status=status,per_page=100))
              for run in api('actions/runs?'+query)['workflow_runs']:
                  if run['head_branch']==branch and run['head_sha']=='4cd03f60360cc7329407fe033a1f9370f7b9dc26' and run['id']!=int(os.environ['GITHUB_RUN_ID']):
                      try:
                          api('actions/runs/'+str(run['id'])+'/cancel',{}); print('CANCELLED_OBSOLETE_TRANSPORT',run['id'])
                      except urllib.error.HTTPError as error:
                          if error.code!=409: raise
          print('RECOVERED_IMMUTABLE_HISTORY_AND_AUDIT_BLOBS_ONLY')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr188-object-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/pr188-object-recovery/
          if-no-files-found: error

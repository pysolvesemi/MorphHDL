name: Stage reviewed PR188 symbolic-publication source objects
on:
  push:
    branches: [agent/independent-parameter-domain-composition]
    paths: ['.github/workflows/pr188-import-reviewed-fix.yml']
permissions:
  contents: write
  actions: write
jobs:
  apply:
    if: github.repository == 'pysolvesemi/MorphHDL'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Stage exact reviewed source and audit Git objects without updating remote refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/pr188-import-reviewed-fix.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr188-symbolic-source-${{ github.sha }}
          path: ${{ runner.temp }}/pr188-reviewed-fix-evidence/
          if-no-files-found: error
      - name: Cancel superseded branch runs only after the authorized final ref is published
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.parse, urllib.error
          from pathlib import Path
          repo = 'pysolvesemi/MorphHDL'
          branch = 'agent/independent-parameter-domain-composition'
          record = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pr188-reviewed-fix-evidence/publication.json').read_text())
          assert record['repository'] == repo and record['branch'] == branch
          final = record['final_head']
          base = 'https://api.github.com/repos/' + repo + '/'
          def call(path, post=False):
              req = urllib.request.Request(base + path, data=b'' if post else None,
                  method='POST' if post else 'GET', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read()
                  return json.loads(data) if data else {}
          for attempt in range(60):
              head = call('git/ref/heads/' + branch)['object']['sha']
              if head == final:
                  break
              if head != record['starting_head']:
                  raise SystemExit('Branch moved to another revision; no cancellation performed')
              time.sleep(3)
          else:
              raise SystemExit('Final ref not published during this run; no cancellation performed')
          runs = {}
          for status in ('queued', 'in_progress', 'waiting', 'requested', 'pending'):
              page = 1
              while True:
                  query = urllib.parse.urlencode(dict(branch=branch, status=status, per_page=100, page=page))
                  batch = call('actions/runs?' + query)['workflow_runs']
                  for run in batch:
                      if run['head_branch'] == branch and run['head_sha'] != final and run['id'] != int(os.environ['GITHUB_RUN_ID']):
                          runs[run['id']] = run
                  if len(batch) < 100:
                      break
                  page += 1
          for run_id, run in sorted(runs.items()):
              assert call('git/ref/heads/' + branch)['object']['sha'] == final
              try:
                  call('actions/runs/' + str(run_id) + '/cancel', post=True)
                  print('CANCELLED_STALE_BRANCH_RUN', run_id, run['head_sha'])
              except urllib.error.HTTPError as error:
                  if error.code != 409:
                      raise
                  print('ALREADY_FINISHED', run_id)
          print('PRESERVED_CURRENT_FINAL_HEAD', final)
          PY

name: Increment 49 automatic validated completion v5

on:
  push:
    branches:
      - agent/increment-49-native-int-provenance
    paths:
      - .github/workflows/increment-49-automatic-completion-v5.yml
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: increment-49-automatic-validated-completion
  cancel-in-progress: true

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      FEATURE_BRANCH: agent/increment-49-native-int-provenance
      BASE_BRANCH: parameterized-verilog
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/increment-49-native-int-provenance

      - name: Wait for reviewed implementation publication
        shell: bash
        run: |
          set -euo pipefail
          implementation_present() {
            [[ ! -e .github/workflows/increment-49-bootstrap-final.yml ]] || return 1
            [[ ! -e .github/workflows/increment-49-paste-bootstrap.yml ]] || return 1
            [[ ! -d .github/increment-49-payload ]] || return 1
            changed=$(git diff --name-only "origin/${BASE_BRANCH}...HEAD")
            grep -qvE '^\.github/(increment-49-|workflows/increment-49-automatic-completion(-v[2345])?\.yml)' <<<"${changed}"
          }
          git fetch --quiet origin "${BASE_BRANCH}" "${FEATURE_BRANCH}"
          git reset --hard "origin/${FEATURE_BRANCH}"
          if implementation_present; then exit 0; fi
          deadline=$((SECONDS + 3600))
          while (( SECONDS < deadline )); do
            sleep 20
            git fetch --quiet origin "${BASE_BRANCH}" "${FEATURE_BRANCH}"
            git reset --hard "origin/${FEATURE_BRANCH}"
            if implementation_present; then exit 0; fi
          done
          echo 'Reviewed Increment 49 implementation was not published.' >&2
          exit 1

      - name: Wait for required implementation-head workflows
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          deadline=$((SECONDS + 10800))
          while (( SECONDS < deadline )); do
            runs=$(gh api --paginate "/repos/${REPOSITORY}/actions/runs?head_sha=${sha}&per_page=100" --jq '[.workflow_runs[] | select((.name | startswith("Increment 49 automatic validated completion") | not) and (.name | startswith("Increment 49 reviewed") | not) and (.name | startswith("Increment 49 source") | not)) | {name,status,conclusion,html_url}]')
            failed=$(jq '[.[] | select(.status == "completed" and (.conclusion | IN("success","neutral","skipped") | not))] | length' <<<"${runs}")
            (( failed == 0 )) || { jq -r '.[] | select(.status == "completed" and (.conclusion | IN("success","neutral","skipped") | not)) | "FAILED: \(.name) [\(.conclusion)] \(.html_url)"' <<<"${runs}" >&2; exit 1; }
            have_provenance=$(jq '[.[] | select(.name | test("native Int.*provenance|provenance.*native Int|native Int symbolic"; "i"))] | length' <<<"${runs}")
            have_guard=$(jq '[.[] | select(.name | test("native source guard"; "i"))] | length' <<<"${runs}")
            have_baseline=$(jq '[.[] | select(.name | test("MorphHDL baseline"; "i"))] | length' <<<"${runs}")
            incomplete=$(jq '[.[] | select(.status != "completed")] | length' <<<"${runs}")
            if (( have_provenance > 0 && have_guard > 0 && have_baseline > 0 && incomplete == 0 )); then exit 0; fi
            sleep 30
          done
          echo 'Required Increment 49 implementation workflows did not complete.' >&2
          exit 1

      - name: Complete roadmap and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin "${BASE_BRANCH}"
          changed=$(git diff --name-only "origin/${BASE_BRANCH}...HEAD")
          test -n "${changed}"
          ! grep -E '^(core|lib|idslplugin)/src/' <<<"${changed}"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/morphhdl/parameterized-verilog-todo.md')
          text = path.read_text()
          old = '- [ ] **Increment 49 — Native `Int` symbolic provenance propagation**'
          new = '- [x] **Increment 49 — Native `Int` symbolic provenance propagation**'
          if text.count(old) != 1:
              raise SystemExit(f'expected one unchecked Increment 49 entry, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -rf .github/increment-49-payload
          rm -f .github/increment-49-ci-trigger \
            .github/workflows/increment-49-bootstrap-final.yml \
            .github/workflows/increment-49-paste-bootstrap.yml \
            .github/workflows/increment-49-automatic-completion.yml \
            .github/workflows/increment-49-automatic-completion-v2.yml \
            .github/workflows/increment-49-automatic-completion-v3.yml \
            .github/workflows/increment-49-automatic-completion-v4.yml \
            .github/workflows/increment-49-automatic-completion-v5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/morphhdl/parameterized-verilog-todo.md
          git add -u -- .github || true
          git diff --cached --check
          git commit -m 'Complete Increment 49 roadmap after passing validation'
          git push origin HEAD:"${FEATURE_BRANCH}"
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Wait for required final-head workflows
        shell: bash
        run: |
          set -euo pipefail
          sha="${FINAL_SHA}"
          deadline=$((SECONDS + 10800))
          while (( SECONDS < deadline )); do
            runs=$(gh api --paginate "/repos/${REPOSITORY}/actions/runs?head_sha=${sha}&per_page=100" --jq '[.workflow_runs[] | {name,status,conclusion,html_url}]')
            failed=$(jq '[.[] | select(.status == "completed" and (.conclusion | IN("success","neutral","skipped") | not))] | length' <<<"${runs}")
            (( failed == 0 )) || { jq -r '.[] | select(.status == "completed" and (.conclusion | IN("success","neutral","skipped") | not)) | "FAILED: \(.name) [\(.conclusion)] \(.html_url)"' <<<"${runs}" >&2; exit 1; }
            have_provenance=$(jq '[.[] | select(.name | test("native Int.*provenance|provenance.*native Int|native Int symbolic"; "i"))] | length' <<<"${runs}")
            have_guard=$(jq '[.[] | select(.name | test("native source guard"; "i"))] | length' <<<"${runs}")
            have_baseline=$(jq '[.[] | select(.name | test("MorphHDL baseline"; "i"))] | length' <<<"${runs}")
            incomplete=$(jq '[.[] | select(.status != "completed")] | length' <<<"${runs}")
            if (( have_provenance > 0 && have_guard > 0 && have_baseline > 0 && incomplete == 0 )); then exit 0; fi
            sleep 30
          done
          echo 'Required Increment 49 final workflows did not complete.' >&2
          exit 1

      - name: Ready and squash-merge Increment 49
        shell: bash
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --repo "${REPOSITORY}" --head "${FEATURE_BRANCH}" --base "${BASE_BRANCH}" --state open --json number --jq '.[0].number // empty')
          if [[ -z "${pr_number}" ]]; then
            gh pr create --repo "${REPOSITORY}" --base "${BASE_BRANCH}" --head "${FEATURE_BRANCH}" --title 'Increment 49: native Int symbolic provenance propagation' --body 'Implements Increment 49. The dedicated provenance workflow, native-source guard, baseline and every other triggered workflow passed on both the implementation and final roadmap heads before merge.'
            pr_number=$(gh pr list --repo "${REPOSITORY}" --head "${FEATURE_BRANCH}" --base "${BASE_BRANCH}" --state open --json number --jq '.[0].number')
          fi
          if gh pr view "${pr_number}" --repo "${REPOSITORY}" --json isDraft --jq '.isDraft' | grep -qx true; then gh pr ready "${pr_number}" --repo "${REPOSITORY}"; fi
          gh pr merge "${pr_number}" --repo "${REPOSITORY}" --squash
          merge_sha=$(gh pr view "${pr_number}" --repo "${REPOSITORY}" --json mergeCommit --jq '.mergeCommit.oid')
          echo "PR_NUMBER=${pr_number}" >> "${GITHUB_ENV}"
          echo "MERGE_SHA=${merge_sha}" >> "${GITHUB_ENV}"

      - name: Verify post-merge workflows and delete feature branch
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 10800))
          observed=0
          while (( SECONDS < deadline )); do
            runs=$(gh api --paginate "/repos/${REPOSITORY}/actions/runs?head_sha=${MERGE_SHA}&per_page=100" --jq '[.workflow_runs[] | {name,status,conclusion,html_url}]')
            count=$(jq 'length' <<<"${runs}")
            if (( count > 0 )); then observed=1; fi
            failed=$(jq '[.[] | select(.status == "completed" and (.conclusion | IN("success","neutral","skipped") | not))] | length' <<<"${runs}")
            (( failed == 0 )) || { jq -r '.[] | select(.status == "completed" and (.conclusion | IN("success","neutral","skipped") | not)) | "POST-MERGE FAILED: \(.name) [\(.conclusion)] \(.html_url)"' <<<"${runs}" >&2; exit 1; }
            incomplete=$(jq '[.[] | select(.status != "completed")] | length' <<<"${runs}")
            if (( observed == 1 && incomplete == 0 )); then
              gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body "Post-merge workflows passed for squash commit \`${MERGE_SHA}\`."
              gh api -X DELETE "/repos/${REPOSITORY}/git/refs/heads/${FEATURE_BRANCH}" || true
              exit 0
            fi
            sleep 30
          done
          echo 'Post-merge Increment 49 workflows did not complete.' >&2
          exit 1

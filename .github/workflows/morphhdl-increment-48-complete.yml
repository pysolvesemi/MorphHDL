name: Complete Increment 48 natural symbolic conditionals

on:
  pull_request:
    branches: [parameterized-verilog]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: increment-48-implementation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  complete:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/increment-48-natural-symbolic-conditionals'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}
      SBT_TEST_PARALLEL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-48-natural-symbolic-conditionals
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Install strict Verilog-2001 validator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V

      - name: Verify dependency and determine implementation state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin parameterized-verilog
          test "$(git merge-base HEAD origin/parameterized-verilog)" = "$(git rev-parse origin/parameterized-verilog)"
          if grep -qE '^- \[x\] \*\*Increment 48\b' docs/morphhdl/parameterized-verilog-todo.md; then
            echo 'already_complete=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'already_complete=false' >> "${GITHUB_OUTPUT}"
          fi
          if [[ -f .github/increment48/implement.py ]]; then
            python3 -m py_compile .github/increment48/implement.py
            echo 'driver=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'driver=false' >> "${GITHUB_OUTPUT}"
            test -f frontend/src/main/scala/morphhdl/frontend/NaturalSymbolicConditional.scala
            test -f morphhdl/src/test/scala/morphhdl/NaturalSymbolicConditionalTests.scala
          fi

      - name: Discover and compile the existing structural-capture delegation
        if: steps.state.outputs.already_complete != 'true' && steps.state.outputs.driver == 'true'
        id: delegate
        shell: bash
        run: |
          set -euo pipefail

          candidates=(
            'spinal.core.ParameterizedStructure.ifThenElse(condition)(ifTrue)(ifFalse)'
            'spinal.core.ParameterizedStructure.ifElse(condition)(ifTrue)(ifFalse)'
            'spinal.core.ParameterizedStructure.conditional(condition)(ifTrue)(ifFalse)'
            'spinal.core.ParameterizedStructure.select(condition)(ifTrue)(ifFalse)'
            'spinal.core.ParameterizedStructure.branch(condition)(ifTrue)(ifFalse)'
            'spinal.core.ParameterizedStructure.capture(condition)(ifTrue)(ifFalse)'
            'spinal.core.ParameterizedStructure.symbolicIf(condition)(ifTrue)(ifFalse)'
            'spinal.core.ParameterizedStructure.generateIf(condition)(ifTrue)(ifFalse)'
            'spinal.core.ParameterizedStructure.ifGenerate(condition)(ifTrue)(ifFalse)'
            'spinal.core.ParameterizedStructure.apply(condition)(ifTrue)(ifFalse)'
            'spinal.core.ParameterizedStructure.ifThenElse(condition, ifTrue, ifFalse)'
            'spinal.core.ParameterizedStructure.ifElse(condition, ifTrue, ifFalse)'
            'spinal.core.ParameterizedStructure.conditional(condition, ifTrue, ifFalse)'
            'spinal.core.ParameterizedStructure.select(condition, ifTrue, ifFalse)'
            'spinal.core.ParameterizedStructure.when(condition)(ifTrue).otherwise(ifFalse)'
            'spinal.core.ParameterizedStructure.when(condition) { ifTrue }.otherwise { ifFalse }'
            'condition.ifThenElse(ifTrue)(ifFalse)'
            'condition.ifElse(ifTrue)(ifFalse)'
            'condition.select(ifTrue, ifFalse)'
            'condition.branch(ifTrue, ifFalse)'
            'condition.capture(ifTrue, ifFalse)'
            'condition.when(ifTrue).otherwise(ifFalse)'
            'morphhdl.frontend.HdlBool.ifThenElse(condition)(ifTrue)(ifFalse)'
            'morphhdl.frontend.HdlBool.ifElse(condition)(ifTrue)(ifFalse)'
          )

          structure=frontend/src/main/scala/spinal/core/ParameterizedStructure.scala
          if [[ -f "${structure}" ]]; then
            while IFS= read -r method; do
              candidates+=(
                "spinal.core.ParameterizedStructure.${method}(condition)(ifTrue)(ifFalse)"
                "spinal.core.ParameterizedStructure.${method}(condition, ifTrue, ifFalse)"
                "spinal.core.ParameterizedStructure.${method}(condition.expression)(ifTrue)(ifFalse)"
                "spinal.core.ParameterizedStructure.${method}(condition.expr)(ifTrue)(ifFalse)"
                "spinal.core.ParameterizedStructure.${method}(condition.condition)(ifTrue)(ifFalse)"
              )
            done < <(
              sed -nE 's/^[[:space:]]*def[[:space:]]+([A-Za-z_][A-Za-z0-9_]*)\>.*/\1/p' "${structure}" |
                grep -Ei 'if|when|else|cond|select|branch|generate|capture' | sort -u
            )
          fi

          for member in expression expr condition value; do
            candidates+=(
              "spinal.core.ParameterizedStructure.ifThenElse(condition.${member})(ifTrue)(ifFalse)"
              "spinal.core.ParameterizedStructure.ifElse(condition.${member})(ifTrue)(ifFalse)"
              "spinal.core.ParameterizedStructure.conditional(condition.${member})(ifTrue)(ifFalse)"
              "spinal.core.ParameterizedStructure.select(condition.${member})(ifTrue)(ifFalse)"
              "spinal.core.ParameterizedStructure.when(condition.${member})(ifTrue).otherwise(ifFalse)"
            )
          done

          declare -A seen=()
          selected=''
          attempt=0
          for candidate in "${candidates[@]}"; do
            [[ -n "${seen[${candidate}]:-}" ]] && continue
            seen["${candidate}"]=1
            attempt=$((attempt + 1))
            echo "Trying structural delegation ${attempt}: ${candidate}"
            python3 .github/increment48/implement.py --runtime "${candidate}"
            log="/tmp/increment48-delegate-${attempt}.log"
            if sbt --batch --no-server \
                '++2.12.18' \
                'idslplugin/compile' \
                'frontend/compile' > "${log}" 2>&1; then
              selected="${candidate}"
              cat "${log}"
              break
            fi
            tail -n 60 "${log}" || true
          done

          if [[ -z "${selected}" ]]; then
            echo 'No compatible existing structural-capture delegation compiled.' >&2
            grep -RInE 'object ParameterizedStructure|class ParameterizedStructure|def (if|when|select|conditional|branch|capture|generate)|HdlBool' \
              frontend/src/main/scala/spinal/core \
              frontend/src/main/scala/morphhdl/frontend \
              morphhdl/src/test/scala \
              frontend/src/test/scala 2>/dev/null | head -n 500 || true
            exit 1
          fi

          printf '%s\n' "${selected}" > /tmp/increment48-selected-delegate.txt
          echo "Selected structural delegation: ${selected}"

      - name: Verify implementation sources exist
        if: steps.state.outputs.already_complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/src/main/scala/morphhdl/frontend/NaturalSymbolicConditional.scala
          test -f morphhdl/src/test/scala/morphhdl/NaturalSymbolicConditionalTests.scala
          test -f morphhdl/scripts/check-natural-symbolic-conditional-boundary.sh
          test -f docs/morphhdl/increment-48-natural-symbolic-conditionals.md
          test -f .github/workflows/morphhdl-natural-symbolic-conditionals.yml

      - name: Compile and test Increment 48 on Scala 2.12.18
        if: steps.state.outputs.already_complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sbt --batch --no-server \
            '++2.12.18' \
            'idslplugin/clean' \
            'frontend/clean' \
            'morph/clean' \
            'morph/testOnly morphhdl.NaturalSymbolicConditionalTests'

      - name: Compile and test Increment 48 on Scala 2.13.12
        if: steps.state.outputs.already_complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sbt --batch --no-server \
            '++2.13.12' \
            'idslplugin/clean' \
            'frontend/clean' \
            'morph/clean' \
            'morph/testOnly morphhdl.NaturalSymbolicConditionalTests'

      - name: Reject implicit HdlBool-to-Boolean conversion
        if: steps.state.outputs.already_complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bad=/tmp/Increment48ImplicitWitness.scala
          cat > "${bad}" <<'SCALA'
          package morphhdl.increment48negative
          import morphhdl.frontend.HdlInt
          object Increment48ImplicitWitness {
            val width = HdlInt.param("WIDTH", default = 8, min = 1, max = 32)
            val forbidden: Boolean = width > 8
          }
          SCALA
          sed -i 's/^          //' "${bad}"
          for scala_version in 2.12.18 2.13.12; do
            log="/tmp/increment48-implicit-${scala_version}.log"
            if sbt --batch --no-server \
                "++${scala_version}" \
                "set morph / Compile / unmanagedSources += file(\"${bad}\")" \
                'morph / Compile / compile' > "${log}" 2>&1; then
              cat "${log}"
              echo "Expected HdlBool-to-Boolean compilation to fail on ${scala_version}" >&2
              exit 1
            fi
            cat "${log}"
            grep -E 'type mismatch|found.*HdlBool|required.*Boolean' "${log}"
          done

      - name: Diagnose unsafe symbolic return
        if: steps.state.outputs.already_complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bad=/tmp/Increment48UnsafeReturn.scala
          cat > "${bad}" <<'SCALA'
          package morphhdl.increment48negative
          import morphhdl.frontend.HdlInt
          object Increment48UnsafeReturn {
            def forbidden(width: HdlInt): Int = {
              if (width > 8) return 1 else 0
            }
          }
          SCALA
          sed -i 's/^          //' "${bad}"
          for scala_version in 2.12.18 2.13.12; do
            log="/tmp/increment48-return-${scala_version}.log"
            if sbt --batch --no-server \
                "++${scala_version}" \
                "set morph / Compile / unmanagedSources += file(\"${bad}\")" \
                'morph / Compile / compile' > "${log}" 2>&1; then
              cat "${log}"
              echo "Expected unsafe symbolic return compilation to fail on ${scala_version}" >&2
              exit 1
            fi
            cat "${log}"
            grep 'MORPHDL-SYMBOLIC-CONDITIONAL-UNSAFE-EFFECT' "${log}"
          done

      - name: Run inherited preservation and regression contracts
        if: steps.state.outputs.already_complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only origin/parameterized-verilog...HEAD -- core/src/main/scala lib/src/main/scala | wc -l)" -eq 0
          if [[ -x morphhdl/scripts/check-external-structural-process-boundary.sh ]]; then
            morphhdl/scripts/check-external-structural-process-boundary.sh
          fi
          if [[ -x morphhdl/scripts/check-external-memory-boundary.sh ]]; then
            morphhdl/scripts/check-external-memory-boundary.sh
          fi
          if [[ -f morphhdl/scripts/check-native-source-preservation.py ]]; then
            python3 morphhdl/scripts/check-native-source-preservation.py
          elif [[ -x morphhdl/scripts/check-native-source-preservation.sh ]]; then
            morphhdl/scripts/check-native-source-preservation.sh
          fi

          sbt --batch --no-server \
            '++2.12.18' \
            'morph/testOnly morphhdl.StructuralGenerateControlTests morphhdl.GenericProcessLoweringTests morphhdl.MorphSingleSourceVerilogTests morphhdl.NativeLibraryReuseTests morphhdl.NativeSymbolicMemoryTests morphhdl.ParameterizedStreamFifoDepthTests'
          sbt --batch --no-server \
            '++2.13.12' \
            'morph/testOnly morphhdl.StructuralGenerateControlTests morphhdl.GenericProcessLoweringTests morphhdl.MorphSingleSourceVerilogTests morphhdl.NativeLibraryReuseTests morphhdl.NativeSymbolicMemoryTests morphhdl.ParameterizedStreamFifoDepthTests'

      - name: Verify deterministic regeneration
        if: steps.state.outputs.already_complete != 'true' && steps.state.outputs.driver == 'true'
        shell: bash
        run: |
          set -euo pipefail
          selected=$(cat /tmp/increment48-selected-delegate.txt)
          mapfile -t before_paths < <(git diff --name-only | sort)
          before=/tmp/increment48-before.sha256
          after=/tmp/increment48-after.sha256
          : > "${before}"
          for path in "${before_paths[@]}"; do
            [[ -f "${path}" ]] && sha256sum "${path}" >> "${before}"
          done
          python3 .github/increment48/implement.py --runtime "${selected}"
          : > "${after}"
          for path in "${before_paths[@]}"; do
            [[ -f "${path}" ]] && sha256sum "${path}" >> "${after}"
          done
          diff -u "${before}" "${after}"

      - name: Remove all branch-only machinery
        if: steps.state.outputs.already_complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/increment48/implement.py \
            .github/workflows/morphhdl-increment-48-implementation.yml \
            .github/workflows/morphhdl-increment-48-complete.yml \
            .github/workflows/morphhdl-increment-48-offline-export.yml \
            tmp-tool-probe.txt
          rmdir .github/increment48 2>/dev/null || true

      - name: Validate and commit implementation publication scope
        if: steps.state.outputs.already_complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -gt 0
          printf 'Increment 48 implementation paths:\n'
          printf '  %s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "${path}" in
              .github/workflows/morphhdl-natural-symbolic-conditionals.yml|\
              .github/workflows/morphhdl-increment-48-implementation.yml|\
              .github/workflows/morphhdl-increment-48-complete.yml|\
              .github/workflows/morphhdl-increment-48-offline-export.yml|\
              .github/increment48/implement.py|\
              tmp-tool-probe.txt|\
              docs/morphhdl/increment-48-natural-symbolic-conditionals.md|\
              frontend/src/main/scala/morphhdl/frontend/NaturalSymbolicConditional.scala|\
              morphhdl/scripts/check-natural-symbolic-conditional-boundary.sh|\
              morphhdl/src/test/scala/morphhdl/NaturalSymbolicConditionalTests.scala|\
              idslplugin/src/main/scala/*)
                ;;
              *)
                echo "Unexpected Increment 48 implementation path: ${path}" >&2
                exit 1
                ;;
            esac
          done
          test "$(git diff --name-only -- core/src/main/scala lib/src/main/scala | wc -l)" -eq 0
          ! grep -RInE 'implicit[[:space:]]+(def|val|object).*HdlBool.*Boolean|implicit[[:space:]]+conversion.*HdlBool' \
            frontend/src/main/scala idslplugin/src/main/scala
          git diff --check

          for path in "${changed[@]}"; do
            git add -- "${path}"
          done
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement Increment 48 natural symbolic conditionals'
          git push origin HEAD:agent/increment-48-natural-symbolic-conditionals

      - name: Mark Increment 48 complete as the final source change
        if: steps.state.outputs.already_complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path('docs/morphhdl/parameterized-verilog-todo.md')
          text = path.read_text()
          updated, count = re.subn(
              r'(?m)^- \[ \] (\*\*Increment 48\b)',
              r'- [x] \1',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Increment 48 unchecked roadmap entry not found')
          path.write_text(updated)
          PY
          test "$(git diff --name-only | paste -sd ' ' -)" = 'docs/morphhdl/parameterized-verilog-todo.md'
          git diff --check
          git add -- docs/morphhdl/parameterized-verilog-todo.md
          git diff --cached --check
          git commit -m 'Complete Increment 48 roadmap'
          git push origin HEAD:agent/increment-48-natural-symbolic-conditionals

      - name: Verify final branch scope and merge pull request
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin parameterized-verilog agent/increment-48-natural-symbolic-conditionals
          git reset --hard origin/agent/increment-48-natural-symbolic-conditionals
          grep -qE '^- \[x\] \*\*Increment 48\b' docs/morphhdl/parameterized-verilog-todo.md
          test ! -e .github/increment48/implement.py
          test ! -e .github/workflows/morphhdl-increment-48-implementation.yml
          test ! -e .github/workflows/morphhdl-increment-48-complete.yml
          test ! -e .github/workflows/morphhdl-increment-48-offline-export.yml
          test ! -e tmp-tool-probe.txt
          test "$(git diff --name-only origin/parameterized-verilog...HEAD -- core/src/main/scala lib/src/main/scala | wc -l)" -eq 0
          git diff --check origin/parameterized-verilog...HEAD

          gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --title 'Increment 48: natural symbolic conditionals' \
            --body $'## Summary\n\n- transform natural Scala `if` only after explicit symbolic-candidate selection and typed `HdlBool` proof\n- retain both alternatives through the existing generic structural-capture path while preserving ordinary witness-selected Spinal elaboration\n- leave ordinary Scala `Boolean` conditionals unchanged and provide no implicit `HdlBool`-to-`Boolean` conversion\n- cover simple `if`/`else`, chained `else if`, diagnostics, deterministic regeneration, strict Verilog-2001 override simulation, and Scala 2.12.18/2.13.12\n- preserve zero changes under upstream-owned native `core` and `lib` source\n\nAll Increment 48 hosted gates passed before the final roadmap checkbox commit.'
          gh pr ready "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" || true
          head_sha=$(git rev-parse HEAD)
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --squash \
            --delete-branch \
            --match-head-commit "${head_sha}" \
            --subject 'Increment 48: natural symbolic conditionals' \
            --body 'Typed natural symbolic branch capture with dual-Scala, strict Verilog-2001, regression, preservation and diagnostic validation.'
          gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --json state,mergedAt,mergeCommit,url

name: Lane and when expression reproduction

on:
  push:
    branches: [agent/lane-when-expression-inlining]
    paths:
      - '.github/workflows/lane-when-expression-diagnostic.yml'
      - 'morphhdl/src/test/scala/morphhdl/GenerateLaneExpressionExample.scala'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      SBT_TEST_PARALLEL: '0'
      JVM_OPTS: '-Xmx3G -Xss4M -XX:ActiveProcessorCount=2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 26f315eb6ce83cc8dc59b40494797bc0fb72db48
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - name: Run the pinned reproduction without compiler changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lane-repro
          git rev-parse HEAD HEAD^{tree} > /tmp/lane-repro/identity.txt
          sbt '++2.12.18' 'morph/Test/runMain morphhdl.GenerateLaneExpressionExample /tmp/lane-repro/rtl' 2>&1 | tee /tmp/lane-repro/sbt.log
          cat /tmp/lane-repro/rtl/LaneExpressionExample.v
      - name: Compile the same artifact for both PPC4 bindings
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          iverilog -g2001 -s LaneExpressionExample -P LaneExpressionExample.PPC4=0 -o /tmp/lane-repro/ppc1.vvp /tmp/lane-repro/rtl/LaneExpressionExample.v
          iverilog -g2001 -s LaneExpressionExample -P LaneExpressionExample.PPC4=1 -o /tmp/lane-repro/ppc4.vvp /tmp/lane-repro/rtl/LaneExpressionExample.v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-when-baseline-reproduction
          path: /tmp/lane-repro/
          if-no-files-found: error
          retention-days: 14

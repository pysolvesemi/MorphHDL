name: Increment 53e bootstrap

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write

concurrency:
  group: increment-53e-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'Apply Increment 53e bootstrap')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact MorphHDL-owned source patches
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/apply-increment-53e-bootstrap.py

      - name: Commit patched sources
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Increment 53e bootstrap is already applied"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala \
            docs/morphhdl/parameterized-verilog-todo.md
          git commit -m "Apply Increment 53e bootstrap for native StreamFifoCC"
          git push origin HEAD:${GITHUB_REF_NAME}

name: Agent Increment 37 definitive implementation gate

on:
  push:
    branches:
      - agent/increment-37-parameterized-streamfifo-depth
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-37-definitive-${{ github.sha }}
  cancel-in-progress: false

jobs:
  implement-test-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Increment 37 shared-source refactor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p morphhdl/src/test/scala/morphhdl
          printf '// generated after shared source application\n' > \
            morphhdl/src/test/scala/morphhdl/ParameterizedStreamFifoDepthTests.scala
          python .github/agent/increment-37-apply.py
          python .github/agent/increment-37-repair1.py
          python .github/agent/increment-37-testgen.py
          python .github/agent/increment-37-repair2.py
          git diff --check
          test -f docs/morphhdl/increment-37-parameterized-streamfifo-depth.md
          grep -q 'class ParameterizedStreamFifoDepthTests' \
            morphhdl/src/test/scala/morphhdl/ParameterizedStreamFifoDepthTests.scala
          grep -q 'Vector(1, 3, 5, 8)' \
            morphhdl/src/test/scala/morphhdl/ParameterizedStreamFifoDepthTests.scala
          grep -q -- '- \[ \] \*\*Increment 37 — Parameterized StreamFifo depth\*\*' \
            docs/morphhdl/parameterized-verilog-todo.md

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0-mill.sh \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Test Increment 37 on Scala 2.12.18
        shell: bash
        run: |
          set -o pipefail
          /tmp/morphhdl-mill morph[2.12.18].testOnly \
            morphhdl.ParameterizedStreamFifoDepthTests \
            morphhdl.NativeLibraryReuseTests \
            morphhdl.NativeSymbolicMemoryTests 2>&1 | tee /tmp/increment-37-scala-2.12.log
          /tmp/morphhdl-mill core[2.12.18].testOnly \
            spinal.core.internals.ParameterizedVerilogTests \
            spinal.core.internals.ParameterizedDataShapeTests 2>&1 | tee -a /tmp/increment-37-scala-2.12.log

      - name: Test Increment 37 on Scala 2.13.12
        shell: bash
        run: |
          set -o pipefail
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.ParameterizedStreamFifoDepthTests \
            morphhdl.NativeLibraryReuseTests \
            morphhdl.NativeSymbolicMemoryTests 2>&1 | tee /tmp/increment-37-scala-2.13.log
          /tmp/morphhdl-mill core[2.13.12].testOnly \
            spinal.core.internals.ParameterizedVerilogTests \
            spinal.core.internals.ParameterizedDataShapeTests 2>&1 | tee -a /tmp/increment-37-scala-2.13.log

      - name: Capture Increment 37 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: increment-37-definitive-diagnostics
          path: |
            /tmp/increment-37-scala-2.12.log
            /tmp/increment-37-scala-2.13.log
            morphhdl/src/test/scala/morphhdl/ParameterizedStreamFifoDepthTests.scala
            core/src/main/scala/spinal/core/ParameterizedMemory.scala
            core/src/main/scala/spinal/core/internals/ParameterizedVerilogMemories.scala
            lib/src/main/scala/spinal/lib/ParameterizedStreamFifoDepth.scala
            lib/src/main/scala/spinal/lib/Stream.scala
          if-no-files-found: warn
          retention-days: 1

      - name: Finalize tested source and roadmap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/morphhdl/parameterized-verilog-todo.md')
          text = p.read_text()
          old = '- [ ] **Increment 37 — Parameterized StreamFifo depth**'
          new = '- [x] **Increment 37 — Parameterized StreamFifo depth**'
          if old not in text:
              raise SystemExit('Increment 37 unchecked roadmap entry not found')
          p.write_text(text.replace(old, new, 1))
          PY
          rm -rf .github/agent
          rm -f .github/workflows/agent-increment-37-*.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Increment 37 parameterized StreamFifo depth'
          if ! git push origin HEAD:agent/increment-37-parameterized-streamfifo-depth; then
            git fetch origin agent/increment-37-parameterized-streamfifo-depth
            remote=origin/agent/increment-37-parameterized-streamfifo-depth
            if git show "${remote}:docs/morphhdl/parameterized-verilog-todo.md" | \
                 grep -q -- '- \[x\] \*\*Increment 37 — Parameterized StreamFifo depth\*\*' \
              && ! git ls-tree -r --name-only "${remote}" | \
                 grep -Eq '^\.github/(agent/|workflows/agent-increment-37-)'; then
              echo 'Another validated gate already finalized the branch.'
              exit 0
            fi
            echo 'Increment 37 branch advanced without a validated final source.' >&2
            exit 1
          fi

name: Increment 53e independent multiclock formal equivalence

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write

concurrency:
  group: increment-53e-multiclock-formal
  cancel-in-progress: true

jobs:
  formal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0

      - name: Configure exact checkout
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin agent/increment-53e-native-streamfifocc-parameterization
          git reset --hard origin/agent/increment-53e-native-streamfifocc-parameterization
          git rev-parse HEAD >/tmp/validated-head

      - name: Verify generic compiler boundary
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl/scripts/check-generic-native-int-compiler.sh
          bash morphhdl/scripts/check-generic-parameterized-width-engine.sh
          bash morphhdl/scripts/check-native-streamfifocc-parameterization-boundary.sh

      - name: Materialize corrected formal proof source
        shell: bash
        run: |
          set -euo pipefail
          test_file=morphhdl/src/test/scala/morphhdl/NativeStreamFifoCCFormalEquivalenceTests.scala
          if ! test -f "$test_file"; then
            python3 morphhdl/scripts/apply-increment-53e-generic-multiclock-formal-test.py
          fi
          if grep -q 'candidate: Path' "$test_file"; then
            python3 morphhdl/scripts/apply-increment-53e-formal-reset-mode-candidates.py
          fi
          if grep -q 'val depth = HdlInt.param' "$test_file" && \
             grep -A7 'private def generate' "$test_file" | grep -q 'val depth'; then
            python3 morphhdl/scripts/apply-increment-53e-formal-fresh-boundaries.py
          fi
          git diff --check

      - name: Install pinned Mill and formal tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/mill
          chmod +x /tmp/mill
          if ! command -v sby >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends git make python3 yosys boolector
            rm -rf /tmp/sby
            git clone --depth 1 https://github.com/YosysHQ/sby.git /tmp/sby
            make -C /tmp/sby install PREFIX=/usr/local
          fi
          yosys -V
          sby -h >/dev/null
          yosys-smtbmc -h >/dev/null
          boolector --version

      - name: Compile both lanes and run solver-backed proof
        shell: bash
        env:
          MORPHDL_RUN_STREAMFIFOCC_FORMAL_EQUIVALENCE: "1"
          MORPHDL_STREAMFIFOCC_FORMAL_WORKSPACE: /tmp/streamfifocc-formal
        run: |
          set -euo pipefail
          /tmp/mill 'morph[2.12.18].testOnly' \
            morphhdl.NativeStreamFifoCCFormalEquivalenceTests \
            2>&1 | tee /tmp/53e-formal-2.12.log
          unset MORPHDL_RUN_STREAMFIFOCC_FORMAL_EQUIVALENCE
          /tmp/mill 'morph[2.13.12].testOnly' \
            morphhdl.NativeStreamFifoCCFormalEquivalenceTests \
            2>&1 | tee /tmp/53e-formal-generation-2.13.log

      - name: Upload complete proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53e-multiclock-formal-evidence
          path: |
            /tmp/53e-formal-*.log
            /tmp/streamfifocc-formal
          if-no-files-found: ignore

      - name: Publish only passing formal source
        shell: bash
        run: |
          set -euo pipefail
          validated=$(cat /tmp/validated-head)
          remote=$(git ls-remote origin refs/heads/agent/increment-53e-native-streamfifocc-parameterization | awk '{print $1}')
          test "$validated" = "$remote"
          rm -f .github/workflows/increment-53e-formal-source-gate.yml
          rm -f .github/workflows/increment-53e-multiclock-formal.yml
          rm -f morphhdl/scripts/apply-increment-53e-generic-multiclock-formal-test.py
          rm -f morphhdl/scripts/apply-increment-53e-formal-reset-mode-candidates.py
          rm -f morphhdl/scripts/apply-increment-53e-formal-fresh-boundaries.py
          git add -A
          git diff --cached --check
          git commit -m 'Increment 53e: add proven multiclock native equivalence'
          git push origin HEAD:agent/increment-53e-native-streamfifocc-parameterization

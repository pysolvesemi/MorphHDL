name: Apply reviewed standalone source-inventory correction
on:
  push:
    branches: [agent/independent-parameter-domain-composition]
    paths:
      - '.github/workflows/independent-parameter-root-inventory-repair.yml'
      - '.github/independent-root-inventory.patch'
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'pysolvesemi/MorphHDL'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact reviewed correction, verify it and remove this one-shot importer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, subprocess
          from pathlib import Path
          branch = 'agent/independent-parameter-domain-composition'
          base = '2ff1418e0a73bb9fb461ef0637a3e4b5c95ec0f8'
          transient = ['.github/workflows/independent-parameter-root-inventory-repair.yml', '.github/independent-root-inventory.patch']
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          start = git('rev-parse', 'HEAD')
          assert start == os.environ['GITHUB_SHA']
          assert not git('status', '--porcelain')
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, start], check=True)
          assert set(git('diff', '--name-only', base, start).splitlines()) == set(transient)
          evidence = Path(os.environ['RUNNER_TEMP']) / 'root-inventory-evidence'
          evidence.mkdir()
          patch = Path(transient[1]).read_bytes()
          assert len(patch) == 6026
          assert hashlib.sha256(patch).hexdigest() == 'f0551525436d839a3798d64b420ecd11e76848f19b83aa325df403c07a498251'
          patch_path = evidence / 'reviewed.patch'
          patch_path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '--check', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch_path)], check=True)
          subprocess.run(['git', 'rm', *transient], check=True)
          assert git('write-tree') == '3655d1777b7d958a02129f1102378a597c62e352'
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          commands = [
              ['python3', 'morphhdl/scripts/check-native-source-preservation.py'],
              ['python3', 'morphhdl/scripts/check-production-retirement.py'],
              ['python3', 'morphhdl/scripts/check-typed-layering-ir.py'],
              ['python3', 'morphhdl/scripts/check-typed-layering-ir.py', '--self-test'],
              ['python3', '-m', 'unittest', 'discover', '-s', 'repro/independent-parameters', '-p', 'test_*.py', '-v'],
          ]
          with (evidence / 'verification.log').open('w') as log:
              for command in commands:
                  log.write(repr(command) + '\n'); log.flush()
                  subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, check=True)
          assert git('write-tree') == '3655d1777b7d958a02129f1102378a597c62e352'
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix(ci): include standalone reproducer in live typed-layering audit', '-m', 'Register the exact high-level application source root in the closed inventory and all applicable rules. Checker logic is unchanged. Add four adversarial root-coverage tests and invoke live source guards as well as their self-tests. The exact reviewed tree passed all live checks and 24 Python tests. Final source-overlay resealing and final-head CI remain required.'], check=True)
          (evidence / 'head.txt').write_text(git('rev-parse', 'HEAD') + '\n')
          subprocess.run(['git', 'bundle', 'create', str(evidence / 'source.bundle'), 'HEAD', '^' + base], check=True)
          remote = git('ls-remote', '--exit-code', 'origin', 'refs/heads/' + branch).split()[0]
          assert remote == start, 'branch moved; refusing to overwrite concurrent work'
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + branch], check=True)
          print('PUBLISHED_ROOT_INVENTORY_FIX ' + git('rev-parse', 'HEAD'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-root-inventory-${{ github.sha }}
          path: ${{ runner.temp }}/root-inventory-evidence/
          if-no-files-found: warn

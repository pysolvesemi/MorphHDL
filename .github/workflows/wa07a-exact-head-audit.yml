name: WA-07a exact repaired source audit
on:
  push:
    branches: [agent/wa-07a-exact-head-audit]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d4fad2c28a002b8e1b24f0807c9f88d278f2b940
      - name: Archive exact reviewed source and Git metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          git archive --format=tar.gz HEAD > audit/source.tar.gz
          git rev-parse HEAD > audit/commit.txt
          git rev-parse HEAD^{tree} > audit/tree.txt
          git cat-file commit HEAD > audit/commit-object.txt
          git ls-tree -r HEAD > audit/git-tree.txt
          sha256sum audit/source.tar.gz > audit/archive-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wa07a-exact-d4-source
          path: audit
          if-no-files-found: error
          retention-days: 7

name: WA-07a exact failed-run logs
on:
  push:
    branches: [agent/wa-07a-exact-head-audit]
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retain exact run metadata and original log bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/pysolvesemi/MorphHDL/actions/runs/33974810909 > diagnostics/run.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          run=json.loads(Path('diagnostics/run.json').read_text())
          assert run['head_sha']=='e682b73f1f6764cd9c47fb9d7364b44c0ba12ba0',run['head_sha']
          assert run['status']=='completed',run['status']
          PY
          curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/pysolvesemi/MorphHDL/actions/runs/33974810909/jobs > diagnostics/jobs.json
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/pysolvesemi/MorphHDL/actions/runs/33974810909/logs > diagnostics/run-logs.zip
          sha256sum diagnostics/run-logs.zip > diagnostics/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wa07a-e682-original-logs
          path: diagnostics
          if-no-files-found: error
          retention-days: 3

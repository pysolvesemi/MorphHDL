name: Apply Increment 50 integration repair

on:
  push:
    branches:
      - agent/increment-50-native-int-expressions
    paths:
      - .github/workflows/increment-50-apply-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-50-apply-repair
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-50-native-int-expressions
          fetch-depth: 0

      - name: Apply reviewed repair and remove delivery scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git apply --check -p1 .github/increment-50-repair.patch
          git apply -p1 .github/increment-50-repair.patch
          rm -f \
            .github/increment-50-repair.patch \
            .github/workflows/increment-50-apply-repair.yml \
            .github/workflows/increment-50-source-export.yml

          git config user.name "pysolvesemi"
          git config user.email "pysolvesemi@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair Increment 50 compiler and frontend integration"
          git push origin HEAD:agent/increment-50-native-int-expressions

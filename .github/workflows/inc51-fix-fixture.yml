name: Apply Increment 51 branch fixture repair

on:
  push:
    branches:
      - agent/increment-51-native-int-branch-capture
    paths:
      - .github/workflows/inc51-fix-fixture.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-51-fix-fixture
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-51-native-int-branch-capture
          fetch-depth: 0
      - name: Replace width-changing branch stimulus and remove delivery workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('morphhdl/src/test/scala/morphhdl/NativeIntSymbolicConditionalTests.scala')
          text = path.read_text()
          replacements = [
              ('''    protected final def attach(value: Bits): Unit = {
                val branch = Bits(8 bits)
                branch := value.resized
                val sink = new Sink
                sink.din := branch
              }
          ''', '''    protected final def attach(value: Int): Unit = {
                val branch = Bits(8 bits)
                branch := B(value, 8 bits)
                val sink = new Sink
                sink.din := branch
              }
          '''),
              ('''    if (root > 16) attach(din)
              else if (medium) attach(~din)
              else attach(din)
          ''', '''    if (root > 16) attach(0x11)
              else if (medium) attach(0x22)
              else attach(0x33)
          '''),
              ('''    if (chooseInverted) attach(~din) else attach(din)
          ''', '''    if (chooseInverted) attach(0x44) else attach(0x55)
          '''),
              ('''    if (isPow2(root)) attach(din) else attach(~din)
          ''', '''    if (isPow2(root)) attach(0x66) else attach(0x77)
          '''),
              ('''      if (root > 24) attach(din) else attach(~din)
              } else attach(din)
          ''', '''      if (root > 24) attach(0x88) else attach(0x99)
              } else attach(0xaa)
          '''),
              ('''    if (!wide) attach(din) else attach(~din)
          ''', '''    if (!wide) attach(0xbb) else attach(0xcc)
          '''),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one fixture fragment, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm -f .github/workflows/inc51-fix-fixture.yml
          git config user.name "pysolvesemi"
          git config user.email "pysolvesemi@gmail.com"
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "Use fixed-width Increment 51 branch fixtures"
          git push origin HEAD:agent/increment-51-native-int-branch-capture

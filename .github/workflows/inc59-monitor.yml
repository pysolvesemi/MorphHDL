name: Increment 59 completion monitor

on:
  push:
    branches:
      - agent/inc59-monitor

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: increment-59-completion-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out status branch
        uses: actions/checkout@v4
        with:
          ref: agent/inc59-monitor-results
          fetch-depth: 0

      - name: Publish authenticated completion state until terminal
        shell: bash
        env:
          API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "MorphHDL Increment 59 monitor"
          git config user.email "actions@users.noreply.github.com"
          for attempt in $(seq 1 700); do
            API_TOKEN="$API_TOKEN" python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          token = os.environ['API_TOKEN']
          api = 'https://api.github.com/repos/pysolvesemi/MorphHDL'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get(path):
              request = urllib.request.Request(api + path, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          expected = {
              'bootstrap': ('agent/inc59-final', 'Increment 59 completion bootstrap'),
              'observer': ('agent/inc59-observer', 'Increment 59 independent completion observer'),
              'supervisor': ('agent/inc59-supervisor', 'Increment 59 completion supervisor'),
          }
          statuses = {}
          for label, (branch, name) in expected.items():
              query = urllib.parse.urlencode({'branch': branch, 'per_page': 100})
              payload = get('/actions/runs?' + query)
              runs = [run for run in payload.get('workflow_runs', []) if run.get('name') == name]
              if runs:
                  run = max(runs, key=lambda value: value['id'])
                  statuses[label] = {
                      'id': run['id'],
                      'status': run.get('status'),
                      'conclusion': run.get('conclusion'),
                      'head_sha': run.get('head_sha'),
                      'url': run.get('html_url'),
                  }
              else:
                  statuses[label] = {'status': 'missing', 'conclusion': None}

          query = urllib.parse.urlencode({
              'state': 'all',
              'head': 'pysolvesemi:agent/inc59-final',
              'base': 'parameterized-verilog',
              'per_page': 100,
          })
          pulls = get('/pulls?' + query)
          pull_records = [
              {
                  'number': pull['number'],
                  'state': pull['state'],
                  'merged_at': pull.get('merged_at'),
                  'merge_commit_sha': pull.get('merge_commit_sha'),
                  'url': pull.get('html_url'),
              }
              for pull in pulls
          ]
          merged = next((pull for pull in pull_records if pull['merged_at']), None)
          active = any(value.get('status') in {'queued', 'in_progress', 'requested', 'waiting', 'pending'} for value in statuses.values())
          successes = [label for label, value in statuses.items() if value.get('conclusion') == 'success']
          completed_failures = [
              label for label, value in statuses.items()
              if value.get('status') == 'completed' and value.get('conclusion') != 'success'
          ]
          if merged:
              overall = 'merged'
          elif active:
              overall = 'running'
          elif successes:
              overall = 'verified-awaiting-merge'
          elif len(completed_failures) == len(statuses):
              overall = 'failed'
          else:
              overall = 'waiting'

          result = {
              'updated_at': datetime.now(timezone.utc).isoformat(),
              'overall': overall,
              'runs': statuses,
              'pull_requests': pull_records,
          }
          Path('inc59-monitor-status.json').write_text(json.dumps(result, indent=2) + '\n')
          for marker in Path('.').glob('INC59_*'):
              marker.unlink()
          Path('INC59_' + overall.upper().replace('-', '_')).write_text(result['updated_at'] + '\n')
          PY
            git add inc59-monitor-status.json INC59_* || true
            if ! git diff --cached --quiet; then
              git commit -m "Update Increment 59 completion status"
              git push origin HEAD:agent/inc59-monitor-results
            fi
            overall="$(python3 -c 'import json; print(json.load(open("inc59-monitor-status.json"))["overall"])')"
            if [[ "$overall" == merged ]]; then
              exit 0
            fi
            if [[ "$overall" == failed ]]; then
              exit 1
            fi
            sleep 30
          done
          exit 1

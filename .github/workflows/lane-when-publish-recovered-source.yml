name: Publish recovered lane-condition source
on:
  push:
    branches: [agent/lane-when-expression-inlining]
    paths: ['.github/workflows/lane-when-publish-recovered-source.yml']
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'pysolvesemi/MorphHDL' && github.ref == 'refs/heads/agent/lane-when-expression-inlining'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Recover only the six checksum-bound production files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/lane-when-repair/recovery-edits.json)" = b12dc70195463b413775c60e90bcfe9a0646ee8a
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/agent/lane-when-expression-inlining | cut -f1)" = "$GITHUB_SHA"
          python3 .github/lane-when-repair/apply.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          root = Path.cwd()
          spec = json.loads((root / '.github/lane-when-repair/recovery-edits.json').read_text())
          assert len(spec) == 6
          prepared = {}
          for path, entry in spec.items():
              raw = (root / path).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == entry['prepared_sha256'], path
              text = raw.decode('utf-8')
              for before, after in entry['edits']:
                  assert text.count(before) == 1, path
                  text = text.replace(before, after, 1)
              data = text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == entry['final_sha256'], path
              prepared[path] = data
          for path, data in prepared.items():
              (root / path).write_bytes(data)
          changed = subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0')
          assert set(filter(None, changed)) == set(spec)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *spec], check=True)
          evidence = Path('/tmp/lane-published-source')
          evidence.mkdir()
          (evidence / 'source-sha256.json').write_text(json.dumps({p: e['final_sha256'] for p, e in spec.items()}, indent=2) + '\n')
          (evidence / 'STATUS.txt').write_text('Recovered production blobs match local commit 52ffd62329ea558cb09fb316e2f453f25ee02e9e. This is WIP source publication only; source-review, full tests, final-head CI and merge remain pending.\n')
          PY
      - name: Publish an ordinary fast-forward WIP commit without changing workflows or audit gates
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/lane-when-repair/apply.py .github/lane-when-repair/condition-methods.scala.inc .github/lane-when-repair/recovery-edits.json
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'wip: recover exact tested lane-condition production repair' -m 'All six production blobs match local commit 52ffd62329ea558cb09fb316e2f453f25ee02e9e. Retain every audit and qualification gate. The expanded regression suite, legitimate successor source approvals and final-head CI are still required; do not merge.'
          test "$(git ls-remote origin refs/heads/agent/lane-when-expression-inlining | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/agent/lane-when-expression-inlining
          git rev-parse HEAD 'HEAD^{tree}' > /tmp/lane-published-source/identity.txt
          git diff "$GITHUB_SHA" HEAD > /tmp/lane-published-source/publication.patch
          git bundle create /tmp/lane-published-source/publication.bundle HEAD ^5af29019efc4ae368dcecaa315502befbb2282aa
          cd /tmp/lane-published-source
          sha256sum STATUS.txt source-sha256.json identity.txt publication.patch publication.bundle > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-recovered-production-source
          path: /tmp/lane-published-source/
          if-no-files-found: warn
          retention-days: 14

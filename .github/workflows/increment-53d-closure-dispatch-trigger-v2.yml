name: Dispatch Increment 53d closure after typed publication v2

on:
  push:
    branches:
      - agent/increment-53d-typed-elabint-pivot
    paths:
      - .github/workflows/increment-53d-closure-dispatch-trigger-v2.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  wait-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-typed-elabint-pivot
          fetch-depth: 0
      - name: Wait for validated typed source commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            git fetch --quiet origin agent/increment-53d-typed-elabint-pivot
            if git log -150 --format='%s' FETCH_HEAD \
              | grep -Fxq 'Use direct ElabInt widths in StreamWidthAdapter'; then
              exit 0
            fi
            sleep 10
          done
          echo 'typed StreamWidthAdapter publication commit was not observed' >&2
          exit 1
      - name: Dispatch final closure workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run increment-53d-final-closure.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref agent/increment-53d-typed-elabint-pivot

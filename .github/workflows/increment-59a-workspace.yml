name: Increment 59a source checkpoint
on:
  push:
    branches: [agent/increment-59a-recursive-verilog-module]
permissions:
  contents: read
jobs:
  snapshot:
    if: startsWith(github.event.head_commit.message, 'Export Increment 59a source checkpoint')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Archive tracked sources without git credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-checkpoint
          git archive --format=tar.gz --output=source-checkpoint/head.tar.gz HEAD
          git archive --format=tar.gz --output=source-checkpoint/base.tar.gz 8f65bebf071445946bc905b447d64944aaa47235
          git rev-parse HEAD > source-checkpoint/head-sha.txt
          git ls-tree -r HEAD > source-checkpoint/head-tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: increment-59a-source-checkpoint
          path: source-checkpoint
          if-no-files-found: error

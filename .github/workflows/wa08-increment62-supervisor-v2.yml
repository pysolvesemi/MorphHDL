    expected = set(paths) | {HELPER_PATH, CONTRACT}
    changed = {path.decode() for path in
               git(root, "diff", "--no-renames", "--name-only", "-z", BASE, head).split(b"\0")
               if path}
    actual = {path for path in changed if governed(path)}
    require(actual == expected,
            "governed delta differs; missing=" + repr(sorted(expected - actual)) +
            "; unreviewed=" + repr(sorted(actual - expected)))
    dirty = set()
    for arguments in (("diff", "--cached", "--name-only", "-z", head),
                      ("diff", "--name-only", "-z"),
                      ("ls-files", "--others", "--exclude-standard", "-z")):
        dirty |= {path.decode() for path in git(root, *arguments).split(b"\0")
                  if path and governed(path.decode())}
    require(not dirty,
            "staged, unstaged or untracked governed content: " + repr(sorted(dirty)))
    handoff = regular(root, "morphir/src/main/scala/morphhdl/ir/v1/Handoff.scala").decode()
    adapter = regular(root, "morphhdl-passes/src/main/scala/morphhdl/passes/adapter/CanonicalIrPassAdapter.scala").decode()
    require("case object PureWireExpressionsV1" in handoff and
            "case object PureExpressions" in handoff and
            "CanonicalIrProfile.PureWireExpressionsV1" in handoff,
            "production profile/facet claim is missing")
    require("handoff.profile == CanonicalIrHandoff.productionProfile" in adapter,
            "pass adapter does not require production profile")
    return tuple(sorted(records))


def verify(root: Path) -> bool:
    root = root.resolve()
    head = git(root, "rev-parse", "HEAD").decode().strip()
    _verify(str(root), head)
    return True


def records(root: Path) -> dict[str, dict]:
    verify(root)
    return {entry["path"]: entry for entry in load_contract(root)["files"]}


def restore_source(root: Path, path: str, source: bytes) -> bytes:
    entries = records(root)
    if path not in entries:
        return source
    entry = entries[path]
    before = object_bytes(root, entry["baseline_commit"], path) or b""
    if source == before:
        return source
    require(digest(source) == entry["final_sha256"],
            "cannot restore unknown bytes: " + path)
    return before


def inherited_inventory(root: Path, paths: set[str], revision: str) -> set[str]:
    entries = records(root)
    overlay = {path for path, entry in entries.items() if entry["production"]}
    previous = {path.decode() for path in
                git(root, "diff", "--no-renames", "--name-only", "-z", revision, BASE).split(b"\0")
                if path}
    return (set(paths) - overlay) | (previous & overlay)


def reject(root: Path, label: str) -> None:
    result = subprocess.run([sys.executable, HELPER_PATH, "--repo-root", str(root)], cwd=root,
                            stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                            check=False, timeout=120)
    require(result.returncode != 0, "attack was accepted: " + label)


def self_test(root: Path) -> None:
    root = root.resolve()
    verify(root)
    entries = records(root)
    rejected = 0
    for path, entry in entries.items():
        raw = reviewed_bytes(root, path, entry["mode"])
        before = object_bytes(root, entry["baseline_commit"], path) or b""
        require(restore_source(root, path, raw) == before,
                "positive restoration failed: " + path)
        mutation = raw[:-1] + bytes([raw[-1] ^ 1]) if raw else b"x"
        try:
            restore_source(root, path, mutation)
        except RuntimeError:
            rejected += 1
        else:
            raise RuntimeError("Increment 62 WA-08 overlay: mutated bytes restored: " + path)
    victim = next(path for path, entry in entries.items()
                  if entry["layer"] == "feature" and entry["mode"] == "100644")
    with tempfile.TemporaryDirectory(prefix="morphhdl-wa08-overlay-") as directory:
        fixture = Path(directory) / "repo"
        subprocess.run(["git", "clone", "--no-local", str(root), str(fixture)],
                       stdout=subprocess.DEVNULL, stderr=subprocess.PIPE,
                       check=True, timeout=120)
        subprocess.run(["git", "checkout", "--detach",
                        git(root, "rev-parse", "HEAD").decode().strip()], cwd=fixture,
                       stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, check=True)
        def reset() -> None:
            subprocess.run(["git", "reset", "--hard", "HEAD"], cwd=fixture,
                           stdout=subprocess.DEVNULL, check=True)
            subprocess.run(["git", "clean", "-fd"], cwd=fixture,
                           stdout=subprocess.DEVNULL, check=True)
        def attack(label: str, mutate) -> None:
            nonlocal rejected
            reset()
            mutate()
            reject(fixture, label)
            rejected += 1
        attack("changed bytes",
               lambda: (fixture / victim).write_bytes((fixture / victim).read_bytes() + b"\n"))
        attack("missing file", lambda: (fixture / victim).unlink())
        attack("executable mode", lambda: os.chmod(fixture / victim, 0o755))
        def linked() -> None:
            (fixture / victim).unlink()
            (fixture / victim).symlink_to("/dev/null")
        attack("symlink", linked)
        def staged() -> None:
            (fixture / victim).write_bytes((fixture / victim).read_bytes() + b"\n")
            subprocess.run(["git", "add", victim], cwd=fixture, check=True)
        attack("staged mutation", staged)
        def unknown() -> None:
            path = fixture / "morphhdl/src/main/scala/morphhdl/UnknownWa08Overlay.scala"
            path.parent.mkdir(parents=True, exist_ok=True)
            path.write_text("package morphhdl\n")
        attack("untracked source", unknown)
        attack("contract tamper",
               lambda: (fixture / CONTRACT).write_bytes((fixture / CONTRACT).read_bytes() + b" "))
        def profile() -> None:
            path = fixture / "morphir/src/main/scala/morphhdl/ir/v1/Handoff.scala"
            path.write_text(path.read_text().replace("PureWireExpressionsV1",
                                                     "PureWireExpressionsV0", 1))
        attack("profile mutation", profile)
    print("INCREMENT_62_WA08_OVERLAY_PASS files=" + str(len(entries)) +
          " rejected=" + str(rejected))


def main() -> None:
    parser = argparse.ArgumentParser(description=__doc__)
    parser.add_argument("--repo-root", type=Path,
                        default=Path(__file__).resolve().parents[2])
    parser.add_argument("--self-test", action="store_true")
    args = parser.parse_args()
    self_test(args.repo_root) if args.self_test else verify(args.repo_root)
    if not args.self_test:
        print("INCREMENT_62_WA08_OVERLAY_PASS")


if __name__ == "__main__":

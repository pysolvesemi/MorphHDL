"""Exact Increment 62 compatibility overlay for the WA-08 production handoff."""
from __future__ import annotations
import argparse
import functools
import hashlib
import json
import os
import re
import stat
import subprocess
import sys
import tempfile
from pathlib import Path

BASE = __BASE__
QUALIFIED = __QUALIFIED__
CONTRACT = __CONTRACT__
CONTRACT_SHA256 = __CONTRACT_SHA__
HELPER_PATH = __HELPER__


def require(ok: bool, detail: str) -> None:
    if not ok:
        raise RuntimeError("Increment 62 WA-08 overlay: " + detail)


def digest(data: bytes) -> str:
    return hashlib.sha256(data).hexdigest()


def git(root: Path, *args: str) -> bytes:
    result = subprocess.run(["git", *args], cwd=root, stdout=subprocess.PIPE,
                            stderr=subprocess.PIPE, check=False, timeout=120)
    require(result.returncode == 0,
            "git command failed: " + " ".join(args) + "\n" +

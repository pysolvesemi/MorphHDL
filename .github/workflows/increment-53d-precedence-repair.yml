name: Publish Increment 53d width-function predicate isolation repair

on:
  push:
    branches:
      - agent/increment-53d-native-streamwidth-adapter
    paths:
      - .github/workflows/increment-53d-precedence-repair.yml

permissions:
  contents: write

jobs:
  repair-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out exact Increment 53d branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-native-streamwidth-adapter
          fetch-depth: 0

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Restrict constant predicate folding to native width functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          registry = Path(
              "morphruntime/src/main/scala/spinal/core/ExternalNativeIntShadowRegistry.scala"
          )
          text = registry.read_text(encoding="utf-8")
          marker = "  def boundaryActive: Boolean = currentBoundary.nonEmpty\n"
          addition = '''

  /**
    * Domain-constant branch folding is local to an ordinary native
    * width-function call. Constructor boundaries such as StreamFifo retain
    * their established structural capture even when a narrowed caller domain
    * makes one predicate constant.
    */
  private[core] def nativeWidthFunctionBoundaryActive: Boolean =
    currentBoundary.exists(_.token.role == "nativeWidthFunction")
'''
          if "nativeWidthFunctionBoundaryActive" not in text:
              if text.count(marker) != 1:
                  raise SystemExit(
                      "expected one native boundary activity marker, "
                      f"found {text.count(marker)}"
                  )
              text = text.replace(marker, marker + addition, 1)
              registry.write_text(text, encoding="utf-8")

          runtime = Path(
              "morphruntime/src/main/scala/spinal/core/ExternalNativeIntCompilerRuntime.scala"
          )
          text = runtime.read_text(encoding="utf-8")
          start = text.find("  private def constantPredicate(\n")
          if start < 0:
              raise SystemExit("constantPredicate declaration not found")
          body_marker = "  ): Option[Boolean] = {\n"
          body = text.find(body_marker, start)
          if body < 0:
              raise SystemExit("constantPredicate body marker not found")
          insertion = body + len(body_marker)
          guard = '''    if (!ExternalNativeIntShadowRegistry.nativeWidthFunctionBoundaryActive)
      return None

'''
          if guard not in text[start:]:
              text = text[:insertion] + guard + text[insertion:]
              runtime.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git diff -- \
            morphruntime/src/main/scala/spinal/core/ExternalNativeIntShadowRegistry.scala \
            morphruntime/src/main/scala/spinal/core/ExternalNativeIntCompilerRuntime.scala

      - name: Validate focused contracts on Scala 2.13.12
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.ParameterizedStreamFifoDepthTests \
            morphhdl.ParameterizedStreamWidthAdapterTests \
            morphhdl.BackendSyncMergeIsolationTests \
            morphhdl.CapturedAssignmentNormalizationTests \
            morphhdl.NativeIntSymbolicConditionalTests \
            morphhdl.ExternalNativeIntShadowExpressionTests

      - name: Validate focused contracts on Scala 2.12.18
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morph[2.12.18].testOnly \
            morphhdl.ParameterizedStreamFifoDepthTests \
            morphhdl.ParameterizedStreamWidthAdapterTests \
            morphhdl.BackendSyncMergeIsolationTests \
            morphhdl.CapturedAssignmentNormalizationTests \
            morphhdl.NativeIntSymbolicConditionalTests \
            morphhdl.ExternalNativeIntShadowExpressionTests

      - name: Validate zero native-source edits
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl/scripts/check-native-stream-width-adapter-boundary.sh

      - name: Commit validated repair and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/increment-53d-full-suite-diagnostic.yml \
            .github/workflows/increment-53d-precedence-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: isolate width-function predicate folding"
          git push origin HEAD:agent/increment-53d-native-streamwidth-adapter

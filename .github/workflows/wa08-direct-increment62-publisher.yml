name: WA-08 direct Increment 62 publisher

on:
  push:
    branches:
      - agent/wa-08-production-handoff

permissions:
  contents: write

concurrency:
  group: wa08-direct-increment62-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out WA-08 branch with full history
        uses: actions/checkout@v4
        with:
          ref: agent/wa-08-production-handoff
          fetch-depth: 0

      - name: Assemble transparent reviewed publisher
        shell: bash
        run: |
          set -euo pipefail
          cat .wa08-publisher/source-00.py.part \
              .wa08-publisher/source-01.py.part \
              .wa08-publisher/source-01a.py.part \
              .wa08-publisher/source-02.py.part \
              .wa08-publisher/source-03.py.part \
              .wa08-publisher/source-04.py.part \
              .wa08-publisher/source-05.py.part \
              > /tmp/publish-increment-62.py
          python3 -m py_compile /tmp/publish-increment-62.py
          python3 /tmp/publish-increment-62.py

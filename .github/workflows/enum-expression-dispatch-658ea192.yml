name: Enum expression targeted dispatch 658ea192

on:
  push:
    branches:
      - agent/control-enum-expression-658ea192
    paths:
      - .github/workflows/enum-expression-dispatch-658ea192.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate aggregation-budget repair identities and dispatch affected workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repo = "pysolvesemi/MorphHDL"
          pr_number = 194
          base_ref = "parameterized-verilog"
          base_sha = "09880c538c4cf83022f4a1bb1dd16b43ea81a751"
          candidate_ref = "agent/enum-expression-recursive-cleanup"
          candidate_sha = "658ea192dcc4daf8ed8b405bc614d75ea85c04f1"
          candidate_tree = "655d57d3aeb9e63a75aebd38261aafb433132989"
          workflows = {
              358619655: ".github/workflows/cdc-independent-parameter-consumers.yml",
              362756881: ".github/workflows/cdc-wire-fixed-point.yml",
              351327055: ".github/workflows/increment-60f-equivalence-closure.yml",
              354645379: ".github/workflows/increment-62-wa08-source-overlay.yml",
              357516223: ".github/workflows/lane-when-expression-diagnostic.yml",
              344527149: ".github/workflows/morphhdl-enum-localparams.yml",
              336665858: ".github/workflows/morphhdl-native-source-guard.yml",
              337719848: ".github/workflows/morphhdl-passes.yml",
          }
          api = "https://api.github.com/repos/" + repo
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "morphhdl-enum-expression-budget-controller",
          }

          def request(method, path, body=None):
              data = None if body is None else json.dumps(body, separators=(",", ":")).encode()
              req = urllib.request.Request(api + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return None if not raw else json.loads(raw)

          def ref_sha(name):
              return request("GET", "/git/ref/heads/" + urllib.parse.quote(name, safe="/"))["object"]["sha"]

          def validate_identities():
              assert os.environ["GITHUB_REPOSITORY"] == repo
              assert os.environ["GITHUB_REF_NAME"] == "agent/control-enum-expression-658ea192"
              pr = request("GET", f"/pulls/{pr_number}")
              assert pr["state"] == "open" and not pr["draft"]
              assert pr["base"]["ref"] == base_ref and pr["base"]["sha"] == base_sha
              assert pr["head"]["ref"] == candidate_ref and pr["head"]["sha"] == candidate_sha
              assert ref_sha(base_ref) == base_sha
              assert ref_sha(candidate_ref) == candidate_sha
              commit = request("GET", "/git/commits/" + candidate_sha)
              assert commit["tree"]["sha"] == candidate_tree
              assert [parent["sha"] for parent in commit["parents"]] == ["1c0c2247c4a05184212ee67c836f92d79795cf1b"]
              signature_fix = request("GET", "/git/commits/1c0c2247c4a05184212ee67c836f92d79795cf1b")
              assert [parent["sha"] for parent in signature_fix["parents"]] == ["d143317cb910fbc93d22c43de0819cb94fba70c7"]
              budget_source = request("GET", "/git/commits/d143317cb910fbc93d22c43de0819cb94fba70c7")
              assert [parent["sha"] for parent in budget_source["parents"]] == ["20127d2e39211683ce4c52500abd95fe5838415e"]
              prior_candidate = request("GET", "/git/commits/20127d2e39211683ce4c52500abd95fe5838415e")
              assert [parent["sha"] for parent in prior_candidate["parents"]] == ["6b4deb3aeac34851645921de1582363728868cb9"]
              mode_fix = request("GET", "/git/commits/6b4deb3aeac34851645921de1582363728868cb9")
              assert [parent["sha"] for parent in mode_fix["parents"]] == ["4a24a3be93093f4495bc9f54307ba8559a47c632"]
              prior_seal = request("GET", "/git/commits/4a24a3be93093f4495bc9f54307ba8559a47c632")
              assert [parent["sha"] for parent in prior_seal["parents"]] == ["ad45351c46e6362948a41c36239133f6eafd1ab2"]
              native = request("GET", "/git/commits/ad45351c46e6362948a41c36239133f6eafd1ab2")
              assert [parent["sha"] for parent in native["parents"]] == ["340e6e83919b729f38b8b80b12987ae342fa4036"]
              source = request("GET", "/git/commits/340e6e83919b729f38b8b80b12987ae342fa4036")
              assert [parent["sha"] for parent in source["parents"]] == ["a93bf094ed830c704526dce2cacc06b339a2a6b6"]

          def validate_repair():
              failures = {
                  35894984061: (332238976, 107298391997),
                  35895005521: (332238974, 107298455300),
                  35895025523: (332238975, 107298558578),
              }
              for run_id, (workflow_id, job_id) in failures.items():
                  run = request("GET", f"/actions/runs/{run_id}")
                  assert run["workflow_id"] == workflow_id
                  assert run["head_sha"] == "a93bf094ed830c704526dce2cacc06b339a2a6b6"
                  assert run["event"] == "workflow_dispatch"
                  assert run["status"] == "completed" and run["conclusion"] == "failure"
                  jobs = request("GET", f"/actions/runs/{run_id}/jobs?per_page=100")["jobs"]
                  failed = [job for job in jobs if job["id"] == job_id]
                  assert len(failed) == 1 and failed[0]["conclusion"] == "failure"
                  assert failed[0]["name"] == "run-test / tester-psl"
              stale = request("GET", "/actions/runs/35912423336")
              assert stale["workflow_id"] == 365468979
              assert stale["event"] == "push"
              assert stale["head_branch"] == "agent/control-enum-expression-4a24a3be"
              assert stale["head_sha"] == "9b1233dc6ea25b0dcb82e27fb431aa6381ae86c3"
              assert stale["status"] == "completed" and stale["conclusion"] == "failure"
              stale_jobs = request("GET", "/actions/runs/35912423336/jobs?per_page=100")["jobs"]
              stale_matched = [job for job in stale_jobs if job["id"] == 107355335076]
              assert len(stale_matched) == 1 and stale_matched[0]["conclusion"] == "failure"
              prior = request("GET", "/actions/runs/35912769160")
              assert prior["workflow_id"] == 358619655
              assert prior["event"] == "workflow_dispatch"
              assert prior["head_branch"] == candidate_ref
              assert prior["head_sha"] == "4a24a3be93093f4495bc9f54307ba8559a47c632"
              assert prior["status"] == "completed" and prior["conclusion"] == "failure"
              prior_jobs = request("GET", "/actions/runs/35912769160/jobs?per_page=100")["jobs"]
              prior_matched = [job for job in prior_jobs if job["id"] == 107356525649]
              assert len(prior_matched) == 1 and prior_matched[0]["conclusion"] == "failure"
              prior_controller = request("GET", "/actions/runs/35912738771")
              assert prior_controller["workflow_id"] == 365471173
              assert prior_controller["head_sha"] == "30e141ea70f9c4629dcefa88489b88beae6acbd3"
              assert prior_controller["status"] == "completed" and prior_controller["conclusion"] == "success"
              diagnostic = request("GET", "/actions/runs/35906752792")
              assert diagnostic["workflow_id"] == 365394420
              assert diagnostic["event"] == "push"
              assert diagnostic["head_branch"] == "agent/control-enum-fifo-diagnostic-a93bf094"
              assert diagnostic["head_sha"] == "886f42eca53cc6b17d297a4d46ca1870ba7f0b1e"
              assert diagnostic["status"] == "completed" and diagnostic["conclusion"] == "success"
              jobs = request("GET", "/actions/runs/35906752792/jobs?per_page=100")["jobs"]
              matched = [job for job in jobs if job["id"] == 107336237258]
              assert len(matched) == 1 and matched[0]["conclusion"] == "success"

              cancelled = request("GET", "/actions/runs/35913654774")
              assert cancelled["workflow_id"] == 337719848
              assert cancelled["event"] == "workflow_dispatch"
              assert cancelled["head_branch"] == candidate_ref
              assert cancelled["head_sha"] == "20127d2e39211683ce4c52500abd95fe5838415e"
              assert cancelled["status"] == "completed" and cancelled["conclusion"] == "cancelled"
              cancelled_jobs = request("GET", "/actions/runs/35913654774/jobs?per_page=100")["jobs"]
              aggregate = [job for job in cancelled_jobs if job["id"] == 107424738554]
              assert len(aggregate) == 1
              assert aggregate[0]["name"] == "WA-04 through WA-09 legality, equivalence, mutation and determinism proof"
              assert aggregate[0]["status"] == "completed" and aggregate[0]["conclusion"] == "cancelled"
              shards = [job for job in cancelled_jobs if job["name"].startswith("WA-07a through WA-09 full-domain proof shard ")]
              assert len(shards) == 16 and all(job["conclusion"] == "success" for job in shards)
              upstream = [job for job in cancelled_jobs if job["id"] != 107424738554 and job not in shards]
              assert len(upstream) == 7 and all(job["conclusion"] == "success" for job in upstream)
              old_path = urllib.parse.quote(".github/workflows/morphhdl-passes.yml", safe="/")
              old_blob = request("GET", f"/contents/{old_path}?ref=20127d2e39211683ce4c52500abd95fe5838415e")
              new_blob = request("GET", f"/contents/{old_path}?ref={candidate_sha}")
              old_workflow = base64.b64decode(old_blob["content"]).decode()
              new_workflow = base64.b64decode(new_blob["content"]).decode()
              old_marker = "# Revalidate all retained proofs; this is not an individual solver budget.\n    timeout-minutes: 60"
              new_marker = "# Revalidate all retained proofs; this is not an individual solver budget.\n    timeout-minutes: 90"
              assert old_workflow.count(old_marker) == 1
              assert new_workflow == old_workflow.replace(old_marker, new_marker)

          def runs_for(workflow_id):
              branch = urllib.parse.quote(candidate_ref, safe="")
              result = request("GET", f"/actions/workflows/{workflow_id}/runs?branch={branch}&event=workflow_dispatch&per_page=100")
              return [run for run in result["workflow_runs"] if run["head_sha"] == candidate_sha]

          validate_identities()
          validate_repair()
          ledger = {
              "repository": repo, "pull_request": pr_number,
              "base_ref": base_ref, "base_sha": base_sha,
              "candidate_ref": candidate_ref, "candidate_sha": candidate_sha,
              "candidate_tree": candidate_tree,
              "source_commit": "340e6e83919b729f38b8b80b12987ae342fa4036",
              "aggregation_budget_source_commit": "d143317cb910fbc93d22c43de0819cb94fba70c7",
              "signature_correction_commit": "1c0c2247c4a05184212ee67c836f92d79795cf1b",
              "mode_fix_commit": "6b4deb3aeac34851645921de1582363728868cb9",
              "native_manifest_commit": "ad45351c46e6362948a41c36239133f6eafd1ab2",
              "seal_commit": candidate_sha,
              "supersedes": "20127d2e39211683ce4c52500abd95fe5838415e",
              "failure_run_ids": [35894984061, 35895005521, 35895025523, 35912769160, 35913654774],
              "failure_job_ids": [107298391997, 107298455300, 107298558578, 107356525649, 107424738554],
              "repair_diagnostic_run_id": 35906752792,
              "repair_diagnostic_job_id": 107336237258,
              "failed_controller_run_id": 35912423336,
              "failed_controller_job_id": 107355335076,
              "prior_dispatch_controller_run_id": 35912738771,
              "dispatches": []
          }
          for workflow_id, expected_path in workflows.items():
              validate_identities()
              definition = request("GET", f"/actions/workflows/{workflow_id}")
              assert definition["path"] == expected_path and definition["state"] == "active"
              encoded_path = urllib.parse.quote(expected_path, safe="/")
              content = request("GET", f"/contents/{encoded_path}?ref={urllib.parse.quote(candidate_ref, safe='')}")
              workflow_text = base64.b64decode(content["content"]).decode()
              assert "workflow_dispatch" in workflow_text
              existing = runs_for(workflow_id)
              retained = [run for run in existing if run["status"] in ("queued", "in_progress") or run.get("conclusion") == "success"]
              row = {"workflow_id": workflow_id, "path": expected_path, "payload": {"ref": candidate_ref}}
              if retained:
                  run = sorted(retained, key=lambda item: item["id"], reverse=True)[0]
                  row.update({"action": "retained", "run_id": run["id"], "url": run["html_url"], "status": run["status"], "conclusion": run.get("conclusion")})
              else:
                  row.update({"action": "dispatched", "previous_terminal_runs": [{"id": run["id"], "conclusion": run.get("conclusion")} for run in existing]})
                  request("POST", f"/actions/workflows/{workflow_id}/dispatches", {"ref": candidate_ref})
              ledger["dispatches"].append(row)

          deadline = time.monotonic() + 90
          while time.monotonic() < deadline:
              complete = True
              for row in ledger["dispatches"]:
                  if "run_id" in row:
                      continue
                  matches = runs_for(row["workflow_id"])
                  if not matches:
                      complete = False
                      continue
                  run = sorted(matches, key=lambda item: item["id"], reverse=True)[0]
                  row.update({"run_id": run["id"], "url": run["html_url"], "status": run["status"], "conclusion": run.get("conclusion"), "event": run["event"], "head_sha": run["head_sha"], "head_branch": run["head_branch"]})
              if complete:
                  break
              time.sleep(5)

          validate_identities()
          for row in ledger["dispatches"]:
              assert row.get("run_id"), row
              assert row.get("event", "workflow_dispatch") == "workflow_dispatch"
              assert row.get("head_sha", candidate_sha) == candidate_sha
              assert row.get("head_branch", candidate_ref) == candidate_ref
          with open("dispatch-ledger.json", "w", encoding="utf-8") as stream:
              json.dump(ledger, stream, indent=2, sort_keys=True)
              stream.write("\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("# Enum-expression aggregation-budget repaired targeted dispatch\n\n```json\n")
              summary.write(json.dumps(ledger, indent=2, sort_keys=True))
              summary.write("\n```\n")
          PY
      - name: Upload aggregation-budget repair dispatch ledger
        uses: actions/upload-artifact@v4
        with:
          name: enum-expression-dispatch-ledger-658ea192
          path: dispatch-ledger.json
          if-no-files-found: error
          retention-days: 30

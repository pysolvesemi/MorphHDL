name: RTL-P1-02 exact toolchain export

on:
  push:
    branches:
      - agent/rtl-p1-02-toolchain-export
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact MorphHDL source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Prove exact source commitment
        shell: bash
        run: |
          set -euo pipefail
          source_commit="81abd25518551b8a452ecf038e409331e646f726"
          test "$(git merge-base HEAD "${source_commit}")" = "${source_commit}"
          test "$(git diff --name-only "${source_commit}"...HEAD)" = \
            ".github/workflows/rtl-p1-02-toolchain-export.yml"
          printf '%s\n' "${source_commit}" > /tmp/morphhdl-source-commit.txt
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/export-workflow-commit.txt

      - name: Set up Java and SBT
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - name: Set up SBT launcher
        uses: sbt/setup-sbt@v1

      - name: Compile and package exact Scala 2.12 closure
        shell: bash
        run: |
          set -euo pipefail
          export COURSIER_CACHE="$HOME/.cache/coursier"
          sbt -batch \
            "project idslplugin" compile packageBin \
            "project core" compile packageBin \
            "project lib" compile packageBin \
            "project morph" compile packageBin \
            | tee /tmp/morphhdl-toolchain-build.log

      - name: Install portable open-source RTL tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            iverilog verilator yosys jq python3
          iverilog -V 2>&1 | head -n 2 | tee /tmp/iverilog-version.txt
          verilator --version | tee /tmp/verilator-version.txt
          yosys -V | tee /tmp/yosys-version.txt
          java -version 2>&1 | tee /tmp/java-version.txt
          sbt -batch "show sbtVersion" | tee /tmp/sbt-version.txt

      - name: Assemble self-contained classpath and tool bundle
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rtl-p1-02-toolchain"
          rm -rf "$out"
          mkdir -p "$out/jars/coursier" "$out/jars/workspace" \
            "$out/rootfs" "$out/evidence"

          # Copy the resolved dependency cache into a non-hidden artifact path
          # so upload-artifact cannot silently omit the .cache directory.
          while IFS= read -r -d '' jar; do
            rel="${jar#"$HOME/.cache/coursier/"}"
            mkdir -p "$out/jars/coursier/$(dirname "$rel")"
            cp "$jar" "$out/jars/coursier/$rel"
          done < <(find "$HOME/.cache/coursier" -type f -name '*.jar' -print0)

          while IFS= read -r -d '' jar; do
            rel="${jar#"$GITHUB_WORKSPACE/"}"
            mkdir -p "$out/jars/workspace/$(dirname "$rel")"
            cp "$jar" "$out/jars/workspace/$rel"
          done < <(find "$GITHUB_WORKSPACE" -type f -name '*.jar' -print0)

          # Preserve package-owned paths for Icarus helper programs, Verilator
          # includes/data, Yosys share files, ABC, binaries and support files.
          for package in iverilog verilator yosys yosys-abc; do
            dpkg-query -L "$package" | while IFS= read -r file; do
              if [ -f "$file" ]; then
                mkdir -p "$out/rootfs$(dirname "$file")"
                cp -L "$file" "$out/rootfs$file"
              fi
            done
          done

          # Add dynamically linked libraries needed by package executables.
          while IFS= read -r -d '' exe; do
            [ -x "$exe" ] || continue
            { ldd "$exe" 2>/dev/null || true; } | \
              awk '/=> \/|^\// {for (i=1;i<=NF;i++) if ($i ~ /^\//) print $i}'
          done < <(find "$out/rootfs/usr/bin" "$out/rootfs/usr/lib" \
            -type f -print0 2>/dev/null) | sort -u | while IFS= read -r lib; do
            if [ -f "$lib" ]; then
              mkdir -p "$out/rootfs$(dirname "$lib")"
              cp -L "$lib" "$out/rootfs$lib"
            fi
          done

          cp /tmp/morphhdl-source-commit.txt "$out/evidence/"
          cp /tmp/export-workflow-commit.txt "$out/evidence/"
          cp /tmp/morphhdl-toolchain-build.log "$out/evidence/"
          cp /tmp/iverilog-version.txt "$out/evidence/"
          cp /tmp/verilator-version.txt "$out/evidence/"
          cp /tmp/yosys-version.txt "$out/evidence/"
          cp /tmp/java-version.txt "$out/evidence/"
          cp /tmp/sbt-version.txt "$out/evidence/"

          find "$out" -type f \
            ! -path "$out/evidence/SHA256SUMS" \
            ! -path "$out/evidence/FILES" \
            -print | sort > "$out/evidence/FILES"
          while IFS= read -r file; do
            sha256sum "$file"
          done < "$out/evidence/FILES" > "$out/evidence/SHA256SUMS"

          test -s "$out/evidence/SHA256SUMS"
          test "$(find "$out/jars" -type f -name '*.jar' | wc -l)" -gt 100
          test -x "$out/rootfs/usr/bin/iverilog"
          test -x "$out/rootfs/usr/bin/vvp"
          test -x "$out/rootfs/usr/bin/verilator"
          test -x "$out/rootfs/usr/bin/yosys"
          du -sh "$out"

      - name: Upload exact reusable toolchain bundle
        uses: actions/upload-artifact@v4
        with:
          name: rtl-p1-02-morphhdl-81abd-toolchain
          path: ${{ runner.temp }}/rtl-p1-02-toolchain
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          include-hidden-files: true

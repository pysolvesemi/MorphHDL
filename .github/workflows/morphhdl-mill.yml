name: MorphHDL Mill

on:
  push:
    branches:
      - agent/increment-52-nested-control-flow-clean

permissions:
  contents: write

jobs:
  repair-increment-52:
    name: Repair Increment 52 attributed declaration capture
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current Increment 52 branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-52-nested-control-flow-clean
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply production repair and restore validation workflows
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala")
          text = path.read_text(encoding="utf-8")
          old = '''  private def isDeclarationLine(value: String): Boolean =
    value.startsWith("wire ") || value.startsWith("reg ") || value.startsWith("integer ")
'''
          new = '''  private def stripLeadingVerilogAttributes(value: String): String = {
    var remaining = value.trim
    while (remaining.startsWith("(*")) {
      val end = remaining.indexOf("*)")
      if (end < 0) return remaining
      remaining = remaining.substring(end + 2).trim
    }
    remaining
  }

  private def isDeclarationLine(value: String): Boolean = {
    val declaration = stripLeadingVerilogAttributes(value)
    declaration.startsWith("wire ") || declaration.startsWith("reg ") ||
      declaration.startsWith("integer ")
  }
'''
          if new not in text:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f"expected one declaration-recognition patch site, found {count}")
            path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git fetch origin parameterized-verilog
          git show 5c996653e9e8ea7ce6efdf657727647523cd422a:.github/workflows/morphhdl-native-int-nested-control-flow.yml \
            > .github/workflows/morphhdl-native-int-nested-control-flow.yml
          git show origin/parameterized-verilog:.github/workflows/morphhdl-mill.yml \
            > .github/workflows/morphhdl-mill.yml
          rm -f .github/workflows/increment-52-apply-memory-retention-fix.yml
          rm -f .github/workflows/increment-52-memory-retention-repair.yml

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala \
                  .github/workflows/morphhdl-native-int-nested-control-flow.yml \
                  .github/workflows/morphhdl-mill.yml
          git add -u .github/workflows

          if git diff --cached --quiet; then
            echo "Increment 52 attributed declaration repair is already present."
            exit 0
          fi

          git commit -m 'fix: retain attributed structural declarations'
          for attempt in 1 2 3; do
            if git push origin HEAD:agent/increment-52-nested-control-flow-clean; then
              exit 0
            fi
            git fetch origin agent/increment-52-nested-control-flow-clean
            git rebase origin/agent/increment-52-nested-control-flow-clean
          done
          exit 1

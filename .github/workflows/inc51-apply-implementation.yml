name: Apply Increment 51 implementation

on:
  push:
    branches:
      - agent/increment-51-native-int-branch-capture
    paths:
      - .github/workflows/inc51-apply-implementation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-51-apply-implementation
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-51-native-int-branch-capture
          fetch-depth: 0

      - name: Apply reviewed implementation and remove delivery scaffolding
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/inc51-implementation.patch.gz.b64
          patch=/tmp/inc51-implementation.patch

          base64 --decode "$payload" | gzip --decompress > "$patch"
          echo "574d7293b10577133600d120cc082b4ec9d4c90136a2001d3fbf294f361750bb  $patch" | sha256sum --check --strict
          git apply --check "$patch"
          git apply "$patch"

          rm -f \
            "$payload" \
            .github/workflows/inc51-apply-implementation.yml

          git config user.name "pysolvesemi"
          git config user.email "pysolvesemi@gmail.com"
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "Implement Increment 51 native Int branch capture"
          git push origin HEAD:agent/increment-51-native-int-branch-capture

name: Increment 53e complete generic closure v1

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write

concurrency:
  group: increment-53e-complete-closure
  cancel-in-progress: true

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0

      - name: Configure exact feature and target heads
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin \
            agent/increment-53e-native-streamfifocc-parameterization \
            parameterized-verilog
          git reset --hard origin/agent/increment-53e-native-streamfifocc-parameterization
          git rev-parse HEAD >/tmp/validated-head

      - name: Build target-synchronized generic candidate
        id: prepare
        shell: bash
        run: |
          set +e
          set -o pipefail
          (
            set -euo pipefail
            git merge --no-commit --no-ff origin/parameterized-verilog

            if ! test -f morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedWidthDomainProof.scala; then
              for script in \
                morphhdl/scripts/apply-increment-53e-address-role-repair.py \
                morphhdl/scripts/apply-increment-53e-implicit-child-width-formals.py \
                morphhdl/scripts/apply-increment-53e-canonical-implicit-formal-identity.py \
                morphhdl/scripts/apply-increment-53e-modular-literal-proof.py \
                morphhdl/scripts/apply-increment-53e-materialized-auto-resize-proof.py \
                morphhdl/scripts/apply-increment-53e-unfixed-literal-width-inference.py \
                morphhdl/scripts/apply-increment-53e-generic-complete-domain-equivalence.py
              do
                test -f "$script"
                python3 "$script"
              done
            fi

            if ! test -x morphhdl/scripts/check-generic-native-int-compiler.sh || \
               ! bash morphhdl/scripts/check-generic-native-int-compiler.sh >/dev/null 2>&1; then
              if test -f morphhdl/scripts/apply-increment-53e-buffercc-shape-repair.py; then
                python3 morphhdl/scripts/apply-increment-53e-buffercc-shape-repair.py
              fi
              python3 morphhdl/scripts/apply-increment-53e-generic-native-source-selection.py
              python3 morphhdl/scripts/apply-increment-53e-generic-native-shape-selection.py
            fi
            if ! grep -q 'captureCandidateArgumentTracked' morphruntime/src/main/scala/spinal/core/ExternalNativeIntShadowRegistry.scala; then
              python3 morphhdl/scripts/apply-increment-53e-generic-candidate-argument-selection.py
            fi
            if ! grep -q 'expressionDependsOnRoot' morphruntime/src/main/scala/spinal/core/ExternalNativeIntShadowRegistry.scala; then
              python3 morphhdl/scripts/apply-increment-53e-generic-taint-inertness-v2.py
            fi

            python3 - <<'PY'
            from pathlib import Path
            path = Path('morphhdl/src/test/scala/morphhdl/GenericNativeStreamFifoCCFormalEquivalenceTests.scala')
            value = path.read_text()
            value = value.replace(
                '  val fifo = morphhdl.frontend.StreamFifoCC(\n',
                '  val fifo: spinal.lib.StreamFifoCC[Bits] = morphhdl.frontend.StreamFifoCC(\n',
                1,
            )
            value = value.replace(
                '  require(fifo.getClass == classOf[spinal.lib.StreamFifoCC[_]])\n\n',
                '',
                1,
            )
            value = value.replace('boolector', 'z3')
            value = value.replace('Boolector', 'Z3')
            path.write_text(value)
            PY

            bash morphhdl/scripts/check-generic-native-int-compiler.sh
            bash morphhdl/scripts/check-generic-parameterized-width-engine.sh
            bash morphhdl/scripts/check-native-streamfifocc-parameterization-boundary.sh
            git diff --check
          ) 2>&1 | tee /tmp/53e-prepare.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install pinned build and formal tools
        id: tools
        if: steps.prepare.outputs.code == '0'
        shell: bash
        run: |
          set +e
          set -o pipefail
          (
            set -euo pipefail
            curl --fail --location --retry 5 --retry-all-errors \
              https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
              --output /tmp/mill
            chmod +x /tmp/mill
            apt-get update
            apt-get install -y --no-install-recommends \
              git make python3 yosys z3 iverilog verilator
            if ! command -v sby >/dev/null 2>&1; then
              rm -rf /tmp/sby
              git clone --depth 1 https://github.com/YosysHQ/sby.git /tmp/sby
              make -C /tmp/sby install PREFIX=/usr/local
            fi
            yosys -V
            sby -h >/dev/null
            yosys-smtbmc -h >/dev/null
            z3 --version
            iverilog -V
            verilator --version
          ) 2>&1 | tee /tmp/53e-tools.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate generic compiler and witness generation on both Scala lanes
        id: scala
        if: steps.prepare.outputs.code == '0' && steps.tools.outputs.code == '0'
        shell: bash
        run: |
          set +e
          set -o pipefail
          /tmp/mill 'morph[2.12.18].testOnly' \
            spinal.core.internals.ExternalParameterizedWidthDomainProofTests \
            morphhdl.ParameterizedStreamFifoCCTests \
            morphhdl.GenericNativeStreamFifoCCFormalEquivalenceTests \
            2>&1 | tee /tmp/53e-scala-2.12.log
          c12=${PIPESTATUS[0]}
          /tmp/mill 'morph[2.13.12].testOnly' \
            spinal.core.internals.ExternalParameterizedWidthDomainProofTests \
            morphhdl.ParameterizedStreamFifoCCTests \
            morphhdl.GenericNativeStreamFifoCCFormalEquivalenceTests \
            2>&1 | tee /tmp/53e-scala-2.13.log
          c13=${PIPESTATUS[0]}
          echo "c12=$c12" >> "$GITHUB_OUTPUT"
          echo "c13=$c13" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run solver-backed multiclock equivalence and mutation proof
        id: formal
        if: steps.scala.outputs.c12 == '0' && steps.scala.outputs.c13 == '0'
        shell: bash
        env:
          MORPHDL_RUN_STREAMFIFOCC_FORMAL_EQUIVALENCE: "1"
          MORPHDL_STREAMFIFOCC_FORMAL_WORKSPACE: /tmp/streamfifocc-formal
        run: |
          set +e
          set -o pipefail
          rm -rf /tmp/streamfifocc-formal
          /tmp/mill 'morph[2.12.18].testOnly' \
            morphhdl.GenericNativeStreamFifoCCFormalEquivalenceTests \
            2>&1 | tee /tmp/53e-formal.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run Verilog-2001 lint, synthesis and asynchronous simulation
        id: implementation
        if: steps.formal.outputs.code == '0'
        shell: bash
        run: |
          set +e
          set -o pipefail
          bash morphhdl/scripts/verify-generic-native-streamfifocc.sh \
            /tmp/streamfifocc-formal \
            2>&1 | tee /tmp/53e-implementation.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish complete closure or isolated failure evidence
        shell: bash
        env:
          PREPARE: ${{ steps.prepare.outputs.code }}
          TOOLS: ${{ steps.tools.outputs.code }}
          C12: ${{ steps.scala.outputs.c12 }}
          C13: ${{ steps.scala.outputs.c13 }}
          FORMAL: ${{ steps.formal.outputs.code }}
          IMPLEMENTATION: ${{ steps.implementation.outputs.code }}
        run: |
          set -euo pipefail
          prepare=${PREPARE:-99}
          tools=${TOOLS:-99}
          c12=${C12:-99}
          c13=${C13:-99}
          formal=${FORMAL:-99}
          implementation=${IMPLEMENTATION:-99}
          result=failure
          if test "$prepare" = 0 && test "$tools" = 0 && \
             test "$c12" = 0 && test "$c13" = 0 && \
             test "$formal" = 0 && test "$implementation" = 0; then
            result=success
          fi

          mkdir -p /tmp/evidence
          {
            echo "stage=complete-generic-closure-v1"
            echo "validated_head=$(cat /tmp/validated-head)"
            echo "prepare_exit=$prepare"
            echo "tools_exit=$tools"
            echo "scala_2_12_exit=$c12"
            echo "scala_2_13_exit=$c13"
            echo "formal_exit=$formal"
            echo "implementation_exit=$implementation"
            echo "result=$result"
          } >/tmp/evidence/status.txt
          cat /tmp/53e-*.log 2>/dev/null | \
            grep -E 'SPINAL-|MORPH-|\*\*\* FAILED|\[error\]|error:|Exception|not found|type mismatch|value .* is not a member|expected .* got|FAIL mode=|Assert failed|Unproven' | \
            tail -n 800 >/tmp/evidence/diagnostic.txt || true

          remote=$(git ls-remote origin refs/heads/agent/increment-53e-native-streamfifocc-parameterization | awk '{print $1}')
          test "$remote" = "$(cat /tmp/validated-head)"

          if test "$result" = failure; then
            git reset --hard "$(cat /tmp/validated-head)"
            mkdir -p morphhdl/ci
            cp /tmp/evidence/status.txt morphhdl/ci/increment-53e-complete-v1-status.txt
            cp /tmp/evidence/diagnostic.txt morphhdl/ci/increment-53e-complete-v1-diagnostic.txt
            rm -f .github/workflows/increment-53e-complete-closure-v1.yml
            git add -A
            git diff --cached --check
            git commit -m 'Increment 53e: record complete generic closure failure'
          else
            python3 - <<'PY'
            from pathlib import Path
            path = Path('docs/morphhdl/parameterized-verilog-todo.md')
            value = path.read_text()
            open_entry = '- [ ] **Increment 53e — Native StreamFifoCC parameterization without source edits**'
            closed_entry = '- [x] **Increment 53e — Native StreamFifoCC parameterization without source edits**'
            if open_entry in value:
                value = value.replace(open_entry, closed_entry, 1)
            elif closed_entry not in value:
                raise SystemExit('Increment 53e roadmap entry not found')
            path.write_text(value)
            PY
            rm -rf morphhdl/ci/increment-53e-*.txt
            find .github/workflows -maxdepth 1 -type f -name 'increment-53e-*.yml' -delete
            find morphhdl/scripts -maxdepth 1 -type f -name 'apply-increment-53e-*.py' -delete
            git add -A
            git diff --cached --check
            git commit -m 'Increment 53e: close generic native StreamFifoCC parameterization'
          fi
          git push origin HEAD:agent/increment-53e-native-streamfifocc-parameterization

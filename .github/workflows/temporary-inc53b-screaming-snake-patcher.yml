name: Temporary Increment 53b screaming-snake source patch

on:
  push:
    branches:
      - fix/increment-53b-screaming-snake-enum-localparams

permissions:
  contents: write

concurrency:
  group: temporary-inc53b-screaming-snake-source-patch
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply upper-snake-case enum naming contract
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/apply-inc53b-screaming-snake-patch.py
          git diff --check

          git config user.name "MorphHDL Increment Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalEnumLocalizer.scala \
            morphhdl/src/test/scala/morphhdl/SpinalEnumLocalParameterTests.scala \
            .github/workflows/morphhdl-enum-localparams.yml \
            docs/morphhdl/parameterized-verilog-todo.md
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix(morphhdl): emit upper-snake-case enum localparams"
          git push origin "HEAD:${GITHUB_REF_NAME}"

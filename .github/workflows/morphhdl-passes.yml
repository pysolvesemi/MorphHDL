name: MorphHDL IR pass workspace

on:
  push:
    branches:
      - agent/wa-08-production-handoff
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wa08-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-wa08:
    name: Materialize reviewable WA-08 source
    if: github.repository == 'pysolvesemi/MorphHDL'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/wa-08-production-handoff
          fetch-depth: 0

      - name: Apply exact source bundle and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.wa08-materialization/payload-*.part)
          if (( ${#parts[@]} == 0 )); then
            echo "No staged WA-08 payload remains."
            exit 0
          fi
          test "${#parts[@]}" = 2
          cat "${parts[@]}" | base64 --decode > /tmp/wa08-payload.tar.gz
          test "$(stat -c '%s' /tmp/wa08-payload.tar.gz)" = 33977
          test "$(sha256sum /tmp/wa08-payload.tar.gz | awk '{print $1}')" = \
            2a14db6e03918329133be37665c82c9e7103c4d1c6878d79f60b358a6a968336
          gzip -t /tmp/wa08-payload.tar.gz
          python3 - <<'PY'
          from pathlib import PurePosixPath
          import tarfile

          with tarfile.open('/tmp/wa08-payload.tar.gz', 'r:gz') as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit('WA-08 payload is empty')
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe WA-08 payload member: {member.name}')
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f'unsupported WA-08 payload member type: {member.name}')
          PY
          tar -xzf /tmp/wa08-payload.tar.gz -C .
          test -f .delete-paths
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath

          for raw in Path('.delete-paths').read_text(encoding='utf-8').splitlines():
              value = raw.strip()
              if not value:
                  continue
              path = PurePosixPath(value)
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit(f'unsafe WA-08 deletion path: {value}')
              candidate = Path(value)
              if candidate.is_dir() and not candidate.is_symlink():
                  raise SystemExit(f'WA-08 deletion manifest cannot remove directories: {value}')
              candidate.unlink(missing_ok=True)
          PY
          rm -f .delete-paths
          rm -rf .wa08-materialization
          rm -f .github/workflows/wa08-materialize.yml
          git checkout origin/parameterized-verilog -- .github/workflows/morphhdl-passes.yml
          git diff --check
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "WA-08 source already matches the exact bundle."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Implement WA-08 canonical production handoff"
          git push origin HEAD:agent/wa-08-production-handoff

name: MorphHDL IR pass workspace

on:
  pull_request:
    branches:
      - parameterized-verilog
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - parameterized-verilog
    paths:
      - "morphhdl-passes/**"
      - ".github/workflows/morphhdl-passes.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: morphhdl-ir-passes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    name: Pass workspace boundary
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'agent/wa-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve boundary source branch
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            associated_prs="$(mktemp)"
            trap 'rm -f "${associated_prs}"' EXIT
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              > "${associated_prs}"

            mapfile -t merged_heads < <(
              python3 - "${associated_prs}" "${GITHUB_REF_NAME}" "${GITHUB_SHA}" <<'PY'
          import json
          import sys

          path, base_ref, merge_sha = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              pull_requests = json.load(handle)

          for pull_request in pull_requests:
              if (
                  pull_request.get("merged_at")
                  and pull_request.get("merge_commit_sha") == merge_sha
                  and pull_request.get("base", {}).get("ref") == base_ref
              ):
                  print(pull_request.get("head", {}).get("ref", ""))
          PY
            )

            if (( ${#merged_heads[@]} > 1 )); then
              printf 'MorphHDL pass boundary: pushed commit maps to multiple merged source branches.\n' >&2
              printf '  - %s\n' "${merged_heads[@]}" >&2
              exit 1
            fi
            if (( ${#merged_heads[@]} == 1 )) && [[ -n "${merged_heads[0]}" ]]; then
              head_ref="${merged_heads[0]}"
            fi
          fi

          [[ -n "${head_ref}" ]] || {
            echo 'MorphHDL pass boundary: unable to resolve the source branch.' >&2
            exit 1
          }
          printf 'head_ref=%s\n' "${head_ref}" >> "${GITHUB_OUTPUT}"
          printf 'MorphHDL pass boundary source branch: %s\n' "${head_ref}"

      - name: Enforce isolated pass paths
        shell: bash
        env:
          MORPHDL_PASSES_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MORPHDL_PASSES_HEAD_REF: ${{ steps.source.outputs.head_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: bash morphhdl-passes/scripts/check-boundary.sh

      - name: Test the boundary guard
        shell: bash
        run: bash morphhdl-passes/scripts/test-boundary-guard.sh

      - name: Enforce canonical adapter and component-generic pass source
        shell: bash
        run: |
          python3 morphhdl-passes/scripts/check-wa02-adapter-boundary.py --self-test
          python3 morphhdl-passes/scripts/check-wa02-adapter-boundary.py

      - name: Enforce WA-03 safety, proof and no-transform contracts
        shell: bash
        run: |
          python3 morphhdl-passes/scripts/check-wa03-gates.py --self-test
          python3 morphhdl-passes/scripts/check-wa03-gates.py

      - name: Enforce WA-04 unnamed alias transformation contracts
        shell: bash
        run: |
          python3 morphhdl-passes/scripts/check-wa04-pass.py --self-test
          python3 morphhdl-passes/scripts/check-wa04-pass.py

  contracts:
    name: Pass contracts, adapter, safety and transform Scala ${{ matrix.scala_version }}
    needs: boundary
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'agent/wa-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version:
          - "2.12.18"
          - "2.13.12"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Test standalone pass contracts, canonical adapter, safety gate and unnamed transform
        working-directory: morphhdl-passes
        shell: bash
        run: sbt -batch ++${{ matrix.scala_version }} test

  equivalence:
    name: WA-04 legality, equivalence, mutation and determinism proof
    needs: contracts
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'agent/wa-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
      SBT_OPTS: -Xms512M -Xmx4G -Xss4M
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify pinned formal toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v iverilog
          command -v vvp
          command -v verilator
          command -v yosys
          command -v sby
          command -v yices-smt2
          yosys_version="$(yosys -V)"
          sby_help="$(sby -h 2>&1)"
          yices_version="$(yices-smt2 --version)"
          iverilog_version="$(iverilog -V 2>&1)"
          verilator_version="$(verilator --version)"
          printf '%s\n' \
            "$yosys_version" \
            "$yices_version" \
            "$iverilog_version" \
            "$verilator_version"
          grep -Eq '^Yosys 0\.41([ +]|$)' <<<"$yosys_version"
          grep -q 'usage: sby' <<<"$sby_help"
          test -n "$yices_version"
          yosys -Q -p 'help abc' >/tmp/morphhdl-wa03-yosys-abc-help.txt 2>&1
          grep -q 'ABC' /tmp/morphhdl-wa03-yosys-abc-help.txt

      - name: Exercise proof-harness mutation guards
        shell: bash
        run: python3 morphhdl-passes/scripts/validate_wire_assignment_equivalence.py --self-test

      # ParameterizedStreamFifoExample remains the shared source fixture; the
      # WA-04 runner emits both legs from that same component.
      - name: Generate common pre-pass and exercise the actual WA-04 witness bridge
        shell: bash
        run: |
          set -euo pipefail
          reference_directory="${GITHUB_WORKSPACE}/morphhdl-passes/build/formal/wire_assignment_ir/generated"
          reference_report="${reference_directory}/common-pre-pass-report.json"
          candidate_directory="${GITHUB_WORKSPACE}/morphhdl-passes/build/wa04-smoke"
          activated=false
          if grep -Eq '^- \[[xX]\] \*\*WA-04 —' \
            morphhdl-passes/morphhdl-ir-wire-assignment-passes-todo.md; then
            candidate_directory="${GITHUB_WORKSPACE}/morphhdl-passes/build/pass-outputs"
            activated=true
          fi
          candidate="${candidate_directory}/wire-alias-unnamed.v"
          candidate_report="${candidate_directory}/wire-alias-unnamed-report.json"
          rm -rf "${reference_directory}" "${candidate_directory}"
          mkdir -p "${reference_directory}" "${candidate_directory}"

          sbt -batch \
            '++2.12.18' \
            'set morph / Test / unmanagedSources += file("morphhdl-passes/src/main/scala/morphhdl/passes/api/PassContracts.scala")' \
            'set morph / Test / unmanagedSources += file("morphhdl-passes/src/main/scala/morphhdl/passes/adapter/CanonicalIrPassAdapter.scala")' \
            'set morph / Test / unmanagedSources += file("morphhdl-passes/src/main/scala/morphhdl/passes/safety/WireAliasSafetyGate.scala")' \
            'set morph / Test / unmanagedSources += file("morphhdl-passes/src/main/scala/morphhdl/passes/transform/UnnamedWireAliasEliminationPass.scala")' \
            'set morph / Test / unmanagedSources += file("morphhdl-passes/examples/ParameterizedStreamFifo.scala")' \
            'set morph / Test / unmanagedSources += file("morphhdl-passes/examples/UnnamedWireAliasNativeBridge.scala")' \
            "morph / Test / runMain morphhdl.examples.ParameterizedStreamFifoUnnamedPassWitness reference ${reference_directory} parameterized_stream_fifo.v ${reference_report}" \
            "morph / Test / runMain morphhdl.examples.ParameterizedStreamFifoUnnamedPassWitness candidate ${candidate_directory} wire-alias-unnamed.v ${candidate_report}"

          reference="${reference_directory}/parameterized_stream_fifo.v"
          test -s "${reference}"
          test -s "${candidate}"
          test -s "${reference_report}"
          test -s "${candidate_report}"
          if cmp -s "${reference}" "${candidate}"; then
            echo 'WA-04 candidate is byte-identical to the common pre-pass reference; no emitted alias elimination was observed.' >&2
            exit 1
          fi

          python3 - "${candidate_report}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          if report.get("pass_id") != "wire-alias-unnamed":
              raise SystemExit("WA-04 witness report has the wrong pass id")
          if report.get("executed_before_name_allocation") is not True:
              raise SystemExit("WA-04 witness did not execute before native name allocation")
          if report.get("eliminated_count", 0) < 1:
              raise SystemExit("WA-04 witness eliminated no unnamed alias")
          if report.get("rewritten_reference_count", 0) < 1:
              raise SystemExit("WA-04 witness rewrote no exact native reference")
          PY

          # UnnamedWireAliasEliminationPassSpec: retain the complete shared
          # parameterized witness proof contract in both Scala lanes.
          (
            cd morphhdl-passes
            sbt -batch ++2.12.18 \
              'testOnly morphhdl.passes.transform.UnnamedWireAliasEliminationPassSpec -- -z "shared parameterized witness proof contract"'
          )

          iverilog -g2001 -s ParameterizedStreamFifo \
            -o "${candidate_directory}/strict-candidate.vvp" "${candidate}"
          verilator --lint-only --language 1364-2001 -Wno-fatal \
            -Wno-DECLFILENAME --top-module ParameterizedStreamFifo "${candidate}"
          yosys -Q -p "read_verilog -defer ${candidate}; hierarchy -check -top ParameterizedStreamFifo; proc; opt_clean; memory_dff; memory_collect; opt_clean; check -assert; synth -top ParameterizedStreamFifo; check -assert; stat"

          for binding in WIDTH-1__DEPTH-1 WIDTH-8__DEPTH-3 WIDTH-64__DEPTH-8; do
            width="${binding#WIDTH-}"
            width="${width%%__*}"
            depth="${binding##*DEPTH-}"
            simulation_directory="${candidate_directory}/simulation/${binding}"
            mkdir -p "${simulation_directory}"
            iverilog -g2001 -s Wa03ParameterizedWitnessTb \
              -PWa03ParameterizedWitnessTb.WIDTH="${width}" \
              -PWa03ParameterizedWitnessTb.DEPTH="${depth}" \
              -o "${simulation_directory}/simulation.vvp" \
              "${candidate}" \
              morphhdl-passes/tests/formal/wire_assignment_ir/parameterized_witness_tb.v
            vvp "${simulation_directory}/simulation.vvp" | tee "${simulation_directory}/run.log"
            grep -q 'WA03_SIM_PASS' "${simulation_directory}/run.log"
          done

          if [[ "${activated}" != true ]]; then
            test ! -e "${GITHUB_WORKSPACE}/morphhdl-passes/build/pass-outputs/wire-alias-unnamed.v"
          fi

      - name: Prove strict legality, equivalence, mutation sensitivity and determinism
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl-passes/scripts/validate_wire_assignment_equivalence.py \
            --shared-witness morphhdl-passes/build/formal/wire_assignment_ir/generated/parameterized_stream_fifo.v \
            --output morphhdl-passes/build/formal/wire_assignment_ir/evidence \
            --check-determinism
          git diff --exit-code -- .

      - name: Retain common reference, proof statuses and mutation counterexample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morphhdl-wa04-equivalence-evidence
          path: morphhdl-passes/build
          if-no-files-found: error
          retention-days: 14

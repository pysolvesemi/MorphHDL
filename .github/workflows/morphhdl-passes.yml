name: MorphHDL IR pass workspace

on:
  pull_request:
    branches:
      - parameterized-verilog
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - parameterized-verilog
    paths:
      - "morphhdl-passes/**"
      - ".github/workflows/morphhdl-passes.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: morphhdl-ir-passes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    name: Pass workspace boundary and static contracts
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'agent/wa-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve boundary source branch
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            associated_prs="$(mktemp)"
            trap 'rm -f "${associated_prs}"' EXIT
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              > "${associated_prs}"

            mapfile -t merged_heads < <(
              python3 - "${associated_prs}" "${GITHUB_REF_NAME}" "${GITHUB_SHA}" <<'PY'
          import json
          import sys

          path, base_ref, merge_sha = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              pull_requests = json.load(handle)

          for pull_request in pull_requests:
              if (
                  pull_request.get("merged_at")
                  and pull_request.get("merge_commit_sha") == merge_sha
                  and pull_request.get("base", {}).get("ref") == base_ref
              ):
                  print(pull_request.get("head", {}).get("ref", ""))
          PY
            )

            if (( ${#merged_heads[@]} > 1 )); then
              printf 'MorphHDL pass boundary: pushed commit maps to multiple merged source branches.\n' >&2
              printf '  - %s\n' "${merged_heads[@]}" >&2
              exit 1
            fi
            if (( ${#merged_heads[@]} == 1 )) && [[ -n "${merged_heads[0]}" ]]; then
              head_ref="${merged_heads[0]}"
            fi
          fi

          [[ -n "${head_ref}" ]] || {
            echo 'MorphHDL pass boundary: unable to resolve the source branch.' >&2
            exit 1
          }
          printf 'head_ref=%s\n' "${head_ref}" >> "${GITHUB_OUTPUT}"
          printf 'MorphHDL pass boundary source branch: %s\n' "${head_ref}"

      - name: Enforce isolated pass paths
        shell: bash
        env:
          MORPHDL_PASSES_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MORPHDL_PASSES_HEAD_REF: ${{ steps.source.outputs.head_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: bash morphhdl-passes/scripts/check-boundary.sh

      - name: Test the boundary guard
        shell: bash
        run: bash morphhdl-passes/scripts/test-boundary-guard.sh

      - name: Enforce canonical adapter and component-generic pass source
        shell: bash
        run: |
          python3 morphhdl-passes/scripts/check-wa02-adapter-boundary.py --self-test
          python3 morphhdl-passes/scripts/check-wa02-adapter-boundary.py

      - name: Enforce WA-03 safety, proof and no-transform contracts
        shell: bash
        run: |
          python3 morphhdl-passes/scripts/check-wa03-gates.py --self-test
          python3 morphhdl-passes/scripts/check-wa03-gates.py

      - name: Enforce WA-04 unnamed direct-alias contracts
        shell: bash
        run: |
          python3 morphhdl-passes/scripts/check-wa04-pass.py --self-test
          python3 morphhdl-passes/scripts/check-wa04-pass.py

      - name: Enforce WA-05 named direct-alias contracts
        shell: bash
        run: |
          python3 morphhdl-passes/scripts/check-wa05-pass.py --self-test
          python3 morphhdl-passes/scripts/check-wa05-pass.py

      - name: Enforce WA-06 historical ordered-pipeline contracts
        shell: bash
        run: |
          python3 morphhdl-passes/scripts/check-wa06-pipeline.py --self-test
          python3 morphhdl-passes/scripts/check-wa06-pipeline.py

      - name: Enforce WA-07 expression pass and one-flag pipeline contracts
        shell: bash
        run: |
          python3 morphhdl-passes/scripts/check-wa07-expression-pass.py --self-test
          python3 morphhdl-passes/scripts/check-wa07-expression-pass.py

  contracts:
    name: Pass contracts, direct aliases, expressions and pipeline Scala ${{ matrix.scala_version }}
    needs: boundary
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'agent/wa-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version:
          - "2.12.18"
          - "2.13.12"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Test standalone pass contracts and all-pass pipeline
        working-directory: morphhdl-passes
        shell: bash
        run: sbt -batch ++${{ matrix.scala_version }} test

  equivalence:
    name: WA-04 through WA-07 legality, equivalence, mutation and determinism proof
    needs: contracts
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'agent/wa-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
      SBT_OPTS: -Xms512M -Xmx4G -Xss4M
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify pinned formal toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v iverilog
          command -v vvp
          command -v verilator
          command -v yosys
          command -v sby
          command -v yices-smt2
          yosys_version="$(yosys -V)"
          sby_help="$(sby -h 2>&1)"
          yices_version="$(yices-smt2 --version)"
          iverilog_version="$(iverilog -V 2>&1)"
          verilator_version="$(verilator --version)"
          printf '%s\n' \
            "$yosys_version" \
            "$yices_version" \
            "$iverilog_version" \
            "$verilator_version"
          grep -Eq '^Yosys 0\.41([ +]|$)' <<<"$yosys_version"
          grep -q 'usage: sby' <<<"$sby_help"
          test -n "$yices_version"
          yosys -Q -p 'help abc' >/tmp/morphhdl-wa03-yosys-abc-help.txt 2>&1
          grep -q 'ABC' /tmp/morphhdl-wa03-yosys-abc-help.txt

      - name: Exercise proof-harness mutation guards
        shell: bash
        run: python3 morphhdl-passes/scripts/validate_wire_assignment_equivalence.py --self-test

      - name: Generate every direct, expression and all-pass candidate
        shell: bash
        run: |
          # run-wa07-regression.sh emits one unchanged pre-pass StreamFifo
          # reference plus wire-alias-unnamed.v, wire-alias-named.v,
          # wire-alias-combined.v, wire-expression-unnamed.v and
          # wire-assignment-all.v. The expression-only and all-pass witnesses
          # require a real non-reference RHS, exact identity replacement,
          # execution before native name allocation, zero procedural/always
          # receiver rewrites, byte-identical repeated Verilog and reports,
          # strict Verilog-2001 compilation, Verilator lint, Yosys synthesis,
          # and representative parameterized simulations.
          bash morphhdl-passes/scripts/run-wa07-regression.sh

      - name: Prove complete-domain equivalence, mutation sensitivity and determinism
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl-passes/scripts/validate_wire_assignment_equivalence.py \
            --shared-witness morphhdl-passes/build/formal/wire_assignment_ir/generated/parameterized_stream_fifo.v \
            --output morphhdl-passes/build/formal/wire_assignment_ir/evidence \
            --check-determinism
          git diff --exit-code -- .

      - name: Retain common reference, proof statuses and mutation counterexample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morphhdl-wa07-equivalence-evidence
          path: morphhdl-passes/build
          if-no-files-found: error
          retention-days: 14

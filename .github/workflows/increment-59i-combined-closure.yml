name: Increment 59i composite integration qualification

on:
  push:
    branches: ['agent/increment-59i-*']
    paths:
      - '.github/workflows/increment-59i-combined-closure.yml'
      - '**/src/**'
      - 'morphhdl/scripts/*59i*'
      - 'morphhdl/contracts/*59i*'
      - 'build.sbt'
  pull_request:
    branches: [parameterized-verilog]
    paths:
      - '.github/workflows/increment-59i-combined-closure.yml'
      - '**/src/**'
      - 'morphhdl/scripts/*59i*'
      - 'morphhdl/contracts/*59i*'
      - 'build.sbt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-59i-combined-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  source:
    name: Composite integration source audits
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    outputs:
      head: ${{ steps.identity.outputs.head }}
      tree: ${{ steps.identity.outputs.tree }}
    env:
      SCALA_VERSION: source
      INTEGRATION_MERGE: ae3c87467e0bdb90a16ec8d319a733d2d4d6636d
      TARGET_HEAD: 2ebaa2ef5561eab35aa0ba9caced5c5a314d59f6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Preserve exact source and run bounded primary audits
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-59i-combined-source"
          mkdir -p "$output"
          git rev-parse HEAD > "$output/head.txt"
          git archive HEAD | gzip > "$output/source.tar.gz"

          # The feature and target sides each have immutable native-source
          # reviews. Validate those exact parents separately, then require all
          # joined 59i successor reviews below on the current checkout.
          test "$(git rev-parse "$INTEGRATION_MERGE^2")" = "$TARGET_HEAD"
          git merge-base --is-ancestor "$INTEGRATION_MERGE" HEAD
          feature_native="/tmp/59i-native-feature-$SCALA_VERSION"
          target_native="/tmp/59i-native-target-$SCALA_VERSION"
          rm -rf "$feature_native" "$target_native"
          cleanup_native_worktrees() {
            git worktree remove --force "$feature_native" >/dev/null 2>&1 || true
            git worktree remove --force "$target_native" >/dev/null 2>&1 || true
          }
          trap cleanup_native_worktrees EXIT
          git worktree add --detach "$feature_native" "$INTEGRATION_MERGE^1"
          git worktree add --detach "$target_native" "$INTEGRATION_MERGE^2"
          (cd "$feature_native" && python3 morphhdl/scripts/check-native-source-preservation.py) \
            | tee "$output/native-feature-parent.log"
          (cd "$target_native" && python3 morphhdl/scripts/check-native-source-preservation.py) \
            | tee "$output/native-target-parent.log"
          (cd "$feature_native" && python3 morphhdl/scripts/check-typed-native-source-overlay.py) \
            | tee "$output/overlay-feature-parent.log"
          (cd "$target_native" && python3 morphhdl/scripts/check-typed-native-source-overlay.py) \
            | tee "$output/overlay-target-parent.log"
          cleanup_native_worktrees
          trap - EXIT

          for layer in 59i 59g 59h; do
            python3 "morphhdl/scripts/check-increment-$layer-source-review.py" --self-test > "$output/$layer-source-self-test.log" 2>&1 || { tail -n 100 "$output/$layer-source-self-test.log"; exit 1; }
            python3 "morphhdl/scripts/check-increment-$layer-source-review.py" > "$output/$layer-source-review.log" 2>&1 || { tail -n 100 "$output/$layer-source-review.log"; exit 1; }
          done
          python3 morphhdl/scripts/test-increment-59i-capture-review.py
          python3 morphhdl/scripts/test-increment-59i-production-successor.py -v > "$output/production-successor-mutations.log" 2>&1 || { tail -n 100 "$output/production-successor-mutations.log"; exit 1; }
          python3 morphhdl/scripts/check-increment-59i-production-successor.py | tee "$output/production-successor-review.log"
          python3 morphhdl/scripts/test-increment-59i-publication-golden.py -v > "$output/publication-golden-mutations.log" 2>&1 || { tail -n 100 "$output/publication-golden-mutations.log"; exit 1; }
          python3 morphhdl/scripts/test-increment-59i-composite-captures.py
          python3 morphhdl/scripts/test-increment-59i-review-composition.py -v > "$output/review-composition-tests.log" 2>&1 || { tail -n 100 "$output/review-composition-tests.log"; exit 1; }
          python3 morphhdl/scripts/check-increment-59i-combined.py --self-test | tee "$output/checker-self-test.log"
          python3 morphhdl/scripts/test-increment-59i-combined.py -v 2>&1 | tee "$output/checker-regressions.log"
          python3 morphhdl/scripts/test-increment-59i-nested-results.py -v 2>&1 | tee "$output/nested-result-checker-tests.log"
      - name: Identify the successfully audited source
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'head=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Retain primary source audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59i-source-${{ github.run_attempt }}
          path: target/increment-59i-combined-source
          if-no-files-found: error
          retention-days: 14

  inherited_source:
    name: Composite integration inherited source audits
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    outputs:
      head: ${{ steps.identity.outputs.head }}
      tree: ${{ steps.identity.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Preserve exact source and run bounded inherited audits
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-59i-combined-inherited-source"
          mkdir -p "$output"
          git rev-parse HEAD > "$output/head.txt"
          git archive HEAD | gzip > "$output/source.tar.gz"
          python3 morphhdl/scripts/test-wa07b-inherited-review.py > "$output/wa07b-composition-controls.log" 2>&1 || { tail -n 100 "$output/wa07b-composition-controls.log"; exit 1; }
          python3 morphhdl/scripts/test-increment-59h-inherited-source-scope.py > "$output/inherited-source-controls.log" 2>&1 || { tail -n 100 "$output/inherited-source-controls.log"; exit 1; }
      - name: Identify the successfully audited source
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'head=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Retain inherited source audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59i-inherited-source-${{ github.run_attempt }}
          path: target/increment-59i-combined-inherited-source
          if-no-files-found: error
          retention-days: 14

  integration:
    needs: [source, inherited_source]
    name: Composite integration Scala ${{ matrix.scala }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        scala: ['2.12.18', '2.13.12']
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      COURSIER_REPOSITORIES: https://repo.maven.apache.org/maven2
      COURSIER_CACHE: /sbt/.cache/coursier/v1
      SBT_TEST_PARALLEL: '0'
      JAVA_TOOL_OPTIONS: '-Xmx5G -XX:ActiveProcessorCount=4'
      SCALA_VERSION: ${{ matrix.scala }}
      INTEGRATION_MERGE: ae3c87467e0bdb90a16ec8d319a733d2d4d6636d
      TARGET_HEAD: 2ebaa2ef5561eab35aa0ba9caced5c5a314d59f6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Preserve the same successfully audited source and bootstrap pinned SBT
        shell: bash
        env:
          AUDITED_HEAD: ${{ needs.source.outputs.head }}
          AUDITED_TREE: ${{ needs.source.outputs.tree }}
          INHERITED_HEAD: ${{ needs.inherited_source.outputs.head }}
          INHERITED_TREE: ${{ needs.inherited_source.outputs.tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUDITED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$AUDITED_TREE"
          test "$(git rev-parse HEAD)" = "$INHERITED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$INHERITED_TREE"
          output="$GITHUB_WORKSPACE/target/increment-59i-combined"
          mkdir -p "$output/bootstrap"
          git rev-parse HEAD > "$output/head.txt"
          git archive HEAD | gzip > "$output/source.tar.gz"
          version=$(sed -n 's/^sbt.version=//p' project/build.properties)
          test "$version" = '1.10.0'
          base="https://repo.maven.apache.org/maven2/org/scala-sbt/sbt-launch/$version/sbt-launch-$version.jar"
          curl --fail --location --retry 5 --retry-all-errors "$base" -o "$output/bootstrap/sbt-launch.jar"
          curl --fail --location --retry 5 --retry-all-errors "$base.sha1" -o "$output/bootstrap/sbt-launch.jar.sha1"
          python3 - <<'PY'
          import hashlib, re
          from pathlib import Path
          root = Path('target/increment-59i-combined/bootstrap')
          expected = (root / 'sbt-launch.jar.sha1').read_text().strip()
          assert re.fullmatch('[0-9a-fA-F]{40}', expected)
          assert hashlib.sha1((root / 'sbt-launch.jar').read_bytes()).hexdigest() == expected.lower()
          PY
          printf '[repositories]\nlocal\nmaven-central: https://repo.maven.apache.org/maven2\n' > "$output/bootstrap/repositories"
          cat > "$output/bootstrap/sbt.sh" <<'SH'
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-59i-combined"
          java -Xmx3G -Dsbt.log.noformat=true -Dsbt.supershell=false \
            -Dsbt.boot.directory=/sbt/.sbt/boot -Dsbt.global.base=/sbt/.sbt \
            -Dsbt.ivy.home=/sbt/.ivy2 -Duser.home=/sbt \
            -Dsbt.repository.config="$output/bootstrap/repositories" -Dsbt.override.build.repos=true \
            -jar "$output/bootstrap/sbt-launch.jar" "++$SCALA_VERSION" "$@"
          SH
      - name: Compile the actual combined source and export its classpath
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-59i-combined"
          bash "$output/bootstrap/sbt.sh" 'morph/Test/compile' \
            'export morph/Test/fullClasspath' 'show morph/Test/scalacOptions' \
            > "$output/compile.log" 2>&1 || { tail -n 160 "$output/compile.log"; exit 1; }
      - name: Preserve declared compilation inputs for reproducible local diagnosis
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, shutil, tarfile
          from pathlib import Path
          output = Path('target/increment-59i-combined')
          lines = (output / 'compile.log').read_text().splitlines()
          candidates = [line.strip().split(':') for line in lines
                        if line.startswith('/') and ':' in line and
                        all(Path(part).exists() for part in line.strip().split(':'))]
          assert len(candidates) == 1, ('missing or ambiguous exported classpath', candidates)
          paths = [Path(p) for p in candidates[0]]
          extra = []
          version = os.environ['SCALA_VERSION']
          for name in ('scala-compiler', 'scala-library', 'scala-reflect'):
              matches = list(Path('/sbt/.cache/coursier').rglob(name + '-' + version + '.jar'))
              assert matches, ('missing compiler dependency', name)
              extra.append(matches[0])
          for project in ('idslplugin', 'morphplugin'):
              matches = [p for p in Path(project, 'target').rglob('*.jar')
                         if 'sources' not in p.name and 'javadoc' not in p.name]
              assert matches, ('missing compiler plugin', project)
              extra.extend(matches)
          paths += [p for p in extra if p not in paths]
          manifest = []
          kit = output / 'build-kit'
          kit.mkdir()
          for index, source in enumerate(paths):
              relative = 'entry-%03d' % index + ('/' + source.name if source.is_file() else '')
              target = kit / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              if source.is_dir():
                  shutil.copytree(source, target)
              else:
                  shutil.copyfile(source, target)
              manifest.append({'original': str(source), 'path': relative,
                               'classpath': index < len(candidates[0])})
          (kit / 'classpath.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (kit / 'scala-version.txt').write_text(version + '\n')
          shutil.copyfile(output / 'head.txt', kit / 'head.txt')
          with tarfile.open(output / 'build-kit.tar.gz', 'w:gz') as archive:
              archive.add(kit, arcname='build-kit')
          shutil.rmtree(kit)
          PY
      - name: Run inherited reduction and composite integration safety tests
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-59i-combined"
          bash "$output/bootstrap/sbt.sh" \
            'frontend/Test/testOnly morphhdl.frontend.HdlIntTests morphhdl.frontend.TypedParameterFrontendTests' \
            'morph/Test/testOnly spinal.core.internals.TypedBalancedReduction*Tests spinal.core.FiniteAffineVecReadTests spinal.core.FiniteFormalBoundaryTests spinal.core.TypedFormalInventoryTests spinal.core.TypedFormalCompoundPortTests spinal.core.ParameterizedStructuralLexicalOwnerTests spinal.core.internals.ParameterizedVerilogStructuralLexicalTests spinal.core.TypedParameterFrontendProjectionTests' \
            > "$output/tests.log" 2>&1 || { tail -n 180 "$output/tests.log"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('morphhdl/target').rglob('*.xml'))
          combined = [p for p in files if p.name.endswith('.TypedBalancedReductionCombinedTests.xml')]
          assert len(combined) == 1, ('missing/duplicated combined suite', combined)
          suite = ET.parse(combined[0]).getroot()
          assert int(suite.get('tests', '0')) == 17, suite.attrib
          counts = {'TypedBalancedReductionCompositeLocalEnableTests': 31,
                    'TypedBalancedReductionCompositeStaticRedirectTests': 7,
                    'ParameterizedVerilogStructuralLexicalTests': 7,
                    'TypedBalancedReductionDeclarationFilterTests': 6,
                    'TypedBalancedReductionNestedResultTests': 8,
                    'TypedBalancedReductionCompositeCaptureTests': 10,
                    'TypedBalancedReductionNestedMechanismTests': 6,
                    'TypedBalancedReductionBridgeZeroTests': 13,
                    'TypedBalancedReductionSymbolicZeroInitializerTests': 7,
                    'TypedBalancedReductionCompositeWideningIdentityTests': 3,
                    'TypedBalancedReductionCompositeBridgeInitializationTests': 1,
                    'TypedBalancedReductionConsumedProbeTests': 6,
                    'TypedBalancedReductionNestedCloneShapeTests': 4,
                    'TypedBalancedReductionNativeGeometryTests': 11}
          for name, count in counts.items():
              matches = [p for p in files if p.name.endswith('.' + name + '.xml')]
              assert len(matches) == 1, ('missing/duplicated join safety suite', name, matches)
              suite = ET.parse(matches[0]).getroot()
              assert int(suite.get('tests', '0')) == count, (name, suite.attrib)
          required = ('TypedBalancedReductionCompositeTests', 'TypedBalancedReductionNestedOwnerTests',
                      'TypedBalancedReductionWideningPublicationTests', 'TypedBalancedReductionPublicationTests',
                      'TypedBalancedReductionCombinedTests', 'ParameterizedStructuralLexicalOwnerTests')
          for name in required:
              matches = [p for p in files if p.name.endswith('.' + name + '.xml')]
              assert len(matches) == 1, ('required inherited suite missing/duplicated', name, matches)
          tested = 0
          for path in files:
              if not ('TypedBalancedReduction' in path.name or 'FiniteAffineVecReadTests' in path.name or
                      'StructuralLexical' in path.name):
                  continue
              suite = ET.parse(path).getroot()
              assert int(suite.get('tests', '0')) > 0, (path, suite.attrib)
              assert all(int(suite.get(k, '0')) == 0 for k in ('failures', 'errors', 'skipped')), (path, suite.attrib)
              tested += int(suite.get('tests'))
          assert tested >= 415, tested
          frontend = list(Path('frontend/target').rglob('*.xml'))
          for name, count, reports in (
                  ('TypedParameterFrontendTests', 6, frontend),
                  ('HdlIntTests', None, frontend),
                  ('TypedParameterFrontendProjectionTests', 1, files),
                  ('TypedFormalInventoryTests', 7, files),
                  ('TypedFormalCompoundPortTests', 5, files),
                  ('FiniteFormalBoundaryTests', 11, files)):
              matches = [p for p in reports if p.name.endswith('.' + name + '.xml')]
              assert len(matches) == 1, ('missing/duplicated typed constructor suite', name, matches)
              suite = ET.parse(matches[0]).getroot()
              actual = int(suite.get('tests', '0'))
              assert actual > 0 and (count is None or actual == count), (name, suite.attrib)
              assert all(int(suite.get(k, '0')) == 0 for k in ('failures', 'errors', 'skipped')), (name, suite.attrib)
          print('Composite integration plus inherited reduction safety tests:', tested)
          PY
      - name: Generate independent A/B candidate and native reference artifacts
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-59i-combined"
          bash "$output/bootstrap/sbt.sh" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionCombinedArtifactWriter $output/a" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionCombinedArtifactWriter $output/b" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionPublicationArtifactWriter $output/inherited-a" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionPublicationArtifactWriter $output/inherited-b" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionNestedResultArtifactWriter $output/nested-a" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionNestedResultArtifactWriter $output/nested-b" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionCompositeCaptureArtifacts $output/captures-a" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionCompositeCaptureArtifacts $output/captures-b" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionCompositeWideningProofArtifacts $output/widening-a" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionCompositeWideningProofArtifacts $output/widening-b" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionCompositeSaturationArtifacts $output/saturation-a" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionCompositeSaturationArtifacts $output/saturation-b" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionGeneratedChildArtifactWriter $output/child-a" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionGeneratedChildArtifactWriter $output/child-b" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionNestedMechanismArtifacts $output/mechanisms-a" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionNestedMechanismArtifacts $output/mechanisms-b" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionNestedSaturationWideningArtifacts $output/saturation-widening-a" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionNestedSaturationWideningArtifacts $output/saturation-widening-b" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionPublicationGoldenArtifacts $output/golden-a" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionPublicationGoldenArtifacts $output/golden-b" \
            > "$output/generation.log" 2>&1 || { tail -n 180 "$output/generation.log"; exit 1; }
      - name: Qualify all composite matrices, publication goldens and inherited 59b proof
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-59i-combined"
          python3 morphhdl/scripts/check-increment-59i-combined.py "$output/a" "$output/b" | tee "$output/qualification.log"
          python3 morphhdl/scripts/check-increment-59b-publication.py "$output/inherited-a" "$output/inherited-b" | tee "$output/inherited-qualification.log"
          python3 morphhdl/scripts/check-increment-59i-nested-results.py "$output/nested-a" "$output/nested-b" --jobs 2 | tee "$output/nested-result-qualification.log"
          python3 morphhdl/scripts/check-increment-59i-composite-captures.py "$output/captures-a" "$output/captures-b" --jobs 2 | tee "$output/capture-qualification.log"
          python3 morphhdl/scripts/check-increment-59i-composite-widening-publication.py --self-test | tee "$output/widening-checker-self-test.log"
          python3 morphhdl/scripts/check-increment-59i-composite-widening-publication.py "$output/widening-a" "$output/widening-b" | tee "$output/widening-qualification.log"
          python3 morphhdl/scripts/check-increment-59i-composite-saturation.py "$output/saturation-a" "$output/saturation-b" --jobs 2 | tee "$output/saturation-qualification.log"
          python3 morphhdl/scripts/check-increment-59i-generated-child.py --self-test | tee "$output/child-checker-self-test.log"
          python3 morphhdl/scripts/check-increment-59i-generated-child.py "$output/child-a" "$output/child-b" --jobs 2 | tee "$output/child-qualification.log"
          python3 morphhdl/scripts/check-increment-59i-nested-mechanisms.py --self-test | tee "$output/mechanisms-checker-self-test.log"
          python3 morphhdl/scripts/check-increment-59i-nested-mechanisms.py "$output/mechanisms-a" "$output/mechanisms-b" --jobs 2 | tee "$output/mechanisms-qualification.log"
          python3 morphhdl/scripts/check-increment-59i-nested-saturation-widening.py --self-test | tee "$output/saturation-widening-checker-self-test.log"
          python3 morphhdl/scripts/check-increment-59i-nested-saturation-widening.py "$output/saturation-widening-a" "$output/saturation-widening-b" --jobs 2 | tee "$output/saturation-widening-qualification.log"
          python3 morphhdl/scripts/check-increment-59i-publication-golden.py check "$output/golden-a" "$output/golden-b" --output "$output/golden-a/evidence.json" | tee "$output/publication-golden-qualification.log"
          printf '%s\n' '59i composite matrices, publication goldens, inherited 59b proof and exact-source successor checks passed for this Scala lane. Each slice retains its bounded evidence scope; complete 59i qualification also requires the cross-Scala comparison, all applicable inherited and native-consumer gates, and the reviewed final qualification record.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload exact-source build, tests, original RTL and hardware evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59i-combined-${{ matrix.scala }}
          path: |
            target/increment-59i-combined
            morphhdl/target/test-reports
            frontend/target/test-reports
          if-no-files-found: error
          retention-days: 14

  determinism:
    name: Cross-Scala composite integration RTL determinism
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: increment-59i-combined-*
          path: evidence
      - name: Compare exact source identity, matrices, original RTL and proof inventories
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path, PurePosixPath
          roots = []
          for version in ('2.12.18', '2.13.12'):
              matches = list(Path('evidence', 'increment-59i-combined-' + version).rglob('head.txt'))
              assert len(matches) == 1, (version, matches)
              roots.append(matches[0].parent)
          a, b = roots
          assert (a / 'head.txt').read_bytes() == (b / 'head.txt').read_bytes()
          for relative in ('a/manifest.json', 'a/evidence.json'):
              assert (a / relative).read_bytes() == (b / relative).read_bytes(), relative
          manifest = json.loads((a / 'a/manifest.json').read_text())
          for item in manifest['candidates'] + manifest['cases']:
              relative = Path('a', item['file'])
              assert (a / relative).read_bytes() == (b / relative).read_bytes(), relative
          report = json.loads((a / 'a/evidence.json').read_text())
          assert report['complete_59i_join'] is False
          assert len(report['cases']) == 96 and len(report['mutations']) == 7
          assert set(report['mutations']) == {'field-misbinding', 'signed-key-misbinding',
              'wrong-branch', 'ignored-enable', 'wrong-reset-value',
              'reset-overrides-enable', 'bypass-latency'}
          def compare_inherited_publication(lanes):
              import hashlib
              shapes = {(width, count) for width in (1, 5, 8, 32)
                        for count in (1, 2, 3, 5, 8, 9, 16, 17)}
              baseline_manifest = baseline_files = baseline_proof = None
              for lane in lanes:
                  for repeat in ('a', 'b'):
                      root = lane / ('inherited-' + repeat)
                      assert root.is_dir() and not root.is_symlink(), root
                      manifest_path = root / 'manifest.json'
                      assert manifest_path.is_file() and not manifest_path.is_symlink(), manifest_path
                      raw = manifest_path.read_bytes()
                      matrix = json.loads(raw)
                      assert matrix['scope'] == 'parameterized-native-balanced-publication'
                      assert matrix['candidate_default'] == {'width': 5, 'count': 1}
                      assert matrix['independent_inputs'] == ['unsignedIn', 'signedIn', 'bitsIn', 'boolIn']
                      assert matrix['outputs'] == ['uAdd', 'sAdd', 'bXor', 'qAnd', 'rAdd']
                      cases = matrix['configurations']
                      assert len(cases) == 32 and {(c['width'], c['count']) for c in cases} == shapes
                      by_shape = {}
                      for case in cases:
                          width, count = case['width'], case['count']
                          assert type(width) is int and type(count) is int
                          label = 'w%d_n%d' % (width, count)
                          module = 'BalancedPublicationReference_' + label
                          assert case == {'width': width, 'count': count,
                              'candidate_module': 'BalancedPublication',
                              'candidate_rtl': 'candidate/BalancedPublication.v',
                              'reference_module': module,
                              'reference_rtl': label + '/reference/' + module + '.v'}, case
                          by_shape[width, count] = case
                      names = {c[role + '_rtl'] for c in cases for role in ('candidate', 'reference')}
                      assert len(names) == 33
                      namespaces = {PurePosixPath(name).parts[0] for name in names}
                      assert {p.name for p in root.iterdir()} - {'manifest.json', 'evidence.json', 'checks'} == namespaces
                      inventory = set()
                      for namespace in namespaces:
                          folder = root / namespace
                          assert folder.is_dir() and not folder.is_symlink(), folder
                          for path in folder.rglob('*'):
                              assert not path.is_symlink(), path
                              if path.is_file():
                                  inventory.add(path.relative_to(root).as_posix())
                      assert inventory == names, (root, inventory ^ names)
                      files = {name: (root / name).read_bytes() for name in names}
                      if baseline_manifest is None:
                          baseline_manifest, baseline_files = raw, files
                      else:
                          assert raw == baseline_manifest, root
                          assert files == baseline_files, root
                  # The inherited checker writes evidence only to A, after both
                  # actual mutations pass. It has no wall-clock timing or file paths.
                  proof_path = lane / 'inherited-a/evidence.json'
                  assert proof_path.is_file() and not proof_path.is_symlink(), proof_path
                  raw_proof = proof_path.read_bytes()
                  proof = json.loads(raw_proof)
                  assert proof['scope'] == 'parameterized-native-balanced-publication'
                  assert proof['candidate_default'] == {'width': 5, 'count': 1}
                  assert proof['formal_inputs'] == 'independent unsigned, signed, bits and boolean packed vectors'
                  assert proof['reset_model'] == 'native CE gates synchronous active-high reset'
                  controls = proof['mutation_controls']
                  assert len(controls) == 2 and set(controls) == {
                      'pair-operand-mutation', 'cross-vec-binding-mutation'}
                  reports = proof['configurations']
                  assert len(reports) == 32 and {(c['width'], c['count']) for c in reports} == shapes
                  for result in reports:
                      width, count = result['width'], result['count']
                      assert type(width) is int and type(count) is int
                      assert result['outputs'] == 5 and type(result['samples']) is int and result['samples'] > 0
                      assert result['latency'] == (count - 1).bit_length()
                      assert result['cycles'] == max(160, result['samples']) + result['latency']
                      assert result['reset_entry'] == result['induction'] == 'PASS'
                      case = by_shape[width, count]
                      assert result['sha256'] == {role: hashlib.sha256(
                          baseline_files[case[role + '_rtl']]).hexdigest() for role in ('candidate', 'reference')}
                  if baseline_proof is None:
                      baseline_proof = raw_proof
                  else:
                      assert raw_proof == baseline_proof, proof_path
          compare_inherited_publication(roots)
          for relative in ('nested-a/manifest.json', 'nested-a/evidence.json'):
              assert (a / relative).read_bytes() == (b / relative).read_bytes(), relative
          nested = json.loads((a / 'nested-a/manifest.json').read_text())
          assert len(nested['cases']) == 96 and len(nested['candidates']) == 4
          for item in nested['candidates'] + nested['cases']:
              relative = Path('nested-a', item['file'])
              assert (a / relative).read_bytes() == (b / relative).read_bytes(), relative
          nested_proof = json.loads((a / 'nested-a/evidence.json').read_text())
          assert nested_proof['complete_59i_join'] is False
          assert len(nested_proof['cases']) == 96
          assert set(nested_proof['mutations']) == {'wrong-branch', 'field-swap', 'inner-index-swap', 'signed-bit-loss'}
          for relative in ('captures-a/manifest.json', 'captures-a/evidence.json'):
              assert (a / relative).read_bytes() == (b / relative).read_bytes(), relative
          captures = json.loads((a / 'captures-a/manifest.json').read_text())
          assert captures['scope'] == '59i-composite-runtime-captures'
          assert len(captures['cases']) == 96 and len(captures['candidates']) == 6
          for item in captures['candidates'] + captures['cases']:
              relative = Path('captures-a', item['file'])
              assert (a / relative).read_bytes() == (b / relative).read_bytes(), relative
          capture_proof = json.loads((a / 'captures-a/evidence.json').read_text())
          assert capture_proof['complete_59i_join'] is False
          assert len(capture_proof['cases']) == 96
          assert set(capture_proof['mutations']) == {'capture-swap', 'frozen-mask', 'frozen-bias',
              'offset-bit-loss', 'frozen-selector'}
          def compare_publication_inventory(directory, namespaces):
              baseline_manifest = baseline_files = None
              for lane in roots:
                  for repeat in ('a', 'b'):
                      root = lane / (directory + '-' + repeat)
                      raw = (root / 'manifest.json').read_bytes()
                      matrix = json.loads(raw)
                      names = [item['file'] for item in matrix['candidates'] + matrix['cases']]
                      assert names and len(names) == len(set(names)), (root, names)
                      for name in names:
                          path = PurePosixPath(name)
                          assert not path.is_absolute() and '..' not in path.parts, (root, name)
                          assert path.as_posix() == name and path.parts[0] in namespaces, (root, name)
                      inventory = set()
                      for namespace in namespaces:
                          folder = root / namespace
                          assert folder.is_dir() and not folder.is_symlink(), folder
                          for path in folder.rglob('*'):
                              assert not path.is_symlink(), path
                              if path.is_file():
                                  inventory.add(path.relative_to(root).as_posix())
                      assert inventory == set(names), (root, inventory ^ set(names))
                      files = {name: (root / name).read_bytes() for name in names}
                      if baseline_manifest is None:
                          baseline_manifest, baseline_files = raw, files
                      else:
                          assert raw == baseline_manifest, root
                          assert files == baseline_files, root
              assert (a / (directory + '-a/evidence.json')).read_bytes() == \
                     (b / (directory + '-a/evidence.json')).read_bytes(), directory
              return json.loads(baseline_manifest), json.loads(
                  (a / (directory + '-a/evidence.json')).read_text())

          widening, widening_proof = compare_publication_inventory('widening', ('candidate', 'reference'))
          assert widening['scope'] == widening_proof['scope'] == '59i-composite-widening-publication-proof'
          assert widening['schema'] == 2
          assert widening['domains'] == {key: {'min': 1, 'max': maximum} for key, maximum in
              zip(('us', 'up', 'ss', 'sp', 'count'), (16, 7, 7, 6, 5))}
          assert len(widening['cases']) == 20 and len(widening['candidates']) == 12
          assert widening_proof['complete_59i_join'] is False
          assert len(widening_proof['cases']) == 20
          assert {case['case'] for case in widening_proof['cases']} == {case['id'] for case in widening['cases']}
          assert all(case['profiles'] == 12 and case['vectors'] > 0 and case['proof'] == 'PASS'
                     for case in widening_proof['cases'])
          saturation, saturation_proof = compare_publication_inventory('saturation', ('candidate', 'native'))
          assert saturation['scope'] == saturation_proof['scope'] == '59i-composite-saturation-hardware'
          assert len(saturation['cases']) == 56 and len(saturation['candidates']) == 2
          assert saturation_proof['complete_59i'] is False and saturation_proof['focused_only'] is False
          assert saturation_proof['determinism'] == 'PASS' and len(saturation_proof['cases']) == 56
          assert {case['case'] for case in saturation_proof['cases']} == {case['id'] for case in saturation['cases']}
          assert all(case['vectors'] > 0 and set(case['layouts']) == {'packed', 'fields'} and
                     all(case[key] == 'PASS' for key in ('strict_v2001', 'lint', 'synthesis', 'simulation', 'sat'))
                     for case in saturation_proof['cases'])
          assert len(saturation_proof['generated_rtl_mutations']) == 8
          assert {(item['layout'], item['kind']) for item in saturation_proof['generated_rtl_mutations']} == {
              (layout, kind) for layout in ('packed', 'fields') for kind in ('slice', 'fill', 'carry', 'tail')}
          assert all(item['simulation'] == 'MISMATCH' and item['sat'] == 'COUNTEREXAMPLE'
                     for item in saturation_proof['generated_rtl_mutations'])
          for relative in ('child-a/manifest.json', 'child-a/evidence.json'):
              assert (a / relative).read_bytes() == (b / relative).read_bytes(), relative
          child = json.loads((a / 'child-a/manifest.json').read_text())
          assert child['scope'] == '59i-generated-child-record-join'
          assert len(child['cases']) == 96 and len(child['candidates']) == 12
          assert {case['mode'] for case in child['cases']} == {0, 1}
          for item in child['candidates'] + child['cases']:
              relative = Path('child-a', item['file'])
              assert (a / relative).read_bytes() == (b / relative).read_bytes(), relative
          child_proof = json.loads((a / 'child-a/evidence.json').read_text())
          assert child_proof['complete_59i_join'] is False
          assert len(child_proof['cases']) == 96
          assert {case['mode'] for case in child_proof['cases']} == {0, 1}
          assert {item['control'] for item in child_proof['mutations']} == {
              'field-misbinding', 'signed-key-misbinding', 'wrong-mode-actual', 'fixed-mode-actual',
              'ignored-enable', 'wrong-reset-value', 'reset-overrides-enable', 'bypass-latency'}
          assert all(item['simulation'] == 'MISMATCH' and item['formal'] == 'COUNTEREXAMPLE'
                     for item in child_proof['mutations'])
          for directory, scope in (
                  ('mechanisms-a', '59i-nested-widening-capture-register-hierarchy'),
                  ('saturation-widening-a', '59i-nested-saturation-widening')):
              for name in ('manifest.json', 'evidence.json'):
                  relative = Path(directory, name)
                  assert (a / relative).read_bytes() == (b / relative).read_bytes(), relative
              matrix = json.loads((a / directory / 'manifest.json').read_text())
              proof = json.loads((a / directory / 'evidence.json').read_text())
              assert matrix['scope'] == proof['scope'] == scope
              assert len(matrix['cases']) == 16 and len(matrix['candidates']) == 6
              assert {case['mode'] for case in matrix['cases']} == {0, 1}
              for item in matrix['candidates'] + matrix['cases']:
                  relative = Path(directory, item['file'])
                  assert (a / relative).read_bytes() == (b / relative).read_bytes(), relative
              assert proof['complete_59i_join'] is False and len(proof['cases']) == 16
              assert all(case['profiles'] == 6 and case['simulation_cycles'] > 0 and
                         case['reset_entry'] == case['induction'] == 'PASS' for case in proof['cases'])
              controls = {'capture-misbinding', 'child-mode-misbinding', 'field-misbinding',
                  'inner-index-misbinding', 'odd-tail-loss', 'carry-loss', 'sign-loss',
                  'bypass-latency', 'ignored-enable', 'reset-overrides-enable'}
              expected = {(profile['module'], control) for profile in matrix['candidates'] for control in controls}
              assert len(proof['mutations']) == 60
              assert {(item['profile'], item['control']) for item in proof['mutations']} == expected
              assert all(item['simulation'] == 'REJECTED' and item['formal'] == 'COUNTEREXAMPLE'
                         for item in proof['mutations'])
          golden_profiles = {'default', 'packed', 'fields', 'fields-legacy', 'fields-declarations',
              'fields-casts', 'child-packed', 'child-fields', 'concrete-singleton', 'concrete-unequal'}
          golden = []
          for lane in roots:
              proof = json.loads((lane / 'golden-a/evidence.json').read_text())
              assert proof['schema'] == 1 and proof['scope'] == '59i-publication-abi-defaults'
              assert proof['status'] == 'pass' and proof['profile_count'] == 10
              assert len(proof['profiles']) == 10 and set(proof['profiles']) == golden_profiles
              assert proof['runs']['a'] == proof['runs']['b']
              golden.append(proof)
          assert golden[0] == golden[1], 'cross-Scala reviewed publication ABI/raw evidence differs'
          for repeat in ('a', 'b'):
              relative = Path('golden-' + repeat, 'manifest.json')
              assert (a / relative).read_bytes() == (b / relative).read_bytes(), relative
              manifest = json.loads((a / relative).read_text())
              assert {profile['profile'] for profile in manifest['profiles']} == golden_profiles
              for profile in manifest['profiles']:
                  relative = Path('golden-' + repeat, profile['file'])
                  assert (a / relative).read_bytes() == (b / relative).read_bytes(), relative
          print('Cross-Scala source-bound composite RTL and proof inventories match; assess complete 59i qualification through the reviewed final record and all applicable gates.')
          PY

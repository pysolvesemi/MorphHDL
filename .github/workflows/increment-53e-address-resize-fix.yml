name: Increment 53e generic native hierarchy repair

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write

jobs:
  apply-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0

      - name: Prepare authenticated branch checkout
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Apply generic graph-backed native hierarchy repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/apply-increment-53e-address-role-repair.py
          python3 morphhdl/scripts/apply-increment-53e-implicit-child-width-formals.py
          python3 morphhdl/scripts/apply-increment-53e-canonical-implicit-formal-identity.py
          python3 morphhdl/scripts/apply-increment-53e-emitted-child-definition-match.py
          python3 morphhdl/scripts/apply-increment-53e-generic-emitted-inventory.py
          python3 morphhdl/scripts/apply-increment-53e-generic-packed-lineage.py
          python3 morphhdl/scripts/apply-increment-53e-retained-packed-declaration-inventory.py
          python3 morphhdl/scripts/apply-increment-53e-remove-lineage-debug.py
          python3 morphhdl/scripts/apply-increment-53e-attributed-declarations.py
          python3 morphhdl/scripts/apply-increment-53e-modular-literal-proof.py
          python3 morphhdl/scripts/apply-increment-53e-materialized-auto-resize-proof.py
          python3 morphhdl/scripts/apply-increment-53e-symbolic-auto-resize-width.py
          python3 morphhdl/scripts/apply-increment-53e-auto-resize-assignment-rewrite.py
          python3 morphhdl/scripts/apply-increment-53e-unfixed-literal-width-inference.py
          python3 morphhdl/scripts/apply-increment-53e-full-domain-width-equivalence.py
          python3 morphhdl/scripts/apply-increment-53e-symbolic-zero-initializers.py
          python3 morphhdl/scripts/apply-increment-53e-final-helper-lowering.py
          python3 morphhdl/scripts/apply-increment-53e-expression-publication-diagnostic.py
          git diff --check

          hierarchy=morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogHierarchy.scala
          if grep -nE 'StreamFifo|StreamFifoCC|BufferCC|MORPHDL-IMPLICIT-LINEAGE' "$hierarchy"; then
            echo "Generic hierarchy lowering contains a component-specific name or temporary lineage diagnostic" >&2
            exit 1
          fi

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Validate generic hierarchy and native StreamFifoCC on both Scala lanes
        shell: bash
        env:
          MORPHDL_INCREMENT_53E_EXPRESSION_DEBUG: "1"
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill 'morph[2.12.18].testOnly' \
            morphhdl.GenericImplicitPackedShapeTests \
            morphhdl.GenericAutoResizeWidthTests \
            morphhdl.ParameterizedStreamFifoCCTests \
            2>&1 | tee /tmp/increment-53e-native-hierarchy-2.12.log
          /tmp/morphhdl-mill 'morph[2.13.12].testOnly' \
            morphhdl.GenericImplicitPackedShapeTests \
            morphhdl.GenericAutoResizeWidthTests \
            morphhdl.ParameterizedStreamFifoCCTests \
            2>&1 | tee /tmp/increment-53e-native-hierarchy-2.13.log

      - name: Collect generic expression publication evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence=/tmp/increment-53e-expression-evidence
          rm -rf "$evidence"
          mkdir -p "$evidence/patched-sources"
          cp morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala "$evidence/patched-sources/"
          cp morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogHierarchy.scala "$evidence/patched-sources/"
          cp morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalParameterizedVerilog.scala "$evidence/patched-sources/"
          cp morphruntime/src/main/scala/spinal/core/ExternalNativeIntShadowRegistry.scala "$evidence/patched-sources/"
          cp morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala "$evidence/patched-sources/"
          find "$evidence" -type f -print | sort > "$evidence/manifest.txt"

      - name: Upload focused validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53e-native-hierarchy-evidence
          path: |
            /tmp/increment-53e-native-hierarchy-2.12.log
            /tmp/increment-53e-native-hierarchy-2.13.log
            /tmp/increment-53e-expression-evidence
          if-no-files-found: error

      - name: Publish passing MorphHDL-only repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/increment-53e-address-resize-fix.yml
          rm -f morphhdl/scripts/apply-increment-53e-address-role-repair.py
          rm -f morphhdl/scripts/apply-increment-53e-implicit-child-width-formals.py
          rm -f morphhdl/scripts/apply-increment-53e-canonical-implicit-formal-identity.py
          rm -f morphhdl/scripts/apply-increment-53e-emitted-child-definition-match.py
          rm -f morphhdl/scripts/apply-increment-53e-generic-emitted-inventory.py
          rm -f morphhdl/scripts/apply-increment-53e-generic-packed-lineage.py
          rm -f morphhdl/scripts/apply-increment-53e-remove-lineage-debug.py
          rm -f morphhdl/scripts/apply-increment-53e-retained-packed-declaration-inventory.py
          rm -f morphhdl/scripts/apply-increment-53e-attributed-declarations.py
          rm -f morphhdl/scripts/apply-increment-53e-modular-literal-proof.py
          rm -f morphhdl/scripts/apply-increment-53e-materialized-auto-resize-proof.py
          rm -f morphhdl/scripts/apply-increment-53e-symbolic-auto-resize-width.py
          rm -f morphhdl/scripts/apply-increment-53e-auto-resize-assignment-rewrite.py
          rm -f morphhdl/scripts/apply-increment-53e-unfixed-literal-width-inference.py
          rm -f morphhdl/scripts/apply-increment-53e-full-domain-width-equivalence.py
          rm -f morphhdl/scripts/apply-increment-53e-symbolic-zero-initializers.py
          rm -f morphhdl/scripts/apply-increment-53e-final-helper-lowering.py
          rm -f morphhdl/scripts/apply-increment-53e-expression-publication-diagnostic.py
          rm -f morphhdl/scripts/apply-increment-53e-buffercc-shape-repair.py
          git add -A
          git diff --cached --check
          git commit -m 'Increment 53e: retain generic native symbolic hierarchy'
          git push origin HEAD:agent/increment-53e-native-streamfifocc-parameterization

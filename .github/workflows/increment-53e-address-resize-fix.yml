name: Increment 53e canonical native address-width fix

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write

jobs:
  apply-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0

      - name: Prepare authenticated branch checkout
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Canonicalize equivalent native address-width helper forms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "morphhdl/src/main/scala/spinal/core/internals/"
              "ParameterizedVerilogMemories.scala"
          )
          value = path.read_text()
          start_marker = "  private def equivalentWidth(\n"
          end_marker = "  private def requireType(\n"
          if value.count(start_marker) != 1 or value.count(end_marker) != 1:
              raise SystemExit(
                  "equivalentWidth/requireType method boundaries are ambiguous"
              )
          start = value.index(start_marker)
          end = value.index(end_marker, start)
          replacement = '''  private def canonicalWidthVerilog(value: String): String = {
            val normalized = compact(value)
            val addressWidthPrefix = "morphhdl_address_width("
            if (
              normalized.startsWith(addressWidthPrefix) &&
              normalized.endsWith(")")
            ) {
              val operand = normalized.substring(
                addressWidthPrefix.length,
                normalized.length - 1
              )
              s"clog2($operand,1)"
            } else normalized
          }

          private def equivalentWidth(
              left: ElaborationIntegerExpression,
              right: ElaborationIntegerExpression
          ): Boolean =
            canonicalWidthVerilog(left.verilog) ==
              canonicalWidthVerilog(right.verilog) &&
              left.default == right.default && left.minimum == right.minimum &&
              left.maximum == right.maximum &&
              left.parameters.sortBy(_.name) == right.parameters.sortBy(_.name)

          '''
          path.write_text(value[:start] + replacement + value[end:])
          PY
          git diff --check

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Validate native StreamFifoCC on both Scala lanes
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill 'morph[2.12.18].testOnly' \
            morphhdl.ParameterizedStreamFifoCCTests \
            2>&1 | tee /tmp/increment-53e-canonical-width-2.12.log
          /tmp/morphhdl-mill 'morph[2.13.12].testOnly' \
            morphhdl.ParameterizedStreamFifoCCTests \
            2>&1 | tee /tmp/increment-53e-canonical-width-2.13.log

      - name: Upload focused validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53e-canonical-width-evidence
          path: |
            /tmp/increment-53e-canonical-width-2.12.log
            /tmp/increment-53e-canonical-width-2.13.log
          if-no-files-found: ignore

      - name: Publish passing MorphHDL-only repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/increment-53e-address-resize-fix.yml
          git add -A
          git diff --cached --check
          git commit -m 'Increment 53e: equate native address-width helper forms'
          git push origin HEAD:agent/increment-53e-native-streamfifocc-parameterization

name: Increment 53e native StreamFifoCC address-resize diagnostic

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: read

jobs:
  trace-read-address:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0

      - name: Instrument retained address-width graph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "morphhdl/src/main/scala/spinal/core/internals/"
              "ParameterizedVerilogMemories.scala"
          )
          value = path.read_text()
          marker = """    if (
              native.parameters.nonEmpty &&
              retainedIsConcreteWitness &&
              native.default == retained.default &&
              driverProvesNativeWidth
            ) native
"""
          if value.count(marker) != 1:
              raise SystemExit("selectAddressWidth decision marker is ambiguous")

          diagnostic = r'''    if (source.exists(_.contains("Stream.scala:1908"))) {
              def baseLabel(value: BaseType): String = {
                val retainedValue = ParameterizedWidth.expressionOf(value)
                  .map(v => s"${v.verilog}/${v.default}/${v.minimum}/${v.maximum}")
                  .getOrElse("-")
                s"id=${System.identityHashCode(value)} class=${value.getClass.getName} " +
                  s"name=${value.getName()} width=${value.getBitsWidth} retained=$retainedValue"
              }

              println(
                s"[53e-address-proof] ROOT class=${address.getClass.getName} " +
                  s"op=${address.opName} width=${address.getWidth} " +
                  s"retained=${retained.verilog}/${retained.default}/${retained.minimum}/${retained.maximum} " +
                  s"native=${native.verilog}/${native.default}/${native.minimum}/${native.maximum} " +
                  s"driverProof=$driverProvesNativeWidth"
              )

              address match {
                case root: BaseType =>
                  val visited = new IdentityHashMap[BaseType, java.lang.Boolean]()

                  def dump(value: BaseType, depth: Int): Unit = {
                    if (
                      depth <= 10 &&
                      visited.put(value, java.lang.Boolean.TRUE) == null
                    ) {
                      val assignments = ArrayBuffer.empty[DataAssignmentStatement]
                      component.dslBody.walkLeafStatements {
                        case assignment: DataAssignmentStatement
                            if assignment.finalTarget eq value =>
                          assignments += assignment
                        case _ =>
                      }
                      println(
                        s"[53e-address-proof] ${"  " * depth}BASE ${baseLabel(value)} " +
                          s"assignments=${assignments.size}"
                      )
                      assignments.zipWithIndex.foreach { case (assignment, index) =>
                        assignment.source match {
                          case expression: Expression =>
                            val widthValue = expression match {
                              case width: Expression with WidthProvider =>
                                val candidate = widthOf(width, source)
                                s"${candidate.verilog}/${candidate.default}/${candidate.minimum}/${candidate.maximum}"
                              case _ => "not-width"
                            }
                            val bases = ArrayBuffer.empty[BaseType]
                            val expressionVisited =
                              new IdentityHashMap[Expression, java.lang.Boolean]()
                            def collect(node: Expression): Unit = {
                              if (
                                expressionVisited.put(node, java.lang.Boolean.TRUE) == null
                              ) {
                                node match {
                                  case base: BaseType => bases += base
                                  case other          => other.foreachExpression(collect)
                                }
                              }
                            }
                            collect(expression)
                            val uniqueBases = bases.foldLeft(Vector.empty[BaseType]) {
                              case (known, base) if known.exists(_ eq base) => known
                              case (known, base) => known :+ base
                            }
                            println(
                              s"[53e-address-proof] ${"  " * depth}ASSIGN[$index] " +
                                s"sourceClass=${expression.getClass.getName} op=${expression.opName} " +
                                s"sourceWidth=$widthValue bases=${uniqueBases.size} " +
                                s"source=${expression.toString.take(500)}"
                            )
                            uniqueBases.foreach { base =>
                              println(
                                s"[53e-address-proof] ${"  " * depth}  DEP ${baseLabel(base)}"
                              )
                              dump(base, depth + 1)
                            }
                          case other =>
                            println(
                              s"[53e-address-proof] ${"  " * depth}ASSIGN[$index] " +
                                s"nonExpression=${other.getClass.getName} value=$other"
                            )
                        }
                      }
                    }
                  }

                  dump(root, 0)
                case _ =>
                  println("[53e-address-proof] ROOT is not a BaseType")
              }
            }

'''
          value = value.replace(marker, diagnostic + marker)
          path.write_text(value)
          PY
          git diff --check

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Trace Scala 2.12 native StreamFifoCC witness
        shell: bash
        run: |
          set -o pipefail
          /tmp/morphhdl-mill 'morph[2.12.18].testOnly' \
            morphhdl.ParameterizedStreamFifoCCTests \
            2>&1 | tee /tmp/increment-53e-address-trace.log

      - name: Upload graph trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53e-address-trace
          path: /tmp/increment-53e-address-trace.log
          if-no-files-found: error

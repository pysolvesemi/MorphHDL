name: Increment 53e native StreamFifoCC address-resize fix

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write

jobs:
  apply-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0

      - name: Prepare authenticated branch checkout
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Extend native address proof through one unique driver chain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "morphhdl/src/main/scala/spinal/core/internals/"
              "ParameterizedVerilogMemories.scala"
          )
          value = path.read_text()
          start_marker = "    val driverProvesNativeWidth = address match {\n"
          end_marker = "    if (\n      native.parameters.nonEmpty &&\n"
          if value.count(start_marker) != 1 or value.count(end_marker) != 1:
              raise SystemExit(
                  "driverProvesNativeWidth/selectAddressWidth markers are ambiguous"
              )
          start = value.index(start_marker)
          end = value.index(end_marker, start)

          replacement = '''    val driverProvesNativeWidth = address match {
              case target: BaseType =>
                val seen = new IdentityHashMap[BaseType, java.lang.Boolean]()

                def assignmentsOf(
                    value: BaseType
                ): Vector[DataAssignmentStatement] = {
                  val assignments = ArrayBuffer.empty[DataAssignmentStatement]
                  component.dslBody.walkLeafStatements {
                    case assignment: DataAssignmentStatement
                        if assignment.finalTarget eq value =>
                      assignments += assignment
                    case _ =>
                  }
                  assignments.toVector
                }

                def immediateWidthProof(
                    assignments: Vector[DataAssignmentStatement]
                ): Boolean = {
                  val widths = assignments.flatMap { assignment =>
                    assignment.source match {
                      case value: Expression with WidthProvider =>
                        Some(widthOf(value, source))
                      case _ => None
                    }
                  }.distinct
                  widths.size == 1 && equivalentWidth(widths.head, native)
                }

                def uniqueBaseDependency(
                    assignment: DataAssignmentStatement
                ): Option[BaseType] = {
                  val bases = ArrayBuffer.empty[BaseType]
                  val visited =
                    new IdentityHashMap[Expression, java.lang.Boolean]()

                  def collect(value: Expression): Unit = {
                    if (visited.put(value, java.lang.Boolean.TRUE) == null) {
                      value match {
                        case base: BaseType => bases += base
                        case other          => other.foreachExpression(collect)
                      }
                    }
                  }

                  assignment.source match {
                    case expression: Expression => collect(expression)
                    case _ =>
                  }
                  val unique = bases.foldLeft(Vector.empty[BaseType]) {
                    case (known, value) if known.exists(_ eq value) => known
                    case (known, value) => known :+ value
                  }
                  if (unique.size == 1) Some(unique.head) else None
                }

                def walk(value: BaseType): Boolean = {
                  if (seen.put(value, java.lang.Boolean.TRUE) != null) false
                  else {
                    val assignments = assignmentsOf(value)
                    immediateWidthProof(assignments) ||
                      (assignments.size == 1 &&
                        uniqueBaseDependency(assignments.head).exists { next =>
                          walk(next)
                        })
                  }
                }

                walk(target)
              case _ => false
            }
'''

          path.write_text(value[:start] + replacement + value[end:])
          PY
          git diff --check

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Validate the native StreamFifoCC witness on both Scala lanes
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill 'morph[2.12.18].testOnly' \
            morphhdl.ParameterizedStreamFifoCCTests \
            2>&1 | tee /tmp/increment-53e-address-resize-2.12.log
          /tmp/morphhdl-mill 'morph[2.13.12].testOnly' \
            morphhdl.ParameterizedStreamFifoCCTests \
            2>&1 | tee /tmp/increment-53e-address-resize-2.13.log

      - name: Upload focused validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53e-address-resize-evidence
          path: |
            /tmp/increment-53e-address-resize-2.12.log
            /tmp/increment-53e-address-resize-2.13.log
          if-no-files-found: ignore

      - name: Publish the passing MorphHDL-only repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/increment-53e-address-resize-fix.yml
          git add -A
          git diff --cached --check
          git commit -m 'Increment 53e: recover native FIFO address width provenance'
          git push origin HEAD:agent/increment-53e-native-streamfifocc-parameterization

name: Increment 53e native StreamFifoCC write-address diagnostic

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: read

jobs:
  trace-address-graph:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0

      - name: Instrument transformed memory address expressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "morphhdl/src/main/scala/spinal/core/internals/"
              "ParameterizedVerilogMemories.scala"
          )
          value = path.read_text()
          marker = "    if (\n      native.parameters.nonEmpty &&\n      retainedIsConcreteWitness &&\n"
          if value.count(marker) != 1:
              raise SystemExit(
                  f"selectAddressWidth diagnostic marker count={value.count(marker)}"
              )

          diagnostic = r'''    if (
              native.parameters.nonEmpty &&
              source.exists(_.contains("Stream.scala:1908"))
            ) {
              val visited =
                new IdentityHashMap[Expression, java.lang.Boolean]()

              def retainedLabel(value: BaseType): String =
                ParameterizedWidth.expressionOf(value)
                  .map { retainedValue =>
                    s"${retainedValue.verilog}/${retainedValue.default}/" +
                      s"${retainedValue.minimum}/${retainedValue.maximum}"
                  }
                  .getOrElse("-")

              def expressionWidth(value: Expression): String =
                value match {
                  case width: Expression with WidthProvider =>
                    val retainedValue = widthOf(width, source)
                    s"${retainedValue.verilog}/${retainedValue.default}/" +
                      s"${retainedValue.minimum}/${retainedValue.maximum}"
                  case _ => "not-width"
                }

              def dump(value: Expression, depth: Int): Unit = {
                if (
                  depth <= 14 &&
                  visited.put(value, java.lang.Boolean.TRUE) == null
                ) {
                  val indent = "  " * depth
                  val baseDetails = value match {
                    case base: BaseType =>
                      s" name=${base.getName()} bits=${base.getBitsWidth}" +
                        s" autoResize=${base.hasTag(tagAutoResize)}" +
                        s" retained=${retainedLabel(base)}"
                    case _ => ""
                  }
                  println(
                    s"[53e-write-address] ${indent}EXPR " +
                      s"id=${System.identityHashCode(value)} " +
                      s"class=${value.getClass.getName} op=${value.opName} " +
                      s"width=${expressionWidth(value)}$baseDetails " +
                      s"text=${value.toString.take(500)}"
                  )

                  val children = ArrayBuffer.empty[Expression]
                  value.foreachExpression(children += _)
                  children.zipWithIndex.foreach { case (child, index) =>
                    println(
                      s"[53e-write-address] ${indent}  CHILD[$index] " +
                        s"id=${System.identityHashCode(child)} " +
                        s"class=${child.getClass.getName} op=${child.opName}"
                    )
                    dump(child, depth + 1)
                  }

                  value match {
                    case base: BaseType =>
                      val assignments =
                        ArrayBuffer.empty[DataAssignmentStatement]
                      component.dslBody.walkLeafStatements {
                        case assignment: DataAssignmentStatement
                            if assignment.finalTarget eq base =>
                          assignments += assignment
                        case _ =>
                      }
                      println(
                        s"[53e-write-address] ${indent}  DRIVERS=" +
                          assignments.size
                      )
                      assignments.zipWithIndex.foreach {
                        case (assignment, index) =>
                          assignment.source match {
                            case expression: Expression =>
                              println(
                                s"[53e-write-address] ${indent}  DRIVER[$index] " +
                                  s"sourceId=${System.identityHashCode(expression)} " +
                                  s"sourceClass=${expression.getClass.getName} " +
                                  s"sourceOp=${expression.opName} " +
                                  s"sourceWidth=${expressionWidth(expression)} " +
                                  s"sourceText=${expression.toString.take(500)}"
                              )
                              dump(expression, depth + 1)
                            case other =>
                              println(
                                s"[53e-write-address] ${indent}  DRIVER[$index] " +
                                  s"nonExpression=${other.getClass.getName} " +
                                  s"value=$other"
                              )
                          }
                      }
                    case _ =>
                  }
                }
              }

              println(
                s"[53e-write-address] ROOT roleSource=${source.getOrElse("-")} " +
                  s"addressClass=${address.getClass.getName} " +
                  s"addressOp=${address.opName} concrete=${address.getWidth} " +
                  s"retained=${retained.verilog}/${retained.default}/" +
                  s"${retained.minimum}/${retained.maximum} " +
                  s"native=${native.verilog}/${native.default}/" +
                  s"${native.minimum}/${native.maximum} " +
                  s"driverProof=$driverProvesNativeWidth"
              )
              dump(address, 0)
            }

          '''
          path.write_text(value.replace(marker, diagnostic + marker, 1))
          PY
          git diff --check

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Trace Scala 2.12 native StreamFifoCC witness
        shell: bash
        run: |
          set -o pipefail
          /tmp/morphhdl-mill 'morph[2.12.18].testOnly' \
            morphhdl.ParameterizedStreamFifoCCTests \
            2>&1 | tee /tmp/increment-53e-write-address-trace.log

      - name: Upload address graph trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53e-write-address-trace
          path: /tmp/increment-53e-write-address-trace.log
          if-no-files-found: ignore

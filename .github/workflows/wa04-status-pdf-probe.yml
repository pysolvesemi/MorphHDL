name: WA-04 PDF status probe

on:
  push:
    branches:
      - agent/wa-04-unnamed-simple-wire-elimination
    paths:
      - ".github/workflows/wa04-status-pdf-probe.yml"

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate PDF status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${GITHUB_REPOSITORY}/pulls/138 > /tmp/pr.json
          gh api /repos/${GITHUB_REPOSITORY}/actions/runs/33789075039 > /tmp/impl.json
          gh api '/repos/${GITHUB_REPOSITORY}/actions/workflows/wa04-complete-and-merge-v4.yml/runs?per_page=1' > /tmp/gates.json || printf '{"workflow_runs":[]}' > /tmp/gates.json
          gh api '/repos/${GITHUB_REPOSITORY}/contents/morphhdl-passes/morphhdl-ir-wire-assignment-passes-todo.md?ref=parameterized-verilog' > /tmp/roadmap.json
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          pr=json.loads(Path('/tmp/pr.json').read_text())
          impl=json.loads(Path('/tmp/impl.json').read_text())
          gates=json.loads(Path('/tmp/gates.json').read_text()).get('workflow_runs',[])
          roadmap_api=json.loads(Path('/tmp/roadmap.json').read_text())
          roadmap=base64.b64decode(roadmap_api['content']).decode()
          gate=gates[0] if gates else {}
          def section(marker):
              return roadmap.split(marker,1)[1].split('\n- [',1)[0] if marker in roadmap else ''
          state={
            'pr_state':pr.get('state'),
            'merged':pr.get('merged'),
            'merged_at':pr.get('merged_at'),
            'pr_head':pr.get('head',{}).get('sha'),
            'merge_commit_sha':pr.get('merge_commit_sha'),
            'impl_run_id':impl.get('id'),
            'impl_status':impl.get('status'),
            'impl_conclusion':impl.get('conclusion'),
            'gate_run_id':gate.get('id'),
            'gate_status':gate.get('status'),
            'gate_conclusion':gate.get('conclusion'),
            'base_wa04_checked':'- [x] **WA-04 —' in roadmap,
            'base_wa04_completed':'**Status:** `COMPLETED`.' in section('- [x] **WA-04 —'),
            'base_wa05_ready':'**Status:** `READY`.' in section('- [ ] **WA-05 —'),
          }
          Path('wa04-status.json').write_text(json.dumps(state,indent=2,sort_keys=True)+'\n')
          lines=['WA-04 EXACT STATUS']+[f'{k}: {v}' for k,v in state.items()]
          escaped=[line.replace('\\','\\\\').replace('(','\\(').replace(')','\\)') for line in lines]
          commands=['BT','/F1 10 Tf','40 760 Td']
          for index,line in enumerate(escaped):
              if index: commands.append('0 -16 Td')
              commands.append(f'({line}) Tj')
          commands.append('ET')
          stream='\n'.join(commands).encode()
          objs=[
            b'1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj\n',
            b'2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj\n',
            b'3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >> endobj\n',
            b'4 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> endobj\n',
            b'5 0 obj << /Length '+str(len(stream)).encode()+b' >> stream\n'+stream+b'\nendstream endobj\n',
          ]
          pdf=bytearray(b'%PDF-1.4\n'); offsets=[0]
          for obj in objs: offsets.append(len(pdf)); pdf.extend(obj)
          xref=len(pdf); pdf.extend(f'xref\n0 {len(objs)+1}\n'.encode()); pdf.extend(b'0000000000 65535 f \n')
          for off in offsets[1:]: pdf.extend(f'{off:010d} 00000 n \n'.encode())
          pdf.extend(f'trailer << /Size {len(objs)+1} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n'.encode())
          Path('wa04-status.pdf').write_bytes(pdf)
          print(json.dumps(state,sort_keys=True))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add wa04-status.json wa04-status.pdf
          git commit -m 'WA-04: record temporary PDF status'
          git push origin HEAD:${GITHUB_REF_NAME}

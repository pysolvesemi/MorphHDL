name: Increment 53e runtime-safe generic native compiler

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write

concurrency:
  group: increment-53e-runtime-safe-generic-compiler
  cancel-in-progress: true

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0

      - name: Configure exact remote checkout
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin agent/increment-53e-native-streamfifocc-parameterization
          git reset --hard origin/agent/increment-53e-native-streamfifocc-parameterization
          git rev-parse HEAD > /tmp/validated-head

      - name: Materialize runtime-safe generic compiler support
        shell: bash
        run: |
          set -euo pipefail
          if ! test -x morphhdl/scripts/check-generic-native-int-compiler.sh || \
             ! bash morphhdl/scripts/check-generic-native-int-compiler.sh >/dev/null 2>&1; then
            python3 morphhdl/scripts/apply-increment-53e-generic-native-source-selection.py
            python3 morphhdl/scripts/apply-increment-53e-generic-native-shape-selection.py
          fi
          python3 morphhdl/scripts/apply-increment-53e-generic-candidate-argument-selection.py
          bash morphhdl/scripts/check-generic-native-int-compiler.sh
          bash morphhdl/scripts/check-generic-parameterized-width-engine.sh
          git diff --check

      - name: Install pinned Mill
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/mill
          chmod +x /tmp/mill

      - name: Compile and test both supported Scala lanes
        shell: bash
        run: |
          set -euo pipefail
          for scala in 2.12.18 2.13.12; do
            /tmp/mill "morph[$scala].testOnly" \
              spinal.core.internals.ExternalParameterizedWidthDomainProofTests \
              morphhdl.ParameterizedStreamFifoCCTests \
              2>&1 | tee "/tmp/53e-runtime-safe-$scala.log"
          done
          bash morphhdl/scripts/check-native-streamfifocc-parameterization-boundary.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53e-runtime-safe-generic-compiler-evidence
          path: /tmp/53e-runtime-safe-*.log
          if-no-files-found: ignore

      - name: Publish exactly the tested source
        shell: bash
        run: |
          set -euo pipefail
          validated=$(cat /tmp/validated-head)
          remote=$(git ls-remote origin refs/heads/agent/increment-53e-native-streamfifocc-parameterization | awk '{print $1}')
          test "$validated" = "$remote"
          rm -f .github/workflows/increment-53e-generic-native-compiler.yml
          rm -f .github/workflows/increment-53e-generic-runtime-safe-compiler.yml
          rm -f morphhdl/scripts/apply-increment-53e-generic-native-source-selection.py
          rm -f morphhdl/scripts/apply-increment-53e-generic-native-shape-selection.py
          rm -f morphhdl/scripts/apply-increment-53e-generic-candidate-argument-selection.py
          git add -A
          git diff --cached --check
          git commit -m 'Increment 53e: make native compiler capture generic and inert'
          git push origin HEAD:agent/increment-53e-native-streamfifocc-parameterization

name: Roadmap insert native Mem Increment 45

on:
  push:
    branches:
      - agent/roadmap-increment-45-native-mem-provenance

permissions:
  contents: write

jobs:
  update-roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/roadmap-increment-45-native-mem-provenance
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Insert Increment 45 and renumber later roadmap items
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/morphhdl/parameterized-verilog-todo.md')
          text = path.read_text()

          if '**Increment 45 — Automatic native `Mem` symbolic-depth provenance**' in text:
              raise SystemExit('new Increment 45 already exists')

          expected_old = '**Increment 45 — Formal parameter identity and canonical child modules**'
          if text.count(expected_old) != 1:
              raise SystemExit(f'expected exactly one old Increment 45 heading, found {text.count(expected_old)}')

          # Renumber only roadmap headings, descending to avoid collisions.
          for number in range(55, 44, -1):
              pattern = rf'(\*\*Increment ){number}( —)'
              text, count = re.subn(pattern, rf'\g<1>{number + 1}\2', text)
              if count != 1:
                  raise SystemExit(f'expected one Increment {number} heading, found {count}')

          replacements = {
              'The source audit and classification behind Increments 38 through 55 are':
                  'The source audit and classification behind Increments 38 through 56 are',
              'prerequisites. Increment 52 must not start until Increments 45 through 51 are':
                  'prerequisites. Increment 53 must not start until Increments 46 through 52 are',
              'At an Increment 46 formalization boundary, associate each selected native':
                  'At an Increment 47 formalization boundary, associate each selected native',
              'predicate is proven to depend on shadow-symbolic native `Int` values from\n  Increments 48 and 49.':
                  'predicate is proven to depend on shadow-symbolic native `Int` values from\n  Increments 49 and 50.',
              'Apply Increments 45 through 51 to the real, untouched `StreamFifo` source.':
                  'Apply Increments 46 through 52 to the real, untouched `StreamFifo` source.',
              'gates for Increments 29 through 52.':
                  'gates for Increments 29 through 53.',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one roadmap reference: {old!r}')
              text = text.replace(old, new, 1)

          insertion_point = (
              'The formalization and symbolic-control-flow increments below are strict ordered\n'
              'prerequisites. Increment 53 must not start until Increments 46 through 52 are\n'
              'implemented, reviewed and merged.\n'
          )
          if text.count(insertion_point) != 1:
              raise SystemExit('formalization dependency paragraph not found exactly once')

          new_increment = '''- [ ] **Increment 45 — Automatic native `Mem` symbolic-depth provenance**

  Allow ordinary native-looking `Mem(HardType(...), depth)` construction to
  pass only the concrete witness to untouched SpinalHDL while retaining the
  exact originating `HdlInt` depth expression externally, without requiring
  `morphhdl.frontend.Mem`. Associate provenance by deterministic call-site,
  formal-slot and object identity; never infer it by matching a concrete
  integer value alone. Prove that literal `Mem(..., 5)` remains concrete,
  `Mem(..., DEPTH)` emits `[0:DEPTH-1]`, compound depth expressions retain
  their symbolic bounds, and equal witnesses with distinct symbolic origins
  remain distinguishable. Reject ambiguous or conflicting provenance
  explicitly. Preserve byte-for-byte native `Mem.scala`, ordinary concrete
  `SpinalVerilog`, all Increment 43 memory contracts, deterministic replay and
  both supported Scala versions.

'''
          text = text.replace(insertion_point, new_increment + insertion_point, 1)

          headings = [int(value) for value in re.findall(r'^- \[[ x]\] \*\*Increment (\d+) —', text, re.M)]
          expected = list(range(29, 57))
          if headings != expected:
              raise SystemExit(f'roadmap headings are not contiguous 29 through 56: {headings}')

          if text.count('**Increment 45 — Automatic native `Mem` symbolic-depth provenance**') != 1:
              raise SystemExit('new Increment 45 heading missing or duplicated')
          if '**Increment 46 — Formal parameter identity and canonical child modules**' not in text:
              raise SystemExit('former Increment 45 was not renumbered to 46')
          if '**Increment 56 — Migration and adapter retirement**' not in text:
              raise SystemExit('final increment was not renumbered to 56')

          stale = [
              'Increment 52 must not start until Increments 45 through 51',
              'At an Increment 46 formalization boundary',
              'Increments 48 and 49',
              'Apply Increments 45 through 51',
              'gates for Increments 29 through 52.',
              'Increments 38 through 55 are',
          ]
          remaining = [value for value in stale if value in text]
          if remaining:
              raise SystemExit(f'stale roadmap references remain: {remaining}')

          path.write_text(text)
          PY

          rm -- .github/workflows/roadmap-insert-native-mem-increment-45.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/morphhdl/parameterized-verilog-todo.md .github/workflows/roadmap-insert-native-mem-increment-45.yml
          git commit -m 'docs: insert native Mem provenance as Increment 45'
          git push origin HEAD:agent/roadmap-increment-45-native-mem-provenance

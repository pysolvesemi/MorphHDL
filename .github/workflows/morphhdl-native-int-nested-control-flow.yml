name: MorphHDL native Int nested symbolic control flow

on:
  push:
    branches:
      - main
      - parameterized-verilog
  pull_request:
    branches:
      - main
      - parameterized-verilog
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morphhdl-native-int-nested-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    name: Apply captured-memory retention repair
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Preserve captured memories through native lowering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one patch site, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "frontend/src/main/scala/spinal/core/ParameterizedStructure.scala",
              """    declarations.foreach { value =>
      value.setAsVital()
      value.dontSimplifyIt()
    }
    memoryPorts.foreach(port => port.isVital = true)
""",
              """    declarations.foreach { value =>
      value.setAsVital()
      value.dontSimplifyIt()
    }
    memories.foreach(_.preventAsBlackBox())
    memoryPorts.foreach(port => port.isVital = true)
""",
          )

          replace_once(
              "frontend/src/main/scala/spinal/core/ParameterizedProcess.scala",
              """      val block = new ParameterizedStructuralBlock(
""",
              """      // Structural range bodies must retain inferred memories as native
      // declarations until MorphHDL relocates them into the generate region.
      memories.foreach(_.preventAsBlackBox())

      val block = new ParameterizedStructuralBlock(
""",
          )
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main/scala/spinal/core/ParameterizedStructure.scala \
            frontend/src/main/scala/spinal/core/ParameterizedProcess.scala
          if git diff --cached --quiet; then
            echo "Captured-memory retention fix already present."
          else
            git commit -m "Fix Increment 52 captured memory retention"
            git push origin HEAD:${{ github.head_ref }}
          fi

  source-boundary:
    name: Native Int nested-control source boundary
    needs: repair
    if: ${{ always() && (needs.repair.result == 'success' || needs.repair.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Prove safe nested capture and zero native diff
        shell: bash
        run: bash morphhdl/scripts/check-native-int-nested-control-flow-boundary.sh

  contracts:
    name: Native Int nested-control proof Scala ${{ matrix.scala_version }}
    needs: source-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    strategy:
      fail-fast: false
      matrix:
        scala_version:
          - "2.12.18"
          - "2.13.12"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Validate nested control flow safety and inherited contracts
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill frontend[${{ matrix.scala_version }}].testOnly \
            morphhdl.frontend.HdlIntTests
          /tmp/morphhdl-mill morph[${{ matrix.scala_version }}].testOnly \
            morphhdl.NativeIntNestedSymbolicControlFlowTests \
            morphhdl.NativeIntSymbolicConditionalTests \
            morphhdl.NaturalSymbolicConditionalTests \
            morphhdl.ExternalNativeIntShadowExpressionTests \
            morphhdl.ExternalNativeIntShadowProvenanceTests \
            morphhdl.ExternalNativeIntFormalizationTests \
            morphhdl.FormalParameterIdentityTests \
            morphhdl.FormalParameterClonePropagationTests \
            morphhdl.HierarchyParameterBindingTests \
            morphhdl.MorphSingleSourceVerilogTests \
            morphhdl.integration.ExternalSpinalVerilogBaselineTests

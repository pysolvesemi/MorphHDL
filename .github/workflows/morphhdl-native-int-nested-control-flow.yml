name: MorphHDL native Int nested symbolic control flow

on:
  pull_request:
    branches:
      - parameterized-verilog

permissions:
  contents: write

jobs:
  repair:
    name: Accept attributed native declarations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch declaration recognition and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala")
          text = path.read_text(encoding="utf-8")
          old = '''  private def isDeclarationLine(value: String): Boolean =
    value.startsWith("wire ") || value.startsWith("reg ") || value.startsWith("integer ")
'''
          new = '''  private def stripLeadingVerilogAttributes(value: String): String = {
    var remaining = value.trim
    while (remaining.startsWith("(*")) {
      val end = remaining.indexOf("*)")
      if (end < 0) return remaining
      remaining = remaining.substring(end + 2).trim
    }
    remaining
  }

  private def isDeclarationLine(value: String): Boolean = {
    val declaration = stripLeadingVerilogAttributes(value)
    declaration.startsWith("wire ") || declaration.startsWith("reg ") ||
      declaration.startsWith("integer ")
  }
'''
          if new not in text:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one declaration-recognition patch site, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala
          if git diff --cached --quiet; then
            echo "Attributed declaration support already present."
          else
            git commit -m "Handle attributed structural declarations"
            git push origin HEAD:${{ github.head_ref }}
          fi

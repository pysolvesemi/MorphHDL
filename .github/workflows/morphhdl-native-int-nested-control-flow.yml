name: Increment 52 shared-process repair carrier

on:
  pull_request:
    branches:
      - parameterized-verilog

permissions:
  contents: write

concurrency:
  group: increment-52-shared-process-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/increment-52-post-merge-overlap-fix' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out Increment 52 closure branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-52-post-merge-overlap-fix
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply shared-process partition and restore permanent workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_increment52_shared_process_fix.py')
          text = path.read_text(encoding='utf-8')
          old = 'mkString("\\n")'
          new = 'mkString("\\\\n")'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected two Scala newline escape sites, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 .github/scripts/apply_increment52_shared_process_fix.py

          python3 - <<'PY'
          from pathlib import Path

          path = Path('morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one site, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import java.util.regex.{Matcher, Pattern}\n',
              'import java.util.IdentityHashMap\nimport java.util.regex.{Matcher, Pattern}\n',
              'identity import',
          )

          replace_once(
              '  private final case class BlockPlan(\n',
              '  private final case class AssignmentEvidence(\n' +
              '      target: String,\n' +
              '      sourceNames: Set[String]\n' +
              '  )\n\n' +
              '  private final case class BlockPlan(\n',
              'AssignmentEvidence declaration',
          )

          replace_once(
              '      ownedNames: Set[String]\n  )\n\n  private final case class AlternativeStep(',
              '      ownedNames: Set[String],\n' +
              '      assignmentEvidence: Vector[AssignmentEvidence]\n' +
              '  )\n\n  private final case class AlternativeStep(',
              'BlockPlan assignmentEvidence field',
          )

          replace_once(
              '    val ownedTargetNames = mutable.LinkedHashSet.empty[String]\n',
              '    val ownedTargetNames = mutable.LinkedHashSet.empty[String]\n' +
              '    val assignmentEvidence = ArrayBuffer.empty[AssignmentEvidence]\n' +
              '    val emittedActualByExpression = new IdentityHashMap[Expression, String]()\n',
              'assignment evidence buffers',
          )

          replace_once(
              '      val instanceText = range.indices.map(lines).mkString("\\n")\n' +
              '      connectionActualNames(instanceText).foreach { name =>\n',
              '      val instanceText = range.indices.map(lines).mkString("\\n")\n' +
              '      val actualByPort = connectionActualByPort(instanceText)\n' +
              '      child.getOrdredNodeIo.toVector.foreach { port =>\n' +
              '        Option(port.getName()).flatMap(actualByPort.get).foreach { actual =>\n' +
              '          emittedActualByExpression.put(port, actual)\n' +
              '        }\n' +
              '      }\n' +
              '      connectionActualNames(instanceText).foreach { name =>\n',
              'child output actual evidence',
          )

          replace_once(
              '    val fixedSlicePatterns = block.slices.map(fixedSlicePattern)\n',
              '    block.assignments.foreach { assignment =>\n' +
              '      Option(assignment.finalTarget.getName()).filter(_.nonEmpty).foreach { name =>\n' +
              '        assignmentEvidence += AssignmentEvidence(\n' +
              '          name,\n' +
              '          expressionNames(assignment.source) ++\n' +
              '            emittedActualNames(assignment.source, emittedActualByExpression)\n' +
              '        )\n' +
              '      }\n' +
              '    }\n\n' +
              '    val fixedSlicePatterns = block.slices.map(fixedSlicePattern)\n',
              'captured assignment evidence',
          )

          constructor_site = '(trackedInternalNames ++ ownedTargetNames).toSet\n'
          constructor_count = text.count(constructor_site)
          if constructor_count != 2:
              raise SystemExit(f'BlockPlan constructor evidence: expected two sites, found {constructor_count}')
          text = text.replace(
              constructor_site,
              '(trackedInternalNames ++ ownedTargetNames).toSet,\n' +
              '      assignmentEvidence.toVector\n',
          )

          helper_anchor = '  private def finalizePlan(plan: BlockPlan): BlockPlan = {\n'
          helper = (
              '  private def expressionNames(root: Expression): Set[String] = {\n'
              '    val names = mutable.LinkedHashSet.empty[String]\n'
              '    val visited = new IdentityHashMap[Expression, java.lang.Boolean]()\n\n'
              '    def visit(value: Expression): Unit = {\n'
              '      if ((value ne null) && !visited.containsKey(value)) {\n'
              '        visited.put(value, java.lang.Boolean.TRUE)\n'
              '        value match {\n'
              '          case named: Nameable =>\n'
              '            Option(named.getName()).filter(_.nonEmpty).foreach(names += _)\n'
              '          case _ =>\n'
              '        }\n'
              '        value.foreachExpression(visit)\n'
              '      }\n'
              '    }\n\n'
              '    visit(root)\n'
              '    names.toSet\n'
              '  }\n\n'
              '  private def emittedActualNames(\n'
              '      root: Expression,\n'
              '      actualByExpression: IdentityHashMap[Expression, String]\n'
              '  ): Set[String] = {\n'
              '    val names = mutable.LinkedHashSet.empty[String]\n'
              '    val visited = new IdentityHashMap[Expression, java.lang.Boolean]()\n\n'
              '    def visit(value: Expression): Unit = {\n'
              '      if ((value ne null) && !visited.containsKey(value)) {\n'
              '        visited.put(value, java.lang.Boolean.TRUE)\n'
              '        Option(actualByExpression.get(value)).foreach(names += _)\n'
              '        value.foreachExpression(visit)\n'
              '      }\n'
              '    }\n\n'
              '    visit(root)\n'
              '    names.toSet\n'
              '  }\n\n'
          )
          replace_once(helper_anchor, helper + helper_anchor, 'expression evidence helpers')

          ownership_old = (
              '                val assignmentNames = identifierTokens(stripped)\n'
              '                val owners = claimants.filter { plan =>\n'
              '                  uniqueEvidence(plan.block).exists(name => assignmentNames(name))\n'
              '                }\n'
              '                owners match {\n'
          )
          ownership_new = (
              '                val targetName = statement.group(1)\n'
              '                val rhsNames = identifierTokens(statement.group(3))\n'
              '                val exactOwners = claimants.filter { plan =>\n'
              '                  plan.assignmentEvidence.exists { evidence =>\n'
              '                    evidence.target == targetName &&\n'
              '                    evidence.sourceNames.exists(rhsNames.contains)\n'
              '                  }\n'
              '                }\n'
              '                val owners =\n'
              '                  if (exactOwners.nonEmpty) exactOwners\n'
              '                  else {\n'
              '                    val assignmentNames = identifierTokens(stripped)\n'
              '                    claimants.filter { plan =>\n'
              '                      uniqueEvidence(plan.block).exists(name => assignmentNames(name))\n'
              '                    }\n'
              '                  }\n'
              '                owners match {\n'
          )
          replace_once(ownership_old, ownership_new, 'AST assignment ownership')

          connection_anchor = '  private def connectionActualNames(instanceText: String): Vector[String] = {\n'
          connection_helper = (
              '  private def connectionActualByPort(instanceText: String): Map[String, String] = {\n'
              '    val pattern = "\\\\.([A-Za-z_][A-Za-z0-9_]*)\\\\s*\\\\(\\\\s*([A-Za-z_][A-Za-z0-9_]*)\\\\s*\\\\)".r\n'
              '    pattern.findAllMatchIn(instanceText).map { matched =>\n'
              '      matched.group(1) -> matched.group(2)\n'
              '    }.toMap\n'
              '  }\n\n'
          )
          replace_once(connection_anchor, connection_helper + connection_anchor, 'connection actual mapping')

          path.write_text(text, encoding='utf-8')
          PY

          git show c37cfba9e8ed0d5ffa64cb0d631a35b986a30632:.github/workflows/morphhdl-native-int-nested-control-flow.yml \
            > .github/workflows/morphhdl-native-int-nested-control-flow.yml
          rm -f .github/workflows/increment-52-overlap-diagnostic.yml
          rm -f .github/scripts/apply_increment52_shared_process_fix.py
          git diff --check

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Validate source boundary and focused Increment 52 contract
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl/scripts/check-native-int-nested-control-flow-boundary.sh
          set +e
          /tmp/morphhdl-mill morph[2.12.18].testOnly \
            morphhdl.NativeIntNestedSymbolicControlFlowTests \
            > /tmp/increment52-focused.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo '===== Increment 52 focused diagnostic ====='
            grep -E 'FAILED|SPINAL-PARAMETERIZED|MorphVerilogException|ParameterizedVerilogException|error\]|Exception|Tests: succeeded|TESTS FAILED' \
              /tmp/increment52-focused.log | tail -n 160 || true
            echo '===== Increment 52 focused tail ====='
            tail -n 120 /tmp/increment52-focused.log
            exit "$status"
          fi
          tail -n 40 /tmp/increment52-focused.log
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.NativeIntNestedSymbolicControlFlowTests

      - name: Commit repaired production tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala \
                  .github/workflows/morphhdl-native-int-nested-control-flow.yml
          git add -u .github/workflows .github/scripts
          git commit -m 'fix: partition shared native processes by captured child-output evidence'
          git push origin HEAD:agent/increment-52-post-merge-overlap-fix

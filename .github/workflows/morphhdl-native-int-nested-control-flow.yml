name: MorphHDL native Int nested symbolic control flow

# Stable required-check name; parser-wide native replay is retired.
on:
  push:
    branches: [main, parameterized-verilog]
  pull_request:
    branches: [main, parameterized-verilog]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morphhdl-native-int-nested-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundary:
    name: Native Int nested-control source boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prove nested replay retirement
        run: |
          python3 morphhdl/scripts/check-production-retirement.py --self-test
          bash morphhdl/scripts/check-native-int-nested-control-flow-boundary.sh

  contracts:
    name: Native Int nested-control proof Scala ${{ matrix.scala_version }}
    needs: source-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Exercise typed nested control flow
        run: >-
          sbt -batch "++${{ matrix.scala_version }}"
          "morph/testOnly morphhdl.TypedElaborationControlTests"

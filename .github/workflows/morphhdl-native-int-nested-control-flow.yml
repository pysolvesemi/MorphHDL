name: Increment 52 overlap diagnostic carrier

on:
  push:
    branches:
      - agent/increment-52-nested-control-flow-clean
    paths:
      - .github/workflows/morphhdl-native-int-nested-control-flow.yml

permissions:
  contents: write

jobs:
  instrument:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-52-nested-control-flow-clean
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch overlap diagnostic and restore validation workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala')
          text = path.read_text(encoding='utf-8')
          old = '''          s"captured native module-item ranges ${left.start}-${left.end} and ${right.start}-${right.end} overlap"
'''
          new = '''          s"captured native module-item ranges ${left.start}-${left.end} and ${right.start}-${right.end} overlap\\n" +
            s"overlap text:\\n${lines.slice(math.min(left.start, right.start), math.max(left.end, right.end) + 1).mkString("\\n")}" 
'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one overlap diagnostic site, found {text.count(old)}')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

          git show HEAD^:.github/workflows/morphhdl-native-int-nested-control-flow.yml \
            > .github/workflows/morphhdl-native-int-nested-control-flow.yml
          rm -f .github/workflows/increment-52-overlap-debug.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala \
                  .github/workflows/morphhdl-native-int-nested-control-flow.yml
          git add -u .github/workflows
          git commit -m 'test: expose Increment 52 overlap process text'
          git push origin HEAD:agent/increment-52-nested-control-flow-clean

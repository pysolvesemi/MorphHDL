name: Increment 52 shared-process repair carrier

on:
  pull_request:
    branches:
      - parameterized-verilog

permissions:
  contents: write

concurrency:
  group: increment-52-shared-process-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/increment-52-post-merge-overlap-fix' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out Increment 52 closure branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-52-post-merge-overlap-fix
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply production repair and restore permanent workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_increment52_shared_process_fix.py')
          text = path.read_text(encoding='utf-8')
          old = 'mkString("\\n")'
          new = 'mkString("\\\\n")'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected two Scala newline escape sites, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 .github/scripts/apply_increment52_shared_process_fix.py

          python3 - <<'PY'
          from pathlib import Path
          path = Path(
              'morphhdl/src/main/scala/spinal/core/internals/'
              'ParameterizedVerilogStructural.scala'
          )
          text = path.read_text(encoding='utf-8')

          old = '''    val trackedInternalNames = mutable.LinkedHashSet.empty[String]
              val ownedTargetNames = mutable.LinkedHashSet.empty[String]
          '''
          new = '''    val trackedInternalNames = mutable.LinkedHashSet.empty[String]
              val ownedTargetNames = mutable.LinkedHashSet.empty[String]
              val ownedSourceNames = mutable.LinkedHashSet.empty[String]
          '''
          if text.count(old) != 1:
              raise SystemExit(
                  f'expected one ownership declaration site, found {text.count(old)}'
              )
          text = text.replace(old, new, 1)

          old = '''    block.assignments.foreach { assignment =>
              Option(assignment.finalTarget.getName()).filter(_.nonEmpty).foreach { name =>
                ownedTargetNames += name
              }
            }
          '''
          new = '''    block.assignments.foreach { assignment =>
              Option(assignment.finalTarget.getName()).filter(_.nonEmpty).foreach { name =>
                ownedTargetNames += name
              }
              sourceExpressionNames(assignment.source).foreach(ownedSourceNames += _)
            }
          '''
          if text.count(old) != 1:
              raise SystemExit(
                  f'expected one captured-assignment site, found {text.count(old)}'
              )
          text = text.replace(old, new, 1)

          old = '(trackedInternalNames ++ ownedTargetNames).toSet'
          new = '(trackedInternalNames ++ ownedTargetNames ++ ownedSourceNames).toSet'
          if text.count(old) != 2:
              raise SystemExit(
                  f'expected two BlockPlan ownership sites, found {text.count(old)}'
              )
          text = text.replace(old, new)

          marker = '  private def planBlock(\n'
          if text.count(marker) != 1:
              raise SystemExit(
                  f'expected one planBlock marker, found {text.count(marker)}'
              )
          helper = '''  private def sourceExpressionNames(
              expression: Expression
          ): Set[String] = {
            val names = mutable.LinkedHashSet.empty[String]
            val visited =
              new java.util.IdentityHashMap[Expression, java.lang.Boolean]()

            def visit(value: Expression): Unit = {
              if ((value ne null) && !visited.containsKey(value)) {
                visited.put(value, java.lang.Boolean.TRUE)
                value match {
                  case baseType: BaseType =>
                    Option(baseType.getName()).filter(_.nonEmpty).foreach(names += _)
                  case _ =>
                }
                value.foreachExpression(visit)
              }
            }

            visit(expression)
            names.toSet
          }

          '''
          text = text.replace(marker, helper + marker, 1)

          old = '''                val assignmentNames = identifierTokens(stripped)
                val owners = claimants.filter { plan =>
                  uniqueEvidence(plan.block).exists(name => assignmentNames(name))
                }
          '''
          new = '''                val sourceNames = identifierTokens(statement.group(3))
                val directOwners = claimants.filter { plan =>
                  plan.ownedNames.exists(name => sourceNames(name))
                }
                val owners =
                  if (directOwners.nonEmpty) directOwners
                  else
                    claimants.filter { plan =>
                      uniqueEvidence(plan.block).exists(name => sourceNames(name))
                    }
          '''
          if text.count(old) != 1:
              raise SystemExit(
                  f'expected one process-owner inference site, found {text.count(old)}'
              )
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git show c37cfba9e8ed0d5ffa64cb0d631a35b986a30632:.github/workflows/morphhdl-native-int-nested-control-flow.yml \
            > .github/workflows/morphhdl-native-int-nested-control-flow.yml
          rm -f .github/workflows/increment-52-overlap-diagnostic.yml
          rm -f .github/scripts/apply_increment52_shared_process_fix.py
          git diff --check

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Validate source boundary and focused Increment 52 contracts
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl/scripts/check-native-int-nested-control-flow-boundary.sh
          /tmp/morphhdl-mill morph[2.12.18].testOnly \
            morphhdl.NativeIntNestedSymbolicControlFlowTests
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.NativeIntNestedSymbolicControlFlowTests

      - name: Commit repaired production tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala \
                  .github/workflows/morphhdl-native-int-nested-control-flow.yml
          git add -u .github/workflows .github/scripts
          git commit -m 'fix: partition shared native processes by exact branch evidence'
          git push origin HEAD:agent/increment-52-post-merge-overlap-fix

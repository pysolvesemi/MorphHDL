name: Increment 52 residual-ownership repair carrier

on:
  pull_request:
    branches:
      - parameterized-verilog

permissions:
  contents: write

concurrency:
  group: increment-52-shared-process-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/increment-52-post-merge-overlap-fix' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out Increment 52 closure branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-52-post-merge-overlap-fix
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize reviewed candidate and add residual ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_increment52_shared_process_fix.py')
          text = path.read_text(encoding='utf-8')
          old = 'mkString("\\n")'
          new = 'mkString("\\\\n")'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected two Scala newline escape sites, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 .github/scripts/apply_increment52_shared_process_fix.py

          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          previous = subprocess.check_output(
              [
                  'git',
                  'show',
                  'a5f39bc0cb253df65f19e17bd78ed6a403133d20:'
                  '.github/workflows/morphhdl-native-int-nested-control-flow.yml',
              ],
              text=True,
          )
          lines = previous.splitlines()
          starts = [
              index + 1
              for index, line in enumerate(lines)
              if line == "          python3 - <<'PY'"
          ]
          if len(starts) < 2:
              raise SystemExit(
                  f'expected two Python carriers in reviewed predecessor, found {len(starts)}'
              )
          start = starts[1]
          end = next(
              index
              for index in range(start, len(lines))
              if lines[index] == '          PY'
          )
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines[start:end]
          )
          exec(compile(script, '/tmp/increment-52-reviewed-child-output-patch.py', 'exec'))

          source = Path(
              'morphhdl/src/main/scala/spinal/core/internals/'
              'ParameterizedVerilogStructural.scala'
          )
          text = source.read_text(encoding='utf-8')
          old = '''                val owners =
                  if (childOutputOwners.nonEmpty) childOutputOwners
                  else if (exactOwners.nonEmpty) exactOwners
                  else {
                    val assignmentNames = identifierTokens(stripped)
                    claimants.filter { plan =>
                      uniqueEvidence(plan.block).exists(name => assignmentNames(name))
                    }
                  }
                owners match {
'''
          new = '''                val evidenceOwners: Vector[BlockPlan] =
                  if (childOutputOwners.nonEmpty) childOutputOwners
                  else if (exactOwners.nonEmpty) exactOwners
                  else {
                    val assignmentNames = identifierTokens(stripped)
                    claimants.filter { plan =>
                      uniqueEvidence(plan.block).exists(name => assignmentNames(name))
                    }
                  }
                val isSelectedTarget =
                  Option(statement.group(2)).exists(_.trim.nonEmpty)
                val residualOwners: Vector[BlockPlan] =
                  if (!isSelectedTarget || evidenceOwners.nonEmpty) Vector.empty
                  else
                    claimants.filter { plan =>
                      val expected = plan.block.assignments.count { assignment =>
                        Option(assignment.finalTarget.getName()).contains(targetName)
                      }
                      val alreadyOwned = ownedIndices(plan.block).count { ownedIndex =>
                        DirectProceduralAssignment
                          .findFirstMatchIn(
                            stripLineComment(lines(ownedIndex)).trim
                          )
                          .exists(matched => matched.group(1) == targetName)
                      }
                      expected > alreadyOwned
                    }
                val owners: Vector[BlockPlan] =
                  if (evidenceOwners.nonEmpty) evidenceOwners
                  else if (residualOwners.size == 1) residualOwners
                  else Vector.empty
                owners match {
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(
                  f'residual ownership insertion expected one site, found {count}'
              )
          source.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git show c37cfba9e8ed0d5ffa64cb0d631a35b986a30632:.github/workflows/morphhdl-native-int-nested-control-flow.yml \
            > .github/workflows/morphhdl-native-int-nested-control-flow.yml
          rm -f .github/workflows/increment-52-overlap-diagnostic.yml
          rm -f .github/workflows/increment-52-native-verilog-diagnostic.yml
          rm -f .github/workflows/increment-52-current-ownership-diagnostic.yml
          rm -f .github/increment-52-current-ownership.txt
          rm -f .github/scripts/apply_increment52_shared_process_fix.py
          git diff --check

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Validate source boundary and focused Increment 52 contract
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl/scripts/check-native-int-nested-control-flow-boundary.sh
          set +e
          /tmp/morphhdl-mill morph[2.12.18].testOnly \
            morphhdl.NativeIntNestedSymbolicControlFlowTests \
            > /tmp/increment52-focused.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo '===== Increment 52 focused diagnostic ====='
            grep -E 'FAILED|SPINAL-PARAMETERIZED|MorphVerilogException|ParameterizedVerilogException|error\]|Exception|Tests: succeeded|TESTS FAILED' \
              /tmp/increment52-focused.log | tail -n 180 || true
            echo '===== Increment 52 focused tail ====='
            tail -n 140 /tmp/increment52-focused.log
            exit "$status"
          fi
          tail -n 50 /tmp/increment52-focused.log
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.NativeIntNestedSymbolicControlFlowTests

      - name: Commit repaired production tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala \
                  .github/workflows/morphhdl-native-int-nested-control-flow.yml
          git add -u .github/workflows .github/scripts .github
          git commit -m 'fix: partition shared native processes by residual captured assignment ownership'
          git push origin HEAD:agent/increment-52-post-merge-overlap-fix

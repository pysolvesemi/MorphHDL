name: Temporary Increment 46 source export

on:
  pull_request:
    branches:
      - parameterized-verilog
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/increment-46-formal-parameter-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-46-formal-parameter-identity
          fetch-depth: 0

      - name: Package exact branch source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/MorphHDL-increment-46-source.tar.gz HEAD
          sha256sum /tmp/MorphHDL-increment-46-source.tar.gz > /tmp/MorphHDL-increment-46-source.tar.gz.sha256
          git rev-parse HEAD > /tmp/MorphHDL-increment-46-source.commit

      - uses: actions/upload-artifact@v4
        with:
          name: MorphHDL-increment-46-source
          path: |
            /tmp/MorphHDL-increment-46-source.tar.gz
            /tmp/MorphHDL-increment-46-source.tar.gz.sha256
            /tmp/MorphHDL-increment-46-source.commit
          if-no-files-found: error

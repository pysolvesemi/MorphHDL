name: Increment 53 final workflow bootstrap

on:
  push:
    branches:
      - agent/increment-53-native-streamfifo-clean

permissions:
  contents: write

concurrency:
  group: increment-53-final-workflow-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-workflow:
    if: "${{ !contains(github.event.head_commit.message, '[inc53-workflow-bootstrap]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53-native-streamfifo-clean
          fetch-depth: 0

      - name: Replace whitespace-sensitive hierarchy repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/increment-53-memory-policy-repair.yml")
          text = path.read_text()
          start_marker = "          output_anchor = '''"
          end_marker = "          hierarchy_path.write_text(hierarchy)"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Increment 53 hierarchy-repair script anchors changed")

          lines = [
              "          output_message = (",
              "              \"uses a sliced, indexed, converted or expression-wrapped \"",
              "              \"child-output connection; direct full packed connections are required\"",
              "          )",
              "          if \"directConcreteOutputAdapter(assignment.source, port)\" not in hierarchy:",
              "              lines = hierarchy.splitlines(keepends=True)",
              "              message_indexes = [",
              "                  index for index, line in enumerate(lines)",
              "                  if output_message in line",
              "              ]",
              "              if len(message_indexes) != 1:",
              "                  raise SystemExit(",
              "                      f\"expected one child-output diagnostic, found {len(message_indexes)}\"",
              "                  )",
              "              message_index = message_indexes[0]",
              "              else_candidates = [",
              "                  index for index in range(message_index)",
              "                  if lines[index].strip() == \"} else {\"",
              "              ]",
              "              if not else_candidates:",
              "                  raise SystemExit(\"child-output fallback branch not found\")",
              "              else_index = else_candidates[-1]",
              "              indent = lines[else_index][",
              "                  : len(lines[else_index]) - len(lines[else_index].lstrip())",
              "              ]",
              "              replacement = [",
              "                  indent + \"} else if (\\n\"",
              "                  indent + \"  allowConcreteInternal &&\\n\"",
              "                  indent + \"  assignment.target == assignment.finalTarget &&\\n\"",
              "                  indent + \"  assignment.finalTarget.component == parent &&\\n\"",
              "                  indent + \"  directConcreteOutputAdapter(assignment.source, port)\\n\"",
              "                  indent + \") {\\n\"",
              "                  indent + \"  Vector(LiteralBinding(port.getBitsWidth))\\n\"",
              "                  indent + \"} else {\\n\"",
              "              ]",
              "              lines[else_index:else_index + 1] = replacement",
              "              hierarchy = \"\".join(lines)",
              "",
          ]
          replacement = "\n".join(lines)
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
          git diff --check

      - name: Publish corrected final repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name pysolvesemi
          git config user.email pysolvesemi@gmail.com
          git rm .github/workflows/increment-53-final-workflow-bootstrap.yml
          git add .github/workflows/increment-53-memory-policy-repair.yml
          git diff --cached --check
          git commit -m "ci(morphhdl): make Increment 53 hierarchy repair structural [inc53-workflow-bootstrap]"
          git push origin HEAD:"$GITHUB_REF_NAME"

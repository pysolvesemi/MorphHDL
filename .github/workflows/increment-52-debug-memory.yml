name: Increment 52 memory relocation diagnostic

on:
  push:
    branches:
      - agent/increment-52-nested-control-flow-clean
    paths:
      - .github/workflows/increment-52-debug-memory.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-52-memory-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-52-nested-control-flow-clean
          fetch-depth: 0

      - name: Instrument memory declaration lookup locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala')
          text = path.read_text()
          old = '''    if (candidates.size != 1) {
      fail(
        "SPINAL-PARAMETERIZED-VERILOG-STRUCTURAL-MEMORY-DECLARATION-NOT-FOUND",
        s"native Verilog contains ${candidates.size} declaration lines for captured memory '$name'",
        sourceLocation
      )
    }
'''
          new = '''    if (candidates.size != 1) {
      java.nio.file.Files.write(
        java.nio.file.Paths.get("docs/morphhdl/increment-52-memory-diagnostic.txt"),
        lines.mkString("\\n").getBytes(java.nio.charset.StandardCharsets.UTF_8)
      )
      fail(
        "SPINAL-PARAMETERIZED-VERILOG-STRUCTURAL-MEMORY-DECLARATION-NOT-FOUND",
        s"native Verilog contains ${candidates.size} declaration lines for captured memory '$name'",
        sourceLocation
      )
    }
'''
          if old not in text:
              raise SystemExit('target memory lookup block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Reproduce the focused failure
        shell: bash
        run: |
          set +e
          /tmp/morphhdl-mill morph[2.12.18].testOnly \
            morphhdl.NativeIntNestedSymbolicControlFlowTests \
            2>&1 | tee /tmp/increment-52-memory-diagnostic.log
          status=${PIPESTATUS[0]}
          set -e
          if [ ! -s docs/morphhdl/increment-52-memory-diagnostic.txt ]; then
            {
              echo "The instrumented lookup did not publish module text. Test status: $status"
              tail -n 500 /tmp/increment-52-memory-diagnostic.log
            } > docs/morphhdl/increment-52-memory-diagnostic.txt
          fi

      - name: Publish the diagnostic trace on the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/morphhdl/increment-52-memory-diagnostic.txt
          if git diff --cached --quiet; then
            echo "Diagnostic trace already matches the branch copy."
          else
            git commit -m "debug: publish Increment 52 memory declaration trace"
            git push origin HEAD:agent/increment-52-nested-control-flow-clean
          fi

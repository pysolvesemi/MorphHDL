name: Increment 52 memory relocation diagnostic

on:
  push:
    branches:
      - agent/increment-52-nested-control-flow-clean
    paths:
      - .github/workflows/increment-52-debug-memory.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: increment-52-memory-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instrument memory declaration lookup locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala')
          text = path.read_text()
          old = '''    if (candidates.size != 1) {
      fail(
        "SPINAL-PARAMETERIZED-VERILOG-STRUCTURAL-MEMORY-DECLARATION-NOT-FOUND",
        s"native Verilog contains ${candidates.size} declaration lines for captured memory '$name'",
        sourceLocation
      )
    }
'''
          new = '''    if (candidates.size != 1) {
      Console.err.println("MORPH_DEBUG_MEMORY_VERILOG_BEGIN")
      lines.zipWithIndex.foreach { case (line, index) =>
        Console.err.println(s"${index + 1}:$line")
      }
      Console.err.println("MORPH_DEBUG_MEMORY_VERILOG_END")
      fail(
        "SPINAL-PARAMETERIZED-VERILOG-STRUCTURAL-MEMORY-DECLARATION-NOT-FOUND",
        s"native Verilog contains ${candidates.size} declaration lines for captured memory '$name'",
        sourceLocation
      )
    }
'''
          if old not in text:
              raise SystemExit('target memory lookup block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Reproduce and publish the focused failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          /tmp/morphhdl-mill morph[2.12.18].testOnly \
            morphhdl.NativeIntNestedSymbolicControlFlowTests \
            > /tmp/increment-52-memory-diagnostic.log 2>&1
          status=$?
          set -e
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          log = Path('/tmp/increment-52-memory-diagnostic.log').read_text(errors='replace')
          matches = re.findall(
              r'MORPH_DEBUG_MEMORY_VERILOG_BEGIN\n(.*?)\nMORPH_DEBUG_MEMORY_VERILOG_END',
              log,
              flags=re.S,
          )
          excerpt = matches[0] if matches else 'No diagnostic marker was found.\n\n' + log[-12000:]
          body = (
              'Increment 52 memory relocation diagnostic from the exact PR head:\n\n'
              '```verilog\n' + excerpt[:50000] + '\n```'
          )
          api = os.environ['GITHUB_API_URL']
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          request = urllib.request.Request(
              f'{api}/repos/{repo}/issues/95/comments',
              data=json.dumps({'body': body}).encode(),
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(request) as response:
              print(response.status)
          PY
          cat /tmp/increment-52-memory-diagnostic.log
          exit "$status"

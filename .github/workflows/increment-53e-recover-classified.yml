name: Increment 53e recover classified closure failure

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write

concurrency:
  group: increment-53e-recover-classified
  cancel-in-progress: true

jobs:
  skipped:
    if: contains(github.event.head_commit.message, '[53e-classified:SKIPPED]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0
      - name: Retrigger the final pipeline from an explicit ready commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p .morphhdl
          printf 'ready after skipped-run recovery\n' > .morphhdl/increment-53e-final-ready
          rm -f .morphhdl/increment-53e-classification
          rm -rf morphhdl/diagnostics
          git add -A
          git commit -m '[53e-final-ready] Retry Increment 53e after skipped run'
          git push origin HEAD:agent/increment-53e-native-streamfifocc-parameterization

  proof-compile:
    if: contains(github.event.head_commit.message, '[53e-classified:PROOF_COMPILE]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0
      - name: Permanently align proof calls to exact native signatures
        shell: bash
        run: |
          set -euo pipefail
          test ! -f morphhdl/scripts/apply-increment-53e-proof-api-alignment.py || \
            python3 morphhdl/scripts/apply-increment-53e-proof-api-alignment.py
          test ! -f morphhdl/scripts/apply-increment-53e-proof-api-alignment-v2.py || \
            python3 morphhdl/scripts/apply-increment-53e-proof-api-alignment-v2.py
          grep -q 'new spinal.lib.StreamFifoCC' \
            morphhdl/src/test/scala/morphhdl/NativeStreamFifoCCProofTests.scala
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p .morphhdl
          printf 'ready after proof API alignment\n' > .morphhdl/increment-53e-final-ready
          rm -f .morphhdl/increment-53e-classification
          rm -rf morphhdl/diagnostics
          git add -A
          git commit -m '[53e-final-ready] Align Increment 53e proof constructors'
          git push origin HEAD:agent/increment-53e-native-streamfifocc-parameterization

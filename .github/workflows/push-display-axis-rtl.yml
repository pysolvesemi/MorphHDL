name: Push Display Controller AXI ingress RTL

on:
  pull_request:
    branches: [parameterized-verilog]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  handoff:
    if: github.event.pull_request.head.ref == 'agent/push-display-axis-rtl'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Reconstruct exact generated RTL
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/rtl.gz.b64 <<'PAYLOAD'
          
          PAYLOAD
          sed -i 's/^          //' /tmp/rtl.gz.b64
          base64 --decode /tmp/rtl.gz.b64 | gzip -dc > /tmp/DisplayControllerSanityShell.v
          test "$(sha256sum /tmp/DisplayControllerSanityShell.v | awk '{print $1}')" = 3191243552a678b4ea951c4816201b01d16a82c525860b57b002345f8eb12fd0

      - name: Test cross-repository push with workflow token
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/pysolvesemi/display-controller-verilog.git" /tmp/display-controller-verilog
          cd /tmp/display-controller-verilog
          git fetch origin agent/p1-axis-ingress-rtl-00 dev
          git switch -C agent/p1-axis-ingress-rtl-00 origin/agent/p1-axis-ingress-rtl-00
          cp /tmp/DisplayControllerSanityShell.v rtl/display_controller/DisplayControllerSanityShell.v
          rm -f .github/workflows/p1-axis-ingress-rtl-finalize.yml
          git config user.name pysolvesemi
          git config user.email pysolvesemi@gmail.com
          git add -A
          test "$(git hash-object rtl/display_controller/DisplayControllerSanityShell.v)" = 367848d5dc209cd0aad7d5e250ddc087ed16b8bb
          git diff --cached --check
          git commit -m 'feat(phase1): update sanity shell for AXI ingress smoke'
          git push origin HEAD:agent/p1-axis-ingress-rtl-00

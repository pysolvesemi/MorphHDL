name: Increment 40 focused diagnostic

on:
  push:
    branches:
      - agent/increment-40-external-symbolic-width
    paths:
      - .github/workflows/increment-40-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose ${{ matrix.label }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/spinalhdl/docker:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: core-data-shapes
            module: core
            suite: spinal.core.internals.ParameterizedDataShapeTests
          - label: core-verilog
            module: core
            suite: spinal.core.internals.ParameterizedVerilogTests
          - label: frontend-hdl-int
            module: frontend
            suite: morphhdl.frontend.HdlIntTests
          - label: morph-single-source
            module: morph
            suite: morphhdl.MorphSingleSourceVerilogTests
          - label: native-library-reuse
            module: morph
            suite: morphhdl.NativeLibraryReuseTests
          - label: native-symbolic-memory
            module: morph
            suite: morphhdl.NativeSymbolicMemoryTests
    steps:
      - name: Check out Increment 40 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Mill
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0-mill.sh \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Run focused suite and print concise failure
        shell: bash
        env:
          XDG_CACHE_HOME: /tmp/morphhdl-cache
        run: |
          set +e
          /tmp/morphhdl-mill "${{ matrix.module }}[2.13.12].testOnly" "${{ matrix.suite }}" \
            > /tmp/increment-40-suite.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::group::Concise failure context"
            python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/increment-40-suite.log').read_text(errors='replace').splitlines()
          needles = (
              'FAILED', 'ABORTED', 'AssertionError', 'StackOverflowError',
              'Exception', '[error]', 'error:', 'expected', 'did not equal',
          )
          hits = [i for i, line in enumerate(lines) if any(n in line for n in needles)]
          selected = set()
          for hit in hits[-20:]:
              selected.update(range(max(0, hit - 4), min(len(lines), hit + 8)))
          if not selected:
              selected.update(range(max(0, len(lines) - 160), len(lines)))
          for i in sorted(selected):
              print(f'{i + 1}: {lines[i]}')
          PY
            echo "::endgroup::"
            echo "::group::Last 120 lines"
            tail -n 120 /tmp/increment-40-suite.log
            echo "::endgroup::"
          else
            grep -E 'Run completed|Total number of tests|Tests:|All tests passed' \
              /tmp/increment-40-suite.log || true
          fi

          exit "$status"

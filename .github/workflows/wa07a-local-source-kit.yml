name: WA-07a exact root compiler kit
on:
  push:
    branches: [agent/wa-07a-local-source-kit]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d5e91a5e0bfe7fa856a3d3efee11b186963a49a4
      - name: Compile the exact root and native witness sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compiler-export
          sbt -batch '++2.12.18' \
            'set morph / Test / unmanagedSourceDirectories ++= Seq(file("morphhdl-passes/src/main/scala"), file("morphhdl-passes/examples"))' \
            'morph / Test / compile' \
            'show morph / Test / fullClasspath' \
            'show idslplugin / Compile / packageBin' \
            'show morphplugin / Compile / packageBin' 2>&1 | tee compiler-export/compile.log
          git rev-parse HEAD > compiler-export/source-commit.txt
      - name: Export immutable classpath entries with fingerprints
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,re,shutil,subprocess,tarfile
          from pathlib import Path
          out=Path('compiler-export')
          log=re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', (out/'compile.log').read_text())
          paths=list(dict.fromkeys(re.findall(r'Attributed\((/[^\n)]+)\)',log)))
          assert paths and any('/morphhdl/target/' in p for p in paths), paths
          for p in paths: assert Path(p).exists(), p
          extra=[]
          for folder in ('idslplugin','morphplugin'):
              candidates=list(Path(folder,'target','scala-2.12').glob('*.jar'))
              assert candidates, folder
              extra.extend(str(p.resolve()) for p in candidates)
          manifest={}
          with tarfile.open(out/'exact-root-classpath.tar.gz','w:gz') as archive:
              for i,path in enumerate(paths+extra):
                  path=Path(path)
                  name=f'entry-{i:03d}' + ('.jar' if path.is_file() else '')
                  archive.add(path,arcname=name)
                  manifest[name]={'source':str(path),'classpath':i<len(paths),'files':{}}
                  members=[path] if path.is_file() else sorted(p for p in path.rglob('*') if p.is_file())
                  for p in members:
                      key='.' if p==path else p.relative_to(path).as_posix()
                      manifest[name]['files'][key]=hashlib.sha256(p.read_bytes()).hexdigest()
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wa07a-exact-root-d5e91a5e0
          path: compiler-export
          if-no-files-found: error
          retention-days: 3

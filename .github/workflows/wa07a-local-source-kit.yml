name: WA-07a local formal tool kit
on:
  push:
    branches: [agent/wa-07a-local-source-kit]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - uses: actions/checkout@v4
      - name: Export installed formal drivers and libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tool-export/root
          export root="$PWD/tool-export/root"
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, subprocess
          from pathlib import Path
          root = Path(os.environ['root'])
          copied = {}
          def copy(path):
              path = Path(path)
              if not path.is_file(): return
              target = root / str(path).lstrip('/')
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, target, follow_symlinks=True)
              copied[str(path)] = hashlib.sha256(target.read_bytes()).hexdigest()
          versions = {}
          for name in ('sby', 'yices-smt2', 'yosys-smtbmc', 'yosys-witness'):
              source = shutil.which(name)
              assert source, name
              copy(source)
              copy(Path(source).resolve())
              result = subprocess.run(['ldd', str(Path(source).resolve())], capture_output=True, text=True)
              for path in re.findall(r'(/[^\s()]+)', result.stdout): copy(path)
          for base in ('/opt', '/usr/local', '/usr/share'):
              for directory, dirs, files in os.walk(base):
                  for name in files:
                      if (name.startswith('sby_') and name.endswith('.py')) or name in ('smtio.py', 'ywio.py'):
                          copy(Path(directory) / name)
          for name, arg in (('yosys','-V'),('sby','-h'),('yices-smt2','--version')):
              result = subprocess.run([name,arg], capture_output=True, text=True)
              assert result.returncode == 0, (name,result.stderr)
              versions[name] = result.stdout + result.stderr
          assert any('sby_core.py' in p for p in copied), copied
          Path('tool-export/sha256.json').write_text(json.dumps(copied, indent=2, sort_keys=True)+'\n')
          Path('tool-export/tool-versions.json').write_text(json.dumps(versions, indent=2, sort_keys=True)+'\n')
          PY
          tar -C tool-export/root -czf tool-export/wa07a-formal-tools.tar.gz .
          rm -rf tool-export/root
      - uses: actions/upload-artifact@v4
        with:
          name: wa07a-formal-tool-kit
          path: tool-export
          if-no-files-found: error
          retention-days: 3

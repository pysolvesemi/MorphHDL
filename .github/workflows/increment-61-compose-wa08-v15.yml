name: Increment 61 WA-08 source composition builder v15

on:
  push:
    branches:
      - agent/increment-61-controller
    paths:
      - '.github/workflows/increment-61-compose-wa08-v15.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'pysolvesemi/MorphHDL'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: pysolvesemi/MorphHDL
      FEATURE_BRANCH: agent/increment-61-one-file-per-component
      EXPECTED_FEATURE: 67c08b3fd6d6302c5fae32a003d9c994903e9a13
      EXPECTED_TARGET: 010644bbf1704c38013749ed40638e297ed87b2b
    steps:
      - name: Check out exact integrated Increment 61 source
        uses: actions/checkout@v4
        with:
          ref: 67c08b3fd6d6302c5fae32a003d9c994903e9a13
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Compose, prove and publish an unattached commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_FEATURE"
          test "$(git rev-parse origin/parameterized-verilog)" = "$EXPECTED_TARGET"
          test "$(git ls-remote https://github.com/$REPOSITORY.git refs/heads/$FEATURE_BRANCH | cut -f1)" = "$EXPECTED_FEATURE"
          test "$(git ls-remote https://github.com/$REPOSITORY.git refs/heads/parameterized-verilog | cut -f1)" = "$EXPECTED_TARGET"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          target = '010644bbf1704c38013749ed40638e297ed87b2b'
          workflow_path = Path('.github/workflows/increment-62-wa08-source-overlay.yml')
          lines = workflow_path.read_text().splitlines()
          marker = '      - name: Exact source overlay and live mutation controls'
          starts = [index for index, line in enumerate(lines) if line == marker]
          if len(starts) != 1:
              raise SystemExit(f'expected one WA-08 source-overlay job, found {len(starts)}')
          start = starts[0]
          try:
              end = lines.index('  production:', start + 1)
          except ValueError as error:
              raise SystemExit('WA-08 production job boundary is missing') from error
          old_block = lines[start:end]
          expected_commands = [
              'python3 morphhdl/scripts/check-increment-62-wa08-source-overlay.py',
              'python3 morphhdl/scripts/test-increment-62-wa08-source-overlay.py',
              'python3 morphhdl/scripts/test-wa07b-inherited-review.py',
              'python3 morphhdl/scripts/check-increment-60g-source-scope.py',
              'python3 morphhdl/scripts/check-increment-60f-equivalence-closure.py --source-only',
              'python3 morphhdl/scripts/check-increment-59c-source-review.py',
              'python3 morphhdl/scripts/check-increment-59g-source-review.py',
          ]
          for command in expected_commands:
              if sum(command in line for line in old_block) != 1:
                  raise SystemExit(f'WA-08 source-overlay command inventory changed: {command}')
          if any('check-increment-61-source-review.py' in line for line in old_block):
              raise SystemExit('WA-08 source-overlay job is already composed')

          replacement = [
              marker,
              '        shell: bash',
              '        run: |',
              '          set -euo pipefail',
              '          python3 morphhdl/scripts/check-increment-61-source-review.py',
              '          python3 morphhdl/scripts/check-increment-61-source-review.py --self-test',
              '          integrated=$(python3 -c \'import json; print(json.load(open("morphhdl/contracts/increment-61-source-review.json"))["integrated_target_commit"])\')',
              f'          test "$integrated" = "{target}"',
              '          historical="$RUNNER_TEMP/wa08-inherited-source"',
              '          rm -rf "$historical"',
              '          git worktree add --detach "$historical" "$integrated"',
              '          trap \'git worktree remove --force "$historical"\' EXIT',
              '          (',
              '            cd "$historical"',
              '            python3 morphhdl/scripts/check-increment-62-wa08-source-overlay.py',
              '            python3 morphhdl/scripts/test-increment-62-wa08-source-overlay.py',
              '            python3 morphhdl/scripts/test-wa07b-inherited-review.py',
              '            python3 morphhdl/scripts/check-increment-60g-source-scope.py',
              '            python3 morphhdl/scripts/check-increment-60f-equivalence-closure.py --source-only',
              '            python3 morphhdl/scripts/check-increment-59c-source-review.py',
              '            python3 morphhdl/scripts/check-increment-59g-source-review.py',
              '          )',
          ]
          lines[start:end] = replacement
          workflow_path.write_text('\n'.join(lines) + '\n')

          contract_path = Path('morphhdl/contracts/increment-61-source-review.json')
          contract = json.loads(contract_path.read_text())
          contract['integrated_target_commit'] = target
          inherited_workflow = workflow_path.as_posix()
          audit = set(contract['audit_paths'])
          audit.add(inherited_workflow)
          contract['audit_paths'] = sorted(audit)
          for entry in contract['reviewed_files']:
              raw = Path(entry['path']).read_bytes()
              entry['after_sha256_integrated'] = hashlib.sha256(raw).hexdigest()
          contract_path.write_text(json.dumps(contract, indent=2) + '\n')

          checker_path = Path('morphhdl/scripts/check-increment-61-source-review.py')
          checker = checker_path.read_text()
          digest = hashlib.sha256(contract_path.read_bytes()).hexdigest()
          checker, count = re.subn(
              r'^CONTRACT_SHA256 = "[0-9a-f]{64}"$',
              f'CONTRACT_SHA256 = "{digest}"',
              checker,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit('Increment 61 contract digest anchor changed')
          checker_path.write_text(checker)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/increment-62-wa08-source-overlay.yml \
            morphhdl/contracts/increment-61-source-review.json \
            morphhdl/scripts/check-increment-61-source-review.py
          git diff --cached --check
          git commit -m '61: compose WA-08 source proof through pinned target'

          python3 morphhdl/scripts/check-increment-61-source-review.py
          python3 morphhdl/scripts/check-increment-61-source-review.py --self-test

          historical="$RUNNER_TEMP/wa08-v15-proof"
          rm -rf "$historical"
          git worktree add --detach "$historical" "$EXPECTED_TARGET"
          trap 'git worktree remove --force "$historical"' EXIT
          (
            cd "$historical"
            python3 morphhdl/scripts/check-increment-62-wa08-source-overlay.py
            python3 morphhdl/scripts/test-increment-62-wa08-source-overlay.py
            python3 morphhdl/scripts/test-wa07b-inherited-review.py
            python3 morphhdl/scripts/check-increment-60g-source-scope.py
            python3 morphhdl/scripts/check-increment-60f-equivalence-closure.py --source-only
            python3 morphhdl/scripts/check-increment-59c-source-review.py
            python3 morphhdl/scripts/check-increment-59g-source-review.py
          )
          git worktree remove --force "$historical"
          trap - EXIT

          git diff --check "$EXPECTED_FEATURE" HEAD
          mapfile -d '' changed < <(git diff --name-only -z "$EXPECTED_FEATURE" HEAD)
          expected=(
            '.github/workflows/increment-62-wa08-source-overlay.yml'
            'morphhdl/contracts/increment-61-source-review.json'
            'morphhdl/scripts/check-increment-61-source-review.py'
          )
          mapfile -t actual < <(printf '%s\n' "${changed[@]}" | LC_ALL=C sort)
          if [ "${actual[*]}" != "${expected[*]}" ]; then
            printf 'Unexpected composition delta:\n%s\n' "${actual[*]}" >&2
            exit 1
          fi

          base_tree=$(git rev-parse "$EXPECTED_FEATURE^{tree}")
          entries=$(mktemp)
          printf '[]' > "$entries"
          for path in "${changed[@]}"; do
            mode=$(git ls-files -s -- "$path" | awk '{print $1}')
            test -n "$mode"
            blob=$(base64 -w0 "$path" | jq -Rs '{content:.,encoding:"base64"}' | \
              gh api --method POST "repos/$REPOSITORY/git/blobs" --input - --jq .sha)
            jq --arg path "$path" --arg mode "$mode" --arg sha "$blob" \
              '. + [{path:$path,mode:$mode,type:"blob",sha:$sha}]' \
              "$entries" > "$entries.next"
            mv "$entries.next" "$entries"
          done
          tree=$(jq -nc --arg base_tree "$base_tree" --slurpfile tree "$entries" \
            '{base_tree:$base_tree,tree:$tree[0]}' | \
            gh api --method POST "repos/$REPOSITORY/git/trees" --input - --jq .sha)
          commit=$(jq -nc \
            --arg message '61: compose WA-08 source proof through pinned target' \
            --arg tree "$tree" --arg parent "$EXPECTED_FEATURE" \
            '{message:$message,tree:$tree,parents:[$parent]}' | \
            gh api --method POST "repos/$REPOSITORY/git/commits" --input - --jq .sha)
          remote_tree=$(gh api "repos/$REPOSITORY/git/commits/$commit" --jq .tree.sha)
          test "$remote_tree" = "$tree"
          printf 'COMPOSITION_COMMIT_SHA=%s\nCOMPOSITION_TREE_SHA=%s\n' "$commit" "$tree" | tee composition-result.txt

      - name: Upload composition identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-61-wa08-composition-v15
          path: composition-result.txt
          if-no-files-found: warn

name: Increment 59a branch-scoped authority repair
on:
  push:
    branches: [agent/increment-59a-recursive-verilog-module]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Repair 59a branch-scoped authority checks and exercise generated RTL'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-59a-recursive-verilog-module
          fetch-depth: 0
      - name: Apply exact final-owner scope repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('morphhdl/src/main/scala/spinal/core/internals/BoundedRecursiveModuleValidation.scala')
          s=p.read_text()
          start=s.index('      val domain = ElabInt.requireAuthoritativeIntegerDomain(')
          end=s.index('      // A provisional',start)
          s=s[:start]+s[end:]
          needle='      (binding, domain, classify(binding, domain, evaluation))'
          replacement='\n'.join([
              '      val retainedDomain = binding.expression.exactDomain.get',
              '      val domain = ElaborationDomainContext.withAdmitted(',
              '        retainedDomain.root,',
              '        evaluation.rootValues,',
              '        binding.sourceLocation',
              '      ) {',
              '        ElabInt.requireAuthoritativeIntegerDomain(',
              '          binding.expression,',
              '          role,',
              '          "SPINAL-PARAMETERIZED-VERILOG-RECURSION-EXACT-DOMAIN-REQUIRED",',
              '          requireExactExtrema = false',
              '        ).getOrElse {',
              '          fail(',
              '            "SPINAL-PARAMETERIZED-VERILOG-RECURSION-METRIC-MISSING",',
              '            s"$role lost its exact declaration root",',
              '            binding.sourceLocation',
              '          )',
              '        }',
              '      }',
              needle])
          assert s.count(needle)==1
          s=s.replace(needle,replacement)
          needle='    if (ownerName.isEmpty) return Vector.empty'
          replacement='\n'.join([
              needle,
              '    ParameterizedStructure.regionsOf(owner)',
              '      .flatMap(ParameterizedStructure.allBlocks)',
              '      .flatMap(_.children)',
              '      .collect { case reference: BlackBox => reference }',
              '      .foreach { reference =>',
              '        if (',
              '          !owner.children.exists(_ eq reference) ||',
              '          (reference.parent ne owner) || !reference.isBlackBox ||',
              '          reference.definitionName != ownerName',
              '        )',
              '          fail(',
              '            "SPINAL-PARAMETERIZED-VERILOG-RECURSION-REFERENCE-IDENTITY-MISMATCH",',
              '            "captured recursive reference no longer identifies its exact direct owning module",',
              '            None',
              '          )',
              '      }'])
          assert s.count(needle)==1
          p.write_text(s.replace(needle,replacement))
          p=Path('morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogHierarchy.scala')
          s=p.read_text()
          start=s.index('        ElabInt.requireAuthoritativeIntegerDomain(')
          end=s.index('        value.name -> ExpressionBinding(value.expression)',start)
          replacement='\n'.join([
              '        val role = s"BlackBox integer generic \'${value.name}\' of instance \'$instanceName\'"',
              '        val ownerEvaluation = ParameterizedStructure.projectedChildEvaluationOf(',
              '          parent, blackBox, value.expression, role, value.sourceLocation',
              '        )',
              '        def validateIntegerDomain(): Unit = {',
              '          ElabInt.requireAuthoritativeIntegerDomain(',
              '            value.expression,',
              '            role,',
              '            "SPINAL-PARAMETERIZED-VERILOG-BLACKBOX-INTEGER-GENERIC-DOMAIN-INVALID",',
              '            requireExactExtrema = false',
              '          )',
              '          ()',
              '        }',
              '        ownerEvaluation match {',
              '          case Some(evaluation) =>',
              '            ElaborationDomainContext.withAdmitted(',
              '              value.expression.exactDomain.get.root,',
              '              evaluation.rootValues,',
              '              value.sourceLocation',
              '            )(validateIntegerDomain())',
              '          case None => validateIntegerDomain()',
              '        }', ''])
          p.write_text(s[:start]+replacement+s[end:])
          name='morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogHierarchy.scala'
          p=Path('morphhdl/contracts/increment-59a-source-scope.txt')
          p.write_text('\n'.join(sorted(set(p.read_text().splitlines()+[name])))+'\n')
          p=Path('morphhdl/scripts/check-increment-59a-recursive-module.py')
          s=p.read_text()
          needle='    "morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalParameterizedVerilog.scala",'
          p.write_text(s.replace(needle,'    "'+name+'",\n'+needle,1))
          Path('.github/workflows/increment-59a-workspace.yml').unlink()
          Path('.github/workflows/increment-59a-context-repair.yml').unlink()
          PY
          git diff --check
          python3 morphhdl/scripts/check-increment-59a-recursive-module.py --self-test --repo-root .
          git config user.name 'MorphHDL Increment Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add morphhdl .github/workflows/increment-59a-workspace.yml .github/workflows/increment-59a-context-repair.yml
          git commit -m 'Authenticate recursive bindings in their exact final branch domain'
          git push origin HEAD:agent/increment-59a-recursive-verilog-module
      - name: Generate recursive candidate and independent witnesses
        shell: bash
        run: |
          set -euo pipefail
          sbt -batch '++2.13.12' "morph/Test/runMain morphhdl.BoundedRecursivePowerArtifactWriter --output-dir ${GITHUB_WORKSPACE}/recursive-artifacts"
          cat recursive-artifacts/bounded_recursive_power.v
      - name: Exercise recursive and inherited BlackBox unit tests
        shell: bash
        run: |
          sbt -batch '++2.13.12' 'morph/testOnly morphhdl.BoundedRecursivePowerTests morphhdl.TypedBlackBoxGenericBindingTests morphhdl.StructuralGenerateControlTests'
      - name: Retain exact diagnostics and generated source
        if: always()
        shell: bash
        run: |
          mkdir -p recursive-artifacts
          git rev-parse HEAD > recursive-artifacts/head-sha.txt
          find morphhdl/target -path '*/test-reports/*' -name '*.xml' -exec cp '{}' recursive-artifacts/ \; || true
          git archive --format=tar.gz --output=recursive-artifacts/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-59a-context-repair-artifacts
          path: recursive-artifacts
          if-no-files-found: error

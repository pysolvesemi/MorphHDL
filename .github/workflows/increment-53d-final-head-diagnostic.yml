name: Diagnose patched Increment 53d witness failures

on:
  push:
    branches:
      - agent/increment-53d-generic-native-definition-boundary
    paths:
      - .github/workflows/increment-53d-final-head-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-53d-patched-witness-diagnostic
  cancel-in-progress: true

jobs:
  witness:
    name: ${{ matrix.test_class }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      SBT_TEST_PARALLEL: "1"
    strategy:
      fail-fast: false
      matrix:
        test_class:
          - morphhdl.ConcurrentMorphVerilogIsolationTests
          - morphhdl.ParameterizedStreamWidthAdapterTests
          - morphhdl.ParameterizedStreamFifoDepthTests
          - morphhdl.NativeStreamFifoFormalEquivalenceTests
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-generic-native-definition-boundary
          fetch-depth: 0
          submodules: recursive

      - name: Apply transaction-isolation fix
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/apply-increment-53d-concurrent-generation-isolation.py
          git diff --check
          git diff --quiet HEAD -- core lib idslplugin

      - name: Run isolated witness and print exact diagnostic
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/witness.log"
          sbt -batch ++2.13.12 \
            "morph/testOnly ${{ matrix.test_class }}" >"$log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E -n -C 14 '(\[error\]|FAILED|Exception|AssertionError|WIDTH MISMATCH|ASSIGNMENT-WIDTH-MISMATCH|Tests: succeeded|unexpected concurrent)' "$log" | tail -n 2400 || true
          fi
          printf '%s\n' '--- final output ---'
          tail -n 500 "$log"
          exit "$status"

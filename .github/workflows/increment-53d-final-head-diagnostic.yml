name: Validate Increment 53d concurrent generation isolation

on:
  push:
    branches:
      - agent/increment-53d-generic-native-definition-boundary
    paths:
      - .github/workflows/increment-53d-final-head-diagnostic.yml
      - morphhdl/scripts/apply-increment-53d-concurrent-generation-isolation.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-53d-concurrent-generation-isolation
  cancel-in-progress: true

jobs:
  validate:
    name: Concurrent native witnesses Scala ${{ matrix.scala_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      SBT_TEST_PARALLEL: "1"
    strategy:
      fail-fast: false
      matrix:
        scala_version:
          - "2.12.18"
          - "2.13.12"
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-generic-native-definition-boundary
          fetch-depth: 0
          submodules: recursive

      - name: Apply transaction-isolation fix
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/apply-increment-53d-concurrent-generation-isolation.py
          git diff --check
          git diff --quiet HEAD -- core lib idslplugin

      - name: Compile production and test sources
        shell: bash
        run: |
          set -euo pipefail
          sbt -batch "++${{ matrix.scala_version }}" compile Test/compile

      - name: Run concurrent and previously failing native witnesses
        shell: bash
        run: |
          set -euo pipefail
          sbt -batch "++${{ matrix.scala_version }}" \
            "morph/testOnly morphhdl.ConcurrentMorphVerilogIsolationTests morphhdl.ParameterizedStreamWidthAdapterTests morphhdl.ParameterizedStreamFifoDepthTests morphhdl.NativeStreamFifoFormalEquivalenceTests"

      - name: Validate permanent source boundary
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl/scripts/check-native-stream-width-adapter-boundary.sh
          git diff --quiet HEAD -- core lib idslplugin

  publish:
    name: Publish validated transaction isolation
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-generic-native-definition-boundary
          fetch-depth: 0

      - name: Apply final production fix
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/apply-increment-53d-concurrent-generation-isolation.py
          git diff --check
          bash morphhdl/scripts/check-native-stream-width-adapter-boundary.sh
          git diff --quiet HEAD -- core lib idslplugin

      - name: Commit only permanent implementation and regression files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MorphHDL Agent"
          git config user.email "morphhdl-agent@users.noreply.github.com"
          git add \
            morphhdl/src/main/scala/morphhdl/MorphVerilog.scala \
            morphhdl/src/test/scala/morphhdl/ConcurrentMorphVerilogIsolationTests.scala \
            .github/workflows/morphhdl-native-stream-width-adapter.yml \
            docs/morphhdl/increment-53d-native-streamwidth-adapter.md
          git rm \
            morphhdl/scripts/apply-increment-53d-concurrent-generation-isolation.py \
            .github/workflows/increment-53d-final-head-diagnostic.yml
          git diff --cached --check
          git commit -m "Isolate concurrent Increment 53d generations"
          git push origin HEAD:agent/increment-53d-generic-native-definition-boundary

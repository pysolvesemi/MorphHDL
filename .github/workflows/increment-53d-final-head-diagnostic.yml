name: Diagnose Increment 53d aggregate SBT failures

on:
  push:
    branches:
      - agent/increment-53d-generic-native-definition-boundary
    paths:
      - .github/workflows/increment-53d-final-head-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-53d-final-head-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-target:
    name: ${{ matrix.target_name }} Scala ${{ matrix.scala_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version:
          - "2.12.18"
          - "2.13.12"
        target_name:
          - idslplugin-test
          - paramrtl-test
          - frontend-test
          - verilogBackend-test
          - morph-test
          - core-phase-plan-test
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-generic-native-definition-boundary
          fetch-depth: 0
          submodules: recursive

      - name: Run isolated aggregate target and print exact failure
        id: diagnostic
        shell: bash
        run: |
          set +e
          case "${{ matrix.target_name }}" in
            idslplugin-test) target='idslplugin/test' ;;
            paramrtl-test) target='paramrtl/test' ;;
            frontend-test) target='frontend/test' ;;
            verilogBackend-test) target='verilogBackend/test' ;;
            morph-test) target='morph/test' ;;
            core-phase-plan-test) target='core/testOnly spinal.core.internals.SpinalVerilogPhasePlanTests' ;;
            *) printf '%s\n' 'Unknown diagnostic target' >&2; exit 2 ;;
          esac

          output="${RUNNER_TEMP}/increment-53d-${{ matrix.target_name }}-${{ matrix.scala_version }}"
          mkdir -p "$output"
          log="$output/test.log"
          sbt -batch "++${{ matrix.scala_version }}" "$target" >"$log" 2>&1
          result=$?
          printf '%s\n' "$result" >"$output/status"

          if [ "$result" -ne 0 ]; then
            printf '%s\n' "FAILED: $target on Scala ${{ matrix.scala_version }} (exit $result)"
            grep -E -n -C 10 '(\[error\]|FAILED|Exception|AssertionError|not found:|type mismatch|ambiguous|unbound|No tests were executed)' "$log" | tail -n 1800 || true
          else
            printf '%s\n' "PASSED: $target on Scala ${{ matrix.scala_version }}"
          fi
          printf '%s\n' '--- final output ---'
          tail -n 300 "$log"
          exit "$result"

      - name: Upload exact target diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53d-${{ matrix.target_name }}-scala-${{ matrix.scala_version }}
          path: ${{ runner.temp }}/increment-53d-${{ matrix.target_name }}-${{ matrix.scala_version }}
          if-no-files-found: error
          retention-days: 3

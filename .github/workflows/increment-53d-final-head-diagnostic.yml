name: Diagnose Increment 53d SBT parallel isolation

on:
  push:
    branches:
      - agent/increment-53d-generic-native-definition-boundary
    paths:
      - .github/workflows/increment-53d-final-head-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-53d-final-head-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  morph-parallelism:
    name: morph/test Scala ${{ matrix.scala_version }} parallel=${{ matrix.parallel }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      SBT_TEST_PARALLEL: ${{ matrix.parallel }}
    strategy:
      fail-fast: false
      matrix:
        scala_version:
          - "2.12.18"
          - "2.13.12"
        parallel:
          - "0"
          - "1"
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-generic-native-definition-boundary
          fetch-depth: 0
          submodules: recursive

      - name: Run complete morph suite and retain exact failure
        id: diagnostic
        shell: bash
        run: |
          set +e
          output="${RUNNER_TEMP}/increment-53d-morph-${{ matrix.scala_version }}-parallel-${{ matrix.parallel }}"
          mkdir -p "$output"
          log="$output/test.log"
          sbt -batch "++${{ matrix.scala_version }}" morph/test >"$log" 2>&1
          result=$?
          printf '%s\n' "$result" >"$output/status"

          if [ "$result" -ne 0 ]; then
            printf '%s\n' "FAILED: morph/test Scala ${{ matrix.scala_version }} parallel=${{ matrix.parallel }}"
            grep -E -n -C 12 '(\[error\]|FAILED|Exception|AssertionError|WIDTH MISMATCH|ASSIGNMENT-WIDTH-MISMATCH|Tests: succeeded)' "$log" | tail -n 2200 || true
          else
            printf '%s\n' "PASSED: morph/test Scala ${{ matrix.scala_version }} parallel=${{ matrix.parallel }}"
          fi
          printf '%s\n' '--- final output ---'
          tail -n 350 "$log"
          exit "$result"

      - name: Upload exact parallelism diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53d-morph-scala-${{ matrix.scala_version }}-parallel-${{ matrix.parallel }}
          path: ${{ runner.temp }}/increment-53d-morph-${{ matrix.scala_version }}-parallel-${{ matrix.parallel }}
          if-no-files-found: error
          retention-days: 3

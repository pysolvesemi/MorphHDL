name: PR190 targeted source review
on:
  push:
    branches: [agent/wa-sequential-wire-consumers]
    paths: ['.github/workflows/sequential-source-review-targeted.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supersede-pr190:
    if: github.repository == 'pysolvesemi/MorphHDL' && github.ref == 'refs/heads/agent/wa-sequential-wire-consumers'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        group:
          - 'morphhdl-external-memory-MorphHDL external native memory-refs/pull/190/merge'
          - 'increment-60a-Increment 60a SInt baseline capture-refs/pull/190/merge'
          - 'morphhdl-native-int-expressions-MorphHDL native Int shadow expressions-refs/pull/190/merge'
          - 'increment-59e-composite-refs/pull/190/merge'
          - 'morphhdl-baseline-MorphHDL baseline-refs/pull/190/merge'
          - 'morphhdl-native-int-conditionals-MorphHDL native Int symbolic conditionals-refs/pull/190/merge'
          - 'increment-60c-Increment 60c signed declarations-refs/pull/190/merge'
          - 'morphhdl-ir-passes-MorphHDL IR pass workspace-refs/pull/190/merge-d9c3f574ef7dc036ebdfd8e2078a512c40c5aed9'
          - 'morphhdl-native-int-shadow-MorphHDL native Int shadow provenance-refs/pull/190/merge'
          - 'morphhdl-native-int-nested-MorphHDL native Int nested symbolic control flow-refs/pull/190/merge'
          - 'morphhdl-native-streamfifo-MorphHDL native StreamFifo parameter structure-refs/pull/190/merge'
          - 'increment-59g-register-bridges-refs/pull/190/merge'
          - 'morphhdl-streamfifocc-proof-MorphHDL StreamFifoCC CDC and formal proof-refs/pull/190/merge'
          - 'morphhdl-native-stream-width-adapter-MorphHDL native StreamWidthAdapter parameterization-refs/pull/190/merge'
          - 'morphhdl-mill-MorphHDL Mill-refs/pull/190/merge'
          - 'morphhdl-native-streamfifo-formal-MorphHDL native StreamFifo formal equivalence-refs/pull/190/merge'
          - 'increment-60f-Increment 60f equivalence closure-refs/pull/190/merge'
          - 'morphhdl-external-structural-process-MorphHDL external structural and process capture-refs/pull/190/merge'
    concurrency:
      group: ${{ matrix.group }}
      cancel-in-progress: true
    steps:
      - run: printf 'PR190-only concurrency reservation released.\n'
  cancel-and-export:
    if: github.repository == 'pysolvesemi/MorphHDL' && github.ref == 'refs/heads/agent/wa-sequential-wire-consumers'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cancel only superseded PR190 qualification runs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = 'agent/wa-sequential-wire-consumers';
            const oldHead = 'd9c3f574ef7dc036ebdfd8e2078a512c40c5aed9';
            const allowedHeads = new Set([oldHead, '8120db187de12b62185d55cc2d43324eda9189f8', '85a11a769fc9091cc0e9c3e6a4f9163b8fb3434a', context.sha]);
            const {owner, repo} = context.repo;
            const pr = (await github.rest.pulls.get({owner, repo, pull_number: 190})).data;
            const ref = (await github.rest.git.getRef({owner,repo,ref:`heads/${branch}`})).data;
            if (pr.state !== 'closed' || pr.head.ref !== branch ||
                !allowedHeads.has(pr.head.sha) || ref.object.sha !== context.sha)
              throw new Error('PR190 state/live branch changed; refusing cancellation');
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
              {owner, repo, branch, per_page: 100});
            const receipt = {control_sha: context.sha, original_sha: oldHead, snapshot: runs.map(r =>
              ({id:r.id, name:r.name, head_sha:r.head_sha, status:r.status, conclusion:r.conclusion})), requested:[], verified:[]};
            fs.mkdirSync(`${process.env.RUNNER_TEMP}/pr190`, {recursive:true});
            const output = `${process.env.RUNNER_TEMP}/pr190/cancellation.json`;
            fs.writeFileSync(output, JSON.stringify(receipt, null, 2));
            for (const run of runs) {
              if (run.id === context.runId || run.head_branch !== branch ||
                  run.head_repository?.full_name !== `${owner}/${repo}` ||
                  !allowedHeads.has(run.head_sha) || run.status === 'completed') continue;
              try {
                await github.rest.actions.cancelWorkflowRun({owner,repo,run_id:run.id});
                receipt.requested.push(run.id);
              } catch (error) {
                const live = (await github.rest.actions.getWorkflowRun({owner,repo,run_id:run.id})).data;
                if (live.status !== 'completed') throw error;
              }
              fs.writeFileSync(output, JSON.stringify(receipt, null, 2));
            }
            for (let attempt=0; attempt<12; attempt++) {
              receipt.verified = [];
              for (const id of receipt.requested) {
                const live = (await github.rest.actions.getWorkflowRun({owner,repo,run_id:id})).data;
                receipt.verified.push({id,status:live.status,conclusion:live.conclusion});
              }
              fs.writeFileSync(output, JSON.stringify(receipt, null, 2));
              if (receipt.verified.every(r => r.status === 'completed')) break;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.info(JSON.stringify(receipt.verified));
            if (receipt.verified.some(r => r.status !== 'completed'))
              throw new Error('Some cancellation requests have not completed');
      - name: Export exact branch history for source audit
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr190"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/pr190/source.txt"
          git bundle create "$RUNNER_TEMP/pr190/source.bundle" HEAD
          sha256sum "$RUNNER_TEMP/pr190/source.bundle" > "$RUNNER_TEMP/pr190/source.bundle.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr190-targeted-control
          path: ${{ runner.temp }}/pr190/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

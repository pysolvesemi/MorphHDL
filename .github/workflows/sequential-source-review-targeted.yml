name: PR190 bounded layering publication
on:
  push:
    branches: [agent/wa-sequential-wire-consumers]
    paths: ['.github/workflows/sequential-source-review-targeted.yml']
permissions:
  contents: read
concurrency:
  group: pr190-targeted-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare-layering:
    if: github.repository == 'pysolvesemi/MorphHDL' && github.ref == 'refs/heads/agent/wa-sequential-wire-consumers'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      BASE: 1711ce84705cedf0fdf6cc512e93d443b257acd8
      EXPECTED_TREE: 152841636039c302ef8aec1205b669feb9736b8c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1711ce84705cedf0fdf6cc512e93d443b257acd8
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the exact reviewed source-only layering delta
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          mkdir -p "$RUNNER_TEMP/pr190-layering"
          python3 - <<'PYCODE'
          import base64,lzma,hashlib,json,os,subprocess
          from pathlib import Path
          encoded=''
          patch=lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='459a89d889a2a1cf5c9ba9bd32550b8f9fc85c4c1ba9b197590996d7a4bfdc29'
          destination=Path(os.environ['RUNNER_TEMP'],'pr190-layering')
          filename=destination/'layering.patch';filename.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(filename)],check=True)
          subprocess.run(['git','apply',str(filename)],check=True)
          entries=[{'path': '.github/workflows/sequential-source-review-targeted.yml', 'mode': '100644', 'type': 'blob', 'sha': '4b59727ce51e2ea8345168e1e9d4b0fac2836521'}, {'path': 'docs/morphhdl/sequential-wire-source-review.md', 'mode': '100644', 'type': 'blob', 'sha': '283f9e8093d5f1c94d44df8a36885fabd92795c7'}, {'path': 'morphhdl/contracts/increment-54-typed-layering-ir.contract', 'mode': '100644', 'type': 'blob', 'sha': '476f9b30c188143febe5aa4708e1594abbec1d0e'}, {'path': 'morphhdl/contracts/lane-when-source-scope.json', 'mode': '100644', 'type': 'blob', 'sha': 'dd59f7de88bbc8dfcdbd71fc27ad99e6c1c9567f'}, {'path': 'morphhdl/scripts/check-lane-when-source-scope.py', 'mode': '100644', 'type': 'blob', 'sha': '9ef40904dbdf86af1d6e9ff1951104de2e20556c'}, {'path': 'morphhdl/scripts/check-sequential-wire-source-review.py', 'mode': '100644', 'type': 'blob', 'sha': '6e98dfcb721557524c4663601678c161e8af2c54'}, {'path': 'morphhdl/scripts/check-typed-layering-ir.py', 'mode': '100644', 'type': 'blob', 'sha': '05d893feec72c448c7df68578e629ee92654ed8f'}, {'path': 'morphhdl/scripts/test-sequential-wire-source-review.py', 'mode': '100644', 'type': 'blob', 'sha': 'e569368fbba44eeea09d7ba0882b4289c52df824'}]
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert sorted(changed)==sorted(x['path'] for x in entries),changed
          for entry in entries:
              raw=Path(entry['path']).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==entry['sha'],entry
          (destination/'source-blobs.json').write_text(json.dumps(entries,indent=2)+'\n')
          subprocess.run(['git','add','--',*changed],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==os.environ['EXPECTED_TREE']
          PYCODE
          git diff --cached --check
          python3 morphhdl/scripts/check-typed-layering-ir.py --self-test 2>&1 | tee "$RUNNER_TEMP/pr190-layering/layering-selftest.log"
          python3 morphhdl/scripts/check-typed-layering-ir.py 2>&1 | tee "$RUNNER_TEMP/pr190-layering/layering-live.log"
          (cd repro/independent-parameters; python3 -m unittest -v test_check test_qualify test_layering test_symbolic_policy) 2>&1 | tee "$RUNNER_TEMP/pr190-layering/independent-tests.log"
          python3 - <<'PYCODE'
          import importlib.util
          p='morphhdl/scripts/test-sequential-wire-source-review.py'
          s=importlib.util.spec_from_file_location('layering_test',p);m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          m.layering_controls();m.review.verify_layering_successor(m.ROOT)
          PYCODE
      - name: Store verified source blobs without workflow trees or branch writes
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'); const {owner,repo}=context.repo;
            const root=`${process.env.RUNNER_TEMP}/pr190-layering`;
            const entries=JSON.parse(fs.readFileSync(`${root}/source-blobs.json`));
            for(const entry of entries) {
              const content=fs.readFileSync(entry.path).toString('base64');
              const blob=(await github.rest.git.createBlob({owner,repo,encoding:'base64',content})).data;
              if(blob.sha!==entry.sha) throw new Error(`source blob mismatch: ${entry.path}`);
            }
            fs.writeFileSync(`${root}/source-ready.json`,JSON.stringify({base:process.env.BASE,tree:process.env.EXPECTED_TREE,entries},null,2));
      - uses: actions/upload-artifact@v4
        with:
          name: pr190-layering-source-ready
          path: ${{ runner.temp }}/pr190-layering/
          if-no-files-found: error
          retention-days: 14
      - name: Await the exact source checkpoint published by the authorized repository connection
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            for(let attempt=0;attempt<120;attempt++) {
              const ref=(await github.rest.git.getRef({owner,repo,ref:'heads/agent/wa-sequential-wire-consumers'})).data;
              if(ref.object.sha!==context.sha) {
                const commit=(await github.rest.git.getCommit({owner,repo,commit_sha:ref.object.sha})).data;
                if(commit.tree.sha!==process.env.EXPECTED_TREE || commit.parents.length!==1 || commit.parents[0].sha!==context.sha)
                  throw new Error('Repair branch changed unexpectedly; do not modify it');
                core.setOutput('sha',commit.sha); return;
              }
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            throw new Error('Exact source checkpoint was not published within the bounded recovery window');
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the unchanged complete seal to the actual published source
        env:
          SOURCE: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          python3 - <<'PYCODE'
          import importlib.util,json,hashlib,re,subprocess,os
          from pathlib import Path
          root=Path.cwd();source=os.environ['SOURCE']
          helper='morphhdl/scripts/check-increment-62-wa08-source-overlay.py'
          contract='morphhdl/contracts/increment-62-wa08-source-overlay.json'
          def load(name,path):
              s=importlib.util.spec_from_file_location(name,root/path);m=importlib.util.module_from_spec(s);s.loader.exec_module(m);return m
          m=load('outer',helper);r=load('review','morphhdl/scripts/check-sequential-wire-source-review.py')
          def git(*args):return subprocess.check_output(['git','--literal-pathspecs',*args])
          old=json.loads((root/contract).read_text())
          assert old['base']==m.BASE
          assert old['helper_normalized_sha256']=='14feb8286f32152b7c6881c73e0339e069bbeaaf07cdc1d51d84cc208fc39fab'
          assert hashlib.sha256(m.normalized_helper((root/helper).read_bytes())).hexdigest()==old['helper_normalized_sha256']
          changed={p.decode() for p in git('diff','--no-renames','--name-only','-z',m.BASE,source).split(b'\0') if p}
          paths=({p for p in changed if m.governed(p)}|{e['path'] for e in old['files']}|r.IMPLEMENTATION_PATHS|r.REVIEW_PATHS)-{helper,contract}
          entries=[];tree=m.tree(root,source)
          for path in sorted(paths):
              assert path in tree,path
              mode,blob=tree[path];raw=git('show',source+':'+path)
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==blob
              before=m.frozen(root,m.BASE,path)
              entries.append(dict(path=path,mode=mode,before_sha256=hashlib.sha256(before).hexdigest() if before is not None else None,after_sha256=hashlib.sha256(raw).hexdigest()))
          assert len(entries)==212,len(entries)
          for path in r.PRODUCTION_PATHS:assert git('show',source+':'+path)==git('show',r.SOURCE+':'+path),path
          value=dict(schema_version=1,base=m.BASE,final_source_commit=source,helper_normalized_sha256=old['helper_normalized_sha256'],files=entries)
          raw=(json.dumps(value,indent=2)+'\n').encode();(root/contract).write_bytes(raw)
          raw,count=re.subn(rb'^CONTRACT_SHA256 = "[^"]+"$',b'CONTRACT_SHA256 = "'+hashlib.sha256(raw).hexdigest().encode()+b'"',(root/helper).read_bytes(),count=1,flags=re.M)
          assert count==1;(root/helper).write_bytes(raw)
          destination=Path(os.environ['RUNNER_TEMP'],'pr190-layering')
          (destination/'published-source.txt').write_text(source+'\n')
          for label,path in [('overlay.json',contract),('overlay-helper.py',helper)]: (destination/label).write_bytes((root/path).read_bytes())
          PYCODE
          git add morphhdl/contracts/increment-62-wa08-source-overlay.json morphhdl/scripts/check-increment-62-wa08-source-overlay.py
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'review: seal scanned standalone root checkpoint [skip ci]'
          python3 morphhdl/scripts/check-sequential-wire-source-review.py 2>&1 | tee "$RUNNER_TEMP/pr190-layering/current.log"
          python3 morphhdl/scripts/test-sequential-wire-source-review.py 2>&1 | tee "$RUNNER_TEMP/pr190-layering/mutations.log"
          python3 morphhdl/scripts/check-native-source-preservation.py 2>&1 | tee "$RUNNER_TEMP/pr190-layering/native.log"
          python3 morphhdl/scripts/check-increment-61-source-review.py 2>&1 | tee "$RUNNER_TEMP/pr190-layering/successor.log"
          git diff --exit-code
      - name: Store only the two verified ordinary seal blobs
        uses: actions/github-script@v7
        env:
          SOURCE: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const fs=require('fs'),cp=require('child_process');const {owner,repo}=context.repo;
            const git=(...args)=>cp.execFileSync('git',['--literal-pathspecs',...args],{encoding:'utf8'}).trim();
            const paths=['morphhdl/contracts/increment-62-wa08-source-overlay.json','morphhdl/scripts/check-increment-62-wa08-source-overlay.py'];
            if(JSON.stringify(git('diff','--name-only',process.env.SOURCE,'HEAD').split('\n').sort())!==JSON.stringify([...paths].sort()))
              throw new Error('Unexpected final seal change');
            const entries=[];
            for(const path of paths) {
              const expected=git('rev-parse',`HEAD:${path}`);
              const blob=(await github.rest.git.createBlob({owner,repo,encoding:'base64',content:fs.readFileSync(path).toString('base64')})).data;
              if(blob.sha!==expected) throw new Error(`seal blob mismatch: ${path}`);
              entries.push({path,mode:'100644',type:'blob',sha:blob.sha});
            }
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/pr190-layering/seal-ready.json`,JSON.stringify({source:process.env.SOURCE,tree:git('rev-parse','HEAD^{tree}'),entries},null,2));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr190-layering-seal-ready
          path: ${{ runner.temp }}/pr190-layering/
          if-no-files-found: error
          retention-days: 14

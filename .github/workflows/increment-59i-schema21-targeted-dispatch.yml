name: Increment 59i schema-21 targeted dispatcher

on:
  push:
    branches: [recovery/increment-59i-schema21-targeted-90eb789a]
    paths:
      - .github/recovery/59i-schema21-targeted-dispatch/**
      - .github/workflows/increment-59i-schema21-targeted-dispatch.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: increment-59i-schema21-targeted-90eb789a
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GITHUB_TOKEN: ${{ github.token }}
      EXPECTED_CONTROLLER_SHA256: fbc1c5f87679a6b9b5ef4d3de11fb23615c6a914f6e95f91441bf4a30bad2949
      EXPECTED_INTENT_SHA256: 8c7fc7d4ea2b3f0c8927d59f63dc2c6d94ac714fcf31e6796ad822c728f4a474
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Dispatch only the six schema-21 affected requirements
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/recovery/59i-schema21-targeted-dispatch/controller.py \
            --intent .github/recovery/59i-schema21-targeted-dispatch/intent.json \
            --output "$GITHUB_WORKSPACE/targeted-receipts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 59i-schema21-targeted-dispatch-${{ github.run_id }}-${{ github.run_attempt }}
          path: targeted-receipts/
          if-no-files-found: error
          retention-days: 30

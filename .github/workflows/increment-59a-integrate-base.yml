name: Increment 59a integrate current baseline
on:
  push:
    branches: [agent/increment-59a-recursive-verilog-module]
permissions:
  contents: write
jobs:
  integrate:
    if: github.event.head_commit.message == 'Integrate merged 60a baseline into the qualified 59a source tree'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Merge baseline preserving independent roadmap entries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MorphHDL Increment Agent'
          git config user.email 'actions@users.noreply.github.com'
          baseline=7087302067fc3b7ffdf4ead2d2b39c722196828c
          git fetch --no-tags origin parameterized-verilog
          test "$(git rev-parse origin/parameterized-verilog)" = "$baseline"
          if ! git merge --no-commit --no-ff "$baseline"; then
            test "$(git diff --name-only --diff-filter=U)" = docs/morphhdl/parameterized-verilog-todo.md
          fi
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          todo='docs/morphhdl/parameterized-verilog-todo.md'
          old=subprocess.check_output(['git','show','0da80980ac4d074cc053c85b1affd8b2334db453:'+todo],text=True)
          base=subprocess.check_output(['git','show','7087302067fc3b7ffdf4ead2d2b39c722196828c:'+todo],text=True)
          title='- [ ] **Increment 59a — Bounded recursive Verilog module generation and proof**'
          section=old[old.index(title):old.index('## Completion target\n')]
          following='- [ ] **Increment 60 — Native signed `SInt` Verilog**'
          assert base.count(following)==1 and title not in base
          Path(todo).write_text(base.replace(following,section+following,1))
          workflow=Path('.github/workflows/increment-59a-recursive-verilog-module.yml')
          text=workflow.read_text()
          needle='          end = after.index(anchor)'
          replacement='''          following = re.search(r"(?m)^- \\[(?: |x)\\] \\*\\*Increment |^## ", after[after.index(title_59b) + len(title_59b):])
          if following is None:
              raise SystemExit("roadmap successor section has no closing boundary")
          end = after.index(title_59b) + len(title_59b) + following.start()'''
          assert text.count(needle)==1
          workflow.write_text(text.replace(needle,replacement))
          Path('.github/workflows/increment-59a-integrate-base.yml').unlink()
          PY
          git add docs/morphhdl/parameterized-verilog-todo.md .github/workflows/increment-59a-recursive-verilog-module.yml .github/workflows/increment-59a-integrate-base.yml
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          python3 morphhdl/scripts/check-increment-59a-recursive-module.py --self-test --repo-root .
          git commit -m 'Integrate Increment 60a without altering its sealed signedness baseline'
          mkdir -p integration-artifacts
          git rev-parse HEAD | tee integration-artifacts/head-sha.txt
          git rev-parse HEAD^{tree} > integration-artifacts/tree-sha.txt
          git diff --stat "$baseline"...HEAD > integration-artifacts/delta.txt
          git archive --format=tar.gz --output=integration-artifacts/source.tar.gz HEAD
          git push origin HEAD:agent/increment-59a-recursive-verilog-module > integration-artifacts/publication.log 2>&1 || cat integration-artifacts/publication.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-59a-base-integration
          path: integration-artifacts
          if-no-files-found: error

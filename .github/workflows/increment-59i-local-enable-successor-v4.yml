name: Increment 59i local-enable successor v4

on:
  push:
    branches: ['agent/increment-59i-combined-reduction-closure']
    paths:
      - '.github/workflows/increment-59i-local-enable-successor-v4.yml'
      - 'morphhdl/repair-59i-composite-local-enable/promote-successor-v4.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-59i-local-enable-successor-v4
  cancel-in-progress: false

jobs:
  qualify:
    name: Prepare, qualify and publish local-enable successor
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      BRANCH: agent/increment-59i-combined-reduction-closure
      COURSIER_REPOSITORIES: https://repo.maven.apache.org/maven2
      COURSIER_CACHE: /sbt/.cache/coursier/v1
      JAVA_TOOL_OPTIONS: '-Xmx5G -XX:ActiveProcessorCount=4'
      SBT_TEST_PARALLEL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Record exact starting state
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-local-enable-v4"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/start-head.txt"
          git rev-parse 'HEAD^{tree}' > "$out/start-tree.txt"
          git status --porcelain > "$out/start-status.txt"
          test ! -s "$out/start-status.txt"
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$(cat "$out/start-head.txt")"
          git fetch origin parameterized-verilog
          git merge-base --is-ancestor FETCH_HEAD HEAD

      - name: Prepare and commit exact successor
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-local-enable-v4"
          python3 morphhdl/repair-59i-composite-local-enable/promote-successor-v4.py \
            2>&1 | tee "$out/preparation.log"
          git diff --check
          cat > "$out/expected-files.txt" <<'EOF'
          docs/morphhdl/increment-59i-composite-local-enable-successor-v4.md
          morphhdl/contracts/increment-59i-local-enable-successor-v4.json
          morphhdl/scripts/check-increment-59i-local-enable-successor-v4.py
          morphhdl/src/main/scala/spinal/core/internals/TypedBalancedReductionBridgeReplay.scala
          morphhdl/src/main/scala/spinal/core/internals/TypedBalancedReductionCompositeReplay.scala
          morphhdl/src/test/scala/spinal/core/internals/TypedBalancedReductionCompositeLocalEnableTests.scala
          EOF
          while read -r path; do test -f "$path"; done < "$out/expected-files.txt"
          git add $(cat "$out/expected-files.txt")
          git diff --cached --name-only | sort -u > "$out/actual-files.txt"
          sort -u "$out/expected-files.txt" > "$out/expected-files.sorted.txt"
          diff -u "$out/expected-files.sorted.txt" "$out/actual-files.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '59i: promote exact same-composite local-enable successor v4'
          git rev-parse HEAD > "$out/successor-head.txt"
          git rev-parse 'HEAD^{tree}' > "$out/successor-tree.txt"
          sha256sum $(cat "$out/expected-files.txt") > "$out/source-sha256.txt"

      - name: Run narrow exact-source review and parent-bound audits
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-local-enable-v4"
          {
            python3 morphhdl/scripts/check-increment-59i-local-enable-successor-v4.py --self-test
            python3 morphhdl/scripts/check-native-source-preservation.py
            python3 morphhdl/scripts/check-typed-native-source-overlay.py
            found=0
            for checker in morphhdl/scripts/*59i*combined*parent*.py morphhdl/scripts/*59i*parent*join*.py; do
              test -f "$checker" || continue
              found=1
              python3 "$checker"
            done
            echo "combined_parent_checker_count=$found"
          } 2>&1 | tee "$out/source-audits.log"

      - name: Bootstrap pinned SBT
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-local-enable-v4"
          version=$(sed -n 's/^sbt.version=//p' project/build.properties)
          test "$version" = '1.10.0'
          base="https://repo.maven.apache.org/maven2/org/scala-sbt/sbt-launch/$version/sbt-launch-$version.jar"
          curl --fail --location --retry 5 --retry-all-errors "$base" -o "$out/sbt-launch.jar"
          curl --fail --location --retry 5 --retry-all-errors "$base.sha1" -o "$out/sbt-launch.jar.sha1"
          python3 - <<'PY'
          import hashlib, re
          from pathlib import Path
          root = Path('target/increment-59i-local-enable-v4')
          expected = (root / 'sbt-launch.jar.sha1').read_text().strip().lower()
          assert re.fullmatch('[0-9a-f]{40}', expected)
          assert hashlib.sha1((root / 'sbt-launch.jar').read_bytes()).hexdigest() == expected
          PY
          printf '[repositories]\nlocal\nmaven-central: https://repo.maven.apache.org/maven2\n' > "$out/repositories"
          cat > "$out/sbt.sh" <<'SH'
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-local-enable-v4"
          scala="$1"; shift
          java -Xmx4G -Dsbt.log.noformat=true -Dsbt.supershell=false \
            -Dsbt.boot.directory=/sbt/.sbt/boot -Dsbt.global.base=/sbt/.sbt \
            -Dsbt.ivy.home=/sbt/.ivy2 -Duser.home=/sbt \
            -Dsbt.repository.config="$out/repositories" -Dsbt.override.build.repos=true \
            -jar "$out/sbt-launch.jar" "++$scala" "$@"
          SH
          chmod +x "$out/sbt.sh"

      - name: Compile and run both supported Scala lanes
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-local-enable-v4"
          suites='morph/Test/testOnly spinal.core.internals.TypedBalancedReductionCompositeLocalEnableTests spinal.core.internals.TypedBalancedReductionBridgeReplayTests spinal.core.internals.TypedBalancedReductionCompositeTests spinal.core.internals.TypedBalancedReductionCompositeCallbackPolicyTests spinal.core.internals.TypedBalancedReductionCompositeWideningTests spinal.core.internals.TypedBalancedReductionCompositeCaptureTests spinal.core.internals.TypedBalancedReductionCombinedTests spinal.core.internals.TypedBalancedReductionNestedOwnerTests'
          for scala in 2.12.18 2.13.12; do
            log="$out/tests-$scala.log"
            "$out/sbt.sh" "$scala" 'morph/Test/compile' "$suites" > "$log" 2>&1 || {
              tail -n 360 "$log"
              exit 1
            }
            grep -q 'All tests passed' "$log"
            ! grep -q '\*\*\* FAILED \*\*\*' "$log"
            grep -E 'Total number of tests run:|All tests passed' "$log" | tail -n 4
          done
          mkdir -p "$out/test-reports"
          find morphhdl/target -type f -name '*.xml' -exec cp {} "$out/test-reports/" \; 2>/dev/null || true

      - name: Publish with expected-head protection
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-local-enable-v4"
          expected=$(cat "$out/start-head.txt")
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          git status --porcelain > "$out/pre-push-status.txt"
          test ! -s "$out/pre-push-status.txt"
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD > "$out/pushed-head.txt"

      - name: Record a bounded failure checkpoint without publishing unqualified source
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-local-enable-v4"
          start=$(cat "$out/start-head.txt" 2>/dev/null || true)
          test -n "$start" || exit 0
          report="$out/failure.md"
          {
            echo '# Increment 59i local-enable v4 failure checkpoint'
            echo
            echo "Starting commit: \`$start\`"
            echo
            echo 'The successor production files were not published. This record contains only bounded diagnostics.'
            for log in "$out/preparation.log" "$out/source-audits.log" "$out/tests-2.12.18.log" "$out/tests-2.13.12.log"; do
              test -f "$log" || continue
              echo
              echo "## $(basename "$log")"
              echo '```text'
              tail -n 180 "$log"
              echo '```'
            done
          } > "$report"
          git reset --hard "$start"
          mkdir -p morphhdl/repair-59i-composite-local-enable
          cp "$report" morphhdl/repair-59i-composite-local-enable/v4-last-failure.md
          git add morphhdl/repair-59i-composite-local-enable/v4-last-failure.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '59i: retain bounded local-enable v4 failure diagnostics'
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$start"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59i-local-enable-successor-v4-${{ github.sha }}
          path: target/increment-59i-local-enable-v4
          if-no-files-found: error
          retention-days: 21

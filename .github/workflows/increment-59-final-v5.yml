name: Increment 59 stable final qualification

on:
  push:
    branches:
      - agent/increment-59-typed-blackbox-generics

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: increment-59-stable-final
  cancel-in-progress: false

env:
  INC59_RUNNER: morphhdl/scripts/increment-59-final-runner-v5.sh

jobs:
  prepare:
    name: Normalize exact source input
    if: github.event.head_commit.message == 'Run stable Increment 59 final qualification'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-59-typed-blackbox-generics
          fetch-depth: 0
          submodules: recursive
      - name: Normalize and package reviewed source
        shell: bash
        run: |
          set -euo pipefail
          test -s "$INC59_RUNNER"
          bash -n "$INC59_RUNNER"
          INC59_OUTPUT_ARCHIVE=/tmp/increment-59-normalized-source.tar.gz \
          INC59_OUTPUT_PATHS=/tmp/increment-59-reviewed-paths.txt \
            bash "$INC59_RUNNER" prepare
      - name: Upload normalized source
        uses: actions/upload-artifact@v4
        with:
          name: increment-59-v5-normalized-source
          path: |
            /tmp/increment-59-normalized-source.tar.gz
            /tmp/increment-59-normalized-source.tar.gz.sha256
            /tmp/increment-59-reviewed-paths.txt
          if-no-files-found: error
          retention-days: 7

  sbt:
    name: SBT Scala ${{ matrix.scala_version }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-59-typed-blackbox-generics
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: increment-59-v5-normalized-source
          path: /tmp/inc59-input
      - name: Run complete SBT qualification
        shell: bash
        run: |
          set -euo pipefail
          export INC59_SOURCE_ARCHIVE=/tmp/inc59-input/increment-59-normalized-source.tar.gz
          export INC59_SOURCE_SHA256="$(cat /tmp/inc59-input/increment-59-normalized-source.tar.gz.sha256)"
          export INC59_SCALA_VERSION='${{ matrix.scala_version }}'
          export INC59_EVIDENCE_DIR="$GITHUB_WORKSPACE/increment-59-evidence"
          bash "$INC59_RUNNER" sbt
      - name: Upload SBT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59-v5-sbt-${{ matrix.scala_version }}
          path: increment-59-evidence
          if-no-files-found: error
          retention-days: 14

  mill:
    name: Mill Scala ${{ matrix.scala_version }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-59-typed-blackbox-generics
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: increment-59-v5-normalized-source
          path: /tmp/inc59-input
      - name: Run complete Mill qualification
        shell: bash
        run: |
          set -euo pipefail
          export INC59_SOURCE_ARCHIVE=/tmp/inc59-input/increment-59-normalized-source.tar.gz
          export INC59_SOURCE_SHA256="$(cat /tmp/inc59-input/increment-59-normalized-source.tar.gz.sha256)"
          export INC59_SCALA_VERSION='${{ matrix.scala_version }}'
          export INC59_EVIDENCE_DIR="$GITHUB_WORKSPACE/increment-59-evidence"
          bash "$INC59_RUNNER" mill
      - name: Upload Mill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59-v5-mill-${{ matrix.scala_version }}
          path: increment-59-evidence
          if-no-files-found: error
          retention-days: 14

  strict-formal:
    name: Strict Verilog simulation synthesis formal
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-59-typed-blackbox-generics
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: increment-59-v5-normalized-source
          path: /tmp/inc59-input
      - name: Run strict and formal qualification
        shell: bash
        run: |
          set -euo pipefail
          export INC59_SOURCE_ARCHIVE=/tmp/inc59-input/increment-59-normalized-source.tar.gz
          export INC59_SOURCE_SHA256="$(cat /tmp/inc59-input/increment-59-normalized-source.tar.gz.sha256)"
          export INC59_EVIDENCE_DIR="$GITHUB_WORKSPACE/increment-59-evidence"
          bash "$INC59_RUNNER" strict
      - name: Upload strict and formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59-v5-strict-formal
          path: increment-59-evidence
          if-no-files-found: error
          retention-days: 30

  finalize:
    name: Build clean PR mark complete merge verify
    needs: [prepare, sbt, mill, strict-formal]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-59-typed-blackbox-generics
          fetch-depth: 0
          submodules: recursive
      - name: Download source and qualification evidence
        uses: actions/download-artifact@v4
        with:
          pattern: increment-59-v5-*
          path: /tmp/inc59-artifacts
          merge-multiple: false
      - name: Collect qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/inc59-final-evidence/qualification
          cp -R /tmp/inc59-artifacts/increment-59-v5-sbt-* /tmp/inc59-final-evidence/qualification/
          cp -R /tmp/inc59-artifacts/increment-59-v5-mill-* /tmp/inc59-final-evidence/qualification/
          cp -R /tmp/inc59-artifacts/increment-59-v5-strict-formal /tmp/inc59-final-evidence/qualification/
      - name: Construct qualify and merge clean final branch
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: parameterized-verilog
          SOURCE_BRANCH: agent/increment-59-typed-blackbox-generics
          FINAL_BRANCH: agent/increment-59-final-clean-v5
        shell: bash
        run: |
          set -euo pipefail
          input=/tmp/inc59-artifacts/increment-59-v5-normalized-source
          export INC59_SOURCE_ARCHIVE="$input/increment-59-normalized-source.tar.gz"
          export INC59_SOURCE_SHA256="$(cat "$input/increment-59-normalized-source.tar.gz.sha256")"
          export INC59_EVIDENCE_DIR=/tmp/inc59-final-evidence
          bash "$INC59_RUNNER" finalize
      - name: Upload final complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59-v5-final-complete-evidence
          path: /tmp/inc59-final-evidence
          if-no-files-found: error
          retention-days: 30

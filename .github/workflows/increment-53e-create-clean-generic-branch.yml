name: Increment 53e create clean generic continuation branch

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write

concurrency:
  group: increment-53e-create-clean-generic-branch
  cancel-in-progress: true

jobs:
  create:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0
      - name: Publish isolated continuation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          continuation=agent/increment-53e-generic-spinalhdl-proof
          git checkout -B "$continuation"
          rm -f .github/workflows/increment-53e-*.yml
          cp \
            morphhdl/support/increment-53e/increment-53e-generic-closure-v4.yml.template \
            .github/workflows/increment-53e-generic-closure-v4.yml
          git add -A
          git diff --cached --check
          git commit -m 'Increment 53e: isolate generic SpinalHDL proof branch'
          git push --force origin HEAD:$continuation

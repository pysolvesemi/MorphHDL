name: Increment 59a exact literal ownership repair
on:
  push:
    branches: [agent/increment-59a-recursive-verilog-module]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Repair exact fixed-width base-case assignment ownership for 59a'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-59a-recursive-verilog-module
          fetch-depth: 0
      - name: Preserve exact-width literal and recursive proof contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          p=Path('morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala')
          s=p.read_text()
          def replace(old,new):
              global s
              assert s.count(old)==1, (old,s.count(old))
              s=s.replace(old,new,1)
          replace('      sourceBooleanLiteral: Option[BigInt]\n','      sourceBooleanLiteral: Option[BigInt],\n      sourceBitVectorLiteral: Option[(Int, BigInt)] = None\n')
          replace('          wholeTargetBooleanLiteral(assignment)\n','          wholeTargetBooleanLiteral(assignment),\n          wholeTargetBitVectorLiteral(assignment)\n')
          helper=dedent('''\
            /** Exact fixed-width, whole-target unsigned literal replay. Width is part
              * of the evidence: selected targets, casts, resizing, poison, symbolic
              * widths and negative/signed literals are deliberately not admitted.
              */
            private def wholeTargetBitVectorLiteral(
                assignment: DataAssignmentStatement
            ): Option[(Int, BigInt)] = assignment.target match {
              case target: BaseType
                  if (target eq assignment.finalTarget) &&
                    (target.getTypeObject == TypeUInt || target.getTypeObject == TypeBits) &&
                    target.getBitsWidth > 0 &&
                    ParameterizedWidth.expressionOf(target).forall(_.parameters.isEmpty) =>
                assignment.source match {
                  case literal: BitVectorLiteral
                      if !literal.hasPoison() && !literal.isSignedKind &&
                        literal.getTypeObject == target.getTypeObject &&
                        literal.getWidth == target.getBitsWidth &&
                        literal.getValue() >= 0 &&
                        literal.getValue().bitLength <= target.getBitsWidth =>
                    Some(target.getBitsWidth -> literal.getValue())
                  case _ => None
                }
              case _ => None
            }
          ''')
          helper='\n'.join('  '+line if line else '' for line in helper.rstrip().splitlines())+'\n\n'
          replace('  private def emittedActualNames(\n',helper+'  private def emittedActualNames(\n')
          helper=dedent(r'''
          // Wider constants cannot use the whole-Bool order pairing above.
          // Admit only a single exact fixed-width literal assignment whose
          // complete emitted occurrence is also unique, including all selected
          // assignments. Coincident/folded/unsized literals never grant ownership.
          val capturedSizedLiteralOwners = claimants.flatMap { plan =>
            plan.assignmentEvidence.flatMap { evidence =>
              evidence.sourceBitVectorLiteral.map { case (width, value) =>
                (evidence.target, width, value) -> plan
              }
            }
          }.groupBy(_._1)
          val sizedLiteralPattern =
            """(?i)^\s*([0-9]+)'([bodh])([0-9a-f_]+)\s*$""".r
          capturedSizedLiteralOwners.foreach { case ((target, width, value), candidates) =>
            val emitted = emittedWholeLiteralIndices
              .getOrElse(target -> value, ArrayBuffer.empty)
            if (candidates.size == 1 && emitted.size == 1 &&
                emittedLiteralCounts(target -> value) == 1) {
              val index = emitted.head
              val exactWidth = DirectProceduralAssignment
                .findFirstMatchIn(stripLineComment(lines(index)).trim)
                .exists { statement =>
                  statement.group(3) match {
                    case sizedLiteralPattern(bits, _, _)
                        if BigInt(bits) == BigInt(width) => true
                    case _ => false
                  }
                }
              if (exactWidth && !literalOwnerByIndex.contains(index))
                literalOwnerByIndex(index) = candidates.head._2
            }
          }
          ''').strip()
          helper='\n'.join('        '+line if line else '' for line in helper.splitlines())+'\n\n'
          replace('        def directEvidenceOwners(\n',helper+'        def directEvidenceOwners(\n')
          p.write_text(s)
          p=Path('morphhdl/src/test/scala/nativeapplication/BoundedRecursivePowerFixture.scala')
          s=p.read_text()
          assert s.count('Vector(0, 1, 2, 3, 5, 8)')==1
          p.write_text(s.replace('Vector(0, 1, 2, 3, 5, 8)','Vector(0, 1, 2, 3, 4, 5, 6, 7, 8)',1))
          additions=[
              'morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala',
              'morphhdl/src/test/scala/morphhdl/BoundedRecursiveSafetyTests.scala'
          ]
          p=Path('morphhdl/contracts/increment-59a-source-scope.txt')
          entries=sorted(set(p.read_text().splitlines()+additions))
          p.write_text('\n'.join(entries)+'\n')
          p=Path('morphhdl/scripts/check-increment-59a-recursive-module.py')
          s=p.read_text()
          start=s.index('REQUIRED_FILES = (')
          end=s.index('\n)',start)+2
          s=s[:start]+'REQUIRED_FILES = (\n'+''.join('    '+repr(name)+',\n' for name in entries)+')'+s[end:]
          s=s.replace('"0 1 2 3 5 8"','"0 1 2 3 4 5 6 7 8"')
          p.write_text(s)
          p=Path('.github/workflows/increment-59a-recursive-verilog-module.yml')
          s=p.read_text()
          inherited=Path('.github/workflows/increment-59-typed-blackbox-generics.yml').read_text()
          segment=inherited[inherited.index('  v2001-and-formal:'):inherited.index('  closure:')]
          segment=segment.replace('  v2001-and-formal:','  inherited-formal:',1).replace('increment-59-','increment-59a-')
          start=s.index('  inherited-formal:')
          end=s.index('  compatibility:',start)
          s=s[:start]+segment+s[end:]
          s=s.replace('morph/testOnly morphhdl.BoundedRecursivePowerTests"','morph/testOnly morphhdl.BoundedRecursivePowerTests morphhdl.BoundedRecursiveSafetyTests"')
          s=s.replace('      - inherited-formal\n','      - inherited-formal\n      - streamfifocc-width-formal\n      - determinism\n')
          s=s.replace('          INHERITED_FORMAL: ${{ needs.inherited-formal.result }}\n','          INHERITED_FORMAL: ${{ needs.inherited-formal.result }}\n          WIDTH_FORMAL: ${{ needs.streamfifocc-width-formal.result }}\n          DETERMINISM: ${{ needs.determinism.result }}\n')
          s=s.replace('            "$INHERITED_FORMAL" \\\n','            "$INHERITED_FORMAL" \\\n            "$WIDTH_FORMAL" \\\n            "$DETERMINISM" \\\n')
          s=s.replace("    if: always() && needs.route.outputs.run == 'true'", "    if: always() && (needs.route.result != 'success' || needs.route.outputs.run == 'true')")
          p.write_text(s)
          Path('.github/workflows/increment-59a-literal-repair.yml').unlink()
          PY
          git diff --check
          python3 morphhdl/scripts/check-increment-59a-recursive-module.py --self-test --repo-root .
          bash -n morphhdl/scripts/prove-increment-59a-recursive-module.sh
          git config user.name 'MorphHDL Increment Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add morphhdl .github/workflows/increment-59a-recursive-verilog-module.yml .github/workflows/increment-59a-literal-repair.yml
          git commit -m 'Qualify exact-width base-case relocation and strengthen all inherited 59a gates'
          git push origin HEAD:agent/increment-59a-recursive-verilog-module
      - name: Generate recursive RTL from the ordinary typed component
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recursive-artifacts
          sbt -batch '++2.13.12' "morph/Test/runMain morphhdl.BoundedRecursivePowerArtifactWriter --output-dir ${GITHUB_WORKSPACE}/recursive-artifacts" 2>&1 | tee recursive-artifacts/generation.log
          cat recursive-artifacts/bounded_recursive_power.v
      - name: Exercise recursive and inherited structural identity tests
        shell: bash
        run: |
          set -euo pipefail
          sbt -batch '++2.13.12' 'morph/testOnly morphhdl.BoundedRecursivePowerTests morphhdl.BoundedRecursiveSafetyTests morphhdl.TypedBlackBoxGenericBindingTests morphhdl.StructuralGenerateControlTests spinal.core.StructuralIdentityAdversarialTests spinal.core.ScalarStructuralIdentityAdversarialTests' 2>&1 | tee recursive-artifacts/tests.log
      - name: Synthesize and prove the actual generated recursive candidate
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl/scripts/prove-increment-59a-recursive-module.sh --artifact-dir recursive-artifacts 2>&1 | tee recursive-artifacts/proof.log
      - name: Retain compiled checkpoint for focused offline diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recursive-artifacts/offline
          sbt -batch '++2.13.12' 'show morph/Test/fullClasspath' 'show morph/Test/scalacOptions' 'show morph/Compile/scalacOptions' > recursive-artifacts/offline/classpath-export.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import json,re,shutil,tarfile
          root=Path('recursive-artifacts/offline')
          log=re.sub(r'\x1b\[[0-9;]*m','',(root/'classpath-export.log').read_text())
          paths=[Path(x) for x in re.findall(r'Attributed\(([^)]+)\)',log)]
          paths+=list(Path('/sbt').rglob('scala-compiler-2.13.12.jar'))
          paths+=list(Path('/sbt').rglob('scala-reflect-2.13.12.jar'))
          paths+=list(Path('idslplugin/target').glob('scala-2.13/*.jar'))
          paths+=list(Path('morphplugin/target').glob('scala-2.13/*.jar'))
          seen=set(); manifest=[]
          for source in paths:
              source=source.resolve()
              if not source.exists() or str(source) in seen: continue
              seen.add(str(source))
              relative=f'cp/{len(manifest):03d}/{source.name}'
              target=root/relative
              target.parent.mkdir(parents=True,exist_ok=True)
              if source.is_dir(): shutil.copytree(source,target)
              else: shutil.copy2(source,target)
              manifest.append({'source':str(source),'path':relative,'directory':source.is_dir()})
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2))
          print(f'Exported {len(manifest)} exact compiled classpath entries')
          with tarfile.open('recursive-artifacts/offline-compiled.tar.gz','w:gz') as archive:
              archive.add(root,arcname='offline')
          shutil.rmtree(root)
          PY
          git archive --format=tar.gz --output=recursive-artifacts/source.tar.gz HEAD
          git rev-parse HEAD > recursive-artifacts/head-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-59a-literal-repair-artifacts
          path: recursive-artifacts
          if-no-files-found: error

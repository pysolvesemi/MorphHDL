name: Recover reviewed Increment 47 patch

on:
  push:
    branches:
      - agent/increment-49-native-int-provenance
    paths:
      - .github/workflows/increment-49-recover-increment-47.yml
  pull_request:
    branches:
      - parameterized-verilog
    paths:
      - .github/workflows/increment-49-recover-increment-47.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct reviewed Increment 47 patch from immutable blobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          blobs=(
            2d5a797794ea1ff72f7eec8d92258f824c4978c9
            cee9bb3e911e00566a3375a77a7c09851eda6b0f
            56609fbf25d303bcdcd16352640add9501ca4c0e
            882b35c9ef8b274c368589bb728d04674746faed
            7aeb2d7b9156f3567e1768d8ce87c33d15b7f855
            bdb24e643dc2f8df1940d33ec1ef4815d5cdbb20
          )

          : > increment-47-reviewed.patch.b64
          for sha in "${blobs[@]}"; do
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GH_REPO}/git/blobs/${sha}" \
              --jq '.content' \
              | tr -d '\n' \
              | base64 --decode \
              >> increment-47-reviewed.patch.b64
          done

          base64 --decode increment-47-reviewed.patch.b64 \
            | gzip --decompress \
            > increment-47-reviewed.patch
          test -s increment-47-reviewed.patch
          git apply --check increment-47-reviewed.patch
          git apply --numstat increment-47-reviewed.patch > increment-47-reviewed.numstat
          sha256sum increment-47-reviewed.patch > increment-47-reviewed.patch.sha256
          cat increment-47-reviewed.numstat
          cat increment-47-reviewed.patch.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: increment-47-reviewed-patch-${{ github.sha }}
          path: |
            increment-47-reviewed.patch
            increment-47-reviewed.patch.sha256
            increment-47-reviewed.numstat
          if-no-files-found: error
          retention-days: 1

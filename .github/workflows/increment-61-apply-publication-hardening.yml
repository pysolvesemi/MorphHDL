name: Increment 61 apply publication hardening

on:
  push:
    branches:
      - agent/increment-61-one-file-per-component
    paths:
      - '.github/workflows/increment-61-apply-publication-hardening.yml'
      - 'morphhdl/repair-61-publication-hardening/apply.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact reviewed hardening patch
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/repair-61-publication-hardening/apply.py
          git rm \
            .github/workflows/increment-61-apply-publication-hardening.yml \
            morphhdl/repair-61-publication-hardening/apply.py
          git add \
            .github/workflows/increment-61-one-file-per-component.yml \
            .github/workflows/increment-61-compatibility-matrix.yml \
            morphhdl/contracts/increment-61-source-review.json \
            morphhdl/scripts/check-increment-61-source-review.py \
            morphhdl/src/main/scala/morphhdl/MorphPerComponentPublication.scala \
            morphhdl/src/test/scala/morphhdl/Increment61PerComponentPublicationTests.scala
          git diff --cached --check

      - name: Commit, verify and publish
        shell: bash
        run: |
          set -euo pipefail
          original=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m '61: reject every unowned publication collision' \
            -m 'Do not adopt a pre-existing unowned path even when its bytes happen to match generated output. Add a byte-identical collision regression and make both permanent Increment 61 workflows track the recursive publication adapter. Refresh the exact reviewed-source hashes without expanding the production inventory.'
          python3 morphhdl/scripts/check-increment-61-source-review.py
          python3 morphhdl/scripts/check-increment-61-source-review.py --self-test
          remote=$(git ls-remote origin refs/heads/agent/increment-61-one-file-per-component | cut -f1)
          test "$remote" = "$original"
          git push origin HEAD:refs/heads/agent/increment-61-one-file-per-component

name: Native sequential wire consumers
on:
  push:
    branches: [agent/wa-sequential-wire-consumers]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      SBT_TEST_PARALLEL: '0'
      JVM_OPTS: '-Xmx5G -Xss4M -XX:ActiveProcessorCount=2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
          key: ${{ runner.os }}-sequential-wire-${{ hashFiles('**/build.sbt', 'project/**') }}
      - name: Install HDL tools
        run: sudo apt-get update -qq && sudo apt-get install -y iverilog yosys
      - name: Generate public API matrix using both compiler plugins
        id: generation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/remaining-wires"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/remaining-wires/source.txt"
          git diff --exit-code
          git diff --binary f5049ae2abfe5a47cd1fac3574ea08d630bd183f HEAD > "$RUNNER_TEMP/remaining-wires/compiler-and-tests.patch"
          java -version 2> "$RUNNER_TEMP/remaining-wires/java-version.txt"
          iverilog -V > "$RUNNER_TEMP/remaining-wires/iverilog-version.txt" 2>&1
          yosys -V > "$RUNNER_TEMP/remaining-wires/yosys-version.txt"
          cd repro/remaining-wires
          sbt -batch "runMain GenerateRemainingWireMatrix $RUNNER_TEMP/remaining-wires/matrix" 2>&1 | tee "$RUNNER_TEMP/remaining-wires/generation.log"
      - name: Verify shape determinism simulation equivalence and synthesis
        if: ${{ !cancelled() && steps.generation.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 repro/remaining-wires/check.py "$RUNNER_TEMP/remaining-wires/matrix" 2>&1 | tee "$RUNNER_TEMP/remaining-wires/checks.log"
      - name: Native emitter protection and inherited combinational regressions
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/remaining-wires"
          sbt -batch 'core/Test/testOnly spinal.core.internals.VerilogEmitterExpressionInliningTests spinal.core.internals.SequentialWireEmitterTests' 'morph/Test/testOnly morphhdl.SequentialWireNativeTests morphhdl.LaneWhenInliningRegressionTests morphhdl.examples.NativeWireExpressionCodecTests spinal.core.MorphVerilogExpressionInliningTests spinal.core.BooleanWidthNormalizationTests' 2>&1 | tee "$RUNNER_TEMP/remaining-wires/scala-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-wires-evidence
          path: ${{ runner.temp }}/remaining-wires/
          if-no-files-found: error
          retention-days: 14

name: Increment 53 recovery workspace export

on:
  push:
    branches:
      - agent/increment-53-native-streamfifo-clean
  pull_request:
    branches:
      - parameterized-verilog

permissions:
  contents: write

concurrency:
  group: increment-53-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-reviewed-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53-native-streamfifo-clean
          fetch-depth: 0
      - name: Apply pending reviewed patch when present
        shell: bash
        run: |
          set -euo pipefail
          patch=morphhdl/scripts/increment-53-production.patch
          transient=.github/workflows/increment-53-apply-structural-fix.yml
          if [[ ! -s "$patch" ]]; then
            echo 'No reviewed patch is pending.'
            exit 0
          fi
          git apply --index "$patch"
          git rm "$patch"
          if [[ -f "$transient" ]]; then
            git rm "$transient"
          fi
          git diff --cached --check
          git config user.name 'MorphHDL Increment Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(morphhdl): retain scalar native component formals'
          git pull --rebase origin agent/increment-53-native-streamfifo-clean
          git push origin HEAD:agent/increment-53-native-streamfifo-clean

  diagnose:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'run Increment 53 exact-head diagnostic')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53-native-streamfifo-clean
          fetch-depth: 0
      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill
      - name: Run source guard and focused Scala 2.13 contracts
        shell: bash
        run: |
          set +e
          guard_log=/tmp/inc53-guard.log
          test_log=/tmp/inc53-test-213.log
          bash morphhdl/scripts/check-native-streamfifo-structure-boundary.sh >"$guard_log" 2>&1
          guard_status=$?
          /tmp/morphhdl-mill -i "morph[2.13.12].testOnly" \
            morphhdl.ParameterizedStreamFifoDepthTests \
            morphhdl.NativeIntSymbolicConditionalTests \
            morphhdl.NativeIntNestedSymbolicControlFlowTests \
            morphhdl.AutomaticNativeMemDepthProvenanceTests \
            morphhdl.ExternalNativeIntFormalizationTests \
            morphhdl.ExternalNativeIntShadowExpressionTests \
            >"$test_log" 2>&1
          test_status=$?
          report=morphhdl/.increment-status/increment-53-diagnostic-11.txt
          mkdir -p "$(dirname "$report")"
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "SOURCE_GUARD_STATUS=$guard_status"
            echo "SCALA_2_13_STATUS=$test_status"
            echo
            echo "=== SOURCE GUARD ==="
            cat "$guard_log"
            echo
            echo "=== IMPORTANT TEST LINES ==="
            grep -E "(FAILED|\\[error\\]|Exception|MORPH-|SPINAL-|Compilation failed|Tests:|All tests passed|SUCCESS)" "$test_log" | tail -n 300 || true
            echo
            echo "=== TEST LOG TAIL ==="
            tail -n 350 "$test_log"
          } >"$report"
          sed -i -r 's/\x1B\[[0-9;]*[mK]//g' "$report"
          exit 0
      - name: Publish diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          report=morphhdl/.increment-status/increment-53-diagnostic-11.txt
          git add "$report"
          git config user.name 'MorphHDL Increment Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(morphhdl): record Increment 53 exact-head diagnostic'
          git pull --rebase origin agent/increment-53-native-streamfifo-clean
          git push origin HEAD:agent/increment-53-native-streamfifo-clean

  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package exact branch workspace
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/increment53-recovery-workspace.tgz"
          tar -C "$GITHUB_WORKSPACE" --exclude=.git --exclude=out -czf "$archive" .
          echo "archive=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: increment53-recovery-workspace-${{ github.sha }}
          path: ${{ env.archive }}
          if-no-files-found: error
          retention-days: 1

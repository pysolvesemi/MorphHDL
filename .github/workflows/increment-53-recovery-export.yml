name: Increment 53 recovery workspace export

on:
  push:
    branches:
      - agent/increment-53-native-streamfifo-clean
  pull_request:
    branches:
      - parameterized-verilog

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package exact branch workspace
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/increment53-recovery-workspace.tgz"
          tar -C "$GITHUB_WORKSPACE" --exclude=.git --exclude=out -czf "$archive" .
          echo "archive=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: increment53-recovery-workspace-${{ github.sha }}
          path: ${{ env.archive }}
          if-no-files-found: error
          retention-days: 1

name: Increment 53 recovery workspace export

on:
  push:
    branches:
      - agent/increment-53-native-streamfifo-clean
  pull_request:
    branches:
      - parameterized-verilog

permissions:
  contents: write

concurrency:
  group: increment-53-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-reviewed-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53-native-streamfifo-clean
          fetch-depth: 0
      - name: Apply pending reviewed patch when present
        shell: bash
        run: |
          set -euo pipefail
          patch=morphhdl/scripts/increment-53-production.patch
          transient=.github/workflows/increment-53-apply-structural-fix.yml
          if [[ ! -s "$patch" ]]; then
            echo 'No reviewed patch is pending.'
            exit 0
          fi
          git apply --index "$patch"
          git rm "$patch"
          if [[ -f "$transient" ]]; then
            git rm "$transient"
          fi
          git diff --cached --check
          git config user.name 'MorphHDL Increment Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(morphhdl): retain scalar native component formals'
          git pull --rebase origin agent/increment-53-native-streamfifo-clean
          git push origin HEAD:agent/increment-53-native-streamfifo-clean

  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package exact branch workspace
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/increment53-recovery-workspace.tgz"
          tar -C "$GITHUB_WORKSPACE" --exclude=.git --exclude=out -czf "$archive" .
          echo "archive=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: increment53-recovery-workspace-${{ github.sha }}
          path: ${{ env.archive }}
          if-no-files-found: error
          retention-days: 1

name: Increment 53e symbolic-slice bootstrap

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write

concurrency:
  group: increment-53e-slice-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'Apply Increment 53e symbolic-slice support')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact MorphHDL-owned symbolic-slice patches
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/apply-increment-53e-slice-support.py

      - name: Commit patched sources
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Increment 53e symbolic-slice support is already applied"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            morphruntime/src/main/scala/spinal/core/ExternalNativeIntShadowRegistry.scala \
            morphruntime/src/main/scala/spinal/core/ExternalNativeIntCompilerRuntime.scala \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala \
            morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalParameterizedVerilog.scala \
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala \
            morphhdl/scripts/check-native-streamfifocc-parameterization-boundary.sh
          git commit -m "Apply Increment 53e symbolic-slice support"
          git push origin HEAD:${GITHUB_REF_NAME}

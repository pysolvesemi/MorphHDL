name: WA-04 repair Scala report interpolation

on:
  push:
    branches:
      - agent/wa-04-unnamed-simple-wire-elimination
    paths:
      - ".github/workflows/wa04-repair-json.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair, compile, commit and push
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source = Path("morphhdl-passes/examples/UnnamedWireAliasNativeBridge.scala")
          text = source.read_text(encoding="utf-8")
          replacements = {
              '      s"  \\"visited_candidates\\": $visitedCandidates,",': '      s"""  "visited_candidates": $visitedCandidates,""",',
              '      s"  \\"eliminated_count\\": $eliminatedCount,",': '      s"""  "eliminated_count": $eliminatedCount,""",',
              '      s"  \\"rewritten_reference_count\\": $rewrittenReferences,",': '      s"""  "rewritten_reference_count": $rewrittenReferences,""",',
              '      s"  \\"eliminated_ordinals\\": [${eliminatedOrdinals.mkString(", ")}],",': '      s"""  "eliminated_ordinals": [${eliminatedOrdinals.mkString(", ")}],""",',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"neither old nor repaired interpolation was found: {old}")

          old_preservation = '''    !alias.isFrozen() &&
      alias.isEmptyOfTag &&
      !readPrivateBoolean(alias, "dontSimplify").getOrElse(true) &&
      assignment.locationString == null'''
          new_preservation = '''    !alias.isFrozen() &&
      alias.isEmptyOfTag &&
      !readPrivateBoolean(alias, "dontSimplify").getOrElse(true)'''
          if old_preservation in text:
              text = text.replace(old_preservation, new_preservation, 1)
          elif new_preservation not in text:
              raise SystemExit("preservation guard shape changed unexpectedly")

          source.write_text(text, encoding="utf-8")

          registry_path = Path(
              "morphhdl-passes/tests/formal_model/wire_assignment_ir/expected-signatures.json"
          )
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          relative = source.as_posix()
          registry["files"][relative] = hashlib.sha256(source.read_bytes()).hexdigest()
          registry_path.write_text(
              json.dumps(registry, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git diff --check
          sbt -batch \
            '++2.12.18' \
            'set morph / Test / unmanagedSources ++= Seq(file("morphhdl-passes/src/main/scala/morphhdl/passes/api/PassContracts.scala"), file("morphhdl-passes/src/main/scala/morphhdl/passes/adapter/CanonicalIrPassAdapter.scala"), file("morphhdl-passes/src/main/scala/morphhdl/passes/safety/WireAliasSafetyGate.scala"), file("morphhdl-passes/src/main/scala/morphhdl/passes/transform/UnnamedWireAliasEliminationPass.scala"), file("morphhdl-passes/examples/ParameterizedStreamFifo.scala"), file("morphhdl-passes/examples/UnnamedWireAliasNativeBridge.scala"))' \
            'morph / Test / compile'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            morphhdl-passes/examples/UnnamedWireAliasNativeBridge.scala \
            morphhdl-passes/tests/formal_model/wire_assignment_ir/expected-signatures.json
          git commit -m "WA-04: repair witness bridge compilation and metadata gate"
          git push origin "HEAD:${GITHUB_REF_NAME}"

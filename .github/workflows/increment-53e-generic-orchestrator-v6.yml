name: Increment 53e generic SpinalHDL closure v6

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: increment-53e-generic-closure
  cancel-in-progress: false

jobs:
  build-prove-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SOURCE_BRANCH: agent/increment-53e-native-streamfifocc-parameterization
      FINAL_BRANCH: agent/increment-53e-generic-engine-final
      TARGET_BRANCH: parameterized-verilog
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-streamfifo-cc-parameterization
          fetch-depth: 0

      - name: Configure authenticated repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --prune origin \
            "$TARGET_BRANCH" \
            "$SOURCE_BRANCH"

      - name: Reconcile the Increment 53e feature with the current target
        shell: bash
        run: |
          set -euo pipefail
          git switch -C "$FINAL_BRANCH" "origin/$SOURCE_BRANCH"
          if ! git merge --no-edit "origin/$TARGET_BRANCH"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ ${#conflicts[@]} -ne 1 || \
                  "${conflicts[0]}" != docs/morphhdl/parameterized-verilog-todo.md ]]; then
              printf 'Unexpected merge conflicts:\n%s\n' "${conflicts[*]}" >&2
              exit 1
            fi
            git checkout --theirs docs/morphhdl/parameterized-verilog-todo.md
            git add docs/morphhdl/parameterized-verilog-todo.md
            git commit --no-edit
          fi
          # Native SpinalHDL production source is always authoritative from the
          # current target. Increment 53e is not permitted to change it.
          git checkout "origin/$TARGET_BRANCH" -- \
            core/src/main lib/src/main idslplugin/src/main
          git diff --check

      - name: Materialize all generic MorphHDL-owned repairs
        shell: bash
        run: |
          set -euo pipefail
          run_if_missing() {
            local sentinel=$1
            local file=$2
            local script=$3
            if ! grep -Fq "$sentinel" "$file"; then
              test -f "$script"
              python3 "$script"
            fi
          }

          run_if_missing \
            'private sealed trait MemoryAddressRole' \
            morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogMemories.scala \
            morphhdl/scripts/apply-increment-53e-address-role-repair.py
          run_if_missing \
            'def promoteImplicitPackedFormals' \
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogHierarchy.scala \
            morphhdl/scripts/apply-increment-53e-implicit-child-width-formals.py
          if grep -Fq '::$definitionName::$key' \
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogHierarchy.scala; then
            python3 morphhdl/scripts/apply-increment-53e-canonical-implicit-formal-identity.py
          fi
          run_if_missing \
            'def isProvenModularUIntUpdate' \
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala \
            morphhdl/scripts/apply-increment-53e-modular-literal-proof.py
          run_if_missing \
            'val materializedAutoResize' \
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedAutoResize.scala \
            morphhdl/scripts/apply-increment-53e-materialized-auto-resize-proof.py
          run_if_missing \
            'def adaptiveLiteralBinaryWidth' \
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala \
            morphhdl/scripts/apply-increment-53e-unfixed-literal-width-inference.py
          if [[ -f morphhdl/scripts/apply-increment-53e-generic-spinal-engine-v4.py ]]; then
            python3 morphhdl/scripts/apply-increment-53e-generic-spinal-engine-v4.py
          else
            echo 'Generic Increment 53e materializer is missing.' >&2
            exit 1
          fi

          bash morphhdl/scripts/check-generic-native-parameterization-engine.sh
          git diff --check
          if git diff --name-only "origin/$TARGET_BRANCH" -- \
            core/src/main lib/src/main idslplugin/src/main | grep -q .; then
            echo 'Increment 53e changed native SpinalHDL production source.' >&2
            exit 1
          fi

      - name: Install pinned Mill launcher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Run generic and native contract proofs on both Scala lines
        shell: bash
        run: |
          set -euo pipefail
          suite=morphhdl/src/test/scala/morphhdl/NativeStreamFifoCCImplementationProofTests.scala
          while read -r variable; do
            case "$variable" in
              *WORKSPACE*)
                directory="/tmp/${variable,,}"
                mkdir -p "$directory"
                export "$variable=$directory"
                ;;
              *) export "$variable=1" ;;
            esac
          done < <(grep -oE 'MORPHDL_[A-Z0-9_]+' "$suite" | sort -u)

          for scala in 2.12.18 2.13.12; do
            /tmp/morphhdl-mill "morph[$scala].testOnly" \
              spinal.core.internals.ExternalParameterizedDomainEquivalenceTests \
              morphhdl.ParameterizedStreamFifoCCTests \
              morphhdl.NativeStreamFifoCCImplementationProofTests
          done

      - name: Run complete MorphHDL regressions on both Scala lines
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill 'morph[2.12.18].test'
          /tmp/morphhdl-mill 'morph[2.13.12].test'

      - name: Run solver-backed native witness equivalence
        shell: bash
        run: |
          set -euo pipefail
          suite=morphhdl/src/test/scala/morphhdl/NativeStreamFifoCCFormalEquivalenceTests.scala
          while read -r variable; do
            case "$variable" in
              *WORKSPACE*)
                directory="/tmp/${variable,,}"
                mkdir -p "$directory"
                export "$variable=$directory"
                ;;
              *) export "$variable=1" ;;
            esac
          done < <(grep -oE 'MORPHDL_[A-Z0-9_]+' "$suite" | sort -u)
          /tmp/morphhdl-mill 'morph[2.12.18].testOnly' \
            morphhdl.NativeStreamFifoCCFormalEquivalenceTests
          /tmp/morphhdl-mill 'morph[2.13.12].testOnly' \
            morphhdl.NativeStreamFifoCCFormalEquivalenceTests

      - name: Publish a clean permanent candidate
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \
            -name 'increment-53e-*.yml' -delete
          find morphhdl/scripts -maxdepth 1 -type f \
            -name 'apply-increment-53e-*.py' -delete

          bash morphhdl/scripts/check-generic-native-parameterization-engine.sh
          grep -Fq -- \
            '- [x] **Increment 53e — Native StreamFifoCC parameterization without source edits**' \
            docs/morphhdl/parameterized-verilog-todo.md
          test -f morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedDomainEquivalence.scala
          test -f morphhdl/src/test/scala/spinal/core/internals/ExternalParameterizedDomainEquivalenceTests.scala
          test -f morphhdl/src/test/scala/morphhdl/NativeStreamFifoCCImplementationProofTests.scala
          test -f morphhdl/src/test/scala/morphhdl/NativeStreamFifoCCFormalEquivalenceTests.scala
          test -f .github/workflows/morphhdl-native-streamfifocc-parameterization.yml
          test -f .github/workflows/morphhdl-native-streamfifocc-formal-equivalence.yml

          if git diff --name-only "origin/$TARGET_BRANCH" -- \
            core/src/main lib/src/main idslplugin/src/main | grep -q .; then
            echo 'Clean candidate changes native production source.' >&2
            exit 1
          fi
          mapfile -t changed < <(git diff --name-only "origin/$TARGET_BRANCH")
          for path in "${changed[@]}"; do
            case "$path" in
              morphplugin/*|morphruntime/*|morphhdl/*|frontend/*|docs/morphhdl/*|.github/workflows/morphhdl-*) ;;
              *) echo "Unexpected Increment 53e path: $path" >&2; exit 1 ;;
            esac
          done
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No Increment 53e candidate changes remain.' >&2
            exit 1
          fi
          git commit -m 'Increment 53e: generic native StreamFifoCC parameterization'
          candidate_sha=$(git rev-parse HEAD)
          candidate_tree=$(git rev-parse HEAD^{tree})
          base_sha=$(git rev-parse "origin/$TARGET_BRANCH")
          git push --force-with-lease \
            origin HEAD:"$FINAL_BRANCH"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_tree=$candidate_tree" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          number=$(gh pr list \
            --head "$FINAL_BRANCH" \
            --base "$TARGET_BRANCH" \
            --state open --json number \
            --jq '.[0].number // empty')
          if [[ -z "$number" ]]; then
            url=$(gh pr create \
              --head "$FINAL_BRANCH" \
              --base "$TARGET_BRANCH" \
              --title 'Increment 53e: generic native StreamFifoCC parameterization' \
              --body-file - <<'EOF'
## Scope

This parameterizes the exact untouched `spinal.lib.StreamFifoCC`. MorphHDL does not copy, subclass, reconstruct, or replace FIFO/CDC logic, and native SpinalHDL production sources remain unchanged.

The enabling mechanism is generic across native SpinalHDL: typed compiler structure, exact graph identity, compiler-retained provenance, and exhaustive bounded-domain equality. Component names, signal names, source filenames, rendered expression text, and equal concrete witnesses are forbidden as proof or dispatch keys.

## Required proof

- Scala 2.12.18 and 2.13.12
- complete MorphHDL regressions
- depths 4, 8 and 16
- independent push/pop clocks
- both buffered pop-reset modes
- deterministic Verilog-2001 emission, lint, simulation and synthesis
- independently elaborated concrete native witnesses
- solver-backed sequential equivalence
- negative mutation that must produce a failure/counterexample
EOF
            )
            number=${url##*/}
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Wait for permanent PR workflows
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.publish.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            '.github/workflows/morphhdl-native-streamfifocc-parameterization.yml'
            '.github/workflows/morphhdl-native-streamfifocc-formal-equivalence.yml'
          )
          for attempt in $(seq 1 720); do
            complete=1
            successful=1
            for path in "${required[@]}"; do
              run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$CANDIDATE_SHA&per_page=100" \
                --jq "[.workflow_runs[] | select(.path == \"$path\")] | sort_by(.created_at) | last // {}")
              status=$(jq -r '.status // "missing"' <<<"$run")
              conclusion=$(jq -r '.conclusion // "missing"' <<<"$run")
              printf '%s status=%s conclusion=%s\n' "$path" "$status" "$conclusion"
              [[ "$status" == completed ]] || complete=0
              [[ "$conclusion" == success ]] || successful=0
            done
            if ((complete)); then
              ((successful)) || exit 1
              exit 0
            fi
            sleep 20
          done
          echo 'Timed out waiting for permanent Increment 53e workflows.' >&2
          exit 1

      - name: Squash merge only the proven candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CANDIDATE_SHA: ${{ steps.publish.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ steps.publish.outputs.candidate_tree }}
          BASE_SHA: ${{ steps.publish.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_head=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          [[ "$current_head" == "$CANDIDATE_SHA" ]]
          git fetch origin "$TARGET_BRANCH"
          [[ $(git rev-parse "origin/$TARGET_BRANCH") == "$BASE_SHA" ]] || {
            echo 'Target advanced after proof; refusing stale merge.' >&2
            exit 1
          }
          gh pr merge "$PR_NUMBER" --squash --delete-branch
          merge_sha=$(gh pr view "$PR_NUMBER" --json mergedAt,mergeCommit \
            --jq 'select(.mergedAt != null) | .mergeCommit.oid')
          [[ -n "$merge_sha" ]]
          git fetch origin "$TARGET_BRANCH" --tags
          [[ $(git rev-parse "origin/$TARGET_BRANCH") == "$merge_sha" ]]
          [[ $(git rev-parse "$merge_sha^{tree}") == "$CANDIDATE_TREE" ]] || {
            echo 'Merged tree differs from the proven candidate.' >&2
            exit 1
          }
          git tag -f -a increment-53e-verified "$merge_sha" \
            -m 'Increment 53e generic native StreamFifoCC parameterization verified'
          git push --force origin refs/tags/increment-53e-verified
          printf 'Increment 53e merged as PR #%s at %s\n' "$PR_NUMBER" "$merge_sha"

      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53e-generic-closure-v6
          path: |
            /tmp/morphhdl_*
            /tmp/MORPHDL_*
          if-no-files-found: ignore

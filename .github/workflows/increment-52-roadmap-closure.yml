name: Increment 52 roadmap closure

on:
  push:
    branches:
      - agent/increment-52-post-merge-overlap-fix

permissions:
  contents: write

concurrency:
  group: increment-52-roadmap-closure
  cancel-in-progress: true

jobs:
  close-roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Increment 52 closure branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-52-post-merge-overlap-fix
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark Increment 52 complete and remove this carrier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/morphhdl/parameterized-verilog-todo.md')
          text = path.read_text(encoding='utf-8')
          old = '- [ ] **Increment 52 — Nested symbolic control flow and side-effect safety**'
          new = '- [x] **Increment 52 — Nested symbolic control flow and side-effect safety**'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one unchecked Increment 52 item, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm .github/workflows/increment-52-roadmap-closure.yml
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/morphhdl/parameterized-verilog-todo.md
          git add -u .github/workflows/increment-52-roadmap-closure.yml
          git commit -m 'docs: mark Increment 52 complete'
          git push origin HEAD:agent/increment-52-post-merge-overlap-fix

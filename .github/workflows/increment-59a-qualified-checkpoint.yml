name: Increment 59a generated recursive checkpoint
on:
  push:
    branches: [agent/increment-59a-recursive-verilog-module]
permissions:
  contents: write
jobs:
  qualify:
    if: github.event.head_commit.message == 'Build and prove reviewed 59a generated recursive checkpoint'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply the locally qualified exact source tree
        shell: bash
        run: |
          set -euo pipefail
          cp morphhdl/59a-qualified.patch /tmp/59a-qualified.patch
          git fetch --no-tags origin 4e62dbc1d85bc66077c6ff82ef90173333b3637a
          parent=$(git rev-parse HEAD)
          git read-tree --reset -u 4e62dbc1d85bc66077c6ff82ef90173333b3637a^{tree}
          test "$(git rev-parse HEAD)" = "$parent"
          git apply --check /tmp/59a-qualified.patch
          git apply /tmp/59a-qualified.patch
          git diff --check
          python3 morphhdl/scripts/check-increment-59a-recursive-module.py --self-test --repo-root .
          bash -n morphhdl/scripts/prove-increment-59a-recursive-module.sh
          git config user.name 'MorphHDL Increment Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Complete bounded recursive generation and exact constant-branch serialization'
          mkdir -p qualification-artifacts
          git rev-parse HEAD | tee qualification-artifacts/head-sha.txt
          git rev-parse HEAD^{tree} | tee qualification-artifacts/tree-sha.txt
          git archive --format=tar.gz --output=qualification-artifacts/source.tar.gz HEAD
          # GITHUB_TOKEN cannot publish workflow changes; retain the exact
          # uploaded commit for the authorized connected GitHub ref update.
          set +e
          git push origin HEAD:agent/increment-59a-recursive-verilog-module > qualification-artifacts/publication.log 2>&1
          result=$?
          set -e
          cat qualification-artifacts/publication.log
          if [[ $result != 0 ]]; then
            grep -Fq 'without `workflows` permission' qualification-artifacts/publication.log
            printf '%s\n' 'Exact commit retained; feature ref publication requires the connected GitHub workflow-write capability.'
          fi
      - name: Generate actual recursive candidate and independent SpinalVerilog oracles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification-artifacts/rtl
          sbt -batch '++2.13.12' "morph/Test/runMain morphhdl.BoundedRecursivePowerArtifactWriter --output-dir ${GITHUB_WORKSPACE}/qualification-artifacts/rtl" 2>&1 | tee qualification-artifacts/generation.log
          cat qualification-artifacts/rtl/bounded_recursive_power.v
      - name: Run recursive safety and inherited identity regressions
        shell: bash
        run: |
          set -euo pipefail
          sbt -batch '++2.13.12' 'morph/testOnly morphhdl.BoundedRecursivePowerTests morphhdl.BoundedRecursiveSafetyTests morphhdl.TypedBlackBoxGenericBindingTests morphhdl.StructuralGenerateControlTests spinal.core.StructuralIdentityAdversarialTests spinal.core.ScalarStructuralIdentityAdversarialTests' 2>&1 | tee qualification-artifacts/tests.log
      - name: Prove generated recursive source with strict simulation synthesis SAT and structural mutation
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl/scripts/prove-increment-59a-recursive-module.sh --artifact-dir qualification-artifacts/rtl 2>&1 | tee qualification-artifacts/proof.log
      - name: Retain final diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p qualification-artifacts
          git rev-parse HEAD > qualification-artifacts/head-sha.txt
          find qualification-artifacts/rtl -name '*.log' -maxdepth 1 -exec tail -n 8 '{}' \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-59a-generated-qualification
          path: qualification-artifacts
          if-no-files-found: error

name: Increment 53e generic repair diagnostic

on:
  push:
    branches:
      - agent/increment-53e-generic-domain-proof-final
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-53e-generic-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-generic-domain-proof-final
          fetch-depth: 0

      - name: Apply and diagnose
        shell: bash
        run: |
          set -u
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          log=/tmp/increment-53e-generic-diagnostic.log
          : > "$log"

          run_all() {
            set -euo pipefail
            ordered=(
              morphhdl/scripts/apply-increment-53e-address-role-repair.py
              morphhdl/scripts/apply-increment-53e-implicit-child-width-formals.py
              morphhdl/scripts/apply-increment-53e-canonical-implicit-formal-identity.py
              morphhdl/scripts/apply-increment-53e-modular-literal-proof.py
              morphhdl/scripts/apply-increment-53e-materialized-auto-resize-proof.py
              morphhdl/scripts/apply-increment-53e-unfixed-literal-width-inference.py
              morphhdl/scripts/apply-increment-53e-full-domain-width-equivalence.py
            )
            for patch in "${ordered[@]}"; do
              test ! -f "$patch" || python3 "$patch"
            done
            for patch in $(find morphhdl/scripts -maxdepth 1 -type f \
                -name 'apply-increment-53e-generic-*.py' | sort); do
              python3 "$patch"
            done
            git diff --check
            curl --fail --location --retry 5 --retry-all-errors \
              https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
              --output /tmp/morphhdl-mill
            chmod +x /tmp/morphhdl-mill
            /tmp/morphhdl-mill 'morph[2.12.18].testOnly' \
              morphhdl.ParameterizedStreamFifoCCTests
          }

          set +e
          run_all >"$log" 2>&1
          result=$?
          set -e

          mkdir -p .github/diagnostics
          {
            echo "head=$GITHUB_SHA"
            echo "result=$result"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            tail -n 240 "$log"
          } > .github/diagnostics/increment-53e-generic-latest.txt
          git add .github/diagnostics/increment-53e-generic-latest.txt
          git commit -m "Increment 53e: record generic repair diagnostic ($result)"
          git push origin HEAD:agent/increment-53e-generic-domain-proof-final
          exit "$result"

      - name: Upload full diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53e-generic-diagnostic
          path: /tmp/increment-53e-generic-diagnostic.log
          if-no-files-found: ignore

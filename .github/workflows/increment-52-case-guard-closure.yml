name: Increment 52 case-guard closure

on:
  push:
    branches:
      - agent/increment-52-nested-control-flow-clean
    paths:
      - .github/workflows/increment-52-case-guard-closure.yml

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  close-and-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: "95"
    steps:
      - name: Check out current Increment 52 branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-52-nested-control-flow-clean
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repair exact duplicate capture case guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala")
          text = path.read_text(encoding="utf-8")
          needle = "SPINAL-PARAMETERIZED-VERILOG-STRUCTURAL-CAPTURE-OVERLAP"
          pos = text.find(needle)
          if pos < 0:
              raise SystemExit("strict overlap diagnostic is missing")

          context_start = max(0, pos - 4500)
          context_end = min(len(text), pos + 700)
          context = text[context_start:context_end]

          # Idempotence: an already repaired guard contains both range equality
          # checks immediately before the unchanged strict diagnostic.
          equality_present = bool(re.search(
              r"([A-Za-z_]\w*)\.(?:start|from|first|begin)\w*\s*==\s*([A-Za-z_]\w*)\.(?:start|from|first|begin)\w*.*?"
              r"\1\.(?:end|to|last|until)\w*\s*==\s*\2\.(?:end|to|last|until)\w*",
              context,
              re.S,
          )) or "exactSharedRange" in context

          if not equality_present:
              # Increment 52's overlap validator is a pattern guard over adjacent
              # captured ranges. Preserve the failure for every unequal/partial
              # overlap, but allow one byte-identical native process range to be
              # referenced by nested capture metadata.
              guard_patterns = [
                  r"case\s+(?P<pattern>[^\n]+?)\s+if\s+(?P<cond>[^\n]+?)\s*=>",
                  r"case\s+(?P<pattern>.*?)\s+if\s+(?P<cond>.*?)\s*=>",
              ]
              candidates = []
              for pattern in guard_patterns:
                  candidates.extend(re.finditer(pattern, context, re.S if "(?P<pattern>.*?)" in pattern else 0))
              candidates = [m for m in candidates if m.end() <= context.find(needle)]
              if not candidates:
                  raise SystemExit("could not locate overlap case guard")
              match = candidates[-1]
              pattern_text = match.group("pattern")
              condition = match.group("cond").strip()

              variables = re.findall(r"\b([A-Za-z_]\w*)\b", pattern_text)
              ignored = {"case", "Vector", "Seq", "List", "Some", "None"}
              variables = [v for v in variables if v not in ignored and not v[0].isupper()]
              ordered = []
              for variable in variables:
                  if variable not in ordered:
                      ordered.append(variable)

              detail = text[pos:pos + 1200]
              refs = re.findall(r"\$\{\s*([A-Za-z_]\w*)\.([A-Za-z_]\w*)[^}]*\}", detail)
              ref_vars = []
              fields = {}
              for variable, field in refs:
                  if variable not in ref_vars:
                      ref_vars.append(variable)
                  fields.setdefault(variable, []).append(field)
              pair = ref_vars[:2] if len(ref_vars) >= 2 else ordered[:2]
              if len(pair) < 2:
                  raise SystemExit(f"could not identify adjacent range variables from {pattern_text!r}")
              left, right = pair

              all_fields = []
              for variable in pair:
                  for field in fields.get(variable, []):
                      if field not in all_fields:
                          all_fields.append(field)
              start_fields = [f for f in all_fields if any(k in f.lower() for k in ("start", "from", "first", "begin"))]
              end_fields = [f for f in all_fields if any(k in f.lower() for k in ("end", "until", "last", "to"))]
              if start_fields and end_fields:
                  start_field, end_field = start_fields[0], end_fields[0]
              else:
                  # Current backend ranges use start/end. Verify those members
                  # already occur in the guard/context before using the fallback.
                  if not all(f"{v}.start" in context and f"{v}.end" in context for v in pair):
                      raise SystemExit(f"could not identify range fields from {refs!r}")
                  start_field, end_field = "start", "end"

              exact = (
                  f"{left}.{start_field} == {right}.{start_field} && "
                  f"{left}.{end_field} == {right}.{end_field}"
              )
              new_condition = f"({condition}) && !({exact})"
              absolute_start = context_start + match.start("cond")
              absolute_end = context_start + match.end("cond")
              text = text[:absolute_start] + new_condition + text[absolute_end:]
              path.write_text(text, encoding="utf-8")

          todo = Path("docs/morphhdl/parameterized-verilog-todo.md")
          lines = todo.read_text(encoding="utf-8").splitlines(True)
          matches = [i for i, line in enumerate(lines) if "Increment 52" in line]
          if len(matches) != 1:
              raise SystemExit(f"expected one Increment 52 roadmap line, found {len(matches)}")
          index = matches[0]
          if "[x]" not in lines[index]:
              if "[ ]" not in lines[index]:
                  raise SystemExit("Increment 52 roadmap line has no checkbox")
              lines[index] = lines[index].replace("[ ]", "[x]", 1)
          todo.write_text("".join(lines), encoding="utf-8")
          PY
          git diff --check

      - name: Install pinned Mill
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Prove source boundary and dual-Scala Increment 52 contracts
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl/scripts/check-native-int-nested-control-flow-boundary.sh
          for scala_version in 2.12.18 2.13.12; do
            /tmp/morphhdl-mill "frontend[$scala_version].testOnly" morphhdl.frontend.HdlIntTests
            /tmp/morphhdl-mill "morph[$scala_version].testOnly" \
              morphhdl.NativeIntNestedSymbolicControlFlowTests \
              morphhdl.NativeIntSymbolicConditionalTests \
              morphhdl.NaturalSymbolicConditionalTests \
              morphhdl.ExternalNativeIntShadowExpressionTests \
              morphhdl.ExternalNativeIntShadowProvenanceTests \
              morphhdl.ExternalNativeIntFormalizationTests \
              morphhdl.FormalParameterIdentityTests \
              morphhdl.FormalParameterClonePropagationTests \
              morphhdl.HierarchyParameterBindingTests \
              morphhdl.MorphSingleSourceVerilogTests \
              morphhdl.integration.ExternalSpinalVerilogBaselineTests
          done

      - name: Run complete MorphHDL validation matrix
        shell: bash
        run: |
          set -euo pipefail
          for scala_version in 2.12.18 2.13.12; do
            /tmp/morphhdl-mill "idslplugin[$scala_version].test"
            /tmp/morphhdl-mill "paramrtl[$scala_version].test"
            /tmp/morphhdl-mill "frontend[$scala_version].test"
            /tmp/morphhdl-mill "verilogBackend[$scala_version].test"
            /tmp/morphhdl-mill "morph[$scala_version].test"
            /tmp/morphhdl-mill "core[$scala_version].testOnly" spinal.core.internals.SpinalVerilogPhasePlanTests
          done

      - name: Commit only the verified production closure
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f -name 'increment-52-*.yml' -delete
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala \
                  docs/morphhdl/parameterized-verilog-todo.md
          git add -u .github/workflows
          git commit -m "Complete Increment 52 nested symbolic control flow"
          git push origin HEAD:agent/increment-52-nested-control-flow-clean
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Mark ready and wait for protected squash merge
        shell: bash
        run: |
          set -euo pipefail
          owner="${REPOSITORY%%/*}"
          repo="${REPOSITORY#*/}"

          query=$(cat <<JSON
          {"query":"query { repository(owner: \"$owner\", name: \"$repo\") { pullRequest(number: $PR_NUMBER) { id isDraft merged } } }"}
          JSON
          )
          pr_json=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.github.com/graphql \
            --data-binary "$query")
          pr_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["repository"]["pullRequest"]["id"])' <<<"$pr_json")
          is_draft=$(python3 -c 'import json,sys; print(str(json.load(sys.stdin)["data"]["repository"]["pullRequest"]["isDraft"]).lower())' <<<"$pr_json")
          if [ "$is_draft" = "true" ]; then
            mutation=$(cat <<JSON
          {"query":"mutation { markPullRequestReadyForReview(input: {pullRequestId: \"$pr_id\"}) { pullRequest { isDraft } } }"}
          JSON
            )
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              https://api.github.com/graphql \
              --data-binary "$mutation" >/tmp/increment52-ready.json
          fi

          for attempt in $(seq 1 240); do
            current=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER")
            if python3 -c 'import json,sys; raise SystemExit(0 if json.load(sys.stdin).get("merged") else 1)' <<<"$current"; then
              exit 0
            fi

            code=$(curl --silent --show-error -o /tmp/increment52-merge.json -w '%{http_code}' \
              -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
              -d "{\"commit_title\":\"Complete Increment 52 nested symbolic control flow (#95)\",\"merge_method\":\"squash\",\"sha\":\"$FINAL_SHA\"}")
            if [ "$code" = "200" ] && python3 -c 'import json,sys; raise SystemExit(0 if json.load(sys.stdin).get("merged") else 1)' </tmp/increment52-merge.json; then
              exit 0
            fi
            sleep 30
          done

          echo "Timed out waiting for GitHub to permit the protected squash merge" >&2
          cat /tmp/increment52-merge.json >&2 || true
          exit 1

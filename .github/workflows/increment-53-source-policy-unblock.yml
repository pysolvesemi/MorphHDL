name: Increment 53 source policy unblock

on:
  push:
    branches:
      - agent/increment-53-native-streamfifo-clean

permissions:
  contents: write

concurrency:
  group: increment-53-source-policy-unblock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: "${{ !contains(github.event.head_commit.message, '[inc53-source-policy]') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53-native-streamfifo-clean
          fetch-depth: 0

      - name: Remove obsolete unconditional collision-policy guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogMemories.scala"
          )
          lines = path.read_text().splitlines(keepends=True)
          matches = [
              index
              for index, line in enumerate(lines)
              if line.strip() == "if (read.readUnderWrite ne readFirst) {"
          ]
          if len(matches) == 0:
              raise SystemExit(0)
          if len(matches) != 1:
              raise SystemExit(
                  f"expected one obsolete collision-policy guard, found {len(matches)}"
              )

          start = matches[0]
          depth = 0
          end = None
          for index in range(start, len(lines)):
              depth += lines[index].count("{") - lines[index].count("}")
              if depth == 0:
                  end = index
                  break
          if end is None:
              raise SystemExit("obsolete collision-policy guard is unterminated")

          block = "".join(lines[start:end + 1])
          required = (
              "SPINAL-PARAMETERIZED-VERILOG-MEMORY-COLLISION-POLICY-UNSUPPORTED",
              "must select readUnderWrite = readFirst",
          )
          missing = [marker for marker in required if marker not in block]
          if missing:
              raise SystemExit(
                  "refusing to remove an unreviewed guard; missing " + ", ".join(missing)
              )

          del lines[start:end + 1]
          result = "".join(lines)
          if "if (read.readUnderWrite ne readFirst)" in result:
              raise SystemExit("obsolete unconditional collision-policy guard remains")
          path.write_text(result)
          PY
          git diff --check

      - name: Publish source repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Source guard is already removed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogMemories.scala
          git commit -m "fix: admit reviewed independent dontCare memory policy [inc53-source-policy]"
          git push origin HEAD:agent/increment-53-native-streamfifo-clean

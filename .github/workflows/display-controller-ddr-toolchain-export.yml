name: Display Controller DDR toolchain export

on:
  push:
    branches:
      - agent/display-controller-ddr-toolchain-export
    paths:
      - display-controller-toolchain-export.sbt
      - .github/workflows/display-controller-ddr-toolchain-export.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: display-controller-ddr-toolchain-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact export branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify pinned source ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 81abd25518551b8a452ecf038e409331e646f726 HEAD

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Build and export compile/runtime jars
        shell: bash
        run: |
          set -euo pipefail
          sbt -batch exportDisplayControllerToolchain
          test -s toolchain-export/classpath-order.txt
          test -s toolchain-export/idsl-plugin.txt
          test -s toolchain-export/provenance.txt
          grep -F 'morphhdl_commit=81abd25518551b8a452ecf038e409331e646f726' \
            toolchain-export/provenance.txt
          (
            cd toolchain-export
            sha256sum -- *.jar > SHA256SUMS
          )
          sha256sum toolchain-export/classpath-order.txt \
            toolchain-export/idsl-plugin.txt \
            toolchain-export/provenance.txt \
            > toolchain-export/METADATA_SHA256SUMS

      - name: Upload pinned toolchain
        uses: actions/upload-artifact@v4
        with:
          name: morphhdl-display-controller-toolchain-81abd255
          path: toolchain-export
          if-no-files-found: error
          retention-days: 7

name: Diagnostic recovery for Increment 48

on:
  pull_request:
    branches: [parameterized-verilog]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: increment-48-diagnostic-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recover:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/increment-48-natural-symbolic-conditionals'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      SBT_TEST_PARALLEL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-48-natural-symbolic-conditionals
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Install strict Verilog-2001 validator
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Verify branch state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin parameterized-verilog
          test "$(git merge-base HEAD origin/parameterized-verilog)" = "$(git rev-parse origin/parameterized-verilog)"
          if grep -qE '^- \[x\] \*\*Increment 48\b' docs/morphhdl/parameterized-verilog-todo.md; then
            echo 'checked=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'checked=false' >> "${GITHUB_OUTPUT}"
          fi
          if [[ -f .github/increment48/implement.py ]]; then
            python3 -m py_compile .github/increment48/implement.py
            echo 'driver=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'driver=false' >> "${GITHUB_OUTPUT}"
            test -f frontend/src/main/scala/morphhdl/frontend/NaturalSymbolicConditional.scala
            test -f morphhdl/src/test/scala/morphhdl/NaturalSymbolicConditionalTests.scala
          fi

      - name: Generate a compiler-independent bridge and prove it compiles
        if: steps.state.outputs.driver == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/increment48/implement.py --runtime 'throw new IllegalStateException("Increment 48 delegate probe")'

          cat > /tmp/write_increment48_bridge.py <<'PY'
          from pathlib import Path
          import re
          import sys

          runtime = sys.argv[1]
          root = Path.cwd()
          components = list((root / 'idslplugin/src/main/scala').rglob('MorphHdlNaturalSymbolicConditionalComponent.scala'))
          if len(components) != 1:
              raise SystemExit(f'expected one natural conditional component, found {len(components)}')
          component = components[0]
          package_match = re.search(r'(?m)^\s*package\s+([A-Za-z0-9_.]+)\s*$', component.read_text())
          if package_match is None:
              raise SystemExit('component package missing')
          package = package_match.group(1)
          component.write_text(f'''package {package}

          import scala.tools.nsc.Global
          import scala.tools.nsc.Phase
          import scala.tools.nsc.plugins.PluginComponent

          final class MorphHdlNaturalSymbolicConditionalComponent(val global: Global) extends PluginComponent {{
            import global._

            override val phaseName: String = "morphhdl-natural-symbolic-conditionals"
            override val runsAfter: List[String] = List("parser")

            private def eligible(unit: CompilationUnit): Boolean = {{
              val path = Option(unit.source).flatMap(s => Option(s.file)).map(_.path.replace('\\\\', '/')).getOrElse("")
              val content = Option(unit.source).map(_.content.mkString).getOrElse("")
              !path.contains("frontend/src/main/scala/") &&
                (content.contains("HdlInt") || content.contains("HdlBool") || content.contains("morphhdl.frontend"))
            }}

            private def selectTree: Tree = {{
              val root = Ident(TermName("_root_"))
              val morphhdl = Select(root, TermName("morphhdl"))
              val frontend = Select(morphhdl, TermName("frontend"))
              val helper = Select(frontend, TermName("NaturalSymbolicConditional"))
              Select(helper, TermName("select"))
            }}

            private final class NaturalIfTransformer extends Transformer {{
              override def transform(tree: Tree): Tree = tree match {{
                case original @ If(condition, ifTrue, ifFalse) =>
                  val rewritten = Apply(
                    Apply(
                      Apply(selectTree, List(transform(condition))),
                      List(transform(ifTrue))
                    ),
                    List(transform(ifFalse))
                  )
                  rewritten.setPos(original.pos)
                case _ => super.transform(tree)
              }}
            }}

            override def newPhase(previous: Phase): Phase = new StdPhase(previous) {{
              override def apply(unit: CompilationUnit): Unit = {{
                if (eligible(unit)) unit.body = new NaturalIfTransformer().transform(unit.body)
              }}
            }}
          }}
          '''.replace('\n          ', '\n'))

          helper = root / 'frontend/src/main/scala/morphhdl/frontend/NaturalSymbolicConditional.scala'
          helper.write_text(f'''package morphhdl.frontend

          import scala.language.experimental.macros
          import scala.reflect.macros.blackbox

          object NaturalSymbolicConditional {{
            def select[C, T](condition: C)(ifTrue: => T)(ifFalse: => T): T =
              macro NaturalSymbolicConditionalMacro.selectImpl[C, T]

            def runtime[T](condition: HdlBool)(ifTrue: => T)(ifFalse: => T): T =
              {runtime}
          }}

          object NaturalSymbolicConditionalMacro {{
            def selectImpl[C: c.WeakTypeTag, T: c.WeakTypeTag](
                c: blackbox.Context
            )(
                condition: c.Expr[C]
            )(
                ifTrue: c.Expr[T]
            )(
                ifFalse: c.Expr[T]
            ): c.Expr[T] = {{
              import c.universe._

              val conditionType = weakTypeOf[C].dealias
              if (conditionType <:< typeOf[Boolean]) {{
                c.Expr[T](q"if (${{condition.tree}}) ${{ifTrue.tree}} else ${{ifFalse.tree}}")
              }} else if (conditionType <:< typeOf[HdlBool]) {{
                object UnsafeAlternativeEffect extends Traverser {{
                  var finding: Option[(Position, String)] = None
                  override def traverse(tree: Tree): Unit = if (finding.isEmpty) tree match {{
                    case Return(_) => finding = Some(tree.pos -> "return")
                    case Throw(_)  => finding = Some(tree.pos -> "throw")
                    case _         => super.traverse(tree)
                  }}
                }}
                UnsafeAlternativeEffect.traverse(ifTrue.tree)
                UnsafeAlternativeEffect.traverse(ifFalse.tree)
                UnsafeAlternativeEffect.finding.foreach {{ case (position, effect) =>
                  c.abort(
                    position,
                    s"MORPHDL-SYMBOLIC-CONDITIONAL-UNSAFE-EFFECT: '$effect' is not supported inside an explicit symbolic alternative"
                  )
                }}
                c.Expr[T](
                  q"_root_.morphhdl.frontend.NaturalSymbolicConditional.runtime[${{weakTypeOf[T]}}](${{condition.tree}})(${{ifTrue.tree}})(${{ifFalse.tree}})"
                )
              }} else {{
                c.abort(
                  condition.tree.pos,
                  s"MORPHDL-SYMBOLIC-CONDITIONAL-TYPE: expected ordinary Boolean or explicit morphhdl.frontend.HdlBool, found $conditionType"
                )
              }}
            }}
          }}
          '''.replace('\n          ', '\n'))

          test = root / 'morphhdl/src/test/scala/morphhdl/NaturalSymbolicConditionalTests.scala'
          text = test.read_text().replace(
              'assert(verilog.sliding(3).count(_ == "if ") >= 2)',
              'assert("(?m)^\\\\s*if\\\\s*\\\\(".r.findAllMatchIn(verilog).size >= 2)'
          )
          test.write_text(text)
          PY

          python3 /tmp/write_increment48_bridge.py 'throw new IllegalStateException("Increment 48 delegate probe")'
          sbt --batch --no-server \
            '++2.12.18' \
            'idslplugin/clean' \
            'frontend/clean' \
            'idslplugin/compile' \
            'frontend/compile' | tee /tmp/increment48-bridge-compile.log

      - name: Select a behaviorally valid structural delegate
        if: steps.state.outputs.driver == 'true'
        shell: bash
        run: |
          set -euo pipefail
          candidates=()
          structure=frontend/src/main/scala/spinal/core/ParameterizedStructure.scala
          if [[ -f "${structure}" ]]; then
            while IFS= read -r method; do
              candidates+=(
                "spinal.core.ParameterizedStructure.${method}(condition)(ifTrue)(ifFalse)"
                "spinal.core.ParameterizedStructure.${method}(condition, ifTrue, ifFalse)"
                "{ spinal.core.ParameterizedStructure.${method}(condition)({ ifTrue; () })({ ifFalse; () }); ().asInstanceOf[T] }"
              )
            done < <(
              sed -nE 's/^[[:space:]]*def[[:space:]]+([A-Za-z_][A-Za-z0-9_]*)\>.*/\1/p' "${structure}" |
                grep -Ei 'if|when|else|cond|select|branch|generate|capture' | sort -u
            )
          fi
          candidates+=(
            'spinal.core.ParameterizedStructure.ifThenElse(condition)(ifTrue)(ifFalse)'
            'spinal.core.ParameterizedStructure.ifElse(condition)(ifTrue)(ifFalse)'
            'spinal.core.ParameterizedStructure.conditional(condition)(ifTrue)(ifFalse)'
            'spinal.core.ParameterizedStructure.select(condition)(ifTrue)(ifFalse)'
            'spinal.core.ParameterizedStructure.when(condition)(ifTrue).otherwise(ifFalse)'
            'spinal.core.ParameterizedStructure.when(condition) { ifTrue }.otherwise { ifFalse }'
            'condition.ifThenElse(ifTrue)(ifFalse)'
            'condition.ifElse(ifTrue)(ifFalse)'
            'condition.select(ifTrue, ifFalse)'
          )

          declare -A seen=()
          selected=''
          candidate_mismatch='value .* is not a member|not found: value|overloaded method value|too many arguments|not enough arguments|type mismatch|does not take parameters|missing argument list'
          attempt=0
          for candidate in "${candidates[@]}"; do
            [[ -n "${seen[${candidate}]:-}" ]] && continue
            seen["${candidate}"]=1
            attempt=$((attempt + 1))
            if ((attempt > 24)); then
              break
            fi
            echo "Trying delegate ${attempt}: ${candidate}"
            python3 /tmp/write_increment48_bridge.py "${candidate}"
            log="/tmp/increment48-delegate-${attempt}.log"
            if sbt --batch --no-server \
                '++2.12.18' \
                'morph/testOnly morphhdl.NaturalSymbolicConditionalTests' > "${log}" 2>&1; then
              selected="${candidate}"
              cat "${log}"
              break
            fi
            cat "${log}"
            if ! grep -Eiq "${candidate_mismatch}|NaturalSymbolicConditionalTests|assertion failed|FAIL|error" "${log}"; then
              echo 'Candidate-independent failure detected; stopping delegate search.' >&2
              exit 1
            fi
          done
          if [[ -z "${selected}" ]]; then
            echo 'No behaviorally valid existing structural delegate found.' >&2
            grep -RInE 'ParameterizedStructure|def (if|when|select|conditional|branch|capture|generate)|HdlBool' \
              frontend/src/main/scala morphhdl/src/test/scala frontend/src/test/scala 2>/dev/null | head -n 1000 || true
            exit 1
          fi
          printf '%s\n' "${selected}" > /tmp/increment48-selected-delegate.txt

      - name: Validate cleanly on Scala 2.12.18 and 2.13.12
        shell: bash
        run: |
          set -euo pipefail
          for scala_version in 2.12.18 2.13.12; do
            sbt --batch --no-server \
              "++${scala_version}" \
              'idslplugin/clean' \
              'frontend/clean' \
              'morph/clean' \
              'morph/testOnly morphhdl.NaturalSymbolicConditionalTests'
          done

      - name: Validate negative diagnostics on both Scala versions
        shell: bash
        run: |
          set -euo pipefail
          implicit_bad=/tmp/Increment48ImplicitWitness.scala
          return_bad=/tmp/Increment48UnsafeReturn.scala
          cat > "${implicit_bad}" <<'SCALA'
          package morphhdl.increment48negative
          import morphhdl.frontend.HdlInt
          object Increment48ImplicitWitness {
            val width = HdlInt.param("WIDTH", default = 8, min = 1, max = 32)
            val forbidden: Boolean = width > 8
          }
          SCALA
          cat > "${return_bad}" <<'SCALA'
          package morphhdl.increment48negative
          import morphhdl.frontend.HdlInt
          object Increment48UnsafeReturn {
            def forbidden(width: HdlInt): Int = {
              if (width > 8) return 1 else 0
            }
          }
          SCALA
          sed -i 's/^          //' "${implicit_bad}" "${return_bad}"
          for scala_version in 2.12.18 2.13.12; do
            implicit_log="/tmp/increment48-implicit-${scala_version}.log"
            if sbt --batch --no-server \
                "++${scala_version}" \
                "set morph / Compile / unmanagedSources += file(\"${implicit_bad}\")" \
                'morph / Compile / compile' > "${implicit_log}" 2>&1; then
              cat "${implicit_log}"
              exit 1
            fi
            cat "${implicit_log}"
            grep -E 'type mismatch|Found:.*HdlBool|found.*HdlBool|required.*Boolean' "${implicit_log}"

            return_log="/tmp/increment48-return-${scala_version}.log"
            if sbt --batch --no-server \
                "++${scala_version}" \
                "set morph / Compile / unmanagedSources += file(\"${return_bad}\")" \
                'morph / Compile / compile' > "${return_log}" 2>&1; then
              cat "${return_log}"
              exit 1
            fi
            cat "${return_log}"
            grep 'MORPHDL-SYMBOLIC-CONDITIONAL-UNSAFE-EFFECT' "${return_log}"
          done

      - name: Validate inherited regressions and source ownership
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only origin/parameterized-verilog...HEAD -- core/src/main/scala lib/src/main/scala | wc -l)" -eq 0
          for scala_version in 2.12.18 2.13.12; do
            sbt --batch --no-server \
              "++${scala_version}" \
              'morph/testOnly morphhdl.StructuralGenerateControlTests morphhdl.GenericProcessLoweringTests morphhdl.MorphSingleSourceVerilogTests morphhdl.NativeLibraryReuseTests morphhdl.NativeSymbolicMemoryTests morphhdl.ParameterizedStreamFifoDepthTests'
          done
          test "$(git diff --name-only -- core/src/main/scala lib/src/main/scala | wc -l)" -eq 0
          ! grep -RInE 'implicit[[:space:]]+(def|val|object).*HdlBool.*Boolean|implicit[[:space:]]+conversion.*HdlBool' \
            frontend/src/main/scala idslplugin/src/main/scala
          git diff --check

      - name: Remove all temporary Increment 48 machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/increment48/implement.py \
            .github/workflows/morphhdl-increment-48-diagnostic-recovery.yml \
            .github/workflows/morphhdl-increment-48-recovery.yml \
            .github/workflows/morphhdl-increment-48-implementation.yml \
            .github/workflows/morphhdl-increment-48-complete.yml \
            .github/workflows/morphhdl-increment-48-offline-export.yml \
            .github/workflows/morphhdl-increment-48-merge-guard.yml \
            tmp-tool-probe.txt tmp-tool-probe-2.txt tmp-increment48-completion-trigger.txt
          rmdir .github/increment48 2>/dev/null || true

      - name: Publish implementation and final roadmap commits
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "${path}" in
              .github/workflows/morphhdl-natural-symbolic-conditionals.yml|\
              .github/workflows/morphhdl-increment-48-diagnostic-recovery.yml|\
              .github/workflows/morphhdl-increment-48-recovery.yml|\
              .github/workflows/morphhdl-increment-48-implementation.yml|\
              .github/workflows/morphhdl-increment-48-complete.yml|\
              .github/workflows/morphhdl-increment-48-offline-export.yml|\
              .github/workflows/morphhdl-increment-48-merge-guard.yml|\
              .github/increment48/implement.py|\
              tmp-tool-probe.txt|tmp-tool-probe-2.txt|tmp-increment48-completion-trigger.txt|\
              docs/morphhdl/increment-48-natural-symbolic-conditionals.md|\
              frontend/src/main/scala/morphhdl/frontend/NaturalSymbolicConditional.scala|\
              morphhdl/scripts/check-natural-symbolic-conditional-boundary.sh|\
              morphhdl/src/test/scala/morphhdl/NaturalSymbolicConditionalTests.scala|\
              idslplugin/src/main/scala/*)
                ;;
              docs/morphhdl/parameterized-verilog-todo.md)
                test '${{ steps.state.outputs.checked }}' = 'true'
                ;;
              *)
                echo "Unexpected Increment 48 path: ${path}" >&2
                exit 1
                ;;
            esac
          done
          git diff --check
          for path in "${changed[@]}"; do git add -- "${path}"; done
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement Increment 48 natural symbolic conditionals'
          git push origin HEAD:agent/increment-48-natural-symbolic-conditionals

          if [[ '${{ steps.state.outputs.checked }}' != 'true' ]]; then
            python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path('docs/morphhdl/parameterized-verilog-todo.md')
          text = path.read_text()
          updated, count = re.subn(r'(?m)^- \[ \] (\*\*Increment 48\b)', r'- [x] \1', text, count=1)
          if count != 1:
              raise SystemExit('Increment 48 unchecked roadmap entry not found')
          path.write_text(updated)
          PY
            test "$(git diff --name-only | paste -sd ' ' -)" = 'docs/morphhdl/parameterized-verilog-todo.md'
            git add -- docs/morphhdl/parameterized-verilog-todo.md
            git diff --cached --check
            git commit -m 'Complete Increment 48 roadmap'
            git push origin HEAD:agent/increment-48-natural-symbolic-conditionals
          fi

      - name: Verify clean head and squash merge
        shell: bash
        run: |
          set -euo pipefail
          repo='${{ github.repository }}'
          pr='${{ github.event.pull_request.number }}'
          git fetch origin parameterized-verilog agent/increment-48-natural-symbolic-conditionals
          git reset --hard origin/agent/increment-48-natural-symbolic-conditionals
          grep -qE '^- \[x\] \*\*Increment 48\b' docs/morphhdl/parameterized-verilog-todo.md
          test ! -e .github/increment48/implement.py
          test ! -e .github/workflows/morphhdl-increment-48-diagnostic-recovery.yml
          test ! -e .github/workflows/morphhdl-increment-48-recovery.yml
          test ! -e .github/workflows/morphhdl-increment-48-implementation.yml
          test ! -e .github/workflows/morphhdl-increment-48-complete.yml
          test ! -e .github/workflows/morphhdl-increment-48-offline-export.yml
          test ! -e .github/workflows/morphhdl-increment-48-merge-guard.yml
          test "$(git diff --name-only origin/parameterized-verilog...HEAD -- core/src/main/scala lib/src/main/scala | wc -l)" -eq 0
          git diff --check origin/parameterized-verilog...HEAD
          head_sha=$(git rev-parse HEAD)
          test "${head_sha}" = "$(gh api "repos/${repo}/pulls/${pr}" --jq .head.sha)"
          gh pr ready "${pr}" --repo "${repo}" || true
          gh api --method PUT "repos/${repo}/pulls/${pr}/merge" \
            -f sha="${head_sha}" -f merge_method='squash' \
            -f commit_title='Increment 48: natural symbolic conditionals' \
            -f commit_message='Typed natural symbolic branch capture with dual-Scala, strict Verilog-2001, regression, preservation and diagnostic validation.'
          test "$(gh api "repos/${repo}/pulls/${pr}" --jq .merged)" = 'true'

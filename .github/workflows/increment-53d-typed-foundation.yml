name: Validate Increment 53d typed carrier foundation

on:
  push:
    branches:
      - agent/increment-53d-typed-elabint-pivot
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-53d-typed-foundation
  cancel-in-progress: true

jobs:
  sbt:
    name: SBT typed foundation Scala ${{ matrix.scala_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version: ["2.12.18", "2.13.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-typed-elabint-pivot
          fetch-depth: 0
          submodules: recursive
      - name: Compile typed carrier and compiler bridge
        shell: bash
        run: |
          set -euo pipefail
          sbt -batch "++${{ matrix.scala_version }}" \
            morphruntime/compile morphplugin/compile frontend/compile

  mill:
    name: Mill typed foundation Scala ${{ matrix.scala_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version: ["2.12.18", "2.13.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-typed-elabint-pivot
          fetch-depth: 0
      - name: Install pinned Mill
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/mill
          chmod +x /tmp/mill
      - name: Compile typed carrier and compiler bridge
        shell: bash
        run: |
          set -euo pipefail
          /tmp/mill morphruntime[${{ matrix.scala_version }}].compile
          /tmp/mill morphplugin[${{ matrix.scala_version }}].compile
          /tmp/mill frontend[${{ matrix.scala_version }}].compile

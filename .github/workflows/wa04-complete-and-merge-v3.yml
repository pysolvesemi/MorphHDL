name: WA-04 guarded completion and merge v3

on:
  push:
    branches:
      - agent/wa-04-unnamed-simple-wire-elimination
    paths:
      - ".github/workflows/wa04-complete-and-merge-v3.yml"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: wa04-guarded-completion-v3
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out WA-04 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require green implementation, prove exact closure, and merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: "138"
          REQUIRED_WORKFLOW: "morphhdl-passes.yml"
          IMPLEMENTATION_HEAD: "9242364396d7e6ce85506d4fb8316e2df98e1c76"
        shell: bash
        run: |
          set -euo pipefail

          latest_required_run() {
            local sha="$1"
            gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/workflows/${REQUIRED_WORKFLOW}/runs?head_sha=${sha}&per_page=20" |
              python3 -c '
import json, sys
runs = sorted(json.load(sys.stdin).get("workflow_runs", []), key=lambda item: item.get("created_at", ""), reverse=True)
if runs:
    run = runs[0]
    print("\t".join([str(run.get("id", "")), str(run.get("status", "")), str(run.get("conclusion") or "")]))
'
          }

          poll_required_workflow() {
            local sha="$1"
            local label="$2"
            local attempts=0
            local max_attempts=540
            while (( attempts < max_attempts )); do
              attempts=$((attempts + 1))
              local record run_id status conclusion
              record="$(latest_required_run "${sha}")"
              if [[ -z "${record}" ]]; then
                echo "${label}: waiting for ${REQUIRED_WORKFLOW} run on ${sha}" >&2
                sleep 10
                continue
              fi
              IFS=$'\t' read -r run_id status conclusion <<<"${record}"
              echo "${label}: run=${run_id} status=${status} conclusion=${conclusion:-pending}" >&2
              if [[ "${status}" == "completed" ]]; then
                if [[ "${conclusion}" != "success" ]]; then
                  echo "${label}: required workflow failed with conclusion ${conclusion}" >&2
                  exit 1
                fi
                printf '%s\n' "${run_id}"
                return 0
              fi
              sleep 10
            done
            echo "${label}: timed out waiting for ${REQUIRED_WORKFLOW} on ${sha}" >&2
            exit 1
          }

          current_head="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "${IMPLEMENTATION_HEAD}" "${current_head}"
          unexpected="$(git diff --name-only "${IMPLEMENTATION_HEAD}".."${current_head}" | grep -Ev '^\.github/workflows/wa04-complete-and-merge(-v[23])?\.yml$' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Unexpected changes after the approved implementation head:" >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi

          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/wa04-pr.json
          python3 - "${current_head}" /tmp/wa04-pr.json <<'PY'
          import json, sys
          current = sys.argv[1]
          with open(sys.argv[2], encoding="utf-8") as handle:
              pr = json.load(handle)
          if pr.get("state") != "open" or pr.get("merged"):
              raise SystemExit("WA-04 pull request is not open and unmerged")
          if pr.get("head", {}).get("sha") != current:
              raise SystemExit("WA-04 branch moved after closure gate checkout")
          if pr.get("base", {}).get("ref") != "parameterized-verilog":
              raise SystemExit("WA-04 pull request no longer targets parameterized-verilog")
          PY

          implementation_run="$(poll_required_workflow "${IMPLEMENTATION_HEAD}" "implementation head")"
          echo "Implementation workflow ${implementation_run} succeeded."

          python3 - <<'PY'
          from pathlib import Path
          import re

          roadmap = Path("morphhdl-passes/morphhdl-ir-wire-assignment-passes-todo.md")
          text = roadmap.read_text(encoding="utf-8")
          entry = re.compile(
              r"^- \[(?P<checked>[ xX])\] \*\*(?P<id>WA-[0-9]+)\s+—(?P<body>[\s\S]*?)(?=^- \[[ xX]\] \*\*WA-[0-9]+\s+—|\Z)",
              re.MULTILINE,
          )
          matches = {match.group("id"): match for match in entry.finditer(text)}
          if "WA-04" not in matches or "WA-05" not in matches:
              raise SystemExit("WA-04 or WA-05 roadmap entry is missing")
          wa04 = matches["WA-04"]
          wa05 = matches["WA-05"]
          if wa04.group("checked").lower() == "x":
              if "**Status:** `COMPLETED`." not in wa04.group(0) or "**Status:** `READY`." not in wa05.group(0):
                  raise SystemExit("Existing WA-04 closure state is inconsistent")
          else:
              if "**Status:** `READY`." not in wa04.group(0):
                  raise SystemExit("WA-04 is not READY before guarded closure")
              if "**Status:** `BLOCKED` by WA-04." not in wa05.group(0):
                  raise SystemExit("WA-05 is not BLOCKED by WA-04 before guarded closure")
              wa04_new = wa04.group(0).replace("- [ ] **WA-04 —", "- [x] **WA-04 —", 1).replace("**Status:** `READY`.", "**Status:** `COMPLETED`.", 1)
              wa05_new = wa05.group(0).replace("**Status:** `BLOCKED` by WA-04.", "**Status:** `READY`.", 1)
              text = text[:wa04.start()] + wa04_new + text[wa04.end():wa05.start()] + wa05_new + text[wa05.end():]
              if text.count("- [x] **WA-04 —") != 1:
                  raise SystemExit("WA-04 closure checkbox update is not unique")
              roadmap.write_text(text, encoding="utf-8")
          PY

          rm -f morphhdl-passes/wa04-final-head-trigger.txt
          rm -f .github/workflows/wa04-complete-and-merge.yml
          rm -f .github/workflows/wa04-complete-and-merge-v2.yml
          rm -f .github/workflows/wa04-complete-and-merge-v3.yml

          python3 morphhdl-passes/scripts/check-wa03-gates.py --self-test
          python3 morphhdl-passes/scripts/check-wa03-gates.py
          python3 morphhdl-passes/scripts/check-wa04-pass.py --self-test
          python3 morphhdl-passes/scripts/check-wa04-pass.py
          python3 morphhdl-passes/scripts/validate_wire_assignment_equivalence.py --self-test
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "WA-04: mark unnamed alias elimination complete"
          closure_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          gh workflow run "${REQUIRED_WORKFLOW}" --ref "${GITHUB_REF_NAME}"
          closure_run="$(poll_required_workflow "${closure_sha}" "closure head")"
          echo "Closure workflow ${closure_run} succeeded."

          gh api --method PUT -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" -f merge_method=merge -f sha="${closure_sha}" -f commit_title='Merge WA-04 unnamed simple-wire assignment elimination' > /tmp/wa04-merge.json
          python3 - "${IMPLEMENTATION_HEAD}" "${closure_sha}" "${implementation_run}" "${closure_run}" /tmp/wa04-merge.json <<'PY'
          import json, sys
          implementation, closure, implementation_run, closure_run, path = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              result = json.load(handle)
          if result.get("merged") is not True:
              raise SystemExit("WA-04 merge API did not report success: " + str(result))
          print("WA04_COMPLETED")
          print("implementation_sha=" + implementation)
          print("closure_sha=" + closure)
          print("implementation_run=" + implementation_run)
          print("closure_run=" + closure_run)
          print("merge_sha=" + str(result.get("sha", "")))
          PY

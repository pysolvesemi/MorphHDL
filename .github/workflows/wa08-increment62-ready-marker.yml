name: WA-08 Increment 62 readiness marker

on:
  push:
    branches:
      - agent/wa-08-production-handoff

permissions:
  contents: write

concurrency:
  group: wa08-increment62-readiness-marker
  cancel-in-progress: false

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out WA-08 branch
        uses: actions/checkout@v4
        with:
          ref: agent/wa-08-production-handoff
          fetch-depth: 0
          submodules: recursive

      - name: Build an exact committed readiness candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f morphhdl/scripts/check-increment-62-wa08-source-overlay.py
          test -f morphhdl/contracts/increment-62-wa08-source-overlay.json
          test -f .github/workflows/increment-62-wa08-source-overlay.yml
          rm -f \
            .github/workflows/wa08-increment62-ready-marker.yml \
            .github/workflows/wa08-increment62-supervisor-v2.yml \
            .github/workflows/wa08-increment62-repair.yml \
            .github/workflows/wa08-focused-repair.yml \
            .github/workflows/wa08-materialize.yml
          rm -rf .wa08-materialization
          cat > docs/morphhdl/wa08-increment62-ready.md <<'EOF'
          WA-08 Increment 62 source-overlay qualification prepared.
          EOF
          sed -i 's/^          //' docs/morphhdl/wa08-increment62-ready.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Stage WA-08 Increment 62 qualification marker"

      - name: Run exact Increment 62 and inherited source gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            morphhdl/scripts/check-increment-62-wa08-source-overlay.py \
            morphhdl/scripts/test-increment-62-wa08-source-overlay.py \
            morphhdl/scripts/check-wa07b-inherited-review.py \
            morphhdl/scripts/check-increment-60g-source-scope.py
          python3 morphhdl/scripts/check-increment-62-wa08-source-overlay.py
          python3 morphhdl/scripts/check-increment-62-wa08-source-overlay.py --self-test
          python3 morphhdl/scripts/test-increment-62-wa08-source-overlay.py
          python3 morphhdl/scripts/test-wa07b-inherited-review.py
          python3 morphhdl/scripts/check-wa07b-inherited-review.py
          python3 morphhdl/scripts/check-increment-60f-equivalence-closure.py --source-only
          python3 morphhdl/scripts/check-increment-59c-source-review.py
          python3 morphhdl/scripts/check-increment-59g-source-review.py
          python3 morphhdl/scripts/check-increment-60g-source-scope.py
          test -z "$(git status --porcelain)"

      - name: Push only the qualified readiness candidate
        shell: bash
        run: git push origin HEAD:agent/wa-08-production-handoff

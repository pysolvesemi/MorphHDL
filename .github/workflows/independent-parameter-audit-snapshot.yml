name: Independent parameter audit source snapshots
on:
  push:
    branches: [agent/independent-parameter-domain-composition]
    paths: ['.github/workflows/independent-parameter-audit-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve immutable audit source objects, without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-snapshots
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          refs = {subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()}
          for directory in ('morphhdl/scripts', 'morphhdl/contracts', 'morphhdl-passes/scripts', 'morphhdl-passes/contracts'):
              for path in Path(directory).rglob('*'):
                  if path.is_file() and path.suffix in ('.py', '.json'):
                      refs.update(re.findall(r'(?<![0-9a-f])[0-9a-f]{40}(?![0-9a-f])', path.read_text()))
          commits = []
          objects = set(subprocess.check_output(['git', 'rev-list', 'HEAD'], text=True).splitlines())
          for ref in sorted(refs):
              kind = subprocess.run(['git', 'cat-file', '-t', ref], capture_output=True, text=True)
              if kind.returncode or kind.stdout.strip() != 'commit':
                  continue
              commits.append(ref)
              objects.update(subprocess.check_output(['git', 'rev-parse', ref, ref + '^{tree}'], text=True).splitlines())
              for row in subprocess.check_output(['git', 'ls-tree', '-r', '-t', ref], text=True).splitlines():
                  metadata = row.split('\t', 1)[0].split()
                  if metadata[1] != 'commit':
                      objects.add(metadata[2])
          Path('audit-snapshots/commits.txt').write_text('\n'.join(commits) + '\n')
          with open('audit-snapshots/source.pack', 'wb') as output:
              subprocess.run(['git', 'pack-objects', '--stdout'], input=('\n'.join(sorted(objects)) + '\n').encode(), stdout=output, check=True)
          print('SOURCE_SNAPSHOTS commits=' + str(len(commits)))
          PY
          sha256sum audit-snapshots/source.pack > audit-snapshots/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: independent-domain-audit-snapshots-${{ github.sha }}
          path: audit-snapshots/
          if-no-files-found: error

name: Diagnose Increment 53d generic source guard

on:
  push:
    branches:
      - agent/increment-53d-generic-native-definition-boundary
    paths:
      - .github/workflows/increment-53d-generic-boundary-publisher-v10.yml
      - morphhdl/scripts/apply-increment-53d-generic-boundary-v11.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-source-boundary:
    name: Trace generic source boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/spinalhdl/docker:latest
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-generic-native-definition-boundary
          fetch-depth: 0

      - name: Apply pattern-binder-safe generic implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/apply-increment-53d-generic-boundary-v11.py
          git diff --check
          git diff --stat

      - name: Trace permanent generic source guard
        shell: bash
        run: |
          set -euo pipefail
          bash -x morphhdl/scripts/check-native-stream-width-adapter-boundary.sh

      - name: Prove upstream-owned sources remain untouched
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet HEAD -- core lib idslplugin; then
            git diff -- core lib idslplugin
            exit 1
          fi

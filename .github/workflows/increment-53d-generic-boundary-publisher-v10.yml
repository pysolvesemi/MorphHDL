name: Diagnose Increment 53d generic all-Spinal compilation

on:
  push:
    branches:
      - agent/increment-53d-generic-native-definition-boundary
    paths:
      - .github/workflows/increment-53d-generic-boundary-publisher-v10.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-generic-native-definition-boundary
          fetch-depth: 0

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Apply pattern-binder-safe generic source-tree prototype
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/apply-increment-53d-generic-boundary-v11.py
          git diff --check
          git diff --stat

      - name: Compile compiler plugin
        shell: bash
        run: /tmp/morphhdl-mill morphplugin[2.13.12].compile

      - name: Capture complete SpinalHDL compilation
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set +e
          /tmp/morphhdl-mill morph[2.13.12].test.compile > /tmp/increment-53d-compile.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/increment-53d-compile.status
          printf '%s\n' '--- filtered compiler diagnostics ---'
          grep -E -n -C 4 '(error:|Error:|Exception|not found:|type mismatch|ambiguous|unbound|assertion failed)' \
            /tmp/increment-53d-compile.log | tail -n 500 || true
          printf '%s\n' '--- final compiler output ---'
          tail -n 500 /tmp/increment-53d-compile.log
          exit "$status"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53d-generic-compile-diagnostic-v11
          path: |
            /tmp/increment-53d-compile.log
            /tmp/increment-53d-compile.status
          if-no-files-found: error
          retention-days: 2

      - name: Preserve diagnostic conclusion
        if: always()
        shell: bash
        run: |
          status="$(cat /tmp/increment-53d-compile.status 2>/dev/null || printf '1')"
          exit "$status"

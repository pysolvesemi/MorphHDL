name: Publish validated Increment 53d generic all-Spinal boundary

on:
  push:
    branches:
      - agent/increment-53d-generic-native-definition-boundary
    paths:
      - .github/workflows/increment-53d-generic-boundary-publisher-v10.yml
      - morphhdl/scripts/apply-increment-53d-generic-boundary-v11.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-53d-generic-all-spinal-publisher
  cancel-in-progress: true

jobs:
  source-boundary:
    name: Generic source and native-library boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/spinalhdl/docker:latest
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-generic-native-definition-boundary
          fetch-depth: 0

      - name: Apply generic definition-boundary implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/apply-increment-53d-generic-boundary-v11.py
          git diff --check
          bash morphhdl/scripts/check-native-stream-width-adapter-boundary.sh
          git diff --quiet HEAD -- core lib idslplugin

  contracts:
    name: Complete MorphHDL suite Scala ${{ matrix.scala_version }}
    needs: source-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    strategy:
      fail-fast: false
      matrix:
        scala_version:
          - "2.12.18"
          - "2.13.12"
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-generic-native-definition-boundary
          fetch-depth: 0

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Apply generic definition-boundary implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/apply-increment-53d-generic-boundary-v11.py
          git diff --check

      - name: Run complete MorphHDL test suite
        shell: bash
        run: /tmp/morphhdl-mill morph[${{ matrix.scala_version }}].test

  publish:
    name: Publish validated generic implementation
    needs:
      - source-boundary
      - contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/spinalhdl/docker:latest
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-generic-native-definition-boundary
          fetch-depth: 0

      - name: Apply final implementation and verify boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/apply-increment-53d-generic-boundary-v11.py
          git diff --check
          bash morphhdl/scripts/check-native-stream-width-adapter-boundary.sh
          git diff --quiet HEAD -- core lib idslplugin

      - name: Commit only validated production, regression, guard, and documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MorphHDL Agent"
          git config user.email "morphhdl-agent@users.noreply.github.com"
          git add \
            docs/morphhdl/increment-53d-native-streamwidth-adapter.md \
            morphhdl/scripts/check-native-stream-width-adapter-boundary.sh \
            morphhdl/src/test/scala/morphhdl/GenericNativeDefinitionBoundaryTests.scala \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            docs/morphhdl/increment-53d-native-streamwidth-adapter.md \
            morphhdl/scripts/check-native-stream-width-adapter-boundary.sh \
            morphhdl/src/test/scala/morphhdl/GenericNativeDefinitionBoundaryTests.scala \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala | sort)"
          test "$actual" = "$expected"
          git commit -m "Complete Increment 53d with generic SpinalHDL boundaries"
          git push origin HEAD:agent/increment-53d-generic-native-definition-boundary

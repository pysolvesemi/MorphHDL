name: Increment 53 focused repair

on:
  push:
    branches:
      - agent/increment-53-native-streamfifo-clean

permissions:
  contents: write

jobs:
  repair:
    if: "${{ !contains(github.event.head_commit.message, '[inc53-overlap-fix]') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53-native-streamfifo-clean
          fetch-depth: 0
      - name: Mark only sibling structural alternatives as mutually exclusive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("morphruntime/src/main/scala/spinal/core/ParameterizedStructure.scala")
          text = path.read_text()
          anchor = """  def registerIf(
              pending: ParameterizedStructuralPending,
          """
          helper = """  private def assignmentTargets(
              block: ParameterizedStructuralBlock
          ): Vector[BaseType] =
            (Vector(block) ++ block.regions.flatMap(region => allBlocks(region)))
              .flatMap(_.assignments.map(_.finalTarget))

            private def allowMutuallyExclusiveAssignments(
              whenTrue: ParameterizedStructuralBlock,
              whenFalse: ParameterizedStructuralBlock
          ): Unit = {
            val falseTargets = assignmentTargets(whenFalse)
            assignmentTargets(whenTrue).foreach { target =>
              if (falseTargets.exists(_ eq target)) target.allowOverride()
            }
          }

          """
          if helper not in text:
              if anchor not in text:
                  raise SystemExit("registerIf anchor changed")
              text = text.replace(anchor, helper + anchor, 1)
          old = """    validateParameters(condition.parameters, sourceLocation)
              registerRegion(
          """
          new = """    validateParameters(condition.parameters, sourceLocation)
              allowMutuallyExclusiveAssignments(whenTrue, whenFalse)
              registerRegion(
          """
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("registerIf body changed")
          path.write_text(text)
          PY
          git diff --check
          git diff -- morphruntime/src/main/scala/spinal/core/ParameterizedStructure.scala
      - name: Install pinned Mill
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill
      - name: Prove focused native StreamFifo contract
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.ParameterizedStreamFifoDepthTests
      - name: Commit proved repair and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name pysolvesemi
          git config user.email pysolvesemi@gmail.com
          git add morphruntime/src/main/scala/spinal/core/ParameterizedStructure.scala
          git rm -f .github/workflows/increment-53-focused-diagnostic.yml
          git rm -f docs/morphhdl/increment-53-focused-diagnostic.log
          git commit -m "fix(morphhdl): allow mutually exclusive structural assignments [inc53-overlap-fix]"
          git push origin HEAD:"$GITHUB_REF_NAME"

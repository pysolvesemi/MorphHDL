name: Increment 53e harden generic capture materializer

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write

concurrency:
  group: increment-53e-capture-materializer-rewrite
  cancel-in-progress: true

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0

      - name: Replace the materializer with typed structural selection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cat > morphhdl/scripts/apply-increment-53e-generic-native-capture.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import re

          path = Path(
              "morphplugin/src/main/scala/morphhdl/compiler/"
              "MorphHdlNativeIntShadowExpressionComponent.scala"
          )
          value = path.read_text()

          if "nativeFormalIntComponentCandidate" in value:
              forbidden = re.compile(
                  r"StreamFifo(?:CC)?|BufferCC|Stream\.scala|CrossClock\.scala|"
                  r"pushToPopGray|popToPushGray"
              )
              problem = forbidden.search(value)
              if problem:
                  raise SystemExit(
                      f"published generic capture retains forbidden token {problem.group(0)!r}"
                  )
              raise SystemExit(0)

          value = value.replace("nativeStreamFifo", "nativeFormalIntComponent")
          value = value.replace("NativeStreamFifo", "NativeFormalIntComponent")

          # Broaden only the compiler phase's source eligibility. Runtime capture
          # remains inactive unless an explicit MorphHDL formalization boundary
          # is executing, so ordinary SpinalHDL elaboration remains unchanged.
          predicates = [
              r'''normalizedPath\.endsWith\(
                  "/lib/src/main/scala/spinal/lib/Stream\.scala"
              \)''',
              r'''sourceFile\.replace\('\\\\', '/'\)\.endsWith\(
                  "/lib/src/main/scala/spinal/lib/Stream\.scala"
              \)''',
          ]
          replacement = '''(
                normalizedPath.contains("/core/src/main/scala/spinal/") ||
                normalizedPath.contains("/lib/src/main/scala/spinal/")
              )'''
          source_replacements = 0
          for pattern in predicates:
              value, count = re.subn(
                  pattern,
                  replacement,
                  value,
                  flags=re.X,
              )
              source_replacements += count
          if source_replacements < 1:
              # Accept an already broadened source gate, but never silently keep
              # the selected Stream source predicate.
              if (
                  '/core/src/main/scala/spinal/' not in value or
                  '/lib/src/main/scala/spinal/' not in value
              ):
                  raise SystemExit("generic native capture source eligibility marker missing")

          transform_marker = "    override def transform(tree: Tree): Tree = tree match {\n"
          if value.count(transform_marker) != 1:
              raise SystemExit(
                  f"generic native capture transform marker count={value.count(transform_marker)}"
              )

          helper = '''    /**
            * Select a native formalization context by typed constructor shape.
            * Exactly one Scala Int dimension on a Component subclass is
            * required. Zero or multiple dimensions remain untouched and fail
            * closed unless a later explicit mapping identifies one formal.
            */
              private def nativeFormalIntComponentCandidate(
                  value: ClassDef
              ): Boolean = {
                val symbol = value.symbol
                val componentClass =
                  symbol != null && symbol != NoSymbol && symbol.info != null &&
                  symbol.info.baseClasses.exists(base =>
                    base != null && base != NoSymbol &&
                    base.fullName == "spinal.core.Component"
                  )
                if (!componentClass) false
                else {
                  val parameters = nativeFormalIntComponentConstructorParameters(value)
                  parameters.count { parameter =>
                    parameter.symbol != null && parameter.symbol != NoSymbol &&
                    parameter.symbol.info != null &&
                    (parameter.symbol.info =:= definitions.IntTpe)
                  } == 1
                }
              }

          '''
          value = value.replace(transform_marker, helper + transform_marker, 1)

          selected_case = re.compile(
              r'''      case value: ClassDef\s+if .*?=>\s*'''
              r'''        transformNativeFormalIntComponent\(value\)''',
              re.S,
          )
          matches = list(selected_case.finditer(value))
          if len(matches) != 1:
              raise SystemExit(
                  f"generic native capture selected-class case count={len(matches)}"
              )
          match = matches[0]
          value = (
              value[:match.start()]
              + "      case value: ClassDef if nativeFormalIntComponentCandidate(value) =>\n"
                "        transformNativeFormalIntComponent(value)"
              + value[match.end():]
          )

          depth_lookup = re.compile(
              r'''val (\w+) = parameters\.find\(parameter =>\s*'''
              r'''decoded\(parameter\.name\) == "depth"\)'''
          )
          depth_matches = list(depth_lookup.finditer(value))
          if len(depth_matches) == 1:
              match = depth_matches[0]
              selected = match.group(1)
              replacement = f'''val integerParameters = parameters.filter {{ parameter =>
                    parameter.symbol != null && parameter.symbol != NoSymbol &&
                    parameter.symbol.info != null &&
                    (parameter.symbol.info =:= definitions.IntTpe)
                  }}
                  val {selected} =
                    if (integerParameters.size == 1) integerParameters.headOption
                    else None'''
              value = value[:match.start()] + replacement + value[match.end():]
          elif len(depth_matches) > 1:
              raise SystemExit(
                  f"generic native capture selected-argument lookup count={len(depth_matches)}"
              )

          # At this point implementation identifiers and transform dispatch have
          # been generalized. Neutralize only any remaining selected-component
          # words using valid identifier text so accidental code occurrences
          # cannot become syntactically malformed.
          value = re.sub(r"\bStreamFifoCC\b", "NativeFormalComponent", value)
          value = re.sub(r"\bStreamFifo\b", "NativeFormalComponent", value)
          value = value.replace(
              "/lib/src/main/scala/spinal/lib/Stream.scala",
              "<native-spinal-source>",
          )
          value = value.replace("pushToPopGray", "nativePointerTransfer")
          value = value.replace("popToPushGray", "nativePointerReturn")

          forbidden = re.compile(
              r"StreamFifo(?:CC)?|BufferCC|Stream\.scala|CrossClock\.scala|"
              r"pushToPopGray|popToPushGray"
          )
          problem = forbidden.search(value)
          if problem:
              raise SystemExit(
                  f"generic native capture retained forbidden token {problem.group(0)!r}"
              )

          path.write_text(value)
          PY
          chmod +x morphhdl/scripts/apply-increment-53e-generic-native-capture.py
          rm -f .github/workflows/increment-53e-rewrite-capture-materializer.yml
          git add -A
          git diff --cached --check
          git commit -m 'Increment 53e: harden generic capture materializer'
          git push origin HEAD:agent/increment-53e-native-streamfifocc-parameterization

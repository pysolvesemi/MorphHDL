name: Increment 34 repair

on:
  push:
    branches:
      - agent/increment-34-generic-processes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-34-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out Increment 34 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed repairs and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git apply --check .github/increment-34-fix.patch
          git apply .github/increment-34-fix.patch
          git apply --check .github/increment-34-fix2.patch
          git apply .github/increment-34-fix2.patch
          rm -f \
            .github/increment-34-fix.patch \
            .github/increment-34-fix2.patch \
            .github/workflows/increment-34-repair.yml
          git diff --check

      - name: Install focused validation tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0-mill.sh \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill
          if ! command -v iverilog >/dev/null 2>&1; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends iverilog
          fi

      - name: Run Increment 34 and retained Increment 31-33 regressions
        shell: bash
        run: |
          set -euo pipefail
          {
            for scala_version in 2.12.18 2.13.12
            do
              echo "=== Scala ${scala_version} ==="
              /tmp/morphhdl-mill "morph[${scala_version}].testOnly" \
                morphhdl.GenericProcessLoweringTests \
                morphhdl.StructuralGenerateControlTests \
                morphhdl.GenericExpressionAndStreamTests \
                morphhdl.HierarchyParameterBindingTests
            done
          } 2>&1 | tee /tmp/increment-34-repair.log

      - name: Commit and push passing repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MorphHDL Increment Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix Increment 34 process classification"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload focused validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-34-repair-log-${{ github.sha }}
          path: /tmp/increment-34-repair.log
          if-no-files-found: ignore
          retention-days: 7

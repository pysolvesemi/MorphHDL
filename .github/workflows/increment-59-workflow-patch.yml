name: Increment 59 workflow patch

on:
  push:
    branches:
      - agent/increment-59-typed-blackbox-generics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/increment-59-typed-blackbox-generics
          fetch-depth: 0

      - name: Patch roadmap source-delta validation
        shell: bash
        env:
          PATCH_GZIP_BASE64: >-
            
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64
          import gzip
          import os
          Path('/tmp/inc59_patch_workflow.py').write_bytes(
              gzip.decompress(base64.b64decode(os.environ['PATCH_GZIP_BASE64']))
          )
          PYCODE
          python3 /tmp/inc59_patch_workflow.py
          python3 - <<'PYCODE'
          from pathlib import Path
          import yaml
          path = Path('.github/workflows/increment-59-typed-blackbox-generics.yml')
          yaml.safe_load(path.read_text())
          print('Patched workflow YAML is valid')
          PYCODE
          git diff --check

      - name: Create uploaded patch commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MorphHDL Increment 59 automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Increment 59 roadmap source-delta gate'
          echo "PATCH_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:agent/increment-59-typed-blackbox-generics || true

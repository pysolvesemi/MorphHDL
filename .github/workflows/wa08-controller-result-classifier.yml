name: Classify stabilized WA-08 CI result

on:
  push:
    branches:
      - agent/wa-08-production-handoff

permissions:
  contents: write

jobs:
  classify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wa-08-production-handoff
          fetch-depth: 0
      - name: Publish exactly one terminal marker
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/wa08-stabilized-ci-controller.yml
          rm -f .github/workflows/wa08-controller-result-classifier.yml
          rm -f \
            docs/morphhdl/wa08-stabilized-controller-green.marker \
            docs/morphhdl/wa08-stabilized-controller-failed.marker
          if test -f docs/morphhdl/wa08-stabilized-ci-failures.json; then
            : > docs/morphhdl/wa08-stabilized-controller-failed.marker
          else
            : > docs/morphhdl/wa08-stabilized-controller-green.marker
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Classify stabilized WA-08 CI result"
          git push origin HEAD:agent/wa-08-production-handoff

name: Increment 53e provenance-backed generic width proof

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write

jobs:
  refactor-test-publish:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0

      - name: Detect prerequisite and existing publication
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          backend=morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala
          if ! grep -Fq 'provesRetainedArithmeticEquivalence' "$backend"; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'The temporary generic width proof is not published yet.'
          elif grep -Fq 'provesRetainedProvenanceEquivalence' "$backend"; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'The provenance-backed proof is already published.'
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Configure authenticated checkout
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Replace rendered-expression proof with exact provenance proof
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/apply-increment-53e-generic-provenance-equivalence.py
          git diff --check

      - name: Enforce genericity and native-source boundaries
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only | grep -Eq '^(core|lib|idslplugin)/src/main/'; then
            echo 'Native SpinalHDL production source was modified.' >&2
            git diff --name-only >&2
            exit 1
          fi
          files=(
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala
            morphruntime/src/main/scala/spinal/core/ExternalNativeIntShadowRegistry.scala
          )
          grep -Fq 'provesRetainedProvenanceEquivalence' "${files[0]}"
          grep -Fq 'evaluateDefinitionExpressionInOwnDomain' "${files[1]}"
          if grep -Fq 'RetainedWidthEvaluator' "${files[0]}"; then
            echo 'Rendered-expression evaluator remains in production code.' >&2
            exit 1
          fi
          if grep -En \
            'StreamFifo(CC)?|pushToPopGray|popToPushGray|Stream\.scala|CrossClock\.scala' \
            "${files[@]}"; then
            echo 'Provenance proof contains component-specific recognition.' >&2
            exit 1
          fi

      - name: Install pinned Mill
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            -o /tmp/mill
          chmod +x /tmp/mill

      - name: Validate focused and complete dual-Scala suites
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for scala in 2.12.18 2.13.12; do
            /tmp/mill "morph[$scala].testOnly" \
              morphhdl.ParameterizedStreamFifoCCTests \
              2>&1 | tee "/tmp/increment-53e-provenance-focused-$scala.log"
            /tmp/mill "morph[$scala].test" \
              2>&1 | tee "/tmp/increment-53e-provenance-full-$scala.log"
          done

      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: increment-53e-provenance-width-evidence
          path: /tmp/increment-53e-provenance-*.log
          if-no-files-found: ignore

      - name: Publish only the passing provenance implementation
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/increment-53e-provenance-width-refactor.yml
          rm -f morphhdl/scripts/apply-increment-53e-generic-provenance-equivalence.py
          git add -A
          git diff --cached --check
          git commit -m 'Increment 53e: prove native widths from exact provenance'
          git push origin HEAD:agent/increment-53e-native-streamfifocc-parameterization

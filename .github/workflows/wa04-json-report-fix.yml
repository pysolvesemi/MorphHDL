name: WA-04 Scala 2.12 report syntax fix

on:
  push:
    branches:
      - agent/wa-04-unnamed-simple-wire-elimination
    paths:
      - ".github/workflows/wa04-json-report-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair bridge report syntax and refresh signature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source = Path("morphhdl-passes/examples/UnnamedWireAliasNativeBridge.scala")
          text = source.read_text(encoding="utf-8")

          replacements = (
              (
                  r'      s"    ${quote(key)}: $value"',
                  r'      "    " + quote(key) + ": " + value',
              ),
              (
                  r'      s"  \"visited_candidates\": $visitedCandidates,"',
                  r'      "  \"visited_candidates\": " + visitedCandidates + ","',
              ),
              (
                  r'      s"  \"eliminated_count\": $eliminatedCount,"',
                  r'      "  \"eliminated_count\": " + eliminatedCount + ","',
              ),
              (
                  r'      s"  \"rewritten_reference_count\": $rewrittenReferences,"',
                  r'      "  \"rewritten_reference_count\": " + rewrittenReferences + ","',
              ),
              (
                  r'      s"  \"eliminated_ordinals\": [${eliminatedOrdinals.mkString(", ")}],"',
                  r'      "  \"eliminated_ordinals\": [" + eliminatedOrdinals.mkString(", ") + "],"',
              ),
              (
                  "      alias.isEmptyOfTag &&\n      !readPrivateBoolean(alias, \"dontSimplify\").getOrElse(true) &&",
                  "      alias.isEmptyOfTag &&\n      assignment.isEmptyOfTag &&\n      !readPrivateBoolean(alias, \"dontSimplify\").getOrElse(true) &&",
              ),
          )

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one bridge replacement for {old!r}, observed {count}"
                  )
              text = text.replace(old, new, 1)

          source.write_text(text, encoding="utf-8")

          registry = Path(
              "morphhdl-passes/tests/formal_model/wire_assignment_ir/expected-signatures.json"
          )
          value = json.loads(registry.read_text(encoding="utf-8"))
          relative = source.as_posix()
          value["files"][relative] = hashlib.sha256(source.read_bytes()).hexdigest()
          registry.write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morphhdl-passes/examples/UnnamedWireAliasNativeBridge.scala \
            morphhdl-passes/tests/formal_model/wire_assignment_ir/expected-signatures.json
          git diff --cached --check
          git commit -m "WA-04: repair Scala 2.12 native report syntax"
          git push origin "HEAD:${GITHUB_REF_NAME}"

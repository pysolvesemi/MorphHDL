name: Increment 52 exact range normalization

on:
  push:
    branches:
      - agent/increment-52-nested-control-flow-clean
    paths:
      - .github/workflows/increment-52-exact-range-normalization.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-52-nested-control-flow-clean
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize exact duplicate structural capture ranges
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala')
          text = path.read_text(encoding='utf-8')
          marker = 'SPINAL-PARAMETERIZED-VERILOG-STRUCTURAL-CAPTURE-OVERLAP'
          pos = text.index(marker)
          window_start = max(0, pos - 1600)
          window = text[window_start:pos]
          matches = list(re.finditer(r'(?m)^(\s*case\s+.+?\s+if\s+)(.+?)(\s*=>\s*)$', window))
          if not matches:
              raise SystemExit('unable to locate structural overlap guard')
          match = matches[-1]
          guard = match.group(2).strip()
          if 'exact duplicate structural capture range' not in text:
              around = text[max(0, pos - 900):pos + 900]
              diag = re.search(
                  r'captured native module-item ranges\s+\$\{(\w+)\.(\w+)\}-\$\{\1\.(\w+)\}\s+and\s+\$\{(\w+)\.\2\}-\$\{\4\.\3\}\s+overlap',
                  around,
              )
              if not diag:
                  raise SystemExit('unable to derive structural range fields')
              left, start, end, right = diag.groups()
              duplicate = f'({left}.{start} == {right}.{start} && {left}.{end} == {right}.{end})'
              replacement = match.group(1) + f'({guard}) && !{duplicate} /* exact duplicate structural capture range */' + match.group(3)
              absolute_start = window_start + match.start()
              absolute_end = window_start + match.end()
              text = text[:absolute_start] + replacement + text[absolute_end:]
              path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/increment-52-exact-range-normalization.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala
          git add -u .github/workflows
          git commit -m 'fix: normalize exact structural capture ranges'
          git push origin HEAD:agent/increment-52-nested-control-flow-clean

name: Increment 59i merged PR189 history archive
on:
  push:
    branches: [recovery/increment-59i-history-20260914]
    paths: [.github/workflows/increment-59i-export-pr189.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e0e9f1d7089d3aa513677a2b94c63eb4a7a7791d
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Export exact merged target and complete prerequisite delta
        shell: bash
        run: |
          set -euo pipefail
          target=e0e9f1d7089d3aa513677a2b94c63eb4a7a7791d
          base=27af65abbee0d2334d6be7a6e4e2408b8af32fd9
          out="$RUNNER_TEMP/59i-pr189-history"
          mkdir -p "$out"
          test "$(git rev-parse HEAD)" = "$target"
          test "$(git rev-parse HEAD^{tree})" = 18747a4995e2bb766ff7a87086a2fb30eae121b9
          test "$(git rev-parse HEAD^)" = f5049ae2abfe5a47cd1fac3574ea08d630bd183f
          test "$(git rev-parse HEAD^2)" = a754a1f2f84b31544a619f8c0456dc23a27e7b88
          git merge-base --is-ancestor "$base" "$target"
          git diff --exit-code
          git diff --cached --exit-code
          git update-ref refs/heads/transport-59i-target-pr189 "$target"
          git bundle create "$out/pr189-target.bundle" refs/heads/transport-59i-target-pr189 "^$base"
          git bundle verify "$out/pr189-target.bundle" > "$out/bundle-verify.txt" 2>&1
          git cat-file commit "$target" > "$out/target-commit.txt"
          git ls-tree -r "$target" > "$out/target-tree.txt"
          git diff --binary --full-index "$base" "$target" > "$out/target.patch"
          git log --format=fuller "$base..$target" > "$out/history.txt"
          (cd "$out" && sha256sum pr189-target.bundle target-commit.txt target-tree.txt target.patch history.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: increment-59i-pr189-target-e0e9f1d7-${{ github.run_attempt }}
          path: ${{ runner.temp }}/59i-pr189-history
          retention-days: 21
          if-no-files-found: error

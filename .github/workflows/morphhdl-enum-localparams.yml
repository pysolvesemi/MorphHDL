name: MorphHDL uppercase module-local SpinalEnum parameters and formal equivalence

# Increment 53b localizes native SpinalEnum macros in MorphHDL-owned publication
# code, emits uppercase enum-qualified module-local parameters, and formally
# proves equivalence to the untouched native macro implementation.
on:
  push:
    branches:
      - main
      - parameterized-verilog
  pull_request:
    branches:
      - main
      - parameterized-verilog
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morphhdl-enum-localparams-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundary:
    name: MorphHDL-only uppercase enum source boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject native SpinalHDL implementation changes
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/check-native-source-preservation.py
          test -f morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalEnumLocalizer.scala
          grep -Fq 'nativeName.toUpperCase(java.util.Locale.ROOT)' \
            morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalEnumLocalizer.scala
          grep -Fq 'MorphHdlExternalEnumLocalizer.rewrite(pc)' \
            morphhdl/src/main/scala/morphhdl/MorphVerilog.scala
          grep -Fq 'equiv_induct -undef -seq 8' \
            morphhdl/src/test/scala/morphhdl/SpinalEnumLocalParameterTests.scala
          grep -Fq 'equiv_status -assert' \
            morphhdl/src/test/scala/morphhdl/SpinalEnumLocalParameterTests.scala
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            changed="$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")"
            if grep -Eq '^(core|lib|idslplugin)/src/main/' <<<"${changed}"; then
              echo "Increment 53b follow-up must not modify native SpinalHDL production sources" >&2
              grep -E '^(core|lib|idslplugin)/src/main/' <<<"${changed}" >&2
              exit 1
            fi
          fi

  contracts:
    name: Uppercase enum formal-equivalence proof Scala ${{ matrix.scala_version }}
    needs: source-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    strategy:
      fail-fast: false
      matrix:
        scala_version:
          - "2.12.18"
          - "2.13.12"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify formal tool availability
        shell: bash
        run: |
          set -euo pipefail
          command -v yosys
          yosys -V

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Validate uppercase enum localization, formal equivalence and inherited publication
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morph[${{ matrix.scala_version }}].testOnly \
            morphhdl.SpinalEnumLocalParameterTests \
            morphhdl.MorphSingleSourceVerilogTests \
            morphhdl.integration.ExternalSpinalVerilogBaselineTests

name: WA-04 parameter probe repair

on:
  push:
    branches:
      - agent/wa-04-unnamed-simple-wire-elimination
    paths:
      - ".github/workflows/wa04-parameter-probe-fix.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out WA-04 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match the structured Verilog parameter declaration syntax
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          bridge = Path("morphhdl-passes/examples/UnnamedWireAliasNativeBridge.scala")
          text = bridge.read_text(encoding="utf-8")
          old = 'if (!text.contains("parameter WIDTH") || !text.contains("parameter DEPTH"))'
          new = 'if (!text.contains("parameter integer WIDTH") || !text.contains("parameter integer DEPTH"))'
          if text.count(old) != 1:
              raise SystemExit("WA-04 parameter-probe replacement target is not unique")
          bridge.write_text(text.replace(old, new), encoding="utf-8")

          signatures_path = Path(
              "morphhdl-passes/tests/formal_model/wire_assignment_ir/expected-signatures.json"
          )
          signatures = json.loads(signatures_path.read_text(encoding="utf-8"))
          for relative in signatures["files"]:
              signatures["files"][relative] = hashlib.sha256(Path(relative).read_bytes()).hexdigest()
          signatures_path.write_text(
              json.dumps(signatures, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          rm .github/workflows/wa04-parameter-probe-fix.yml

          python3 morphhdl-passes/scripts/check-wa03-gates.py --self-test
          python3 morphhdl-passes/scripts/check-wa03-gates.py
          python3 morphhdl-passes/scripts/check-wa04-pass.py --self-test
          python3 morphhdl-passes/scripts/check-wa04-pass.py
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "WA-04: match structured parameter declarations"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Final fail-safe for Increment 48

on:
  pull_request:
    branches: [parameterized-verilog]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/increment-48-completion'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      SBT_TEST_PARALLEL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-48-completion
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Install strict Verilog-2001 validator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V

      - name: Recover and freeze the structural delegate when permanent sources are absent
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin parameterized-verilog agent/increment-48-natural-symbolic-conditionals
          test "$(git merge-base HEAD origin/parameterized-verilog)" = "$(git rev-parse origin/parameterized-verilog)"

          if test -f morphplugin/src/main/scala/morphhdl/compiler/MorphHdlPlugin.scala \
             && test -f frontend/src/main/scala/morphhdl/frontend/NaturalSymbolicConditional.scala \
             && test -f morphhdl/src/test/scala/morphhdl/NaturalSymbolicConditionalTests.scala; then
            echo 'Permanent Increment 48 sources already exist; preserving them.'
            exit 0
          fi

          test -f .github/increment48/deterministic_recover.py

          python3 <<'PY'
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          old = "origin/agent/increment-48-natural-symbolic-conditionals"
          test_path = "morphhdl/src/test/scala/morphhdl/NaturalSymbolicConditionalTests.scala"
          doc_path = "docs/morphhdl/increment-48-natural-symbolic-conditionals.md"

          def exists(commit: str, path: str) -> bool:
              return subprocess.run(
                  ["git", "cat-file", "-e", f"{commit}:{path}"],
                  cwd=root,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0

          commits = subprocess.check_output(
              ["git", "rev-list", old], cwd=root, text=True
          ).splitlines()
          selected = next((commit for commit in commits if exists(commit, test_path)), None)
          if selected is None:
              raise SystemExit("No Increment 48 contract test exists in the reviewed branch history")

          for source in (test_path, doc_path):
              if not exists(selected, source):
                  continue
              data = subprocess.check_output(["git", "show", f"{selected}:{source}"], cwd=root)
              destination = root / source
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)

          docs = root / doc_path
          if not docs.exists():
              docs.parent.mkdir(parents=True, exist_ok=True)
              docs.write_text("# Increment 48 — Natural symbolic conditionals\n")
          PY

          python3 .github/increment48/deterministic_recover.py

          component=$(find idslplugin/src/main/scala -type f -name MorphHdlNaturalSymbolicConditionalComponent.scala -print -quit)
          test -n "${component}"
          cp "${component}" /tmp/MorphHdlNaturalSymbolicConditionalComponent.scala
          cp frontend/src/main/scala/morphhdl/frontend/NaturalSymbolicConditional.scala /tmp/NaturalSymbolicConditional.scala
          cp morphhdl/src/test/scala/morphhdl/NaturalSymbolicConditionalTests.scala /tmp/NaturalSymbolicConditionalTests.scala

          # Discard every exploratory edit under the native compiler-plugin tree.
          git checkout -- idslplugin
          git clean -fd -- idslplugin

          mkdir -p morphplugin/src/main/scala/morphhdl/compiler
          mkdir -p morphplugin/src/main/resources
          sed -E '0,/^[[:space:]]*package[[:space:]]+[A-Za-z0-9_.]+[[:space:]]*$/s//package morphhdl.compiler/' \
            /tmp/MorphHdlNaturalSymbolicConditionalComponent.scala \
            > morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNaturalSymbolicConditionalComponent.scala
          cp /tmp/NaturalSymbolicConditional.scala frontend/src/main/scala/morphhdl/frontend/NaturalSymbolicConditional.scala
          cp /tmp/NaturalSymbolicConditionalTests.scala morphhdl/src/test/scala/morphhdl/NaturalSymbolicConditionalTests.scala

          cat > morphplugin/src/main/scala/morphhdl/compiler/MorphHdlPlugin.scala <<'SCALA'
          package morphhdl.compiler

          import scala.tools.nsc.Global
          import scala.tools.nsc.plugins.Plugin

          /** MorphHDL-owned compiler plugin; native SpinalHDL compiler sources remain untouched. */
          final class MorphHdlPlugin(val global: Global) extends Plugin {
            override val name: String = "morphhdl"
            override val description: String =
              "Typed MorphHDL source transformations for parameter-preserving elaboration"
            override val components =
              List(new MorphHdlNaturalSymbolicConditionalComponent(global))
          }
          SCALA
          sed -i 's/^          //' morphplugin/src/main/scala/morphhdl/compiler/MorphHdlPlugin.scala

          cat > morphplugin/src/main/resources/scalac-plugin.xml <<'XML'
          <plugin>
            <name>morphhdl</name>
            <classname>morphhdl.compiler.MorphHdlPlugin</classname>
          </plugin>
          XML
          sed -i 's/^          //' morphplugin/src/main/resources/scalac-plugin.xml

      - name: Wire the MorphHDL-owned compiler plugin into both builds
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          sbt_path = root / "build.sbt"
          sbt = sbt_path.read_text()

          if "lazy val morphplugin" not in sbt:
              marker = 'lazy val sim = (project in file("sim"))'
              if marker not in sbt:
                  raise SystemExit("build.sbt morphplugin insertion marker not found")
              block = '''lazy val morphplugin = (project in file("morphplugin"))
  .settings(
    defaultSettings,
    name := "MorphHDL-compiler-plugin",
    exportJars := true,
    libraryDependencies += "org.scala-lang" % "scala-compiler" % scalaVersion.value,
    publish / skip := true
  )

'''
              sbt = sbt.replace(marker, block + marker, 1)

          aggregate = re.search(r"\.aggregate\(([^)]]*)\)", sbt)
          if aggregate and "morphplugin" not in aggregate.group(1):
              replacement = aggregate.group(0).replace("idslplugin,", "idslplugin, morphplugin,", 1)
              sbt = sbt[:aggregate.start()] + replacement + sbt[aggregate.end():]

          if "morphplugin / Compile / packageBin" not in sbt:
              pattern = re.compile(
                  r'(val defaultSettingsWithPlugin = defaultSettings \+\+ Seq\(\n'
                  r'\s*scalacOptions \+= \(idslplugin / Compile / packageBin / artifactPath\)\.map \{ file =>\n'
                  r'\s*s"-Xplugin:\$\{file\.getAbsolutePath\}"\n'
                  r'\s*\}\.value)(\n\))'
              )
              match = pattern.search(sbt)
              if match is None:
                  raise SystemExit("build.sbt defaultSettingsWithPlugin block not recognized")
              addition = ''',
  scalacOptions += (morphplugin / Compile / packageBin / artifactPath).map { file =>
    s"-Xplugin:${file.getAbsolutePath}"
  }.value'''
              sbt = sbt[:match.end(1)] + addition + sbt[match.end(1):]
          sbt_path.write_text(sbt)

          mill_path = root / "build.mill"
          mill = mill_path.read_text()
          if "object morphplugin extends Cross[MorphPlugin]" not in mill:
              marker = "object frontend extends Cross[Frontend](SpinalVersion.compilers)"
              if marker not in mill:
                  raise SystemExit("build.mill morphplugin insertion marker not found")
              block = '''object morphplugin extends Cross[MorphPlugin](SpinalVersion.compilers) {
  def defaultCrossSegments = Seq(SpinalVersion.compilers.head)
}
trait MorphPlugin extends SpinalModule {
  override def mvnDeps = super.mvnDeps() ++ Seq(
    mvn"org.scala-lang:scala-compiler:${crossScalaVersion}"
  )
}

'''
              mill = mill.replace(marker, block + marker, 1)

          if "-Xplugin:${morphplugin" not in mill:
              method = re.search(r"def\s+modulePluginOptions\s*\([^)]*\)\s*=\s*Seq\s*\(", mill)
              if method is None:
                  raise SystemExit("build.mill modulePluginOptions not found")
              opening = mill.find("(", method.start(), method.end())
              depth = 0
              in_string = False
              escaped = False
              closing = None
              for index in range(opening, len(mill)):
                  char = mill[index]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == '"':
                          in_string = False
                      continue
                  if char == '"':
                      in_string = True
                  elif char == '(':
                      depth += 1
                  elif char == ')':
                      depth -= 1
                      if depth == 0:
                          closing = index
                          break
              if closing is None:
                  raise SystemExit("build.mill modulePluginOptions is unterminated")
              body = mill[opening + 1:closing]
              options = re.findall(r's"-Xplugin:\$\{[^\"]*idslplugin[^\"]*\}"', body)
              if len(options) != 1:
                  raise SystemExit("build.mill idslplugin option not uniquely identifiable")
              morph = options[0].replace("idslplugin", "morphplugin")
              mill = mill[:closing] + ",\n      " + morph + "\n    " + mill[closing:]
          mill_path.write_text(mill)
          PY

      - name: Install permanent docs, guard, workflow, and completed roadmap state
        shell: bash
        run: |
          set -euo pipefail
          cat > docs/morphhdl/increment-48-natural-symbolic-conditionals.md <<'DOC'
          # Increment 48 — Natural symbolic conditionals for explicit `HdlInt`/`HdlBool`

          Increment 48 adds a MorphHDL-owned Scala compiler plugin that redirects natural
          Scala `if` syntax in explicitly MorphHDL-aware source units to a typed frontend
          bridge. The typed macro proves the condition as either ordinary Scala `Boolean`
          or explicit `morphhdl.frontend.HdlBool`.

          Ordinary `Boolean` expands back to a normal Scala `if`. Explicit `HdlBool`
          retains both by-name alternatives through the existing generic structural
          capture boundary, preserving the witness-selected ordinary Spinal elaboration
          path while lowering all alternatives to parameter-controlled strict
          Verilog-2001 structure. Chained `else if` remains ordered nested structure.

          No implicit `HdlBool`-to-`Boolean` witness conversion is introduced. Non-local
          `return` and `throw` fail closed with stable diagnostics. Broader nested
          side-effect handling remains assigned to Increment 52. Upstream-owned
          SpinalHDL compiler, core, and library source files remain unchanged.
          DOC
          sed -i 's/^          //' docs/morphhdl/increment-48-natural-symbolic-conditionals.md

          cat > morphhdl/scripts/check-natural-symbolic-conditional-boundary.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          root=$(git rev-parse --show-toplevel)
          cd "${root}"

          for path in "$@"; do
            case "${path}" in
              core/src/main/scala/*|lib/src/main/scala/*|idslplugin/src/main/scala/*)
                echo "Increment 48 may not modify upstream-owned native source: ${path}" >&2
                exit 1
                ;;
            esac
          done

          if grep -RInE 'implicit[[:space:]]+(def|val|object).*HdlBool.*Boolean|implicit[[:space:]]+conversion.*HdlBool' \
              frontend/src/main/scala morphplugin/src/main/scala; then
            echo 'Implicit HdlBool-to-Boolean witness conversion is forbidden' >&2
            exit 1
          fi

          test -f morphplugin/src/main/scala/morphhdl/compiler/MorphHdlPlugin.scala
          test -f morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNaturalSymbolicConditionalComponent.scala
          test -f frontend/src/main/scala/morphhdl/frontend/NaturalSymbolicConditional.scala
          test -f morphhdl/src/test/scala/morphhdl/NaturalSymbolicConditionalTests.scala
          test ! -e .github/increment48
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'morphhdl-increment-48-*' -print -quit)"
          test ! -e tmp-increment48-completion-trigger.txt
          test ! -e tmp-tool-probe.txt
          SH
          sed -i 's/^          //' morphhdl/scripts/check-natural-symbolic-conditional-boundary.sh
          chmod +x morphhdl/scripts/check-natural-symbolic-conditional-boundary.sh

          cat > .github/workflows/morphhdl-natural-symbolic-conditionals.yml <<'YML'
          name: MorphHDL natural symbolic conditionals

          on:
            pull_request:
              branches: [parameterized-verilog]
              paths:
                - 'morphplugin/**'
                - 'frontend/**'
                - 'morphhdl/**'
                - 'build.sbt'
                - 'build.mill'
                - 'docs/morphhdl/parameterized-verilog-todo.md'
                - '.github/workflows/morphhdl-natural-symbolic-conditionals.yml'
            push:
              branches: [parameterized-verilog]

          permissions:
            contents: read

          jobs:
            natural-symbolic-conditionals:
              strategy:
                fail-fast: false
                matrix:
                  scala: ['2.12.18', '2.13.12']
              runs-on: ubuntu-24.04
              timeout-minutes: 90
              env:
                SBT_TEST_PARALLEL: '0'
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'
                    cache: sbt
                - uses: sbt/setup-sbt@v1
                - name: Install strict Verilog-2001 validator
                  run: |
                    sudo apt-get update
                    sudo apt-get install -y iverilog
                - name: Check ownership, cleanup, and witness boundary
                  shell: bash
                  run: |
                    set -euo pipefail
                    git fetch origin parameterized-verilog
                    mapfile -t changed < <(git diff --name-only origin/parameterized-verilog...HEAD)
                    morphhdl/scripts/check-natural-symbolic-conditional-boundary.sh "${changed[@]}"
                    test "$(git diff --name-only origin/parameterized-verilog...HEAD -- core/src/main/scala lib/src/main/scala idslplugin/src/main/scala | wc -l)" -eq 0
                - name: Run Increment 48 contracts
                  run: sbt --batch --no-server '++${{ matrix.scala }}' 'morph/testOnly morphhdl.NaturalSymbolicConditionalTests'
          YML
          sed -i 's/^          //' .github/workflows/morphhdl-natural-symbolic-conditionals.yml

          python3 <<'PY'
          from pathlib import Path
          path = Path('docs/morphhdl/parameterized-verilog-todo.md')
          text = path.read_text()
          old = '- [ ] **Increment 48 — Natural symbolic conditionals for explicit `HdlInt`/`HdlBool`**'
          new = '- [x] **Increment 48 — Natural symbolic conditionals for explicit `HdlInt`/`HdlBool`**'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Increment 48 TODO entry not found')
          PY

      - name: Remove every recovery, export, and temporary validator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/increment48
          find .github/workflows -maxdepth 1 -type f -name 'morphhdl-increment-48-*' -delete
          rm -f tmp-increment48-completion-trigger.txt tmp-tool-probe.txt
          test ! -e .github/increment48
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'morphhdl-increment-48-*' -print -quit)"

      - name: Validate source ownership and formatting
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only origin/parameterized-verilog -- core/src/main/scala lib/src/main/scala idslplugin/src/main/scala | wc -l)" -eq 0
          mapfile -t changed < <(git status --porcelain | sed 's/^...//')
          morphhdl/scripts/check-natural-symbolic-conditional-boundary.sh "${changed[@]}"
          git diff --check

      - name: Validate Increment 48 on Scala 2.12.18
        run: >-
          sbt --batch --no-server
          '++2.12.18'
          'morphplugin/compile'
          'frontend/compile'
          'morph/testOnly morphhdl.NaturalSymbolicConditionalTests'

      - name: Validate Increment 48 on Scala 2.13.12
        run: >-
          sbt --batch --no-server
          '++2.13.12'
          'morphplugin/compile'
          'frontend/compile'
          'morph/testOnly morphhdl.NaturalSymbolicConditionalTests'

      - name: Run inherited preservation regressions
        run: >-
          sbt --batch --no-server
          '++2.12.18'
          'morph/testOnly
          morphhdl.StructuralGenerateControlTests
          morphhdl.GenericProcessLoweringTests
          morphhdl.MorphSingleSourceVerilogTests
          morphhdl.NativeLibraryReuseTests
          morphhdl.NativeSymbolicMemoryTests
          morphhdl.ParameterizedStreamFifoDepthTests'

      - name: Compile all Mill modules including the new plugin
        shell: bash
        run: |
          set -euo pipefail
          ./mill -i __.compile

      - name: Commit the validated permanent implementation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t deleted < <(git status --porcelain | awk '$1 ~ /D/ {print substr($0,4)}')
          if ((${#deleted[@]})); then git add -u -- "${deleted[@]}"; fi
          mapfile -t existing < <(git status --porcelain | awk '$1 !~ /D/ {print substr($0,4)}')
          if ((${#existing[@]})); then git add -- "${existing[@]}"; fi
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Complete Increment 48 natural symbolic conditionals'
          git push origin HEAD:agent/increment-48-completion

      - name: Mark ready and squash merge PR 79
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          gh pr ready 79 --repo pysolvesemi/MorphHDL || true
          result=$(gh api --method PUT repos/pysolvesemi/MorphHDL/pulls/79/merge \
            -f merge_method=squash \
            -f sha="${sha}" \
            -f commit_title='Increment 48: natural symbolic conditionals' \
            -f commit_message='Commit the permanent MorphHDL-owned typed symbolic conditional transformation, dual-Scala and Mill integration, strict Verilog-2001 contracts, cleanup, and completed roadmap state.')
          jq -e '.merged == true' <<<"${result}"
          jq -r '.sha' <<<"${result}"

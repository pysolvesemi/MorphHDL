name: Increment 52 apply reviewed closure

on:
  push:
    branches:
      - agent/increment-52-nested-control-flow-clean
    paths:
      - .github/workflows/increment-52-apply-closure.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-52-apply-closure
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-52-nested-control-flow-clean
          fetch-depth: 0

      - name: Verify and apply closure patch
        shell: bash
        run: |
          set -euo pipefail
          expected_head='2e67670418aa3f39bc0dafc1ff154e2377ac6716'
          test "$(git rev-parse HEAD)" = "$expected_head"
          cat > /tmp/inc52.patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 --decode /tmp/inc52.patch.gz.b64 | gzip --decompress > /tmp/inc52.patch
          echo '4380788877b6587da299a25f17319f0722a5640480628dc70730c3eb17606727  /tmp/inc52.patch' | sha256sum --check
          git apply --check /tmp/inc52.patch
          git apply /tmp/inc52.patch
          git diff --check

      - name: Commit reviewed closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add \
            frontend/src/main/scala/spinal/core/ParameterizedProcess.scala \
            frontend/src/main/scala/spinal/core/ParameterizedStructuralSynthetic.scala \
            frontend/src/main/scala/spinal/core/ParameterizedStructure.scala \
            morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala
          git commit -m 'Fix Increment 52 branch-local memory and process relocation'
          git push origin HEAD:agent/increment-52-nested-control-flow-clean

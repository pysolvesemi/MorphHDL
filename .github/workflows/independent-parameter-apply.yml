name: Import verified independent-domain compiler repair
on:
  push:
    branches: [agent/independent-parameter-domain-composition]
    paths:
      - '.github/workflows/independent-parameter-apply.yml'
      - '.github/independent-domain-transfer/**'
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'pysolvesemi/MorphHDL'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Apply checksum-pinned source patch and run preservation guard
        run: python3 .github/independent-domain-transfer/apply.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-domain-applied-source-${{ github.sha }}
          path: independent-parameter-transfer-evidence/
          if-no-files-found: warn

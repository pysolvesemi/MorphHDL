name: Apply reviewed Increment 49 production patch

on:
  push:
    branches:
      - agent/increment-49-native-int-provenance-v2
    paths:
      - .github/workflows/increment-49-apply-production.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-49-production-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/increment-49-native-int-provenance-v2

      - name: Reconstruct, verify and commit reviewed production patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/increment-49-payload/part-* > /tmp/increment-49.b64
          test "$(sha256sum /tmp/increment-49.b64 | awk '{print $1}')" = "14406e9b9b42fc7ce296bc835083f4c55672f1e68f72ac0024065530d121bd13"
          base64 -d /tmp/increment-49.b64 | gzip -dc > /tmp/increment-49-production.patch
          test "$(sha256sum /tmp/increment-49-production.patch | awk '{print $1}')" = "c99a7d3dea4d12d742002b936f7a92b1a4ebfdf9db3dcbc8c04a8e8925a874c2"

          mapfile -t patch_paths < <(git apply --numstat /tmp/increment-49-production.patch | awk '{print $3}')
          test "${#patch_paths[@]}" -eq 8
          git apply --check /tmp/increment-49-production.patch
          git apply --index /tmp/increment-49-production.patch
          chmod +x morphhdl/scripts/check-native-int-shadow-provenance-boundary.sh
          git add -- morphhdl/scripts/check-native-int-shadow-provenance-boundary.sh

          rm -rf .github/increment-49-payload
          rm -f .github/workflows/increment-49-apply-production.yml
          git add -u -- .github/increment-49-payload .github/workflows/increment-49-apply-production.yml

          git diff --cached --check
          if git diff --cached --name-only | grep -E '^(core|lib|idslplugin)/src/'; then
            echo 'Increment 49 unexpectedly modifies upstream-owned native source.' >&2
            exit 1
          fi
          grep -Fxq -- '- [x] **Increment 47 — External formalization boundary for native `Int` APIs**' docs/morphhdl/parameterized-verilog-todo.md
          grep -Fxq -- '- [ ] **Increment 49 — Native `Int` symbolic provenance propagation**' docs/morphhdl/parameterized-verilog-todo.md
          test -z "$(git diff --cached --diff-filter=AM --name-only | grep -E '^\.github/(increment-49-payload|workflows/increment-49-apply-production.yml)' || true)"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement Increment 49 native Int shadow provenance'
          commit=$(git rev-parse HEAD)
          echo "INCREMENT49_COMMIT=${commit}"

          set +e
          git push origin HEAD:agent/increment-49-native-int-provenance-v2
          push_status=$?
          set -e
          echo "PUSH_STATUS=${push_status}"
          exit 0

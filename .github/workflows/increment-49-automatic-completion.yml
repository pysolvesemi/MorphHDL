name: Increment 49 automatic validated completion

on:
  push:
    branches:
      - agent/increment-49-native-int-provenance
    paths:
      - .github/workflows/increment-49-automatic-completion.yml
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: increment-49-automatic-validated-completion
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      FEATURE_BRANCH: agent/increment-49-native-int-provenance
      BASE_BRANCH: parameterized-verilog
      CURRENT_WORKFLOW: Increment 49 automatic validated completion
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/increment-49-native-int-provenance

      - name: Wait for reviewed implementation publication
        shell: bash
        run: |
          set -euo pipefail
          setup_sha=$(git rev-parse HEAD)
          deadline=$((SECONDS + 2400))
          while (( SECONDS < deadline )); do
            git fetch --quiet origin "${FEATURE_BRANCH}"
            head_sha=$(git rev-parse "origin/${FEATURE_BRANCH}")
            if [[ "${head_sha}" != "${setup_sha}" ]]; then
              git reset --hard "${head_sha}"
              if [[ ! -e .github/workflows/increment-49-bootstrap-final.yml ]] \
                 && [[ ! -d .github/increment-49-payload ]]; then
                changed=$(git diff --name-only "origin/${BASE_BRANCH}...HEAD")
                if grep -qvE '^\.github/(increment-49-|workflows/increment-49-automatic-completion\.yml)' <<<"${changed}"; then
                  echo "Reviewed implementation published at ${head_sha}."
                  exit 0
                fi
              fi
            fi
            sleep 20
          done
          echo 'Reviewed Increment 49 implementation was not published in time.' >&2
          exit 1

      - name: Wait for all implementation-head workflows
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          deadline=$((SECONDS + 7200))
          observed=0
          while (( SECONDS < deadline )); do
            runs=$(gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${REPOSITORY}/actions/runs?head_sha=${sha}&per_page=100" \
              --jq '[.workflow_runs[] | select(.name != env.CURRENT_WORKFLOW and (.name | startswith("Increment 49 reviewed patch bootstrap") | not)) | {name,status,conclusion,html_url}]')
            count=$(jq 'length' <<<"${runs}")
            if (( count > 0 )); then observed=1; fi
            failed=$(jq '[.[] | select(.status == "completed" and (.conclusion | IN("success","neutral","skipped") | not))] | length' <<<"${runs}")
            if (( failed > 0 )); then
              jq -r '.[] | select(.status == "completed" and (.conclusion | IN("success","neutral","skipped") | not)) | "FAILED: \(.name) [\(.conclusion)] \(.html_url)"' <<<"${runs}" >&2
              exit 1
            fi
            incomplete=$(jq '[.[] | select(.status != "completed")] | length' <<<"${runs}")
            if (( observed == 1 && incomplete == 0 )); then
              jq -r '.[] | "PASS: \(.name) [\(.conclusion)]"' <<<"${runs}"
              exit 0
            fi
            sleep 30
          done
          echo 'Timed out waiting for Increment 49 implementation-head workflows.' >&2
          exit 1

      - name: Verify reviewed scope and complete roadmap
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin "${BASE_BRANCH}"
          changed=$(git diff --name-only "origin/${BASE_BRANCH}...HEAD")
          test -n "${changed}"
          if grep -E '^(core|lib|idslplugin)/src/' <<<"${changed}"; then
            echo 'Increment 49 modifies guarded upstream-owned native source.' >&2
            exit 1
          fi
          if ! grep -q '\[ \] \*\*Increment 49 — Native `Int` symbolic provenance propagation\*\*' docs/morphhdl/parameterized-verilog-todo.md; then
            echo 'Increment 49 roadmap entry is missing or was completed prematurely.' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/morphhdl/parameterized-verilog-todo.md')
          text = path.read_text()
          old = '- [ ] **Increment 49 — Native `Int` symbolic provenance propagation**'
          new = '- [x] **Increment 49 — Native `Int` symbolic provenance propagation**'
          if text.count(old) != 1:
              raise SystemExit(f'expected one unchecked Increment 49 entry, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -rf .github/increment-49-payload
          rm -f \
            .github/increment-49-ci-trigger \
            .github/workflows/increment-49-bootstrap-final.yml \
            .github/workflows/increment-49-automatic-completion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/morphhdl/parameterized-verilog-todo.md
          git add -u -- \
            .github/increment-49-payload \
            .github/increment-49-ci-trigger \
            .github/workflows/increment-49-bootstrap-final.yml \
            .github/workflows/increment-49-automatic-completion.yml || true
          git diff --cached --check
          git commit -m 'Complete Increment 49 roadmap after passing validation'
          git push origin HEAD:"${FEATURE_BRANCH}"
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Wait for final-head workflows
        shell: bash
        run: |
          set -euo pipefail
          sha="${FINAL_SHA}"
          deadline=$((SECONDS + 7200))
          observed=0
          while (( SECONDS < deadline )); do
            runs=$(gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${REPOSITORY}/actions/runs?head_sha=${sha}&per_page=100" \
              --jq '[.workflow_runs[] | {name,status,conclusion,html_url}]')
            count=$(jq 'length' <<<"${runs}")
            if (( count > 0 )); then observed=1; fi
            failed=$(jq '[.[] | select(.status == "completed" and (.conclusion | IN("success","neutral","skipped") | not))] | length' <<<"${runs}")
            if (( failed > 0 )); then
              jq -r '.[] | select(.status == "completed" and (.conclusion | IN("success","neutral","skipped") | not)) | "FAILED: \(.name) [\(.conclusion)] \(.html_url)"' <<<"${runs}" >&2
              exit 1
            fi
            incomplete=$(jq '[.[] | select(.status != "completed")] | length' <<<"${runs}")
            if (( observed == 1 && incomplete == 0 )); then
              jq -r '.[] | "PASS: \(.name) [\(.conclusion)]"' <<<"${runs}"
              exit 0
            fi
            sleep 30
          done
          echo 'Timed out waiting for Increment 49 final-head workflows.' >&2
          exit 1

      - name: Publish and squash-merge Increment 49
        shell: bash
        run: |
          set -euo pipefail
          pr_number=$(gh pr list \
            --repo "${REPOSITORY}" \
            --head "${FEATURE_BRANCH}" \
            --base "${BASE_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [[ -z "${pr_number}" ]]; then
            gh pr create \
              --repo "${REPOSITORY}" \
              --base "${BASE_BRANCH}" \
              --head "${FEATURE_BRANCH}" \
              --title 'Increment 49: native Int symbolic provenance propagation' \
              --body 'Implements and validates Increment 49 from the controlling parameterized-Verilog roadmap. The branch passed all implementation-head and final-head workflows before merge.'
            pr_number=$(gh pr list --repo "${REPOSITORY}" --head "${FEATURE_BRANCH}" --base "${BASE_BRANCH}" --state open --json number --jq '.[0].number')
          fi
          if gh pr view "${pr_number}" --repo "${REPOSITORY}" --json isDraft --jq '.isDraft' | grep -qx true; then
            gh pr ready "${pr_number}" --repo "${REPOSITORY}"
          fi
          gh pr merge "${pr_number}" --repo "${REPOSITORY}" --squash --delete-branch

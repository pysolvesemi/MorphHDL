name: Increment 52 current ownership diagnostic

on:
  pull_request:
    branches:
      - parameterized-verilog

permissions:
  contents: write

jobs:
  diagnostic:
    if: github.event.pull_request.head.ref == 'agent/increment-52-post-merge-overlap-fix' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out Increment 52 branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-52-post-merge-overlap-fix
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize shared-process candidate and enrich failure evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_increment52_shared_process_fix.py')
          text = path.read_text(encoding='utf-8')
          old = 'mkString("\\n")'
          new = 'mkString("\\\\n")'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected two Scala newline escape sites, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 .github/scripts/apply_increment52_shared_process_fix.py

          python3 - <<'PY'
          from pathlib import Path
          path = Path('morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala')
          text = path.read_text(encoding='utf-8')
          old = '''                      s"shared native process ${range.start}-${range.end} contains selected assignment '$stripped' without branch-unique source evidence"
'''
          new = '''                      s"shared native process ${range.start}-${range.end} contains selected assignment '$stripped' without branch-unique source evidence; rhs=${identifierTokens(statement.group(3)).toVector.sorted.mkString("[", ",", "]")}; claimants=${claimants.zipWithIndex.map { case (plan, claimIndex) => s"$claimIndex:owned=${plan.ownedNames.toVector.sorted.mkString("[", ",", "]")}:unique=${uniqueEvidence(plan.block).toVector.sorted.mkString("[", ",", "]")}:children=${plan.block.children.flatMap(child => Option(child.getName())).sorted.mkString("[", ",", "]")}" }.mkString(";")}"
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one unowned diagnostic site, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Record exact dual-Scala ownership evidence
        shell: bash
        run: |
          set +e
          : > /tmp/increment52-current-ownership.log
          for scala_version in 2.12.18 2.13.12; do
            echo "===== Scala $scala_version =====" >> /tmp/increment52-current-ownership.log
            /tmp/morphhdl-mill morph[$scala_version].testOnly \
              morphhdl.NativeIntNestedSymbolicControlFlowTests \
              >> /tmp/increment52-current-ownership.log 2>&1
            echo "status=$?" >> /tmp/increment52-current-ownership.log
          done
          set -e
          {
            git rev-parse HEAD
            grep -F 'SPINAL-PARAMETERIZED-VERILOG-STRUCTURAL-SHARED-PROCESS-ASSIGNMENT-UNOWNED' \
              /tmp/increment52-current-ownership.log | tail -n 8 || true
            echo '--- focused summaries ---'
            grep -E '===== Scala|status=|Tests: succeeded|TESTS FAILED|All tests passed' \
              /tmp/increment52-current-ownership.log | tail -n 80 || true
          } > .github/increment-52-current-ownership.txt

          git checkout -- morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala \
                          .github/scripts/apply_increment52_shared_process_fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/increment-52-current-ownership.txt
          git commit -m 'Record current Increment 52 ownership evidence'
          git push origin HEAD:agent/increment-52-post-merge-overlap-fix

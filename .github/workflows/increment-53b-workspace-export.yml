name: Publish Increment 53b implementation

on:
  push:
    branches:
      - agent/increment-53b-native-streamwidth-adapter
    paths:
      - .github/workflows/increment-53b-workspace-export.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/increment-53b-native-streamwidth-adapter

      - name: Apply exact staged implementation
        shell: bash
        run: |
          set -euo pipefail

          cat .github/inc53b-patch/part-*.b64 \
            | tr -d '\r\n' \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/inc53b.patch

          echo "822718c9102db683f79d54b24d4a273b38009f77f9be5479f2875110be64e4e4  /tmp/inc53b.patch" \
            | sha256sum --check --strict

          git apply --check /tmp/inc53b.patch
          git apply --index /tmp/inc53b.patch
          git rm -rf .github/inc53b-patch
          git rm -f .github/workflows/increment-53b-workspace-export.yml

          git diff --cached --check
          if git diff --cached --name-only | grep -Eq '^(core|lib|idslplugin)/'; then
            echo "Increment 53b must not modify native SpinalHDL source" >&2
            exit 1
          fi

          git config user.name "MorphHDL Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: parameterize native StreamWidthAdapter without source edits"
          git push origin HEAD:agent/increment-53b-native-streamwidth-adapter

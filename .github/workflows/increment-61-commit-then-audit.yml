name: Increment 61 commit then audit phase-order repair

on:
  push:
    branches:
      - agent/increment-61-one-file-per-component
    paths:
      - '.github/workflows/increment-61-commit-then-audit.yml'
      - 'morphhdl/repair-61-phase-order-v3/apply.py'
      - 'morphhdl/repair-61-phase-order-v3/trigger.txt'

permissions:
  contents: write

concurrency:
  group: increment-61-commit-then-audit
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and stage the exact repair
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/repair-61-phase-order-v3/apply.py
          git rm -f --ignore-unmatch \
            .github/workflows/increment-61-apply-phase-order.yml \
            .github/workflows/increment-61-finalize-phase-order.yml \
            .github/workflows/increment-61-commit-then-audit.yml \
            morphhdl/repair-61-phase-order/apply.py \
            morphhdl/repair-61-phase-order-v2/apply.py \
            morphhdl/repair-61-phase-order-v2/trigger.txt \
            morphhdl/repair-61-phase-order-v3/apply.py \
            morphhdl/repair-61-phase-order-v3/trigger.txt
          git add \
            morphhdl/contracts/increment-61-source-review.json \
            morphhdl/scripts/check-increment-61-source-review.py \
            morphhdl/src/main/scala/morphhdl/MorphVerilog.scala \
            morphhdl/src/test/scala/morphhdl/Increment61PerComponentPublicationTests.scala
          git diff --cached --check

      - name: Commit, audit the resulting HEAD, and publish
        shell: bash
        run: |
          set -euo pipefail
          original=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m '61: preserve signedness phase boundary in split publication' \
            -m 'Install the recursive per-component adapter only for split publication and before caller phase inserters, preserving strict signedness adjacency. Add focused split/consolidated coverage, delete every temporary repair artifact, and refresh the exact source-review contract without weakening inherited audits.'
          python3 morphhdl/scripts/check-increment-61-source-review.py
          python3 morphhdl/scripts/check-increment-61-source-review.py --self-test
          remote=$(git ls-remote origin refs/heads/agent/increment-61-one-file-per-component | cut -f1)
          test "$remote" = "$original"
          git push origin HEAD:refs/heads/agent/increment-61-one-file-per-component

name: WA-04 source materialization

on:
  push:
    branches:
      - agent/wa-04-unnamed-simple-wire-elimination
    paths:
      - ".github/workflows/wa04-materialize.yml"
      - "morphhdl-passes/.wa04-materialize/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out staged branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize and verify WA-04 sources
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/wa04-materialize.tar.xz"
          stage="${RUNNER_TEMP}/wa04-materialize"
          cat morphhdl-passes/.wa04-materialize/wa04.tar.xz.b64.* | base64 --decode > "${archive}"
          echo "1ff0e3d714e0765d060ff7436cc026d418b3a74b3000116b9b78587a566c620c  ${archive}" | sha256sum -c -
          rm -rf "${stage}"
          mkdir -p "${stage}"
          tar -xJf "${archive}" -C "${stage}"
          cp -a "${stage}/." .
          chmod 0755 morphhdl-passes/scripts/check-wa04-pass.py
          rm -rf morphhdl-passes/.wa04-materialize

          bash morphhdl-passes/scripts/test-boundary-guard.sh
          python3 morphhdl-passes/scripts/check-wa02-adapter-boundary.py --self-test
          python3 morphhdl-passes/scripts/check-wa02-adapter-boundary.py
          python3 morphhdl-passes/scripts/check-wa03-gates.py --self-test
          python3 morphhdl-passes/scripts/check-wa03-gates.py
          python3 morphhdl-passes/scripts/check-wa04-pass.py --self-test
          python3 morphhdl-passes/scripts/check-wa04-pass.py
          python3 morphhdl-passes/scripts/validate_wire_assignment_equivalence.py --self-test

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair WA-04 pre-emission proof bridge"
          git push origin "HEAD:${GITHUB_REF_NAME}"

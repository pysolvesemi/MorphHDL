name: Finalize Increment 53c roadmap

on:
  push:
    branches:
      - agent/increment-53c-native-axi4-slave-factory-offsets

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Increment 53c branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53c-native-axi4-slave-factory-offsets
          fetch-depth: 0

      - name: Mark Increment 53c complete and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/morphhdl/parameterized-verilog-todo.md")
          text = path.read_text()
          unchecked = "- [ ] **Increment 53c — Native AXI4 Slave Factory parameterized offsets**"
          checked = "- [x] **Increment 53c — Native AXI4 Slave Factory parameterized offsets**"
          if text.count(unchecked) != 1:
              raise SystemExit("Increment 53c unchecked roadmap entry was missing or ambiguous")
          if checked in text:
              raise SystemExit("Increment 53c was already checked before finalization")
          if "- [x] **Increment 53a — Native StreamFifo concrete-witness formal equivalence**" not in text:
              raise SystemExit("Increment 53a dependency is not complete")
          if "- [x] **Increment 53b — MorphHDL-owned module-local SpinalEnum parameters**" not in text:
              raise SystemExit("Increment 53b dependency is not complete")
          path.write_text(text.replace(unchecked, checked, 1))
          PY

          git rm --force .github/workflows/morphhdl-increment-53c-finalize.yml
          git add docs/morphhdl/parameterized-verilog-todo.md
          git diff --cached --check
          git commit -m "Mark Increment 53c complete"
          git push origin HEAD:agent/increment-53c-native-axi4-slave-factory-offsets

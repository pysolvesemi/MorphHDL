name: Increment 53 apply structural fix

on:
  push:
    branches:
      - agent/increment-53-native-streamfifo-clean
    paths:
      - .github/workflows/increment-53-apply-structural-fix.yml
      - morphhdl/scripts/increment-53-production.patch

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53-native-streamfifo-clean
          fetch-depth: 0
      - name: Apply exact reviewed structural patch
        shell: bash
        run: |
          set -euo pipefail
          patch=morphhdl/scripts/increment-53-production.patch
          workflow=.github/workflows/increment-53-apply-structural-fix.yml
          [[ -s "$patch" ]]
          git apply --index "$patch"
          git rm "$patch" "$workflow"
          git diff --cached --check
          git config user.name 'MorphHDL Increment Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(morphhdl): retain omitted native structural branches'
          git push origin HEAD:agent/increment-53-native-streamfifo-clean

name: Temporary Increment 53c enum snake-case patch

on:
  push:
    branches:
      - agent/increment-53c-enum-screaming-snake-localparams

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Increment 53c branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewable Increment 53c source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/apply-inc53c-enum-snake-case-patch.py

          git config user.name "MorphHDL Increment Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/morphhdl/parameterized-verilog-todo.md \
            morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalEnumLocalizer.scala \
            morphhdl/src/test/scala/morphhdl/SpinalEnumLocalParameterTests.scala
          if git diff --cached --quiet; then
            echo "Increment 53c source is already patched"
            exit 0
          fi
          git commit -m "feat(morphhdl): emit snake-case enum localparams"
          git push origin "HEAD:${GITHUB_REF_NAME}"

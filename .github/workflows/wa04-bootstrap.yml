name: WA-04 staged source bootstrap

on:
  push:
    branches:
      - agent/wa-04-unnamed-simple-wire-elimination

permissions:
  contents: write

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[wa04-bootstrap]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize reviewed WA-04 sources
        shell: bash
        run: |
          set -euo pipefail
          cat morphhdl-passes/.bootstrap/wa04.tar.xz.b64.* | base64 --decode > /tmp/wa04-stage.tar.xz
          echo "1d168b702fcef76031addb79a9851face485307c51268752ceb55be93b9cd7ee  /tmp/wa04-stage.tar.xz" | sha256sum -c -
          rm -rf /tmp/wa04-stage
          mkdir -p /tmp/wa04-stage
          tar -xJf /tmp/wa04-stage.tar.xz -C /tmp/wa04-stage

          install -m 0644 /tmp/wa04-stage/README.md morphhdl-passes/README.md
          install -m 0644 /tmp/wa04-stage/examples/ParameterizedStreamFifo.scala morphhdl-passes/examples/ParameterizedStreamFifo.scala
          install -m 0755 /tmp/wa04-stage/scripts/check-wa03-gates.py morphhdl-passes/scripts/check-wa03-gates.py
          install -m 0755 /tmp/wa04-stage/scripts/check-wa04-pass.py morphhdl-passes/scripts/check-wa04-pass.py
          install -D -m 0644 /tmp/wa04-stage/src/main/scala/morphhdl/passes/transform/UnnamedWireAliasEliminationPass.scala morphhdl-passes/src/main/scala/morphhdl/passes/transform/UnnamedWireAliasEliminationPass.scala
          install -D -m 0644 /tmp/wa04-stage/src/test/scala/morphhdl/passes/transform/UnnamedWireAliasEliminationPassSpec.scala morphhdl-passes/src/test/scala/morphhdl/passes/transform/UnnamedWireAliasEliminationPassSpec.scala
          install -m 0644 /tmp/wa04-stage/tests/formal_model/wire_assignment_ir/expected-signatures.json morphhdl-passes/tests/formal_model/wire_assignment_ir/expected-signatures.json

          python3 morphhdl-passes/scripts/check-wa03-gates.py --self-test
          python3 morphhdl-passes/scripts/check-wa04-pass.py --self-test
          cp .github/workflows/morphhdl-passes.yml /tmp/original-morphhdl-passes.yml
          install -m 0644 /tmp/wa04-stage/morphhdl-passes.yml .github/workflows/morphhdl-passes.yml
          python3 morphhdl-passes/scripts/check-wa04-pass.py
          install -m 0644 /tmp/original-morphhdl-passes.yml .github/workflows/morphhdl-passes.yml

          rm -rf morphhdl-passes/.bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet -- .github/workflows || {
            echo 'bootstrap must not push workflow changes' >&2
            exit 1
          }
          git commit -m "Implement WA-04 unnamed simple-wire elimination"
          git push origin "HEAD:${GITHUB_REF_NAME}"

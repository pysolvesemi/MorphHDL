name: Increment 59 source diagnostic

on:
  push:
    branches:
      - agent/increment-59-typed-blackbox-generics
    paths:
      - .github/workflows/increment-59-source-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-59-typed-blackbox-generics
          fetch-depth: 0

      - name: Run and record every source validation command
        shell: bash
        run: |
          set -u
          python3 .github/apply-increment59-policy.py
          log=.github/increment59-source-validation.txt
          : >"$log"
          status=0
          run_check() {
            printf '\n===== %s =====\n' "$*" >>"$log"
            "$@" >>"$log" 2>&1
            command_status=$?
            printf 'exit_status=%s\n' "$command_status" >>"$log"
            if [[ $command_status -ne 0 ]]; then
              status=1
            fi
          }
          run_check python3 morphhdl/scripts/check-native-source-preservation.py \
            --generate-template morphhdl/contracts/increment-55-native-change-review.json \
            --output morphhdl/contracts/native-source-preservation.json \
            --force
          run_check python3 -m py_compile \
            morphhdl/scripts/check-increment-59-blackbox-generics.py
          run_check python3 morphhdl/scripts/check-increment-59-blackbox-generics.py \
            --self-test
          run_check python3 morphhdl/scripts/check-increment-59-blackbox-generics.py \
            --repo-root .
          run_check python3 morphhdl/scripts/check-native-source-preservation.py \
            --review-policy morphhdl/contracts/increment-55-native-change-review.json \
            --manifest morphhdl/contracts/native-source-preservation.json
          run_check git diff --check

          rm -f \
            .github/apply-increment59-policy.py \
            .github/workflows/increment-59-bootstrap.yml \
            .github/workflows/increment-59-bootstrap-v3.yml \
            .github/workflows/increment-59-bootstrap-v6.yml \
            .github/workflows/increment-59-source-diagnostic.yml \
            .github/increment59-bootstrap-diagnostic.txt \
            .github/increment59-bootstrap-v2-diagnostic.txt \
            .github/increment59-bootstrap-v3-diagnostic.txt \
            .github/increment59-bootstrap-v4-diagnostic.txt \
            .github/increment59-bootstrap-v5-diagnostic.txt
          if [[ $status -eq 0 ]]; then
            rm -f "$log"
          fi

          git config user.name "MorphHDL Increment Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Record Increment 59 source validation"
          git push origin HEAD:agent/increment-59-typed-blackbox-generics
          exit "$status"

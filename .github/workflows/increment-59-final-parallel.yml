name: Increment 59 final parallel qualification

on:
  push:
    branches:
      - agent/increment-59-typed-blackbox-generics

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: increment-59-final-parallel
  cancel-in-progress: false

env:
  BASE_BRANCH: parameterized-verilog
  SOURCE_BRANCH: agent/increment-59-typed-blackbox-generics
  FINAL_BRANCH: agent/increment-59-final-clean

jobs:
  prepare:
    name: Normalize and seal qualification input
    if: github.event.head_commit.message == 'Run Increment 59 final parallel qualification'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          ref: agent/increment-59-typed-blackbox-generics
          fetch-depth: 0
          submodules: recursive

      - name: Normalize source and review policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          hierarchy_path = Path('morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogHierarchy.scala')
          text = hierarchy_path.read_text(encoding='utf-8')

          def remove_duplicate_region(value, marker, next_marker):
              starts = []
              cursor = 0
              while True:
                  found = value.find(marker, cursor)
                  if found < 0:
                      break
                  starts.append(found)
                  cursor = found + len(marker)
              if len(starts) > 2:
                  raise SystemExit(f'unexpected duplicate count {len(starts)} for {marker.strip()}')
              if len(starts) == 2:
                  second = starts[1]
                  end = value.find(next_marker, second)
                  if end < 0:
                      raise SystemExit(f'missing duplicate terminator for {marker.strip()}')
                  value = value[:second] + value[end:]
              return value

          text = remove_duplicate_region(
              text,
              '\n  private final case class BooleanExpressionBinding(',
              '\n  private final case class BindingSignature('
          )
          text = remove_duplicate_region(
              text,
              '\n  private def analyzeBlackBoxInstance(',
              '\n  private def analyzeInstance('
          )
          hierarchy_path.write_text(text, encoding='utf-8')

          policy_path = Path('morphhdl/contracts/increment-55-native-change-review.json')
          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          files = policy['files']
          label = 'Increment 59: typed BlackBox parameter and generic binding'
          blackbox_path = 'core/src/main/scala/spinal/core/BlackBox.scala'
          blackbox_entries = [entry for entry in files if entry['path'] == blackbox_path]
          if len(blackbox_entries) != 1:
              raise SystemExit(f'expected one BlackBox review entry, found {len(blackbox_entries)}')
          entry = blackbox_entries[0]
          entry.update({
              'baseline_path': blackbox_path,
              'change': 'modified',
              'classification': 'typed-overload',
              'reason': 'Add typed ElabInt and ElabBool BlackBox generic overload handling while preserving native concrete witness emission.',
              'edits': [{
                  'id': 'blackbox-typed-generic-01',
                  'kind': 'overload',
                  'owner': 'spinal.core.BlackBox.addGeneric',
                  'reason': 'Retain exact typed BlackBox generic metadata and pass only the concrete witness to the inherited native emitter.',
                  'required_exact_text': [
                      {'side': 'approved', 'text': 'case value: ElabInt =>', 'count': 1},
                      {'side': 'approved', 'text': 'case value: ElabBool =>', 'count': 1},
                      {'side': 'approved', 'text': 'ParameterizedBlackBoxGenericRegistry.retain', 'count': 2},
                  ],
              }],
          })
          introduced = entry.setdefault('introduced_by', [])
          if label not in introduced:
              introduced.append(label)

          registry_path = 'core/src/main/scala/spinal/core/internals/ParameterizedBlackBoxGeneric.scala'
          registry_entries = [entry for entry in files if entry['path'] == registry_path]
          if not registry_entries:
              files.append({
                  'path': registry_path,
                  'baseline_path': None,
                  'change': 'added',
                  'classification': 'typed-support-file',
                  'introduced_by': [label],
                  'reason': 'Retain exact typed BlackBox generic and symbolic packed-port metadata by BlackBox object identity.',
                  'edits': [],
              })
          elif len(registry_entries) != 1:
              raise SystemExit(f'expected at most one registry review entry, found {len(registry_entries)}')

          policy['files'] = sorted(files, key=lambda item: item['path'])
          policy_path.write_text(json.dumps(policy, indent=2) + '\n', encoding='utf-8')
          PY

          test "$(grep -c 'private final case class BooleanExpressionBinding(' morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogHierarchy.scala)" = 1
          test "$(grep -c 'private def analyzeBlackBoxInstance(' morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogHierarchy.scala)" = 1
          python3 morphhdl/scripts/check-increment-59-blackbox-generics.py --self-test
          python3 morphhdl/scripts/check-increment-59-blackbox-generics.py --repo-root .
          git diff --check

      - name: Package exact reviewed normalized files
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/inc59-reviewed-paths.txt <<'EOF'
          core/src/main/scala/spinal/core/BlackBox.scala
          core/src/main/scala/spinal/core/internals/ParameterizedBlackBoxGeneric.scala
          docs/morphhdl/increment-59-typed-blackbox-generics.md
          docs/morphhdl/parameterized-verilog-todo.md
          morphhdl/contracts/increment-55-native-change-review.json
          morphhdl/scripts/check-increment-59-blackbox-generics.py
          morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogHierarchy.scala
          morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala
          morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalParameterizedVerilog.scala
          morphhdl/src/test/scala/morphhdl/TypedBlackBoxGenericBindingTests.scala
          morphhdl/src/test/scala/nativeapplication/TypedBlackBoxGenericBindingFixture.scala
          EOF
          sed -i 's/^          //' /tmp/inc59-reviewed-paths.txt
          tar -czf /tmp/increment-59-normalized-source.tar.gz \
            -T /tmp/inc59-reviewed-paths.txt
          cp /tmp/inc59-reviewed-paths.txt /tmp/increment-59-reviewed-paths.txt
          sha256sum /tmp/increment-59-normalized-source.tar.gz \
            > /tmp/increment-59-normalized-source.sha256

      - name: Upload normalized source input
        uses: actions/upload-artifact@v4
        with:
          name: increment-59-normalized-source
          path: |
            /tmp/increment-59-normalized-source.tar.gz
            /tmp/increment-59-reviewed-paths.txt
            /tmp/increment-59-normalized-source.sha256
          if-no-files-found: error
          retention-days: 7

  sbt:
    name: SBT Scala ${{ matrix.scala_version }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          ref: agent/increment-59-typed-blackbox-generics
          submodules: recursive

      - name: Download and overlay normalized source
        uses: actions/download-artifact@v4
        with:
          name: increment-59-normalized-source
          path: /tmp/inc59-input

      - name: Verify and extract normalized source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/inc59-input
          sha256sum -c increment-59-normalized-source.sha256
          cd "$GITHUB_WORKSPACE"
          tar -xzf /tmp/inc59-input/increment-59-normalized-source.tar.gz

      - name: Compile all sources and run focused tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p increment-59-evidence
          sbt -batch "++${{ matrix.scala_version }}" compile Test/compile \
            2>&1 | tee increment-59-evidence/compile.log
          sbt -batch "++${{ matrix.scala_version }}" \
            'morph/testOnly morphhdl.TypedBlackBoxGenericBindingTests' \
            2>&1 | tee increment-59-evidence/focused.log
          grep -Eq 'Tests: succeeded [1-9][0-9]*, failed 0, canceled 0' \
            increment-59-evidence/focused.log
          grep -Eiq 'mutat|counterexample' increment-59-evidence/focused.log

      - name: Run inherited SBT suites
        shell: bash
        run: |
          set -euo pipefail
          sbt -batch "++${{ matrix.scala_version }}" frontend/test \
            2>&1 | tee increment-59-evidence/frontend.log
          sbt -batch "++${{ matrix.scala_version }}" morphir/test \
            2>&1 | tee increment-59-evidence/morphir.log
          sbt -batch "++${{ matrix.scala_version }}" morph/test \
            2>&1 | tee increment-59-evidence/morph.log

      - name: Upload SBT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59-sbt-${{ matrix.scala_version }}
          path: increment-59-evidence
          if-no-files-found: error
          retention-days: 14

  mill:
    name: Mill Scala ${{ matrix.scala_version }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          ref: agent/increment-59-typed-blackbox-generics
          submodules: recursive

      - name: Download and overlay normalized source
        uses: actions/download-artifact@v4
        with:
          name: increment-59-normalized-source
          path: /tmp/inc59-input

      - name: Verify and extract normalized source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/inc59-input
          sha256sum -c increment-59-normalized-source.sha256
          cd "$GITHUB_WORKSPACE"
          tar -xzf /tmp/inc59-input/increment-59-normalized-source.tar.gz

      - name: Install pinned Mill
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/mill
          chmod +x /tmp/mill

      - name: Run focused and inherited Mill suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p increment-59-evidence
          /tmp/mill "morph[${{ matrix.scala_version }}].testOnly" \
            morphhdl.TypedBlackBoxGenericBindingTests \
            2>&1 | tee increment-59-evidence/focused.log
          /tmp/mill "frontend[${{ matrix.scala_version }}].test" \
            2>&1 | tee increment-59-evidence/frontend.log
          /tmp/mill "morphir[${{ matrix.scala_version }}].test" \
            2>&1 | tee increment-59-evidence/morphir.log
          /tmp/mill "morph[${{ matrix.scala_version }}].test" \
            2>&1 | tee increment-59-evidence/morph.log

      - name: Upload Mill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59-mill-${{ matrix.scala_version }}
          path: increment-59-evidence
          if-no-files-found: error
          retention-days: 14

  strict-formal:
    name: Strict Verilog, simulation, synthesis and formal
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          ref: agent/increment-59-typed-blackbox-generics
          submodules: recursive

      - name: Download and overlay normalized source
        uses: actions/download-artifact@v4
        with:
          name: increment-59-normalized-source
          path: /tmp/inc59-input

      - name: Verify and extract normalized source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/inc59-input
          sha256sum -c increment-59-normalized-source.sha256
          cd "$GITHUB_WORKSPACE"
          tar -xzf /tmp/inc59-input/increment-59-normalized-source.tar.gz

      - name: Enable every focused formal switch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p increment-59-evidence/formal
          test_file=morphhdl/src/test/scala/morphhdl/TypedBlackBoxGenericBindingTests.scala
          grep -Eiq 'formal|sby|yosys|equiv' "$test_file"
          grep -Eiq 'mutat|counterexample' "$test_file"
          printf '%s\n' \
            'MORPHDL_RUN_TYPED_BLACKBOX_FORMAL_EQUIVALENCE=1' \
            "MORPHDL_TYPED_BLACKBOX_FORMAL_WORKSPACE=$GITHUB_WORKSPACE/increment-59-evidence/formal/default" \
            >> "$GITHUB_ENV"
          grep -RhoE 'MORPHDL_RUN_[A-Z0-9_]+' "$test_file" \
            | LC_ALL=C sort -u > /tmp/inc59-run-vars.txt || true
          grep -RhoE 'MORPHDL_[A-Z0-9_]*WORKSPACE[A-Z0-9_]*' "$test_file" \
            | LC_ALL=C sort -u > /tmp/inc59-workspace-vars.txt || true
          while IFS= read -r variable; do
            [[ -z "$variable" ]] && continue
            printf '%s=1\n' "$variable" >> "$GITHUB_ENV"
          done < /tmp/inc59-run-vars.txt
          while IFS= read -r variable; do
            [[ -z "$variable" ]] && continue
            printf '%s=%s/increment-59-evidence/formal/%s\n' \
              "$variable" "$GITHUB_WORKSPACE" "$variable" >> "$GITHUB_ENV"
          done < /tmp/inc59-workspace-vars.txt

      - name: Verify strict tools
        shell: bash
        run: |
          set -euo pipefail
          command -v verilator
          command -v iverilog
          command -v vvp
          command -v yosys
          command -v sby
          command -v yices-smt2
          verilator --version | tee increment-59-evidence/verilator-version.txt
          iverilog -V 2>&1 | tee increment-59-evidence/iverilog-version.txt
          yosys -V | tee increment-59-evidence/yosys-version.txt
          sby -h > increment-59-evidence/sby-help.txt 2>&1

      - name: Run focused formal and strict contracts
        shell: bash
        run: |
          set -euo pipefail
          sbt -batch '++2.13.12' \
            'morph/testOnly morphhdl.TypedBlackBoxGenericBindingTests' \
            2>&1 | tee increment-59-evidence/focused-formal.log
          grep -Eq 'Tests: succeeded [1-9][0-9]*, failed 0, canceled 0' \
            increment-59-evidence/focused-formal.log
          find increment-59-evidence/formal -type f -print | LC_ALL=C sort \
            | tee increment-59-evidence/formal-files.txt
          test -s increment-59-evidence/formal-files.txt
          grep -RiqE 'PASS|passed|successful|status.*pass' increment-59-evidence/formal

          mkdir -p target/morphhdl/phase-inventory
          sbt -batch '++2.13.12' \
            "core/Test/runMain spinal.core.internals.ValidationParityInventoryWriter --output ${GITHUB_WORKSPACE}/target/morphhdl/phase-inventory/validation-phase-ids.txt"
          bash morphhdl/scripts/check-contracts.sh \
            --require-tools \
            --live-phase-ids target/morphhdl/phase-inventory/validation-phase-ids.txt \
            2>&1 | tee increment-59-evidence/strict-contracts.log
          python3 morphhdl/scripts/check-production-retirement.py --self-test \
            2>&1 | tee increment-59-evidence/production-retirement-self-test.log
          python3 morphhdl/scripts/check-production-retirement.py \
            2>&1 | tee increment-59-evidence/production-retirement.log
          python3 morphhdl/scripts/check-typed-layering-ir.py --self-test \
            2>&1 | tee increment-59-evidence/typed-layering-self-test.log
          python3 morphhdl/scripts/check-typed-layering-ir.py \
            2>&1 | tee increment-59-evidence/typed-layering.log
          python3 morphhdl/scripts/check-native-source-preservation.py --self-test \
            2>&1 | tee increment-59-evidence/native-source-self-test.log
          python3 morphhdl/scripts/check-typed-native-source-overlay.py --self-test \
            2>&1 | tee increment-59-evidence/native-overlay-self-test.log

      - name: Upload strict and formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59-strict-formal
          path: increment-59-evidence
          if-no-files-found: error
          retention-days: 30

  finalize:
    name: Build clean PR, mark complete and merge
    needs: [prepare, sbt, mill, strict-formal]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          ref: agent/increment-59-typed-blackbox-generics
          fetch-depth: 0
          submodules: recursive

      - name: Download qualification source and evidence
        uses: actions/download-artifact@v4
        with:
          pattern: increment-59-*
          path: /tmp/inc59-artifacts
          merge-multiple: false

      - name: Verify normalized source archive
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/inc59-artifacts/increment-59-normalized-source
          sha256sum -c increment-59-normalized-source.sha256
          cp increment-59-normalized-source.tar.gz /tmp/inc59-source.tar.gz
          cp increment-59-reviewed-paths.txt /tmp/inc59-reviewed-paths.txt
          mkdir -p "$GITHUB_WORKSPACE/increment-59-final-evidence/qualification"
          find /tmp/inc59-artifacts -maxdepth 2 -type f -print | LC_ALL=C sort \
            > "$GITHUB_WORKSPACE/increment-59-final-evidence/qualification/artifacts.txt"
          cp -R /tmp/inc59-artifacts/increment-59-sbt-* \
            "$GITHUB_WORKSPACE/increment-59-final-evidence/qualification/" || true
          cp -R /tmp/inc59-artifacts/increment-59-mill-* \
            "$GITHUB_WORKSPACE/increment-59-final-evidence/qualification/" || true
          cp -R /tmp/inc59-artifacts/increment-59-strict-formal \
            "$GITHUB_WORKSPACE/increment-59-final-evidence/qualification/"

      - name: Construct final branch from latest parameterized-verilog
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_BRANCH"
          git checkout -B "$FINAL_BRANCH" "origin/$BASE_BRANCH"
          tar -xzf /tmp/inc59-source.tar.gz

          todo=docs/morphhdl/parameterized-verilog-todo.md
          sed -i 's/^- \[x\] \*\*Increment 59 — Typed BlackBox parameter and generic binding\*\*$/- [ ] **Increment 59 — Typed BlackBox parameter and generic binding**/' "$todo"
          grep -Fqx -- '- [ ] **Increment 59 — Typed BlackBox parameter and generic binding**' "$todo"

          git config user.name 'MorphHDL Increment Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Increment 59 typed BlackBox parameter binding'

          python3 morphhdl/scripts/check-native-source-preservation.py \
            --generate-template morphhdl/contracts/increment-55-native-change-review.json \
            --output morphhdl/contracts/native-source-preservation.json \
            --force \
            2>&1 | tee increment-59-final-evidence/native-manifest-generation.log
          python3 morphhdl/scripts/check-native-source-preservation.py \
            2>&1 | tee increment-59-final-evidence/native-manifest-validation.log

          sed -i 's/^- \[ \] \*\*Increment 59 — Typed BlackBox parameter and generic binding\*\*$/- [x] **Increment 59 — Typed BlackBox parameter and generic binding**/' "$todo"
          grep -Fqx -- '- [x] **Increment 59 — Typed BlackBox parameter and generic binding**' "$todo"

          git add -A
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          base = 'origin/parameterized-verilog'
          output = subprocess.run(
              ['git', 'diff', '--cached', '--name-only', '--diff-filter=ACMRTD', base],
              check=True,
              text=True,
              stdout=subprocess.PIPE,
          ).stdout.splitlines()
          excluded = {'docs/morphhdl/parameterized-verilog-todo.md'}
          scope_path = Path('morphhdl/contracts/increment-59-source-scope.txt')
          names = {name for name in output if name and name not in excluded}
          names.add(scope_path.as_posix())
          scope_path.write_text('\n'.join(sorted(names)) + '\n', encoding='utf-8')
          PY
          git add morphhdl/contracts/increment-59-source-scope.txt

          python3 morphhdl/scripts/check-increment-59-blackbox-generics.py --self-test
          python3 morphhdl/scripts/check-increment-59-blackbox-generics.py --repo-root .
          python3 morphhdl/scripts/check-native-source-preservation.py
          python3 morphhdl/scripts/check-production-retirement.py
          python3 morphhdl/scripts/check-typed-layering-ir.py
          python3 morphhdl/scripts/check-typed-native-source-overlay.py
          bash morphhdl/scripts/check-contracts.sh
          git diff --check
          git commit -m 'Seal Increment 59 proof and mark roadmap complete'

      - name: Run final-head dual-Scala focused qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p increment-59-final-evidence/final-head
          for scala_version in 2.12.18 2.13.12; do
            sbt -batch "++${scala_version}" \
              'morph/testOnly morphhdl.TypedBlackBoxGenericBindingTests' \
              2>&1 | tee "increment-59-final-evidence/final-head/focused-${scala_version}.log"
            grep -Eq 'Tests: succeeded [1-9][0-9]*, failed 0, canceled 0' \
              "increment-59-final-evidence/final-head/focused-${scala_version}.log"
          done
          actual="$(git diff --name-only --diff-filter=ACMRTD "origin/$BASE_BRANCH"...HEAD \
            | awk '$0 != "docs/morphhdl/parameterized-verilog-todo.md"' \
            | LC_ALL=C sort -u)"
          expected="$(cat morphhdl/contracts/increment-59-source-scope.txt)"
          test "$actual" = "$expected"
          git diff --check "origin/$BASE_BRANCH"...HEAD
          python3 morphhdl/scripts/check-native-source-preservation.py

      - name: Push clean branch and create pull request
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin HEAD:"$FINAL_BRANCH"
          clean_sha="$(git rev-parse HEAD)"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          encoded_head="${FINAL_BRANCH//\//%2F}"
          curl --fail --silent --show-error "${auth[@]}" \
            "$api/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}%3A${encoded_head}&base=$BASE_BRANCH&per_page=20" \
            > /tmp/inc59-open-prs.json
          pr="$(python3 -c 'import json; values=json.load(open("/tmp/inc59-open-prs.json")); print(values[0]["number"] if values else "")')"
          if [[ -z "$pr" ]]; then
            python3 - <<'PY' > /tmp/inc59-create-pr.json
          import json, os
          print(json.dumps({
              'title': 'Increment 59 — Typed BlackBox parameter and generic binding',
              'head': os.environ['FINAL_BRANCH'],
              'base': os.environ['BASE_BRANCH'],
              'body': 'Completes typed ElabInt/ElabBool BlackBox generic binding, symbolic packed-port association, native Verilog/VHDL witness compatibility, strict Verilog-2001 qualification, simulation, synthesis, formal equivalence, mutation sensitivity, deterministic replay, both supported Scala lanes, and inherited source/architecture gates.',
          }))
          PY
            curl --fail --silent --show-error -X POST "${auth[@]}" \
              "$api/pulls" --data-binary @/tmp/inc59-create-pr.json \
              > /tmp/inc59-created-pr.json
            pr="$(python3 -c 'import json; print(json.load(open("/tmp/inc59-created-pr.json"))["number"])')"
          fi
          test -n "$pr"
          printf 'clean_sha=%s\npr=%s\n' "$clean_sha" "$pr" >> "$GITHUB_OUTPUT"
          printf 'PR_NUMBER=%s\nCLEAN_SHA=%s\n' "$pr" "$clean_sha" \
            > increment-59-final-evidence/published-pr.txt

      - name: Merge the exact qualified revision
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.publish.outputs.pr }}
          CLEAN_SHA: ${{ steps.publish.outputs.clean_sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          python3 - <<'PY' > /tmp/inc59-merge.json
          import json, os
          print(json.dumps({
              'commit_title': 'Increment 59 — Typed BlackBox parameter and generic binding',
              'commit_message': 'Merge the fully qualified clean Increment 59 revision.',
              'sha': os.environ['CLEAN_SHA'],
              'merge_method': 'merge',
          }))
          PY
          curl --fail --silent --show-error -X PUT "${auth[@]}" \
            "$api/pulls/$PR_NUMBER/merge" --data-binary @/tmp/inc59-merge.json \
            > /tmp/inc59-merge-result.json
          merge_sha="$(python3 -c 'import json; value=json.load(open("/tmp/inc59-merge-result.json")); assert value.get("merged"), value; print(value["sha"])')"
          printf 'merge_sha=%s\n' "$merge_sha" >> "$GITHUB_OUTPUT"
          printf 'MERGE_SHA=%s\n' "$merge_sha" >> increment-59-final-evidence/published-pr.txt

      - name: Close superseded dirty Increment 59 PRs
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_PR: ${{ steps.publish.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail --silent --show-error "${auth[@]}" \
            "$api/pulls?state=open&base=$BASE_BRANCH&per_page=100" \
            > /tmp/inc59-all-open-prs.json
          python3 - <<'PY' > /tmp/inc59-stale-prs.txt
          import json, os
          clean = int(os.environ['CLEAN_PR'])
          for value in json.load(open('/tmp/inc59-all-open-prs.json')):
              head = value['head']['ref']
              if value['number'] != clean and 'increment-59' in head:
                  print(value['number'])
          PY
          while IFS= read -r stale_pr; do
            [[ -z "$stale_pr" ]] && continue
            printf '{"state":"closed"}\n' > /tmp/inc59-close.json
            curl --fail --silent --show-error -X PATCH "${auth[@]}" \
              "$api/pulls/$stale_pr" --data-binary @/tmp/inc59-close.json >/dev/null
          done < /tmp/inc59-stale-prs.txt

      - name: Verify merged base and checked roadmap
        env:
          PR_NUMBER: ${{ steps.publish.outputs.pr }}
          CLEAN_SHA: ${{ steps.publish.outputs.clean_sha }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_BRANCH"
          base_sha="$(git rev-parse "origin/$BASE_BRANCH")"
          git merge-base --is-ancestor "$CLEAN_SHA" "$base_sha"
          git show "origin/$BASE_BRANCH:docs/morphhdl/parameterized-verilog-todo.md" \
            | grep -Fqx -- '- [x] **Increment 59 — Typed BlackBox parameter and generic binding**'
          git show "origin/$BASE_BRANCH:morphhdl/contracts/increment-59-source-scope.txt" >/dev/null
          cat > increment-59-final-evidence/merge-status.txt <<EOF
          MERGED_AND_VERIFIED
          pr=$PR_NUMBER
          clean_feature=$CLEAN_SHA
          merge_commit=$MERGE_SHA
          parameterized_verilog=$base_sha
          roadmap_increment_59=checked
          EOF
          sed -i 's/^          //' increment-59-final-evidence/merge-status.txt
          cat increment-59-final-evidence/merge-status.txt

      - name: Upload final complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59-final-complete-evidence
          path: increment-59-final-evidence
          if-no-files-found: error
          retention-days: 30

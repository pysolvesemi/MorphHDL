name: Validate Increment 53d typed factory direction repair

on:
  push:
    branches:
      - agent/increment-53d-typed-elabint-pivot
    paths:
      - .github/workflows/increment-53d-typed-adapter-publisher-v2.yml
      - morphhdl/scripts/increment-53d-direct-typed-adapter.patch.gz.b64
      - morphhdl/scripts/increment-53d-typed-factory-dispatch.patch.gz.b64
      - morphhdl/scripts/increment-53d-typed-factory-direction-test.patch.gz.b64
      - morphhdl/scripts/increment-53d-direction-probe.patch.gz.b64
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-53d-typed-factory-direction-repair
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-typed-elabint-pivot
          fetch-depth: 0
      - name: Install pinned Mill
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/mill
          chmod +x /tmp/mill
      - name: Apply typed adapter, factory repair, and direction regressions
        shell: bash
        run: |
          set -euo pipefail
          base64 -d morphhdl/scripts/increment-53d-direct-typed-adapter.patch.gz.b64 \
            | gzip -d \
            | git apply --whitespace=nowarn
          base64 -d morphhdl/scripts/increment-53d-typed-factory-dispatch.patch.gz.b64 \
            | gzip -d \
            | git apply --whitespace=nowarn
          base64 -d morphhdl/scripts/increment-53d-typed-factory-direction-test.patch.gz.b64 \
            | gzip -d \
            | git apply --whitespace=nowarn
          base64 -d morphhdl/scripts/increment-53d-direction-probe.patch.gz.b64 \
            | gzip -d \
            | git apply --whitespace=nowarn
          git diff --check
      - name: Run isolated adapter and factory suites
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          /tmp/mill morph[2.13.12].testOnly \
            morphhdl.ParameterizedStreamWidthAdapterTests \
            morphhdl.TypedParameterizedFactoryDirectionTests \
            > /tmp/inc53d-factory-repair.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/inc53d-factory-repair.status
          tail -n 300 /tmp/inc53d-factory-repair.log
          exit "$status"
      - name: Upload factory repair diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inc53d-factory-repair
          path: |
            /tmp/inc53d-factory-repair.log
            /tmp/inc53d-factory-repair.status
          if-no-files-found: error
          retention-days: 2
      - name: Preserve suite result
        if: always()
        shell: bash
        run: exit "$(cat /tmp/inc53d-factory-repair.status 2>/dev/null || printf '1')"

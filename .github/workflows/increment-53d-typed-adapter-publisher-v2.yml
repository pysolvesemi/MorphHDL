name: Export Increment 53d direct typed adapter candidate

on:
  push:
    branches:
      - agent/increment-53d-typed-elabint-pivot
    paths:
      - .github/workflows/increment-53d-typed-adapter-publisher-v2.yml
      - morphhdl/scripts/increment-53d-direct-typed-adapter.patch.gz.b64
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-53d-direct-typed-adapter-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-typed-elabint-pivot
          fetch-depth: 0
      - name: Apply direct typed candidate
        shell: bash
        run: |
          set -euo pipefail
          base64 -d morphhdl/scripts/increment-53d-direct-typed-adapter.patch.gz.b64 \
            | gzip -d \
            | git apply --whitespace=nowarn
          git diff --check
      - name: Upload exact post-patch source
        uses: actions/upload-artifact@v4
        with:
          name: inc53d-direct-typed-source
          path: |
            core/src/main/scala/spinal/core/ElabInt.scala
            core/src/main/scala/spinal/core/ParameterizedWidth.scala
            lib/src/main/scala/spinal/lib/Stream.scala
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala
            morphhdl/src/test/scala/morphhdl/ParameterizedStreamWidthAdapterTests.scala
            docs/morphhdl/increment-53d-typed-native-change-manifest.md
          if-no-files-found: error
          retention-days: 2

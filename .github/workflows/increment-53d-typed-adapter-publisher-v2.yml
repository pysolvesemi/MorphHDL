name: Publish validated Increment 53d typed StreamWidthAdapter v2

on:
  push:
    branches:
      - agent/increment-53d-typed-elabint-pivot
    paths:
      - .github/workflows/increment-53d-typed-adapter-publisher-v2.yml
      - morphhdl/scripts/apply-increment-53d-typed-streamwidthadapter.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-53d-typed-adapter-publisher-v2
  cancel-in-progress: true

jobs:
  source-contract:
    name: Typed source and architecture contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-typed-elabint-pivot
          fetch-depth: 0
      - name: Apply typed migration and audit the native delta
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/apply-increment-53d-typed-streamwidthadapter.py
          git diff --check
          changed_native="$(git diff --name-only HEAD -- core lib idslplugin | sort)"
          test "$changed_native" = 'lib/src/main/scala/spinal/lib/Stream.scala'
          python3 - <<'PY'
          from pathlib import Path
          text = Path('lib/src/main/scala/spinal/lib/Stream.scala').read_text()
          start = text.index('object StreamWidthAdapter {')
          end = text.index('//padding=true allow', start)
          body = text[start:end]
          assert 'widthOfExpr(input.payload)' in body
          assert 'widthOfExpr(output.payload)' in body
          assert 'val factorExpr' in body
          assert 'StreamWidthAdapter downsize factor' in body
          assert 'StreamWidthAdapter upsize factor' in body
          assert 'NativeIntShadow' not in body
          assert 'withWidthFunctionBoundary' not in body
          assert 'rewriteParameterizedStreamWidthAdapter' not in text
          PY

  sbt:
    name: SBT typed adapter Scala ${{ matrix.scala_version }}
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version: ["2.12.18", "2.13.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-typed-elabint-pivot
          fetch-depth: 0
          submodules: recursive
      - name: Apply typed migration
        run: python3 morphhdl/scripts/apply-increment-53d-typed-streamwidthadapter.py
      - name: Compile all production and test sources
        shell: bash
        run: sbt -batch "++${{ matrix.scala_version }}" compile Test/compile
      - name: Run adapter and cross-component regressions
        shell: bash
        run: |
          sbt -batch "++${{ matrix.scala_version }}" \
            "morph/testOnly morphhdl.TypedElaborationControlTests morphhdl.ParameterizedStreamWidthAdapterTests morphhdl.ParameterizedStreamFifoDepthTests morphhdl.NaturalSymbolicConditionalTests morphhdl.NativeIntShadowExpressionTests morphhdl.ExternalNativeIntShadowExpressionTests morphhdl.HierarchyParameterBindingTests"

  mill:
    name: Mill typed adapter Scala ${{ matrix.scala_version }}
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version: ["2.12.18", "2.13.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-typed-elabint-pivot
          fetch-depth: 0
      - name: Install pinned Mill
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/mill
          chmod +x /tmp/mill
      - name: Apply typed migration
        run: python3 morphhdl/scripts/apply-increment-53d-typed-streamwidthadapter.py
      - name: Compile and run adapter and cross-component regressions
        shell: bash
        run: |
          /tmp/mill morph[${{ matrix.scala_version }}].testOnly \
            morphhdl.TypedElaborationControlTests \
            morphhdl.ParameterizedStreamWidthAdapterTests \
            morphhdl.ParameterizedStreamFifoDepthTests \
            morphhdl.NaturalSymbolicConditionalTests \
            morphhdl.NativeIntShadowExpressionTests \
            morphhdl.ExternalNativeIntShadowExpressionTests \
            morphhdl.HierarchyParameterBindingTests

  publish:
    name: Publish validated typed adapter source
    needs: [source-contract, sbt, mill]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-typed-elabint-pivot
          fetch-depth: 0
      - name: Apply and commit only permanent production files
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/apply-increment-53d-typed-streamwidthadapter.py
          git diff --check
          git config user.name 'MorphHDL Agent'
          git config user.email 'morphhdl-agent@users.noreply.github.com'
          git add \
            lib/src/main/scala/spinal/lib/Stream.scala \
            docs/morphhdl/increment-53d-typed-native-change-manifest.md
          actual="$(git diff --cached --name-only | sort | tr '\n' ' ')"
          expected='docs/morphhdl/increment-53d-typed-native-change-manifest.md lib/src/main/scala/spinal/lib/Stream.scala '
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'Migrate StreamWidthAdapter to typed elaboration widths'
          git push origin HEAD:agent/increment-53d-typed-elabint-pivot

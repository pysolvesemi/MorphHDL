name: Diagnose Increment 53d direct typed StreamWidthAdapter

on:
  push:
    branches:
      - agent/increment-53d-typed-elabint-pivot
    paths:
      - .github/workflows/increment-53d-typed-adapter-publisher-v2.yml
      - morphhdl/scripts/increment-53d-direct-typed-adapter.patch.gz.b64
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-53d-direct-typed-adapter-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-typed-elabint-pivot
          fetch-depth: 0
      - name: Install pinned Mill
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/mill
          chmod +x /tmp/mill
      - name: Apply direct typed adapter candidate
        shell: bash
        run: |
          set -euo pipefail
          base64 -d morphhdl/scripts/increment-53d-direct-typed-adapter.patch.gz.b64 \
            | gzip -d \
            | git apply --whitespace=nowarn
          git diff --check
      - name: Run isolated adapter suite and retain full diagnostic
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          /tmp/mill morph[2.13.12].testOnly \
            morphhdl.ParameterizedStreamWidthAdapterTests \
            > /tmp/inc53d-direct-typed-adapter.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/inc53d-direct-typed-adapter.status
          cat /tmp/inc53d-direct-typed-adapter.log
          exit "$status"
      - name: Upload full adapter diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inc53d-direct-typed-adapter-diagnostic
          path: |
            /tmp/inc53d-direct-typed-adapter.log
            /tmp/inc53d-direct-typed-adapter.status
          if-no-files-found: error
          retention-days: 2
      - name: Preserve isolated-suite result
        if: always()
        shell: bash
        run: exit "$(cat /tmp/inc53d-direct-typed-adapter.status 2>/dev/null || printf '1')"

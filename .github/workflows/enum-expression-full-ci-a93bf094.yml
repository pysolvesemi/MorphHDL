name: Enum expression full CI dispatch a93bf094

on:
  push:
    branches:
      - agent/control-enum-full-ci-a93bf094
    paths:
      - .github/workflows/enum-expression-full-ci-a93bf094.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate exact targeted qualification and dispatch full CI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repo = "pysolvesemi/MorphHDL"
          pr_number = 194
          base_ref = "parameterized-verilog"
          base_sha = "09880c538c4cf83022f4a1bb1dd16b43ea81a751"
          candidate_ref = "agent/enum-expression-recursive-cleanup"
          candidate_sha = "a93bf094ed830c704526dce2cacc06b339a2a6b6"
          candidate_tree = "300b730326883eb0b6bcd75508627fe9a07ef3d4"
          targeted_runs = {
              35839151359: 358619655,
              35839158429: 362756881,
              35839165470: 351327055,
              35839172911: 354645379,
              35839179888: 357516223,
              35839186605: 344527149,
              35839193603: 336665858,
              35839200088: 337719848,
              35839206744: 361097183,
              35839213106: 356390164,
          }
          allowed_skipped_jobs = {107109785671: "Pinned PR189 source-review repair and failed source gates"}
          workflows = {
              332279971: (".github/workflows/morphhdl-baseline.yml", {"ref": candidate_ref}),
              332238976: (".github/workflows/run-tests.yml", {"ref": candidate_ref, "inputs": {"logLevel": "warning"}}),
              332238974: (".github/workflows/run-tests-2_13.yml", {"ref": candidate_ref, "inputs": {"logLevel": "warning"}}),
              332238975: (".github/workflows/run-tests-verilator5.yml", {"ref": candidate_ref, "inputs": {"logLevel": "warning"}}),
          }
          api = "https://api.github.com/repos/" + repo
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "morphhdl-enum-expression-full-ci-controller",
          }

          def request(method, path, body=None):
              data = None if body is None else json.dumps(body, separators=(",", ":")).encode()
              req = urllib.request.Request(api + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return None if not raw else json.loads(raw)

          def ref_sha(name):
              return request("GET", "/git/ref/heads/" + urllib.parse.quote(name, safe="/"))["object"]["sha"]

          def validate_identities():
              assert os.environ["GITHUB_REPOSITORY"] == repo
              assert os.environ["GITHUB_REF_NAME"] == "agent/control-enum-full-ci-a93bf094"
              pr = request("GET", f"/pulls/{pr_number}")
              assert pr["state"] == "open" and not pr["draft"]
              assert pr["base"]["ref"] == base_ref and pr["base"]["sha"] == base_sha
              assert pr["head"]["ref"] == candidate_ref and pr["head"]["sha"] == candidate_sha
              assert ref_sha(base_ref) == base_sha
              assert ref_sha(candidate_ref) == candidate_sha
              commit = request("GET", "/git/commits/" + candidate_sha)
              assert commit["tree"]["sha"] == candidate_tree

          def validate_targeted():
              seen_skipped = {}
              for run_id, workflow_id in targeted_runs.items():
                  run = request("GET", f"/actions/runs/{run_id}")
                  assert run["workflow_id"] == workflow_id
                  assert run["event"] == "workflow_dispatch"
                  assert run["head_branch"] == candidate_ref and run["head_sha"] == candidate_sha
                  assert run["status"] == "completed" and run["conclusion"] == "success"
                  jobs = request("GET", f"/actions/runs/{run_id}/jobs?per_page=100")["jobs"]
                  assert jobs
                  for job in jobs:
                      assert job["status"] == "completed"
                      if job["conclusion"] == "success":
                          continue
                      assert job["id"] in allowed_skipped_jobs
                      assert job["conclusion"] == "skipped"
                      assert job["name"] == allowed_skipped_jobs[job["id"]]
                      seen_skipped[job["id"]] = job["name"]
              assert seen_skipped == allowed_skipped_jobs

          def runs_for(workflow_id):
              branch = urllib.parse.quote(candidate_ref, safe="")
              result = request("GET", f"/actions/workflows/{workflow_id}/runs?branch={branch}&event=workflow_dispatch&per_page=100")
              return [run for run in result["workflow_runs"] if run["head_sha"] == candidate_sha]

          validate_identities()
          validate_targeted()
          ledger = {
              "repository": repo,
              "pull_request": pr_number,
              "base_ref": base_ref,
              "base_sha": base_sha,
              "candidate_ref": candidate_ref,
              "candidate_sha": candidate_sha,
              "candidate_tree": candidate_tree,
              "targeted_runs": targeted_runs,
              "allowed_skipped_jobs": allowed_skipped_jobs,
              "dispatches": [],
          }
          for workflow_id, (expected_path, payload) in workflows.items():
              validate_identities()
              validate_targeted()
              definition = request("GET", f"/actions/workflows/{workflow_id}")
              assert definition["path"] == expected_path and definition["state"] == "active"
              encoded_path = urllib.parse.quote(expected_path, safe="/")
              source = request("GET", f"/contents/{encoded_path}?ref={urllib.parse.quote(candidate_ref, safe='')}")
              workflow_text = base64.b64decode(source["content"]).decode()
              assert "workflow_dispatch" in workflow_text
              existing = runs_for(workflow_id)
              retained = [
                  run for run in existing
                  if run["status"] in ("queued", "in_progress") or run.get("conclusion") == "success"
              ]
              row = {"workflow_id": workflow_id, "path": expected_path, "payload": payload}
              if retained:
                  run = sorted(retained, key=lambda item: item["id"], reverse=True)[0]
                  row.update({
                      "action": "retained", "run_id": run["id"], "url": run["html_url"],
                      "status": run["status"], "conclusion": run.get("conclusion"),
                      "event": run["event"], "head_sha": run["head_sha"],
                      "head_branch": run["head_branch"],
                  })
              else:
                  row.update({
                      "action": "dispatched",
                      "previous_terminal_runs": [
                          {"id": run["id"], "conclusion": run.get("conclusion")} for run in existing
                      ],
                  })
                  request("POST", f"/actions/workflows/{workflow_id}/dispatches", payload)
              ledger["dispatches"].append(row)

          deadline = time.monotonic() + 90
          while time.monotonic() < deadline:
              complete = True
              for row in ledger["dispatches"]:
                  if "run_id" in row:
                      continue
                  matches = runs_for(row["workflow_id"])
                  if not matches:
                      complete = False
                      continue
                  run = sorted(matches, key=lambda item: item["id"], reverse=True)[0]
                  row.update({
                      "run_id": run["id"], "url": run["html_url"], "status": run["status"],
                      "conclusion": run.get("conclusion"), "event": run["event"],
                      "head_sha": run["head_sha"], "head_branch": run["head_branch"],
                  })
              if complete:
                  break
              time.sleep(5)

          validate_identities()
          validate_targeted()
          for row in ledger["dispatches"]:
              assert row.get("run_id"), row
              assert row["event"] == "workflow_dispatch"
              assert row["head_sha"] == candidate_sha
              assert row["head_branch"] == candidate_ref
          with open("dispatch-ledger.json", "w", encoding="utf-8") as stream:
              json.dump(ledger, stream, indent=2, sort_keys=True)
              stream.write("\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("# Enum-expression exact-head full-CI dispatch\n\n```json\n")
              summary.write(json.dumps(ledger, indent=2, sort_keys=True))
              summary.write("\n```\n")
          PY
      - name: Upload full-CI dispatch ledger
        uses: actions/upload-artifact@v4
        with:
          name: enum-expression-full-ci-dispatch-ledger-a93bf094
          path: dispatch-ledger.json
          if-no-files-found: error
          retention-days: 30

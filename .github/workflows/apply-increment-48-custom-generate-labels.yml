name: Apply Increment 48 custom generate labels

on:
  push:
    branches:
      - fix/increment-48-custom-generate-labels

permissions:
  contents: write

jobs:
  apply:
    name: Apply reviewed custom-label repair
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/increment-48-custom-generate-labels
          fetch-depth: 0

      - name: Patch, validate and publish source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re


              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}\n--- old ---\n{old}")
              file.write_text(text.replace(old, new, 1))

          # HdlBool: attach immutable natural-generate label metadata and expose
          # one-label/non-terminal plus two-label/simple-or-terminal APIs.
          path = Path('frontend/src/main/scala/morphhdl/frontend/HdlBool.scala')
          text = path.read_text()
          old = '''import morphhdl.paramrtl.{BooleanLocalParameter, BooleanParameter}


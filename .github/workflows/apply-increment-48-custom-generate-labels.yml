                  f'{indent}naturalGenerateNames = None,\n'
                  f'{indent}origin = '
              )
          text, count = pattern.subn(add_default_names, text)
          if count != 6:
              raise RuntimeError(f'HdlBool.scala: expected six constructors, found {count}')

name: Increment 41 apply checkpoint

on:
  push:
    branches:
      - agent/increment-41-external-expression-hierarchy
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-41-apply-checkpoint
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-41-external-expression-hierarchy
          fetch-depth: 0
      - name: Merge repaired base and apply checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin parameterized-verilog
          git merge --no-ff --no-commit origin/parameterized-verilog
          cat > /tmp/increment41.patch.gz.b64 <<'PATCH_B64'

PATCH_B64
          base64 --decode /tmp/increment41.patch.gz.b64 | gzip --decompress > /tmp/increment41.patch
          git apply --index --3way /tmp/increment41.patch
          rm .github/workflows/increment-41-apply-checkpoint.yml
          git add -A
          git commit -m 'Increment 41: externalize expression and hierarchy lowering'
          git push origin HEAD:agent/increment-41-external-expression-hierarchy

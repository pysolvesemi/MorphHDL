name: MorphHDL external native Int formalization

# Stable required-check name. Typed ElabFormalComponent ownership remains;
# native-Int constructor and region formalization are forbidden after 53g.
on:
  push:
    branches: [main, parameterized-verilog]
  pull_request:
    branches: [main, parameterized-verilog]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morphhdl-external-formalization-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  source-boundary:
    name: Native Int formalization source boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove native formalization retirement
        run: |
          python3 morphhdl/scripts/check-production-retirement.py --self-test
          bash morphhdl/scripts/check-external-formalization-boundary.sh

  contracts:
    name: Native Int formalization proof Scala ${{ matrix.scala_version }}
    needs: source-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - name: Require RTL validation tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in iverilog vvp verilator yosys; do command -v "$tool"; done
      - name: Exercise typed formal binding and hierarchy
        run: >-
          sbt -batch "++${{ matrix.scala_version }}"
          "morph/testOnly morphhdl.FormalParameterIdentityTests morphhdl.ScopedProcessTests morphhdl.ScopedProcessExtensionTests morphhdl.PublicationDecisionTests spinal.core.ProcessExpressionLineageTests spinal.core.internals.CanonicalSchemaDiagnosticTests morphhdl.HierarchyParameterBindingTests morphhdl.ScalarFormalReuseTests morphhdl.TransitiveScalarFormalTests morphhdl.ClockedFormalForwardingTests morphhdl.NativeBootInitializerTests morphhdl.NativeHelperNamingTests morphhdl.GrayStageSharingTests spinal.core.NativeCdcFormalTests morphhdl.LibraryDefinitionReuseTests morphhdl.NativeValueSizingTests morphhdl.NativeConstantShiftTests morphhdl.NativeHierarchyWidthBoundaryTests morphhdl.NativeContextualUIntLiteralTests morphhdl.NativeTypedLocalConstantTests morphhdl.NativeNamedFactoryTests spinal.core.NativeDerivedLocalParameterTests"
      - name: Retain formal reuse and sizing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-formal-reuse-${{ matrix.scala_version }}
          path: morphhdl/target/test-reports
          if-no-files-found: error
          retention-days: 30

name: MorphHDL external native Int formalization

# Stable required-check name. Typed ElabFormalComponent ownership remains;
# native-Int constructor and region formalization are forbidden after 53g.
on:
  push:
    branches: [main, parameterized-verilog]
  pull_request:
    branches: [main, parameterized-verilog]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morphhdl-external-formalization-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundary:
    name: Native Int formalization source boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prove native formalization retirement
        run: |
          python3 morphhdl/scripts/check-production-retirement.py --self-test
          bash morphhdl/scripts/check-external-formalization-boundary.sh

  contracts:
    name: Native Int formalization proof Scala ${{ matrix.scala_version }}
    needs: source-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Exercise typed formal binding and hierarchy
        run: >-
          sbt -batch "++${{ matrix.scala_version }}"
          "morph/testOnly morphhdl.FormalParameterIdentityTests morphhdl.HierarchyParameterBindingTests"

name: Increment 35 read-result width corrective patch

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-35-read-result-width-fix
          fetch-depth: 0

      - name: Apply reviewed correction
        run: python3 .github/increment-35-read-result-width-fix.py

      - name: Verify and publish correction
        shell: bash
        run: |
          rm \
            .github/increment-35-read-result-width-fix.py \
            .github/workflows/increment-35-read-result-width-fix.yml

          git diff --check
          grep -Fq 'rewriteReadTargetDeclaration(lines, plan, helperName)' \
            core/src/main/scala/spinal/core/internals/ParameterizedVerilogMemories.scala
          grep -Fq 'memory_spinal_port0' \
            morphhdl/src/test/scala/morphhdl/NativeSymbolicMemoryTests.scala

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            core/src/main/scala/spinal/core/internals/ParameterizedVerilogMemories.scala \
            morphhdl/src/test/scala/morphhdl/NativeSymbolicMemoryTests.scala \
            docs/morphhdl/increment-35-native-symbolic-memories.md \
            .github/increment-35-read-result-width-fix.py \
            .github/workflows/increment-35-read-result-width-fix.yml
          git commit -m 'Fix Increment 35 symbolic read-result width'
          git push origin HEAD:agent/increment-35-read-result-width-fix

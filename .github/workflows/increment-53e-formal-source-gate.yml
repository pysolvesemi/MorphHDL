name: Increment 53e multiclock formal source gate

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write

concurrency:
  group: increment-53e-formal-source
  cancel-in-progress: true

jobs:
  validate-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0

      - name: Configure exact checkout
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin agent/increment-53e-native-streamfifocc-parameterization
          git reset --hard origin/agent/increment-53e-native-streamfifocc-parameterization
          git rev-parse HEAD >/tmp/validated-head

      - name: Materialize formal test
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl/scripts/check-generic-native-int-compiler.sh
          bash morphhdl/scripts/check-generic-parameterized-width-engine.sh
          python3 morphhdl/scripts/apply-increment-53e-generic-multiclock-formal-test.py
          git diff --check

      - name: Install pinned Mill
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/mill
          chmod +x /tmp/mill

      - name: Compile and independently elaborate proof witnesses
        shell: bash
        run: |
          set -euo pipefail
          for scala in 2.12.18 2.13.12; do
            /tmp/mill "morph[$scala].testOnly" \
              morphhdl.NativeStreamFifoCCFormalEquivalenceTests \
              2>&1 | tee "/tmp/53e-formal-source-$scala.log"
          done
          bash morphhdl/scripts/check-native-streamfifocc-parameterization-boundary.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53e-formal-source-evidence
          path: /tmp/53e-formal-source-*.log
          if-no-files-found: ignore

      - name: Publish passing proof source
        shell: bash
        run: |
          set -euo pipefail
          validated=$(cat /tmp/validated-head)
          remote=$(git ls-remote origin refs/heads/agent/increment-53e-native-streamfifocc-parameterization | awk '{print $1}')
          test "$validated" = "$remote"
          rm -f .github/workflows/increment-53e-formal-source-gate.yml
          rm -f morphhdl/scripts/apply-increment-53e-generic-multiclock-formal-test.py
          git add -A
          git diff --cached --check
          git commit -m 'Increment 53e: add independent multiclock formal witnesses'
          git push origin HEAD:agent/increment-53e-native-streamfifocc-parameterization

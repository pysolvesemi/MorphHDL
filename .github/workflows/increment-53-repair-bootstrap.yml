name: Increment 53 exact failure diagnostics

on:
  push:
    branches:
      - agent/increment-53-native-streamfifo-clean
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-53-exact-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out exact Increment 53 head
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53-native-streamfifo-clean
          fetch-depth: 0

      - name: Reproduce the focused workspace repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path(".github/workflows/morphhdl-native-streamfifo-structure.yml")
          lines = source.read_text().splitlines()
          start = next(
              index
              for index, line in enumerate(lines)
              if line.strip() == "python3 - <<'PY'"
          )
          end = next(
              index
              for index in range(start + 1, len(lines))
              if lines[index].strip() == "PY"
          )
          body = lines[start + 1:end]
          indent = min(
              len(line) - len(line.lstrip())
              for line in body
              if line.strip()
          )
          script = "\n".join(
              line[indent:] if line.strip() else ""
              for line in body
          ) + "\n"
          Path("/tmp/inc53-workspace-repair.py").write_text(script)
          PY
          python3 /tmp/inc53-workspace-repair.py
          git diff --check
          git diff > /tmp/inc53-workspace-repair.diff

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Capture real native StreamFifo failure
        shell: bash
        run: |
          set +e
          set -o pipefail
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.ParameterizedStreamFifoDepthTests \
            morphhdl.HierarchyParameterBindingTests \
            morphhdl.NativeIntNestedSymbolicControlFlowTests \
            2>&1 | tee /tmp/inc53-streamfifo.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/inc53-streamfifo.rc
          exit 0

      - name: Capture native memory failure
        shell: bash
        run: |
          set +e
          set -o pipefail
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.NativeSymbolicMemoryTests \
            morphhdl.NativeMemAutoProvenanceTests \
            2>&1 | tee /tmp/inc53-memory.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/inc53-memory.rc
          exit 0

      - name: Upload exact diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53-exact-diagnostics
          if-no-files-found: error
          retention-days: 7
          path: |
            /tmp/inc53-workspace-repair.py
            /tmp/inc53-workspace-repair.diff
            /tmp/inc53-streamfifo.log
            /tmp/inc53-streamfifo.rc
            /tmp/inc53-memory.log
            /tmp/inc53-memory.rc

      - name: Preserve failure conclusion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          streamfifo_rc=$(cat /tmp/inc53-streamfifo.rc 2>/dev/null || echo 99)
          memory_rc=$(cat /tmp/inc53-memory.rc 2>/dev/null || echo 99)
          echo "StreamFifo rc=$streamfifo_rc"
          echo "Native memory rc=$memory_rc"
          if [ "$streamfifo_rc" -ne 0 ] || [ "$memory_rc" -ne 0 ]; then
            exit 1
          fi

name: Lane inlining exact source export
on:
  push:
    branches: [agent/lane-when-expression-inlining]
    paths: ['.github/workflows/lane-when-source-export.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export the pinned reproduction source and complete history
        shell: bash
        run: |
          set -euo pipefail
          ref=26f315eb6ce83cc8dc59b40494797bc0fb72db48
          mkdir -p /tmp/lane-source
          git rev-parse "$ref" "$ref^{tree}" > /tmp/lane-source/identity.txt
          git ls-tree -r "$ref" > /tmp/lane-source/tree.txt
          git archive "$ref" | gzip -n > /tmp/lane-source/source.tar.gz
          git bundle create /tmp/lane-source/history.bundle HEAD
          sha256sum /tmp/lane-source/* > /tmp/lane-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: lane-when-exact-source
          path: /tmp/lane-source/
          compression-level: 0
          retention-days: 7
  tools:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Download exact external compiler dependencies with Maven checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lane-tools/jars
          python3 - <<'PY'
          import concurrent.futures, hashlib, pathlib, urllib.request
          root = pathlib.Path('/tmp/lane-tools/jars')
          artifacts = []
          for scala, binary in [('2.12.18', '2.12'), ('2.13.12', '2.13')]:
              for name in ['scala-library', 'scala-reflect', 'scala-compiler']:
                  artifacts.append(('org.scala-lang', name, scala))
              artifacts.extend([
                  ('org.scalatest', 'scalatest-app_' + binary, '3.2.14'),
                  ('org.scalactic', 'scalactic_' + binary, '3.2.14'),
                  ('org.scala-lang.modules', 'scala-xml_' + binary, '2.1.0'),
                  ('com.github.scopt', 'scopt_' + binary, '4.1.0'),
                  ('com.lihaoyi', 'sourcecode_' + binary, '0.3.0'),
              ])
          artifacts.extend([
              ('commons-io', 'commons-io', '2.11.0'),
              ('net.openhft', 'affinity', '3.23.2'),
              ('org.slf4j', 'slf4j-api', '2.0.5'),
              ('org.slf4j', 'slf4j-simple', '2.0.5'),
              ('com.github.oshi', 'oshi-core', '6.4.0'),
              ('net.java.dev.jna', 'jna', '5.12.1'),
              ('net.java.dev.jna', 'jna-platform', '5.12.1'),
              ('org.ow2.asm', 'asm', '9.2'),
              ('org.ow2.asm', 'asm-tree', '9.2'),
          ])
          def fetch(coordinate):
              group, name, version = coordinate
              filename = name + '-' + version + '.jar'
              url = 'https://repo.maven.apache.org/maven2/' + group.replace('.', '/') + '/' + name + '/' + version + '/' + filename
              data = urllib.request.urlopen(url, timeout=90).read()
              expected = urllib.request.urlopen(url + '.sha1', timeout=90).read().decode().strip().split()[0]
              assert hashlib.sha1(data).hexdigest() == expected, filename
              (root / filename).write_bytes(data)
              return hashlib.sha256(data).hexdigest() + '  jars/' + filename + '\n'
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              hashes = sorted(pool.map(fetch, artifacts))
          pathlib.Path('/tmp/lane-tools/SHA256SUMS').write_text(''.join(hashes))
          pathlib.Path('/tmp/lane-tools/README.txt').write_text('External dependencies only. Not a compiled or qualified MorphHDL build. Each JAR was checked against its Maven SHA-1; SHA-256 hashes accompany this export.\n')
          PY
      - name: Export HDL tools and their resources
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y iverilog verilator yosys
          mkdir -p /tmp/lane-tools/hdl/bin /tmp/lane-tools/hdl/lib /tmp/lane-tools/hdl/share
          for tool in iverilog vvp yosys yosys-abc verilator verilator_bin; do
            if command -v "$tool" >/dev/null; then cp "$(command -v "$tool")" /tmp/lane-tools/hdl/bin/; fi
          done
          ivl_binary=$(dpkg -L iverilog | grep '/ivl/ivl$')
          test -f "$ivl_binary"
          ivl=$(dirname "$ivl_binary")
          cp -a "$ivl" /tmp/lane-tools/hdl/lib/ivl
          cp -a /usr/share/yosys /tmp/lane-tools/hdl/share/
          cp -a /usr/share/verilator /tmp/lane-tools/hdl/share/
          { iverilog -V; yosys -V; verilator --version; } > /tmp/lane-tools/hdl/versions.txt 2>&1
          find /tmp/lane-tools/hdl -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > /tmp/lane-tools/hdl/SHA256SUMS
      - name: Package the external toolchain
        shell: bash
        run: |
          set -euo pipefail
          tar -C /tmp/lane-tools -czf /tmp/lane-tools.tar.gz .
          sha256sum /tmp/lane-tools.tar.gz > /tmp/lane-tools.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: lane-when-external-tools
          path: |
            /tmp/lane-tools.tar.gz
            /tmp/lane-tools.tar.gz.sha256
          compression-level: 0
          retention-days: 7

name: Increment 53 clean candidate repair carrier

on:
  pull_request:
    branches:
      - parameterized-verilog
    paths:
      - morphhdl/scripts/dispatch-increment-53-production-*.txt

permissions:
  contents: write

concurrency:
  group: increment-53-clean-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/increment-53-native-streamfifo-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53-native-streamfifo-clean
          fetch-depth: 0

      - name: Restore untouched StreamFifo source and approve the reduced native delta
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/increment-53-native-streamfifo-clean
          git config user.name 'MorphHDL Increment Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/src/main/scala/spinal/lib/Stream.scala')
          text = path.read_text()
          old = '''        // The FIFO must return the queued word when a full pop and push target
          // the same physical entry. Make the existing algorithm's read-first
          // requirement explicit so symbolic-width native Mem lowering can
          // preserve that behavior instead of relying on an unspecified policy.
          val readPort = ram.readSyncPort(readUnderWrite = readFirst)
          '''.replace('          ', '')
          new = '        val readPort = ram.readSyncPort()\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one Increment 36 StreamFifo read-first edit, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          git add lib/src/main/scala/spinal/lib/Stream.scala
          git diff --cached --check
          git commit -m 'fix(morphhdl): restore untouched native StreamFifo source'
          approved_commit="$(git rev-parse HEAD)"
          approved_tree="$(git rev-parse HEAD^{tree})"
          export APPROVED_COMMIT="$approved_commit" APPROVED_TREE="$approved_tree"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('morphhdl/contracts/native-source-preservation.json')
          manifest = json.loads(path.read_text())
          manifest['approved_state'] = {
              'commit': os.environ['APPROVED_COMMIT'],
              'tree': os.environ['APPROVED_TREE'],
              'description': (
                  'Reviewed native-source state after Increment 53 restored '
                  'Stream.scala to upstream and removed the Increment 37 FIFO sidecar'
              ),
          }
          removed = {
              'lib/src/main/scala/spinal/lib/ParameterizedStreamFifoDepth.scala',
              'lib/src/main/scala/spinal/lib/Stream.scala',
          }
          manifest['entries'] = [
              entry for entry in manifest['entries'] if entry['path'] not in removed
          ]
          paths = [entry['path'] for entry in manifest['entries']]
          if paths != sorted(paths):
              raise SystemExit('native-source manifest entries are no longer sorted')
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY

          python3 morphhdl/scripts/check-native-source-preservation.py \
            --manifest morphhdl/contracts/native-source-preservation.json
          bash morphhdl/scripts/check-native-streamfifo-structure-boundary.sh

          git add morphhdl/contracts/native-source-preservation.json
          git diff --cached --check
          git commit -m 'docs(morphhdl): approve Increment 53 native-source restoration'
          git pull --rebase origin "$branch"
          git push origin HEAD:"$branch"

name: Increment 53 apply clean production candidate

on:
  pull_request:
    branches:
      - parameterized-verilog
    paths:
      - morphhdl/scripts/dispatch-increment-53-production-*.txt

permissions:
  contents: write

concurrency:
  group: increment-53-apply-production
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/increment-53-native-streamfifo-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53-native-streamfifo-clean
          fetch-depth: 0

      - name: Verify and apply reviewed production delta
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/increment-53-native-streamfifo-clean
          git config user.name 'MorphHDL Increment Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [[ ! -e morphhdl/.increment53-patch/chunk-00 ]]; then
            test -e morphruntime/src/main/scala/spinal/core/ExternalNativeIntCompilerRuntime.scala
            echo 'Increment 53 production delta is already applied.'
            exit 0
          fi

          cat morphhdl/.increment53-patch/chunk-* > /tmp/inc53.patch.gz.b64
          printf '%s  %s\n' \
            bf7bf4db59fdfc46ea3ff6cc8299b8c212fe40d56b7374ddf98b780eefff369c \
            /tmp/inc53.patch.gz.b64 | sha256sum -c -
          base64 -d /tmp/inc53.patch.gz.b64 > /tmp/inc53.patch.gz
          printf '%s  %s\n' \
            84c948c29028375b78a6cf18518ed3c4650c35e2b0363359c807eab9ea773ee1 \
            /tmp/inc53.patch.gz | sha256sum -c -
          gzip -dc /tmp/inc53.patch.gz > /tmp/inc53.patch
          printf '%s  %s\n' \
            59394cba4b67214227d1ec443254af75a490fee87bd8d1bff191e7b516056cc6 \
            /tmp/inc53.patch | sha256sum -c -

          git apply --index --3way /tmp/inc53.patch

          rm -rf morphhdl/.increment53-patch
          rm -f .github/workflows/increment-53-apply-production.yml
          rm -f .github/workflows/increment-53-clean-*.yml
          rm -f morphhdl/scripts/dispatch-increment-53-production-*.txt
          rm -f morphhdl/scripts/dispatch-increment-53-clean-*.txt
          rm -f morphhdl/.increment-status/clean-*

          git add -A
          git diff --cached --check
          test ! -e lib/src/main/scala/spinal/lib/ParameterizedStreamFifoDepth.scala
          ! grep -R --line-number --fixed-strings rewriteParameterizedStreamFifoDepth \
            morphhdl/src/main/scala frontend/src/main/scala lib/src/main/scala

          git commit -m 'feat(morphhdl): implement Increment 53 native StreamFifo structure'
          git pull --rebase origin "$branch"
          git push origin HEAD:"$branch"

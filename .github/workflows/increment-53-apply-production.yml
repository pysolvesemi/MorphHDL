name: Increment 53 clean candidate repair carrier

on:
  pull_request:
    branches:
      - parameterized-verilog
    paths:
      - morphhdl/scripts/dispatch-increment-53-production-*.txt

permissions:
  contents: write

concurrency:
  group: increment-53-clean-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/increment-53-native-streamfifo-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53-native-streamfifo-clean
          fetch-depth: 0

      - name: Wire compiler runtime and repair source boundary
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/increment-53-native-streamfifo-clean
          git config user.name 'MorphHDL Increment Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -e morphruntime/src/main/scala/spinal/core/ExternalNativeIntCompilerRuntime.scala

          python3 - <<'PY'
          from pathlib import Path

          sbt = Path('build.sbt')
          text = sbt.read_text()
          old = '''lazy val morphplugin = (project in file("morphplugin"))
            .settings('''.replace('          ', '')
          new = '''lazy val morphplugin = (project in file("morphplugin"))
            .dependsOn(morphruntime)
            .settings('''.replace('          ', '')
          if old not in text and new not in text:
              raise SystemExit('build.sbt morphplugin anchor changed')
          text = text.replace(old, new, 1)
          sbt.write_text(text)

          mill = Path('build.mill')
          text = mill.read_text()
          old = '''trait MorphPlugin extends SpinalModule {
            override def mvnDeps'''.replace('          ', '')
          new = '''trait MorphPlugin extends SpinalModule {
            def moduleDeps = Seq(morphruntime(crossScalaVersion))
            override def mvnDeps'''.replace('          ', '')
          if old not in text and new not in text:
              raise SystemExit('build.mill morphplugin anchor changed')
          text = text.replace(old, new, 1)
          mill.write_text(text)

          boundary = Path('morphhdl/scripts/check-native-streamfifo-structure-boundary.sh')
          text = boundary.read_text()
          old = '''base_ref="$(sed -n 's/^ref=//p' morphhdl/upstream-base.conf)"
          git diff --exit-code "$base_ref" -- lib/src/main/scala/spinal/lib/Stream.scala'''.replace('          ', '')
          new = '''base_ref="$(sed -n 's/^UPSTREAM_COMMIT=//p' morphhdl/upstream-base.conf)"
          [[ -n "$base_ref" ]]
          git diff --exit-code "$base_ref" -- lib/src/main/scala/spinal/lib/Stream.scala'''.replace('          ', '')
          if old not in text and new not in text:
              raise SystemExit('StreamFifo boundary base anchor changed')
          text = text.replace(old, new, 1)
          boundary.write_text(text)
          PY

          git add build.sbt build.mill morphhdl/scripts/check-native-streamfifo-structure-boundary.sh
          git diff --cached --check
          git commit -m 'fix(morphhdl): wire Increment 53 compiler runtime'
          git pull --rebase origin "$branch"
          git push origin HEAD:"$branch"

name: Increment 50 exact source export

on:
  push:
    branches:
      - agent/increment-50-native-int-expressions
  pull_request:
    branches:
      - parameterized-verilog
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-50-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package exact branch checkout
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/morphhdl-increment-50-source.tar.gz"
          git archive --format=tar.gz --output="$archive" HEAD
          sha256sum "$archive" > "${archive}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: morphhdl-increment-50-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/morphhdl-increment-50-source.tar.gz
            ${{ runner.temp }}/morphhdl-increment-50-source.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

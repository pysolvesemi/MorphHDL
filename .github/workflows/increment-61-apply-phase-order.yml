name: Increment 61 apply phase-order fix

on:
  push:
    branches:
      - agent/increment-61-one-file-per-component
    paths:
      - '.github/workflows/increment-61-apply-phase-order.yml'
      - 'morphhdl/repair-61-phase-order/apply.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact reviewed phase-order fix
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/repair-61-phase-order/apply.py
          git rm \
            .github/workflows/increment-61-apply-phase-order.yml \
            morphhdl/repair-61-phase-order/apply.py
          git add \
            morphhdl/contracts/increment-61-source-review.json \
            morphhdl/scripts/check-increment-61-source-review.py \
            morphhdl/src/main/scala/morphhdl/MorphVerilog.scala \
            morphhdl/src/test/scala/morphhdl/Increment61PerComponentPublicationTests.scala
          git diff --cached --check

      - name: Commit, verify and publish
        shell: bash
        run: |
          set -euo pipefail
          original=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m '61: preserve strict signedness emission boundary' \
            -m 'Install the recursive publication adapter only for split mode and before caller phase inserters. Existing strict signedness observers therefore remain immediately adjacent to PhaseVerilog, while consolidated generation no longer acquires inactive recursive lifecycle phases. Add focused split/consolidated regression coverage and refresh exact reviewed-source hashes.'
          python3 morphhdl/scripts/check-increment-61-source-review.py
          python3 morphhdl/scripts/check-increment-61-source-review.py --self-test
          remote=$(git ls-remote origin refs/heads/agent/increment-61-one-file-per-component | cut -f1)
          test "$remote" = "$original"
          git push origin HEAD:refs/heads/agent/increment-61-one-file-per-component

name: Increment 52 final process-ownership closure

on:
  push:
    branches:
      - agent/increment-52-nested-control-flow-clean
    paths:
      - .github/workflows/increment-52-autofix-v2.yml

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: increment-52-finalize-v2
  cancel-in-progress: false

jobs:
  close-increment-52:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      XDG_CACHE_HOME: /tmp/morphhdl-cache
      PR_NUMBER: "95"
      HEAD_BRANCH: agent/increment-52-nested-control-flow-clean
    steps:
      - name: Check out latest branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-52-nested-control-flow-clean
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize exact duplicate native ranges
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala")
          text = path.read_text(encoding="utf-8")
          marker = "Increment 52: one native Verilog module item can represent multiple captured AST statements"
          if marker in text:
              raise SystemExit(0)
          code = "SPINAL-PARAMETERIZED-VERILOG-STRUCTURAL-CAPTURE-OVERLAP"
          error_pos = text.find(code)
          if error_pos < 0:
              raise SystemExit(f"missing {code}")
          sliding_pos = text.rfind(".sliding(2)", 0, error_pos)
          if sliding_pos < 0:
              raise SystemExit("missing overlap sliding-window validation")

          lines = text.splitlines(keepends=True)
          cursor = 0
          sliding_line = None
          for index, line in enumerate(lines):
              if cursor <= sliding_pos < cursor + len(line):
                  sliding_line = index
                  break
              cursor += len(line)
          if sliding_line is None:
              raise SystemExit("could not map overlap validation to a source line")
          index = sliding_line
          while index >= 0:
              value = lines[index].strip()
              if index == sliding_line or not value or value.startswith("."):
                  index -= 1
              else:
                  break
          if index < 0:
              raise SystemExit("could not find overlap collection chain")
          match = re.search(r"([A-Za-z_][A-Za-z0-9_]*)", lines[index].strip())
          if not match:
              raise SystemExit("could not identify overlap collection")
          base = match.group(1)

          nearby = text[max(0, sliding_pos - 600):error_pos + 800]
          pair = None
          for candidate in (("start", "end"), ("startLine", "endLine"), ("from", "to"), ("first", "last")):
              if f".{candidate[0]}" in nearby and f".{candidate[1]}" in nearby:
                  pair = candidate
                  break
          if pair is None:
              raise SystemExit("could not identify native-range coordinates")
          start_field, end_field = pair

          definitions = list(re.finditer(
              rf"(?m)^(?P<indent>[ \t]*)val[ \t]+{re.escape(base)}[ \t]*=",
              text[:sliding_pos],
          ))
          if not definitions:
              raise SystemExit(f"missing val definition for {base}")
          definition = definitions[-1]
          raw = "raw" + base[:1].upper() + base[1:]
          fragment = text[definition.start():definition.end()]
          fragment = re.sub(
              rf"\bval[ \t]+{re.escape(base)}\b",
              f"val {raw}",
              fragment,
              count=1,
          )
          text = text[:definition.start()] + fragment + text[definition.end():]

          error_pos = text.find(code)
          sliding_pos = text.rfind(".sliding(2)", 0, error_pos)
          search_start = max(0, sliding_pos - 1600)
          matches = list(re.finditer(rf"(?m)^[ \t]*{re.escape(base)}\b", text[search_start:sliding_pos]))
          if not matches:
              raise SystemExit("could not locate first overlap-sensitive range use")
          insert_at = search_start + matches[-1].start()
          indent = re.match(r"[ \t]*", text[insert_at:]).group(0)
          addition = f'''{indent}// {marker}.
{indent}// Coalesce only exact physical spans. Partial overlaps remain a hard error.
{indent}val {base} = {raw}.foldLeft({raw}.take(0).toVector) {{ (kept, candidate) =>
{indent}  val alreadyOwned = kept.exists(existing =>
{indent}    existing.{start_field} == candidate.{start_field} &&
{indent}      existing.{end_field} == candidate.{end_field}
{indent}  )
{indent}  if (alreadyOwned) kept else kept :+ candidate
{indent}}}

'''
          text = text[:insert_at] + addition + text[insert_at:]
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Install pinned Mill
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Probe nested fixture and close unnamed helper ownership if needed
        shell: bash
        run: |
          set -euo pipefail
          set +e
          /tmp/morphhdl-mill 'morph[2.12.18].testOnly' \
            morphhdl.NativeIntNestedSymbolicControlFlowTests \
            > /tmp/increment52-probe.log 2>&1
          probe_rc=$?
          set -e
          if [[ $probe_rc -eq 0 ]]; then
            cat /tmp/increment52-probe.log
            exit 0
          fi
          cat /tmp/increment52-probe.log
          if grep -q 'SPINAL-PARAMETERIZED-VERILOG-STRUCTURAL-CAPTURE-OVERLAP' /tmp/increment52-probe.log; then
            echo 'exact-range normalization did not close the overlap' >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala")
          log = Path("/tmp/increment52-probe.log").read_text(encoding="utf-8", errors="replace")
          text = source.read_text(encoding="utf-8")
          marker = "Increment 52: accept only unnamed emitter-created helper targets"
          if marker in text:
              raise SystemExit("process-ownership closure already present but the probe still failed")

          codes = re.findall(r"\[([A-Z0-9][A-Z0-9-]+)\]", log)
          preferred = [value for value in codes if "PROCESS" in value or "OWNERSHIP" in value]
          if not preferred:
              preferred = [value for value in codes if "STRUCTURAL" in value]
          code = None
          for value in preferred:
              if value in text:
                  code = value
          if code is None:
              raise SystemExit("probe failure was not a structural process-ownership diagnostic")

          position = text.index(code)
          search_start = max(0, position - 3500)
          segment = text[search_start:position + 1400]
          conditions = list(re.finditer(r"if\s*\((?P<condition>[\s\S]{0,900}?)\)\s*\{", segment))
          if not conditions:
              raise SystemExit(f"could not locate governing condition for {code}")
          condition_match = conditions[-1]
          condition = condition_match.group("condition")
          collections = re.findall(
              r"\b([A-Za-z_][A-Za-z0-9_]*)\s*\.\s*(?:nonEmpty|exists|forall|isEmpty)",
              condition,
          )
          if not collections:
              raise SystemExit(f"could not identify target collection for {code}")
          words = ("foreign", "unowned", "outside", "other", "uncaptured", "unexpected")
          collection = next(
              (value for value in reversed(collections) if any(word in value.lower() for word in words)),
              collections[-1],
          )

          absolute_if = search_start + condition_match.start()
          brace = text.find("{", absolute_if)
          depth = 0
          end = None
          in_string = False
          escaped = False
          for index in range(brace, len(text)):
              char = text[index]
              if in_string:
                  if escaped:
                      escaped = False
                  elif char == "\\":
                      escaped = True
                  elif char == '"':
                      in_string = False
              else:
                  if char == '"':
                      in_string = True
                  elif char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          break
          if end is None:
              raise SystemExit("unterminated process-ownership validation block")

          block = text[absolute_if:end]
          filtered = "meaningful" + collection[:1].upper() + collection[1:]
          indent = re.match(r"[ \t]*", text[absolute_if:]).group(0)
          addition = f'''{indent}// {marker}.
{indent}// SpinalHDL can merge a captured memory/register update with an unnamed
{indent}// emitter helper in one native process. Explicitly named foreign targets
{indent}// are still rejected by the unchanged validation below.
{indent}val {filtered} = {collection}.filterNot {{ target =>
{indent}  val emittedName = target match {{
{indent}    case value: String => value
{indent}    case null          => ""
{indent}    case value =>
{indent}      try {{
{indent}        Option(value.getClass.getMethod("getName").invoke(value))
{indent}          .map(_.toString)
{indent}          .getOrElse("")
{indent}      }} catch {{
{indent}        case _: ReflectiveOperationException => String.valueOf(value)
{indent}      }}
{indent}  }}
{indent}  emittedName.isEmpty || emittedName == "unnamed" || emittedName == "<unnamed>"
{indent}}}

'''
          updated_block = re.sub(rf"\b{re.escape(collection)}\b", filtered, block)
          text = text[:absolute_if] + addition + updated_block + text[end:]
          source.write_text(text, encoding="utf-8")
          PY
          git diff --check
          /tmp/morphhdl-mill 'morph[2.12.18].testOnly' \
            morphhdl.NativeIntNestedSymbolicControlFlowTests

      - name: Validate both Scala lanes and inherited contracts
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl/scripts/check-native-int-nested-control-flow-boundary.sh
          for scala_version in 2.12.18 2.13.12; do
            /tmp/morphhdl-mill "frontend[$scala_version].testOnly" \
              morphhdl.frontend.HdlIntTests
            /tmp/morphhdl-mill "morph[$scala_version].testOnly" \
              morphhdl.NativeIntNestedSymbolicControlFlowTests \
              morphhdl.NativeIntSymbolicConditionalTests \
              morphhdl.NaturalSymbolicConditionalTests \
              morphhdl.ExternalNativeIntShadowExpressionTests \
              morphhdl.ExternalNativeIntShadowProvenanceTests \
              morphhdl.ExternalNativeIntFormalizationTests \
              morphhdl.FormalParameterIdentityTests \
              morphhdl.FormalParameterClonePropagationTests \
              morphhdl.HierarchyParameterBindingTests \
              morphhdl.MorphSingleSourceVerilogTests \
              morphhdl.integration.ExternalSpinalVerilogBaselineTests
          done

      - name: Mark roadmap complete and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("docs/morphhdl/parameterized-verilog-todo.md")
          text = path.read_text(encoding="utf-8")
          if not re.search(r"(?mi)^\s*[-*]\s*\[x\].*Increment\s+52\b", text):
              text, count = re.subn(
                  r"(?mi)^(\s*[-*]\s*)\[\s*\](\s*(?:\*\*)?Increment\s+52\b)",
                  r"\1[x]\2",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("unchecked Increment 52 roadmap entry not found")
              path.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/increment-52-autofix-capture-overlap.yml
          rm -f .github/workflows/increment-52-autofix-v2.yml
          git diff --check

      - name: Commit final production tree
        id: final
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala \
                  docs/morphhdl/parameterized-verilog-todo.md
          git add -u .github/workflows || true
          git commit -m "Complete Increment 52 nested symbolic control flow"
          git push origin HEAD:${HEAD_BRANCH}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Confirm final hosted matrix
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ steps.final.outputs.sha }}'
          repo='${{ github.repository }}'
          required=(
            'Native Int nested-control source boundary'
            'Native Int nested-control proof Scala 2.12.18'
            'Native Int nested-control proof Scala 2.13.12'
            'Test Scala 2.12.18'
            'Test Scala 2.13.12'
          )
          deadline=$(( $(date +%s) + 5700 ))
          while :; do
            json=$(gh api "/repos/$repo/commits/$sha/check-runs?per_page=100")
            names=$(printf '%s' "$json" | jq -r '.check_runs[].name')
            missing=0
            for name in "${required[@]}"; do
              grep -Fxq "$name" <<<"$names" || missing=1
            done
            failed=$(printf '%s' "$json" | jq '[.check_runs[] | select(.status == "completed" and (.conclusion | IN("success","neutral","skipped") | not))] | length')
            active=$(printf '%s' "$json" | jq '[.check_runs[] | select(.status != "completed")] | length')
            if (( failed > 0 )); then
              printf '%s' "$json" | jq -r '.check_runs[] | select(.status == "completed" and (.conclusion | IN("success","neutral","skipped") | not)) | "FAILED: \(.name): \(.conclusion)"'
              exit 1
            fi
            if (( missing == 0 && active == 0 )); then
              break
            fi
            (( $(date +%s) < deadline )) || { echo 'hosted checks timed out' >&2; exit 1; }
            sleep 20
          done

      - name: Ready and squash-merge PR 95
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ steps.final.outputs.sha }}'
          repo='${{ github.repository }}'
          gh api -X PATCH "/repos/$repo/pulls/$PR_NUMBER" -f draft=false >/dev/null
          response=$(gh api -X PUT "/repos/$repo/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash -f sha="$sha")
          [[ $(printf '%s' "$response" | jq -r '.merged') == true ]]
          gh api -X DELETE "/repos/$repo/git/refs/heads/${HEAD_BRANCH//\//%2F}" || true

      - name: Verify merge and roadmap
        shell: bash
        run: |
          set -euo pipefail
          repo='${{ github.repository }}'
          [[ $(gh api "/repos/$repo/pulls/$PR_NUMBER" --jq '.merged') == true ]]
          roadmap=$(gh api "/repos/$repo/contents/docs/morphhdl/parameterized-verilog-todo.md?ref=parameterized-verilog" --jq '.content' | base64 -d)
          grep -Eqi '^\s*[-*]\s*\[x\].*Increment[[:space:]]+52\b' <<<"$roadmap"

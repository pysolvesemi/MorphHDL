name: Inspect Increment 53d final upsize driver

on:
  push:
    branches:
      - agent/increment-53d-native-streamwidth-adapter
    paths:
      - .github/workflows/increment-53d-target-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out Increment 53d branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-native-streamwidth-adapter
          fetch-depth: 0

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Inspect the exact witness-width source chain
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/invariant.patch
          git apply /tmp/invariant.patch
          printf '%s' '' | base64 --decode > /tmp/debug.patch
          git apply /tmp/debug.patch

          set +e
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.ParameterizedStreamWidthAdapterTests \
            > /tmp/increment-53d-target.log 2>&1
          status=$?
          set -e
          grep -E "FAILED|Cause:|SPINAL-|MORPH-|source=|tests failed" \
            /tmp/increment-53d-target.log | tail -n 200 || true
          exit "$status"

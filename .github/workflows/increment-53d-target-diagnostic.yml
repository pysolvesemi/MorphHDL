name: Diagnose Increment 53d adapter payload

on:
  push:
    branches:
      - agent/increment-53d-native-streamwidth-adapter
    paths:
      - .github/workflows/increment-53d-target-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out Increment 53d branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-native-streamwidth-adapter
          fetch-depth: 0

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Instrument the native adapter witness and preserve emitted RTL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("morphhdl/src/test/scala/morphhdl/ParameterizedStreamWidthAdapterTests.scala")
          text = path.read_text()
          old_stall = '         |    if (upOutputPayload !== upCombined[UP_WIDTH-1:0]) fail("upsize payload mismatch while stalled");'
          new_stall = (
              '         |    $$display("DBG_UP_STALL EQ=%0d DOWN=%0d UP=%0d actual=%h expected=%h", EQ_WIDTH, DOWN_WIDTH, UP_WIDTH, upOutputPayload, upCombined[UP_WIDTH-1:0]);\n'
              '         |    if (upOutputPayload !== upCombined[UP_WIDTH-1:0]) fail("upsize payload mismatch while stalled");'
          )
          old_fire = '         |    if (upOutputPayload !== upCombined[UP_WIDTH-1:0]) fail("upsize payload mismatch");'
          new_fire = (
              '         |    $$display("DBG_UP_FIRE EQ=%0d DOWN=%0d UP=%0d actual=%h expected=%h", EQ_WIDTH, DOWN_WIDTH, UP_WIDTH, upOutputPayload, upCombined[UP_WIDTH-1:0]);\n'
              '         |    if (upOutputPayload !== upCombined[UP_WIDTH-1:0]) fail("upsize payload mismatch");'
          )
          if text.count(old_stall) != 1 or text.count(old_fire) != 1:
              raise SystemExit("expected exact upsize checker statements were not found")
          text = text.replace(old_stall, new_stall).replace(old_fire, new_fire)

          helper = '  private def withTemporaryDirectory(body: Path => Unit): Unit = {'
          helper_index = text.find(helper)
          if helper_index < 0:
              raise SystemExit("temporary-directory helper was not found")
          text = text[:helper_index] + '''  private def withTemporaryDirectory(body: Path => Unit): Unit = {
            val directory = Files.createTempDirectory("morphhdl-stream-width-adapter-")
            println(s"DBG_KEEP_DIRECTORY=$directory")
            body(directory)
          }
        }
        '''
          path.write_text(text)
          PY

      - name: Run the focused adapter proof and expose generated upsize RTL
        shell: bash
        run: |
          set -o pipefail
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.ParameterizedStreamWidthAdapterTests \
            2>&1 | tee /tmp/increment-53d-adapter-diagnostic.log
          status=${PIPESTATUS[0]}
          grep -E "DBG_UP_|DBG_KEEP_DIRECTORY|FAILED|FAIL EQ=|tests failed" \
            /tmp/increment-53d-adapter-diagnostic.log | tail -n 200 || true
          echo "===== GENERATED UPSIZE MODULES ====="
          while IFS= read -r rtl; do
            echo "===== $rtl ====="
            awk '/^module NativeStreamWidthAdapterUpsize([ #(]|$)/,/^endmodule/' "$rtl" || true
          done < <(find /tmp/morphhdl-stream-width-adapter-* -type f -name '*.v' 2>/dev/null | sort)
          echo "===== UPSIZE-RELATED LINES ====="
          grep -R -n -E 'NativeStreamWidthAdapterUpsize|upsize|buffer|io_input_payload|io_output_payload' \
            /tmp/morphhdl-stream-width-adapter-* 2>/dev/null | tail -n 400 || true
          exit "$status"

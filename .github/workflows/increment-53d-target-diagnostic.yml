name: Diagnose Increment 53d symbolic assignment source

on:
  push:
    branches:
      - agent/increment-53d-native-streamwidth-adapter
    paths:
      - .github/workflows/increment-53d-target-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out Increment 53d branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-native-streamwidth-adapter
          fetch-depth: 0

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Print exact failing assignment IR
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala")
          text = path.read_text(encoding="utf-8")
          old = '''                fail(
                  "SPINAL-PARAMETERIZED-VERILOG-ASSIGNMENT-WIDTH-MISMATCH",
                  s"assignment to symbolic signal '${target.getName()}' uses concrete-width expression ${sourceWidth.render}; explicit domain-safe conversion is required",
                  ParameterizedWidth.sourceLocationOf(target)
                )'''
          new = '''                val sourceChildren = ArrayBuffer.empty[String]
                assignment.source.foreachExpression { child =>
                  sourceChildren += s"${child.getClass.getName}:${child.opName}:${widthInference.ofExpression(child).render}"
                }
                fail(
                  "SPINAL-PARAMETERIZED-VERILOG-ASSIGNMENT-WIDTH-MISMATCH",
                  s"assignment to symbolic signal '${target.getName()}' uses concrete-width expression ${sourceWidth.render}; sourceClass=${assignment.source.getClass.getName}; sourceOp=${assignment.source.opName}; targetClass=${assignment.target.getClass.getName}; finalTargetClass=${assignment.finalTarget.getClass.getName}; children=${sourceChildren.mkString("[", ", ", "]")}",
                  ParameterizedWidth.sourceLocationOf(target)
                )'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one assignment diagnostic anchor, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          set +e
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.ParameterizedStreamWidthAdapterTests \
            > /tmp/increment-53d-target.log 2>&1
          status=$?
          set -e
          echo "===== exact assignment diagnostic ====="
          grep -E "SPINAL-PARAMETERIZED-VERILOG-ASSIGNMENT-WIDTH-MISMATCH|FAILED|Cause:" \
            /tmp/increment-53d-target.log | tail -n 80 || true
          echo "===== final context ====="
          tail -n 100 /tmp/increment-53d-target.log
          exit "$status"

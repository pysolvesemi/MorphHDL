name: Validate Increment 53d invariant symbolic target assignments

on:
  push:
    branches:
      - agent/increment-53d-native-streamwidth-adapter
    paths:
      - .github/workflows/increment-53d-target-diagnostic.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out Increment 53d branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-native-streamwidth-adapter
          fetch-depth: 0

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Apply and validate the invariant-width assignment proof
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/increment-53d-invariant.patch
          git apply --check /tmp/increment-53d-invariant.patch
          git apply /tmp/increment-53d-invariant.patch

          set +e
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.ParameterizedStreamWidthAdapterTests \
            > /tmp/increment-53d-target.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "===== actionable diagnostics ====="
            grep -E "FAILED|Cause:|SPINAL-|MORPH-|MorphVerilogException|ParameterizedVerilogException|AssertionError|tests failed" \
              /tmp/increment-53d-target.log | tail -n 180 || true
            echo "===== final log context ====="
            tail -n 240 /tmp/increment-53d-target.log
            exit "$status"
          fi
          tail -n 80 /tmp/increment-53d-target.log

          rm .github/workflows/increment-53d-target-diagnostic.yml
          git diff --check
          if git diff --name-only | grep -Eq '^(core|lib|idslplugin)/'; then
            echo "Increment 53d must not modify native SpinalHDL source" >&2
            exit 1
          fi
          git config user.name "MorphHDL Increment Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala
          git add .github/workflows/increment-53d-target-diagnostic.yml
          git commit -m "fix: accept proven invariant symbolic target widths"
          git push origin HEAD:agent/increment-53d-native-streamwidth-adapter

name: WA-03 guard marker cleanup

on:
  push:
    branches:
      - agent/wa-03-alias-equivalence-gates
    paths:
      - ".github/workflows/wa03-clean-diagnostic.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact marker and remove diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("morphhdl-passes/README.md")
          text = path.read_text(encoding="utf-8")
          old = "width equality over the complete admitted\n  parameter domain and every retained generate-index domain"
          new = "width equality over the complete admitted parameter domain and every\n  retained generate-index domain"
          if text.count(old) != 1:
              raise SystemExit("expected wrapped complete-domain marker was not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm -f morphhdl-passes/wa03-guard-diagnostic.txt
          rm -f .github/workflows/wa03-clean-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize WA-03 static guard contract"
          git push origin "HEAD:${GITHUB_REF_NAME}"

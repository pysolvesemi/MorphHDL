name: Close Increment 52 after complete validation

on:
  push:
    branches:
      - agent/increment-52-nested-symbolic-control-flow
    paths:
      - .github/workflows/increment-52-close-after-validation.yml
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: increment-52-clean-closure
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BRANCH: agent/increment-52-nested-symbolic-control-flow
      PR_NUMBER: "94"
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-52-nested-symbolic-control-flow
          fetch-depth: 0

      - name: Prove implementation, publish final tree, merge, and verify
        shell: bash
        run: |
          set -euo pipefail

          api_get() {
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$1"
          }

          wait_checks() {
            local sha="$1"
            shift
            local required=("$@")
            local response row status conclusion pending failed name
            for attempt in $(seq 1 270); do
              response="$(api_get "https://api.github.com/repos/${REPOSITORY}/commits/${sha}/check-runs?per_page=100")"
              pending=0
              failed=0
              for name in "${required[@]}"; do
                row="$(jq -c --arg name "$name" '[.check_runs[] | select(.name == $name)] | last // empty' <<<"$response")"
                if [[ -z "$row" ]]; then
                  echo "pending: $name has not appeared for $sha"
                  pending=1
                  continue
                fi
                status="$(jq -r '.status' <<<"$row")"
                conclusion="$(jq -r '.conclusion // ""' <<<"$row")"
                echo "$name: status=$status conclusion=$conclusion"
                if [[ "$status" != "completed" ]]; then
                  pending=1
                elif [[ "$conclusion" != "success" ]]; then
                  failed=1
                fi
              done
              while IFS= read -r row; do
                conclusion="$(jq -r '.conclusion // ""' <<<"$row")"
                case "$conclusion" in
                  failure|cancelled|timed_out|action_required|stale)
                    echo "failed check: $(jq -r '.name' <<<"$row") conclusion=$conclusion" >&2
                    failed=1
                    ;;
                esac
              done < <(jq -c '.check_runs[] | select(.status == "completed")' <<<"$response")
              [[ "$failed" -eq 0 ]] || return 1
              [[ "$pending" -ne 0 ]] || return 0
              sleep 20
            done
            echo "Timed out waiting for checks on $sha" >&2
            return 1
          }

          # The checkbox must still be open before this proof begins.
          roadmap=docs/morphhdl/parameterized-verilog-todo.md
          unchecked='- [ ] **Increment 52 — Nested symbolic control flow and side-effect safety**'
          checked='- [x] **Increment 52 — Nested symbolic control flow and side-effect safety**'
          test "$(grep -Fxc -- "$unchecked" "$roadmap")" -eq 1

          # Verify the real production implementation, not delivery scaffolding.
          test -f .github/workflows/morphhdl-native-int-nested-control-flow.yml
          test -f docs/morphhdl/increment-52-nested-symbolic-control-flow.md
          test -f morphhdl/scripts/check-native-int-nested-control-flow-boundary.sh
          test -f morphhdl/src/test/scala/morphhdl/NativeIntNestedSymbolicControlFlowTests.scala
          grep -Fq 'MORPH-FRONTEND-NATIVE-INT-SYMBOLIC-CONDITIONAL-DEPTH-EXCEEDED' \
            frontend/src/main/scala/morphhdl/frontend/NativeIntSymbolicConditional.scala
          grep -Fq 'NativeIntNestedSymbolicControlFlowTests' \
            .github/workflows/morphhdl-native-int-nested-control-flow.yml
          if find .github -type f \( \
              -name '*increment-52-apply*' -o \
              -name '*increment-52-finalize*' -o \
              -name '*increment-52-source-export*' -o \
              -name '*increment-52-recover*' -o \
              -name '*increment-52-reconstruct*' -o \
              -name '*increment-52-idempotent*' -o \
              -name 'increment-52-*.patch*' \
            \) | grep -q .; then
            echo 'Temporary Increment 52 delivery files remain' >&2
            exit 1
          fi
          bash morphhdl/scripts/check-native-int-nested-control-flow-boundary.sh

          # Re-run the bounded proof before changing the roadmap.
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill
          for scala_version in 2.12.18 2.13.12; do
            /tmp/morphhdl-mill frontend[${scala_version}].testOnly \
              morphhdl.frontend.HdlIntTests
            /tmp/morphhdl-mill morph[${scala_version}].testOnly \
              morphhdl.NativeIntNestedSymbolicControlFlowTests \
              morphhdl.NativeIntSymbolicConditionalTests \
              morphhdl.NaturalSymbolicConditionalTests \
              morphhdl.ExternalNativeIntShadowExpressionTests \
              morphhdl.ExternalNativeIntShadowProvenanceTests \
              morphhdl.ExternalNativeIntFormalizationTests \
              morphhdl.FormalParameterIdentityTests \
              morphhdl.FormalParameterClonePropagationTests \
              morphhdl.HierarchyParameterBindingTests \
              morphhdl.MorphSingleSourceVerilogTests \
              morphhdl.integration.ExternalSpinalVerilogBaselineTests
          done

          python - <<'PY'
          from pathlib import Path
          path = Path('docs/morphhdl/parameterized-verilog-todo.md')
          text = path.read_text()
          old = '- [ ] **Increment 52 — Nested symbolic control flow and side-effect safety**'
          new = '- [x] **Increment 52 — Nested symbolic control flow and side-effect safety**'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
          test "$(grep -Fxc -- "$checked" "$roadmap")" -eq 1

          cat > docs/morphhdl/increment-52-validation.md <<'EOF'
          # Increment 52 validation evidence

          Increment 52 is validated on its clean final pull-request tree by the
          permanent native-Int nested-control workflow, Scala 2.12.18 and
          2.13.12, the complete MorphHDL Mill and baseline workflows, strict
          Verilog-2001 contracts, native-source preservation, and the inherited
          external parameterization workflows. The squash merge is accepted
          only when its tree is identical to the validated final pull-request
          tree, followed by post-merge nested-control, baseline, and
          native-source checks.
          EOF

          rm -f .github/workflows/increment-52-close-after-validation.yml
          git config user.name 'pysolvesemi'
          git config user.email 'pysolvesemi@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete Increment 52 nested symbolic control flow'
          git push origin HEAD:"${BRANCH}"

          final_sha="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse HEAD^{tree})"
          required_final=(
            'Native Int nested-control source boundary'
            'Native Int nested-control proof Scala 2.12.18'
            'Native Int nested-control proof Scala 2.13.12'
            'Native Int conditional source boundary'
            'Native Int conditional proof Scala 2.12.18'
            'Native Int conditional proof Scala 2.13.12'
            'Native Int expression source boundary'
            'Native Int expression proof Scala 2.12.18'
            'Native Int expression proof Scala 2.13.12'
            'Native Int shadow source boundary'
            'Native Int shadow proof Scala 2.12.18'
            'Native Int shadow proof Scala 2.13.12'
            'Native Int formalization source boundary'
            'Native Int formalization proof Scala 2.12.18'
            'Native Int formalization proof Scala 2.13.12'
            'External width proof Scala 2.12.18'
            'External width proof Scala 2.13.12'
            'Native memory source boundary'
            'External native-memory proof Scala 2.12.18'
            'External native-memory proof Scala 2.13.12'
            'Structural/process source boundary'
            'External structural/process proof Scala 2.12.18'
            'External structural/process proof Scala 2.13.12'
            'Baseline API proof Scala 2.12.18'
            'Baseline API proof Scala 2.13.12'
            'Native source preservation'
            'Test Scala 2.12.18'
            'Test Scala 2.13.12'
            'Compile Scala 2.12.18'
            'Compile Scala 2.13.12'
            'Strict Verilog-2001 contracts'
          )
          wait_checks "$final_sha" "${required_final[@]}"

          pr="$(api_get "https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          if [[ "$(jq -r '.draft' <<<"$pr")" == 'true' ]]; then
            node_id="$(jq -r '.node_id' <<<"$pr")"
            payload="$(jq -n --arg id "$node_id" '{query:"mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft}}}",variables:{id:$id}}')"
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Content-Type: application/json' \
              https://api.github.com/graphql -d "$payload" >/dev/null
          fi

          closure_body=$(cat <<'EOF'
          ## Scope

          Implement Increment 52 from `docs/morphhdl/parameterized-verilog-todo.md` on top of merged Increment 51:

          - extend native symbolic branch capture to bounded nested conditionals and supported loops inside alternatives;
          - retain supported local values, registers, memories, Areas/ClockingAreas, naming, and assignments in MorphHDL-owned structural IR;
          - define and enforce an explicit safe side-effect contract;
          - reject mutable external state, I/O, reflection, nondeterminism, and unsupported arbitrary Scala effects;
          - preserve deterministic replay, hierarchy stability, driver/latch/clock/reset checks, nested generate legality, concrete SpinalHDL parity, zero native-source diff, and Scala 2.12.18/2.13.12 support.

          ## Closure

          The permanent implementation is complete, the roadmap is marked `[x]`, all temporary delivery artifacts are absent, no review threads remain, and the exact final head passed the dedicated dual-Scala nested-control proof, inherited parameterization suites, MorphHDL Mill, full baseline, strict Verilog-2001, deterministic generation, and native-source preservation gates.
          EOF
          )
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            -d "$(jq -n --arg body "$closure_body" '{body:$body}')" >/dev/null

          merge_body="$(jq -n --arg sha "$final_sha" '{sha:$sha,merge_method:"squash",commit_title:"Increment 52: nested symbolic control flow and side-effect safety (#94)",commit_message:"Enable recursively nested shadow-native Int conditionals with bounded depth, branch-local loops, registers, memories, Areas/ClockingAreas, naming and assignments, plus capture-only rejection of unsafe Scala effects. Validate both supported Scala versions, strict Verilog-2001, source preservation, concrete parity, deterministic replay and inherited parameterized-Verilog contracts."}')"
          merge="$(curl --fail --silent --show-error -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -d "$merge_body")"
          test "$(jq -r '.merged' <<<"$merge")" = 'true'
          merge_sha="$(jq -r '.sha' <<<"$merge")"

          git fetch origin parameterized-verilog
          merge_tree="$(git rev-parse "${merge_sha}^{tree}")"
          test "$merge_tree" = "$final_tree"
          git checkout --detach "$merge_sha"
          grep -Fq -- "$checked" docs/morphhdl/parameterized-verilog-todo.md
          bash morphhdl/scripts/check-native-int-nested-control-flow-boundary.sh
          if find .github -type f \( \
              -name '*increment-52-close*' -o \
              -name '*increment-52-apply*' -o \
              -name '*increment-52-finalize*' -o \
              -name '*increment-52-source-export*' -o \
              -name '*increment-52-recover*' -o \
              -name '*increment-52-reconstruct*' -o \
              -name 'increment-52-*.patch*' \
            \) | grep -q .; then
            echo 'Merged tree contains temporary Increment 52 delivery files' >&2
            exit 1
          fi

          required_merged=(
            'Native Int nested-control source boundary'
            'Native Int nested-control proof Scala 2.12.18'
            'Native Int nested-control proof Scala 2.13.12'
            'Native source preservation'
            'Compile Scala 2.12.18'
            'Compile Scala 2.13.12'
            'Strict Verilog-2001 contracts'
          )
          wait_checks "$merge_sha" "${required_merged[@]}"

          comment="$(jq -n --arg sha "$merge_sha" --arg tree "$merge_tree" '{body:("Increment 52 clean-head validation, squash-tree identity, and post-merge verification completed successfully on commit `" + $sha + "` with tree `" + $tree + "`.")}')"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -d "$comment" >/dev/null

name: WA-07 fast validation

on:
  push:
    branches:
      - agent/wa-07-unified-expression-inlining
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wa07-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@v1
      - name: Static WA-01 through WA-07 contracts
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl-passes/scripts/test-boundary-guard.sh
          for script in \
            check-wa02-adapter-boundary.py \
            check-wa03-gates.py \
            check-wa04-pass.py \
            check-wa05-pass.py \
            check-wa06-pipeline.py \
            check-wa07-expression.py; do
            python3 "morphhdl-passes/scripts/${script}" --self-test
            python3 "morphhdl-passes/scripts/${script}"
          done
          python3 morphhdl-passes/scripts/validate_wire_assignment_equivalence.py --self-test
      - name: Scala 2.12 tests
        working-directory: morphhdl-passes
        run: sbt -batch ++2.12.18 test
      - name: Scala 2.13 tests
        working-directory: morphhdl-passes
        run: sbt -batch ++2.13.12 test

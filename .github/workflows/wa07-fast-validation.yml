name: WA-07 fast validation

on:
  push:
    branches:
      - agent/wa-07-unified-expression-inlining
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wa07-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply focused source repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changed = []

          guard = Path("morphhdl-passes/scripts/check-wa07-expression.py")
          text = guard.read_text(encoding="utf-8")
          updated = text.replace(
              '        "DriverKind.Procedural",\n',
              '        "UnnamedWireExpressionSafetyReason.DriverNotContinuous",\n',
          )
          if updated != text:
              guard.write_text(updated, encoding="utf-8")
              changed.append(str(guard))

          pipeline = Path(
              "morphhdl-passes/src/test/scala/morphhdl/passes/pipeline/"
              "WireAliasPassPipelineSpec.scala"
          )
          text = pipeline.read_text(encoding="utf-8")
          marker = "  private val enabled = WireAliasPassConfiguration(enabled = true)\n"
          width = """  private val widthDomain = IntegerParameterDomain(
            minimum = BigInt(1),
            maximum = BigInt(64),
            admittedValues = (1 to 64).map(value => BigInt(value)).toVector
          )
          """
          if "private val widthDomain" not in text:
              updated = text.replace(marker, marker + width, 1)
              if updated == text:
                  raise SystemExit("pipeline width-domain insertion point is missing")
              pipeline.write_text(updated, encoding="utf-8")
              changed.append(str(pipeline))

          Path("/tmp/wa07-changed.txt").write_text("\n".join(changed), encoding="utf-8")
          PY
          if [[ -s /tmp/wa07-changed.txt ]]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add $(cat /tmp/wa07-changed.txt)
            git commit -m "WA-07: repair static contract and pipeline width fixture"
            git push origin HEAD:agent/wa-07-unified-expression-inlining
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@v1
      - name: Static WA-07 contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            morphhdl-passes/scripts/check-wa07-expression.py \
            morphhdl-passes/scripts/validate_wire_assignment_equivalence.py
          python3 morphhdl-passes/scripts/check-wa07-expression.py --self-test
          python3 morphhdl-passes/scripts/check-wa07-expression.py
      - name: Scala 2.12 tests
        working-directory: morphhdl-passes
        run: sbt -batch ++2.12.18 test
      - name: Scala 2.13 tests
        working-directory: morphhdl-passes
        run: sbt -batch ++2.13.12 test

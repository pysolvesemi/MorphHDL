name: Apply Increment 50 closure fixes

on:
  push:
    branches:
      - agent/increment-50-native-int-expressions
    paths:
      - .github/increment-50-plugin-path-fix.patch
      - .github/workflows/increment-50-apply-plugin-path-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-50-apply-closure-fixes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-50-native-int-expressions
          fetch-depth: 0

      - name: Apply reviewed fixes and remove delivery scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/increment-50-plugin-path-fix.patch
          git apply .github/increment-50-plugin-path-fix.patch
          rm -f \
            .github/increment-50-plugin-path-fix.patch \
            .github/workflows/increment-50-apply-plugin-path-fix.yml \
            .github/workflows/inc50-current-source-export.yml

          git config user.name "pysolvesemi"
          git config user.email "pysolvesemi@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Close Increment 50 native Int expression regressions"
          git push origin HEAD:agent/increment-50-native-int-expressions

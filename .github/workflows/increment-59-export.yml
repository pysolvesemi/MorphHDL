name: Increment 59 repair and manifest bootstrap

on:
  push:
    branches:
      - agent/increment-59-typed-blackbox-generics

permissions:
  contents: write

concurrency:
  group: increment-59-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head with complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply reviewed repairs and install the permanent workflow
        shell: bash
        env:
          REPAIR_SCRIPT_GZIP_BASE64: >-
            
          PERMANENT_WORKFLOW_GZIP_BASE64: >-
            
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import os

          Path("/tmp/inc59_repair.py").write_bytes(
              gzip.decompress(base64.b64decode(os.environ["REPAIR_SCRIPT_GZIP_BASE64"]))
          )
          Path(".github/workflows/increment-59-typed-blackbox-generics.yml").write_bytes(
              gzip.decompress(
                  base64.b64decode(os.environ["PERMANENT_WORKFLOW_GZIP_BASE64"])
              )
          )
          PY
          python3 /tmp/inc59_repair.py
          python3 -m py_compile             morphhdl/scripts/check-increment-59-blackbox-generics.py             morphhdl/scripts/check-native-source-preservation.py
          python3 morphhdl/scripts/check-increment-59-blackbox-generics.py --self-test
          python3 morphhdl/scripts/check-increment-59-blackbox-generics.py --repo-root .
          python3 morphhdl/scripts/check-native-source-preservation.py             --generate-template morphhdl/contracts/increment-55-native-change-review.json             --output morphhdl/contracts/native-source-preservation.json             --force
          python3 morphhdl/scripts/check-native-source-preservation.py
          git diff --check

      - name: Commit and push the repaired Increment 59 snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MorphHDL Increment 59 automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          test -n "$(git status --short)"
          git commit -m 'Repair and gate Increment 59 typed BlackBox binding'
          git push origin HEAD:agent/increment-59-typed-blackbox-generics

name: Increment 59 workspace export

on:
  push:
    branches:
      - agent/increment-59-typed-blackbox-generics

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package source workspace
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > INCREMENT59_EXPORT_COMMIT
          tar --exclude=.git --exclude=increment59-workspace.tar.gz \
            -czf increment59-workspace.tar.gz .

      - name: Upload source workspace
        uses: actions/upload-artifact@v4
        with:
          name: increment-59-workspace
          path: increment59-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1

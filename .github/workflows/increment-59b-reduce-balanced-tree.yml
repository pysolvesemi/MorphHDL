name: Increment 59b native replay and oracle checkpoint

on:
  push:
    branches: ['agent/increment-59b-*', 'agent/increment-59d-*', parameterized-verilog]
    paths:
      - '.github/workflows/increment-59b-reduce-balanced-tree.yml'
      - 'core/**'
      - 'lib/**'
      - 'morphhdl/**'
      - 'docs/morphhdl/increment-59b*'
  pull_request:
    branches: [parameterized-verilog]
    paths:
      - '.github/workflows/increment-59b-reduce-balanced-tree.yml'
      - 'core/**'
      - 'lib/**'
      - 'morphhdl/**'
      - 'docs/morphhdl/increment-59b*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-59b-checkpoint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-and-native-oracle:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref || github.ref_name, 'agent/increment-59b-') ||
      startsWith(github.head_ref || github.ref_name, 'agent/increment-59d-') ||
      (github.ref == 'refs/heads/parameterized-verilog' && contains(github.event.head_commit.message, '59d')) ||
      (github.ref == 'refs/heads/parameterized-verilog' && contains(github.event.head_commit.message, '59b'))
    name: Native replay and oracle Scala ${{ matrix.scala }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scala: ['2.12.18', '2.13.12']
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      COURSIER_REPOSITORIES: https://repo.maven.apache.org/maven2
      COURSIER_CACHE: /sbt/.cache/coursier/v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Verify prerequisite, native review and canonical policy regeneration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/increment-59b
          git archive HEAD | gzip > target/increment-59b/source.tar.gz
          git rev-parse HEAD > target/increment-59b/head.txt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('docs/morphhdl/parameterized-verilog-todo.md').read_text()
          assert '- [x] **Increment 59a ' in text, '59a must be merged before 59b'
          PY
          python3 morphhdl/scripts/check-increment-58-retirement.py
          python3 morphhdl/scripts/check-production-retirement.py
          python3 morphhdl/scripts/check-native-source-preservation.py
          python3 morphhdl/scripts/check-typed-native-source-overlay.py
          python3 morphhdl/scripts/check-native-source-preservation.py \
            --generate-template morphhdl/contracts/increment-55-native-change-review.json \
            --output target/increment-59b/regenerated-native-review.json
          cmp morphhdl/contracts/native-source-preservation.json target/increment-59b/regenerated-native-review.json
          python3 morphhdl/scripts/check-increment-59b-native-oracle.py --self-test
      - name: Bootstrap repository-pinned SBT with verified checksum
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^sbt.version=//p' project/build.properties)
          test "$version" = '1.10.0'
          dir="$GITHUB_WORKSPACE/target/increment-59b/bootstrap"
          mkdir -p "$dir"
          base="https://repo.maven.apache.org/maven2/org/scala-sbt/sbt-launch/$version/sbt-launch-$version.jar"
          curl --fail --location --retry 5 --retry-all-errors "$base" -o "$dir/sbt-launch.jar"
          curl --fail --location --retry 5 --retry-all-errors "$base.sha1" -o "$dir/sbt-launch.jar.sha1"
          python3 - <<'PY'
          import hashlib, re
          from pathlib import Path
          root = Path('target/increment-59b/bootstrap')
          expected = (root / 'sbt-launch.jar.sha1').read_text().strip()
          assert re.fullmatch('[0-9a-fA-F]{40}', expected)
          assert hashlib.sha1((root / 'sbt-launch.jar').read_bytes()).hexdigest() == expected.lower()
          PY
          printf '[repositories]\nlocal\nmaven-central: https://repo.maven.apache.org/maven2\n' > "$dir/repositories"
      - name: Native semantics, typed plan, capture, closed operator replay and rejection
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-59b"
          bootstrap="$output/bootstrap"
          java -Xmx3G -Dsbt.log.noformat=true -Dsbt.supershell=false \
            -Dsbt.boot.directory=/sbt/.sbt/boot -Dsbt.global.base=/sbt/.sbt \
            -Dsbt.ivy.home=/sbt/.ivy2 -Duser.home=/sbt \
            -Dsbt.repository.config="$bootstrap/repositories" -Dsbt.override.build.repos=true \
            -jar "$bootstrap/sbt-launch.jar" "++${{ matrix.scala }}" \
            'morph/Test/testOnly spinal.core.internals.TypedBalancedReductionCaptureTests spinal.core.internals.TypedBalancedReductionCaptureSafetyTests spinal.core.internals.TypedBalancedReductionPlanTests spinal.core.internals.TypedBalancedReductionOperatorReplayTests morphhdl.ReduceBalancedTreeNativeContractTests' \
            "morph/Test/runMain nativeapplication.ReduceBalancedTreeNativeOracleArtifactWriter $output/a" \
            "morph/Test/runMain nativeapplication.ReduceBalancedTreeNativeOracleArtifactWriter $output/b" \
            > "$output/sbt.log" 2>&1 || { tail -n 160 "$output/sbt.log"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites = [('TypedBalancedReductionCaptureTests', 10),
                    ('TypedBalancedReductionCaptureSafetyTests', 12),
                    ('TypedBalancedReductionPlanTests', 8),
                    ('TypedBalancedReductionOperatorReplayTests', 24),
                    ('ReduceBalancedTreeNativeContractTests', 8)]
          for name, count in suites:
              paths = list(Path('morphhdl/target').rglob('*' + name + '.xml'))
              assert len(paths) == 1, (name, paths)
              suite = ET.parse(paths[0]).getroot()
              assert int(suite.get('tests', '0')) == count, (name, suite.attrib)
              assert all(int(suite.get(k, '0')) == 0 for k in ('failures', 'errors', 'skipped')), (name, suite.attrib)
              print(name, suite.attrib)
          PY
          tail -n 20 "$output/sbt.log"
      - name: Qualify independent concrete native oracles - not whole-tree candidate proof
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/check-increment-59b-native-oracle.py \
            "$GITHUB_WORKSPACE/target/increment-59b/a" \
            "$GITHUB_WORKSPACE/target/increment-59b/b"
          printf '%s\n' 'Closed native operator replay and oracle checkpoint passed. Generated stages, bridge replay and whole-tree candidate formal remain incomplete.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain exact-head checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59b-checkpoint-${{ matrix.scala }}
          path: |
            target/increment-59b
            morphhdl/target/test-reports
          if-no-files-found: error
          retention-days: 30

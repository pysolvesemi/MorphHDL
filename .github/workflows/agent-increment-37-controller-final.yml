name: Agent Increment 37 clean completion controller

on:
  push:
    branches:
      - agent/increment-37-controller-final-2
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: increment-37-clean-completion
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Complete Increment 37
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/increment-37/repair_apply_increment_37.py
          python3 .github/increment-37/repair_build_increment_37_test.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/increment-37/apply_increment_37.py')
          text = path.read_text()
          old = '''      val pointerContext =
                lower.contains("pushptr") || lower.contains("popptr") ||
                  lower.contains("push_ptr") || lower.contains("pop_ptr") ||
                  (lower.contains("address") &&
                    (lower.contains("ram") || lower.contains("memory")))
          '''
          new = '''      // Normal emission uses logic_ptr_push/logic_ptr_pop while other
              // contexts use pushPtr/popPtr. Normalize separators and accept both
              // word orders so a non-power-of-two override never retains the
              // concrete witness terminal.
              val compactName = lower.replace("_", "")
              val pointerContext =
                compactName.contains("pushptr") || compactName.contains("popptr") ||
                  compactName.contains("ptrpush") || compactName.contains("ptrpop") ||
                  compactName.contains("poponio") ||
                  (lower.contains("address") &&
                    (lower.contains("ram") || lower.contains("memory")))
          '''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('Increment 37 pointer-context rewrite anchor was not found')
              text = text.replace(old, new, 1)
          path.write_text(text)
          print('Recognized normal-emitter StreamFifo pointer naming in Increment 37')
          PY
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/increment-37/build_increment_37_test.py')
          text = path.read_text()
          anchor = 'TARGET.write_bytes(zlib.decompress(base64.b64decode(PAYLOAD)))\n'
          if anchor not in text:
              raise SystemExit('Increment 37 focused-test write anchor was not found')
          patch = anchor + '''source = TARGET.read_text()
          old = ''' + '"""' + '''    val simulationLog = run(directory, Seq("vvp", executable.toString))
              assert(simulationLog._1 == 0, simulationLog._2)
              assert(
                simulationLog._2.contains(s"PASS depth=$selectedDepth"),
                simulationLog._2
              )
          ''' + '"""' + '''
          new = ''' + '"""' + '''    val simulationLog = run(directory, Seq("vvp", executable.toString))
              if (
                simulationLog._1 != 0 ||
                  !simulationLog._2.contains(s"PASS depth=$selectedDepth")
              ) {
                println(s"--- BEGIN PARAMETERIZED FIFO RTL depth=$selectedDepth ---")
                println(read(rtl))
                println(s"--- END PARAMETERIZED FIFO RTL depth=$selectedDepth ---")
              }
              assert(simulationLog._1 == 0, simulationLog._2)
              assert(
                simulationLog._2.contains(s"PASS depth=$selectedDepth"),
                simulationLog._2
              )
          ''' + '"""' + '''
          if source.count(old) != 1:
              raise SystemExit('Increment 37 simulation assertion anchor was not found')
          TARGET.write_text(source.replace(old, new, 1))
          '''
          path.write_text(text.replace(anchor, patch, 1))
          print('Instrumented Increment 37 generated RTL failure diagnostics')
          PY
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/increment-37/complete_increment_37.py')
          text = path.read_text()
          start = text.find('def api(\n')
          end = text.find('\n\ndef branch_sha', start)
          if start < 0 or end < 0:
              raise SystemExit('Increment 37 controller API anchors were not found')
          replacement = '''def api(
              method: str,
              path: str,
              *,
              data: dict | None = None,
              allow: tuple[int, ...] = (),
          ) -> tuple[int, object | None]:
              url = f"https://api.github.com/repos/{REPO}{path}"
              body = None if data is None else json.dumps(data).encode("utf-8")
              attempts = 5
              for attempt in range(1, attempts + 1):
                  request = urllib.request.Request(url, data=body, method=method)
                  request.add_header("Authorization", f"Bearer {TOKEN}")
                  request.add_header("Accept", "application/vnd.github+json")
                  request.add_header("X-GitHub-Api-Version", "2022-11-28")
                  if body is not None:
                      request.add_header("Content-Type", "application/json")
                  try:
                      with urllib.request.urlopen(request, timeout=60) as response:
                          payload = response.read()
                          decoded = json.loads(payload) if payload else None
                          return response.status, decoded
                  except urllib.error.HTTPError as error:
                      payload = error.read()
                      decoded: object | None
                      try:
                          decoded = json.loads(payload) if payload else None
                      except json.JSONDecodeError:
                          decoded = payload.decode("utf-8", errors="replace")
                      if error.code in allow:
                          return error.code, decoded
                      retryable = error.code == 429 or 500 <= error.code < 600
                      if retryable and attempt < attempts:
                          delay = min(2 ** (attempt - 1), 8)
                          print(
                              f"GitHub API {method} {path} returned {error.code}; "
                              f"retrying in {delay}s ({attempt}/{attempts})"
                          )
                          time.sleep(delay)
                          continue
                      raise RuntimeError(
                          f"GitHub API {method} {path} failed: {error.code} {decoded}"
                      ) from error
                  except (urllib.error.URLError, TimeoutError, OSError) as error:
                      if attempt < attempts:
                          delay = min(2 ** (attempt - 1), 8)
                          print(
                              f"GitHub API {method} {path} transport failure {error}; "
                              f"retrying in {delay}s ({attempt}/{attempts})"
                          )
                          time.sleep(delay)
                          continue
                      raise RuntimeError(
                          f"GitHub API {method} {path} transport failure after {attempts} attempts: {error}"
                      ) from error
              raise RuntimeError(f"GitHub API {method} {path} exhausted retries")
          '''
          path.write_text(text[:start] + replacement + text[end:])
          print('Hardened Increment 37 controller GitHub API retries')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/increment-37/apply_increment_37.py \
            .github/increment-37/build_increment_37_test.py \
            .github/increment-37/complete_increment_37.py
          git diff --cached --quiet || \
            git commit --no-gpg-sign -m 'Apply Increment 37 controller fixture repairs'
          python3 .github/increment-37/complete_increment_37.py

name: Agent Increment 37 clean completion controller

on:
  push:
    branches:
      - agent/increment-37-controller-final-2
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: increment-37-clean-completion
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Complete Increment 37
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/increment-37/repair_apply_increment_37.py
          python3 .github/increment-37/repair_build_increment_37_test.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/increment-37/build_increment_37_test.py')
          text = path.read_text()
          anchor = 'TARGET.write_bytes(zlib.decompress(base64.b64decode(PAYLOAD)))\n'
          if anchor not in text:
              raise SystemExit('Increment 37 focused-test write anchor was not found')
          patch = anchor + '''source = TARGET.read_text()
          old = ''' + '"""' + '''    val simulationLog = run(directory, Seq("vvp", executable.toString))
              assert(simulationLog._1 == 0, simulationLog._2)
              assert(
                simulationLog._2.contains(s"PASS depth=$selectedDepth"),
                simulationLog._2
              )
          ''' + '"""' + '''
          new = ''' + '"""' + '''    val simulationLog = run(directory, Seq("vvp", executable.toString))
              if (
                simulationLog._1 != 0 ||
                  !simulationLog._2.contains(s"PASS depth=$selectedDepth")
              ) {
                println(s"--- BEGIN PARAMETERIZED FIFO RTL depth=$selectedDepth ---")
                println(read(rtl))
                println(s"--- END PARAMETERIZED FIFO RTL depth=$selectedDepth ---")
              }
              assert(simulationLog._1 == 0, simulationLog._2)
              assert(
                simulationLog._2.contains(s"PASS depth=$selectedDepth"),
                simulationLog._2
              )
          ''' + '"""' + '''
          if source.count(old) != 1:
              raise SystemExit('Increment 37 simulation assertion anchor was not found')
          TARGET.write_text(source.replace(old, new, 1))
          '''
          path.write_text(text.replace(anchor, patch, 1))
          print('Instrumented Increment 37 generated RTL failure diagnostics')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/increment-37/apply_increment_37.py \
            .github/increment-37/build_increment_37_test.py
          git commit --no-gpg-sign -m 'Apply Increment 37 controller fixture repairs'
          python3 .github/increment-37/complete_increment_37.py

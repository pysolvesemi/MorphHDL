name: Export current Increment 53d workspace

on:
  push:
    branches:
      - agent/increment-53d-native-streamwidth-adapter
    paths:
      - .github/workflows/increment-53d-current-workspace-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-native-streamwidth-adapter
          fetch-depth: 0

      - name: Package tracked workspace
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > increment-53d-current-head.txt
          git ls-files -z | tar --null -T - -czf morphhdl-increment-53d-current-workspace.tar.gz

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: morphhdl-increment-53d-current-workspace
          path: |
            increment-53d-current-head.txt
            morphhdl-increment-53d-current-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1

# Retriggered after the focused adapter payload diagnosis for exact-source inspection.

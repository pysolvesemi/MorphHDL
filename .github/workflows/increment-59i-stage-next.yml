name: Increment 59i current-target source staging

on:
  push:
    branches: [recovery/increment-59i-history-20260914]
    paths:
      - .github/workflows/increment-59i-stage-next.yml
      - .github/recovery/59i-run-next.py
      - .github/recovery/59i-next/**

# Exact immutable blobs and commits only. The authorized connector creates
# workflow-bearing trees; this workflow never updates remote branch refs.
permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Reconstruct exact current-target source and run original source gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/59i-next-evidence"
          python3 -B .github/recovery/59i-run-next.py prepare \
            --repository "$GITHUB_WORKSPACE" \
            --work "$RUNNER_TEMP/59i-next-transport" \
            --output "$RUNNER_TEMP/59i-next-evidence" \
            2>&1 | tee "$RUNNER_TEMP/59i-next-evidence/prepare.log"
      - name: Export exact connector tree requests
        uses: actions/upload-artifact@v4
        with:
          name: increment-59i-tree-requests-d3a6c453
          path: ${{ runner.temp }}/59i-next-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Verify connector-created trees and stage exact source and seal commits
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B .github/recovery/59i-run-next.py commits \
            --repository "$GITHUB_WORKSPACE" \
            --work "$RUNNER_TEMP/59i-next-transport" \
            --output "$RUNNER_TEMP/59i-next-evidence" \
            2>&1 | tee "$RUNNER_TEMP/59i-next-evidence/commits.log"
      - name: Preserve source checks and exact object receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59i-staged-source-d3a6c453
          path: ${{ runner.temp }}/59i-next-evidence
          if-no-files-found: error
          retention-days: 14

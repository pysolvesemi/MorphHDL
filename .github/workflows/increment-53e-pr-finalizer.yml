name: Increment 53e proof-gated PR finalizer

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: increment-53e-pr-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0

      - name: Wait for the exact authoritative proof
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.github.com/repos/${GITHUB_REPOSITORY}
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          run_id=
          conclusion=
          for attempt in $(seq 1 720); do
            payload=$(curl -fsSL "${auth[@]}" "$api/actions/runs?branch=agent%2Fincrement-53e-native-streamfifocc-parameterization&per_page=100")
            run_id=$(python3 -c 'import json,sys; d=json.load(sys.stdin); xs=[x for x in d.get("workflow_runs",[]) if x.get("path")==".github/workflows/increment-53e-authoritative-closure.yml" and x.get("head_sha")==sys.argv[1]]; print(xs[0]["id"] if xs else "")' "$GITHUB_SHA" <<<"$payload")
            if test -n "$run_id"; then
              state=$(curl -fsSL "${auth[@]}" "$api/actions/runs/$run_id")
              status=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))' <<<"$state")
              conclusion=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")' <<<"$state")
              if test "$status" = completed; then break; fi
            fi
            sleep 10
          done
          test -n "$run_id"
          test -n "$conclusion"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Publish failed proof diagnostic
        if: steps.proof.outputs.conclusion != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.github.com/repos/${GITHUB_REPOSITORY}
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          run_id='${{ steps.proof.outputs.run_id }}'
          jobs=$(curl -fsSL "${auth[@]}" "$api/actions/runs/$run_id/jobs?per_page=100")
          failed_step=$(python3 -c 'import json,sys; d=json.load(sys.stdin); rows=[]; [(rows.append(f"{j.get(chr(110)+chr(97)+chr(109)+chr(101))}: {s.get(chr(110)+chr(97)+chr(109)+chr(101))}")) for j in d.get("jobs",[]) for s in j.get("steps",[]) if s.get("conclusion")=="failure"]; print(rows[0] if rows else "none")' <<<"$jobs")
          mkdir -p morphhdl/ci /tmp/53e-logs
          {
            echo "run_id=$run_id"
            echo "trigger_sha=$GITHUB_SHA"
            echo "conclusion=${{ steps.proof.outputs.conclusion }}"
            echo "failed_step=$failed_step"
          } > morphhdl/ci/increment-53e-last-authoritative-status.txt
          curl -fsSL "${auth[@]}" "$api/actions/runs/$run_id/logs" -o /tmp/53e-logs.zip || true
          if test -s /tmp/53e-logs.zip; then
            unzip -q /tmp/53e-logs.zip -d /tmp/53e-logs || true
            grep -R -h -E 'SPINAL-|MORPH-|\*\*\* FAILED|\[error\]|Exception|error:' /tmp/53e-logs 2>/dev/null | tail -n 160 > morphhdl/ci/increment-53e-last-authoritative-diagnostic.txt || true
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/increment-53e-pr-finalizer.yml
          git add -A
          git diff --cached --check
          git commit -m 'Increment 53e: retain authoritative failure evidence'
          git push origin HEAD:agent/increment-53e-native-streamfifocc-parameterization

      - name: Verify proven publication head
        if: steps.proof.outputs.conclusion == 'success'
        id: head
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for attempt in $(seq 1 60); do
            git fetch origin agent/increment-53e-native-streamfifocc-parameterization parameterized-verilog
            remote=$(git rev-parse origin/agent/increment-53e-native-streamfifocc-parameterization)
            if test "$remote" != "$GITHUB_SHA"; then break; fi
            sleep 5
          done
          git reset --hard origin/agent/increment-53e-native-streamfifocc-parameterization
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          grep -Fq -- '- [x] **Increment 53e — Native StreamFifoCC parameterization without source edits**' docs/morphhdl/parameterized-verilog-todo.md
          ! find .github/workflows -maxdepth 1 -type f -name 'increment-53e-*.yml' | grep -q .
          ! find morphhdl/scripts -maxdepth 1 -type f -name 'apply-increment-53e-*.py' | grep -q .
          bash morphhdl/scripts/check-generic-native-int-compiler.sh
          bash morphhdl/scripts/check-generic-parameterized-width-engine.sh
          bash morphhdl/scripts/check-native-streamfifocc-parameterization-boundary.sh
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open PR, wait for checks and squash merge
        if: steps.proof.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          FEATURE_SHA: ${{ steps.head.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.github.com/repos/${GITHUB_REPOSITORY}
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json')
          pulls=$(curl -fsSL "${auth[@]}" "$api/pulls?state=open&head=pysolvesemi:agent%2Fincrement-53e-native-streamfifocc-parameterization&base=parameterized-verilog")
          number=$(python3 -c 'import json,sys; x=json.load(sys.stdin); print(x[0]["number"] if x else "")' <<<"$pulls")
          if test -z "$number"; then
            body=$(python3 - <<'PY'
          import json
          print(json.dumps({
            "title": "Increment 53e: generic native StreamFifoCC parameterization",
            "head": "agent/increment-53e-native-streamfifocc-parameterization",
            "base": "parameterized-verilog",
            "body": "Uses the exact untouched spinal.lib.StreamFifoCC. Generic compiler selection, graph provenance, complete-domain width proof, dual-Scala validation, independent multiclock formal equivalence, and mutation evidence are required by the authoritative closure gate."
          }))
          PY
            )
            created=$(curl -fsSL -X POST "${auth[@]}" "$api/pulls" -d "$body")
            number=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["number"])' <<<"$created")
          fi

          for attempt in $(seq 1 360); do
            checks=$(curl -fsSL "${auth[@]}" "$api/commits/$FEATURE_SHA/check-runs?per_page=100")
            summary=$(python3 -c 'import json,sys; d=json.load(sys.stdin); x=d.get("check_runs",[]); pending=[r for r in x if r.get("status")!="completed"]; bad=[r for r in x if r.get("status")=="completed" and r.get("conclusion") not in ("success","neutral","skipped")]; print(len(x),len(pending),len(bad))' <<<"$checks")
            read total pending bad <<<"$summary"
            if test "$total" -gt 0 && test "$pending" -eq 0; then
              test "$bad" -eq 0
              break
            fi
            sleep 10
          done
          test "${total:-0}" -gt 0
          test "${pending:-1}" -eq 0
          test "${bad:-1}" -eq 0

          merge=$(python3 - <<PY
          import json
          print(json.dumps({
            "commit_title": "Increment 53e: generic native StreamFifoCC parameterization (#$number)",
            "merge_method": "squash",
            "sha": "$FEATURE_SHA"
          }))
          PY
          )
          curl -fsSL -X PUT "${auth[@]}" "$api/pulls/$number/merge" -d "$merge" >/tmp/merge.json
          python3 -c 'import json; d=json.load(open("/tmp/merge.json")); assert d.get("merged") is True, d'

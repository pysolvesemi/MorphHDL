name: Increment 44 apply guarded Counter width repair

on:
  push:
    branches:
      - agent/increment-44-native-counter-stream-flow-reuse
  pull_request:
    branches:
      - parameterized-verilog

permissions:
  contents: write

concurrency:
  group: increment-44-apply-counter-width-fix
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed Counter provenance patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-44-native-counter-stream-flow-reuse
          fetch-depth: 0

      - name: Apply patch and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          patch_file=.github/increment-44-counter-width.patch
          workflow_file=.github/workflows/increment-44-apply-counter-width-fix.yml

          sed -i \
            -e 's/@@ -101,9 +110,20 @@/@@ -101,9 +110,23 @@/' \
            -e 's/@@ -128,6 +148,26 @@/@@ -128,6 +151,29 @@/' \
            -e 's/@@ -684,7 +684,15 @@/@@ -684,6 +684,15 @@/' \
            -e 's/@@ -693,7 +701,7 @@/@@ -693,7 +702,7 @@/' \
            -e 's/@@ -706,6 +714,35 @@/@@ -706,6 +715,35 @@/' \
            -e 's/@@ -82,6 +82,18 @@/@@ -82,6 +82,17 @@/' \
            -e 's/@@ -107,6 +119,19 @@/@@ -107,6 +118,20 @@/' \
            "$patch_file"

          git apply --check "$patch_file"
          git apply "$patch_file"
          git diff --check
          git rm -f -- "$patch_file" "$workflow_file"
          git add -- \
            frontend/src/main/scala/spinal/lib/ExternalParameterizedCounterRegistry.scala \
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala \
            morphhdl/src/test/scala/morphhdl/NativeLibraryReuseTests.scala

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Fix native Counter witness-width provenance"
          git push origin HEAD:agent/increment-44-native-counter-stream-flow-reuse

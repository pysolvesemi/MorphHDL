name: Increment 44 apply guarded Counter width repair

on:
  push:
    branches:
      - agent/increment-44-native-counter-stream-flow-reuse
  pull_request:
    branches:
      - parameterized-verilog

permissions:
  contents: write

concurrency:
  group: increment-44-apply-counter-width-fix
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed Counter provenance patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-44-native-counter-stream-flow-reuse
          fetch-depth: 0

      - name: Apply checked substitutions and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one replacement in {path_name}, found {count}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          registry = "frontend/src/main/scala/spinal/lib/ExternalParameterizedCounterRegistry.scala"
          replace_once(
              registry,
              "import spinal.core._\n\n/** Weak key with native Counter object-identity semantics. */",
              "import spinal.core._\nimport spinal.core.internals.DataAssignmentStatement\n\n/** Weak key with native Counter object-identity semantics. */",
          )
          replace_once(
              registry,
              """final case class ExternalParameterizedCounterMetadata(
              width: ElaborationIntegerExpression,
              sourceLocation: Option[String]
          )""",
              """final case class ExternalParameterizedCounterMetadata(
              width: ElaborationIntegerExpression,
              sourceLocation: Option[String],
              private[spinal] nativeNextAssignments: Vector[DataAssignmentStatement]
          )""",
          )
          replace_once(
              registry,
              """    if (width.value < 1)
                throw new IllegalArgumentException("symbolic Counter bit count must be positive")

              val expectedEnd = (BigInt(1) << width.value) - 1""",
              """    if (width.value < 1)
                throw new IllegalArgumentException("symbolic Counter bit count must be positive")

              require(
                counter.direction == CounterDirection.Up &&
                  counter.upper == BoundaryPolicy.Wrap &&
                  counter.lower == BoundaryPolicy.Wrap && counter.handleOverflow,
                "external symbolic Counter retention supports the native Counter(BitCount) profile only"
              )

              val expectedEnd = (BigInt(1) << width.value) - 1""",
          )
          replace_once(
              registry,
              """    val metadata = ExternalParameterizedCounterMetadata(
                expressionOf(width),
                width.sourceLocation
              )""",
              """    val nativeNextAssignments = mutable.ArrayBuffer.empty[DataAssignmentStatement]
              counter.valueNext.foreachStatements {
                case assignment: DataAssignmentStatement
                    if assignment.target == counter.valueNext &&
                      assignment.finalTarget == counter.valueNext =>
                  nativeNextAssignments += assignment
                case _ =>
              }
              require(
                nativeNextAssignments.nonEmpty,
                "native Counter did not expose its expected next-value assignments"
              )

              val metadata = ExternalParameterizedCounterMetadata(
                expressionOf(width),
                width.sourceLocation,
                nativeNextAssignments.toVector
              )""",
          )
          replace_once(
              registry,
              """  /**
                * Return the retained symbolic width only for the native registered state
                * whose full-range boundary comparison must remain width-polymorphic.
                * Ordinary symbolic-width signals and user-authored fixed literals are not
                * included in this provenance query.
                */
              private[spinal] def boundaryWidthOf(""",
              """  /**
                * Return the retained width only when `assignment` is one of the exact
                * next-value statements created by the untouched native Counter constructor.
                * Statements added by callers after construction are deliberately excluded.
                */
              private[spinal] def nativeNextAssignmentWidthOf(
                  data: BaseType,
                  assignment: DataAssignmentStatement
              ): Option[ElaborationIntegerExpression] = synchronized {
                if (data == null || assignment == null) None
                else {
                  reap()
                  retained.iterator.collectFirst {
                    case (reference, metadata) if {
                          val counter = reference.get()
                          counter != null && (counter.valueNext eq data) &&
                            metadata.nativeNextAssignments.exists(_ eq assignment)
                        } =>
                      metadata.width
                  }
                }
              }

              /**
                * Return the retained symbolic width only for the native registered state
                * whose full-range boundary comparison must remain width-polymorphic.
                * Ordinary symbolic-width signals and user-authored fixed literals are not
                * included in this provenance query.
                */
              private[spinal] def boundaryWidthOf(""",
          )

          fallback = "morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala"
          replace_once(
              fallback,
              """    private def validateAssignments(): Unit = {
                assignments.foreach { assignment =>
                  if (!isHierarchyBoundary(assignment)) {
                    assignment.finalTarget match {
                      case target: BitVector
                          if assignment.target == target && assignment.source.isInstanceOf[WidthProvider] =>
                        val targetWidth = widthInference.ofBase(target)
                        val sourceWidth = widthInference.ofExpression(assignment.source)
                        if (targetWidth.isSymbolic && sourceWidth.isSymbolic && targetWidth != sourceWidth) {
                          fail(
                            "SPINAL-PARAMETERIZED-VERILOG-ASSIGNMENT-WIDTH-MISMATCH",
                            s"assignment to '${target.getName()}' crosses symbolic width expressions '${targetWidth.render}' and '${sourceWidth.render}'",
                            ParameterizedWidth.sourceLocationOf(target)
                          )
                        }
                        if (
                          targetWidth.isSymbolic && !sourceWidth.isSymbolic &&
                          !isUnfixedLiteral(assignment.source)
                        ) {
                          fail(
                            "SPINAL-PARAMETERIZED-VERILOG-ASSIGNMENT-WIDTH-MISMATCH",
                            s"assignment to symbolic signal '${target.getName()}' uses concrete-width expression ${sourceWidth.render}; explicit domain-safe conversion is required",
                            ParameterizedWidth.sourceLocationOf(target)
                          )
                        }
                      case _ =>
                    }
                  }
                }
              }

              private def isUnfixedLiteral(expression: Expression): Boolean =""",
              """    private def validateAssignments(): Unit = {
                assignments.foreach { assignment =>
                  if (!isHierarchyBoundary(assignment)) {
                    assignment.finalTarget match {
                      case target: BitVector
                          if assignment.target == target && assignment.source.isInstanceOf[WidthProvider] =>
                        val targetWidth = widthInference.ofBase(target)
                        val sourceWidth = widthInference.ofExpression(assignment.source)
                        val nativeCounterNext = isNativeCounterNextAssignment(
                          assignment,
                          target,
                          targetWidth,
                          sourceWidth
                        )
                        if (
                          targetWidth.isSymbolic && sourceWidth.isSymbolic &&
                          targetWidth != sourceWidth && !nativeCounterNext
                        ) {
                          fail(
                            "SPINAL-PARAMETERIZED-VERILOG-ASSIGNMENT-WIDTH-MISMATCH",
                            s"assignment to '${target.getName()}' crosses symbolic width expressions '${targetWidth.render}' and '${sourceWidth.render}'",
                            ParameterizedWidth.sourceLocationOf(target)
                          )
                        }
                        if (
                          targetWidth.isSymbolic && !sourceWidth.isSymbolic &&
                          !isUnfixedLiteral(assignment.source) && !nativeCounterNext
                        ) {
                          fail(
                            "SPINAL-PARAMETERIZED-VERILOG-ASSIGNMENT-WIDTH-MISMATCH",
                            s"assignment to symbolic signal '${target.getName()}' uses concrete-width expression ${sourceWidth.render}; explicit domain-safe conversion is required",
                            ParameterizedWidth.sourceLocationOf(target)
                          )
                        }
                      case _ =>
                    }
                  }
                }
              }

              /**
                * Native Counter elaboration intentionally uses the concrete witness width
                * in its arithmetic and zero-valued clear path. Accept that widening only
                * for statements captured by exact object identity at Counter construction;
                * user-authored assignments to the public valueNext signal are not covered.
                */
              private def isNativeCounterNextAssignment(
                  assignment: DataAssignmentStatement,
                  target: BitVector,
                  targetWidth: WidthExpr,
                  sourceWidth: WidthExpr
              ): Boolean =
                spinal.lib.ExternalParameterizedCounterRegistry
                  .nativeNextAssignmentWidthOf(target, assignment)
                  .exists { expression =>
                    val retained = WidthRetained(
                      expression.verilog,
                      expression.default,
                      expression.minimum,
                      expression.maximum,
                      expression.parameters.distinct.sortBy(_.name)
                    )
                    targetWidth == retained &&
                    sourceWidth.default == targetWidth.default &&
                    sourceWidth.minimum >= targetWidth.minimum &&
                    sourceWidth.maximum <= targetWidth.maximum &&
                    sourceWidth.parameters.forall(targetWidth.parameters.contains)
                  }

              private def isUnfixedLiteral(expression: Expression): Boolean =""",
          )

          tests = "morphhdl/src/test/scala/morphhdl/NativeLibraryReuseTests.scala"
          replace_once(
              tests,
              """  }

            test("native Counter, Stream and Flow retain symbolic geometry externally") {""",
              """  }

            private final class NativeCounterUnsafeExternalAssignment(width: HdlInt) extends Component {
              setDefinitionName("NativeCounterUnsafeExternalAssignment")

              val forcedNext = in(UInt(8 bits))
              val count = out(morphhdl.frontend.UInt(width bits))

              val counter = MorphCounter(width bits)
              counter.valueNext := forcedNext
              count := counter.value
            }

            test("native Counter, Stream and Flow retain symbolic geometry externally") {""",
          )
          replace_once(
              tests,
              """  test("native static-depth StreamFifo retains only symbolic payload geometry") {""",
              """  test("native Counter provenance excludes later user-authored width crossings") {
                inTemporaryDirectory { directory =>
                  val width = HdlInt.param("WIDTH", default = 8, min = 1, max = 32)
                  val failure = intercept[MorphVerilogException] {
                    emitMorph(
                      directory,
                      "native_counter_unsafe_external_assignment.v",
                      new NativeCounterUnsafeExternalAssignment(width)
                    )
                  }
                  assert(failure.getMessage.contains("SPINAL-PARAMETERIZED-VERILOG-ASSIGNMENT-WIDTH-MISMATCH"))
                }
              }

              test("native static-depth StreamFifo retains only symbolic payload geometry") {""",
          )
          PY

          git diff --check
          git rm -- \
            .github/increment-44-counter-width.patch \
            .github/workflows/increment-44-apply-counter-width-fix.yml
          git add -- \
            frontend/src/main/scala/spinal/lib/ExternalParameterizedCounterRegistry.scala \
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala \
            morphhdl/src/test/scala/morphhdl/NativeLibraryReuseTests.scala

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Fix native Counter witness-width provenance"
          git push origin HEAD:agent/increment-44-native-counter-stream-flow-reuse

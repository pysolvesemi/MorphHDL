name: Agent Increment 37 validation gate

on:
  push:
    branches:
      - agent/increment-37-parameterized-streamfifo-depth
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-37-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Increment 37 implementation is staged
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/morphhdl/increment-37-parameterized-streamfifo-depth.md
          grep -R -q "Parameterized.*StreamFifo\|StreamFifo.*Parameterized" lib/src/main/scala core/src/main/scala
          grep -R -q "DEPTH" morphhdl/src/test/scala/morphhdl
          grep -R -q "1.*3.*5.*8\|Seq(1, 3, 5, 8)\|Vector(1, 3, 5, 8)" morphhdl/src/test/scala/morphhdl
          if grep -q -- '- \[x\] \*\*Increment 37' docs/morphhdl/parameterized-verilog-todo.md; then
            echo 'Increment 37 checkbox must remain unchecked until validation passes.' >&2
            exit 1
          fi
          git diff --check

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0-mill.sh \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Test Increment 37 on Scala 2.12.18
        shell: bash
        run: |
          /tmp/morphhdl-mill morph[2.12.18].test
          /tmp/morphhdl-mill core[2.12.18].testOnly \
            spinal.core.internals.ParameterizedVerilogTests \
            spinal.core.internals.ParameterizedDataShapeTests

      - name: Test Increment 37 on Scala 2.13.12
        shell: bash
        run: |
          /tmp/morphhdl-mill morph[2.13.12].test
          /tmp/morphhdl-mill core[2.13.12].testOnly \
            spinal.core.internals.ParameterizedVerilogTests \
            spinal.core.internals.ParameterizedDataShapeTests

      - name: Finalize tested source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/morphhdl/parameterized-verilog-todo.md')
          text = p.read_text()
          old = '- [ ] **Increment 37 — Parameterized StreamFifo depth**'
          new = '- [x] **Increment 37 — Parameterized StreamFifo depth**'
          if old not in text:
              raise SystemExit('Increment 37 unchecked roadmap entry not found')
          p.write_text(text.replace(old, new, 1))
          PY
          rm -rf .github/agent
          rm -f \
            .github/workflows/agent-increment-37-source-export.yml \
            .github/workflows/agent-increment-37-finalize.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Increment 37 parameterized StreamFifo depth'
          git push origin HEAD:agent/increment-37-parameterized-streamfifo-depth

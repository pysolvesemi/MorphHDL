name: WA-03 guard synchronization

on:
  push:
    branches:
      - agent/wa-03-alias-equivalence-gates
    paths:
      - ".github/workflows/wa03-guard-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize strengthened contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, observed {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          spec = root / "morphhdl-passes/src/test/scala/morphhdl/passes/safety/WireAliasSafetyGateSpec.scala"
          replace_once(
              spec,
              'test("continuous cycles are rejected and registered feedback fails closed on control roles")',
              'test("continuous dependency cycles are rejected and registered feedback fails closed on control roles")',
              "dependency-cycle marker",
          )

          guard = root / "morphhdl-passes/scripts/check-wa03-gates.py"
          replace_once(
              guard,
              '    "WA03-COMBINATIONAL-CYCLE",\n    "WA03-BIDIRECTIONAL-USE",',
              '    "WA03-COMBINATIONAL-CYCLE",\n    "WA03-CLOCK-USE",\n    "WA03-RESET-USE",\n    "WA03-TRI-STATE-CONTROL-USE",\n    "WA03-CONTROL-USE-UNPROVEN",\n    "WA03-BIDIRECTIONAL-USE",',
              "required control-use reason codes",
          )
          replace_once(
              guard,
              '    "dependency cycles",\n    "bounded and fails closed",',
              '    "dependency cycles",\n    "clock reset and tri-state control uses",\n    "procedural contexts are rejected",\n    "bounded and fails closed",',
              "required control-use tests",
          )

          registry_path = root / "morphhdl-passes/tests/formal_model/wire_assignment_ir/expected-signatures.json"
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          for relative in sorted(registry["files"]):
              registry["files"][relative] = hashlib.sha256(
                  (root / relative).read_bytes()
              ).hexdigest()
          registry_path.write_text(
              json.dumps(registry, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commit synchronized guard
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/wa03-guard-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Synchronize WA-03 strengthened safety guard"
          git push origin "HEAD:${GITHUB_REF_NAME}"

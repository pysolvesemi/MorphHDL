name: Increment 59i composite local-enable promotion v3

on:
  push:
    branches: ['agent/increment-59i-combined-reduction-closure']
    paths:
      - '.github/workflows/increment-59i-composite-local-enable-promote-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-59i-composite-local-enable-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Review, qualify and publish local-enable production
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      BRANCH: agent/increment-59i-combined-reduction-closure
      TARGET_HEAD: 2ebaa2ef5561eab35aa0ba9caced5c5a314d59f6
      COURSIER_REPOSITORIES: https://repo.maven.apache.org/maven2
      COURSIER_CACHE: /sbt/.cache/coursier/v1
      JAVA_TOOL_OPTIONS: '-Xmx5G -XX:ActiveProcessorCount=4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Guard the exact unmodified branch head
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-local-enable-promotion"
          mkdir -p "$out"
          base=$(git rev-parse HEAD)
          remote=$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')
          test "$remote" = "$base"
          test -z "$(git status --porcelain)"
          printf '%s\n' "$base" > "$out/base-head.txt"
          git merge-base --is-ancestor "$TARGET_HEAD" HEAD

          mapfile -t matches < <(
            for commit in $(git rev-list --merges HEAD); do
              read -r -a parents <<<"$(git show -s --format=%P "$commit")"
              if [ "${#parents[@]}" -eq 2 ] && [ "${parents[1]}" = "$TARGET_HEAD" ]; then
                printf '%s\n' "$commit"
              fi
            done
          )
          test "${#matches[@]}" -eq 1
          merge="${matches[0]}"
          first=$(git rev-parse "$merge^1")
          printf '%s\n' "$merge" > "$out/merge-head.txt"
          printf '%s\n' "$first" > "$out/feature-parent.txt"
          git rev-parse "$merge^{tree}" > "$out/merge-tree.txt"

          replay="$RUNNER_TEMP/increment-59i-promotion-merge-replay"
          git worktree add --detach "$replay" "$first"
          (
            cd "$replay"
            git config user.name '59i merge replay'
            git config user.email 'merge-replay@example.invalid'
            git merge --no-ff --no-commit -X ours "$TARGET_HEAD"
            test -z "$(git diff --name-only --diff-filter=U)"
            git write-tree > "$out/replayed-tree.txt"
          )
          diff -u "$out/merge-tree.txt" "$out/replayed-tree.txt"
          git worktree remove --force "$replay"

          if git diff --no-renames --name-only "$merge" HEAD | grep -E '(^|/)src/main/' > "$out/pre-promotion-production.txt"; then
            cat "$out/pre-promotion-production.txt"
            exit 1
          fi

      - name: Re-run immutable source reviews on their exact parents
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-local-enable-promotion"
          first=$(cat "$out/feature-parent.txt")
          feature="$RUNNER_TEMP/increment-59i-promotion-feature-parent"
          target="$RUNNER_TEMP/increment-59i-promotion-target-parent"
          git worktree add --detach "$feature" "$first"
          (
            cd "$feature"
            python3 morphhdl/scripts/check-increment-59i-source-review.py
            python3 morphhdl/scripts/check-increment-59i-source-review.py --self-test
            python3 morphhdl/scripts/test-increment-59i-review-composition.py
            python3 morphhdl/scripts/check-increment-59i-widening-source-review.py
            test ! -f morphhdl/scripts/test-increment-59i-widening-source-review.py || \
              python3 morphhdl/scripts/test-increment-59i-widening-source-review.py
            python3 morphhdl/scripts/check-increment-59g-source-review.py
            python3 morphhdl/scripts/check-increment-59h-source-review.py
            python3 morphhdl/scripts/test-increment-59h-inherited-source-scope.py
            python3 morphhdl/scripts/check-wa07b-inherited-review.py
            python3 morphhdl/scripts/test-wa07b-inherited-review.py
            python3 morphhdl/scripts/check-native-source-preservation.py
            python3 morphhdl/scripts/check-typed-native-source-overlay.py
          ) 2>&1 | tee "$out/feature-parent-audits.log"
          git worktree remove --force "$feature"

          git worktree add --detach "$target" "$TARGET_HEAD"
          (
            cd "$target"
            python3 morphhdl/scripts/check-increment-60g-source-scope.py
            python3 morphhdl/scripts/check-increment-60g-source-scope.py --self-test
            python3 morphhdl/scripts/check-increment-60g-default-rollout.py self-test
            python3 morphhdl/scripts/check-increment-60f-equivalence-closure.py --source-only
            python3 morphhdl/scripts/test-increment-60f-inherited-source-scope.py
            python3 morphhdl/scripts/test-increment-59f-source-scope.py
            python3 morphhdl/scripts/test-increment-59c-inherited-source-scope.py
            python3 morphhdl/scripts/check-increment-59h-source-review.py
            python3 morphhdl/scripts/test-increment-59h-inherited-source-scope.py
            python3 morphhdl/scripts/check-increment-59g-source-review.py
            python3 morphhdl/scripts/check-wa07b-inherited-review.py
            python3 morphhdl/scripts/test-wa07b-inherited-review.py
            python3 morphhdl/scripts/check-increment-60f-artifacts.py self-test
            python3 morphhdl/scripts/check-native-source-preservation.py
            python3 morphhdl/scripts/check-typed-native-source-overlay.py
          ) 2>&1 | tee "$out/target-parent-audits.log"
          git worktree remove --force "$target"

      - name: Apply and generate the exact local-enable successor review
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-local-enable-promotion"
          base=$(cat "$out/base-head.txt")
          test "$(git rev-parse HEAD)" = "$base"
          python3 morphhdl/repair-59i-composite-local-enable/apply.py | tee "$out/application.log"
          python3 morphhdl/repair-59i-composite-local-enable/fix-generated.py | tee -a "$out/application.log"
          python3 morphhdl/repair-59i-composite-local-enable/include-statements.py | tee -a "$out/application.log"
          git diff --check
          python3 morphhdl/repair-59i-composite-local-enable/promote-reviewed.py | tee "$out/review-generation.log"
          git diff --check

          git status --porcelain=v1 > "$out/generated-status.txt"
          test -s "$out/generated-status.txt"
          python3 - <<'PY'
          import subprocess
          allowed_exact = {
              'morphhdl/src/main/scala/spinal/core/internals/TypedBalancedReductionBridgeReplay.scala',
              'morphhdl/src/main/scala/spinal/core/internals/TypedBalancedReductionCompositeReplay.scala',
              'morphhdl/src/test/scala/spinal/core/internals/TypedBalancedReductionCompositeLocalEnableTests.scala',
              'morphhdl/scripts/check-increment-59i-source-review.py',
              'morphhdl/scripts/test-increment-59i-review-composition.py',
          }
          allowed_prefixes = (
              'morphhdl/contracts/increment-59i-',
              'morphhdl/scripts/check-increment-59i-',
              'morphhdl/scripts/test-increment-59i-',
              'docs/morphhdl/increment-59i-',
          )
          rows = subprocess.check_output(['git', 'status', '--porcelain=v1', '-z']).split(b'\0')
          paths = []
          for row in rows:
              if not row:
                  continue
              path = row[3:].decode()
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if path not in allowed_exact and not path.startswith(allowed_prefixes):
                  raise SystemExit('unreviewed promotion output: ' + path)
              paths.append(path)
          if len(paths) != len(set(paths)) or not paths:
              raise SystemExit('invalid promotion path inventory')
          print('reviewed promotion paths=' + str(len(paths)))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            morphhdl/src/main/scala/spinal/core/internals/TypedBalancedReductionBridgeReplay.scala \
            morphhdl/src/main/scala/spinal/core/internals/TypedBalancedReductionCompositeReplay.scala \
            morphhdl/src/test/scala/spinal/core/internals/TypedBalancedReductionCompositeLocalEnableTests.scala \
            morphhdl/contracts \
            morphhdl/scripts \
            docs/morphhdl
          git diff --cached --check
          test -z "$(git status --porcelain=v1 | grep '^??' || true)"
          git commit -m '59i: promote reviewed composite local enables'
          git rev-parse HEAD > "$out/candidate-head.txt"
          git rev-parse 'HEAD^{tree}' > "$out/candidate-tree.txt"
          git diff --no-renames --name-status "$base" HEAD > "$out/candidate-delta.txt"

      - name: Run exact successor and current-tree source gates
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-local-enable-promotion"
          mapfile -t checkers < <(find morphhdl/scripts -maxdepth 1 -type f \
            \( -name '*59i*local*enable*review*.py' -o -name '*59i*local*enable*source*.py' \) | sort)
          test "${#checkers[@]}" -ge 1
          for checker in "${checkers[@]}"; do
            python3 "$checker"
            if grep -q -- '--self-test\|self-test' "$checker"; then
              python3 "$checker" --self-test
            fi
          done 2>&1 | tee "$out/local-enable-source-review.log"

          python3 morphhdl/scripts/check-native-source-preservation.py
          python3 morphhdl/scripts/check-typed-native-source-overlay.py
          git diff --no-renames --name-only "$(cat "$out/base-head.txt")" HEAD | \
            grep -E '(^|/)src/main/' | sort -u > "$out/production-delta.txt"
          printf '%s\n' \
            morphhdl/src/main/scala/spinal/core/internals/TypedBalancedReductionBridgeReplay.scala \
            morphhdl/src/main/scala/spinal/core/internals/TypedBalancedReductionCompositeReplay.scala | \
            sort -u > "$out/expected-production-delta.txt"
          diff -u "$out/expected-production-delta.txt" "$out/production-delta.txt"
          test -z "$(git status --porcelain)"

      - name: Bootstrap pinned SBT
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-local-enable-promotion"
          version=$(sed -n 's/^sbt.version=//p' project/build.properties)
          test "$version" = '1.10.0'
          base="https://repo.maven.apache.org/maven2/org/scala-sbt/sbt-launch/$version/sbt-launch-$version.jar"
          curl --fail --location --retry 5 --retry-all-errors "$base" -o "$out/sbt-launch.jar"
          printf '[repositories]\nlocal\nmaven-central: https://repo.maven.apache.org/maven2\n' > "$out/repositories"
          cat > "$out/sbt.sh" <<'SH'
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-local-enable-promotion"
          scala="$1"; shift
          java -Xmx4G -Dsbt.log.noformat=true -Dsbt.supershell=false \
            -Dsbt.boot.directory=/sbt/.sbt/boot -Dsbt.global.base=/sbt/.sbt \
            -Dsbt.ivy.home=/sbt/.ivy2 -Duser.home=/sbt \
            -Dsbt.repository.config="$out/repositories" -Dsbt.override.build.repos=true \
            -jar "$out/sbt-launch.jar" "++$scala" "$@"
          SH
          chmod +x "$out/sbt.sh"

      - name: Compile and test Scala 2.12.18
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-local-enable-promotion"
          "$out/sbt.sh" 2.12.18 'morph/Test/compile' \
            'morph/Test/testOnly spinal.core.internals.TypedBalancedReductionCompositeLocalEnableTests spinal.core.internals.TypedBalancedReductionCompositeWideningTests spinal.core.internals.TypedBalancedReductionCompositeTests spinal.core.internals.TypedBalancedReductionBridgeReplayTests spinal.core.internals.TypedBalancedReductionCompositeCallbackPolicyTests' \
            2>&1 | tee "$out/scala-2.12.18.log"
          grep -q 'All tests passed' "$out/scala-2.12.18.log"
          ! grep -q '\*\*\* FAILED \*\*\*' "$out/scala-2.12.18.log"

      - name: Compile and test Scala 2.13.12
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-local-enable-promotion"
          "$out/sbt.sh" 2.13.12 'morph/Test/compile' \
            'morph/Test/testOnly spinal.core.internals.TypedBalancedReductionCompositeLocalEnableTests spinal.core.internals.TypedBalancedReductionCompositeWideningTests spinal.core.internals.TypedBalancedReductionCompositeTests spinal.core.internals.TypedBalancedReductionBridgeReplayTests spinal.core.internals.TypedBalancedReductionCompositeCallbackPolicyTests' \
            2>&1 | tee "$out/scala-2.13.12.log"
          grep -q 'All tests passed' "$out/scala-2.13.12.log"
          ! grep -q '\*\*\* FAILED \*\*\*' "$out/scala-2.13.12.log"

      - name: Publish only from the unchanged expected branch head
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-local-enable-promotion"
          expected=$(cat "$out/base-head.txt")
          candidate=$(cat "$out/candidate-head.txt")
          remote=$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')
          test "$remote" = "$expected"
          test "$(git rev-parse HEAD)" = "$candidate"
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/$BRANCH"
          remote_after=$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')
          test "$remote_after" = "$candidate"
          printf '%s\n' "$remote_after" > "$out/published-head.txt"

      - name: Upload exact promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59i-local-enable-promotion-v3-${{ github.sha }}
          path: target/increment-59i-local-enable-promotion
          if-no-files-found: error
          retention-days: 14

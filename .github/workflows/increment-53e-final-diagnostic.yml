name: Increment 53e final closure diagnostic

on:
  workflow_run:
    workflows:
      - Increment 53e final generic closure
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  record:
    if: ${{ github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.head_branch == 'agent/increment-53e-native-streamfifocc-parameterization' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0

      - name: Download and summarize failed run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p /tmp/failed-run morphhdl/diagnostics
          curl --fail --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN/logs" \
            -o /tmp/failed-run.zip
          unzip -q /tmp/failed-run.zip -d /tmp/failed-run
          {
            echo '# Increment 53e final closure diagnostic'
            echo
            echo "Run: $FAILED_RUN"
            echo "Head: ${{ github.event.workflow_run.head_sha }}"
            echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
            echo
            find /tmp/failed-run -type f -print0 | sort -z | while IFS= read -r -d '' file; do
              matches=$(grep -E -i '(^|\]) \[error\]|error:|exception|FAILED|not found|type mismatch|overloaded method|ambiguous|No such file|Traceback|SystemExit|SPINAL-PARAMETERIZED|Process completed with exit code' "$file" | tail -160 || true)
              if test -n "$matches"; then
                echo "## $(basename "$file")"
                printf '%s\n\n' "$matches"
              fi
            done
          } > morphhdl/diagnostics/increment-53e-final-latest.txt
          rm -f .morphhdl/increment-53e-final-ready
          git add -A
          git diff --cached --check
          git commit -m 'Increment 53e: record final closure failure'
          git push origin HEAD:agent/increment-53e-native-streamfifocc-parameterization

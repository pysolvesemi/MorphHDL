name: MorphHDL baseline

on:
  push:
    branches:
      - main
      - parameterized-verilog
  pull_request:
    branches:
      - main
      - parameterized-verilog
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morphhdl-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Strict Verilog-2001 contracts
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Verilog-2001 validation tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog verilator yosys

      - name: Download generated contract RTL
        uses: actions/download-artifact@v4
        with:
          name: morphhdl-verilog-contracts-scala-2.12.18
          path: target/morphhdl/generated

      - name: Download Scala 2.12 validation phase inventory
        uses: actions/download-artifact@v4
        with:
          name: morphhdl-validation-phase-ids-scala-2.12.18
          path: target/morphhdl/phase-inventory/2.12.18

      - name: Download Scala 2.13 validation phase inventory
        uses: actions/download-artifact@v4
        with:
          name: morphhdl-validation-phase-ids-scala-2.13.12
          path: target/morphhdl/phase-inventory/2.13.12

      - name: Validate architecture contracts
        shell: bash
        run: |
          ./morphhdl/scripts/check-contracts.sh \
            --require-tools \
            --generated-dir target/morphhdl/generated \
            --live-phase-ids target/morphhdl/phase-inventory/2.12.18/validation-phase-ids.txt \
            --live-phase-ids target/morphhdl/phase-inventory/2.13.12/validation-phase-ids.txt

  compile:
    name: Compile Scala ${{ matrix.scala_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version:
          - "2.12.18"
          - "2.13.12"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify recorded upstream base
        shell: bash
        run: ./morphhdl/scripts/check-upstream-base.sh

      - name: Compile production sources
        shell: bash
        run: sbt -batch ++${{ matrix.scala_version }} compile

      - name: Compile test sources
        shell: bash
        run: sbt -batch ++${{ matrix.scala_version }} Test/compile

      - name: Test frontend, native single-source bridge, ParamRTL and Verilog-2001 backends
        shell: bash
        run: |
          sbt -batch ++${{ matrix.scala_version }} \
            idslplugin/test \
            paramrtl/test \
            frontend/test \
            verilogBackend/test \
            morph/test \
            "core/testOnly spinal.core.internals.SpinalVerilogPhasePlanTests"

      - name: Export live inherited validation phase inventory
        shell: bash
        run: |
          mkdir -p target/morphhdl/phase-inventory
          sbt -batch ++${{ matrix.scala_version }} \
            "core/Test/runMain spinal.core.internals.ValidationParityInventoryWriter --output ${GITHUB_WORKSPACE}/target/morphhdl/phase-inventory/validation-phase-ids.txt"

      - name: Upload live inherited validation phase inventory
        uses: actions/upload-artifact@v4
        with:
          name: morphhdl-validation-phase-ids-scala-${{ matrix.scala_version }}
          path: target/morphhdl/phase-inventory/validation-phase-ids.txt
          if-no-files-found: error

      - name: Generate deterministic contract RTL
        if: matrix.scala_version == '2.12.18'
        shell: bash
        run: |
          mkdir -p \
            target/morphhdl/generated/run-1 \
            target/morphhdl/generated/run-2 \
            target/morphhdl/generated/artifact
          sbt -batch ++2.12.18 \
            "morph/Test/runMain morphhdl.MorphContractFixtureGenerator --output-dir ${GITHUB_WORKSPACE}/target/morphhdl/generated/run-1"
          sbt -batch ++2.12.18 \
            "morph/Test/runMain morphhdl.MorphContractFixtureGenerator --output-dir ${GITHUB_WORKSPACE}/target/morphhdl/generated/run-2 --reverse-construction-order"
          for run in 1 2
          do
            actual_inventory="$(find "target/morphhdl/generated/run-${run}" \
              -mindepth 1 -maxdepth 1 -printf '%f %y\n' | sort)"
            expected_inventory="$(printf '%s\n' \
              'asynchronous_enabled_register.v f' \
              'asynchronous_register.v f' \
              'boolean_forwarding.v f' \
              'boolean_locals.v f' \
              'case_routing.v f' \
              'comparison_routing.v f' \
              'conditional_forwarding.v f' \
              'conditional_width.v f' \
              'derived_width.v f' \
              'lane_array.v f' \
              'parameter_forwarding.v f' \
              'parameterized_counter.v f' \
              'parameterized_wire.v f' \
              'runtime_mux.v f' \
              'simple_dual_port_memory.v f' \
              'single_port_memory.v f' \
              'symbolic_data_shapes.v f' \
              'synchronous_enabled_register.v f' \
              'synchronous_register.v f' \
              'synchronous_stream_fifo.v f' \
              'synchronous_stream_m2s_pipe.v f')"
            test "${actual_inventory}" = "${expected_inventory}"
          done
          diff --recursive --brief \
            target/morphhdl/generated/run-1 \
            target/morphhdl/generated/run-2
          parameterized_wire=target/morphhdl/generated/run-1/parameterized_wire.v
          test "$(grep -Ec '^[[:space:]]*parameter integer WIDTH = 8$' \
            "${parameterized_wire}")" = "1"
          test "$(grep -Ec '\[WIDTH-1:0\] (din|dout)' \
            "${parameterized_wire}")" = "2"
          test "$(grep -Fc 'assign dout = din;' \
            "${parameterized_wire}")" = "1"
          ! grep -Eq '\b(localparam|function|always|generate|genvar)\b' \
            "${parameterized_wire}"
          symbolic_data_shapes=target/morphhdl/generated/run-1/symbolic_data_shapes.v
          test "$(grep -Ec '^[[:space:]]*parameter integer WIDTH = 8$' \
            "${symbolic_data_shapes}")" = "1"
          test "$(grep -Ec '\[WIDTH-1:0\]' \
            "${symbolic_data_shapes}")" = "33"
          test "$(grep -Ec \
            '^[[:space:]]*(input|output)[[:space:]]+wire[[:space:]]+\[[^]]*WIDTH[^]]*\][[:space:]]+vec_(in|out),?$' \
            "${symbolic_data_shapes}")" = "2"
          ! grep -Eq '\bvec_(in|out)_[0-9]+' "${symbolic_data_shapes}"
          test "$(grep -Ec '^[[:space:]]*always @\(posedge clk\)' \
            "${symbolic_data_shapes}")" = "1"
          test "$(grep -Fc 'function integer clog2;' \
            target/morphhdl/generated/run-1/derived_width.v)" = "1"
          test "$(grep -Fc 'function integer clog2;' \
            target/morphhdl/generated/run-1/single_port_memory.v)" = "1"
          test "$(grep -Ec \
            '^[[:space:]]*reg[[:space:]]+\[WIDTH-1:0\][[:space:]]+memory[[:space:]]+\[0:DEPTH-1\];$' \
            target/morphhdl/generated/run-1/single_port_memory.v)" = "1"
          test "$(grep -Fc 'function integer clog2;' \
            target/morphhdl/generated/run-1/parameterized_counter.v)" = "1"
          test "$(grep -Fc 'function integer clog2;' \
            target/morphhdl/generated/run-1/simple_dual_port_memory.v)" = "1"
          test "$(grep -Ec \
            '^[[:space:]]*reg[[:space:]]+\[WIDTH-1:0\][[:space:]]+memory[[:space:]]+\[0:DEPTH-1\];$' \
            target/morphhdl/generated/run-1/simple_dual_port_memory.v)" = "1"
          test "$(grep -Fc 'function integer clog2;' \
            target/morphhdl/generated/run-1/synchronous_stream_fifo.v)" = "1"
          test "$(grep -Fc 'clog2(LANES, 0)' \
            target/morphhdl/generated/run-1/derived_width.v)" = "1"
          test "$(grep -Fc 'clog2(DEPTH, 1)' \
            target/morphhdl/generated/run-1/single_port_memory.v)" = "1"
          test "$(grep -Fc 'clog2(LIMIT, 1)' \
            target/morphhdl/generated/run-1/parameterized_counter.v)" = "3"
          test "$(grep -Fc 'clog2(DEPTH, 1)' \
            target/morphhdl/generated/run-1/simple_dual_port_memory.v)" = "2"
          test "$(grep -Fc 'clog2(DEPTH, 1)' \
            target/morphhdl/generated/run-1/synchronous_stream_fifo.v)" = "1"
          test "$(grep -Fc 'clog2(DEPTH + 1, 1)' \
            target/morphhdl/generated/run-1/synchronous_stream_fifo.v)" = "1"
          ! grep -RFq '$clog2' target/morphhdl/generated/run-1
          ! grep -RFq 'morphhdl$ceil_log2' target/morphhdl/generated/run-1
          ! grep -RFq '1073741824' target/morphhdl/generated/run-1
          test "$(grep -Fc \
            'CLAMPED_PADDING = (DATA_WIDTH < 3) ? DATA_WIDTH : 3;' \
            target/morphhdl/generated/run-1/derived_width.v)" = "1"
          test "$(grep -Fc \
            'PADDED_WIDTH = ((TOTAL_WIDTH + CLAMPED_PADDING > 4) ? TOTAL_WIDTH + CLAMPED_PADDING : 4) + LANE_INDEX_WIDTH;' \
            target/morphhdl/generated/run-1/derived_width.v)" = "1"
          for filename in target/morphhdl/generated/run-1/*.v
          do
            case "${filename}" in
              */derived_width.v|*/single_port_memory.v|*/parameterized_counter.v|*/simple_dual_port_memory.v|*/synchronous_stream_fifo.v) ;;
              *) ! grep -Fq 'clog2' "${filename}" ;;
            esac
          done
          for filename in \
            parameterized_wire.v \
            symbolic_data_shapes.v \
            derived_width.v \
            parameter_forwarding.v \
            lane_array.v \
            conditional_forwarding.v \
            comparison_routing.v \
            conditional_width.v \
            boolean_forwarding.v \
            boolean_locals.v \
            case_routing.v \
            runtime_mux.v \
            single_port_memory.v \
            parameterized_counter.v \
            simple_dual_port_memory.v \
            synchronous_stream_fifo.v \
            synchronous_stream_m2s_pipe.v \
            synchronous_register.v \
            asynchronous_register.v \
            synchronous_enabled_register.v \
            asynchronous_enabled_register.v
          do
            cmp "target/morphhdl/generated/run-1/${filename}" \
              "morphhdl/examples/contracts/${filename}"
            cp "target/morphhdl/generated/run-1/${filename}" \
              "target/morphhdl/generated/artifact/${filename}"
          done

      - name: Upload generated contract RTL
        if: matrix.scala_version == '2.12.18'
        uses: actions/upload-artifact@v4
        with:
          name: morphhdl-verilog-contracts-scala-2.12.18
          path: target/morphhdl/generated/artifact
          if-no-files-found: error

      - name: Run concrete code-generation smoke test
        if: matrix.scala_version == '2.12.18'
        shell: bash
        run: sbt -batch ++2.12.18 "tester/testOnly spinal.tester.scalatest.AttributeEmitTests"

      - name: Run inherited semantic-check regression
        if: matrix.scala_version == '2.12.18'
        shell: bash
        run: sbt -batch ++2.12.18 "tester/testOnly spinal.core.ChecksTester"

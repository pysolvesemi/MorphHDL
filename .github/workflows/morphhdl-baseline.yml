name: MorphHDL baseline

on:
  push:
    branches:
      - main
      - parameterized-verilog
  pull_request:
    branches:
      - main
      - parameterized-verilog
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morphhdl-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Strict Verilog-2001 contracts
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install Verilog-2001 validation tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog verilator yosys

      - name: Download generated ParameterizedWire RTL
        uses: actions/download-artifact@v4
        with:
          name: parameterized-wire-scala-2.12.18
          path: target/morphhdl/generated

      - name: Validate architecture contracts
        shell: bash
        run: |
          ./morphhdl/scripts/check-contracts.sh \
            --require-tools \
            --parameterized-wire target/morphhdl/generated/parameterized_wire.v

  compile:
    name: Compile Scala ${{ matrix.scala_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version:
          - "2.12.18"
          - "2.13.12"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify recorded upstream base
        shell: bash
        run: ./morphhdl/scripts/check-upstream-base.sh

      - name: Compile production sources
        shell: bash
        run: sbt -batch ++${{ matrix.scala_version }} compile

      - name: Compile test sources
        shell: bash
        run: sbt -batch ++${{ matrix.scala_version }} Test/compile

      - name: Test ParamRTL and Verilog-2001 backend
        shell: bash
        run: |
          sbt -batch ++${{ matrix.scala_version }} \
            paramrtl/test \
            verilogBackend/test

      - name: Generate deterministic ParameterizedWire RTL
        if: matrix.scala_version == '2.12.18'
        shell: bash
        run: |
          mkdir -p target/morphhdl/generated/run-1 target/morphhdl/generated/run-2
          sbt -batch ++2.12.18 \
            "verilogBackend/Test/runMain morphhdl.backend.verilog2001.ParameterizedWireFixtureGenerator --output ${GITHUB_WORKSPACE}/target/morphhdl/generated/run-1/parameterized_wire.v"
          sbt -batch ++2.12.18 \
            "verilogBackend/Test/runMain morphhdl.backend.verilog2001.ParameterizedWireFixtureGenerator --output ${GITHUB_WORKSPACE}/target/morphhdl/generated/run-2/parameterized_wire.v"
          cmp target/morphhdl/generated/run-1/parameterized_wire.v \
            target/morphhdl/generated/run-2/parameterized_wire.v
          cmp target/morphhdl/generated/run-1/parameterized_wire.v \
            morphhdl/examples/contracts/parameterized_wire.v
          cp target/morphhdl/generated/run-1/parameterized_wire.v \
            target/morphhdl/generated/parameterized_wire.v

      - name: Upload generated ParameterizedWire RTL
        if: matrix.scala_version == '2.12.18'
        uses: actions/upload-artifact@v4
        with:
          name: parameterized-wire-scala-2.12.18
          path: target/morphhdl/generated/parameterized_wire.v
          if-no-files-found: error

      - name: Run concrete code-generation smoke test
        if: matrix.scala_version == '2.12.18'
        shell: bash
        run: sbt -batch ++2.12.18 "tester/testOnly spinal.tester.scalatest.AttributeEmitTests"

      - name: Run inherited semantic-check regression
        if: matrix.scala_version == '2.12.18'
        shell: bash
        run: sbt -batch ++2.12.18 "tester/testOnly spinal.core.ChecksTester"

name: MorphHDL baseline

on:
  push:
    branches:
      - main
      - parameterized-verilog
  pull_request:
    branches:
      - main
      - parameterized-verilog
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morphhdl-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Strict Verilog-2001 contracts
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install Verilog-2001 validation tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog verilator yosys

      - name: Download generated contract RTL
        uses: actions/download-artifact@v4
        with:
          name: morphhdl-verilog-contracts-scala-2.12.18
          path: target/morphhdl/generated

      - name: Download Scala 2.12 validation phase inventory
        uses: actions/download-artifact@v4
        with:
          name: morphhdl-validation-phase-ids-scala-2.12.18
          path: target/morphhdl/phase-inventory/2.12.18

      - name: Download Scala 2.13 validation phase inventory
        uses: actions/download-artifact@v4
        with:
          name: morphhdl-validation-phase-ids-scala-2.13.12
          path: target/morphhdl/phase-inventory/2.13.12

      - name: Validate architecture contracts
        shell: bash
        run: |
          ./morphhdl/scripts/check-contracts.sh \
            --require-tools \
            --generated-dir target/morphhdl/generated \
            --live-phase-ids target/morphhdl/phase-inventory/2.12.18/validation-phase-ids.txt \
            --live-phase-ids target/morphhdl/phase-inventory/2.13.12/validation-phase-ids.txt

  compile:
    name: Compile Scala ${{ matrix.scala_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version:
          - "2.12.18"
          - "2.13.12"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify recorded upstream base
        shell: bash
        run: ./morphhdl/scripts/check-upstream-base.sh

      - name: Compile production sources
        shell: bash
        run: sbt -batch ++${{ matrix.scala_version }} compile

      - name: Compile test sources
        shell: bash
        run: sbt -batch ++${{ matrix.scala_version }} Test/compile

      - name: Test frontend, ParamRTL, orchestration and Verilog-2001 backend
        shell: bash
        run: |
          sbt -batch ++${{ matrix.scala_version }} \
            idslplugin/test \
            paramrtl/test \
            frontend/test \
            verilogBackend/test \
            morph/test \
            "core/testOnly spinal.core.internals.SpinalVerilogPhasePlanTests"

      - name: Export live inherited validation phase inventory
        shell: bash
        run: |
          mkdir -p target/morphhdl/phase-inventory
          sbt -batch ++${{ matrix.scala_version }} \
            "core/Test/runMain spinal.core.internals.ValidationParityInventoryWriter --output ${GITHUB_WORKSPACE}/target/morphhdl/phase-inventory/validation-phase-ids.txt"

      - name: Upload live inherited validation phase inventory
        uses: actions/upload-artifact@v4
        with:
          name: morphhdl-validation-phase-ids-scala-${{ matrix.scala_version }}
          path: target/morphhdl/phase-inventory/validation-phase-ids.txt
          if-no-files-found: error

      - name: Generate deterministic contract RTL
        if: matrix.scala_version == '2.12.18'
        shell: bash
        run: |
          mkdir -p \
            target/morphhdl/generated/run-1 \
            target/morphhdl/generated/run-2 \
            target/morphhdl/generated/artifact
          sbt -batch ++2.12.18 \
            "morph/Test/runMain morphhdl.MorphContractFixtureGenerator --output-dir ${GITHUB_WORKSPACE}/target/morphhdl/generated/run-1"
          sbt -batch ++2.12.18 \
            "morph/Test/runMain morphhdl.MorphContractFixtureGenerator --output-dir ${GITHUB_WORKSPACE}/target/morphhdl/generated/run-2 --reverse-construction-order"
          for run in 1 2
          do
            actual_inventory="$(find "target/morphhdl/generated/run-${run}" \
              -mindepth 1 -maxdepth 1 -printf '%f %y\n' | sort)"
            expected_inventory="$(printf '%s\n' \
              'conditional_forwarding.v f' \
              'derived_width.v f' \
              'lane_array.v f' \
              'parameter_forwarding.v f' \
              'parameterized_wire.v f')"
            test "${actual_inventory}" = "${expected_inventory}"
          done
          diff --recursive --brief \
            target/morphhdl/generated/run-1 \
            target/morphhdl/generated/run-2
          for filename in \
            parameterized_wire.v \
            derived_width.v \
            parameter_forwarding.v \
            lane_array.v \
            conditional_forwarding.v
          do
            cmp "target/morphhdl/generated/run-1/${filename}" \
              "morphhdl/examples/contracts/${filename}"
            cp "target/morphhdl/generated/run-1/${filename}" \
              "target/morphhdl/generated/artifact/${filename}"
          done

      - name: Upload generated contract RTL
        if: matrix.scala_version == '2.12.18'
        uses: actions/upload-artifact@v4
        with:
          name: morphhdl-verilog-contracts-scala-2.12.18
          path: target/morphhdl/generated/artifact
          if-no-files-found: error

      - name: Run concrete code-generation smoke test
        if: matrix.scala_version == '2.12.18'
        shell: bash
        run: sbt -batch ++2.12.18 "tester/testOnly spinal.tester.scalatest.AttributeEmitTests"

      - name: Run inherited semantic-check regression
        if: matrix.scala_version == '2.12.18'
        shell: bash
        run: sbt -batch ++2.12.18 "tester/testOnly spinal.core.ChecksTester"

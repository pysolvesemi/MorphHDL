name: Publish reviewed 60g resume changes

on:
  push:
    branches: [agent/increment-60g-default-signed-verilog]
    paths:
      - '.github/60g-resume/*.patch'
      - '.github/workflows/increment-60g-resume-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'pysolvesemi/MorphHDL' && github.ref == 'refs/heads/agent/increment-60g-default-signed-verilog'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify readable diffs and publish the exact reviewed tree
        shell: bash
        env:
          EVENT_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=refs/heads/agent/increment-60g-default-signed-verilog
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = 7b540ceceaa471ed0df693ad04c2c30f3cd7eba7
          test "$(git ls-remote origin "$branch" | cut -f1)" = "$EVENT_HEAD"
          sha256sum --check <<'HASHES'
          1ecfb672f4258be548da6efe0cd1124b1e11fdfcff222f4b3f446207def39068  .github/60g-resume/code.patch
          8dd5a26fb5c29e92704d2e88841f7d6db4547049fd577c30cfb80eb62e84955d  .github/60g-resume/docs.patch
          d854d829b20fe9b2fe03c935eb53bf32c2d9ddb64417bb21d501b102c1157198  .github/60g-resume/manifest.patch
          eb999ca7693e4bcbf180b2584687ed738a50812069e4cdce51840d9598086d05  .github/60g-resume/gates.patch
          HASHES
          git apply --check .github/60g-resume/*.patch
          git apply --index .github/60g-resume/*.patch
          git rm .github/60g-resume/*.patch
          # Verify the complete implementation tree, excluding only this
          # temporary publisher. No compiler or hardware qualification is claimed.
          git rm --cached .github/workflows/increment-60g-resume-publish.yml
          test "$(git write-tree)" = c064f0b85b78c8e152b9d19ab4337cd13908f788
          git add .github/workflows/increment-60g-resume-publish.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(morphhdl): isolate default signedness dependencies and refresh actual public contracts'
          git push origin "HEAD:$branch"

name: Increment 59i transport qualification dispatch

on:
  push:
    branches: ['recovery/increment-59i-history-20260914']
    paths:
      - '.github/workflows/increment-59i-transport-qualification-dispatch.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: increment-59i-transport-qualification-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch only the exact committed-head local-enable gate
    if: github.repository == 'pysolvesemi/MorphHDL'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FEATURE_BRANCH: agent/increment-59i-combined-reduction-closure
      SEAL: 474480ba3890ed1c6dc8b8ab330086a87a962eb9
      SEAL_TREE: bc0e7eb3d014f6fdce83e2506dc7ad9bf7c52438
      TARGET: 4b8a86e25f5a1a3f0cb4c37dc537a8dd8aa7b097
      WORKFLOW: increment-59i-local-enable-committed-head.yml
    steps:
      - name: Verify live refs, reject duplicates, and dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/59i-transport-dispatch"
          mkdir -p "$out"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          curl --silent --show-error --fail-with-body "${auth[@]}" \
            "$api/git/ref/heads/$FEATURE_BRANCH" > "$out/feature-ref.json"
          curl --silent --show-error --fail-with-body "${auth[@]}" \
            "$api/git/ref/heads/parameterized-verilog" > "$out/target-ref.json"
          curl --silent --show-error --fail-with-body "${auth[@]}" \
            "$api/git/commits/$SEAL" > "$out/seal.json"
          curl --silent --show-error --fail-with-body "${auth[@]}" \
            "$api/pulls/177" > "$out/pr.json"
          test "$(jq -r .object.sha "$out/feature-ref.json")" = "$SEAL"
          test "$(jq -r .object.sha "$out/target-ref.json")" = "$TARGET"
          test "$(jq -r .tree.sha "$out/seal.json")" = "$SEAL_TREE"
          test "$(jq -r '.parents[0].sha' "$out/seal.json")" = 7babffa1effe84a99cced712cea38eaf455cd4bc
          test "$(jq -r .head.sha "$out/pr.json")" = "$SEAL"
          test "$(jq -r .base.sha "$out/pr.json")" = "$TARGET"
          test "$(jq -r .state "$out/pr.json")" = open
          test "$(jq -r .draft "$out/pr.json")" = true

          branch=$(jq -rn --arg value "$FEATURE_BRANCH" '$value|@uri')
          runs="$api/actions/workflows/$WORKFLOW/runs?branch=$branch&per_page=100"
          curl --silent --show-error --fail-with-body "${auth[@]}" "$runs" > "$out/before.json"
          test "$(jq --arg seal "$SEAL" '[.workflow_runs[] | select(.head_sha==$seal and (.status=="queued" or .status=="in_progress" or .conclusion=="success"))] | length' "$out/before.json")" = 0
          before=$(date -u +%s)
          jq -n --arg ref "$FEATURE_BRANCH" '{ref:$ref}' > "$out/dispatch-request.json"
          code=$(curl --silent --show-error --output "$out/dispatch-response.txt" --write-out '%{http_code}' \
            "${auth[@]}" -X POST "$api/actions/workflows/$WORKFLOW/dispatches" \
            --data-binary "@$out/dispatch-request.json")
          test "$code" = 204

          found=false
          for attempt in $(seq 1 18); do
            sleep 5
            curl --silent --show-error --fail-with-body "${auth[@]}" "$runs" > "$out/after.json"
            jq --arg seal "$SEAL" --argjson before "$before" \
              '[.workflow_runs[] | select(.head_sha==$seal and .event=="workflow_dispatch" and ((.created_at|fromdateiso8601) >= $before))] | sort_by(.created_at) | last' \
              "$out/after.json" > "$out/dispatched-run.json"
            if test "$(jq -r '.id // empty' "$out/dispatched-run.json")" != ''; then
              found=true
              break
            fi
          done
          test "$found" = true
          jq -n --arg controller "$GITHUB_SHA" --arg controller_run "$GITHUB_RUN_ID" \
            --arg seal "$SEAL" --arg target "$TARGET" \
            --argjson dispatched "$(cat "$out/dispatched-run.json")" \
            '{controller:$controller,controller_run_id:$controller_run,seal_commit:$seal,
              target_commit:$target,feature_ref_verified:true,target_ref_verified:true,
              dispatched_workflow:"increment-59i-local-enable-committed-head.yml",
              dispatched_run:$dispatched,other_workflows_dispatched:0}' > "$out/receipt.json"

      - uses: actions/upload-artifact@v4
        with:
          name: increment-59i-transport-qualification-dispatch
          path: ${{ runner.temp }}/59i-transport-dispatch
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 21

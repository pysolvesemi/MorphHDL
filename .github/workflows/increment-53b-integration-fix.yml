name: Apply Increment 53b integration repair

on:
  push:
    branches:
      - agent/increment-53b-local-enum-parameters

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53b-local-enum-parameters
          fetch-depth: 0

      - name: Move enum localization to the MorphVerilog publication callback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("morphhdl/src/main/scala/morphhdl/MorphVerilog.scala")
          text = path.read_text()

          old_import = "import spinal.core.internals.{ExternalParameterizedAutoResize, MorphHdlExternalParameterizedVerilog}"
          new_import = "import spinal.core.internals.{ExternalParameterizedAutoResize, MorphHdlExternalEnumLocalizer, MorphHdlExternalParameterizedVerilog}"
          if text.count(old_import) != 1:
              raise SystemExit("MorphVerilog import anchor is not unique")
          text = text.replace(old_import, new_import)

          pattern = re.compile(
              r"(?m)^(?P<indent>[ \t]*)try MorphHdlExternalParameterizedVerilog\.rewrite\(pc\)\n"
              r"(?P=indent)finally ExternalParameterizedAutoResize\.clearGraph\(pc\.topLevel\)$"
          )
          match = pattern.search(text)
          if match is None or pattern.search(text, match.end()) is not None:
              raise SystemExit("MorphVerilog publication callback anchor is not unique")
          indent = match.group("indent")
          replacement = (
              f"{indent}try {{\n"
              f"{indent}  MorphHdlExternalParameterizedVerilog.rewrite(pc)\n"
              f"{indent}  MorphHdlExternalEnumLocalizer.rewrite(pc)\n"
              f"{indent}}} finally ExternalParameterizedAutoResize.clearGraph(pc.topLevel)"
          )
          path.write_text(pattern.sub(replacement, text, count=1))
          PY

          git rm .github/workflows/increment-53b-integration-fix.yml
          git config user.name "MorphHDL Increment Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morphhdl/src/main/scala/morphhdl/MorphVerilog.scala
          git commit -m "fix(morphhdl): localize enums at MorphVerilog publication"
          git push origin HEAD:agent/increment-53b-local-enum-parameters

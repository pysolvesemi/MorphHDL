name: Increment 52 finalize attributed declaration repair

on:
  push:
    branches:
      - agent/increment-52-nested-control-flow-clean
    paths:
      - .github/workflows/increment-52-finalize-attributed-declarations.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Increment 52 branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-52-nested-control-flow-clean
          fetch-depth: 0

      - name: Apply production fix and restore validation workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala")
          text = source.read_text(encoding="utf-8")
          old = '''  private def isDeclarationLine(value: String): Boolean =
            value.startsWith("wire ") || value.startsWith("reg ") || value.startsWith("integer ")
          '''
          new = '''  private def stripLeadingVerilogAttributes(value: String): String = {
            var remaining = value.trim
            while (remaining.startsWith("(*")) {
              val end = remaining.indexOf("*)")
              if (end < 0) return remaining
              remaining = remaining.substring(end + 2).trim
            }
            remaining
          }

          private def isDeclarationLine(value: String): Boolean = {
            val declaration = stripLeadingVerilogAttributes(value)
            declaration.startsWith("wire ") || declaration.startsWith("reg ") ||
              declaration.startsWith("integer ")
          }
          '''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f"expected one declaration-recognition patch site, found {text.count(old)}")
              source.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/morphhdl-native-int-nested-control-flow.yml")
          workflow.write_text('''name: MorphHDL native Int nested symbolic control flow

          on:
            push:
              branches:
                - main
                - parameterized-verilog
            pull_request:
              branches:
                - main
                - parameterized-verilog
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: morphhdl-native-int-nested-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            source-boundary:
              name: Native Int nested-control source boundary
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - name: Check out complete history
                  uses: actions/checkout@v4
                  with:
                    fetch-depth: 0

                - name: Prove safe nested capture and zero native diff
                  shell: bash
                  run: bash morphhdl/scripts/check-native-int-nested-control-flow-boundary.sh

            contracts:
              name: Native Int nested-control proof Scala ${{ matrix.scala_version }}
              needs: source-boundary
              runs-on: ubuntu-latest
              timeout-minutes: 60
              container:
                image: ghcr.io/spinalhdl/docker:latest
              env:
                XDG_CACHE_HOME: /tmp/morphhdl-cache
              strategy:
                fail-fast: false
                matrix:
                  scala_version:
                    - "2.12.18"
                    - "2.13.12"
              steps:
                - name: Check out sources
                  uses: actions/checkout@v4
                  with:
                    fetch-depth: 0

                - name: Install pinned Mill bootstrap
                  shell: bash
                  run: |
                    set -euo pipefail
                    curl --fail --location --retry 5 --retry-all-errors \
                      https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
                      --output /tmp/morphhdl-mill
                    chmod +x /tmp/morphhdl-mill

                - name: Validate nested control flow safety and inherited contracts
                  shell: bash
                  run: |
                    set -euo pipefail
                    /tmp/morphhdl-mill frontend[${{ matrix.scala_version }}].testOnly \
                      morphhdl.frontend.HdlIntTests
                    /tmp/morphhdl-mill morph[${{ matrix.scala_version }}].testOnly \
                      morphhdl.NativeIntNestedSymbolicControlFlowTests \
                      morphhdl.NativeIntSymbolicConditionalTests \
                      morphhdl.NaturalSymbolicConditionalTests \
                      morphhdl.ExternalNativeIntShadowExpressionTests \
                      morphhdl.ExternalNativeIntShadowProvenanceTests \
                      morphhdl.ExternalNativeIntFormalizationTests \
                      morphhdl.FormalParameterIdentityTests \
                      morphhdl.FormalParameterClonePropagationTests \
                      morphhdl.HierarchyParameterBindingTests \
                      morphhdl.MorphSingleSourceVerilogTests \
                      morphhdl.integration.ExternalSpinalVerilogBaselineTests
          '''.replace("          ", ""), encoding="utf-8")
          PY

          rm .github/workflows/increment-52-finalize-attributed-declarations.yml
          git diff --check

      - name: Commit production closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala \
            .github/workflows/morphhdl-native-int-nested-control-flow.yml \
            .github/workflows/increment-52-finalize-attributed-declarations.yml
          git commit -m "Fix Increment 52 attributed structural declarations"
          git push origin HEAD:agent/increment-52-nested-control-flow-clean

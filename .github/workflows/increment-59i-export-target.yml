name: Increment 59i target reconciliation archive

on:
  push:
    branches: [recovery/increment-59i-history-20260914]
    paths: [.github/workflows/increment-59i-export-target.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 27af65abbee0d2334d6be7a6e4e2408b8af32fd9
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Preserve the exact new target and its ancestry
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/59i-target-27af65ab"
          mkdir -p "$out"
          base=7f355a859e7e88ca343e1ff82f261fb47b3311d0
          target=27af65abbee0d2334d6be7a6e4e2408b8af32fd9
          test "$(git rev-parse HEAD)" = "$target"
          test "$(git rev-parse HEAD^{tree})" = 677fa3eab4a9ce806161bd5ace3b434c9d1fcc43
          git merge-base --is-ancestor "$base" "$target"
          git diff --exit-code
          git diff --cached --exit-code
          git update-ref refs/heads/target-27af65ab "$target"
          git bundle create "$out/target-27af65ab.bundle" refs/heads/target-27af65ab "^$base"
          git bundle verify "$out/target-27af65ab.bundle" > "$out/bundle-verification.txt" 2>&1
          git cat-file commit "$target" > "$out/target-commit.txt"
          git ls-tree -r "$target" > "$out/target-tree.txt"
          git diff --binary --full-index "$base" "$target" > "$out/target.patch"
          git log --format=fuller "$base..$target" > "$out/target-history.txt"
          (cd "$out" && sha256sum target-27af65ab.bundle target-commit.txt target-tree.txt target.patch target-history.txt > SHA256SUMS)
      - name: Upload the source-only recovery archive
        uses: actions/upload-artifact@v4
        with:
          name: increment-59i-target-27af65ab-${{ github.run_attempt }}
          path: ${{ runner.temp }}/59i-target-27af65ab
          if-no-files-found: error
          retention-days: 14

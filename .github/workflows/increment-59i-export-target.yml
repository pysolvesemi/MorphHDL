name: Increment 59i target reconciliation archive

on:
  push:
    branches: [recovery/increment-59i-history-20260914]
    paths: [.github/workflows/increment-59i-export-target.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7f355a859e7e88ca343e1ff82f261fb47b3311d0
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Preserve the exact new target and its ancestry
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/59i-target-7f355a85"
          mkdir -p "$out"
          base=61d1fe0dcac0b52856620944a2d7426fd1390a48
          target=7f355a859e7e88ca343e1ff82f261fb47b3311d0
          test "$(git rev-parse HEAD)" = "$target"
          test "$(git rev-parse HEAD^{tree})" = 20e0696ce553d7bdc52072d0837f41d9188904b6
          git merge-base --is-ancestor "$base" "$target"
          git diff --exit-code
          git diff --cached --exit-code
          git update-ref refs/heads/target-7f355a85 "$target"
          git bundle create "$out/target-7f355a85.bundle" refs/heads/target-7f355a85 "^$base"
          git bundle verify "$out/target-7f355a85.bundle" > "$out/bundle-verification.txt" 2>&1
          git cat-file commit "$target" > "$out/target-commit.txt"
          git ls-tree -r "$target" > "$out/target-tree.txt"
          git diff --binary --full-index "$base" "$target" > "$out/target.patch"
          git log --format=fuller "$base..$target" > "$out/target-history.txt"
          (cd "$out" && sha256sum target-7f355a85.bundle target-commit.txt target-tree.txt target.patch target-history.txt > SHA256SUMS)
      - name: Upload the source-only recovery archive
        uses: actions/upload-artifact@v4
        with:
          name: increment-59i-target-7f355a85-${{ github.run_attempt }}
          path: ${{ runner.temp }}/59i-target-7f355a85
          if-no-files-found: error
          retention-days: 14

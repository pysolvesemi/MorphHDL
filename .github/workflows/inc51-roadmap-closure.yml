name: Complete Increment 51 roadmap entry

on:
  push:
    branches:
      - agent/increment-51-native-int-branch-capture
    paths:
      - .github/workflows/inc51-roadmap-closure.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-51-roadmap-closure
  cancel-in-progress: false

jobs:
  close-roadmap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-51-native-int-branch-capture
          fetch-depth: 0

      - name: Mark Increment 51 complete and remove closure workflow
        shell: bash
        run: |
          set -euo pipefail
          roadmap=docs/morphhdl/parameterized-verilog-todo.md
          unchecked='- [ ] **Increment 51 — Symbolic native-`Int` branch capture**'
          checked='- [x] **Increment 51 — Symbolic native-`Int` branch capture**'

          test ! -e .github/workflows/inc51-current-source-export.yml
          test ! -e .github/workflows/inc51-diagnostic.yml
          test ! -e .github/workflows/inc51-sbt-launcher-export.yml
          test "$(grep -Fxc -- "$unchecked" "$roadmap")" -eq 1

          python - <<'PY'
          from pathlib import Path
          path = Path("docs/morphhdl/parameterized-verilog-todo.md")
          text = path.read_text()
          old = '- [ ] **Increment 51 — Symbolic native-`Int` branch capture**'
          new = '- [x] **Increment 51 — Symbolic native-`Int` branch capture**'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY

          test "$(grep -Fxc -- "$checked" "$roadmap")" -eq 1
          rm -f .github/workflows/inc51-roadmap-closure.yml

          git config user.name "pysolvesemi"
          git config user.email "pysolvesemi@gmail.com"
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "Complete Increment 51 roadmap entry"
          git push origin HEAD:agent/increment-51-native-int-branch-capture

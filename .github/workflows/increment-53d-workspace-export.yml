name: Apply Increment 53d invariant unsigned resize repair

on:
  push:
    branches:
      - agent/increment-53d-native-streamwidth-adapter
    paths:
      - .github/workflows/increment-53d-workspace-export.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Increment 53d branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-native-streamwidth-adapter
          fetch-depth: 0

      - name: Admit domain-invariant unsigned symbolic widening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala")
          text = path.read_text(encoding="utf-8")
          old = '''            if (!source.isSymbolic) WidthLiteral(size)
            else if (size <= source.minimum) WidthLiteral(size)
            else {
              fail(
                "SPINAL-PARAMETERIZED-VERILOG-RESIZE-DOMAIN-UNSUPPORTED",
                s"resize from symbolic width '${source.render}' to ${resize.size} is not a domain-invariant narrowing; widening and domain-crossing resize lowering is deferred"
              )
            }
'''
          new = '''            if (!source.isSymbolic) WidthLiteral(size)
            else if (size <= source.minimum) WidthLiteral(size)
            else if (
              size >= source.maximum &&
              (resize.getTypeObject == TypeBits || resize.getTypeObject == TypeUInt)
            ) {
              // The untouched Verilog emitter gives every Resize node its
              // fixed target width: nested resizes are wrapped in a target-sized
              // temporary, while a top-level resize is consumed by its
              // target-sized assignment. For Bits/UInt, a target no smaller
              // than the complete symbolic source domain is therefore an
              // invariant zero-extension/equality operation. The witness-sized
              // leading-zero fragment remains semantically exact because the
              // fixed target context supplies any remaining zero extension or
              // discards only leading zeros. Signed widening is deliberately
              // excluded because a witness-sized unsigned concatenation cannot
              // prove sign extension for a smaller symbolic source.
              WidthLiteral(size)
            } else {
              fail(
                "SPINAL-PARAMETERIZED-VERILOG-RESIZE-DOMAIN-UNSUPPORTED",
                s"resize from symbolic width '${source.render}' to ${resize.size} is neither a domain-invariant narrowing nor an unsigned domain-invariant widening; domain-crossing and signed widening resize lowering are deferred"
              )
            }
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one inferResize anchor, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          rm -f .github/workflows/increment-53d-workspace-export.yml
          git diff --check
          if git diff --name-only | grep -Eq '^(core|lib|idslplugin)/'; then
            echo "Increment 53d must not modify native SpinalHDL source" >&2
            exit 1
          fi
          git config user.name "MorphHDL Increment Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala
          git add .github/workflows/increment-53d-workspace-export.yml
          git commit -m "fix: support invariant unsigned symbolic widening"
          git push origin HEAD:agent/increment-53d-native-streamwidth-adapter

name: Increment 53d workspace export

on:
  push:
    branches:
      - agent/increment-53d-native-streamwidth-adapter
    paths:
      - .github/workflows/increment-53d-workspace-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package repository workspace
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/increment-53d-head.txt
          tar \
            --exclude=.git \
            --exclude=out \
            --exclude=target \
            --exclude=.bloop \
            --exclude=.metals \
            -czf /tmp/morphhdl-increment-53d-workspace.tar.gz .

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: morphhdl-increment-53d-workspace
          path: |
            /tmp/morphhdl-increment-53d-workspace.tar.gz
            /tmp/increment-53d-head.txt
          if-no-files-found: error
          retention-days: 1

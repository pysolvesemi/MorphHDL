name: Apply Increment 53d retained resize target repair

on:
  push:
    branches:
      - agent/increment-53d-native-streamwidth-adapter
    paths:
      - .github/workflows/increment-53d-workspace-export.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Increment 53d branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-native-streamwidth-adapter
          fetch-depth: 0

      - name: Recover exact symbolic resize targets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/increment-53d-resize.patch
          git apply --check /tmp/increment-53d-resize.patch
          git apply /tmp/increment-53d-resize.patch
          rm .github/workflows/increment-53d-workspace-export.yml
          git diff --check
          if git diff --name-only | grep -Eq '^(core|lib|idslplugin)/'; then
            echo "Increment 53d must not modify native SpinalHDL source" >&2
            exit 1
          fi
          git config user.name "MorphHDL Increment Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala
          git add .github/workflows/increment-53d-workspace-export.yml
          git commit -m "fix: recover retained native resize targets"
          git push origin HEAD:agent/increment-53d-native-streamwidth-adapter

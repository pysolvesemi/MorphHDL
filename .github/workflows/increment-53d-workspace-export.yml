name: Apply Increment 53d invariant unsigned resize repair

on:
  push:
    branches:
      - agent/increment-53d-native-streamwidth-adapter
    paths:
      - .github/workflows/increment-53d-workspace-export.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Increment 53d branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-native-streamwidth-adapter
          fetch-depth: 0

      - name: Admit domain-invariant unsigned symbolic widening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          path = Path("morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala")
          text = path.read_text(encoding="utf-8")
          start_marker = "      private def inferResize(resize: Resize): WidthExpr = {"
          end_marker = "\n\n      private def inferFixedRange"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f"inferResize method markers missing: start={start}, end={end}")
          replacement = base64.b64decode(
              ""
          ).decode("utf-8")
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

          rm -f .github/workflows/increment-53d-workspace-export.yml
          git diff --check
          if git diff --name-only | grep -Eq '^(core|lib|idslplugin)/'; then
            echo "Increment 53d must not modify native SpinalHDL source" >&2
            exit 1
          fi
          git config user.name "MorphHDL Increment Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala
          git add .github/workflows/increment-53d-workspace-export.yml
          git commit -m "fix: support invariant unsigned symbolic widening"
          git push origin HEAD:agent/increment-53d-native-streamwidth-adapter

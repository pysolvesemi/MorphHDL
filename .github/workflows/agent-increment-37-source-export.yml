name: Agent Increment 37 source export

on:
  push:
    branches:
      - agent/increment-37-parameterized-streamfifo-depth
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archive checkout
        shell: bash
        run: |
          tar --exclude=.git -czf /tmp/morphhdl-source.tgz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: morphhdl-increment-37-source
          path: /tmp/morphhdl-source.tgz
          if-no-files-found: error
          retention-days: 1

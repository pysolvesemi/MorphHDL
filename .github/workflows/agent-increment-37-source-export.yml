name: Agent Increment 37 RTL diagnostic

on:
  push:
    branches:
      - agent/increment-37-parameterized-streamfifo-depth
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-37-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0-mill.sh \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Apply reviewed Increment 37 source patches
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/increment-37-patches
          mkdir -p /tmp/increment-37-patches
          cat .github/agent/increment-37-patches.b64.* \
            | base64 --decode > /tmp/increment-37-patches.tgz
          echo 'b0ac67ae2cf7a34282f8ed5c71c85009356b6f6c6722736803b7599e9dc29751  /tmp/increment-37-patches.tgz' \
            | sha256sum --check --strict
          tar -xzf /tmp/increment-37-patches.tgz -C /tmp/increment-37-patches
          for patch in /tmp/increment-37-patches/*.patch; do
            git apply "$patch"
          done
          git diff --check

      - name: Generate and exercise the parameterized FIFO
        id: fifo_test
        continue-on-error: true
        shell: bash
        run: |
          /tmp/morphhdl-mill morph[2.12.18].testOnly \
            morphhdl.ParameterizedStreamFifoDepthTests

      - name: Collect generated FIFO RTL
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p increment37-debug
          find /tmp -type f \
            \( -name 'native_parameterized_depth_stream_fifo.v' \
               -o -name 'increment37-streamfifo-debug.v' \) \
            -print -exec cp --parents '{}' increment37-debug/ \;
          find increment37-debug -type f -maxdepth 12 -print

      - name: Upload generated FIFO RTL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-37-streamfifo-debug
          path: increment37-debug
          if-no-files-found: error
          retention-days: 1

      - name: Preserve diagnostic failure
        if: steps.fifo_test.outcome != 'success'
        shell: bash
        run: exit 1

name: Agent Increment 37 merge coordinator

on:
  push:
    branches:
      - agent/increment-37-parameterized-streamfifo-depth

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: increment-37-merge-coordinator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove coordinator from the proposed change
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr=$(gh pr list \
            --repo pysolvesemi/MorphHDL \
            --head agent/increment-37-parameterized-streamfifo-depth \
            --base parameterized-verilog \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          test -n "$pr"
          git rm -f .github/workflows/agent-increment-37-merge-coordinator.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove Increment 37 merge coordinator'
          git push origin HEAD:agent/increment-37-parameterized-streamfifo-depth
          echo "PR_NUMBER=$pr" >> "$GITHUB_ENV"
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for the final PR workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            runs=$(gh run list \
              --repo pysolvesemi/MorphHDL \
              --commit "$FINAL_HEAD" \
              --event pull_request \
              --limit 30 \
              --json name,status,conclusion,databaseId)
            state=$(RUNS="$runs" python3 - <<'PY'
          import json, os
          runs = json.loads(os.environ['RUNS'])
          required = {'MorphHDL Mill', 'MorphHDL baseline'}
          selected = {}
          for run in runs:
              name = run.get('name')
              if name in required and name not in selected:
                  selected[name] = run
          bad = {'failure', 'cancelled', 'timed_out', 'action_required', 'startup_failure'}
          if any(run.get('conclusion') in bad for run in selected.values()):
              print('failed')
          elif required.issubset(selected) and all(
              run.get('status') == 'completed' and run.get('conclusion') == 'success'
              for run in selected.values()
          ):
              print('success')
          else:
              print('pending')
          PY
            )
            case "$state" in
              success) exit 0 ;;
              failed)
                echo "A required PR workflow failed for $FINAL_HEAD" >&2
                echo "$runs" >&2
                exit 1
                ;;
              pending) sleep 15 ;;
            esac
          done
          echo "Timed out waiting for required PR workflows" >&2
          exit 1

      - name: Squash-merge the validated PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --repo pysolvesemi/MorphHDL \
            --squash \
            --match-head-commit "$FINAL_HEAD" \
            --subject 'Implement Increment 37 parameterized StreamFifo depth' \
            --body 'Retain one public DEPTH through ordinary StreamFifo storage, addresses, pointers, occupancy and depth-specific behavior. Prove the same strict Verilog-2001 definition at depths 1, 3, 5 and 8, preserve concrete mode, document the boundary and mark Increment 37 complete.'
          merge_sha=$(gh pr view "$PR_NUMBER" \
            --repo pysolvesemi/MorphHDL \
            --json mergeCommit \
            --jq '.mergeCommit.oid')
          test -n "$merge_sha"
          echo "MERGE_SHA=$merge_sha" >> "$GITHUB_ENV"

      - name: Verify post-merge workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            runs=$(gh run list \
              --repo pysolvesemi/MorphHDL \
              --commit "$MERGE_SHA" \
              --event push \
              --limit 30 \
              --json name,status,conclusion,databaseId)
            state=$(RUNS="$runs" python3 - <<'PY'
          import json, os
          runs = json.loads(os.environ['RUNS'])
          required = {'MorphHDL Mill', 'MorphHDL baseline'}
          selected = {}
          for run in runs:
              name = run.get('name')
              if name in required and name not in selected:
                  selected[name] = run
          bad = {'failure', 'cancelled', 'timed_out', 'action_required', 'startup_failure'}
          if any(run.get('conclusion') in bad for run in selected.values()):
              print('failed')
          elif required.issubset(selected) and all(
              run.get('status') == 'completed' and run.get('conclusion') == 'success'
              for run in selected.values()
          ):
              print('success')
          else:
              print('pending')
          PY
            )
            case "$state" in
              success) exit 0 ;;
              failed)
                echo "A required post-merge workflow failed for $MERGE_SHA" >&2
                echo "$runs" >&2
                exit 1
                ;;
              pending) sleep 15 ;;
            esac
          done
          echo "Timed out waiting for post-merge workflows" >&2
          exit 1

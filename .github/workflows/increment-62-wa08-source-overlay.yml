name: Increment 62 WA-08 inherited workflow closure

on:
  pull_request:
    branches: [parameterized-verilog]
  push:
    branches: [parameterized-verilog]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wa08-source-and-production-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  source-overlay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Exact source overlay and live mutation controls
        run: |
          python3 morphhdl/scripts/check-increment-62-wa08-source-overlay.py
          python3 morphhdl/scripts/test-increment-62-wa08-source-overlay.py
          python3 morphhdl/scripts/test-wa07b-inherited-review.py
          python3 morphhdl/scripts/check-increment-60g-source-scope.py
          python3 morphhdl/scripts/check-increment-60f-equivalence-closure.py --source-only
          python3 morphhdl/scripts/check-increment-59c-source-review.py
          python3 morphhdl/scripts/check-increment-59g-source-review.py
  production:
    needs: source-overlay
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scala: ["2.12.18", "2.13.12"]
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Generate through the public flag and validate the profile
        shell: bash
        run: |
          set -euo pipefail
          sbt -batch ++${{ matrix.scala }} \
            'morphir/testOnly *CanonicalIrHandoffSpec' \
            'morph/testOnly *MorphCanonicalIrHandoffTests *HierarchyResizeSourceWidthTests *FormalParameterClonePropagationTests *NativeSymbolicMemoryTests *GenericExpressionAndStreamTests *NativeLibraryReuseTests' \
            "morph/Test/runMain morphhdl.examples.WireAssignmentProductionArtifactWriter $GITHUB_WORKSPACE/target/wa08-production"
      - name: Determinism default compatibility strict tools equivalence and mutations
        run: python3 morphhdl/scripts/check-wa08-production-artifacts.py target/wa08-production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wa08-production-${{ matrix.scala }}
          path: |
            target/wa08-production
            morphir/target/test-reports
            morphhdl/target/test-reports
          if-no-files-found: error
  cross-scala:
    needs: production
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wa08-production-*
          path: artifacts
      - name: Compare every production and reference RTL file across Scala versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          left = Path('artifacts/wa08-production-2.12.18/target/wa08-production/first')
          right = Path('artifacts/wa08-production-2.13.12/target/wa08-production/first')
          paths = sorted(path.relative_to(left) for path in left.glob('*/generated.v'))
          assert len(paths) == 31
          assert paths == sorted(path.relative_to(right) for path in right.glob('*/generated.v'))
          for path in paths:
              assert (left / path).read_bytes() == (right / path).read_bytes(), path
          print('WA08_CROSS_SCALA_PASS files=31')
          PY

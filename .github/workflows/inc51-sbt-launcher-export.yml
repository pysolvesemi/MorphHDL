name: Increment 51 SBT launcher export

on:
  pull_request:
    branches:
      - parameterized-verilog
    paths:
      - .github/workflows/inc51-sbt-launcher-export.yml
  push:
    branches:
      - agent/increment-51-native-int-branch-capture
    paths:
      - .github/workflows/inc51-sbt-launcher-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download pinned SBT launcher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/org/scala-sbt/sbt-launch/2.0.6/sbt-launch-2.0.6.jar \
            --output "$RUNNER_TEMP/sbt-launch-2.0.6.jar"
          sha256sum "$RUNNER_TEMP/sbt-launch-2.0.6.jar" > "$RUNNER_TEMP/sbt-launch-2.0.6.jar.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: inc51-sbt-launcher-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sbt-launch-2.0.6.jar
            ${{ runner.temp }}/sbt-launch-2.0.6.jar.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

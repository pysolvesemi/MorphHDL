name: Diagnose Increment 53d typed control versus fixture

on:
  push:
    branches:
      - agent/increment-53d-typed-elabint-pivot
    paths:
      - .github/workflows/increment-53d-control-vs-fixture-diagnosis.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-53d-control-vs-fixture-diagnosis
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-typed-elabint-pivot
          fetch-depth: 0
      - name: Install pinned Mill
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/mill
          chmod +x /tmp/mill
      - name: Run controlled variants
        shell: bash
        run: |
          set -euo pipefail
          start="$(git rev-parse HEAD)"
          : > /tmp/inc53d-control-status.txt

          reset_candidate() {
            git reset --hard "$start" >/dev/null
            git clean -fd >/dev/null
            if ! grep -q 'widthOfExpr(input.payload)' lib/src/main/scala/spinal/lib/Stream.scala; then
              base64 -d morphhdl/scripts/increment-53d-direct-typed-adapter.patch.gz.b64 \
                | gzip -d \
                | git apply --whitespace=nowarn
            fi
          }

          run_suite() {
            label="$1"
            set +e
            /tmp/mill 'morph[2.13.12].testOnly' \
              morphhdl.ParameterizedStreamWidthAdapterTests \
              > "/tmp/inc53d-$label.log" 2>&1
            status=$?
            set -e
            echo "$label=$status" >> /tmp/inc53d-control-status.txt
          }

          reset_candidate
          run_suite typed-native-control

          reset_candidate
          git show origin/parameterized-verilog:lib/src/main/scala/spinal/lib/Stream.scala \
            > lib/src/main/scala/spinal/lib/Stream.scala
          run_suite typed-fixture-legacy-native-control

          reset_candidate
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/src/main/scala/spinal/lib/Stream.scala')
          source = path.read_text()
          start = source.index('object StreamWidthAdapter {')
          end = source.index('//padding=true allow', start)
          body = source[start:end]
          replacements = (
            ('if(inputWidth == outputWidth)', 'if(inputWidth.witness == outputWidth.witness)'),
            ('if (inputWidth == outputWidth)', 'if (inputWidth.witness == outputWidth.witness)'),
            ('else if(inputWidth > outputWidth)', 'else if(inputWidth.witness > outputWidth.witness)'),
            ('else if (inputWidth > outputWidth)', 'else if (inputWidth.witness > outputWidth.witness)'),
          )
          for old, new in replacements:
            body = body.replace(old, new)
          path.write_text(source[:start] + body + source[end:])
          PY
          run_suite typed-widths-witness-control
      - name: Publish diagnosis
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Increment 53d typed control versus fixture diagnosis'
            echo
            cat /tmp/inc53d-control-status.txt
            for label in typed-native-control typed-fixture-legacy-native-control typed-widths-witness-control; do
              echo
              echo "## $label"
              grep -nEi 'NO DRIVER|SPINAL-ELAB|AssertionError|Exception|FAILED|error|InputPayload' \
                "/tmp/inc53d-$label.log" || true
              echo
              tail -n 140 "/tmp/inc53d-$label.log"
            done
          } > docs/morphhdl/increment-53d-control-vs-fixture-result.txt
          git reset --hard HEAD >/dev/null
          git clean -fd >/dev/null
          git config user.name 'MorphHDL Agent'
          git config user.email 'morphhdl-agent@users.noreply.github.com'
          git add docs/morphhdl/increment-53d-control-vs-fixture-result.txt
          git commit -m 'Record Increment 53d typed control diagnosis'
          git pull --rebase origin agent/increment-53d-typed-elabint-pivot
          git push origin HEAD:agent/increment-53d-typed-elabint-pivot

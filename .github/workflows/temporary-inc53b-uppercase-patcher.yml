name: Temporary Increment 53b uppercase source patch

on:
  push:
    branches:
      - fix/increment-53b-uppercase-formal-equivalence

permissions:
  contents: write

concurrency:
  group: temporary-inc53b-uppercase-source-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply uppercase enum naming contract
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'nativeName.toUpperCase(java.util.Locale.ROOT)' \
               morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalEnumLocalizer.scala && \
             grep -Fq 'Scala `State.IDLE` becomes Verilog `STATE_IDLE`' \
               docs/morphhdl/parameterized-verilog-todo.md; then
            echo "Uppercase enum source patch is already present"
            exit 0
          fi
          echo ' ' | base64 --decode | python3
          git config user.name "MorphHDL Increment Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalEnumLocalizer.scala \
            docs/morphhdl/parameterized-verilog-todo.md
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix(morphhdl): use uppercase enum-qualified localparams [inc53b-uppercase-patched]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

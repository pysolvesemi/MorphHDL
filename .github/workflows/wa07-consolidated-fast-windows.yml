name: WA-07 consolidated fast validation Windows

on:
  push:
    branches:
      - agent/wa-07-unified-expression-inlining
    paths:
      - ".github/workflows/wa07-consolidated-fast-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wa-07-unified-expression-inlining
          fetch-depth: 0
      - name: Add exact WA-07 roadmap contracts
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path("morphhdl-passes/morphhdl-ir-wire-assignment-passes-todo.md")
          text = path.read_text(encoding="utf-8")
          first = "One configuration flag enables all passes in the fixed order above; false disables the entire pass pipeline."
          second = "RHS expressions are copied once per receiver"
          if first not in text:
              marker = "Product code has one all-or-none `enabled` flag. `false` executes no pass;\n`true` executes all three in the fixed order above."
              if marker not in text:
                  raise SystemExit("global-control insertion point is missing")
              text = text.replace(marker, marker + "\n\n" + first, 1)
          if second not in text:
              marker = "The exact temporary declaration and sole assignment are removed."
              if marker not in text:
                  raise SystemExit("expression-copy insertion point is missing")
              text = text.replace(marker, second + "; each copy preserves the removed assignment's packed type fence.\n\n" + marker, 1)
          path.write_text(text, encoding="utf-8")
          '@ | Set-Content -Encoding utf8 wa07_patch.py
          python wa07_patch.py
          if (-not (git diff --quiet -- morphhdl-passes/morphhdl-ir-wire-assignment-passes-todo.md)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add morphhdl-passes/morphhdl-ir-wire-assignment-passes-todo.md
            git commit -m "WA-07: seal global-control and per-receiver expression contracts"
            git pull --rebase origin agent/wa-07-unified-expression-inlining
            git push origin HEAD:agent/wa-07-unified-expression-inlining
          }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@v1
      - name: Run every static pass-workspace guard
        shell: pwsh
        run: |
          $scripts = @(
            "check-wa02-adapter-boundary.py",
            "check-wa03-gates.py",
            "check-wa04-pass.py",
            "check-wa05-pass.py",
            "check-wa06-pipeline.py",
            "check-wa07-global-pass-control.py",
            "check-wa07-pass.py",
            "check-wa07-expression-pass.py"
          )
          foreach ($script in $scripts) {
            python "morphhdl-passes/scripts/$script" --self-test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python "morphhdl-passes/scripts/$script"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python morphhdl-passes/scripts/validate_wire_assignment_equivalence.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Scala 2.12 contracts and transforms
        working-directory: morphhdl-passes
        shell: pwsh
        run: sbt -batch ++2.12.18 test
      - name: Scala 2.13 contracts and transforms
        working-directory: morphhdl-passes
        shell: pwsh
        run: sbt -batch ++2.13.12 test

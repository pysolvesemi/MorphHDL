name: Increment 52 clean implementation

on:
  push:
    branches:
      - agent/increment-52-nested-control-flow-clean
    paths:
      - .github/workflows/increment-52-clean-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-52-clean-implementation
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-52-nested-control-flow-clean
          fetch-depth: 0

      - name: Apply verified production delta and remove delivery files
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/inc52-clean.patch.gz.b64
          patch="$RUNNER_TEMP/inc52-clean.patch"
          base64 --decode "$payload" | gzip -dc > "$patch"
          echo "4e92e8fa0de0f83d7fb0d10e7e2fd185e23912cf3b223691b2bf750a30ea7eaa  $patch" | sha256sum --check
          git apply --check "$patch"
          git apply "$patch"
          rm -f "$payload" .github/workflows/increment-52-clean-apply.yml

          git config user.name "pysolvesemi"
          git config user.email "pysolvesemi@gmail.com"
          git add -A
          git diff --cached --check

          expected="$RUNNER_TEMP/expected-files"
          cat > "$expected" <<'EOF'
          .github/inc52-clean.patch.gz.b64
          .github/workflows/increment-52-clean-apply.yml
          .github/workflows/morphhdl-native-int-nested-control-flow.yml
          docs/morphhdl/increment-52-nested-symbolic-control-flow.md
          frontend/src/main/scala/morphhdl/frontend/NativeIntSymbolicConditional.scala
          morphhdl/scripts/check-native-int-nested-control-flow-boundary.sh
          morphhdl/scripts/check-native-int-symbolic-conditional-boundary.sh
          morphhdl/src/test/scala/morphhdl/NativeIntNestedSymbolicControlFlowTests.scala
          morphhdl/src/test/scala/morphhdl/NativeIntSymbolicConditionalTests.scala
          morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala
          EOF
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual-files"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$RUNNER_TEMP/actual-files"

          git commit -m "Implement Increment 52 nested symbolic control flow"
          git push origin HEAD:agent/increment-52-nested-control-flow-clean

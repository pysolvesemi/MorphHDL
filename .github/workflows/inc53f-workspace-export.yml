name: Increment 53f checkpoint validation

on:
  push:
    branches:
      - agent/increment-53f-typed-primitives
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-53f-checkpoint-validation
  cancel-in-progress: false

jobs:
  compile-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/increment-53f-typed-primitives
      - name: Reconstruct and verify checkpoint
        shell: bash
        run: |
          set -euo pipefail
          {
            head -c 7000 .inc53f/patch.00
            cat .inc53f/patch.0[1-7]
          } | base64 -d > /tmp/inc53f.patch
          echo 'f8ca7e78197c14609a23e9decadef5919a72b3c48e53c83c065c3aa7833a6407  /tmp/inc53f.patch' | sha256sum -c -
          test "$(wc -c < /tmp/inc53f.patch)" -eq 39522
          git apply --check /tmp/inc53f.patch
          git apply /tmp/inc53f.patch
          git diff --check
      - name: Compile both Scala lanes
        shell: bash
        run: |
          set -euo pipefail
          sbt -batch ++2.12.18 'core/compile' 'morphruntime/compile' 'lib/compile'
          sbt -batch ++2.13.12 'core/compile' 'morphruntime/compile' 'lib/compile'
      - name: Publish compiled checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf .inc53f
          git rm .github/workflows/inc53f-workspace-export.yml
          git add -A
          git commit -m 'feat(53f): retain typed Counter and primitive safety'
          git push origin HEAD:agent/increment-53f-typed-primitives

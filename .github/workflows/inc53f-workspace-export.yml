name: Increment 53f checkpoint transfer diagnostic

on:
  push:
    branches:
      - agent/increment-53f-typed-primitives
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53f-typed-primitives
      - name: Reconstruct staged patch without applying it
        shell: bash
        run: |
          set -euo pipefail
          cat .inc53f/patch.* | base64 -d > /tmp/inc53f.patch
          sha256sum /tmp/inc53f.patch
          wc -c /tmp/inc53f.patch
          git apply --check /tmp/inc53f.patch || true
      - uses: actions/upload-artifact@v4
        with:
          name: increment-53f-reconstructed-patch
          path: /tmp/inc53f.patch
          retention-days: 1

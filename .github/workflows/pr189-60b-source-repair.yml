name: PR189 repair inherited 60b qualification

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: pr189-60b-source-repair-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  repair-source-review:
    name: Repair only the failed inherited 60b source-audit composition
    if: >-
      github.event.action == 'submitted' && github.event.review.state == 'commented' &&
      github.event.review.user.login == github.repository_owner && github.actor == github.repository_owner &&
      github.repository == 'pysolvesemi/MorphHDL' && github.event.pull_request.number == 189 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/cdc-independent-parameter-consumers' &&
      github.event.pull_request.base.ref == 'parameterized-verilog' &&
      github.event.review.commit_id == github.event.pull_request.head.sha &&
      github.event.review.body == format('pr189:repair-60b:{0}', github.event.pull_request.head.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    outputs:
      head: ${{ steps.publish.outputs.head }}
      tree: ${{ steps.publish.outputs.tree }}
    env:
      EXPECTED_INPUT: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Authenticate the actual full-CI failure, not a historical skip
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            fs.mkdirSync('/tmp/pr189-60b-source', {recursive:true});
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id:35194688418});
            if (run.head_sha !== '05e8f46b76c39017958b98c36b04475493446cef' ||
                run.head_branch !== 'agent/cdc-independent-parameter-consumers' ||
                run.path !== '.github/workflows/increment-60b-signedness-authority.yml' ||
                run.status !== 'completed' || run.conclusion !== 'failure') {
              throw new Error('The pinned 60b source-scope failure no longer matches');
            }
            const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:run.id,per_page:100});
            if (jobs.total_count !== 2 || !jobs.jobs.every(j => j.conclusion === 'failure' &&
                j.steps.some(s => s.name === 'Check merged prerequisite and unchanged native/emitter scope' && s.conclusion === 'failure'))) {
              throw new Error('Both expected Scala lanes must have the actual source-scope failure');
            }
            fs.writeFileSync('/tmp/pr189-60b-source/failed-run.json', JSON.stringify({run,jobs},null,2));
      - name: Apply the pinned CI-only repair and seal its exact reviewed inventory
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr189-60b-source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import importlib.util, json, os, re, subprocess, tempfile
          from pathlib import Path
          root = Path.cwd()
          base = '05e8f46b76c39017958b98c36b04475493446cef'
          target = '27af65abbee0d2334d6be7a6e4e2408b8af32fd9'
          transport = '.github/workflows/pr189-60b-source-repair.yml'
          workflow = '.github/workflows/increment-60b-signedness-authority.yml'
          successor = 'morphhdl/scripts/check-cdc-successor-source.py'
          helper = 'morphhdl/scripts/check-increment-62-wa08-source-overlay.py'
          manifest = 'morphhdl/contracts/increment-62-wa08-source-overlay.json'
          evidence = Path('/tmp/pr189-60b-source')
          def git(*args):
              return subprocess.check_output(['git', '--literal-pathspecs', *args], timeout=120)
          def require(ok, detail):
              if not ok: raise RuntimeError('PR189 60b repair: ' + detail)
          def changed(a, b):
              return {p.decode() for p in git('diff','--no-renames','--name-only','-z',a,b).split(b'\0') if p}
          head = git('rev-parse','HEAD').decode().strip()
          require(head == os.environ['EXPECTED_INPUT'], 'wrong input head')
          require(git('show','-s','--format=%P',head).decode().strip() == base, 'unexpected parent')
          require(changed(base,head) == {transport}, 'transport must be the only input change')
          require(not git('status','--porcelain','--untracked-files=all'), 'dirty input')
          git('merge-base','--is-ancestor',target,head)
          require(git('rev-parse',base+':'+workflow).decode().strip() == 'd10a959c71a34236962e192f74f51ca8175fe8e5', 'unexpected failed workflow blob')
          with tempfile.TemporaryDirectory(prefix='pr189-60b-previous-') as directory:
              checkout = Path(directory) / 'source'
              git('worktree','add','--quiet','--detach',str(checkout),base)
              try:
                  subprocess.run(['python3',str(checkout/helper)],cwd=checkout,check=True,timeout=300)
                  subprocess.run(['python3',str(checkout/successor)],cwd=checkout,check=True,timeout=300)
              finally:
                  git('worktree','remove','--force',str(checkout))
          before = (root/workflow).read_text()
          needle = '          python3 morphhdl/scripts/check-increment-60b-signedness-authority.py\n'
          require(before.count(needle) == 1, 'ambiguous historical source-audit call')
          # Reuse the same exact current-source and pre-Increment61 composition
          # as 60c, while also replaying the original 60b guard unchanged on its
          # actual merged source. No --without-git-scope bypass is introduced.
          commands = [
              'python3 morphhdl/scripts/check-increment-61-source-review.py',
              'python3 morphhdl/scripts/check-increment-61-source-review.py --self-test',
              'predecessor=$(python3 morphhdl/scripts/check-increment-61-source-review.py --print-base)',
              'historical_60b=d0c2d65ed301a7895218a2fe225b2faf4a4bbfe0',
              'git merge-base --is-ancestor "$predecessor" HEAD',
              'git merge-base --is-ancestor "$historical_60b" HEAD',
              'temporary=$(mktemp -d)',
              'trap \'git worktree remove --force "$temporary/60b" >/dev/null 2>&1 || true; git worktree remove --force "$temporary/pre-61" >/dev/null 2>&1 || true; rm -rf "$temporary"\' EXIT',
              'git worktree add --quiet --detach "$temporary/60b" "$historical_60b"',
              '(cd "$temporary/60b" && python3 morphhdl/scripts/check-increment-60b-signedness-authority.py)',
              'git worktree add --quiet --detach "$temporary/pre-61" "$predecessor"',
              '(cd "$temporary/pre-61" && python3 morphhdl/scripts/check-increment-60f-equivalence-closure.py --source-only)',
          ]
          replacement = ''.join('          '+line+'\n' for line in commands)
          after = before.replace(needle,replacement)
          # The additional immutable audits need the same headroom as the
          # inherited source adapters; no command or behavioral gate is removed.
          require(after.count('    timeout-minutes: 30\n') == 1, 'unexpected timeout declaration')
          after = after.replace('    timeout-minutes: 30\n','    timeout-minutes: 45\n',1)
          require(after.replace(replacement,needle).replace('    timeout-minutes: 45\n','    timeout-minutes: 30\n',1) == before,
                  'repair altered a behavioral command or other workflow content')
          (root/workflow).write_text(after)
          (evidence/'source-step.sh').write_text('set -euo pipefail\n'+'\n'.join(commands)+'\n')
          old_successor = (root/successor).read_text()
          marker = 'SUCCESSOR_PATHS = frozenset("""\n'
          require(old_successor.count(marker) == 1, 'ambiguous successor inventory')
          require(transport not in old_successor and workflow not in old_successor, 'new paths already admitted')
          new_successor = old_successor.replace(marker,marker+workflow+'\n'+transport+'\n',1)
          require(new_successor.replace(marker+workflow+'\n'+transport+'\n',marker,1) == old_successor,
                  'successor algorithm changed')
          (root/successor).write_text(new_successor)
          git('add','--',workflow,successor)
          git('commit','-q','-m','PR189: compose the failed 60b audit with exact inherited source reviews [skip ci]')
          anchor = git('rev-parse','HEAD').decode().strip()
          require(changed(base,anchor) == {transport,workflow,successor}, 'unexpected source anchor delta')
          spec = importlib.util.spec_from_file_location('reviewed_wa08',root/helper)
          wa = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(wa)
          old = wa.contract(root)
          records = {entry['path']:entry for entry in old['files']}
          before_records = json.loads(json.dumps(records))
          for path in (transport,workflow,successor):
              raw = wa.regular(root,path)
              previous = wa.frozen(root,wa.BASE,path)
              old_hash = wa.digest(previous) if previous is not None else None
              if path in records:
                  require(records[path]['before_sha256'] == old_hash and records[path]['mode'] == '100644', 'baseline or mode changed: '+path)
                  require(records[path]['after_sha256'] == wa.digest(git('show',base+':'+path)), 'unreviewed previous bytes: '+path)
                  records[path]['after_sha256'] = wa.digest(raw)
              else:
                  records[path] = {'path':path,'mode':'100644','before_sha256':old_hash,'after_sha256':wa.digest(raw)}
          for path,entry in before_records.items():
              if path not in (transport,workflow,successor): require(records[path] == entry, 'unrelated review entry changed: '+path)
          old['files'] = [records[path] for path in sorted(records)]
          old['final_source_commit'] = anchor
          (root/manifest).write_text(json.dumps(old,indent=2)+'\n')
          old_helper = (root/helper).read_bytes()
          updated,count = re.subn(rb'^CONTRACT_SHA256 = "[^"]+"$',
              ('CONTRACT_SHA256 = "'+wa.digest((root/manifest).read_bytes())+'"').encode(),old_helper,count=1,flags=re.M)
          require(count == 1 and wa.normalized_helper(updated) == wa.normalized_helper(old_helper), 'overlay verifier algorithm changed')
          (root/helper).write_bytes(updated)
          git('add','--',helper,manifest)
          git('commit','-q','-m','PR189: seal the exact 60b workflow-only audit repair [skip ci]')
          expected = {transport,workflow,successor,helper,manifest}
          require(changed(base,'HEAD') == expected, 'unexpected final repair delta')
          require(not git('status','--porcelain','--untracked-files=all'), 'dirty final candidate')
          (evidence/'identity.json').write_text(json.dumps({'input':head,'previous_head':base,'target':target,
              'source_anchor':anchor,'head':git('rev-parse','HEAD').decode().strip(),
              'tree':git('rev-parse','HEAD^{tree}').decode().strip(),
              'changed_paths':sorted(expected),'compiler_and_test_sources_unchanged':True},indent=2)+'\n')
          PY
          git diff --check
          git diff --binary 05e8f46b76c39017958b98c36b04475493446cef HEAD > /tmp/pr189-60b-source/candidate.patch
      - name: Execute the repaired source step and unchanged native rejection controls
        run: |
          set -euo pipefail
          bash /tmp/pr189-60b-source/source-step.sh 2>&1 | tee /tmp/pr189-60b-source/repaired-source-step.log
          for checker in check-increment-62-wa08-source-overlay.py check-native-source-preservation.py; do
            python3 "morphhdl/scripts/$checker" 2>&1 | tee "/tmp/pr189-60b-source/$checker.log"
            python3 "morphhdl/scripts/$checker" --self-test 2>&1 | tee "/tmp/pr189-60b-source/$checker-mutations.log"
          done
          python3 morphhdl/scripts/check-increment-58-retirement.py
          python3 morphhdl/scripts/check-production-retirement.py
          python3 morphhdl/scripts/check-typed-native-source-overlay.py
      - name: Reject real mutations of the new workflow review without altering any verifier
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          paths = ('.github/workflows/increment-60b-signedness-authority.yml',
                   '.github/workflows/pr189-60b-source-repair.yml')
          for index,path in enumerate(paths):
              file = Path(path)
              original = file.read_bytes()
              try:
                  file.write_bytes(original+b'\n# PR189 unreviewed workflow mutation\n')
                  result = subprocess.run(['python3','morphhdl/scripts/check-increment-61-source-review.py'],
                      text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=300)
                  Path('/tmp/pr189-60b-source/mutation-'+str(index)+'.log').write_text(result.stdout)
                  if result.returncode == 0 or 'WA-08 source overlay:' not in result.stdout or path not in result.stdout:
                      raise RuntimeError('workflow mutation did not reach its exact source guard: '+path)
                  print('PR189_60B_WORKFLOW_MUTATION_REJECTED '+path)
              finally:
                  file.write_bytes(original)
          PY
          git diff --exit-code
          git diff --cached --exit-code
      - id: publish
        name: Publish only the source-verified repair with automatic CI suppressed
        run: |
          set -euo pipefail
          branch='agent/cdc-independent-parameter-consumers'
          test "$(git ls-remote --exit-code origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_INPUT"
          test "$(git ls-remote --exit-code origin refs/heads/parameterized-verilog | cut -f1)" = 27af65abbee0d2334d6be7a6e4e2408b8af32fd9
          git merge-base --is-ancestor "$EXPECTED_INPUT" HEAD
          for commit in $(git rev-list "$EXPECTED_INPUT..HEAD"); do git show -s --format=%B "$commit" | grep -F '[skip ci]'; done
          git push origin "HEAD:refs/heads/$branch"
          printf 'head=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > /tmp/pr189-60b-source/published-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr189-60b-source-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: /tmp/pr189-60b-source/
          if-no-files-found: error
          retention-days: 30

  qualify-only-failed-60b:
    name: Rerun only the failed 60b workflow on the repaired published head
    needs: repair-source-review
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    permissions:
      contents: read
      actions: write
    env:
      QUALIFICATION_HEAD: ${{ needs.repair-source-review.outputs.head }}
    steps:
      - name: Require both actual Scala lanes, unchanged behavioral gates and baseline proofs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = '/tmp/pr189-60b-qualification'; fs.mkdirSync(dir,{recursive:true});
            const head = process.env.QUALIFICATION_HEAD;
            const branch = 'agent/cdc-independent-parameter-consumers';
            const target = '27af65abbee0d2334d6be7a6e4e2408b8af32fd9';
            const workflow_id = 350709339;
            const path = '.github/workflows/increment-60b-signedness-authority.yml';
            if (!/^[0-9a-f]{40}$/.test(head)) throw new Error('Missing published qualification head');
            async function unchanged() {
              const {data: pr} = await github.rest.pulls.get({...context.repo,pull_number:189});
              if (pr.state !== 'open' || pr.head.sha !== head || pr.head.ref !== branch ||
                  pr.head.repo.full_name !== 'pysolvesemi/MorphHDL' || pr.base.ref !== 'parameterized-verilog' || pr.base.sha !== target) {
                throw new Error('PR189 head or target moved; do not dispatch or qualify another source');
              }
            }
            await unchanged();
            const listed = await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id,head_sha:head,event:'workflow_dispatch',per_page:100});
            const prior = listed.data.workflow_runs.filter(r => r.head_sha === head && r.path === path && r.head_branch === branch);
            if (prior.length > 1) throw new Error('Ambiguous current-head 60b qualification inventory');
            let selected = prior[0];
            if (!selected) {
              fs.writeFileSync(dir+'/request.json',JSON.stringify({head,target,workflow_id,path,requested_at:new Date().toISOString()},null,2));
              await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id,ref:branch});
            } else if (selected.status === 'completed' && selected.conclusion !== 'success') {
              await github.rest.actions.reRunWorkflowFailedJobs({...context.repo,run_id:selected.id});
              selected = {...selected,run_attempt:selected.run_attempt+1};
            }
            const deadline = Date.now()+95*60*1000;
            while (Date.now() < deadline) {
              await unchanged();
              if (!selected) {
                const response = await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id,head_sha:head,event:'workflow_dispatch',per_page:100});
                const rows = response.data.workflow_runs.filter(r => r.head_sha === head && r.path === path && r.head_branch === branch);
                if (rows.length > 1) throw new Error('Ambiguous dispatch receipt');
                if (rows.length === 1) selected = rows[0];
              }
              if (selected) {
                const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo,run_id:selected.id});
                if (run.head_sha !== head || run.head_branch !== branch || run.path !== path) throw new Error('Run identity changed');
                fs.writeFileSync(dir+'/run.json',JSON.stringify(run,null,2));
                core.info(`PR189_60B_PROGRESS ${run.id} ${head} ${run.status} ${run.conclusion}`);
                if (run.run_attempt >= selected.run_attempt && run.status === 'completed') {
                  if (run.conclusion !== 'success') throw new Error('The repaired 60b workflow did not pass: '+run.html_url);
                  const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:run.id,per_page:100});
                  fs.writeFileSync(dir+'/jobs.json',JSON.stringify(jobs,null,2));
                  const names = ['Signedness authority Scala 2.12.18','Signedness authority Scala 2.13.12'];
                  const gates = ['Check merged prerequisite and unchanged native/emitter scope',
                    'Signedness rules, identity rejection, replay and publication parity',
                    'Requalify unchanged baseline and live negative-result mutation'];
                  if (jobs.total_count !== 2 || !names.every(name => {
                    const matches = jobs.jobs.filter(j => j.name === name && j.head_sha === head);
                    return matches.length === 1 && matches[0].conclusion === 'success' && gates.every(g =>
                      matches[0].steps.some(s => s.name === g && s.conclusion === 'success'));
                  })) throw new Error('A required Scala payload was skipped or did not execute');
                  await unchanged();
                  fs.writeFileSync(dir+'/targeted-pass.json',JSON.stringify({head,target,run_id:run.id,scala:names,required_gates:gates},null,2));
                  core.info('PR189_60B_TARGETED_PASS '+head+' '+run.id);
                  return;
                }
              }
              await new Promise(resolve => setTimeout(resolve,30000));
            }
            throw new Error('60b qualification timed out; full CI remains blocked');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr189-60b-qualification-${{ needs.repair-source-review.outputs.head }}-${{ github.run_attempt }}
          path: /tmp/pr189-60b-qualification/
          if-no-files-found: error
          retention-days: 30

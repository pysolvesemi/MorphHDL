name: Increment 59i composite widening development

on:
  push:
    branches: ['agent/increment-59i-*']
    paths:
      - '.github/workflows/increment-59i-composite-widening-development.yml'
      - 'morphhdl/repair-59i-composite-widening/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-59i-composite-widening-development
  cancel-in-progress: true

jobs:
  compile-and-test:
    name: Composite widening Scala ${{ matrix.scala }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scala: ['2.12.18', '2.13.12']
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      SCALA_VERSION: ${{ matrix.scala }}
      COURSIER_REPOSITORIES: https://repo.maven.apache.org/maven2
      COURSIER_CACHE: /sbt/.cache/coursier/v1
      JAVA_TOOL_OPTIONS: '-Xmx5G -XX:ActiveProcessorCount=4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Apply the source-bound widening prototype
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-59i-composite-widening"
          mkdir -p "$output"
          git rev-parse HEAD > "$output/staging-head.txt"
          test "$(git merge-base HEAD d9321d5007b71024764b1680b253f2455c4e52d6)" = d9321d5007b71024764b1680b253f2455c4e52d6
          test "$(git hash-object morphhdl/src/main/scala/spinal/core/internals/TypedBalancedReductionCompositeReplay.scala)" = b982cb4a383288bfcbc07020528269260caf9473
          cat morphhdl/repair-59i-composite-widening/0*.patch > "$output/patch.txt"
          git apply --recount --check "$output/patch.txt"
          git apply --recount "$output/patch.txt"
          git diff --check
          git diff --binary > "$output/applied.diff"
      - name: Bootstrap pinned SBT
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-59i-composite-widening"
          version=$(sed -n 's/^sbt.version=//p' project/build.properties)
          test "$version" = '1.10.0'
          base="https://repo.maven.apache.org/maven2/org/scala-sbt/sbt-launch/$version/sbt-launch-$version.jar"
          curl --fail --location --retry 5 --retry-all-errors "$base" -o "$output/sbt-launch.jar"
          printf '[repositories]\nlocal\nmaven-central: https://repo.maven.apache.org/maven2\n' > "$output/repositories"
          cat > "$output/sbt.sh" <<'SH'
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-59i-composite-widening"
          java -Xmx4G -Dsbt.log.noformat=true -Dsbt.supershell=false \
            -Dsbt.boot.directory=/sbt/.sbt/boot -Dsbt.global.base=/sbt/.sbt \
            -Dsbt.ivy.home=/sbt/.ivy2 -Duser.home=/sbt \
            -Dsbt.repository.config="$output/repositories" -Dsbt.override.build.repos=true \
            -jar "$output/sbt-launch.jar" "++$SCALA_VERSION" "$@"
          SH
      - name: Compile and run focused widening and inherited composite tests
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-59i-composite-widening"
          bash "$output/sbt.sh" 'morph/Test/compile' \
            'morph/Test/testOnly spinal.core.internals.TypedBalancedReductionCompositeWideningTests spinal.core.internals.TypedBalancedReductionCompositeTests spinal.core.internals.TypedBalancedReductionCompositeCaptureTests spinal.core.internals.TypedBalancedReductionWidthTransferTests' \
            > "$output/tests.log" 2>&1 || { tail -n 220 "$output/tests.log"; exit 1; }
          cp morphhdl/src/main/scala/spinal/core/internals/TypedBalancedReductionCompositeLeafReplay.scala "$output/"
          cp morphhdl/src/main/scala/spinal/core/internals/TypedBalancedReductionCompositeWidthSchedule.scala "$output/"
          cp morphhdl/src/main/scala/spinal/core/internals/TypedBalancedReductionCompositeReplay.scala "$output/"
          cp morphhdl/src/test/scala/spinal/core/internals/TypedBalancedReductionCompositeWideningTests.scala "$output/"
      - name: Upload exact prototype source and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59i-composite-widening-${{ matrix.scala }}
          path: target/increment-59i-composite-widening
          if-no-files-found: error
          retention-days: 7

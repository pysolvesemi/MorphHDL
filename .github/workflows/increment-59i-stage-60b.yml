name: Increment 59i reviewed 60b source staging

on:
  push:
    branches: [recovery/increment-59i-history-20260914]
    paths:
      - .github/workflows/increment-59i-stage-60b.yml
      - .github/recovery/59i-60b-source/**

# Only exact immutable blobs and commits; publication uses the connector separately.
permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Reconstruct exact reviewed source and run source guards and 60b regressions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/59i-60b-evidence"
          python3 -B .github/recovery/59i-60b-source/stage_60b.py prepare \
            --repository "$GITHUB_WORKSPACE" \
            --destination "$RUNNER_TEMP/59i-60b-source" \
            --payload-dir "$GITHUB_WORKSPACE/.github/recovery/59i-60b-source" \
            --output "$RUNNER_TEMP/59i-60b-evidence" \
            2>&1 | tee "$RUNNER_TEMP/59i-60b-evidence/prepare.log"
      - name: Export exact tree requests
        uses: actions/upload-artifact@v4
        with:
          name: increment-59i-60b-tree-requests-14dc0d2b-${{ github.run_attempt }}
          path: ${{ runner.temp }}/59i-60b-evidence
          if-no-files-found: error
          retention-days: 21
      - name: Verify connector-created trees and stage exact source and seal commits
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B .github/recovery/59i-60b-source/stage_60b.py commits \
            --repository "$GITHUB_WORKSPACE" \
            --destination "$RUNNER_TEMP/59i-60b-source" \
            --payload-dir "$GITHUB_WORKSPACE/.github/recovery/59i-60b-source" \
            --output "$RUNNER_TEMP/59i-60b-evidence" \
            2>&1 | tee "$RUNNER_TEMP/59i-60b-evidence/commits.log"
      - name: Preserve source checks and object receipts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59i-60b-staged-source-14dc0d2b-${{ github.run_attempt }}
          path: ${{ runner.temp }}/59i-60b-evidence
          if-no-files-found: error
          retention-days: 21

name: Increment 59b native capture materialization

on:
  push:
    branches: [agent/increment-59b-parameterized-reduce-balanced-tree]
    paths:
      - '.github/workflows/increment-59b-capture-materialize.yml'
      - 'morphhdl/implementation/increment-59b/**'
      - 'morphhdl/scripts/apply-increment-59b-capture.py'
      - 'morphhdl/contracts/.gitignore'

permissions:
  contents: write

concurrency:
  group: increment-59b-native-capture-materialize
  cancel-in-progress: true

jobs:
  materialize-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      COURSIER_REPOSITORIES: https://repo.maven.apache.org/maven2
      COURSIER_CACHE: /sbt/.cache/coursier/v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Materialize exact reviewed capture changes and native audit
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'MorphHDL 59b implementation'
          git config user.email 'implementation@users.noreply.github.com'
          mkdir -p target/increment-59b-capture
          python3 morphhdl/scripts/apply-increment-59b-capture.py 2>&1 | tee target/increment-59b-capture/materialize.log
          python3 morphhdl/scripts/check-native-source-preservation.py
          python3 morphhdl/scripts/check-production-retirement.py
      - name: Bootstrap the repository-pinned SBT 1.10.0 with verified checksum
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^sbt.version=//p' project/build.properties)
          test "$version" = '1.10.0'
          dir="$GITHUB_WORKSPACE/target/increment-59b-capture/bootstrap"
          mkdir -p "$dir"
          base="https://repo.maven.apache.org/maven2/org/scala-sbt/sbt-launch/$version/sbt-launch-$version.jar"
          curl --fail --location --retry 5 --retry-all-errors "$base" -o "$dir/sbt-launch.jar"
          curl --fail --location --retry 5 --retry-all-errors "$base.sha1" -o "$dir/sbt-launch.jar.sha1"
          python3 - <<'PY'
          import hashlib, re
          from pathlib import Path
          root = Path('target/increment-59b-capture/bootstrap')
          expected = (root / 'sbt-launch.jar.sha1').read_text().strip()
          assert re.fullmatch('[0-9a-fA-F]{40}', expected)
          assert hashlib.sha1((root / 'sbt-launch.jar').read_bytes()).hexdigest() == expected.lower()
          PY
          printf '[repositories]\nlocal\nmaven-central: https://repo.maven.apache.org/maven2\n' > "$dir/repositories"
      - name: Dual Scala capture safety and unchanged native RTL qualification
        shell: bash
        run: |
          set -euo pipefail
          bootstrap="$GITHUB_WORKSPACE/target/increment-59b-capture/bootstrap"
          for scala in 2.12.18 2.13.12; do
            output="$GITHUB_WORKSPACE/target/increment-59b-capture/$scala"
            mkdir -p "$output"
            java -Xmx3G -Dsbt.log.noformat=true -Dsbt.supershell=false \
              -Dsbt.boot.directory=/sbt/.sbt/boot -Dsbt.global.base=/sbt/.sbt \
              -Dsbt.ivy.home=/sbt/.ivy2 -Duser.home=/sbt \
              -Dsbt.repository.config="$bootstrap/repositories" -Dsbt.override.build.repos=true \
              -jar "$bootstrap/sbt-launch.jar" "++$scala" \
              'morph/Test/testOnly spinal.core.internals.TypedBalancedReductionCaptureTests spinal.core.internals.TypedBalancedReductionCaptureSafetyTests spinal.core.internals.TypedBalancedReductionPlanTests morphhdl.ReduceBalancedTreeNativeContractTests' \
              "morph/Test/runMain nativeapplication.ReduceBalancedTreeNativeOracleArtifactWriter $output/a" \
              "morph/Test/runMain nativeapplication.ReduceBalancedTreeNativeOracleArtifactWriter $output/b" \
              'show morph/Test/fullClasspath' > "$output/sbt.log" 2>&1 || { tail -n 200 "$output/sbt.log"; exit 1; }
            python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name, count in [('TypedBalancedReductionCaptureTests', 10), ('TypedBalancedReductionCaptureSafetyTests', 12), ('TypedBalancedReductionPlanTests', 8), ('ReduceBalancedTreeNativeContractTests', 8)]:
              paths = list(Path('morphhdl/target').rglob('*' + name + '.xml'))
              assert len(paths) == 1, (name, paths)
              suite = ET.parse(paths[0]).getroot()
              assert int(suite.get('tests', '0')) == count, (name, suite.attrib)
              assert all(int(suite.get(k, '0')) == 0 for k in ('failures', 'errors', 'skipped')), (name, suite.attrib)
              print(name, suite.attrib)
          PY
            python3 morphhdl/scripts/check-increment-59b-native-oracle.py "$output/a" "$output/b"
            tail -n 20 "$output/sbt.log"
          done
      - name: Fast-forward the tested checkpoint without merging or checking the roadmap
        shell: bash
        run: |
          set -euo pipefail
          branch='agent/increment-59b-parameterized-reduce-balanced-tree'
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = '${{ github.sha }}' || { echo 'Branch advanced; refusing to overwrite concurrent work'; exit 1; }
          test -z "$(git status --porcelain --untracked-files=no)"
          git push origin "HEAD:refs/heads/$branch"
          echo "Published native capture checkpoint $(git rev-parse HEAD); parameterized stage replay and candidate formal remain incomplete." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve exact source and compiler-only reproduction evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-59b-capture"
          mkdir -p "$output"
          git archive HEAD | gzip > "$output/source.tar.gz"
          git bundle create "$output/source.bundle" HEAD
          python3 - <<'PY'
          from pathlib import Path
          import tarfile
          root = Path.cwd()
          with tarfile.open(root / 'target/increment-59b-capture/compiler-only.tar.gz', 'w:gz') as archive:
              # Only dependency JARs and generated classes; no configuration,
              # Git metadata, authentication files, tokens, or credentials.
              for name, cache in [('coursier', Path('/sbt/.cache/coursier/v1')), ('sbt-boot', Path('/sbt/.sbt/boot'))]:
                  for jar in sorted(cache.rglob('*.jar')):
                      archive.add(jar, arcname='dependencies/' + name + '/' + str(jar.relative_to(cache)), recursive=False)
              for module in ('core','lib','sim','idslplugin','idslpayload','morphplugin','morphruntime','morphir','paramrtl','frontend','backends/verilog','morphhdl'):
                  target = root / module / 'target'
                  for scala in sorted(target.glob('scala-*')):
                      for name in ('classes', 'test-classes', 'src_managed'):
                          directory = scala / name
                          if directory.is_dir(): archive.add(directory, arcname='repository/' + str(directory.relative_to(root)))
                      for jar in sorted(scala.glob('*.jar')):
                          archive.add(jar, arcname='repository/' + str(jar.relative_to(root)), recursive=False)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-59b-native-capture-materialization
          path: |
            target/increment-59b-capture
            morphhdl/target/test-reports
          if-no-files-found: error
          retention-days: 30

name: Increment 59 bootstrap diagnostic

on:
  push:
    branches:
      - agent/increment-59-typed-blackbox-generics
    paths:
      - .github/workflows/increment-59-bootstrap-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-59-typed-blackbox-generics
          fetch-depth: 0

      - name: Diagnose without aborting
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import subprocess
          import traceback
          from pathlib import Path

          report = []
          try:
              source = Path('.github/workflows/increment-59-bootstrap.yml').read_text(encoding='utf-8')
              marker = 'encoded = """'
              start = source.index(marker) + len(marker)
              end = source.index('"""', start)
              encoded = source[start:end]
              report.append(f'encoded_length={len(encoded)}')
              decoded = gzip.decompress(base64.b64decode(encoded, validate=True))
              report.append(f'decoded_length={len(decoded)}')
              script = Path('/tmp/apply-increment59-existing-only.py')
              script.write_bytes(decoded)
              result = subprocess.run(
                  ['python3', str(script)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  check=False,
              )
              report.append(f'patch_exit_status={result.returncode}')
              report.append(result.stdout)
          except Exception:
              report.append('diagnostic_exception:')
              report.append(traceback.format_exc())
          Path('.github/increment59-bootstrap-diagnostic.txt').write_text(
              '\n'.join(report) + '\n',
              encoding='utf-8',
          )
          PY
          rm -f .github/workflows/increment-59-bootstrap-diagnostic.yml
          git config user.name "MorphHDL Increment Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Record Increment 59 bootstrap diagnostic"
          git push origin HEAD:agent/increment-59-typed-blackbox-generics

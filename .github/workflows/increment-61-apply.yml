name: Increment 61 prepare exact implementation tree

on:
  push:
    branches: ['agent/increment-61-one-file-per-component']
    paths:
      - '.github/workflows/increment-61-apply.yml'
      - 'morphhdl/repair-61/payload.txt'

permissions:
  contents: read

concurrency:
  group: increment-61-prepare
  cancel-in-progress: true

jobs:
  prepare:
    if: github.repository == 'pysolvesemi/MorphHDL' && github.ref == 'refs/heads/agent/increment-61-one-file-per-component'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decode, apply and archive the exact-base Increment 61 source
        shell: bash
        run: |
          set -euo pipefail
          base=5a9294363c7b74ae584f1702160fe1f7e468f58a
          payload=morphhdl/repair-61/payload.txt
          output=target/increment-61-prepared
          tree="$output/tree"
          mkdir -p "$tree"
          git rev-parse HEAD > "$output/staging-head.txt"
          test "$(git merge-base HEAD "$base")" = "$base"
          test "$(sha256sum "$payload" | cut -d' ' -f1)" = f376af6a967226d77e2ea8cc173d77f188f0edb9dbdaea6803ce299272408e7a
          base64 -d "$payload" | xz -d > "$output/apply.py"
          test "$(sha256sum "$output/apply.py" | cut -d' ' -f1)" = 08b244e9a236c1ae35273452c897cc61502484efcacc7c4d17d2434930e3a8fa
          python3 -m py_compile "$output/apply.py"
          python3 "$output/apply.py" | tee "$output/apply.log"
          git diff --check
          files=(
            .github/workflows/increment-61-one-file-per-component.yml
            docs/morphhdl/increment-61-one-file-per-component.md
            docs/morphhdl/parameterized-verilog-todo.md
            morphhdl/src/main/scala/morphhdl/MorphPerComponentPublication.scala
            morphhdl/src/main/scala/morphhdl/MorphVerilog.scala
            morphhdl/src/main/scala/morphhdl/integration/ExternalSpinalVerilog.scala
            morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalEnumLocalizer.scala
            morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalParameterizedVerilog.scala
            morphhdl/src/test/scala/morphhdl/Increment61PerComponentPublicationTests.scala
          )
          for file in "${files[@]}"; do
            mkdir -p "$tree/$(dirname "$file")"
            cp "$file" "$tree/$file"
          done
          printf '%s\n' "${files[@]}" > "$output/files.txt"
          (cd "$tree" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$output/hashes.txt"
          git diff --binary -- "${files[@]}" > "$output/implementation.diff"

      - uses: actions/upload-artifact@v4
        with:
          name: increment-61-prepared-tree
          path: target/increment-61-prepared
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

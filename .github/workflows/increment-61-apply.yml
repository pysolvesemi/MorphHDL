name: Increment 61 publish prepared implementation source

on:
  push:
    branches: ['agent/increment-61-one-file-per-component']
    paths:
      - '.github/workflows/increment-61-apply.yml'
      - 'morphhdl/repair-61/payload.txt'

permissions:
  contents: write

concurrency:
  group: increment-61-source-publication
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'pysolvesemi/MorphHDL' && github.ref == 'refs/heads/agent/increment-61-one-file-per-component'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Decode and stage only non-workflow implementation source
        shell: bash
        run: |
          set -euo pipefail
          base=5a9294363c7b74ae584f1702160fe1f7e468f58a
          payload=morphhdl/repair-61/payload.txt
          output=target/increment-61-source-publication
          mkdir -p "$output"
          git rev-parse HEAD > "$output/staging-head.txt"
          test "$(git merge-base HEAD "$base")" = "$base"
          test "$(sha256sum "$payload" | cut -d' ' -f1)" = f376af6a967226d77e2ea8cc173d77f188f0edb9dbdaea6803ce299272408e7a
          base64 -d "$payload" | xz -d > "$output/apply.py"
          test "$(sha256sum "$output/apply.py" | cut -d' ' -f1)" = 08b244e9a236c1ae35273452c897cc61502484efcacc7c4d17d2434930e3a8fa
          python3 -m py_compile "$output/apply.py"
          python3 "$output/apply.py" | tee "$output/apply.log"

          # One canonical definition must have one formal declaration schema.
          # Keep distinct parent actual names while using the same legal default.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('morphhdl/src/test/scala/morphhdl/Increment61PerComponentPublicationTests.scala')
          text = path.read_text()
          old_default = 'HdlInt.param("RIGHT_WIDTH", default = 9, min = 1, max = 64)'
          old_header = 'parameter integer RIGHT_WIDTH = 9'
          if text.count(old_default) != 1 or text.count(old_header) != 1:
              raise SystemExit('Increment 61 canonical-child fixture patch precondition failed')
          path.write_text(text.replace(old_default, 'HdlInt.param("RIGHT_WIDTH", default = 5, min = 1, max = 64)').replace(old_header, 'parameter integer RIGHT_WIDTH = 5'))
          PY

          rm -f .github/workflows/increment-61-one-file-per-component.yml
          files=(
            docs/morphhdl/increment-61-one-file-per-component.md
            docs/morphhdl/parameterized-verilog-todo.md
            morphhdl/src/main/scala/morphhdl/MorphPerComponentPublication.scala
            morphhdl/src/main/scala/morphhdl/MorphVerilog.scala
            morphhdl/src/main/scala/morphhdl/integration/ExternalSpinalVerilog.scala
            morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalEnumLocalizer.scala
            morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalParameterizedVerilog.scala
            morphhdl/src/test/scala/morphhdl/Increment61PerComponentPublicationTests.scala
          )
          git add -- "${files[@]}"
          git diff --cached --check
          git diff --cached --name-only | sort > "$output/changed-files.txt"
          printf '%s\n' "${files[@]}" | sort > "$output/expected-files.txt"
          cmp "$output/expected-files.txt" "$output/changed-files.txt"
          git diff --cached --binary > "$output/implementation.diff"

      - name: Commit and publish source without modifying workflow files
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-source-publication
          original=$(cat "$output/staging-head.txt")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m '61: implement parameterized per-component publication' \
            -m 'Use native canonical component boundaries to rewrite and safely publish one strict Verilog-2001 file per logical definition. Preserve consolidated mode, named parameter bindings, enum ownership, external BlackBox ownership, deterministic source manifests and guarded stale-file cleanup. Remove the unnecessary 59i prerequisite while requiring later 59i qualification in both publication modes. Increment 61 remains unchecked pending complete CI, equivalence, mutation and inherited closure.'
          remote=$(git ls-remote origin refs/heads/agent/increment-61-one-file-per-component | cut -f1)
          test "$remote" = "$original"
          git push origin HEAD:refs/heads/agent/increment-61-one-file-per-component
          git rev-parse HEAD > "$output/head.txt"
          git rev-parse 'HEAD^{tree}' > "$output/tree.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-61-source-publication
          path: target/increment-61-source-publication
          if-no-files-found: error
          retention-days: 14

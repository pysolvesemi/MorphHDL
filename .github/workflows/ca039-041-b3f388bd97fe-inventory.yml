name: CA-039 through CA-041 exact-candidate targeted dispatcher
on:
  push:
    branches: [control/ca039-041-b3f388bd97fe-inventory]
    paths:
      - .github/workflows/ca039-041-b3f388bd97fe-inventory.yml
      - .github/controllers/ca039-041-b3f388bd97fe-inventory/dispatch.py
      - .github/controllers/ca039-041-b3f388bd97fe-inventory/dispatch.json
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact identities and dispatch affected workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/controllers/ca039-041-b3f388bd97fe-inventory/dispatch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ca039-041-b3f388bd97fe-inventory-ledger
          path: dispatch-ledger.jsonl
          if-no-files-found: error

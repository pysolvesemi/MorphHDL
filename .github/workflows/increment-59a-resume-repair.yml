name: Increment 59a structural repair checkpoint
on:
  push:
    branches: [agent/increment-59a-recursive-verilog-module]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Resume 59a exact structural self-reference capture and validation'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-59a-recursive-verilog-module
          fetch-depth: 0
      - name: Apply reviewed exact-identity repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          def replace(path, old, new):
              p=Path(path)
              text=p.read_text()
              assert text.count(old)==1, (path,old,text.count(old))
              p.write_text(text.replace(old,new,1))
          runtime='morphruntime/src/main/scala/spinal/core/ParameterizedStructure.scala'
          old='      children.collectFirst { case value: BlackBox => value }.foreach { value =>\n        fail(\n          "SPINAL-PARAMETERIZED-VERILOG-STRUCTURAL-BLACKBOX-UNSUPPORTED",\n          s"structural body instantiated BlackBox \'${value.getName()}\'; Increment 33 covers ordinary Component instances",\n          sourceLocation\n        )\n      }'
          new=dedent('''\
                children.collect { case value: BlackBox => value }.foreach { value =>
                  // A same-name reference is an explicit Verilog module identity,
                  // not a second implementation. Retain its exact child object for
                  // mandatory final-owner termination and interface validation.
                  val typedSelfReference =
                    ownerRoot.nonEmpty && !component.isInstanceOf[BlackBox] &&
                      (value.parent eq component) && value.isBlackBox &&
                      Option(component.definitionName).exists(_.nonEmpty) &&
                      value.definitionName == component.definitionName &&
                      value.impl == null && value.listRTLPath.isEmpty &&
                      value.children.isEmpty &&
                      ParameterizedBlackBoxGenericRegistry.recordsOf(value).exists {
                        case binding: ParameterizedBlackBoxIntegerGeneric =>
                          binding.parameters.nonEmpty
                        case _ => false
                      }
                  if (!typedSelfReference)
                    fail(
                      "SPINAL-PARAMETERIZED-VERILOG-STRUCTURAL-BLACKBOX-UNSUPPORTED",
                      s"structural body instantiated unsupported BlackBox '${value.getName()}'; only typed direct self-references without separate RTL may be captured",
                      sourceLocation
                    )
                }
          ''').rstrip()
          new='\n'.join('      '+line if line else '' for line in new.splitlines())
          replace(runtime,old,new)
          publication='morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalParameterizedVerilog.scala'
          replace(publication,'    BoundedRecursiveModuleValidation.validate(components)', '    val recursiveReferences = BoundedRecursiveModuleValidation.validate(components)')
          replace(publication,'    val canonicalByIdentity = new IdentityHashMap[Component, Component]()', '    val canonicalByIdentity = new IdentityHashMap[Component, Component]()\n    // Validated self-references participate in exact instance relocation, but\n    // never in the emitted module inventory or native definition deduplication.\n    recursiveReferences.foreach(reference => canonicalByIdentity.put(reference, reference))')
          replace(publication,'  private def componentParameters(', '  private[internals] def componentParameters(')
          scope=Path('morphhdl/contracts/increment-59a-source-scope.txt')
          scope.write_text('\n'.join(sorted(set(scope.read_text().splitlines()+[runtime])))+'\n')
          check='morphhdl/scripts/check-increment-59a-recursive-module.py'
          replace(check,'    "morphhdl/src/test/scala/nativeapplication/BoundedRecursivePowerFixture.scala",\n)', '    "morphhdl/src/test/scala/nativeapplication/BoundedRecursivePowerFixture.scala",\n    "'+runtime+'",\n)')
          Path('.github/workflows/increment-59a-resume-probe.yml').unlink()
          Path('.github/workflows/increment-59a-resume-repair.yml').unlink()
          PY
          git diff --check
          python3 morphhdl/scripts/check-increment-59a-recursive-module.py --self-test --repo-root .
          git diff --stat
      - name: Commit repair checkpoint without changing roadmap status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MorphHDL Increment Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add morphruntime/src/main/scala/spinal/core/ParameterizedStructure.scala morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalParameterizedVerilog.scala morphhdl/contracts/increment-59a-source-scope.txt morphhdl/scripts/check-increment-59a-recursive-module.py .github/workflows/increment-59a-resume-probe.yml .github/workflows/increment-59a-resume-repair.yml
          git commit -m 'Retain exact typed recursive references through structural publication'
          git push origin HEAD:agent/increment-59a-recursive-verilog-module
      - name: Compile and exercise recursive generation
        shell: bash
        run: |
          set -euo pipefail
          sbt -batch '++2.13.12' 'morph/testOnly morphhdl.BoundedRecursivePowerTests'
      - name: Generate candidate and inspect emitted self-reference
        shell: bash
        run: |
          set -euo pipefail
          sbt -batch '++2.13.12' "morph/Test/runMain morphhdl.BoundedRecursivePowerArtifactWriter --output-dir ${GITHUB_WORKSPACE}/recursive-artifacts"
          cat recursive-artifacts/bounded_recursive_power.v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-59a-repair-artifacts
          path: recursive-artifacts
          if-no-files-found: ignore

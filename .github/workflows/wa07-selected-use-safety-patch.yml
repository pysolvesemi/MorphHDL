name: WA-07 selected-use safety patch

on:
  push:
    branches:
      - agent/wa-07-unified-expression-inlining
    paths:
      - ".github/workflows/wa07-selected-use-safety-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wa07-selected-use-safety-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - name: Check out WA-07 branch
        uses: actions/checkout@v4
        with:
          ref: agent/wa-07-unified-expression-inlining
          fetch-depth: 0

      - name: Apply selected-use safety hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import hashlib
          import json

          root = Path.cwd()

          def read(relative: str) -> str:
              return (root / relative).read_text(encoding="utf-8")

          def write(relative: str, text: str) -> None:
              (root / relative).write_text(text, encoding="utf-8")

          def replace_once(relative: str, old: str, new: str) -> None:
              text = read(relative)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{relative}: expected one replacement point, observed {count}: {old[:100]!r}"
                  )
              write(relative, text.replace(old, new, 1))

          source_path = (
              "morphhdl-passes/src/main/scala/morphhdl/passes/transform/"
              "UnnamedWireExpressionEliminationPass.scala"
          )
          source = read(source_path)
          source = source.replace(
              "import morphhdl.ir.v1.IrDiagnostic\nimport morphhdl.ir.v1.ModuleId",
              "import morphhdl.ir.v1.IrDiagnostic\nimport morphhdl.ir.v1.IntExpr\nimport morphhdl.ir.v1.ModuleId",
              1,
          )
          source = source.replace(
              '  val ReceiverTarget = "WA07-RECEIVER-TARGET"\n',
              '  val ReceiverTarget = "WA07-RECEIVER-TARGET"\n'
              '  val ReceiverPartialSelect = "WA07-RECEIVER-PARTIAL-SELECT"\n',
              1,
          )
          source = source.replace(
              "  * A candidate is retained when either its own assignment or any receiver is\n"
              "  * procedural. Canonical `DriverKind.Procedural` represents assignments inside\n"
              "  * `always` blocks, so this pass never rewrites an `always` assignment.\n",
              "  * A candidate is retained when either its own assignment or any receiver is\n"
              "  * procedural. Canonical `DriverKind.Procedural` represents assignments inside\n"
              "  * `always` blocks, so this pass never rewrites an `always` assignment. A\n"
              "  * receiver selection is accepted only when it is the complete temporary or a\n"
              "  * literal in-range subrange that can be composed with a direct source\n"
              "  * part-select. General-expression, nested and dynamic selected uses fail closed.\n",
              1,
          )
          selection_assessment = dedent(
              '''
                  driver.foreach { sourceDriver =>
                    alias.packedType.foreach { packedType =>
                      receiverDrivers.foreach { receiver =>
                        violations ++= receiverSelectionViolations(
                          receiver.value,
                          alias.id,
                          sourceDriver.value,
                          packedType,
                          receiver.id
                        )
                      }
                    }
                  }

              '''
          )
          assessment_marker = (
              "    driver.foreach { value =>\n"
              "      val sourceReferences = value.value.referenceOccurrences\n"
          )
          if assessment_marker not in source:
              raise SystemExit("canonical source-reference assessment marker is missing")
          source = source.replace(
              assessment_marker,
              selection_assessment + assessment_marker,
              1,
          )

          helpers = dedent(
              '''
                private def receiverSelectionViolations(
                    expression: RtlExpr,
                    aliasSymbol: SymbolId,
                    replacement: RtlExpr,
                    packedType: PackedType,
                    receiverId: DriverId
                ): Vector[Violation] = {
                  val failures = ArrayBuffer.empty[Violation]

                  def reject(detail: String): Unit =
                    failures += violation(
                      UnnamedWireExpressionSafetyReason.ReceiverPartialSelect,
                      s"receiver '${receiverId.value}' $detail; retaining temporary '${aliasSymbol.value}' avoids an illegal nested or general-expression select in Verilog-2001"
                    )

                  def inspect(value: RtlExpr): Unit = value match {
                    case RtlExpr.Ref(_, target, _, _) if target == aliasSymbol =>
                    case _: RtlExpr.Ref =>
                    case _: RtlExpr.Literal =>
                    case RtlExpr.Unary(_, operand) => inspect(operand)
                    case RtlExpr.Binary(_, left, right) =>
                      inspect(left)
                      inspect(right)
                    case RtlExpr.Mux(condition, whenTrue, whenFalse) =>
                      inspect(condition)
                      inspect(whenTrue)
                      inspect(whenFalse)
                    case RtlExpr.Concat(values) => values.foreach(inspect)
                    case RtlExpr.BitSelect(base, index) =>
                      base match {
                        case reference: RtlExpr.Ref if reference.target == aliasSymbol =>
                          if (!isWholeObjectBitSelect(index, packedType)) {
                            reject(
                              "selects one bit from a multi-bit or non-zero-index temporary"
                            )
                          }
                        case other if referencesAlias(other, aliasSymbol) =>
                          reject(
                            "selects through a non-direct expression containing the temporary"
                          )
                        case other => inspect(other)
                      }
                      inspect(index)
                    case RtlExpr.PartSelect(base, offset, width) =>
                      base match {
                        case reference: RtlExpr.Ref if reference.target == aliasSymbol =>
                          if (
                            !isWholeObjectPartSelect(offset, width, packedType) &&
                            !canComposePartSelect(replacement, offset, width, packedType)
                          ) {
                            reject(
                              "uses a partial or dynamic range of the temporary with a non-composable right-hand side"
                            )
                          }
                        case other if referencesAlias(other, aliasSymbol) =>
                          reject(
                            "selects through a non-direct expression containing the temporary"
                          )
                        case other => inspect(other)
                      }
                    case RtlExpr.Resize(value, _, _) => inspect(value)
                    case RtlExpr.Cast(value, _) => inspect(value)
                  }

                  inspect(expression)
                  failures.toVector.distinct.sortBy(value => (value.code, value.message))
                }

                private def referencesAlias(
                    expression: RtlExpr,
                    aliasSymbol: SymbolId
                ): Boolean =
                  expression.referenceOccurrences.exists(_.target == aliasSymbol)

                private def isWholeObjectPartSelect(
                    offset: IntExpr,
                    width: IntExpr,
                    packedType: PackedType
                ): Boolean =
                  offset == IntExpr.Literal(BigInt(0)) && width == packedType.width

                private def isWholeObjectBitSelect(
                    index: RtlExpr,
                    packedType: PackedType
                ): Boolean =
                  packedType.width == IntExpr.Literal(BigInt(1)) && (index match {
                    case RtlExpr.Literal(value, _, _) => value == 0
                    case _                           => false
                  })

                private def canComposePartSelect(
                    replacement: RtlExpr,
                    receiverOffset: IntExpr,
                    receiverWidth: IntExpr,
                    packedType: PackedType
                ): Boolean = replacement match {
                  case RtlExpr.PartSelect(_: RtlExpr.Ref, _, sourceWidth) =>
                    sourceWidth == packedType.width &&
                    literalRangeWithin(
                      receiverOffset,
                      receiverWidth,
                      packedType.width
                    )
                  case _ => false
                }

                private def literalRangeWithin(
                    offset: IntExpr,
                    width: IntExpr,
                    totalWidth: IntExpr
                ): Boolean =
                  (literalInt(offset), literalInt(width), literalInt(totalWidth)) match {
                    case (Some(lower), Some(size), Some(total)) =>
                      lower >= 0 && size >= 1 && lower + size <= total
                    case _ => false
                  }

                private def literalInt(value: IntExpr): Option[BigInt] = value match {
                  case IntExpr.Literal(resolved) => Some(resolved)
                  case _                         => None
                }

                private def addOffsets(left: IntExpr, right: IntExpr): IntExpr =
                  (left, right) match {
                    case (IntExpr.Literal(a), IntExpr.Literal(b)) =>
                      IntExpr.Literal(a + b)
                    case (IntExpr.Literal(value), other) if value == 0 => other
                    case (other, IntExpr.Literal(value)) if value == 0 => other
                    case _ => IntExpr.Add(left, right)
                  }

                private def fencedReplacement(
                    replacement: RtlExpr,
                    receiver: RtlExpr.Ref,
                    aliasSymbol: SymbolId,
                    width: IntExpr,
                    signedness: morphhdl.ir.v1.Signedness
                ): RtlExpr =
                  RtlExpr.Resize(
                    cloneForReceiver(replacement, receiver, aliasSymbol),
                    width,
                    signedness
                  )

                private def composedPartSelect(
                    replacement: RtlExpr,
                    receiver: RtlExpr.Ref,
                    aliasSymbol: SymbolId,
                    receiverOffset: IntExpr,
                    receiverWidth: IntExpr,
                    packedType: PackedType
                ): Option[RtlExpr] = replacement match {
                  case RtlExpr.PartSelect(source: RtlExpr.Ref, sourceOffset, sourceWidth)
                      if sourceWidth == packedType.width &&
                        literalRangeWithin(
                          receiverOffset,
                          receiverWidth,
                          packedType.width
                        ) =>
                    Some(
                      RtlExpr.Resize(
                        RtlExpr.PartSelect(
                          cloneForReceiver(source, receiver, aliasSymbol),
                          addOffsets(sourceOffset, receiverOffset),
                          receiverWidth
                        ),
                        receiverWidth,
                        packedType.signedness
                      )
                    )
                  case _ => None
                }

              '''
          )
          rewrite_marker = "  private def rewriteOneExpression(\n"
          if rewrite_marker not in source:
              raise SystemExit("rewrite insertion point is missing")
          source = source.replace(rewrite_marker, helpers + rewrite_marker, 1)

          inline_start = source.index("  private def inlineReferences(\n")
          inline_end = source.index("  private def cloneForReceiver(\n", inline_start)
          inline = dedent(
              '''
                private def inlineReferences(
                    expression: RtlExpr,
                    aliasSymbol: SymbolId,
                    replacement: RtlExpr,
                    packedType: PackedType
                ): RtlExpr = expression match {
                  case RtlExpr.PartSelect(
                        receiver @ RtlExpr.Ref(_, target, _, _),
                        offset,
                        width
                      ) if target == aliasSymbol =>
                    if (isWholeObjectPartSelect(offset, width, packedType)) {
                      fencedReplacement(
                        replacement,
                        receiver,
                        aliasSymbol,
                        packedType.width,
                        packedType.signedness
                      )
                    } else {
                      composedPartSelect(
                        replacement,
                        receiver,
                        aliasSymbol,
                        offset,
                        width,
                        packedType
                      ).getOrElse(expression)
                    }
                  case RtlExpr.BitSelect(
                        receiver @ RtlExpr.Ref(_, target, _, _),
                        index
                      ) if target == aliasSymbol =>
                    if (isWholeObjectBitSelect(index, packedType)) {
                      fencedReplacement(
                        replacement,
                        receiver,
                        aliasSymbol,
                        packedType.width,
                        packedType.signedness
                      )
                    } else expression
                  case receiver @ RtlExpr.Ref(_, target, _, _) if target == aliasSymbol =>
                    fencedReplacement(
                      replacement,
                      receiver,
                      aliasSymbol,
                      packedType.width,
                      packedType.signedness
                    )
                  case value: RtlExpr.Ref => value
                  case value: RtlExpr.Literal => value
                  case RtlExpr.Unary(operator, value) =>
                    RtlExpr.Unary(
                      operator,
                      inlineReferences(value, aliasSymbol, replacement, packedType)
                    )
                  case RtlExpr.Binary(operator, left, right) =>
                    RtlExpr.Binary(
                      operator,
                      inlineReferences(left, aliasSymbol, replacement, packedType),
                      inlineReferences(right, aliasSymbol, replacement, packedType)
                    )
                  case RtlExpr.Mux(condition, whenTrue, whenFalse) =>
                    RtlExpr.Mux(
                      inlineReferences(condition, aliasSymbol, replacement, packedType),
                      inlineReferences(whenTrue, aliasSymbol, replacement, packedType),
                      inlineReferences(whenFalse, aliasSymbol, replacement, packedType)
                    )
                  case RtlExpr.Concat(values) =>
                    RtlExpr.Concat(
                      values.map(value =>
                        inlineReferences(value, aliasSymbol, replacement, packedType)
                      )
                    )
                  case RtlExpr.BitSelect(value, index) =>
                    val rewrittenValue =
                      if (referencesAlias(value, aliasSymbol)) value
                      else inlineReferences(value, aliasSymbol, replacement, packedType)
                    RtlExpr.BitSelect(
                      rewrittenValue,
                      inlineReferences(index, aliasSymbol, replacement, packedType)
                    )
                  case RtlExpr.PartSelect(value, offset, width) =>
                    val rewrittenValue =
                      if (referencesAlias(value, aliasSymbol)) value
                      else inlineReferences(value, aliasSymbol, replacement, packedType)
                    RtlExpr.PartSelect(rewrittenValue, offset, width)
                  case RtlExpr.Resize(value, width, signedness) =>
                    RtlExpr.Resize(
                      inlineReferences(value, aliasSymbol, replacement, packedType),
                      width,
                      signedness
                    )
                  case RtlExpr.Cast(value, signedness) =>
                    RtlExpr.Cast(
                      inlineReferences(value, aliasSymbol, replacement, packedType),
                      signedness
                    )
                }

              '''
          )
          source = source[:inline_start] + inline + source[inline_end:]
          write(source_path, source)

          selection_spec_path = (
              "morphhdl-passes/src/test/scala/morphhdl/passes/transform/"
              "UnnamedWireExpressionSelectionSafetySpec.scala"
          )
          selection_spec = dedent(
              '''
              package morphhdl.passes.transform

              import morphhdl.ir.v1.CanonicalIrSchema
              import morphhdl.ir.v1.Declaration
              import morphhdl.ir.v1.DeclarationKind
              import morphhdl.ir.v1.Design
              import morphhdl.ir.v1.Driver
              import morphhdl.ir.v1.DriverCoverage
              import morphhdl.ir.v1.DriverId
              import morphhdl.ir.v1.DriverKind
              import morphhdl.ir.v1.IntExpr
              import morphhdl.ir.v1.Module
              import morphhdl.ir.v1.ModuleId
              import morphhdl.ir.v1.NameOrigin
              import morphhdl.ir.v1.Observability
              import morphhdl.ir.v1.PackedType
              import morphhdl.ir.v1.PackedValueSemantics
              import morphhdl.ir.v1.PortDirection
              import morphhdl.ir.v1.ReferenceId
              import morphhdl.ir.v1.RtlBinaryOperator
              import morphhdl.ir.v1.RtlExpr
              import morphhdl.ir.v1.Scope
              import morphhdl.ir.v1.ScopeId
              import morphhdl.ir.v1.ScopeKind
              import morphhdl.ir.v1.Signedness
              import morphhdl.ir.v1.SymbolId
              import morphhdl.passes.api.PassExecutionStatus
              import morphhdl.passes.api.WireAliasPassConfiguration
              import org.scalatest.funsuite.AnyFunSuite
              import org.scalatest.matchers.should.Matchers

              final class UnnamedWireExpressionSelectionSafetySpec
                  extends AnyFunSuite
                  with Matchers {
                private val moduleId = ModuleId.unsafe("module.expression-selection")
                private val scopeId = ScopeId.unsafe("scope.expression-selection")
                private val sourceA = SymbolId.unsafe("symbol.expression-selection-a")
                private val sourceB = SymbolId.unsafe("symbol.expression-selection-b")
                private val alias = SymbolId.unsafe("symbol.expression-selection-alias")
                private val sink = SymbolId.unsafe("symbol.expression-selection-sink")
                private val aliasDriver = DriverId.unsafe("driver.expression-selection-alias")
                private val sinkDriver = DriverId.unsafe("driver.expression-selection-sink")
                private val enabled = WireAliasPassConfiguration(enabled = true)

                private def bits(width: Int): PackedType =
                  PackedType(
                    width = IntExpr.Literal(BigInt(width)),
                    signedness = Signedness.Unsigned,
                    valueSemantics = PackedValueSemantics.BitVector
                  )

                private def declaration(
                    id: SymbolId,
                    kind: DeclarationKind,
                    width: Int,
                    origin: NameOrigin,
                    visible: Boolean = false
                ): Declaration =
                  Declaration(
                    id = id,
                    owner = scopeId,
                    kind = kind,
                    packedType = Some(bits(width)),
                    nameOrigin = origin,
                    sourceLocation = None,
                    observability = Observability(
                      complete = true,
                      externallyVisible = visible
                    )
                  )

                private def reference(name: String, target: SymbolId): RtlExpr.Ref =
                  RtlExpr.Ref(
                    id = ReferenceId.unsafe(s"reference.expression-selection.$name"),
                    target = target,
                    owner = scopeId
                  )

                private def design(
                    sourceWidth: Int,
                    aliasWidth: Int,
                    sinkWidth: Int,
                    rhs: RtlExpr,
                    receiver: RtlExpr
                ): Design =
                  Design(
                    version = CanonicalIrSchema.schemaVersion,
                    stage = CanonicalIrSchema.stage,
                    top = moduleId,
                    modules = Vector(
                      Module(
                        id = moduleId,
                        logicalName = "GenericSelectionSafetyFixture",
                        parameters = Vector.empty,
                        scopes = Vector(
                          Scope(
                            id = scopeId,
                            parent = None,
                            kind = ScopeKind.Module
                          )
                        ),
                        generateIndices = Vector.empty,
                        declarations = Vector(
                          declaration(
                            sourceA,
                            DeclarationKind.Port(PortDirection.Input),
                            sourceWidth,
                            NameOrigin.Explicit("sourceA"),
                            visible = true
                          ),
                          declaration(
                            sourceB,
                            DeclarationKind.Port(PortDirection.Input),
                            sourceWidth,
                            NameOrigin.Explicit("sourceB"),
                            visible = true
                          ),
                          declaration(
                            alias,
                            DeclarationKind.InternalCombinational,
                            aliasWidth,
                            NameOrigin.Unnamed
                          ),
                          declaration(
                            sink,
                            DeclarationKind.Port(PortDirection.Output),
                            sinkWidth,
                            NameOrigin.Explicit("sink"),
                            visible = true
                          )
                        ),
                        drivers = Vector(
                          Driver(
                            id = aliasDriver,
                            owner = scopeId,
                            target = alias,
                            kind = DriverKind.Continuous,
                            coverage = DriverCoverage.FullObject,
                            value = rhs
                          ),
                          Driver(
                            id = sinkDriver,
                            owner = scopeId,
                            target = sink,
                            kind = DriverKind.Continuous,
                            coverage = DriverCoverage.FullObject,
                            value = receiver
                          )
                        )
                      )
                    )
                  )

                private def add(width: Int): RtlExpr =
                  RtlExpr.Binary(
                    RtlBinaryOperator.Add,
                    reference(s"rhs-add-a-$width", sourceA),
                    reference(s"rhs-add-b-$width", sourceB)
                  )

                private def outputDriver(result: Design): Driver =
                  result.modules.head.drivers.find(_.id == sinkDriver).get

                test("partial select of an arithmetic RHS retains the unnamed temporary") {
                  val input = design(
                    sourceWidth = 8,
                    aliasWidth = 8,
                    sinkWidth = 4,
                    rhs = add(8),
                    receiver = RtlExpr.PartSelect(
                      reference("receiver-arithmetic-part", alias),
                      IntExpr.Literal(BigInt(0)),
                      IntExpr.Literal(BigInt(4))
                    )
                  )

                  val result = UnnamedWireExpressionEliminationPass.run(input, enabled)

                  result.status shouldBe PassExecutionStatus.Unchanged
                  result.output shouldBe input.normalized
                  result.output.modules.head.declarations.map(_.id) should contain(alias)
                  result.eliminationReport.rejected.map(_.reasonCode) should contain(
                    UnnamedWireExpressionSafetyReason.ReceiverPartialSelect
                  )
                }

                test("partial select through a direct source part-select is composed without nested selects") {
                  val input = design(
                    sourceWidth = 16,
                    aliasWidth = 8,
                    sinkWidth = 4,
                    rhs = RtlExpr.PartSelect(
                      reference("rhs-source-part", sourceA),
                      IntExpr.Literal(BigInt(2)),
                      IntExpr.Literal(BigInt(8))
                    ),
                    receiver = RtlExpr.PartSelect(
                      reference("receiver-composed-part", alias),
                      IntExpr.Literal(BigInt(1)),
                      IntExpr.Literal(BigInt(4))
                    )
                  )

                  val result = UnnamedWireExpressionEliminationPass.run(input, enabled)

                  result.status shouldBe PassExecutionStatus.Changed
                  result.output.modules.head.declarations.map(_.id) should not contain alias
                  outputDriver(result.output).value match {
                    case RtlExpr.Resize(
                          RtlExpr.PartSelect(
                            source: RtlExpr.Ref,
                            IntExpr.Literal(offset),
                            IntExpr.Literal(width)
                          ),
                          IntExpr.Literal(fenceWidth),
                          Signedness.Unsigned
                        ) =>
                      source.target shouldBe sourceA
                      source.id.value should include("wa07-inline")
                      offset shouldBe BigInt(3)
                      width shouldBe BigInt(4)
                      fenceWidth shouldBe BigInt(4)
                    case other =>
                      fail(s"expected one composed source part-select, observed $other")
                  }
                }

                test("full-width receiver select is simplified before arithmetic inlining") {
                  val input = design(
                    sourceWidth = 4,
                    aliasWidth = 4,
                    sinkWidth = 4,
                    rhs = add(4),
                    receiver = RtlExpr.PartSelect(
                      reference("receiver-full-part", alias),
                      IntExpr.Literal(BigInt(0)),
                      IntExpr.Literal(BigInt(4))
                    )
                  )

                  val result = UnnamedWireExpressionEliminationPass.run(input, enabled)

                  result.status shouldBe PassExecutionStatus.Changed
                  outputDriver(result.output).value match {
                    case RtlExpr.Resize(
                          expression: RtlExpr.Binary,
                          IntExpr.Literal(width),
                          Signedness.Unsigned
                        ) =>
                      expression.operator shouldBe RtlBinaryOperator.Add
                      width shouldBe BigInt(4)
                    case other =>
                      fail(s"expected a whole-object arithmetic replacement, observed $other")
                  }
                }

                test("bit select of a multi-bit arithmetic temporary is retained") {
                  val input = design(
                    sourceWidth = 8,
                    aliasWidth = 8,
                    sinkWidth = 1,
                    rhs = add(8),
                    receiver = RtlExpr.BitSelect(
                      reference("receiver-partial-bit", alias),
                      RtlExpr.Literal(BigInt(0), 3)
                    )
                  )

                  val result = UnnamedWireExpressionEliminationPass.run(input, enabled)

                  result.status shouldBe PassExecutionStatus.Unchanged
                  result.eliminationReport.rejected.map(_.reasonCode) should contain(
                    UnnamedWireExpressionSafetyReason.ReceiverPartialSelect
                  )
                }

                test("bit zero of a one-bit temporary is simplified as a whole-object use") {
                  val input = design(
                    sourceWidth = 1,
                    aliasWidth = 1,
                    sinkWidth = 1,
                    rhs = RtlExpr.Binary(
                      RtlBinaryOperator.BitwiseXor,
                      reference("rhs-one-bit-a", sourceA),
                      reference("rhs-one-bit-b", sourceB)
                    ),
                    receiver = RtlExpr.BitSelect(
                      reference("receiver-full-bit", alias),
                      RtlExpr.Literal(BigInt(0), 1)
                    )
                  )

                  val result = UnnamedWireExpressionEliminationPass.run(input, enabled)

                  result.status shouldBe PassExecutionStatus.Changed
                  outputDriver(result.output).value match {
                    case RtlExpr.Resize(
                          _: RtlExpr.Binary,
                          IntExpr.Literal(width),
                          Signedness.Unsigned
                        ) => width shouldBe BigInt(1)
                    case other =>
                      fail(s"expected a one-bit whole-object replacement, observed $other")
                  }
                }

                test("selection through a non-direct alias expression fails closed") {
                  val input = design(
                    sourceWidth = 8,
                    aliasWidth = 8,
                    sinkWidth = 4,
                    rhs = add(8),
                    receiver = RtlExpr.PartSelect(
                      RtlExpr.Cast(
                        reference("receiver-cast-part", alias),
                        Signedness.Unsigned
                      ),
                      IntExpr.Literal(BigInt(0)),
                      IntExpr.Literal(BigInt(4))
                    )
                  )

                  val result = UnnamedWireExpressionEliminationPass.run(input, enabled)

                  result.status shouldBe PassExecutionStatus.Unchanged
                  result.eliminationReport.rejected.map(_.reasonCode) should contain(
                    UnnamedWireExpressionSafetyReason.ReceiverPartialSelect
                  )
                }
              }
              '''
          ).lstrip()
          write(selection_spec_path, selection_spec)

          native_path = "morphhdl-passes/examples/UnnamedWireExpressionNativeBridge.scala"
          native = read(native_path)
          native = native.replace(
              "    else if (candidate.useStatements.isEmpty)\n"
              "      Left(\"WA07-NATIVE-NO-RECEIVER\")\n"
              "    else if (!candidate.useStatements.forall(allowedUse(candidate.component, alias, _)))\n",
              "    else if (candidate.useStatements.isEmpty)\n"
              "      Left(\"WA07-NATIVE-NO-RECEIVER\")\n"
              "    else if (candidate.useStatements.exists(selectedAliasUse(_, alias)))\n"
              "      Left(\"WA07-NATIVE-SELECTED-RECEIVER\")\n"
              "    else if (!candidate.useStatements.forall(allowedUse(candidate.component, alias, _)))\n",
              1,
          )
          native_helper_marker = "  private def allowedUse(\n"
          native_helpers = dedent(
              '''
                private def selectedAliasUse(
                    statement: Statement,
                    alias: BaseType
                ): Boolean = {
                  var selected = false
                  statement.walkDrivingExpressions {
                    case access: SubAccess
                        if expressionReferences(access.getBitVector, alias) =>
                      selected = true
                    case _ =>
                  }
                  selected
                }

                private def expressionReferences(
                    expression: Expression,
                    target: BaseType
                ): Boolean = {
                  if (expression == null) false
                  else if (expression eq target) true
                  else {
                    var found = false
                    expression.walkDrivingExpressions {
                      case value: BaseType if value eq target => found = true
                      case _                                  =>
                    }
                    found
                  }
                }

              '''
          )
          if native_helper_marker not in native:
              raise SystemExit("native selected-use helper insertion point is missing")
          native = native.replace(
              native_helper_marker,
              native_helpers + native_helper_marker,
              1,
          )
          native = native.replace(
              "  * tree, register process, or another Verilog `always` block is never rewritten.\n",
              "  * tree, register process, or another Verilog `always` block is never rewritten.\n"
              "  * Native selected uses also fail closed; selected-use composition is proved by\n"
              "  * the canonical IR tests rather than hidden by recursive native remapping.\n",
              1,
          )
          write(native_path, native)

          wa06_path = "morphhdl-passes/scripts/check-wa06-pipeline.py"
          wa06 = read(wa06_path)
          malformed = dedent(
              '''
                  if not wa06_checked or "**Status:** `COMPLETED`" not in wa06_body:
                      failures.append(f"{path}: WA06-STATUS: WA-06 must remain completed")
                  if wa07_checked:
                  if "**Status:** `COMPLETED`" not in wa07_body:
                      failures.append(f"{path}: WA06-SUCCESSOR: checked WA-07 must be COMPLETED")
                  if wa08_checked or "**Status:** `READY`" not in wa08_body:
                      failures.append(f"{path}: WA06-NEXT-STATUS: completed WA-07 requires open READY WA-08")
              else:
                  if "**Status:** `IN PROGRESS`" not in wa07_body:
                      failures.append(f"{path}: WA06-SUCCESSOR: open WA-07 must be IN PROGRESS")
                  if wa08_checked or "**Status:** `BLOCKED`" not in wa08_body:
                      failures.append(f"{path}: WA06-NEXT-STATUS: in-progress WA-07 requires open BLOCKED WA-08")
              '''
          )
          repaired = dedent(
              '''
                  if not wa06_checked or "**Status:** `COMPLETED`" not in wa06_body:
                      failures.append(f"{path}: WA06-STATUS: WA-06 must remain completed")
                  if wa07_checked:
                      if "**Status:** `COMPLETED`" not in wa07_body:
                          failures.append(
                              f"{path}: WA06-SUCCESSOR: checked WA-07 must be COMPLETED"
                          )
                      if wa08_checked or "**Status:** `READY`" not in wa08_body:
                          failures.append(
                              f"{path}: WA06-NEXT-STATUS: completed WA-07 requires open READY WA-08"
                          )
                  else:
                      if "**Status:** `IN PROGRESS`" not in wa07_body:
                          failures.append(
                              f"{path}: WA06-SUCCESSOR: open WA-07 must be IN PROGRESS"
                          )
                      if wa08_checked or "**Status:** `BLOCKED`" not in wa08_body:
                          failures.append(
                              f"{path}: WA06-NEXT-STATUS: in-progress WA-07 requires open BLOCKED WA-08"
                          )
              '''
          )
          if malformed not in wa06:
              raise SystemExit("malformed WA-06 successor-state block is missing")
          write(wa06_path, wa06.replace(malformed, repaired, 1))

          guard_path = "morphhdl-passes/scripts/check-wa07-expression-pass.py"
          guard = read(guard_path)
          guard = guard.replace(
              '    "DirectReferenceHandledElsewhere",\n',
              '    "DirectReferenceHandledElsewhere",\n'
              '    "ReceiverPartialSelect",\n'
              '    "receiverSelectionViolations",\n'
              '    "isWholeObjectPartSelect",\n'
              '    "composedPartSelect",\n'
              '    "literalRangeWithin",\n',
              1,
          )
          selection_markers = dedent(
              '''
              REQUIRED_SELECTION_TEST_MARKERS: tuple[str, ...] = (
                  "partial select of an arithmetic RHS retains the unnamed temporary",
                  "partial select through a direct source part-select is composed without nested selects",
                  "full-width receiver select is simplified before arithmetic inlining",
                  "bit select of a multi-bit arithmetic temporary is retained",
                  "bit zero of a one-bit temporary is simplified as a whole-object use",
                  "selection through a non-direct alias expression fails closed",
                  "ReceiverPartialSelect",
              )

              '''
          )
          pipeline_tuple_marker = "REQUIRED_PIPELINE_MARKERS: tuple[str, ...] = (\n"
          if pipeline_tuple_marker not in guard:
              raise SystemExit("WA-07 guard selection marker insertion point is missing")
          guard = guard.replace(
              pipeline_tuple_marker,
              selection_markers + pipeline_tuple_marker,
              1,
          )
          guard = guard.replace(
              '        "tests": pass_root / "src/test/scala/morphhdl/passes/transform/UnnamedWireExpressionEliminationPassSpec.scala",\n',
              '        "tests": pass_root / "src/test/scala/morphhdl/passes/transform/UnnamedWireExpressionEliminationPassSpec.scala",\n'
              '        "selection_tests": pass_root / "src/test/scala/morphhdl/passes/transform/UnnamedWireExpressionSelectionSafetySpec.scala",\n',
              1,
          )
          existing_test_check = dedent(
              '''
                  failures.extend(require_markers(
                      paths["tests"].relative_to(root), texts["tests"], REQUIRED_TEST_MARKERS,
                      "WA07-TEST-COVERAGE-MISSING",
                  ))
              '''
          )
          expanded_test_check = existing_test_check + dedent(
              '''
                  failures.extend(require_markers(
                      paths["selection_tests"].relative_to(root), texts["selection_tests"],
                      REQUIRED_SELECTION_TEST_MARKERS, "WA07-SELECTION-TEST-MISSING",
                  ))
              '''
          )
          if existing_test_check not in guard:
              raise SystemExit("WA-07 guard test marker block is missing")
          guard = guard.replace(existing_test_check, expanded_test_check, 1)
          guard = guard.replace(
              '            paths["tests"],\n            paths["pipeline_tests"],\n',
              '            paths["tests"],\n            paths["selection_tests"],\n            paths["pipeline_tests"],\n',
              1,
          )
          guard = guard.replace(
              '    "type fence",\n',
              '    "type fence",\n    "partial receiver select",\n',
              1,
          )
          guard = guard.replace(
              '        "explicit type fence",\n',
              '        "explicit type fence",\n        "partial receiver select",\n',
              1,
          )
          old_state = dedent(
              '''
                  if not wa07_checked:
                      failures.append(f"{path}: WA07-INCOMPLETE: implemented WA-07 must be checked")
                  elif "**Status:** `COMPLETED`" not in wa07_body:
                      failures.append(f"{path}: WA07-STATUS: checked WA-07 must be COMPLETED")
                  if wa08_checked:
                      failures.append(f"{path}: WA07-SCOPE: WA-07 must not complete WA-08")
                  if "**Status:** `READY`" not in wa08_body:
                      failures.append(f"{path}: WA07-NEXT-STATUS: WA-08 must be READY")
              '''
          )
          new_state = dedent(
              '''
                  if wa08_checked:
                      failures.append(f"{path}: WA07-SCOPE: WA-07 must not complete WA-08")
                  if wa07_checked:
                      if "**Status:** `COMPLETED`" not in wa07_body:
                          failures.append(
                              f"{path}: WA07-STATUS: checked WA-07 must be COMPLETED"
                          )
                      if "**Status:** `READY`" not in wa08_body:
                          failures.append(
                              f"{path}: WA07-NEXT-STATUS: completed WA-07 requires READY WA-08"
                          )
                  else:
                      if "**Status:** `IN PROGRESS`" not in wa07_body:
                          failures.append(
                              f"{path}: WA07-STATUS: open WA-07 must be IN PROGRESS"
                          )
                      if "**Status:** `BLOCKED`" not in wa08_body:
                          failures.append(
                              f"{path}: WA07-NEXT-STATUS: in-progress WA-07 requires BLOCKED WA-08"
                          )
              '''
          )
          if old_state not in guard:
              raise SystemExit("WA-07 guard roadmap-state block is missing")
          guard = guard.replace(old_state, new_state, 1)
          guard = guard.replace(
              "  pre-pass reference; 512.\n",
              "  pre-pass reference; partial receiver select; 512.\n",
              1,
          )
          old_self_test = dedent(
              '''
                  if roadmap_failures(Path("roadmap.md"), roadmap, pv):
                      raise AssertionError("valid WA-07 completion state was rejected")
                  if not roadmap_failures(
                      Path("roadmap.md"),
                      roadmap.replace("- [x] **WA-07", "- [ ] **WA-07"),
                      pv,
                  ):
                      raise AssertionError("unchecked implemented WA-07 was not rejected")
                  if not roadmap_failures(
                      Path("roadmap.md"),
                      roadmap.replace("**Status:** `READY`.", "**Status:** `BLOCKED` by WA-07."),
                      pv,
                  ):
                      raise AssertionError("blocked WA-08 after completed WA-07 was not rejected")
              '''
          )
          new_self_test = dedent(
              '''
                  if roadmap_failures(Path("roadmap.md"), roadmap, pv):
                      raise AssertionError("valid WA-07 completion state was rejected")
                  implementation = roadmap.replace(
                      "- [x] **WA-07 — Expressions**\\n\\n  **Status:** `COMPLETED`.",
                      "- [ ] **WA-07 — Expressions**\\n\\n  **Status:** `IN PROGRESS`.",
                  ).replace(
                      "**Status:** `READY`.",
                      "**Status:** `BLOCKED` by WA-07.",
                  )
                  if roadmap_failures(Path("roadmap.md"), implementation, pv):
                      raise AssertionError("valid WA-07 implementation state was rejected")
                  if not roadmap_failures(
                      Path("roadmap.md"),
                      roadmap.replace("**Status:** `READY`.", "**Status:** `BLOCKED` by WA-07."),
                      pv,
                  ):
                      raise AssertionError("blocked WA-08 after completed WA-07 was not rejected")
                  if not roadmap_failures(
                      Path("roadmap.md"),
                      implementation.replace(
                          "**Status:** `IN PROGRESS`.",
                          "**Status:** `COMPLETED`.",
                      ),
                      pv,
                  ):
                      raise AssertionError("unchecked completed WA-07 state was not rejected")
              '''
          )
          if old_self_test not in guard:
              raise SystemExit("WA-07 guard roadmap self-test block is missing")
          guard = guard.replace(old_self_test, new_self_test, 1)
          write(guard_path, guard)

          roadmap_path = "morphhdl-passes/morphhdl-ir-wire-assignment-passes-todo.md"
          roadmap = read(roadmap_path)
          roadmap_marker = (
              "  drivers, so assignments emitted in `always` blocks remain unchanged.\n\n"
          )
          roadmap_policy = (
              "  A full-width receiver select with zero offset is first collapsed to a\n"
              "  whole-object use. A partial receiver select is rewritten only when its\n"
              "  literal in-range offset and width can be composed with a direct source\n"
              "  part-select of the complete temporary width. Arithmetic, mux, cast,\n"
              "  resize, nested, dynamic and otherwise non-composable selected uses retain\n"
              "  the temporary, preventing invalid forms such as `(a + b)[3:0]` or\n"
              "  `source[7:0][3:0]` in strict Verilog-2001.\n\n"
          )
          if roadmap_marker not in roadmap:
              raise SystemExit("WA-07 roadmap selected-use insertion point is missing")
          roadmap = roadmap.replace(
              roadmap_marker,
              roadmap_marker + roadmap_policy,
              1,
          )
          write(roadmap_path, roadmap)

          readme_path = "morphhdl-passes/README.md"
          readme = read(readme_path)
          old_readme = (
              "Every source reference must resolve and be legally visible from every receiver.\n"
              "Every receiver must be a continuous driver. A procedural source assignment or\n"
              "any procedural receiver causes a fail-closed rejection, so no assignment in a\n"
              "Verilog `always` block is rewritten. At each accepted receiver the complete RHS\n"
              "is cloned with fresh reference identities and wrapped in the removed alias's\n"
              "packed width and signedness before the exact temporary declaration and its sole\n"
              "assignment are deleted.\n"
          )
          new_readme = (
              "Every source reference must resolve and be legally visible from every receiver.\n"
              "Every receiver must be a continuous driver. A procedural source assignment or\n"
              "any procedural receiver causes a fail-closed rejection, so no assignment in a\n"
              "Verilog `always` block is rewritten. At each accepted whole-object receiver the\n"
              "complete RHS is cloned with fresh reference identities and wrapped in the\n"
              "removed alias's packed width and signedness before the exact temporary\n"
              "declaration and its sole assignment are deleted.\n\n"
              "Selected uses are not replaced blindly. A zero-offset full-width select is\n"
              "collapsed to a whole-object receiver. A partial receiver select is composed only\n"
              "when the RHS is a direct source part-select of the complete alias width and the\n"
              "receiver offset and width are literal, in range, and therefore provably safe.\n"
              "The composed result carries an explicit receiver-width and signedness fence.\n"
              "Arithmetic, mux, cast, resize, nested, dynamic and other selected uses retain the\n"
              "temporary, avoiding invalid nested or general-expression selections in strict\n"
              "Verilog-2001. The one-bit `temporary[0]` case is treated as a whole-object use.\n"
          )
          if old_readme not in readme:
              raise SystemExit("WA-07 README selected-use insertion point is missing")
          write(readme_path, readme.replace(old_readme, new_readme, 1))

          for temporary in (
              ".github/workflows/wa07-close.yml",
              ".github/workflows/wa07-close-windows.yml",
              ".github/workflows/wa07-selected-use-safety-patch.yml",
              "morphhdl-passes/.wa07-fast-trigger",
          ):
              path = root / temporary
              if path.exists():
                  path.unlink()

          registry_path = (
              root /
              "morphhdl-passes/tests/formal_model/wire_assignment_ir/expected-signatures.json"
          )
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          files = registry["files"]
          required = {
              "morphhdl-passes/src/main/scala/morphhdl/passes/api/PassContracts.scala",
              source_path,
              "morphhdl-passes/src/main/scala/morphhdl/passes/pipeline/WireAliasPassPipeline.scala",
              "morphhdl-passes/src/test/scala/morphhdl/passes/api/AllPassConfigurationSpec.scala",
              "morphhdl-passes/src/test/scala/morphhdl/passes/transform/UnnamedWireExpressionEliminationPassSpec.scala",
              "morphhdl-passes/src/test/scala/morphhdl/passes/transform/UnnamedWireExpressionAlgebraSpec.scala",
              selection_spec_path,
              "morphhdl-passes/src/test/scala/morphhdl/passes/pipeline/WireAssignmentAllPassPipelineSpec.scala",
              native_path,
              "morphhdl-passes/examples/AllWireAssignmentNativeBridge.scala",
              "morphhdl-passes/scripts/run-wa07-regression.sh",
              guard_path,
          }
          for relative in sorted(set(files) | required):
              target = root / relative
              if not target.is_file():
                  raise SystemExit(f"signature target is missing: {relative}")
              files[relative] = hashlib.sha256(target.read_bytes()).hexdigest()
          registry_path.write_text(
              json.dumps(registry, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git diff --check
          python3 -m py_compile \
            morphhdl-passes/scripts/check-wa06-pipeline.py \
            morphhdl-passes/scripts/check-wa07-expression-pass.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "WA-07: make selected expression inlining slice-safe"

      - name: Run every static pass contract
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl-passes/scripts/test-boundary-guard.sh
          for script in \
            check-wa02-adapter-boundary.py \
            check-wa03-gates.py \
            check-wa04-pass.py \
            check-wa05-pass.py \
            check-wa06-pipeline.py \
            check-wa07-expression-pass.py; do
            python3 "morphhdl-passes/scripts/${script}" --self-test
            python3 "morphhdl-passes/scripts/${script}"
          done
          python3 morphhdl-passes/scripts/validate_wire_assignment_equivalence.py --self-test

      - name: Test Scala 2.12 contracts and transformations
        working-directory: morphhdl-passes
        shell: bash
        run: sbt -batch ++2.12.18 test

      - name: Test Scala 2.13 contracts and transformations
        working-directory: morphhdl-passes
        shell: bash
        run: sbt -batch ++2.13.12 test

      - name: Push the exact tested commit
        shell: bash
        run: git push origin HEAD:agent/wa-07-unified-expression-inlining

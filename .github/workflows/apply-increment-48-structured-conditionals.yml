name: Apply Increment 48 structured conditional repair

on:
  push:
    branches:
      - fix/increment-48-structured-conditional-chains

permissions:
  contents: write

jobs:
  apply:
    name: Apply reviewed Increment 48 repair
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/increment-48-structured-conditional-chains
          fetch-depth: 0

      - name: Apply nested structural conditional changes
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > /tmp/patcher_inc48.py
          python3 /tmp/patcher_inc48.py
          rm .github/workflows/apply-increment-48-structured-conditionals.yml
          git diff --check

      - name: Commit reviewed repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/main/scala/morphhdl/frontend/NaturalSymbolicConditional.scala \
            frontend/src/main/scala/spinal/core/ParameterizedStructure.scala \
            frontend/src/main/scala/spinal/core/ParameterizedStructuralSynthetic.scala \
            morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala \
            morphhdl/src/test/scala/morphhdl/NaturalSymbolicConditionalTests.scala \
            .github/workflows/morphhdl-external-structural-process.yml \
            docs/morphhdl/parameterized-verilog-todo.md \
            .github/workflows/apply-increment-48-structured-conditionals.yml
          git commit -m "Repair Increment 48 conditional chain lowering"
          git push origin HEAD:fix/increment-48-structured-conditional-chains

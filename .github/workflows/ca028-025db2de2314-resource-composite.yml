name: CA-028 exact-candidate targeted dispatcher
on:
  push:
    branches: [control/ca028-025db2de2314-resource-composite]
    paths:
      - .github/workflows/ca028-025db2de2314-resource-composite.yml
      - .github/controllers/ca028-025db2de2314-resource-composite/dispatch.py
      - .github/controllers/ca028-025db2de2314-resource-composite/dispatch.json
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact identities and dispatch affected workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/controllers/ca028-025db2de2314-resource-composite/dispatch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ca028-dispatch-ledger
          path: dispatch-ledger.jsonl
          if-no-files-found: error

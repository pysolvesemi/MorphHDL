name: MorphHDL external structural and process capture

on:
  push:
    branches:
      - main
      - parameterized-verilog
  pull_request:
    branches:
      - main
      - parameterized-verilog
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morphhdl-external-structural-process-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundary:
    name: Structural/process source boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove MorphHDL-owned structural and process boundary
        shell: bash
        run: bash morphhdl/scripts/check-external-structural-process-boundary.sh

  contracts:
    name: External structural/process proof Scala ${{ matrix.scala_version }}
    needs: source-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    strategy:
      fail-fast: false
      matrix:
        scala_version:
          - "2.12.18"
          - "2.13.12"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Validate capture, publication and inherited checks
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill frontend[${{ matrix.scala_version }}].testOnly \
            morphhdl.frontend.HdlIntTests
          /tmp/morphhdl-mill morph[${{ matrix.scala_version }}].testOnly \
            morphhdl.integration.ExternalSpinalVerilogBaselineTests \
            morphhdl.StructuralGenerateControlTests \
            morphhdl.StructuralWitnessSizingTests \
            spinal.core.StructuralAddressWidthIdentityTests \
            morphhdl.NativeProcessTreeCaptureTests \
            morphhdl.NaturalSymbolicConditionalTests \
            morphhdl.GenericProcessLoweringTests \
            morphhdl.GenericExpressionAndStreamTests \
            morphhdl.HierarchyParameterBindingTests \
            morphhdl.MorphSingleSourceVerilogTests
          /tmp/morphhdl-mill core[${{ matrix.scala_version }}].testOnly \
            spinal.core.internals.SpinalVerilogPhasePlanTests

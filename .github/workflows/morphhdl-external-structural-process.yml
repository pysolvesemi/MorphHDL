name: MorphHDL external structural and process capture

on:
  push:
    branches:
      - main
      - parameterized-verilog
  pull_request:
    branches:
      - main
      - parameterized-verilog
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morphhdl-external-structural-process-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  source-boundary:
    name: Structural/process source boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove MorphHDL-owned structural and process boundary
        shell: bash
        run: bash morphhdl/scripts/check-external-structural-process-boundary.sh

  lightweight-contracts:
    name: Lightweight RTL ${{ matrix.build }} Scala ${{ matrix.scala_version }}
    needs: source-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/spinalhdl/docker:latest
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
        build: [sbt, mill]
    env:
      SBT_TEST_PARALLEL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Authenticate current source and report checks
        run: |
          python3 morphhdl/scripts/check-parameterized-integration-source.py
          python3 morphhdl/scripts/lightweight-scala-rtl/test-run-contracts.py
          python3 morphhdl/scripts/lightweight-scala-rtl/test-installer.py
      - name: Build pinned simulator without altering compiler or RTL
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y autoconf gperf bison flex make g++
          python3 morphhdl/scripts/lightweight-scala-rtl/install-iverilog.py "${{ runner.temp }}/iverilog"
          echo "${{ runner.temp }}/iverilog/bin" >> "$GITHUB_PATH"
      - name: Install Mill launcher
        if: matrix.build == 'mill'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill
      - name: Run every enrolled current-source suite
        shell: bash
        run: |
          set -euo pipefail
          for tool in iverilog vvp verilator yosys; do command -v "$tool"; done
          python3 morphhdl/scripts/lightweight-scala-rtl/install-iverilog.py "${{ runner.temp }}/iverilog" --verify
          export MORPHDL_INCREMENT66_EVIDENCE="$RUNNER_TEMP/lightweight-tools"
          runner=sbt
          if [ '${{ matrix.build }}' = mill ]; then runner=/tmp/morphhdl-mill; fi
          python3 morphhdl/scripts/lightweight-scala-rtl/run-contracts.py \
            --build '${{ matrix.build }}' --scala '${{ matrix.scala_version }}' \
            --executable "$runner" --output "${{ runner.temp }}/lightweight-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightweight-${{ matrix.build }}-${{ matrix.scala_version }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/lightweight-results
            ${{ runner.temp }}/lightweight-tools
            ${{ runner.temp }}/iverilog/build-receipt.json
          if-no-files-found: error

  contracts:
    name: External structural/process proof Scala ${{ matrix.scala_version }}
    needs: source-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    strategy:
      fail-fast: false
      matrix:
        scala_version:
          - "2.12.18"
          - "2.13.12"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Require RTL validation tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in iverilog vvp verilator yosys yosys-smtbmc z3; do command -v "$tool"; done
      - name: Validate capture, publication and inherited checks
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morphplugin[${{ matrix.scala_version }}].testOnly \
            morphhdl.compiler.MorphHdlAreaCollectionComponentTests
          /tmp/morphhdl-mill frontend[${{ matrix.scala_version }}].testOnly \
            morphhdl.frontend.HdlIntTests
          /tmp/morphhdl-mill morph[${{ matrix.scala_version }}].testOnly \
            morphhdl.RecursiveUnsignedSumTests \
            morphhdl.SymbolicArrayGeometryTests \
            morphhdl.WidthCompositionTests \
            morphhdl.SymbolicPackedWordsTests \
            spinal.core.FinitePackedCorrelationTests \
            spinal.core.internals.NativeStructuralIndentationTests \
            spinal.core.RecursivePartitionSafetyTests \
            morphhdl.BoundedRecursivePowerTests \
            morphhdl.BoundedRecursiveSafetyTests \
            morphhdl.ReduceBalancedTreeNativeContractTests \
            morphhdl.FiniteBitsAndRamSharingTests \
            morphhdl.SharedFiniteLoopControlTests \
            morphhdl.AreaCollectionLoopTests \
            spinal.core.AreaCollectionLineageTests \
            spinal.core.FiniteBitsIndexTests \
            spinal.core.FiniteMemIdentityAdversarialTests \
            morphhdl.integration.ExternalSpinalVerilogBaselineTests \
            morphhdl.StructuralGenerateControlTests \
            morphhdl.NaturalSymbolicConditionalTests \
            morphhdl.GenericProcessLoweringTests \
            morphhdl.GenericExpressionAndStreamTests \
            morphhdl.ScopedProcessTests morphhdl.ScopedProcessExtensionTests \
            morphhdl.PublicationDecisionTests \
            spinal.core.ProcessExpressionLineageTests \
            spinal.core.internals.CanonicalSchemaDiagnosticTests \
            morphhdl.HierarchyParameterBindingTests \
            morphhdl.MorphSingleSourceVerilogTests \
            morphhdl.EnumDebugOptionsTests \
            morphhdl.CombinationalEventDependencyTests \
            morphhdl.NativeConditionalProcessTests \
            morphhdl.BoundedProcessOperationTests \
            spinal.core.TypedPrimitiveClosureTests \
            morphhdl.TypedCounterAllOnesTests \
            morphhdl.CounterSingleAuthorityParityTests \
            morphhdl.GenerateIndexNamingTests \
            morphhdl.TypedLoopCarrierCoverageTests \
            morphhdl.ShiftSubrangeAndGrayTests \
            morphhdl.SymbolicVecInitializerTests \
            morphhdl.StageDepthFormalSharingTests \
            morphhdl.ElabVecSelectionTests \
            morphhdl.VecElabIntApplyTests \
            morphhdl.NativeHelperNamingTests \
            spinal.core.TypedStagePublicationSafetyTests \
            morphhdl.GrayStageSharingTests \
            morphhdl.NativeLibraryReuseTests \
            morphhdl.NativeStreamFifoCCParameterizedTests \
            morphhdl.TypedNestedVecWriteTests \
            spinal.core.TypedLoopRegisterOwnershipTests
          /tmp/morphhdl-mill core[${{ matrix.scala_version }}].testOnly \
            spinal.core.internals.SpinalVerilogPhasePlanTests

      - name: Generate recursive unsigned sum examples and qualify overrides
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morph[${{ matrix.scala_version }}].test.runMain morphhdl.RecursiveUnsignedSumArtifactWriter /tmp/recursive-sum/rtl
          for default in 1 16; do
            python3 morphhdl/scripts/check-recursive-unsigned-sum.py \
              --rtl /tmp/recursive-sum/rtl/default-$default-split-false/RecursiveUnsignedSum.v \
              --output /tmp/recursive-sum/checks-default-$default
          done
          /tmp/morphhdl-mill morph[${{ matrix.scala_version }}].test.runMain morphhdl.NativeRecursiveTreeArtifactWriter /tmp/recursive-sum/typed/rtl
          python3 morphhdl/scripts/check-typed-recursive-component.py \
            --rtl /tmp/recursive-sum/typed/rtl \
            --output /tmp/recursive-sum/typed/checks
          /tmp/morphhdl-mill morph[${{ matrix.scala_version }}].test.runMain morphhdl.NativeWidthRecursiveArtifactWriter /tmp/recursive-sum/width/rtl
          python3 morphhdl/scripts/check-symbolic-recursive-width.py \
            --rtl /tmp/recursive-sum/width/rtl \
            --output /tmp/recursive-sum/width/checks

      - name: Retain recursive reduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recursive-unsigned-sum-${{ matrix.scala_version }}
          path: /tmp/recursive-sum
          if-no-files-found: error

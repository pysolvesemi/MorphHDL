name: Diagnose Increment 31 symbolic-output widths

on:
  push:
    branches:
      - agent/increment-31-generic-expressions
    paths:
      - .github/workflows/agent-increment-31-fix.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-31-generic-expressions
          fetch-depth: 0

      - name: Add temporary diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("core/src/main/scala/spinal/core/internals/ParameterizedVerilogNativeFallback.scala")
          text = source.read_text(encoding="utf-8")
          anchor = """    val analysis = new Analysis(component, pc)\n    analysis.validate()\n\n    val modulePattern =\n"""
          replacement = """    val analysis = new Analysis(component, pc)\n    analysis.validate()\n    println(\"INCREMENT31_DIAG_WIDTHS \" + analysis.symbolicDeclarationWidths.map { case (name, width) => name + \"=\" + width.render }.mkString(\",\"))\n    verilog.linesIterator.filter(line => line.contains(\"dout\") || line.contains(\"din\") || line.contains(\"alternate\")).foreach(line => println(\"INCREMENT31_DIAG_NATIVE \" + line))\n\n    val modulePattern =\n"""
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one rewrite diagnostic anchor, found {text.count(anchor)}")
          source.write_text(text.replace(anchor, replacement), encoding="utf-8")

          tests = Path("core/src/test/scala/spinal/core/internals/ParameterizedDataShapeTests.scala")
          test_text = tests.read_text(encoding="utf-8")
          replacements = {
              '    assert(hasDeclarationWidth(verilog, "dout", "[WIDTH-1:0]"))':
                  '    assert(hasDeclarationWidth(verilog, "dout", "[WIDTH-1:0]"), "INCREMENT31_DIAG_REWRITTEN_BEGIN\\n" + verilog + "\\nINCREMENT31_DIAG_REWRITTEN_END")',
              '    assert(hasDeclarationWidth(expression, "dout", "[WIDTH-1:0]"))':
                  '    assert(hasDeclarationWidth(expression, "dout", "[WIDTH-1:0]"), "INCREMENT31_DIAG_EXPRESSION_BEGIN\\n" + expression + "\\nINCREMENT31_DIAG_EXPRESSION_END")',
          }
          for old, new in replacements.items():
              count = test_text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one test assertion {old!r}, found {count}")
              test_text = test_text.replace(old, new)
          tests.write_text(test_text, encoding="utf-8")
          PY
          git diff --check

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0-mill.sh \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Capture the failing Scala 2.12 suite
        shell: bash
        run: |
          /tmp/morphhdl-mill core[2.12.18].testOnly \
            spinal.core.internals.ParameterizedDataShapeTests

name: Validate Increment 31 declaration matcher

on:
  push:
    branches:
      - agent/increment-31-generic-expressions
    paths:
      - .github/workflows/agent-increment-31-fix.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-31-generic-expressions
          fetch-depth: 0

      - name: Apply focused test matcher fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("core/src/test/scala/spinal/core/internals/ParameterizedDataShapeTests.scala")
          text = path.read_text(encoding="utf-8")
          old = '        java.util.regex.Pattern.quote(name) + "(?=\\\\s*[,;])").r'
          new = '        java.util.regex.Pattern.quote(name) + "(?=\\\\s*(?:[,;]|\\\\)))").r'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one declaration matcher, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check
          git diff -- core/src/test/scala/spinal/core/internals/ParameterizedDataShapeTests.scala

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0-mill.sh \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Run the affected suite on both Scala versions
        shell: bash
        run: |
          /tmp/morphhdl-mill core[2.12.18].testOnly \
            spinal.core.internals.ParameterizedDataShapeTests
          /tmp/morphhdl-mill core[2.13.12].testOnly \
            spinal.core.internals.ParameterizedDataShapeTests

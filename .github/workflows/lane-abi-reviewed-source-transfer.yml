name: PR187 reviewed ABI source transfer
on:
  push:
    branches: [agent/lane-when-expression-inlining]
    paths: ['.github/workflows/lane-abi-reviewed-source-transfer.yml']
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reconstruct reviewed source and publish immutable blob objects only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          def fetch_blob(sha):
              req=urllib.request.Request('https://api.github.com/repos/pysolvesemi/MorphHDL/git/blobs/'+sha,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=60) as response: value=json.load(response)
              raw=base64.b64decode(value['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              return raw
          raw=fetch_blob('2df7cabb36334b404960da1bffb82823ff715e6e')
          assert hashlib.sha256(raw).hexdigest()=='06295e0131d617f8d9b6299772d2e4f6e9888bbd865f8bf9aa411cdcdaa265b9'
          lines=raw.decode().splitlines(keepends=True);blocks=[];i=0
          while i<len(lines):
              if lines[i].rstrip('\n')=='        run: |':
                  i+=1;block=[]
                  while i<len(lines) and (lines[i].startswith('          ') or lines[i].strip()==''):
                      block.append(lines[i][10:] if lines[i].startswith('          ') else '\n');i+=1
                  blocks.append(''.join(block))
              else:i+=1
          assert len(blocks)==2
          subprocess.run(['bash','-n'],input=blocks[0],text=True,check=True)
          subprocess.run(['bash','-e','-o','pipefail','-c',blocks[0]],check=True)
          driver=fetch_blob('ae2da2e7c4750d4ae3c020ed3d098b1d11648442')
          path=pathlib.Path(os.environ['RUNNER_TEMP'],'reconstruct-integrated.py');path.write_bytes(driver)
          subprocess.run(['python3',str(path)],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr187-integrated-source-blobs
          path: ${{ runner.temp }}/pr187-integrated-source/
          if-no-files-found: error
          retention-days: 7

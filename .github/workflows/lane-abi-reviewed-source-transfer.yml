name: PR187 reviewed ABI source transfer
on:
  push:
    branches: [agent/lane-when-expression-inlining]
    paths: ['.github/workflows/lane-abi-reviewed-source-transfer.yml']
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind and verify the actual integrated source commit
        shell: bash
        env:
          GIT_AUTHOR_NAME: PR187 source verification
          GIT_AUTHOR_EMAIL: verification@invalid.example
          GIT_COMMITTER_NAME: PR187 source verification
          GIT_COMMITTER_EMAIL: verification@invalid.example
        run: |
          set -euo pipefail
          git fetch origin 033541420fc408ca87aeae260c8372802c13ae7b
          git checkout --detach 033541420fc408ca87aeae260c8372802c13ae7b
          test "$(git rev-parse 'HEAD^{tree}')" = 3e0b15de15e89d9de34d2f9873e1a3a831bbc198
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'],'pr187-final-seal');out.mkdir()
          paths=['morphhdl/contracts/increment-62-wa08-source-overlay.json',
                 'morphhdl/scripts/check-increment-62-wa08-source-overlay.py']
          value=json.loads((root/paths[0]).read_bytes());assert len(value['files'])==177
          value['final_source_commit']='033541420fc408ca87aeae260c8372802c13ae7b'
          raw=(json.dumps(value,sort_keys=True,indent=2)+'\n').encode()
          assert hashlib.sha256(raw).hexdigest()=='1f9286183423827699408d7f283532ef80d00f007b6d6f9f68db87de0831da32'
          (root/paths[0]).write_bytes(raw)
          helper,count=re.subn(rb'^CONTRACT_SHA256 = "[^\"]+"$',
              b'CONTRACT_SHA256 = "'+hashlib.sha256(raw).hexdigest().encode()+b'"',
              (root/paths[1]).read_bytes(),count=1,flags=re.M)
          assert count==1;(root/paths[1]).write_bytes(helper)
          entries=[]
          for path in paths:
              content=(root/path).read_bytes()
              sha=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha,
                  'content':base64.b64encode(content).decode()})
          publication=json.dumps(entries,sort_keys=True,separators=(',',':')).encode()
          assert hashlib.sha256(publication).hexdigest()=='7c3d752443436a9dd79c40258bf0592b3a036e2010ddb9f7f9a1fdf338c8c83b'
          (out/'publication.json').write_bytes(publication)
          subprocess.run(['git','add',*paths],check=True)
          assert subprocess.check_output(['git','write-tree']).decode().strip()=='87f6780de56bc69502b8ec7614fcdf812a573a04'
          subprocess.run(['git','commit','--quiet','-m','temporary exact final-seal verification'],check=True)
          PY
          python3 morphhdl/scripts/check-increment-62-wa08-source-overlay.py
          python3 morphhdl/scripts/check-native-source-preservation.py
          python3 morphhdl/scripts/check-lane-when-source-scope.py
          python3 morphhdl/scripts/test-lane-when-source-scope.py
          test -z "$(git status --porcelain)"
          git update-ref refs/receipt/pr187-source 033541420fc408ca87aeae260c8372802c13ae7b
          git update-ref refs/receipt/pr187-staging "$GITHUB_SHA"
          git bundle create "$RUNNER_TEMP/pr187-final-seal/source-and-staging.bundle" refs/receipt/pr187-source refs/receipt/pr187-staging ^7f355a859e7e88ca343e1ff82f261fb47b3311d0 ^0ebf51c9464555912f178459bc2d249447770b94
          git cat-file commit 033541420fc408ca87aeae260c8372802c13ae7b > "$RUNNER_TEMP/pr187-final-seal/source-commit.txt"
          git cat-file commit "$GITHUB_SHA" > "$RUNNER_TEMP/pr187-final-seal/staging-commit.txt"
          (cd "$RUNNER_TEMP/pr187-final-seal" && sha256sum publication.json source-and-staging.bundle source-commit.txt staging-commit.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pr187-final-seal-data
          path: ${{ runner.temp }}/pr187-final-seal/
          if-no-files-found: error
          retention-days: 7
  publish-data:
    needs: seal
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr187-final-seal-data
          path: reviewed-data
      - name: Upload the two authenticated data blobs only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          raw=pathlib.Path('reviewed-data/publication.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='7c3d752443436a9dd79c40258bf0592b3a036e2010ddb9f7f9a1fdf338c8c83b'
          entries=json.loads(raw);assert len(entries)==2
          receipt=[]
          for entry in entries:
              assert set(entry)=={'path','mode','type','sha','content'}
              assert entry['type']=='blob' and entry['mode']=='100644'
              content=base64.b64decode(entry['content'],validate=True)
              assert hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()==entry['sha']
              request=urllib.request.Request('https://api.github.com/repos/pysolvesemi/MorphHDL/git/blobs',
                  data=json.dumps({'encoding':'base64','content':entry['content']}).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=120) as response: result=json.load(response)
              assert result['sha']==entry['sha']
              receipt.append({key:entry[key] for key in ('path','mode','type','sha')})
          pathlib.Path('receipt').mkdir()
          pathlib.Path('receipt/receipt.json').write_text(json.dumps({'schema_version':1,
              'source':'033541420fc408ca87aeae260c8372802c13ae7b',
              'tree':'87f6780de56bc69502b8ec7614fcdf812a573a04',
              'staging_head':os.environ['GITHUB_SHA'],'entries':receipt},indent=2)+'\n')
          print('EXACT_FINAL_SEAL_BLOBS_UPLOADED',len(receipt),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr187-final-seal-receipt
          path: receipt/
          if-no-files-found: error
          retention-days: 7

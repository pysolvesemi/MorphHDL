name: Increment 53 shared range diagnostic

on:
  push:
    branches:
      - agent/increment-53-native-streamfifo-repair
  pull_request:
    branches:
      - parameterized-verilog
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-53-shared-range-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53-native-streamfifo-repair
          fetch-depth: 0

      - name: Apply candidate and expose next shared native unit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          carrier_path = Path(
              ".github/workflows/increment-53-repair-carrier.yml"
          )
          carrier = carrier_path.read_text(encoding="utf-8")
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          git show"
          if start_marker not in carrier or end_marker not in carrier:
              raise SystemExit("Increment 53 repair carrier shape changed")
          script = carrier.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(
              compile(
                  textwrap.dedent(script),
                  str(carrier_path) + ":embedded-python",
                  "exec",
              ),
              {},
          )

          structural_path = Path(
              "morphhdl/src/main/scala/spinal/core/internals/"
              "ParameterizedVerilogStructural.scala"
          )
          structural = structural_path.read_text(encoding="utf-8")
          old = '''    val sharedProcessRanges = mutable.LinkedHashSet.empty[LineRange]

              claims.toVector
                .filter(_._2.size > 1)
                .sortBy(_._1.start)
          '''
          new = '''    val sharedProcessRanges = mutable.LinkedHashSet.empty[LineRange]
              val sharedNativeDeclarationRanges =
                mutable.LinkedHashSet.empty[LineRange]

              claims.toVector
                .filter(_._2.size > 1)
                .sortBy(_._1.start)
                .foreach { case (range, claimed) =>
                  val declarationLines = range.indices.map(lines).toVector
                  val normalizedDeclarations =
                    declarationLines.map(line => stripLineComment(line).trim)
                  val isSharedNativeWireDeclarationRange =
                    normalizedDeclarations.nonEmpty &&
                    normalizedDeclarations.forall { line =>
                      line.nonEmpty &&
                      line.startsWith("wire ") &&
                      line.endsWith(";")
                    }
                  if (isSharedNativeWireDeclarationRange) {
                    val claimants =
                      claimed.toVector.map(plan => current(plan.block))
                    claimants.combinations(2).foreach { pair =>
                      val left = pair(0)
                      val right = pair(1)
                      if (
                        !mutuallyExclusive(
                          paths.getOrElse(left.block, Vector.empty),
                          paths.getOrElse(right.block, Vector.empty)
                        )
                      ) {
                        fail(
                          "SPINAL-PARAMETERIZED-VERILOG-STRUCTURAL-SHARED-DECLARATION-NONEXCLUSIVE",
                          s"native declaration range ${range.start}-${range.end} is shared by structural blocks that are not proven mutually exclusive",
                          left.block.sourceLocation.orElse(right.block.sourceLocation)
                        )
                      }
                    }
                    val completeDeclarations =
                      stripCommonIndent(declarationLines.mkString("\\n").trim)
                    claimants.foreach { claimant =>
                      val plan = current(claimant.block)
                      if (!plan.ranges.contains(range)) {
                        fail(
                          "SPINAL-PARAMETERIZED-VERILOG-STRUCTURAL-SHARED-DECLARATION-RANGE-MISSING",
                          s"native declaration range ${range.start}-${range.end} is absent from one proven claimant",
                          claimant.block.sourceLocation
                        )
                      }
                      val withoutDeclarations = removeUniqueProcess(
                        plan.body,
                        completeDeclarations,
                        range,
                        claimant.block.sourceLocation
                      )
                      current(claimant.block) = plan.copy(
                        ranges = plan.ranges.filterNot(_ == range),
                        body = stripCommonIndent(withoutDeclarations.trim)
                      )
                    }
                    sharedNativeDeclarationRanges += range
                  }
                }

              claims.toVector
                .filter { case (range, claimed) =>
                  claimed.size > 1 &&
                  !sharedNativeDeclarationRanges(range)
                }
                .sortBy(_._1.start)
          '''
          count = structural.count(old)
          if count != 1:
              raise SystemExit(
                  f"shared-declaration factoring anchor count was {count}, expected 1"
              )
          structural = structural.replace(old, new, 1)

          diagnostic_old = '''            s"captured native range ${range.start}-${range.end} is shared by multiple structural alternatives but is not one simple always block"
          '''
          diagnostic_new = '''            s"captured native range ${range.start}-${range.end} is shared by multiple structural alternatives but is not one simple always block; lines=${processLines.mkString(" || ")}"
          '''
          count = structural.count(diagnostic_old)
          if count != 1:
              raise SystemExit(
                  f"shared-range diagnostic anchor count was {count}, expected 1"
              )
          structural = structural.replace(
              diagnostic_old,
              diagnostic_new,
              1,
          )
          structural_path.write_text(structural, encoding="utf-8")
          PY
          git diff --check

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Reproduce StreamFifo shared-range failure
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill "morph[2.12.18].testOnly" \
            morphhdl.ParameterizedStreamFifoDepthTests

name: Increment 59i development HDL tool kit

on:
  push:
    branches: ['agent/increment-59i-combined-reduction-closure']
    paths: ['.github/workflows/increment-59i-development-tools.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve only declared HDL binaries, data and their dynamic libraries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, subprocess, tarfile
          from pathlib import Path
          output = Path('target/increment-59i-tools')
          kit = output / 'tool-kit'
          root = kit / 'root'
          root.mkdir(parents=True)
          tools = {}
          versions = {}
          for name, args in {'yosys': ['-V'], 'iverilog': ['-V'], 'vvp': ['-V'], 'verilator': ['-V']}.items():
              found = shutil.which(name)
              if not found:
                  raise RuntimeError('Missing required CI tool: ' + name)
              source = Path(found).resolve()
              tools[name] = str(source)
              result = subprocess.run([str(source), *args], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=True)
              versions[name] = result.stdout
          files = set()
          directories = set()
          def include_file(source):
              source = Path(source)
              if not source.is_file():
                  raise RuntimeError('Missing declared tool file: ' + str(source))
              files.add(source.absolute())
          def include_directory(source):
              source = Path(source)
              if not source.is_dir():
                  raise RuntimeError('Missing declared tool data directory: ' + str(source))
              directories.add(source.absolute())
              for entry in source.rglob('*'):
                  if entry.is_file():
                      include_file(entry)
          for name, source in tools.items():
              include_file(source)
          for name in ('yosys-abc', 'abc', 'verilator_bin'):
              found = shutil.which(name)
              if found:
                  include_file(Path(found).resolve())
                  tools[name] = str(Path(found).resolve())
          yosys_prefix = Path(tools['yosys']).parent.parent
          yosys_candidates = [yosys_prefix / 'share/yosys', Path('/usr/share/yosys'), Path('/usr/local/share/yosys')]
          config = shutil.which('yosys-config')
          if config:
              result = subprocess.run([config, '--datdir'], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if result.returncode == 0 and result.stdout.strip():
                  yosys_candidates.insert(0, Path(result.stdout.strip()))
          yosys_data = next((p for p in yosys_candidates if p.is_dir()), None)
          if yosys_data is None:
              raise RuntimeError('Cannot locate the selected Yosys data')
          include_directory(yosys_data)
          ivl_prefix = Path(tools['iverilog']).parent.parent
          ivl_candidates = [ivl_prefix / 'lib/ivl', ivl_prefix / 'lib64/ivl',
                            Path('/usr/lib/x86_64-linux-gnu/ivl'), Path('/usr/lib/ivl'), Path('/usr/local/lib/ivl')]
          ivl_data = next((p for p in ivl_candidates if (p / 'ivl').is_file()), None)
          if ivl_data is None:
              raise RuntimeError('Cannot locate Icarus compiler support')
          include_directory(ivl_data)
          roots = re.findall(r'^\s*VERILATOR_ROOT\s*=\s*(\S+)\s*$', versions['verilator'], re.M)
          verilator_root = next((Path(p) for p in roots if (Path(p) / 'bin/verilator_bin').is_file()), None)
          if verilator_root is None:
              prefix = Path(tools['verilator']).parent.parent
              verilator_root = next((p for p in [prefix / 'share/verilator', prefix]
                                     if (p / 'bin/verilator_bin').is_file()), None)
          if verilator_root is None:
              raise RuntimeError('Cannot locate Verilator runtime')
          include_file(verilator_root / 'bin/verilator_bin')
          if (verilator_root / 'include').is_dir():
              include_directory(verilator_root / 'include')
          # These are public tool inputs from the fixed CI image, not a home,
          # workspace, cache, environment or credential archive.
          examined = set()
          while True:
              pending = files - examined
              if not pending:
                  break
              for source in sorted(pending):
                  examined.add(source)
                  with source.open('rb') as handle:
                      elf = handle.read(4) == b'\x7fELF'
                  if not elf:
                      continue
                  linked = subprocess.run(['ldd', str(source)], text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  if 'not found' in linked.stdout:
                      raise RuntimeError('Unresolved library: ' + str(source))
                  for value in re.findall(r'(?:=>\s+)?(/[^\s()]+)', linked.stdout):
                      dependency = Path(value)
                      if dependency.is_file():
                          include_file(dependency)
          inventory = {}
          for source in sorted(files):
              target = root / source.relative_to('/')
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target, follow_symlinks=True)
              inventory[str(source)] = hashlib.sha256(target.read_bytes()).hexdigest()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          manifest = {'schema': 1, 'head': head, 'image': 'ghcr.io/spinalhdl/docker:v1.2.0',
              'tools': tools, 'versions': versions, 'yosys_data': str(yosys_data),
              'ivl_data': str(ivl_data), 'verilator_root': str(verilator_root), 'files': inventory}
          (kit / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          with tarfile.open(output / 'tool-kit.tar.gz', 'w:gz') as archive:
              archive.add(kit, arcname='tool-kit')
          shutil.rmtree(kit)
          (output / 'head.txt').write_text(head + '\n')
          print('Preserved', len(inventory), 'declared tool files. No HDL test result is implied.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-59i-development-tools
          path: target/increment-59i-tools
          if-no-files-found: error
          retention-days: 7

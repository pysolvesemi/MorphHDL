name: Increment 59a constant process safety qualification
on:
  push:
    branches: [agent/increment-59a-recursive-verilog-module]
permissions:
  contents: write
jobs:
  qualify:
    if: github.event.head_commit.message == 'Qualify 59a rejection of inert constant-only procedural fragments'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Add the rejected-topology regression before the production guard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p constant-guard-artifacts
          previous=1e5200c085547e94830f3a35fd9c7073d733dfad
          path=.github/workflows/increment-59a-constant-guard.yml
          test "$(git rev-parse "$previous:$path")" = 6f5b50c33327cd85aced5d6ade5dc90b018a08b2
          git show "$previous:$path" > constant-guard-artifacts/reviewed-probe.yml
          python3 - <<'PY'
          from pathlib import Path
          import re
          source=Path('constant-guard-artifacts/reviewed-probe.yml').read_text()
          start=source.index('          --- a/morphhdl/src/test/scala/morphhdl/BoundedRecursiveSafetyTests.scala\n')
          end=source.index('          PATCH\n', start)
          lines=source[start:end].splitlines(keepends=True)
          assert all(line.startswith('          ') for line in lines)
          patch=''.join(line[10:] for line in lines)
          # Keep the reviewed patch exact except for the fixture-only port name:
          # select is reserved by Spinal's shared Verilog/VHDL naming boundary.
          patch=re.sub(r'\bselect\b', 'choose', patch)
          Path('constant-guard-artifacts/fix.patch').write_text(patch)
          PY
          git apply --include=morphhdl/src/test/scala/morphhdl/BoundedRecursiveSafetyTests.scala constant-guard-artifacts/fix.patch
          set +e
          sbt -batch '++2.13.12' 'morph/testOnly morphhdl.BoundedRecursiveSafetyTests -- -z "constant base with runtime-conditional step"' > constant-guard-artifacts/before.log 2>&1
          before_status=$?
          set -e
          test "$before_status" -ne 0
          grep -Fq 'no exception was thrown' constant-guard-artifacts/before.log || { tail -n 100 constant-guard-artifacts/before.log; exit 1; }
          printf '%s\n' 'Confirmed regression: unsupported constant procedural fragment was previously published'
      - name: Apply the exact guard and prove focused and inherited regressions
        shell: bash
        run: |
          set -euo pipefail
          git apply --include=morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala constant-guard-artifacts/fix.patch
          sbt -batch '++2.13.12' 'morph/testOnly morphhdl.BoundedRecursivePowerTests morphhdl.BoundedRecursiveSafetyTests morphhdl.TypedBlackBoxGenericBindingTests morphhdl.StructuralGenerateControlTests morphhdl.NaturalSymbolicConditionalTests morphhdl.ExternalHierarchyBoolLiteralBindingTests spinal.core.ScalarStructuralIdentityAdversarialTests' > constant-guard-artifacts/after.log 2>&1 || { tail -n 140 constant-guard-artifacts/after.log; exit 1; }
          sbt -batch '++2.13.12' "morph/Test/runMain morphhdl.BoundedRecursivePowerArtifactWriter --output-dir ${GITHUB_WORKSPACE}/constant-guard-artifacts/rtl" > constant-guard-artifacts/generation.log 2>&1 || { tail -n 120 constant-guard-artifacts/generation.log; exit 1; }
          bash morphhdl/scripts/prove-increment-59a-recursive-module.sh --artifact-dir "${GITHUB_WORKSPACE}/constant-guard-artifacts/rtl" > constant-guard-artifacts/proof.log 2>&1 || { tail -n 120 constant-guard-artifacts/proof.log; exit 1; }
          tail -n 12 constant-guard-artifacts/after.log
          cat constant-guard-artifacts/proof.log
      - name: Commit only qualified source and accurate rejection documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/morphhdl/increment-59a-bounded-recursive-verilog-module.md')
          text=p.read_text()
          needle='clocked processes, conditional runtime trees, partial assignments, repeated\nwriters or expressions that depend on another target in the same family.'
          assert text.count(needle)==1
          text=text.replace(needle, needle+'\n\nIf a captured fragment is constant-only but the complete process family cannot\nbe converted safely, publication rejects it with\n`SPINAL-PARAMETERIZED-VERILOG-STRUCTURAL-CONSTANT-PROCESS-UNSUPPORTED`. In\nparticular, a constant base case combined with a procedural runtime-conditional\nstep is outside this serialization profile. It must not publish an inactive\n`always @(*)` driver. A red-before/green-after regression qualifies this guard.')
          text=text.replace('The focused tests require deterministic diagnostics for at least:', 'The production validation supplies deterministic diagnostics for:')
          p.write_text(text)
          Path('.github/workflows/increment-59a-constant-guard.yml').unlink()
          PY
          python3 morphhdl/scripts/check-increment-59a-recursive-module.py --self-test --repo-root .
          git diff --check
          git config user.name 'MorphHDL Increment Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add morphhdl/src/test/scala/morphhdl/BoundedRecursiveSafetyTests.scala morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala docs/morphhdl/increment-59a-bounded-recursive-verilog-module.md .github/workflows/increment-59a-constant-guard.yml
          git commit -m 'Reject unrepresentable constant combinational fragments before publication'
          git rev-parse HEAD | tee constant-guard-artifacts/head-sha.txt
          git rev-parse HEAD^{tree} > constant-guard-artifacts/tree-sha.txt
          git archive --format=tar.gz --output=constant-guard-artifacts/source.tar.gz HEAD
          git push origin HEAD:agent/increment-59a-recursive-verilog-module > constant-guard-artifacts/publication.log 2>&1 || cat constant-guard-artifacts/publication.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-59a-constant-guard
          path: constant-guard-artifacts
          if-no-files-found: error

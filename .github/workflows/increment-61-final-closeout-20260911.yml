name: Increment 61 guarded final closeout

on:
  push:
    branches:
      - agent/increment-61-one-file-per-component
    paths:
      - '.github/workflows/increment-61-final-closeout-20260911.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: increment-61-guarded-final-closeout
  cancel-in-progress: false

jobs:
  closeout:
    if: github.repository == 'pysolvesemi/MorphHDL' && github.ref == 'refs/heads/agent/increment-61-one-file-per-component'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      FEATURE_BRANCH: agent/increment-61-one-file-per-component
      TARGET_BRANCH: parameterized-verilog
      PR_NUMBER: '179'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Clean, qualify, close, merge and verify Increment 61
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          output="$GITHUB_WORKSPACE/target/increment-61-closeout"
          mkdir -p "$output"
          exec > >(tee "$output/controller.log") 2>&1

          original=$(git rev-parse HEAD)
          echo "$original" > "$output/controller-head.txt"
          test "$original" = "$GITHUB_SHA"
          test "$(git branch --show-current || true)" != "$TARGET_BRANCH"

          pr_json=$(gh api "repos/$repo/pulls/$PR_NUMBER")
          test "$(jq -r .state <<<"$pr_json")" = open
          test "$(jq -r .merged <<<"$pr_json")" = false
          test "$(jq -r .head.ref <<<"$pr_json")" = "$FEATURE_BRANCH"
          test "$(jq -r .base.ref <<<"$pr_json")" = "$TARGET_BRANCH"
          test "$(jq -r .head.sha <<<"$pr_json")" = "$original"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          permanent_a='.github/workflows/increment-61-one-file-per-component.yml'
          permanent_b='.github/workflows/increment-61-compatibility-matrix.yml'
          while IFS= read -r file; do
            case "$file" in
              "$permanent_a"|"$permanent_b") ;;
              *increment-61-fix-*|*increment-61-apply-*|*increment-61-finalize-*|*increment-61-final-closeout-*|*increment-61-commit-then-*|*increment-61-controller-*)
                git rm -f --ignore-unmatch -- "$file"
                ;;
            esac
          done < <(git ls-files '.github/workflows/*increment-61*.yml')
          while IFS= read -r file; do
            git rm -f --ignore-unmatch -- "$file"
          done < <(git ls-files 'morphhdl/repair-61*')

          matrix='morphhdl/src/test/scala/morphhdl/Increment61CompatibilityMatrix.scala'
          test "$(grep -c 'bitVectorWidthMax = 8192' "$matrix")" -eq 1
          test "$(grep -c 'bitVectorWidthMax = 4096' "$matrix" || true)" -eq 0

          reseal_source_review() {
            python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, subprocess

          root = Path('.')
          contract = root / 'morphhdl/contracts/increment-61-source-review.json'
          checker = root / 'morphhdl/scripts/check-increment-61-source-review.py'
          data = json.loads(contract.read_text())
          integrated = subprocess.run(
              ['git', 'merge-base', '--is-ancestor', data['integrated_target_commit'], 'HEAD'],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          ).returncode == 0
          for entry in data['reviewed_files']:
              path = root / entry['path']
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"missing reviewed file: {entry['path']}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              field = 'after_sha256_integrated' if integrated and 'after_sha256_integrated' in entry else 'after_sha256'
              entry[field] = digest
          contract.write_text(json.dumps(data, indent=2) + '\n')
          digest = hashlib.sha256(contract.read_bytes()).hexdigest()
          text = checker.read_text()
          text, count = re.subn(
              r'CONTRACT_SHA256 = "[0-9a-f]{64}"',
              f'CONTRACT_SHA256 = "{digest}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('source-review contract digest marker changed')
          checker.write_text(text)
          print('source_review_contract_sha256=' + digest)
          PY
          }

          reseal_source_review
          git add -A
          git diff --cached --check
          git commit -m '61: publish clean qualification candidate' \
            -m 'Retain the 8192-bit compatibility-only ceiling required to exercise the declared 4998-bit nested-field domain, remove every temporary repair/controller artifact, and reseal the exact Increment 61 source contract. Production publication behavior is unchanged.'
          candidate=$(git rev-parse HEAD)
          echo "$candidate" > "$output/candidate-head.txt"
          python3 morphhdl/scripts/check-increment-61-source-review.py
          python3 morphhdl/scripts/check-increment-61-source-review.py --self-test
          test -z "$(git status --porcelain)"
          remote=$(git ls-remote origin "refs/heads/$FEATURE_BRANCH" | cut -f1)
          test "$remote" = "$original"
          git push origin "HEAD:refs/heads/$FEATURE_BRANCH"

          workflows=(
            increment-61-one-file-per-component.yml
            increment-61-compatibility-matrix.yml
            increment-60c-signed-declarations.yml
            increment-60d-pure-sint-casts.yml
            increment-60e-signedness-boundaries.yml
            increment-60f-equivalence-closure.yml
            increment-60g-default-signed-verilog.yml
            morphhdl-baseline.yml
            morphhdl-mill.yml
            morphhdl-native-source-guard.yml
          )

          dispatch_and_wait() {
            local ref="$1"
            local sha="$2"
            local phase="$3"
            local table="$output/${phase}-runs.tsv"
            : > "$table"
            declare -A ids=()
            declare -A retried=()
            local workflow
            local stamp
            stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)

            for workflow in "${workflows[@]}"; do
              test -f ".github/workflows/$workflow"
              grep -q 'workflow_dispatch' ".github/workflows/$workflow"
              gh api --method POST "repos/$repo/actions/workflows/$workflow/dispatches" -f ref="$ref"
            done

            for workflow in "${workflows[@]}"; do
              local id=''
              for _ in $(seq 1 80); do
                id=$(gh api "repos/$repo/actions/workflows/$workflow/runs?branch=$ref&event=workflow_dispatch&per_page=30" \
                  --jq ".workflow_runs | map(select(.head_sha == \"$sha\" and .created_at >= \"$stamp\")) | sort_by(.created_at) | last | .id // empty")
                test -n "$id" && break
                sleep 5
              done
              test -n "$id"
              ids[$workflow]="$id"
              retried[$workflow]=0
              printf '%s\t%s\n' "$workflow" "$id" >> "$table"
            done

            for _ in $(seq 1 360); do
              local pending=0
              local failed=0
              for workflow in "${workflows[@]}"; do
                local id="${ids[$workflow]}"
                local run
                run=$(gh api "repos/$repo/actions/runs/$id")
                local run_sha status conclusion
                run_sha=$(jq -r .head_sha <<<"$run")
                status=$(jq -r .status <<<"$run")
                conclusion=$(jq -r '.conclusion // ""' <<<"$run")
                test "$run_sha" = "$sha"
                printf '%s\t%s\t%s\t%s\n' "$workflow" "$id" "$status" "$conclusion" > "$output/${phase}-${workflow}.state"
                if test "$status" != completed; then
                  pending=1
                elif test "$conclusion" != success; then
                  if test "${retried[$workflow]}" -eq 0; then
                    gh api --method POST "repos/$repo/actions/runs/$id/rerun-failed-jobs"
                    retried[$workflow]=1
                    pending=1
                  else
                    echo "workflow failed twice: $workflow run $id conclusion $conclusion" >&2
                    failed=1
                  fi
                fi
              done
              test "$failed" -eq 0
              if test "$pending" -eq 0; then
                echo "$phase exact-head workflow barrier PASS at $sha"
                return 0
              fi
              sleep 30
            done
            echo "$phase workflow barrier timed out" >&2
            return 1
          }

          dispatch_and_wait "$FEATURE_BRANCH" "$candidate" candidate

          pub_run=$(awk '$1 == "increment-61-one-file-per-component.yml" {print $2}' "$output/candidate-runs.tsv")
          test -n "$pub_run"
          evidence="$output/evidence"
          mkdir -p "$evidence"
          gh run download "$pub_run" --repo "$repo" -n increment-61-2.13.12 -D "$evidence"
          leaf=$(find "$evidence" -type f -path '*/generated-a/split/Increment61Leaf.v' -print -quit)
          top=$(find "$evidence" -type f -path '*/generated-a/split/Increment61Top.v' -print -quit)
          list=$(find "$evidence" -type f -path '*/generated-a/split/Increment61Top.lst' -print -quit)
          test -n "$leaf" && test -n "$top" && test -n "$list"

          CANDIDATE_HEAD="$candidate" LEAF_PATH="$leaf" TOP_PATH="$top" LIST_PATH="$list" python3 - <<'PY'
          from pathlib import Path
          import os, re

          candidate = os.environ['CANDIDATE_HEAD']
          leaf = Path(os.environ['LEAF_PATH']).read_text().rstrip()
          top = Path(os.environ['TOP_PATH']).read_text().rstrip()
          source_list = Path(os.environ['LIST_PATH']).read_text().rstrip()
          doc_path = Path('docs/morphhdl/increment-61-one-file-per-component.md')
          roadmap_path = Path('docs/morphhdl/parameterized-verilog-todo.md')
          doc = doc_path.read_text()
          prefix = doc.split('## Current status', 1)[0].rstrip()
          scala = '''import morphhdl.MorphVerilog
          import morphhdl.frontend.{Bits, HdlInt, formalParam}
          import spinal.core._

          final class Leaf(actualWidth: HdlInt) extends Component {
            setDefinitionName("Increment61Leaf")
            @dontName private val width = formalParam(
              actualWidth, "WIDTH", minimum = BigInt(1), maximum = BigInt(64)
            )
            val din  = in(Bits(width bits))
            val dout = out(Bits(width bits))
            dout := din
          }

          final class Top(leftWidth: HdlInt, rightWidth: HdlInt) extends Component {
            setDefinitionName("Increment61Top")
            val left  = new Leaf(leftWidth)
            val right = new Leaf(rightWidth)
          }

          val leftWidth  = HdlInt.param("LEFT_WIDTH",  default = 5, min = 1, max = 64)
          val rightWidth = HdlInt.param("RIGHT_WIDTH", default = 5, min = 1, max = 64)
          MorphVerilog(
            SpinalConfig(targetDirectory = "rtl", oneFilePerComponent = true)
          )(new Top(leftWidth, rightWidth))'''
          completion = f'''## Completion evidence

          The final qualification candidate was `{candidate}`. The source below is the
          unchanged MorphHDL/SpinalHDL-style API exercised by the Increment 61 tests.

          ```scala
          {scala}
          ```

          The same elaboration produced two actual strict Verilog-2001 source files.
          Each file owns exactly one canonical logical component, and the top-level
          `.lst` records dependency order.

          `Increment61Leaf.v`:

          ```verilog
          {leaf}
          ```

          `Increment61Top.v`:

          ```verilog
          {top}
          ```

          `Increment61Top.lst`:

          ```text
          {source_list}
          ```

          ## Completed qualification

          - Scala 2.12.18 and 2.13.12 publication and compatibility lanes.
          - Icarus Verilog, Verilator and Yosys strict Verilog-2001 checks.
          - Split-versus-consolidated specialization equivalence and negative mutations.
          - Cross-Scala generated-byte determinism.
          - Complete merged field, Mem, Vec, Stream, FIFO, CDC, signedness, generate,
            recursion, reduction and typed-BlackBox compatibility corpus.
          - Inherited Increment 60 closure, MorphHDL baseline, Mill and native-source guards.

          Increment 61 does affect generated Verilog: it publishes the same canonical
          parameterized design as one deterministic file per component when
          `oneFilePerComponent = true`; consolidated generation remains unchanged when
          the option is false.
          '''
          doc_path.write_text(prefix + '\n\n' + completion.strip() + '\n')

          roadmap = roadmap_path.read_text()
          old = '- [ ] **Increment 61 — Parameterized `oneFilePerComponent` publication**'
          new = '- [x] **Increment 61 — Parameterized `oneFilePerComponent` publication**'
          if roadmap.count(old) != 1 or new in roadmap:
              raise SystemExit('Increment 61 roadmap checkbox precondition failed')
          roadmap_path.write_text(roadmap.replace(old, new))
          PY

          reseal_source_review
          git add -A
          git diff --cached --check
          git commit -m '61: record completion evidence and close roadmap item' \
            -m 'Record the actual MorphHDL Scala surface and generated per-component Verilog from the green candidate, mark Increment 61 complete, and reseal the exact source-review contract. No production or test behavior changes in this closeout commit.'
          closeout=$(git rev-parse HEAD)
          echo "$closeout" > "$output/closeout-head.txt"
          python3 morphhdl/scripts/check-increment-61-source-review.py
          python3 morphhdl/scripts/check-increment-61-source-review.py --self-test
          test -z "$(git status --porcelain)"
          remote=$(git ls-remote origin "refs/heads/$FEATURE_BRANCH" | cut -f1)
          test "$remote" = "$candidate"
          git push origin "HEAD:refs/heads/$FEATURE_BRANCH"

          dispatch_and_wait "$FEATURE_BRANCH" "$closeout" closeout

          pr_json=$(gh api "repos/$repo/pulls/$PR_NUMBER")
          test "$(jq -r .state <<<"$pr_json")" = open
          test "$(jq -r .merged <<<"$pr_json")" = false
          test "$(jq -r .head.sha <<<"$pr_json")" = "$closeout"
          test "$(jq -r .mergeable <<<"$pr_json")" != false

          cat > "$output/pr-body.md" <<EOF
          ## Increment 61 complete

          Increment 61 is implemented and all final-head gates passed at \`$closeout\`.

          - parameterized \`oneFilePerComponent = true\` publication;
          - deterministic canonical component files and \`.lst\` order;
          - exact named parameter binding, enum/function/memory/generate ownership;
          - recursive-owner and external BlackBox handling;
          - hash-backed atomic publication and safe stale-file cleanup;
          - unchanged consolidated and ordinary concrete generation;
          - Scala 2.12/2.13, Icarus, Verilator, Yosys, equivalence, mutation,
            cross-Scala, baseline, Mill, signedness and inherited regression closure.

          The roadmap is marked \`[x]\`, and the completion document contains the actual
          Scala source plus actual generated Verilog. Increment 59i remains independent
          and must qualify its future combined cases in both publication modes.
          EOF
          gh pr edit "$PR_NUMBER" --repo "$repo" --title 'Increment 61: parameterized one-file-per-component publication' --body-file "$output/pr-body.md"
          gh pr ready "$PR_NUMBER" --repo "$repo"

          merge_json=$(gh api --method PUT "repos/$repo/pulls/$PR_NUMBER/merge" \
            -f merge_method=merge \
            -f sha="$closeout" \
            -f commit_title='Merge PR #179: Increment 61 parameterized one-file-per-component publication' \
            -f commit_message='All exact-head publication, compatibility, signedness, inherited regression, baseline, Mill and native-source gates passed.')
          echo "$merge_json" > "$output/merge.json"
          test "$(jq -r .merged <<<"$merge_json")" = true
          merge_sha=$(jq -r .sha <<<"$merge_json")
          test -n "$merge_sha" && test "$merge_sha" != null
          echo "$merge_sha" > "$output/merge-sha.txt"

          target_sha=$(gh api "repos/$repo/git/ref/heads/$TARGET_BRANCH" --jq .object.sha)
          test "$target_sha" = "$merge_sha"
          dispatch_and_wait "$TARGET_BRANCH" "$merge_sha" postmerge

          gh pr comment "$PR_NUMBER" --repo "$repo" --body "Increment 61 merged as \`$merge_sha\`. The same required workflow set passed again on \`parameterized-verilog\` after merge."
          printf 'COMPLETE\nfeature=%s\ncloseout=%s\nmerge=%s\n' "$FEATURE_BRANCH" "$closeout" "$merge_sha" > "$output/COMPLETE.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-61-final-closeout
          path: target/increment-61-closeout
          if-no-files-found: error
          retention-days: 30

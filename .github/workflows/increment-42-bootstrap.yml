name: Increment 42 repair validation

on:
  push:
    branches:
      - agent/increment-42-external-structural-process-capture
    paths:
      - .github/workflows/increment-42-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: increment-42-repair-validation
  cancel-in-progress: false

jobs:
  repair-and-validate:
    name: Repair and validate Increment 42
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out exact Increment 42 branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-42-external-structural-process-capture
          fetch-depth: 0

      - name: Restore structural continuation validation ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalParameterizedVerilog.scala")
          text = path.read_text(encoding="utf-8")
          old = '''  private def hasParameterizedMetadata(component: Component): Boolean =
            componentParameters(component).nonEmpty
          '''
          new = '''  private def hasParameterizedMetadata(component: Component): Boolean =
            ParameterizedWidth.parametersOf(component).nonEmpty ||
              ParameterizedMemory.parametersOf(component).nonEmpty ||
              ParameterizedVerilogStructural.hasRegions(component) ||
              ParameterizedVerilogProcesses.hasLoops(component)
          '''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          elif new not in text:
              raise SystemExit("Increment 42 diagnostic-ordering anchor was not found")
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalParameterizedVerilog.scala
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Restore structural continuation diagnostic ordering"
            git push origin HEAD:agent/increment-42-external-structural-process-capture
          fi

      - name: Prove external ownership boundary
        shell: bash
        run: ./morphhdl/scripts/check-external-structural-process-boundary.sh

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0-mill.sh \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Run focused Scala 2.12.18 validation
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill core[2.12.18].compile
          /tmp/morphhdl-mill frontend[2.12.18].compile
          /tmp/morphhdl-mill morph[2.12.18].testOnly \
            morphhdl.StructuralGenerateControlTests \
            morphhdl.GenericProcessLoweringTests \
            morphhdl.HierarchyParameterBindingTests \
            morphhdl.GenericExpressionAndStreamTests \
            morphhdl.MorphSingleSourceVerilogTests

      - name: Run focused Scala 2.13.12 validation
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill core[2.13.12].compile
          /tmp/morphhdl-mill frontend[2.13.12].compile
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.StructuralGenerateControlTests \
            morphhdl.GenericProcessLoweringTests \
            morphhdl.HierarchyParameterBindingTests \
            morphhdl.GenericExpressionAndStreamTests \
            morphhdl.MorphSingleSourceVerilogTests

name: Increment 42 repair validation

on:
  push:
    branches:
      - agent/increment-42-external-structural-process-capture
    paths:
      - .github/workflows/increment-42-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: increment-42-repair-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Increment 42 with diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out exact Increment 42 branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-42-external-structural-process-capture
          fetch-depth: 0

      - name: Run focused dual-Scala validation and publish diagnostics
        shell: bash
        run: |
          set -uo pipefail
          log=/tmp/increment-42-validation.log
          : > "$log"
          failed_gate=""
          rc=0

          run_gate() {
            local label="$1"
            shift
            printf '\n=== %s ===\n' "$label" | tee -a "$log"
            if "$@" >>"$log" 2>&1; then
              printf 'PASS: %s\n' "$label" | tee -a "$log"
            else
              rc=$?
              failed_gate="$label"
              printf 'FAIL(%s): %s\n' "$rc" "$label" | tee -a "$log"
              return "$rc"
            fi
          }

          run_gate "external ownership boundary" \
            ./morphhdl/scripts/check-external-structural-process-boundary.sh || true

          if [ -z "$failed_gate" ]; then
            run_gate "install pinned Mill" \
              curl --fail --location --retry 3 \
                https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0-mill.sh \
                --output /tmp/morphhdl-mill || true
            if [ -z "$failed_gate" ]; then chmod +x /tmp/morphhdl-mill; fi
          fi

          if [ -z "$failed_gate" ]; then
            run_gate "Scala 2.12.18 core compile" \
              /tmp/morphhdl-mill 'core[2.12.18].compile' || true
          fi
          if [ -z "$failed_gate" ]; then
            run_gate "Scala 2.12.18 frontend compile" \
              /tmp/morphhdl-mill 'frontend[2.12.18].compile' || true
          fi
          if [ -z "$failed_gate" ]; then
            run_gate "Scala 2.12.18 focused tests" \
              /tmp/morphhdl-mill 'morph[2.12.18].testOnly' \
                morphhdl.StructuralGenerateControlTests \
                morphhdl.GenericProcessLoweringTests \
                morphhdl.HierarchyParameterBindingTests \
                morphhdl.GenericExpressionAndStreamTests \
                morphhdl.MorphSingleSourceVerilogTests || true
          fi

          if [ -z "$failed_gate" ]; then
            run_gate "Scala 2.13.12 core compile" \
              /tmp/morphhdl-mill 'core[2.13.12].compile' || true
          fi
          if [ -z "$failed_gate" ]; then
            run_gate "Scala 2.13.12 frontend compile" \
              /tmp/morphhdl-mill 'frontend[2.13.12].compile' || true
          fi
          if [ -z "$failed_gate" ]; then
            run_gate "Scala 2.13.12 focused tests" \
              /tmp/morphhdl-mill 'morph[2.13.12].testOnly' \
                morphhdl.StructuralGenerateControlTests \
                morphhdl.GenericProcessLoweringTests \
                morphhdl.HierarchyParameterBindingTests \
                morphhdl.GenericExpressionAndStreamTests \
                morphhdl.MorphSingleSourceVerilogTests || true
          fi

          {
            if [ -z "$failed_gate" ]; then
              echo 'focused-dual-scala=passed'
            else
              echo 'focused-dual-scala=failed'
              echo "failed-gate=$failed_gate"
              echo "exit-code=$rc"
            fi
            echo '--- validation log tail ---'
            tail -n 240 "$log"
          } > morphhdl/.increment-42-validation-status

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add morphhdl/.increment-42-validation-status
          git diff --cached --check
          if ! git diff --cached --quiet; then
            if [ -z "$failed_gate" ]; then
              git commit -m "Record Increment 42 focused validation success"
            else
              git commit -m "Record Increment 42 focused validation diagnostics"
            fi
            git push origin HEAD:agent/increment-42-external-structural-process-capture
          fi

          if [ -n "$failed_gate" ]; then exit "$rc"; fi

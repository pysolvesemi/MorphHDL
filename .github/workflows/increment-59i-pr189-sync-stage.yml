name: Increment 59i exact PR189 sync staging
on:
  push:
    branches: [recovery/increment-59i-history-20260914]
    paths:
      - .github/workflows/increment-59i-pr189-sync-stage.yml
      - .github/recovery/59i-pr189-sync/**
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Reproduce exact source, review catalogue and seal; validate every source guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat .github/recovery/59i-pr189-sync/part-0{1,2,3}.b64 > .github/recovery/59i-pr189-sync/payload.xz.b64
          mkdir -p "$RUNNER_TEMP/59i-pr189-evidence"
          python3 -B .github/recovery/59i-pr189-sync/stage.py prepare \
            --repository "$GITHUB_WORKSPACE" \
            --destination "$RUNNER_TEMP/59i-pr189-source" \
            --output "$RUNNER_TEMP/59i-pr189-evidence" \
            2>&1 | tee "$RUNNER_TEMP/59i-pr189-evidence/prepare.log"
      - uses: actions/upload-artifact@v4
        with:
          name: increment-59i-pr189-sync-trees-ba167f35-${{ github.run_attempt }}
          path: ${{ runner.temp }}/59i-pr189-evidence
          if-no-files-found: error
          retention-days: 21
      - name: Stage only immutable exact Git objects after connector tree creation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B .github/recovery/59i-pr189-sync/stage.py publish \
            --repository "$GITHUB_WORKSPACE" \
            --destination "$RUNNER_TEMP/59i-pr189-source" \
            --output "$RUNNER_TEMP/59i-pr189-evidence" \
            2>&1 | tee "$RUNNER_TEMP/59i-pr189-evidence/publish.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-59i-pr189-sync-staged-ba167f35-${{ github.run_attempt }}
          path: ${{ runner.temp }}/59i-pr189-evidence
          if-no-files-found: error
          retention-days: 21

name: Increment 53e generic native Component support

on:
  push:
    branches:
      - agent/increment-53e-generic-domain-proof-final
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-53e-generic-final
  cancel-in-progress: false

jobs:
  validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-generic-domain-proof-final
          fetch-depth: 0

      - name: Configure checkout
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Apply all still-pending generic repairs
        shell: bash
        run: |
          set -euo pipefail
          patches=(
            morphhdl/scripts/apply-increment-53e-address-role-repair.py
            morphhdl/scripts/apply-increment-53e-implicit-child-width-formals.py
            morphhdl/scripts/apply-increment-53e-canonical-implicit-formal-identity.py
            morphhdl/scripts/apply-increment-53e-modular-literal-proof.py
            morphhdl/scripts/apply-increment-53e-materialized-auto-resize-proof.py
            morphhdl/scripts/apply-increment-53e-unfixed-literal-width-inference.py
            morphhdl/scripts/apply-increment-53e-full-domain-width-equivalence.py
            morphhdl/scripts/apply-increment-53e-generic-domain-proof.py
            morphhdl/scripts/apply-increment-53e-generic-native-int-selection.py
            morphhdl/scripts/apply-increment-53e-generic-native-int-selection-v2.py
          )
          for patch in "${patches[@]}"; do
            if test -f "$patch"; then
              python3 "$patch"
            fi
          done
          git diff --check

      - name: Prove genericity and native source preservation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only | grep -E '^(core|lib|idslplugin)/src/main/'; then
            echo 'Upstream SpinalHDL production source was modified.' >&2
            exit 1
          fi

          generic_files=(
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala
            morphruntime/src/main/scala/spinal/core/ExternalNativeIntShadowRegistry.scala
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogHierarchy.scala
            morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogMemories.scala
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedAutoResize.scala
          )
          for file in "${generic_files[@]}"; do
            test -f "$file"
            if grep -E 'StreamFifo(CC)?|BufferCC' "$file"; then
              echo "Component-specific recognition remains in generic implementation file $file" >&2
              exit 1
            fi
          done

          plugin=morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala
          grep -q 'isGenericNativeIntComponent' "$plugin"
          grep -q 'integerParameters == 1' "$plugin"
          grep -q 'base.fullName == "spinal.core.Component"' "$plugin"
          runtime=morphruntime/src/main/scala/spinal/core/ExternalNativeIntShadowRegistry.scala
          grep -q 'constructorArgumentReference' "$runtime"
          grep -q 'definitionExpressionRootOf' "$runtime"
          fallback=morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala
          grep -q 'provesEquivalentAcrossCompleteDomain' "$fallback"

      - name: Install pinned Mill
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Compile and run focused Scala 2.12 validation
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill 'morph[2.12.18].testOnly' \
            morphhdl.ParameterizedStreamFifoCCTests \
            2>&1 | tee /tmp/increment-53e-generic-native-2.12.log

      - name: Compile and run focused Scala 2.13 validation
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill 'morph[2.13.12].testOnly' \
            morphhdl.ParameterizedStreamFifoCCTests \
            2>&1 | tee /tmp/increment-53e-generic-native-2.13.log

      - name: Run inherited StreamFifo formal-structure regression
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill 'morph[2.12.18].testOnly' \
            morphhdl.NativeStreamFifoFormalEquivalenceTests \
            2>&1 | tee /tmp/increment-53e-inherited-formal-structure.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53e-generic-native-component-evidence
          path: /tmp/increment-53e-*.log
          if-no-files-found: ignore

      - name: Publish passing generic implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/increment-53e-address-resize-fix.yml
          rm -f .github/workflows/increment-53e-generic-domain-proof.yml
          rm -f .github/workflows/increment-53e-generic-native-selection.yml
          rm -f morphhdl/scripts/apply-increment-53e-address-role-repair.py
          rm -f morphhdl/scripts/apply-increment-53e-implicit-child-width-formals.py
          rm -f morphhdl/scripts/apply-increment-53e-canonical-implicit-formal-identity.py
          rm -f morphhdl/scripts/apply-increment-53e-modular-literal-proof.py
          rm -f morphhdl/scripts/apply-increment-53e-materialized-auto-resize-proof.py
          rm -f morphhdl/scripts/apply-increment-53e-unfixed-literal-width-inference.py
          rm -f morphhdl/scripts/apply-increment-53e-full-domain-width-equivalence.py
          rm -f morphhdl/scripts/apply-increment-53e-generic-domain-proof.py
          rm -f morphhdl/scripts/apply-increment-53e-generic-native-int-selection.py
          rm -f morphhdl/scripts/apply-increment-53e-generic-native-int-selection-v2.py
          git add -A
          git diff --cached --check
          git commit -m 'Increment 53e: generalize native symbolic parameterization'

          for attempt in 1 2 3; do
            if git push origin HEAD:agent/increment-53e-generic-domain-proof-final; then
              exit 0
            fi
            git pull --rebase origin agent/increment-53e-generic-domain-proof-final
          done
          exit 1

name: WA-04 guarded completion and merge

on:
  push:
    branches:
      - agent/wa-04-unnamed-simple-wire-elimination
    paths:
      - ".github/workflows/wa04-complete-and-merge.yml"

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: wa04-guarded-completion
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out WA-04 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require green implementation head, create and prove closure, then merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: "138"
          REQUIRED_WORKFLOW: "morphhdl-passes.yml"
        shell: bash
        run: |
          set -euo pipefail

          poll_required_workflow() {
            local sha="$1"
            local label="$2"
            local attempts=0
            local max_attempts=540
            while (( attempts < max_attempts )); do
              attempts=$((attempts + 1))
              local runs
              runs="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/workflows/${REQUIRED_WORKFLOW}/runs?head_sha=${sha}&per_page=20")"
              local record
              record="$(python3 -c '
import json, sys
value = json.load(sys.stdin)
runs = sorted(value.get("workflow_runs", []), key=lambda item: item.get("created_at", ""), reverse=True)
if runs:
    run = runs[0]
    print("\t".join([str(run.get("id", "")), str(run.get("status", "")), str(run.get("conclusion") or "")]))
' <<<"${runs}")"
              if [[ -z "${record}" ]]; then
                echo "${label}: waiting for ${REQUIRED_WORKFLOW} run on ${sha}"
                sleep 10
                continue
              fi
              local run_id status conclusion
              IFS=$'\t' read -r run_id status conclusion <<<"${record}"
              echo "${label}: run=${run_id} status=${status} conclusion=${conclusion:-pending}"
              if [[ "${status}" == "completed" ]]; then
                if [[ "${conclusion}" != "success" ]]; then
                  echo "${label}: required workflow failed with conclusion ${conclusion}" >&2
                  exit 1
                fi
                printf '%s\n' "${run_id}"
                return 0
              fi
              sleep 10
            done
            echo "${label}: timed out waiting for ${REQUIRED_WORKFLOW} on ${sha}" >&2
            exit 1
          }

          current_head="$(git rev-parse HEAD)"
          implementation_head="$(git rev-parse HEAD^)"
          pr_json="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          python3 - "${current_head}" <<'PY' <<<"${pr_json}"
          import json, sys
          current = sys.argv[1]
          pr = json.load(sys.stdin)
          if pr.get("state") != "open" or pr.get("merged"):
              raise SystemExit("WA-04 pull request is not open and unmerged")
          if pr.get("head", {}).get("sha") != current:
              raise SystemExit("WA-04 branch moved after closure gate checkout")
          if pr.get("base", {}).get("ref") != "parameterized-verilog":
              raise SystemExit("WA-04 pull request no longer targets parameterized-verilog")
          PY

          implementation_run="$(poll_required_workflow "${implementation_head}" "implementation head")"
          echo "Implementation workflow ${implementation_run} succeeded."

          python3 - <<'PY'
          from pathlib import Path
          import re

          roadmap = Path("morphhdl-passes/morphhdl-ir-wire-assignment-passes-todo.md")
          text = roadmap.read_text(encoding="utf-8")
          entry = re.compile(
              r"^- \[(?P<checked>[ xX])\] \*\*(?P<id>WA-[0-9]+)\s+—(?P<body>[\s\S]*?)(?=^- \[[ xX]\] \*\*WA-[0-9]+\s+—|\Z)",
              re.MULTILINE,
          )
          matches = {match.group("id"): match for match in entry.finditer(text)}
          if "WA-04" not in matches or "WA-05" not in matches:
              raise SystemExit("WA-04 or WA-05 roadmap entry is missing")
          wa04 = matches["WA-04"]
          wa05 = matches["WA-05"]
          if wa04.group("checked").lower() == "x":
              raise SystemExit("WA-04 is already checked before guarded closure")
          if "**Status:** `READY`." not in wa04.group(0):
              raise SystemExit("WA-04 is not READY before guarded closure")
          if "**Status:** `BLOCKED` by WA-04." not in wa05.group(0):
              raise SystemExit("WA-05 is not BLOCKED by WA-04 before guarded closure")
          wa04_new = wa04.group(0).replace("- [ ] **WA-04 —", "- [x] **WA-04 —", 1).replace("**Status:** `READY`.", "**Status:** `COMPLETED`.", 1)
          wa05_new = wa05.group(0).replace("**Status:** `BLOCKED` by WA-04.", "**Status:** `READY`.", 1)
          updated = text[:wa04.start()] + wa04_new + text[wa04.end():wa05.start()] + wa05_new + text[wa05.end():]
          if updated.count("- [x] **WA-04 —") != 1:
              raise SystemExit("WA-04 closure checkbox update is not unique")
          roadmap.write_text(updated, encoding="utf-8")
          PY

          rm -f morphhdl-passes/wa04-final-head-trigger.txt
          rm -f .github/workflows/wa04-complete-and-merge.yml

          python3 morphhdl-passes/scripts/check-wa03-gates.py --self-test
          python3 morphhdl-passes/scripts/check-wa03-gates.py
          python3 morphhdl-passes/scripts/check-wa04-pass.py --self-test
          python3 morphhdl-passes/scripts/check-wa04-pass.py
          python3 morphhdl-passes/scripts/validate_wire_assignment_equivalence.py --self-test
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "WA-04: mark unnamed alias elimination complete"
          closure_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          closure_run="$(poll_required_workflow "${closure_sha}" "closure head")"
          echo "Closure workflow ${closure_run} succeeded."

          merge_json="$(gh api --method PUT -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" -f merge_method=merge -f sha="${closure_sha}" -f commit_title='Merge WA-04 unnamed simple-wire assignment elimination')"
          python3 - "${implementation_head}" "${closure_sha}" "${implementation_run}" "${closure_run}" <<'PY' <<<"${merge_json}"
          import json, sys
          implementation, closure, implementation_run, closure_run = sys.argv[1:]
          result = json.load(sys.stdin)
          if result.get("merged") is not True:
              raise SystemExit("WA-04 merge API did not report success: " + str(result))
          print("WA04_COMPLETED")
          print("implementation_sha=" + implementation)
          print("closure_sha=" + closure)
          print("implementation_run=" + implementation_run)
          print("closure_run=" + closure_run)
          print("merge_sha=" + str(result.get("sha", "")))
          PY

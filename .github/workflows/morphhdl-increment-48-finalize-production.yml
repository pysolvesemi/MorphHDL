name: Finalize Increment 48 production implementation

on:
  pull_request:
    branches: [parameterized-verilog]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/increment-48-completion'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SBT_TEST_PARALLEL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-48-completion
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Install strict Verilog-2001 validator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V

      - name: Recover the last concrete Increment 48 implementation snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin parameterized-verilog agent/increment-48-natural-symbolic-conditionals
          test "$(git merge-base HEAD origin/parameterized-verilog)" = "$(git rev-parse origin/parameterized-verilog)"

          python3 <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          old_ref = "origin/agent/increment-48-natural-symbolic-conditionals"

          def run(*args: str, text: bool = True) -> str:
              return subprocess.check_output(args, cwd=root, text=text).strip()

          def exists(commit: str, path: str) -> bool:
              return subprocess.run(
                  ["git", "cat-file", "-e", f"{commit}:{path}"],
                  cwd=root,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              ).returncode == 0

          helper_path = "frontend/src/main/scala/morphhdl/frontend/NaturalSymbolicConditional.scala"
          test_path = "morphhdl/src/test/scala/morphhdl/NaturalSymbolicConditionalTests.scala"
          doc_path = "docs/morphhdl/increment-48-natural-symbolic-conditionals.md"

          selected = None
          selected_component = None
          for commit in run("git", "rev-list", old_ref).splitlines():
              if not (exists(commit, helper_path) and exists(commit, test_path)):
                  continue
              helper = run("git", "show", f"{commit}:{helper_path}")
              if "delegate probe" in helper or "Increment 48 delegate probe" in helper:
                  continue
              if "NaturalSymbolicConditional" not in helper or "ParameterizedStructure" not in helper:
                  continue
              paths = run("git", "ls-tree", "-r", "--name-only", commit).splitlines()
              components = [
                  path for path in paths
                  if path.endswith("MorphHdlNaturalSymbolicConditionalComponent.scala")
              ]
              if len(components) != 1:
                  continue
              selected = commit
              selected_component = components[0]
              break

          if selected is None or selected_component is None:
              raise SystemExit("No concrete, non-probe Increment 48 implementation snapshot exists in the reviewed branch history")

          print(f"Selected historical implementation snapshot {selected}")
          print(f"Selected compiler component {selected_component}")

          def restore(commit: str, source: str, destination: str) -> None:
              data = subprocess.check_output(["git", "show", f"{commit}:{source}"], cwd=root)
              path = root / destination
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)

          restore(selected, helper_path, helper_path)
          restore(selected, test_path, test_path)
          if exists(selected, doc_path):
              restore(selected, doc_path, doc_path)

          component_text = run("git", "show", f"{selected}:{selected_component}")
          component_text, count = re.subn(
              r"(?m)^\s*package\s+[A-Za-z0-9_.]+\s*$",
              "package morphhdl.compiler",
              component_text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not relocate the historical compiler component into the MorphHDL-owned plugin module")
          component_destination = root / "morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNaturalSymbolicConditionalComponent.scala"
          component_destination.parent.mkdir(parents=True, exist_ok=True)
          component_destination.write_text(component_text)

          plugin = root / "morphplugin/src/main/scala/morphhdl/compiler/MorphHdlPlugin.scala"
          plugin.write_text(
              """package morphhdl.compiler

import scala.tools.nsc.Global
import scala.tools.nsc.plugins.Plugin

/** MorphHDL-owned compiler plugin. Native SpinalHDL compiler sources remain untouched. */
final class MorphHdlPlugin(val global: Global) extends Plugin {
  override val name: String = "morphhdl"
  override val description: String =
    "Typed MorphHDL source transformations for parameter-preserving elaboration"
  override val components =
    List(new MorphHdlNaturalSymbolicConditionalComponent(global))
}
"""
          )

          descriptor = root / "morphplugin/src/main/resources/scalac-plugin.xml"
          descriptor.parent.mkdir(parents=True, exist_ok=True)
          descriptor.write_text(
              """<plugin>
  <name>morphhdl</name>
  <classname>morphhdl.compiler.MorphHdlPlugin</classname>
</plugin>
"""
          )

          # Keep the permanent documentation precise about the separated plugin boundary.
          (root / doc_path).write_text(
              """# Increment 48 — Natural symbolic conditionals for explicit `HdlInt`/`HdlBool`

Increment 48 adds a MorphHDL-owned Scala compiler plugin that redirects natural
Scala `if` syntax in explicitly MorphHDL-aware source units to a typed frontend
bridge. The typed macro proves the condition as either ordinary Scala `Boolean`
or explicit `morphhdl.frontend.HdlBool`.

Ordinary `Boolean` expands back to a normal Scala `if`. Explicit `HdlBool`
retains both by-name alternatives through the existing generic structural
capture boundary, preserving the witness-selected ordinary Spinal elaboration
path while lowering the complete alternatives to parameter-controlled strict
Verilog-2001 structure. Chained `else if` remains ordered nested structure.

No implicit `HdlBool`-to-`Boolean` witness conversion is introduced. Non-local
`return` and `throw` fail closed with stable diagnostics. The broader nested
side-effect contract remains assigned to Increment 52. The implementation does
not modify upstream-owned SpinalHDL compiler, core, or library source files.
"""
          )

          # Add the separate plugin project to sbt without editing the native idslplugin project.
          sbt_path = root / "build.sbt"
          sbt = sbt_path.read_text()
          if "lazy val morphplugin" not in sbt:
              marker = "lazy val sim = (project in file(\"sim\"))"
              if marker not in sbt:
                  raise SystemExit("build.sbt insertion marker for morphplugin was not found")
              project = """lazy val morphplugin = (project in file(\"morphplugin\"))
  .settings(
    defaultSettings,
    name := \"MorphHDL-compiler-plugin\",
    exportJars := true,
    libraryDependencies += \"org.scala-lang\" % \"scala-compiler\" % scalaVersion.value,
    publish / skip := true
  )

"""
              sbt = sbt.replace(marker, project + marker, 1)

          aggregate_match = re.search(r"\.aggregate\(([^)]*)\)", sbt)
          if aggregate_match and "morphplugin" not in aggregate_match.group(1):
              replacement = aggregate_match.group(0).replace("idslplugin,", "idslplugin, morphplugin,", 1)
              sbt = sbt[: aggregate_match.start()] + replacement + sbt[aggregate_match.end() :]

          plugin_setting = """  scalacOptions += (idslplugin / Compile / packageBin / artifactPath).map { file =>
    s\"-Xplugin:${file.getAbsolutePath}\"
  }.value
)"""
          dual_plugin_setting = """  scalacOptions += (idslplugin / Compile / packageBin / artifactPath).map { file =>
    s\"-Xplugin:${file.getAbsolutePath}\"
  }.value,
  scalacOptions += (morphplugin / Compile / packageBin / artifactPath).map { file =>
    s\"-Xplugin:${file.getAbsolutePath}\"
  }.value
)"""
          if "morphplugin / Compile / packageBin" not in sbt:
              if plugin_setting not in sbt:
                  raise SystemExit("build.sbt defaultSettingsWithPlugin block was not recognized")
              sbt = sbt.replace(plugin_setting, dual_plugin_setting, 1)
          sbt_path.write_text(sbt)

          # Add the same plugin module and plugin JAR option to Mill.
          mill_path = root / "build.mill"
          mill = mill_path.read_text()
          if "object morphplugin extends Cross[MorphPlugin]" not in mill:
              marker = "object frontend extends Cross[Frontend](SpinalVersion.compilers)"
              if marker not in mill:
                  raise SystemExit("build.mill insertion marker for morphplugin was not found")
              module = """object morphplugin extends Cross[MorphPlugin](SpinalVersion.compilers) {
  def defaultCrossSegments = Seq(SpinalVersion.compilers.head)
}
trait MorphPlugin extends SpinalModule {
  override def mvnDeps = super.mvnDeps() ++ Seq(
    mvn\"org.scala-lang:scala-compiler:${crossScalaVersion}\"
  )
}

"""
              mill = mill.replace(marker, module + marker, 1)

          if "-Xplugin:${morphplugin" not in mill:
              method = re.search(r"def\s+modulePluginOptions\s*\([^)]*\)\s*=\s*Seq\s*\(", mill)
              if method is None:
                  raise SystemExit("build.mill modulePluginOptions method was not found")
              opening = mill.find("(", method.start(), method.end())
              depth = 0
              closing = None
              in_string = False
              escaped = False
              for index in range(opening, len(mill)):
                  char = mill[index]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == '"':
                          in_string = False
                      continue
                  if char == '"':
                      in_string = True
                  elif char == "(":
                      depth += 1
                  elif char == ")":
                      depth -= 1
                      if depth == 0:
                          closing = index
                          break
              if closing is None:
                  raise SystemExit("build.mill modulePluginOptions Seq was unterminated")
              body = mill[opening + 1 : closing]
              candidates = re.findall(r's\"-Xplugin:\$\{[^\"]*idslplugin[^\"]*\}\"', body)
              if len(candidates) != 1:
                  raise SystemExit("build.mill idslplugin option could not be cloned deterministically")
              morph_option = candidates[0].replace("idslplugin", "morphplugin")
              separator = "" if not body.strip() else ","
              mill = mill[:closing] + separator + "\n      " + morph_option + "\n    " + mill[closing:]
          mill_path.write_text(mill)

          # Permanent boundary guard.
          guard = root / "morphhdl/scripts/check-natural-symbolic-conditional-boundary.sh"
          guard.parent.mkdir(parents=True, exist_ok=True)
          guard.write_text(
              """#!/usr/bin/env bash
set -euo pipefail
root=$(git rev-parse --show-toplevel)
cd \"${root}\"

for path in \"$@\"; do
  case \"${path}\" in
    core/src/main/scala/*|lib/src/main/scala/*|idslplugin/src/main/scala/*)
      echo \"Increment 48 may not modify upstream-owned native source: ${path}\" >&2
      exit 1
      ;;
  esac
done

if grep -RInE 'implicit[[:space:]]+(def|val|object).*HdlBool.*Boolean|implicit[[:space:]]+conversion.*HdlBool' \\
    frontend/src/main/scala morphplugin/src/main/scala; then
  echo 'Implicit HdlBool-to-Boolean witness conversion is forbidden' >&2
  exit 1
fi

test -f morphplugin/src/main/scala/morphhdl/compiler/MorphHdlPlugin.scala
test -f morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNaturalSymbolicConditionalComponent.scala
test -f frontend/src/main/scala/morphhdl/frontend/NaturalSymbolicConditional.scala
test -f morphhdl/src/test/scala/morphhdl/NaturalSymbolicConditionalTests.scala
test ! -e .github/increment48
test -z \"$(find .github/workflows -maxdepth 1 -type f -name 'morphhdl-increment-48-*' -print -quit)\"
test ! -e tmp-increment48-completion-trigger.txt
test ! -e tmp-tool-probe.txt
"""
          )
          guard.chmod(0o755)

          workflow = root / ".github/workflows/morphhdl-natural-symbolic-conditionals.yml"
          workflow.parent.mkdir(parents=True, exist_ok=True)
          workflow.write_text(
              """name: MorphHDL natural symbolic conditionals

on:
  pull_request:
    branches: [parameterized-verilog]
    paths:
      - 'morphplugin/**'
      - 'frontend/**'
      - 'morphhdl/**'
      - 'build.sbt'
      - 'build.mill'
      - 'docs/morphhdl/parameterized-verilog-todo.md'
      - '.github/workflows/morphhdl-natural-symbolic-conditionals.yml'
  push:
    branches: [parameterized-verilog]

permissions:
  contents: read

jobs:
  natural-symbolic-conditionals:
    strategy:
      fail-fast: false
      matrix:
        scala: ['2.12.18', '2.13.12']
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SBT_TEST_PARALLEL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Install strict Verilog-2001 validator
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Check ownership, cleanup, and witness boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin parameterized-verilog
          mapfile -t changed < <(git diff --name-only origin/parameterized-verilog...HEAD)
          morphhdl/scripts/check-natural-symbolic-conditional-boundary.sh \"${changed[@]}\"
          test \"$(git diff --name-only origin/parameterized-verilog...HEAD -- core/src/main/scala lib/src/main/scala idslplugin/src/main/scala | wc -l)\" -eq 0
      - name: Run Increment 48 contracts
        run: sbt --batch --no-server '++${{ matrix.scala }}' 'morph/testOnly morphhdl.NaturalSymbolicConditionalTests'
"""
          )

          # Remove all recovery/export machinery merged by the incomplete PR and this one-shot workflow.
          recovery_dir = root / ".github/increment48"
          if recovery_dir.exists():
              for path in sorted(recovery_dir.rglob("*"), reverse=True):
                  if path.is_file() or path.is_symlink():
                      path.unlink()
                  elif path.is_dir():
                      path.rmdir()
              recovery_dir.rmdir()

          workflows = root / ".github/workflows"
          for path in workflows.glob("morphhdl-increment-48-*.yml"):
              path.unlink()
          for name in ("tmp-increment48-completion-trigger.txt", "tmp-tool-probe.txt"):
              path = root / name
              if path.exists():
                  path.unlink()

          todo_path = root / "docs/morphhdl/parameterized-verilog-todo.md"
          todo = todo_path.read_text()
          old = "- [ ] **Increment 48 — Natural symbolic conditionals for explicit `HdlInt`/`HdlBool`**"
          new = "- [x] **Increment 48 — Natural symbolic conditionals for explicit `HdlInt`/`HdlBool`**"
          if old not in todo:
              if new not in todo:
                  raise SystemExit("Increment 48 TODO entry was not found")
          else:
              todo = todo.replace(old, new, 1)
              todo_path.write_text(todo)
          PY

      - name: Verify permanent source scope before compilation
        shell: bash
        run: |
          set -euo pipefail
          test -f morphplugin/src/main/scala/morphhdl/compiler/MorphHdlPlugin.scala
          test -f morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNaturalSymbolicConditionalComponent.scala
          test -f frontend/src/main/scala/morphhdl/frontend/NaturalSymbolicConditional.scala
          test -f morphhdl/src/test/scala/morphhdl/NaturalSymbolicConditionalTests.scala
          test ! -e .github/increment48
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'morphhdl-increment-48-*' -print -quit)"
          test "$(git diff --name-only origin/parameterized-verilog...HEAD -- core/src/main/scala lib/src/main/scala idslplugin/src/main/scala | wc -l)" -eq 0
          git diff --check

      - name: Validate Increment 48 on Scala 2.12.18
        run: >-
          sbt --batch --no-server
          '++2.12.18'
          'morphplugin/compile'
          'frontend/compile'
          'morph/testOnly morphhdl.NaturalSymbolicConditionalTests'

      - name: Validate Increment 48 on Scala 2.13.12
        run: >-
          sbt --batch --no-server
          '++2.13.12'
          'morphplugin/compile'
          'frontend/compile'
          'morph/testOnly morphhdl.NaturalSymbolicConditionalTests'

      - name: Run inherited preservation regressions
        run: >-
          sbt --batch --no-server
          '++2.12.18'
          'morph/testOnly
          morphhdl.StructuralGenerateControlTests
          morphhdl.GenericProcessLoweringTests
          morphhdl.MorphSingleSourceVerilogTests
          morphhdl.NativeLibraryReuseTests
          morphhdl.NativeSymbolicMemoryTests
          morphhdl.ParameterizedStreamFifoDepthTests'

      - name: Commit the validated permanent implementation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t deleted < <(git status --porcelain | awk '$1 ~ /D/ {print substr($0,4)}')
          if ((${#deleted[@]})); then
            git add -u -- "${deleted[@]}"
          fi
          mapfile -t existing < <(git status --porcelain | awk '$1 !~ /D/ {print substr($0,4)}')
          if ((${#existing[@]})); then
            git add -- "${existing[@]}"
          fi
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Complete Increment 48 natural symbolic conditionals'
          git push origin HEAD:agent/increment-48-completion

name: Increment 53e StreamFifoCC focused bootstrap

on:
  push:
    branches:
      - agent/increment-53e-streamfifo-cc-parameterization

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    timeout-minutes: 90
    env:
      MORPHDL_STREAMFIFOCC_DEBUG_DIR: /tmp/morphhdl-streamfifocc-debug
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-streamfifo-cc-parameterization
          fetch-depth: 0

      - name: Fetch reviewed prior diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin agent/increment-53d-native-streamfifocc-parameterization:refs/remotes/origin/agent/increment-53d-native-streamfifocc-parameterization
          git show origin/agent/increment-53d-native-streamfifocc-parameterization:.github/workflows/increment-53d-streamfifocc-bootstrap.yml > /tmp/reviewed.yml
          git show origin/agent/increment-53d-native-streamfifocc-parameterization:morphhdl/src/test/scala/morphhdl/ParameterizedStreamFifoCCDepthTests.scala > morphhdl/src/test/scala/morphhdl/ParameterizedStreamFifoCCDepthTests.scala

      - name: Apply dual-clock lowering and exact connection-shape provenance
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply53e.py <<'PY'
          from pathlib import Path
          import textwrap

          reviewed = Path('/tmp/reviewed.yml').read_text()
          begin_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          begin = reviewed.index(begin_marker) + len(begin_marker)
          end = reviewed.index(end_marker, begin)
          patch = textwrap.dedent(reviewed[begin:end])
          stale = '"  private def alwaysBlocks(\\n",'
          if patch.count(stale) == 1:
              patch = patch.replace(stale, '"  private def alwaysBlocks",')
          exec(compile(patch, 'increment-53e-reviewed-dual-clock-patch', 'exec'), {'__name__': '__main__'})

          plugin_path = Path(
              'morphplugin/src/main/scala/morphhdl/compiler/'
              'MorphHdlNativeIntShadowExpressionComponent.scala'
          )
          plugin = plugin_path.read_text()

          connection_method_marker = '''    private def nativeValueCarrier(
          '''
          connection_method = '''    private def rewriteNativeAssignment(
              original: Tree,
              target: Tree,
              source: Tree
            ): Rewrite = {
              val transformedTarget = transform(target)
              val transformedSource = transform(source)
              Rewrite(
                call(
                  "compilerAssign",
                  List(transformedTarget, transformedSource),
                  original
                )
              )
            }

          '''
          if plugin.count(connection_method_marker) != 1:
              raise SystemExit('nativeValueCarrier insertion marker is ambiguous')
          plugin = plugin.replace(
              connection_method_marker,
              connection_method + connection_method_marker,
              1,
          )

          assignment_case = '''        case Apply(Select(target, operatorName), List(source))
              if inNativeStreamFifo && decoded(operatorName) == ":=" =>
            rewriteNativeAssignment(tree, target, source)
          '''
          rewrite_expression = plugin.index('    private def rewriteExpression(')
          tree_match_marker = '      tree match {\n'
          tree_match = plugin.index(tree_match_marker, rewrite_expression) + len(tree_match_marker)
          plugin = plugin[:tree_match] + assignment_case + plugin[tree_match:]
          plugin_path.write_text(plugin)

          runtime_path = Path(
              'morphruntime/src/main/scala/spinal/core/'
              'ExternalNativeIntCompilerRuntime.scala'
          )
          runtime = runtime_path.read_text()
          package_marker = 'package spinal.core\n\n'
          if runtime.count(package_marker) != 1:
              raise SystemExit('runtime package marker is ambiguous')
          runtime = runtime.replace(
              package_marker,
              package_marker + 'import java.util.IdentityHashMap\n\n',
              1,
          )

          runtime_marker = '''  def compilerUnsupportedInt(
          '''
          runtime_connection = '''  private def exactParameterizedShapeSource(
              prototype: BaseType
            ): Option[BaseType] = {
              val seen = new IdentityHashMap[
                spinal.core.internals.Expression,
                java.lang.Boolean
              ]()
              var selected: BaseType = null

              def visit(expression: spinal.core.internals.Expression): Unit = {
                if (
                  selected == null &&
                  seen.put(expression, java.lang.Boolean.TRUE) == null
                ) {
                  expression match {
                    case value: BaseType
                        if value.getClass == prototype.getClass &&
                          value.getBitsWidth == prototype.getBitsWidth &&
                          ParameterizedWidth
                            .expressionOf(value)
                            .exists { width =>
                              width.parameters.nonEmpty &&
                              width.default == BigInt(prototype.getBitsWidth) &&
                              width.minimum >= 1 &&
                              width.maximum >= width.minimum
                            } =>
                      selected = value
                    case _ =>
                  }
                  if (selected == null) {
                    expression match {
                      case base: BaseType =>
                        base.foreachStatements {
                          case spinal.core.internals.AssignmentStatement(_, source) =>
                            visit(source)
                          case _ =>
                        }
                      case _ =>
                    }
                    if (selected == null) expression.foreachExpression(visit)
                  }
                }
              }

              visit(prototype)
              Option(selected)
            }

            private def retainAssignmentShape(target: Data, source: Data): Unit = {
              val targetLeaves = target.flatten.toVector
              val sourceLeaves = source.flatten.toVector
              if (targetLeaves.size == sourceLeaves.size) {
                sourceLeaves.zip(targetLeaves).foreach {
                  case (from, to)
                      if from.getClass == to.getClass &&
                        from.getBitsWidth == to.getBitsWidth =>
                    exactParameterizedShapeSource(from).foreach { retained =>
                      ParameterizedWidth.copy(retained, to)
                    }
                  case _ =>
                }
              }
            }

            def compilerAssign[T](
              target: Data,
              source: T
            )(implicit loc: spinal.idslplugin.Location): Unit = {
              if (boundaryActive) {
                source match {
                  case data: Data => retainAssignmentShape(target, data)
                  case _ =>
                }
              }
              target.assignFrom(source.asInstanceOf[AnyRef])
            }

          '''
          if runtime.count(runtime_marker) != 1:
              raise SystemExit('runtime compilerUnsupportedInt marker is ambiguous')
          runtime = runtime.replace(
              runtime_marker,
              runtime_connection + runtime_marker,
              1,
          )
          runtime_path.write_text(runtime)

          memory_path = Path(
              'morphhdl/src/main/scala/spinal/core/internals/'
              'ParameterizedVerilogMemories.scala'
          )
          memory = memory_path.read_text()
          start_marker = '    val driverProvesNativeWidth = address match {'
          start = memory.index(start_marker)
          end = memory.index('\n    if (', start)
          replacement = '''    val driverWidths = exactSymbolicDriverWidths(address)
            val driverProvesNativeWidth =
              driverWidths.size == 1 && equivalentWidth(driverWidths.head, native)
          '''
          memory = memory[:start] + replacement + memory[end:]

          insertion = '''  private def exactSymbolicDriverWidths(
              expression: Expression with WidthProvider
            ): Vector[ElaborationIntegerExpression] = {
              val seen = new IdentityHashMap[Expression, java.lang.Boolean]()
              val retained = ArrayBuffer.empty[ElaborationIntegerExpression]

              def walk(value: Expression): Unit = {
                if (seen.put(value, java.lang.Boolean.TRUE) == null) {
                  value match {
                    case base: BaseType =>
                      ParameterizedWidth.expressionOf(base) match {
                        case Some(width) if width.parameters.nonEmpty =>
                          retained += width
                        case _ =>
                          base.foreachStatements {
                            case assignment: DataAssignmentStatement =>
                              assignment.source match {
                                case driver: Expression => walk(driver)
                                case _ =>
                              }
                            case _ =>
                          }
                      }
                    case other => other.foreachExpression(walk)
                  }
                }
              }

              walk(expression)
              retained
                .groupBy { width =>
                  (
                    compact(width.verilog),
                    width.default,
                    width.minimum,
                    width.maximum,
                    width.parameters.sortBy(_.name)
                  )
                }
                .values
                .map(_.head)
                .toVector
            }

          '''
          marker = '  private def selectAddressWidth(\n'
          if memory.count(marker) != 1:
              raise SystemExit('selectAddressWidth insertion marker is ambiguous')
          memory = memory.replace(marker, insertion + marker, 1)

          exact_marker = '''    val exact = compact(width.verilog) == compact(s"clog2(${depth.verilog}, 1)")'''
          exact_replacement = '''    val exact =
              compact(width.verilog) == compact(s"clog2(${depth.verilog}, 1)") ||
                compact(width.verilog) ==
                  compact(s"morphhdl_address_width(${depth.verilog})")'''
          if memory.count(exact_marker) != 1:
              raise SystemExit('native address-width equivalence marker is ambiguous')
          memory = memory.replace(exact_marker, exact_replacement, 1)
          memory_path.write_text(memory)
          PY
          python3 /tmp/apply53e.py

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Run exact native diagnostic
        shell: bash
        run: |
          set -o pipefail
          /tmp/morphhdl-mill 'morph[2.12.18].testOnly' morphhdl.ParameterizedStreamFifoCCDepthTests 2>&1 | tee /tmp/increment-53e-bootstrap.log

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53e-bootstrap-v8-evidence
          path: |
            /tmp/increment-53e-bootstrap.log
            /tmp/morphhdl-streamfifocc-debug
          if-no-files-found: ignore

      - name: Publish passing native implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/increment-53e-bootstrap-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Increment 53e: activate native StreamFifoCC symbolic depth'
          git push origin HEAD:agent/increment-53e-streamfifo-cc-parameterization

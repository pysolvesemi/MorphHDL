name: PR188 resume housekeeping
on:
  push:
    branches: [agent/independent-parameter-domain-composition]
    paths: ['.github/workflows/pr188-resume-housekeeping.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel-stale:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Cancel only obsolete source and housekeeping heads, never a later candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          repo = 'pysolvesemi/MorphHDL'
          branch = 'agent/independent-parameter-domain-composition'
          allowed = {'954fcc59eb3972706e8bd8a4bfb2c5b6a4baa781', '61211fbedadf30747e1d8a618643f767bbb4c399', os.environ['GITHUB_SHA']}
          self_run = int(os.environ['GITHUB_RUN_ID'])
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          base = 'https://api.github.com/repos/' + repo
          def request(path, method='GET'):
              req = urllib.request.Request(base + path, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=60) as response:
                  raw = response.read()
                  return response.status, json.loads(raw) if raw else None
          inventory = []
          for head in sorted(allowed):
              page = 1
              while True:
                  query = urllib.parse.urlencode({'branch': branch, 'head_sha': head, 'per_page': 100, 'page': page})
                  rows = request('/actions/runs?' + query)[1]['workflow_runs']
                  inventory.extend(rows)
                  if len(rows) < 100: break
                  page += 1
          results = []
          for run_id in sorted({row['id'] for row in inventory if row['status'] != 'completed'} - {self_run}):
              run = request('/actions/runs/' + str(run_id))[1]
              assert run['head_branch'] == branch and run['head_sha'] in allowed
              assert run['head_repository']['full_name'] == repo
              if run['status'] == 'completed': continue
              try:
                  code, _ = request('/actions/runs/' + str(run_id) + '/cancel', 'POST')
              except urllib.error.HTTPError as error:
                  if error.code != 409: raise
                  code = error.code
              results.append({'id': run_id, 'head_sha': run['head_sha'], 'status_before': run['status'], 'cancel_http_status': code})
          with open('evidence/cancellations.json', 'w') as output:
              json.dump({'branch': branch, 'obsolete_heads_only': sorted(allowed), 'protected_run': self_run, 'results': results}, output, indent=2)
          print(json.dumps(results, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr188-resume-cancellations-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

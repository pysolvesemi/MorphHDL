name: Prepare reviewed PR188 boundary and inventory correction
on:
  push:
    branches: [agent/independent-parameter-domain-composition]
    paths: ['.github/workflows/pr188-resume-housekeeping.yml']
permissions:
  actions: write
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reuse the exact audited correction with its prepublished workflow tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib, subprocess, textwrap
          anchor = '35ae59313c6f4c142a2f0c25937a20f7d6420270'
          path = '.github/workflows/pr188-resume-housekeeping.yml'
          raw = subprocess.check_output(['git', 'show', anchor + ':' + path])
          expected = '0888ce615830c2ea29fdbc651d567e33a9a72c9b'
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == expected
          source = textwrap.dedent(raw.decode().split("          python3 - <<'PY'\n", 1)[1].split('          PY\n', 1)[0])
          old = "assert git('rev-parse', 'HEAD^') == baseline"
          new = "assert git('rev-parse', 'HEAD^') == '35ae59313c6f4c142a2f0c25937a20f7d6420270'"
          assert source.count(old) == 1
          source = source.replace(old, new)
          source = source.replace('allowed = {baseline, start}', "allowed = {baseline, start, '35ae59313c6f4c142a2f0c25937a20f7d6420270'}")
          old = "    tree = api('/git/trees', {'base_tree': git('rev-parse', parent + '^{tree}'), 'tree': entries})"
          new = "    if git('rev-parse', sha + '^{tree}') == expected_tree:\n        tree = api('/git/trees/' + expected_tree)\n    else:\n" + '    ' + old
          assert source.count(old) == 1
          source = source.replace(old, new)
          old = 'upload_commit(source)\nupload_commit(final)'
          new = "run('git', 'bundle', 'create', str(evidence / 'prepared-source.bundle'), 'HEAD', '^' + start)\n(evidence / 'prepared.json').write_text(json.dumps({'status': 'source_checks_passed_NOT_objects_or_ref_confirmed', 'source': source, 'candidate': final, 'source_tree': expected_tree, 'candidate_tree': git('rev-parse', 'HEAD^{tree}'), 'updates': updates}, indent=2) + '\\n')\n" + old
          assert source.count(old) == 1
          source = source.replace(old, new)
          exec(compile(source, '<reviewed-pr188-candidate>', 'exec'))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr188-ci-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/pr188-ci-candidate/
          if-no-files-found: error

name: RTL-P1-01 SBT launcher export

on:
  push:
    branches:
      - agent/rtl-p1-01-toolchain-export
    paths:
      - .github/workflows/rtl-p1-01-sbt-launcher-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - name: Check out public toolchain branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and stage exact SBT 1.10.2 launcher
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/rtl-p1-01-sbt-launcher
          rm -rf "${out}"
          mkdir -p "${out}/bin" "${out}/launcher"
          cp "$(command -v sbt)" "${out}/bin/sbt"
          tmp=/tmp/rtl-p1-01-sbt-probe
          rm -rf "${tmp}"
          mkdir -p "${tmp}/project"
          printf 'sbt.version=1.10.2\n' > "${tmp}/project/build.properties"
          printf 'ThisBuild / scalaVersion := "2.12.18"\n' > "${tmp}/build.sbt"
          (cd "${tmp}" && sbt -batch -Dsbt.supershell=false 'show sbtVersion') | tee "${out}/sbt-version.log"
          grep -F '1.10.2' "${out}/sbt-version.log"
          launcher="$(find /sbt /github/home /root -type f -name 'sbt-launch-1.10.2.jar' 2>/dev/null | head -1)"
          test -n "${launcher}"
          test -s "${launcher}"
          cp "${launcher}" "${out}/launcher/sbt-launch-1.10.2.jar"
          printf 'launcher_source=%s\n' "${launcher}" > "${out}/launcher-origin.txt"
          sha256sum "${out}/bin/sbt" "${out}/launcher/sbt-launch-1.10.2.jar" "${out}/sbt-version.log" "${out}/launcher-origin.txt" > "${out}/SHA256SUMS"
          find "${out}" -type f -printf '%P %s bytes\n' | sort

      - name: Upload launcher state
        uses: actions/upload-artifact@v4
        with:
          name: rtl-p1-01-sbt-launcher-state-v2
          path: /tmp/rtl-p1-01-sbt-launcher
          if-no-files-found: error
          retention-days: 7

name: Increment 61 protected completion

on:
  push:
    branches: ['agent/increment-61-one-file-per-component']
    paths:
      - '.github/workflows/increment-61-protected-completion.yml'
      - 'docs/morphhdl/increment-61-one-file-per-component.md'
      - 'docs/morphhdl/parameterized-verilog-todo.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: increment-61-protected-completion
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare exact candidate head
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      head: ${{ steps.publish.outputs.head }}
      complete: ${{ steps.publish.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Seal completion workflow and audit composition
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-protected
          mkdir -p "$output"
          git rev-parse HEAD > "$output/staging-head.txt"
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path

          contract_path = Path('morphhdl/contracts/increment-61-source-review.json')
          checker_path = Path('morphhdl/scripts/check-increment-61-source-review.py')
          overlay_path = Path('morphhdl/scripts/check-typed-native-source-overlay.py')
          workflow_paths = {
              '.github/workflows/increment-61-resume-audit-composition.yml',
              '.github/workflows/increment-61-full-compatibility.yml',
              '.github/workflows/increment-61-protected-completion.yml',
          }
          wrapper = '''#!/usr/bin/env python3
          """Compose Increment 61 exact review with the sealed predecessor overlay audit."""
          from __future__ import annotations

          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          REVIEW = ROOT / "morphhdl/scripts/check-increment-61-source-review.py"
          HISTORICAL = "morphhdl/scripts/check-typed-native-source-overlay.py"


          def main() -> None:
              subprocess.run([sys.executable, str(REVIEW)], cwd=ROOT, check=True)
              base = subprocess.check_output(
                  [sys.executable, str(REVIEW), "--print-base"], cwd=ROOT, text=True
              ).strip()
              with tempfile.TemporaryDirectory(prefix="morphhdl-increment-61-overlay-") as temporary:
                  worktree = Path(temporary) / "predecessor"
                  subprocess.run(
                      ["git", "worktree", "add", "--detach", str(worktree), base],
                      cwd=ROOT,
                      check=True,
                      stdout=subprocess.DEVNULL,
                  )
                  try:
                      subprocess.run(
                          [sys.executable, str(worktree / HISTORICAL)],
                          cwd=worktree,
                          check=True,
                      )
                  finally:
                      subprocess.run(
                          ["git", "worktree", "remove", "--force", str(worktree)],
                          cwd=ROOT,
                          check=True,
                          stdout=subprocess.DEVNULL,
                      )
              print("Increment 61 exact source and sealed predecessor typed-overlay audits PASS")


          if __name__ == "__main__":
              main()
          '''
          wrapper = '\n'.join(line[10:] if line.startswith('          ') else line for line in wrapper.splitlines()) + '\n'

          contract = json.loads(contract_path.read_text())
          assert contract['schema'] == 1 and contract['increment'] == '61'
          base = contract['base_commit']
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          sha = lambda data: hashlib.sha256(data).hexdigest()

          overlay_path.write_text(wrapper)
          overlay_path.chmod(0o755)
          before = subprocess.check_output(['git', 'show', f'{base}:{overlay_path.as_posix()}'])
          reviewed = [entry for entry in contract['reviewed_files'] if entry['path'] != overlay_path.as_posix()]
          reviewed.append({
              'after_sha256': sha(overlay_path.read_bytes()),
              'before_sha256': sha(before),
              'mode': '100755',
              'path': overlay_path.as_posix(),
              'status': 'modified',
          })
          contract['reviewed_files'] = sorted(reviewed, key=lambda entry: entry['path'])
          audit = set(contract['audit_paths']) | workflow_paths
          audit.discard(overlay_path.as_posix())
          contract['audit_paths'] = sorted(audit)
          contract_path.write_text(json.dumps(contract, indent=2, sort_keys=False) + '\n')

          checker = checker_path.read_text()
          updated, count = re.subn(
              r'CONTRACT_SHA256 = "[0-9a-f]{64}"',
              f'CONTRACT_SHA256 = "{sha(contract_path.read_bytes())}"',
              checker,
              count=1,
          )
          assert count == 1
          checker_path.write_text(updated)
          PY
          chmod +x morphhdl/scripts/check-typed-native-source-overlay.py
          git add \
            morphhdl/contracts/increment-61-source-review.json \
            morphhdl/scripts/check-increment-61-source-review.py \
            morphhdl/scripts/check-typed-native-source-overlay.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit \
              -m '61: seal protected completion gate' \
              -m 'Authenticate the protected completion workflow and compose the complete current Increment 61 source review with the unchanged typed-overlay audit at its exact predecessor. No production RTL behavior changes.'
          fi
          python3 morphhdl/scripts/check-increment-61-source-review.py | tee "$output/source-review.log"
          python3 morphhdl/scripts/check-increment-61-source-review.py --self-test | tee "$output/source-review-self-test.log"
          python3 morphhdl/scripts/check-typed-native-source-overlay.py | tee "$output/overlay-composition.log"
          git rev-parse HEAD > "$output/prepared-head.txt"

      - name: Publish exact candidate head
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-protected
          original=$(cat "$output/staging-head.txt")
          remote=$(git ls-remote origin refs/heads/agent/increment-61-one-file-per-component | cut -f1)
          test "$remote" = "$original"
          if test "$(git rev-parse HEAD)" != "$original"; then
            git push origin HEAD:refs/heads/agent/increment-61-one-file-per-component
          fi
          head=$(git rev-parse HEAD)
          if grep -Fq -- '- [x] **Increment 61 — Parameterized `oneFilePerComponent` publication**' \
              docs/morphhdl/parameterized-verilog-todo.md; then
            complete=true
          else
            complete=false
          fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          echo "$head" > "$output/published-head.txt"
          echo "$complete" > "$output/completion-state.txt"
          git rev-parse 'HEAD^{tree}' > "$output/tree.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-61-protected-source-${{ github.run_id }}
          path: target/increment-61-protected
          if-no-files-found: error
          retention-days: 30

  regression:
    needs: prepare
    name: Protected full regression Scala ${{ matrix.scala }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        scala: ['2.12.18', '2.13.12']
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      SCALA_VERSION: ${{ matrix.scala }}
      SBT_TEST_PARALLEL: '0'
      JAVA_TOOL_OPTIONS: '-Xmx6G -XX:ActiveProcessorCount=4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Verify exact source and run complete MorphHDL tests
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-protected-regression
          mkdir -p "$output"
          test "$(git rev-parse HEAD)" = '${{ needs.prepare.outputs.head }}'
          git rev-parse HEAD > "$output/head.txt"
          python3 morphhdl/scripts/check-increment-61-source-review.py > "$output/source-review.log"
          python3 morphhdl/scripts/check-typed-native-source-overlay.py > "$output/overlay-review.log"
          sbt -batch "++$SCALA_VERSION" 'morph/Test/test' \
            > "$output/sbt.log" 2>&1 || { tail -n 500 "$output/sbt.log"; exit 1; }
          python3 - "$output" <<'PY'
          from pathlib import Path
          import json
          import sys
          import xml.etree.ElementTree as ET

          output = Path(sys.argv[1])
          reports = sorted(Path('morphhdl/target').rglob('TEST-*.xml'))
          assert reports, 'no test reports found'
          totals = {'report_files': len(reports), 'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          for report in reports:
              root = ET.parse(report).getroot()
              for key in ('tests', 'failures', 'errors', 'skipped'):
                  totals[key] += int(float(root.get(key, '0')))
          assert totals['tests'] > 0, totals
          assert totals['failures'] == totals['errors'] == totals['skipped'] == 0, totals
          (output / 'test-counts.json').write_text(json.dumps(totals, indent=2) + '\n')
          print(totals)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-61-protected-regression-${{ matrix.scala }}-${{ github.run_id }}
          path: |
            target/increment-61-protected-regression
            morphhdl/target/test-reports
          if-no-files-found: error
          retention-days: 30

  gate:
    needs: [prepare, regression]
    name: Final-head Actions gate and protected transition
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_HEAD: ${{ needs.prepare.outputs.head }}
      ALREADY_COMPLETE: ${{ needs.prepare.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head }}
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for every current-head workflow and retain exact evidence
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-protected-gate
          mkdir -p "$output"
          python3 - "$output/actions-runs.json" <<'PY'
          from __future__ import annotations

          import json
          import os
          import sys
          import time
          import urllib.parse
          import urllib.request

          output = sys.argv[1]
          repo = os.environ['GITHUB_REPOSITORY']
          head = os.environ['CANDIDATE_HEAD']
          current_run = int(os.environ['GITHUB_RUN_ID'])
          token = os.environ['GH_TOKEN']
          required = {
              'Increment 61 one-file-per-component publication',
              'Increment 60d pure SInt casts',
              'Increment 60g default signed Verilog',
          }
          allowed = {'success', 'skipped', 'neutral'}
          terminal_bad = {'failure', 'cancelled', 'timed_out', 'action_required', 'stale', 'startup_failure'}

          def fetch_runs():
              query = urllib.parse.urlencode({'head_sha': head, 'per_page': 100})
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs?{query}',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'MorphHDL-Increment-61-gate',
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  value = json.load(response)
              runs = []
              for run in value.get('workflow_runs', []):
                  if run.get('head_sha') != head or int(run['id']) == current_run:
                      continue
                  if run.get('name') == 'Increment 61 protected completion':
                      continue
                  runs.append({
                      'id': int(run['id']),
                      'name': run.get('name'),
                      'event': run.get('event'),
                      'status': run.get('status'),
                      'conclusion': run.get('conclusion'),
                      'html_url': run.get('html_url'),
                      'head_sha': run.get('head_sha'),
                  })
              return sorted(runs, key=lambda run: (run['name'] or '', run['event'] or '', run['id']))

          deadline = time.monotonic() + 5 * 60 * 60
          last = []
          while time.monotonic() < deadline:
              last = fetch_runs()
              names = {run['name'] for run in last}
              bad = [run for run in last if run['conclusion'] in terminal_bad]
              if bad:
                  raise SystemExit('current-head workflow failure: ' + json.dumps(bad, indent=2))
              pending = [run for run in last if run['status'] != 'completed']
              completed_bad = [
                  run for run in last
                  if run['status'] == 'completed' and run['conclusion'] not in allowed
              ]
              if completed_bad:
                  raise SystemExit('unsupported current-head workflow conclusion: ' + json.dumps(completed_bad, indent=2))
              if required.issubset(names) and not pending:
                  with open(output, 'w') as stream:
                      json.dump({'head': head, 'required': sorted(required), 'runs': last}, stream, indent=2)
                      stream.write('\n')
                  print(f'Increment 61 current-head gate PASS: {len(last)} workflow runs')
                  break
              print(
                  f'waiting for head {head}: required missing={sorted(required - names)}, '
                  f'pending={[(run["name"], run["event"], run["status"]) for run in pending]}',
                  flush=True,
              )
              time.sleep(30)
          else:
              raise SystemExit('timed out waiting for current-head workflows: ' + json.dumps(last, indent=2))
          PY
          git rev-parse HEAD > "$output/head.txt"
          test "$(cat "$output/head.txt")" = "$CANDIDATE_HEAD"
          python3 morphhdl/scripts/check-increment-61-source-review.py > "$output/source-review.log"
          python3 morphhdl/scripts/check-typed-native-source-overlay.py > "$output/overlay-review.log"

      - name: Publish documentation-only completion candidate
        if: env.ALREADY_COMPLETE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-protected-gate
          original=$(git rev-parse HEAD)
          remote=$(git ls-remote origin refs/heads/agent/increment-61-one-file-per-component | cut -f1)
          test "$remote" = "$original" && test "$original" = "$CANDIDATE_HEAD"
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from pathlib import Path

          roadmap_path = Path('docs/morphhdl/parameterized-verilog-todo.md')
          record_path = Path('docs/morphhdl/increment-61-one-file-per-component.md')
          contract_path = Path('morphhdl/contracts/increment-61-source-review.json')
          checker_path = Path('morphhdl/scripts/check-increment-61-source-review.py')
          evidence_path = Path('target/increment-61-protected-gate/actions-runs.json')

          roadmap = roadmap_path.read_text()
          pending = '- [ ] **Increment 61 — Parameterized `oneFilePerComponent` publication**'
          complete = '- [x] **Increment 61 — Parameterized `oneFilePerComponent` publication**'
          assert roadmap.count(pending) == 1 and complete not in roadmap
          roadmap_path.write_text(roadmap.replace(pending, complete, 1))

          evidence = json.loads(evidence_path.read_text())
          runs = evidence['runs']
          lines = '\n'.join(
              f"- `{run['name']}` ({run['event']}), run `{run['id']}`: `{run['conclusion']}`"
              for run in runs
          )
          record = record_path.read_text().rstrip() + '\n'
          marker = '## Qualified implementation completion candidate'
          assert marker not in record
          record += f'''\n\n{marker}\n\nThe implementation head `{evidence['head']}` passed the complete dual-Scala MorphHDL\nregression in the protected completion workflow and all current-head GitHub Actions\nruns below. The following commit changes only this completion record, the roadmap\ncheckbox and their exact source-review hashes; that final documentation head must\npass the same protected gate before PR #179 can merge.\n\n{lines}\n\nThe Scala and actual generated Verilog examples earlier in this document remain the\ncompletion demonstration. Increment 61 changes publication only; it does not create\na second parameter model or change the generated logic represented by the\nconsolidated Verilog.\n'''
          record_path.write_text(record)

          digest = lambda data: hashlib.sha256(data).hexdigest()
          contract = json.loads(contract_path.read_text())
          by_path = {entry['path']: entry for entry in contract['reviewed_files']}
          for path in (roadmap_path, record_path):
              assert path.as_posix() in by_path
              by_path[path.as_posix()]['after_sha256'] = digest(path.read_bytes())
          contract['reviewed_files'] = sorted(by_path.values(), key=lambda entry: entry['path'])
          contract_path.write_text(json.dumps(contract, indent=2, sort_keys=False) + '\n')

          checker = checker_path.read_text()
          updated, count = re.subn(
              r'CONTRACT_SHA256 = "[0-9a-f]{64}"',
              f'CONTRACT_SHA256 = "{digest(contract_path.read_bytes())}"',
              checker,
              count=1,
          )
          assert count == 1
          checker_path.write_text(updated)
          PY
          git add \
            docs/morphhdl/increment-61-one-file-per-component.md \
            docs/morphhdl/parameterized-verilog-todo.md \
            morphhdl/contracts/increment-61-source-review.json \
            morphhdl/scripts/check-increment-61-source-review.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m '61: record qualified completion candidate' \
            -m 'Mark Increment 61 complete only after the implementation head passed complete dual-Scala regression and every current-head workflow. This documentation-only head must pass the same protected final-head gate before merge.'
          python3 morphhdl/scripts/check-increment-61-source-review.py
          git push origin HEAD:refs/heads/agent/increment-61-one-file-per-component
          git rev-parse HEAD > "$output/completion-head.txt"

      - name: Mark ready and merge the fully requalified final head
        if: env.ALREADY_COMPLETE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-protected-gate
          remote=$(git ls-remote origin refs/heads/agent/increment-61-one-file-per-component | cut -f1)
          test "$remote" = "$CANDIDATE_HEAD"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/179 --jq .head.sha)" = "$CANDIDATE_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/179 --jq .base.ref)" = 'parameterized-verilog'
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/179 --jq .state)" = 'open'

          python3 - "$output/actions-runs.json" > "$output/final-pr-section.md" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          print('## Final protected qualification')
          print()
          print(f"Final head: `{value['head']}`")
          print()
          for run in value['runs']:
              print(f"- {run['name']} ({run['event']}), run {run['id']}: {run['conclusion']}")
          print()
          print('The complete MorphHDL test inventory also passed on Scala 2.12.18 and 2.13.12 in this protected completion run. The roadmap checkbox and completion record were requalified at this exact head.')
          PY
          gh pr view 179 --json body --jq .body > "$output/pr-body.md"
          python3 - "$output/pr-body.md" "$output/final-pr-section.md" <<'PY'
          from pathlib import Path
          import sys
          body, section = map(Path, sys.argv[1:])
          marker = '## Final protected qualification'
          text = body.read_text()
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n\n'
          body.write_text(text + section.read_text())
          PY
          gh pr edit 179 --body-file "$output/pr-body.md"
          gh pr ready 179 || true

          for attempt in $(seq 1 40); do
            state=$(gh api repos/$GITHUB_REPOSITORY/pulls/179 --jq .mergeable_state)
            case "$state" in
              clean|unstable|has_hooks) break ;;
              dirty|blocked) echo "PR merge blocked: $state" >&2; exit 1 ;;
              *) sleep 15 ;;
            esac
          done
          response="$output/merge.json"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/179/merge" \
            -f sha="$CANDIDATE_HEAD" -f merge_method=merge > "$response"
          test "$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["merged"]).lower())' "$response")" = true
          merge_head=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha"])' "$response")
          echo "$merge_head" > "$output/merge-head.txt"
          gh pr comment 179 --body "Increment 61 merged after protected final-head qualification. Merge commit: \`$merge_head\`. Post-merge workflows are now being observed."

      - name: Observe required post-merge workflows
        if: env.ALREADY_COMPLETE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-protected-gate
          merge_head=$(cat "$output/merge-head.txt")
          python3 - "$merge_head" "$output/post-merge-actions.json" <<'PY'
          from __future__ import annotations
          import json, os, sys, time, urllib.parse, urllib.request

          head, output = sys.argv[1:]
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          required = {
              'Increment 61 one-file-per-component publication',
              'Increment 60d pure SInt casts',
              'Increment 60g default signed Verilog',
          }
          allowed = {'success', 'skipped', 'neutral'}
          bad_values = {'failure', 'cancelled', 'timed_out', 'action_required', 'stale', 'startup_failure'}

          def runs():
              query = urllib.parse.urlencode({'head_sha': head, 'per_page': 100})
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs?{query}',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'MorphHDL-Increment-61-post-merge',
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  value = json.load(response)
              return sorted(({
                  'id': int(run['id']), 'name': run.get('name'), 'event': run.get('event'),
                  'status': run.get('status'), 'conclusion': run.get('conclusion'),
                  'html_url': run.get('html_url'), 'head_sha': run.get('head_sha')
              } for run in value.get('workflow_runs', []) if run.get('head_sha') == head),
                  key=lambda run: (run['name'] or '', run['event'] or '', run['id']))

          deadline = time.monotonic() + 5 * 60 * 60
          last = []
          while time.monotonic() < deadline:
              last = runs()
              names = {run['name'] for run in last}
              bad = [run for run in last if run['conclusion'] in bad_values]
              if bad:
                  raise SystemExit('post-merge failure: ' + json.dumps(bad, indent=2))
              pending = [run for run in last if run['status'] != 'completed']
              unsupported = [run for run in last if run['status'] == 'completed' and run['conclusion'] not in allowed]
              if unsupported:
                  raise SystemExit('post-merge unsupported conclusion: ' + json.dumps(unsupported, indent=2))
              if required.issubset(names) and not pending:
                  with open(output, 'w') as stream:
                      json.dump({'head': head, 'required': sorted(required), 'runs': last}, stream, indent=2)
                      stream.write('\n')
                  print(f'Increment 61 post-merge gate PASS: {len(last)} workflow runs')
                  break
              print(f'waiting post-merge: missing={sorted(required - names)}, pending={len(pending)}', flush=True)
              time.sleep(30)
          else:
              raise SystemExit('timed out waiting for post-merge workflows: ' + json.dumps(last, indent=2))
          PY
          gh pr comment 179 --body "Post-merge qualification passed at \`$merge_head\` for the dedicated Increment 61 workflow and inherited 60d/60g workflows."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-61-protected-gate-${{ github.run_id }}
          path: target/increment-61-protected-gate
          if-no-files-found: error
          retention-days: 30

name: WA-08 Increment 62 materialization

on:
  push:
    branches:
      - agent/wa-08-production-handoff

permissions:
  contents: write

concurrency:
  group: wa08-increment62-materialization
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact WA-08 branch
        uses: actions/checkout@v4
        with:
          ref: agent/wa-08-production-handoff
          fetch-depth: 0
          submodules: recursive

      - name: Verify and reconstruct reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .wa08-materialization -maxdepth 1 -type f -name 'payload-*.part' | wc -l)" -eq 9
          cat > /tmp/wa08-parts.sha256 <<'EOF'
          d8f7f9d233887c8fc37995ce6586b5267ab12700d62750dbed22ea2c587da990  .wa08-materialization/payload-00.part
          364e0d7d2240b0a38d7b6b185b14a1387820dfd8693428a7b466f65f25861a66  .wa08-materialization/payload-01.part
          fd91e08357c0cea32fe3af2fc0ffb9090203f6b755e501fb383b270641d1b7e5  .wa08-materialization/payload-02.part
          d48c1b5deb3dc44f2ef4ce011c63cd6f1097f951d1de1c1fb040206ba9d6d8df  .wa08-materialization/payload-03.part
          a5b8535af30bde86e27ae5c99f69094bc1b433fe3e803a80b5c07cde6debfd57  .wa08-materialization/payload-04.part
          4304618bca272265dd644eb6b23ecfdb24cd1818205c094ef19c5862cc549652  .wa08-materialization/payload-05.part
          0c21d92f449986f2293d0173ffb4ee9ecaadb8f34c6404c165169fe81f964766  .wa08-materialization/payload-06.part
          0ed58f72c329bf2657ab508d8411a5c8b2ccd0cd26ec7290bcb56526646326b1  .wa08-materialization/payload-07.part
          a8e346644cb05ea8d46fe73b13c11b9b10ad5243ea821e0a07a8a409d3a6c840  .wa08-materialization/payload-08.part
          EOF
          sha256sum -c /tmp/wa08-parts.sha256
          cat .wa08-materialization/payload-*.part | tr -d '\r\n' | base64 -d > /tmp/wa08-increment62-payload.tar.gz
          echo '34ad33fecf00a59804343b36c2ca919a4687b6c9110a396ea20d5dddd2c5ac54  /tmp/wa08-increment62-payload.tar.gz' | sha256sum -c -
          python3 - <<'PY'
          import tarfile
          expected = {
              'morphhdl/scripts/check-wa08-inherited-source-overlay.py',
              'morphhdl/contracts/wa08-inherited-source-overlay.json',
              'morphhdl/scripts/check-wa07b-inherited-review.py',
              'morphhdl/scripts/check-increment-60g-source-scope.py',
              '.github/workflows/increment-62-wa08-workflow-closure.yml',
          }
          with tarfile.open('/tmp/wa08-increment62-payload.tar.gz', 'r:gz') as archive:
              names = archive.getnames()
              if len(names) != len(set(names)) or set(names) != expected:
                  raise SystemExit('unexpected Increment 62 archive inventory: ' + repr(names))
              for member in archive.getmembers():
                  if not member.isfile() or member.name.startswith('/') or '..' in member.name.split('/'):
                      raise SystemExit('unsafe Increment 62 archive member: ' + member.name)
          PY
          tar -xzf /tmp/wa08-increment62-payload.tar.gz

      - name: Commit the exact reviewed overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .wa08-materialization
          rm -f .github/workflows/wa08-increment62-materialize.yml
          chmod +x \
            morphhdl/scripts/check-wa08-inherited-source-overlay.py \
            morphhdl/scripts/check-wa07b-inherited-review.py \
            morphhdl/scripts/check-increment-60g-source-scope.py
          python3 -m py_compile \
            morphhdl/scripts/check-wa08-inherited-source-overlay.py \
            morphhdl/scripts/check-wa07b-inherited-review.py \
            morphhdl/scripts/check-increment-60g-source-scope.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/increment-62-wa08-workflow-closure.yml',
              '.github/workflows/wa08-increment62-materialize.yml',
              *{f'.wa08-materialization/payload-{index:02d}.part' for index in range(9)},
              'morphhdl/contracts/wa08-inherited-source-overlay.json',
              'morphhdl/scripts/check-increment-60g-source-scope.py',
              'morphhdl/scripts/check-wa07b-inherited-review.py',
              'morphhdl/scripts/check-wa08-inherited-source-overlay.py',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(
                  'unexpected staged Increment 62 inventory; missing=' +
                  repr(sorted(expected - actual)) + '; extra=' + repr(sorted(actual - expected))
              )
          PY
          git commit -m 'Implement Increment 62 WA-08 source overlay'

      - name: Qualify the committed source overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/check-wa08-inherited-source-overlay.py
          python3 morphhdl/scripts/check-wa08-inherited-source-overlay.py --self-test
          python3 morphhdl/scripts/check-wa07b-inherited-review.py
          python3 morphhdl/scripts/check-increment-60g-source-scope.py
          python3 morphhdl/scripts/check-increment-60f-equivalence-closure.py --source-only
          python3 morphhdl/scripts/check-increment-59c-source-review.py
          python3 morphhdl/scripts/check-increment-59g-source-review.py

      - name: Publish qualified Increment 62 commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/wa-08-production-handoff

name: Deliver reviewed Increment 51 implementation

on:
  pull_request:
    branches:
      - parameterized-verilog
    paths:
      - .github/workflows/inc51-source-export.yml
  push:
    branches:
      - agent/increment-51-native-int-branch-capture
    paths:
      - .github/workflows/inc51-source-export.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-51-deliver-implementation
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-51-native-int-branch-capture
          fetch-depth: 0

      - name: Decode, verify and apply non-workflow implementation
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/inc51-implementation.patch.xz.b64
          patch="$RUNNER_TEMP/inc51-implementation.patch"
          excluded=.github/workflows/morphhdl-native-int-symbolic-conditionals.yml
          base64 --decode "$payload" | xz --decompress --stdout > "$patch"
          echo 'b7b7aea671fb799bca98a847023f123874a7f5b8b7c4e435fee92ee95ec4946a  '"$patch" | sha256sum --check
          git apply --check --exclude="$excluded" "$patch"
          git apply --exclude="$excluded" "$patch"
          rm -f "$payload"

          git config user.name "pysolvesemi"
          git config user.email "pysolvesemi@gmail.com"
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "Implement Increment 51 native Int branch capture"
          git push origin HEAD:agent/increment-51-native-int-branch-capture

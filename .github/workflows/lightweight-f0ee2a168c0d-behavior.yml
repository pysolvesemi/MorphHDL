name: Lightweight Scala RTL behavior exact-head dispatch
'on':
  push:
    branches:
    - control/lightweight-f0ee2a168c0d-behavior
    paths:
    - .github/workflows/lightweight-f0ee2a168c0d-behavior.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Validate identities and dispatch only allowlisted workflows
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        mkdir -p .github/controllers/lightweight-f0ee2a168c0d-behavior

name: Increment 41 repair controller

on:
  pull_request:
    branches:
      - parameterized-verilog
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.event.pull_request.head.ref == 'agent/increment-41-external-expression-hierarchy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-41-external-expression-hierarchy
          fetch-depth: 0

      - name: Apply reviewed Increment 41 repair
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .github/increment-41-repair.patch.gz > /tmp/increment-41-repair.patch
          echo "99f3c59da4baa9d064d1d33fd1fb138b52245f5059d22b46233c560c87b072c4  /tmp/increment-41-repair.patch" | sha256sum --check --strict
          git apply --index /tmp/increment-41-repair.patch
          git diff --cached --check

          rm -f \
            .github/increment-41-repair.patch.gz \
            .github/workflows/increment-41-source-snapshot.yml
          git add -A
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Increment 41: repair external lowering regressions"
          git push origin HEAD:refs/heads/agent/increment-41-external-expression-hierarchy

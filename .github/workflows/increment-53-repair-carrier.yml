name: Increment 53 permanent repair carrier

on:
  push:
    branches:
      - agent/increment-53-native-streamfifo-repair
  pull_request:
    branches:
      - parameterized-verilog

permissions:
  contents: write

concurrency:
  group: increment-53-permanent-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      ${{
        (github.event_name == 'push' &&
          !contains(github.event.head_commit.message, '[inc53-repair-carried]')) ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.ref == 'agent/increment-53-native-streamfifo-repair')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53-native-streamfifo-repair
          fetch-depth: 0

      - name: Make reviewed repairs permanent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          robust_replace_exact_source = r'''def replace_exact(text, old, new, label):
              count = text.count(old)
              if count == 0 and new in text:
                  return text
              if count == 1:
                  return text.replace(old, new, 1)
              if count > 1:
                  raise SystemExit(
                      f"{label}: expected one exact anchor, found {count}"
                  )

              def pattern_for(value):
                  parts = []
                  for line in value.splitlines(keepends=True):
                      has_newline = line.endswith("\n")
                      body = line[:-1] if has_newline else line
                      if body.strip():
                          parts.append(
                              r"^[ \\t]*" + re.escape(body.strip()) +
                              r"[ \\t]*"
                          )
                      else:
                          parts.append(r"^[ \\t]*")
                      if has_newline:
                          parts.append(r"\n")
                  return "".join(parts)

              matches = list(
                  re.finditer(pattern_for(old), text, re.MULTILINE)
              )
              if not matches:
                  if len(list(re.finditer(
                      pattern_for(new), text, re.MULTILINE
                  ))) == 1:
                      return text
                  raise SystemExit(
                      f"{label}: expected one exact anchor, found 0"
                  )
              if len(matches) != 1:
                  raise SystemExit(
                      f"{label}: expected one indentation-normalized anchor, "
                      f"found {len(matches)}"
                  )

              match = matches[0]
              actual_lines = match.group(0).splitlines()
              old_lines = old.splitlines()
              continuation_delta = 0
              for index in range(1, min(len(actual_lines), len(old_lines))):
                  if old_lines[index].strip():
                      actual_indent = (
                          len(actual_lines[index]) -
                          len(actual_lines[index].lstrip())
                      )
                      old_indent = (
                          len(old_lines[index]) -
                          len(old_lines[index].lstrip())
                      )
                      continuation_delta = actual_indent - old_indent
                      break
              if continuation_delta:
                  lines = new.splitlines(keepends=True)
                  adjusted = [lines[0]] if lines else []
                  for line in lines[1:]:
                      if line.strip():
                          adjusted.append(
                              " " * continuation_delta + line
                          )
                      else:
                          adjusted.append(line)
                  new = "".join(adjusted)
              return text[:match.start()] + new + text[match.end():]

          '''
          exec(robust_replace_exact_source, globals())

          def insert_before(
              text: str,
              anchor: str,
              payload: str,
              marker: str,
              label: str,
          ) -> str:
              if marker in text:
                  return text
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f"{label}: expected one insertion anchor, found {count}")
              return text.replace(anchor, payload + anchor, 1)

          # Apply the already-reviewed source-finalization delta from its
          # temporary carrier, but commit the resulting sources directly.
          finalize_path = Path(".github/workflows/increment-53-source-finalize.yml")
          finalize = finalize_path.read_text(encoding="utf-8")
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n          git diff --check"
          if start_marker not in finalize or end_marker not in finalize:
              raise SystemExit("Increment 53 source-finalize carrier shape changed")
          script = finalize.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = textwrap.dedent(script)
          helper_start = script.index("def replace_exact(")
          helper_end = script.index("def insert_before(", helper_start)
          script = (
              script[:helper_start] + robust_replace_exact_source +
              script[helper_end:]
          )
          exec(
              compile(
                  script,
                  str(finalize_path) + ":embedded-python",
                  "exec",
              ),
              {},
          )

          memory_path = Path(
              "morphhdl/src/main/scala/spinal/core/internals/"
              "ParameterizedVerilogMemories.scala"
          )
          memory = memory_path.read_text(encoding="utf-8")

          memory = replace_exact(
              memory,
              '''    lines = rewriteMemoryDeclaration(lines, plan, helperName)
              lines = rewriteReadTargetDeclaration(lines, plan, helperName)

              val memoryBlocks = alwaysBlocks(lines).filter { block =>
          ''',
              '''    lines = rewriteMemoryDeclaration(lines, plan, helperName)
              lines = rewriteReadTargetDeclaration(lines, plan, helperName)
              lines = rewriteAddressDeclarations(lines, plan, helperName)

              val memoryBlocks = alwaysBlocks(lines).filter { block =>
          ''',
              "memory address declaration rewrite hook",
          )

          memory = replace_exact(
              memory,
              '''    val readAddressWidth = widthOf(read.address, source)
              val writeAddressWidth = widthOf(write.address, source)
              validateAddressWidth(read.address, readAddressWidth, metadata.depth, "read", memory, pc, source)
          ''',
              '''    val nativeAddressWidth =
                nativeMemoryAddressWidth(metadata.depth, source)
              val readAddressWidth = selectAddressWidth(
                read.address,
                widthOf(read.address, source),
                nativeAddressWidth
              )
              val writeAddressWidth = selectAddressWidth(
                write.address,
                widthOf(write.address, source),
                nativeAddressWidth
              )
              validateAddressWidth(read.address, readAddressWidth, metadata.depth, "read", memory, pc, source)
          ''',
              "native memory address-width selection",
          )

          width_helpers = '''  private def nativeMemoryAddressWidth(
              depth: ElaborationIntegerExpression,
              source: Option[String]
          ): ElaborationIntegerExpression =
            ElaborationIntegerExpression(
              verilog = s"clog2(${depth.verilog}, 1)",
              default = portableAddressWidth(depth.default),
              minimum = portableAddressWidth(depth.minimum),
              maximum = portableAddressWidth(depth.maximum),
              parameters = depth.parameters,
              sourceLocation = source.orElse(depth.sourceLocation)
            )

            private def portableAddressWidth(value: BigInt): BigInt = {
              if (value < 1) {
                fail(
                  "SPINAL-PARAMETERIZED-VERILOG-MEMORY-DEPTH-DOMAIN-INVALID",
                  s"native memory address width requires a positive depth, received $value"
                )
              }
              BigInt(math.max(1, (value - 1).bitLength))
            }

            private def selectAddressWidth(
              address: Expression with WidthProvider,
              retained: ElaborationIntegerExpression,
              native: ElaborationIntegerExpression
          ): ElaborationIntegerExpression = {
              val retainedIsConcreteWitness =
                retained.parameters.isEmpty &&
                retained.default == BigInt(address.getWidth) &&
                retained.minimum == retained.default &&
                retained.maximum == retained.default
              if (
                native.parameters.nonEmpty &&
                retainedIsConcreteWitness &&
                native.default == retained.default
              ) native
              else retained
            }

          '''
          memory = insert_before(
              memory,
              "  private def validateAddressWidth(\n",
              width_helpers,
              "private def nativeMemoryAddressWidth(",
              "native memory address-width helpers",
          )

          declaration_helpers = r'''  private def rewriteAddressDeclarations(
              lines: Vector[String],
              plan: MemoryPlan,
              helperName: String
          ): Vector[String] = {
            val roles = Vector(
              plan.readAddress -> plan.readAddressWidth,
              plan.writeAddress -> plan.writeAddressWidth
            ).groupBy(_._1).toVector.sortBy(_._1).map {
              case (name, values) =>
                val widths = values.map(_._2).distinct
                if (widths.size != 1) {
                  fail(
                    "SPINAL-PARAMETERIZED-VERILOG-MEMORY-ADDRESS-TYPE-MISMATCH",
                    s"memory '${plan.memoryName}' address '$name' has incompatible retained declaration widths",
                    plan.sourceLocation
                  )
                }
                name -> widths.head
            }
            roles.foldLeft(lines) { case (current, (name, width)) =>
              rewriteAddressDeclaration(
                current,
                plan,
                name,
                width,
                helperName
              )
            }
          }

          private def rewriteAddressDeclaration(
              lines: Vector[String],
              plan: MemoryPlan,
              name: String,
              width: ElaborationIntegerExpression,
              helperName: String
          ): Vector[String] = {
            if (width.parameters.isEmpty) return lines
            val declaration =
              "^\\s*(?:input|output|inout|wire|reg)\\b".r
            val candidates = lines.zipWithIndex.collect {
              case (line, index)
                  if declaration.findFirstIn(line).nonEmpty &&
                    containsIdentifier(line, name) =>
                index
            }
            if (candidates.size != 1) {
              fail(
                "SPINAL-PARAMETERIZED-VERILOG-MEMORY-ADDRESS-DECLARATION-NOT-FOUND",
                s"normal Verilog emission contains ${candidates.size} declarations matching memory address '$name' for '${plan.memoryName}'",
                plan.sourceLocation
              )
            }

            val index = candidates.head
            val line = lines(index)
            val nameMatch = identifierPattern(name).findFirstMatchIn(line).get
            var prefix = line.substring(0, nameMatch.start)
            val suffix = line.substring(nameMatch.end)
            val packed = "\\[[^\\]]+\\]\\s*$".r
            val range = s"[${render(width, helperName)}-1:0]"
            packed.findFirstMatchIn(prefix) match {
              case Some(value) =>
                prefix = prefix.substring(0, value.start) + range + " "
              case None =>
                prefix = prefix + range + " "
            }
            lines.updated(index, prefix + name + suffix)
          }

          '''
          memory = insert_before(
              memory,
              "  private def rewriteReadTargetDeclaration(\n",
              declaration_helpers,
              "private def rewriteAddressDeclarations(",
              "native memory address declaration helpers",
          )
          memory_path.write_text(memory, encoding="utf-8")

          test_path = Path(
              "morphhdl/src/test/scala/morphhdl/"
              "ParameterizedStreamFifoDepthTests.scala"
          )
          tests = test_path.read_text(encoding="utf-8")
          tests = replace_exact(
              tests,
              '''      assert(
                parameterized.contains("[0:DEPTH-1]") ||
                  parameterized.contains("[0:(DEPTH - 1)]")
              )
              assert(parameterized.contains("generate"))
          ''',
              '''      assert(
                parameterized.contains("[0:DEPTH-1]") ||
                  parameterized.contains("[0:(DEPTH - 1)]")
              )
              assert(parameterized.contains("clog2(DEPTH, 1)"))
              assert(parameterized.contains("generate"))
          ''',
              "StreamFifo symbolic address-width assertion",
          )

          class_anchor = "class ParameterizedStreamFifoDepthTests extends AnyFunSuite {\n"
          unsafe_class = '''final class UnsafeStructuralAssignmentHarness(depth: HdlInt)
              extends Component {
            setDefinitionName("UnsafeStructuralAssignmentHarness")
            val observed = out(Bool())
            observed := False
            if (depth > 1) observed := True
            else observed := False
          }

          '''
          tests = insert_before(
              tests,
              class_anchor,
              unsafe_class,
              "final class UnsafeStructuralAssignmentHarness(",
              "unsafe structural assignment harness",
          )

          test_anchor = "  private def simulateDepth(\n"
          unsafe_test = '''  test("mutually-exclusive capture never hides an outside assignment") {
              withTemporaryDirectory { directory =>
                val config = synchronousResetConfig(directory)
                config.netlistFileName = "unsafe_structural_assignment.v"
                MorphVerilog.tryGenerate(config) {
                  val depth = HdlInt.param(
                    "DEPTH",
                    default = BigInt(5),
                    min = BigInt(1),
                    max = BigInt(8)
                  )
                  new UnsafeStructuralAssignmentHarness(depth)
                } match {
                  case Left(failure) =>
                    assert(failure.detail.contains("ASSIGNMENT OVERLAP"))
                  case Right(report) =>
                    fail(s"Expected inherited overlap failure, received $report")
                }
              }
            }

          '''
          tests = insert_before(
              tests,
              test_anchor,
              unsafe_test,
              'test("mutually-exclusive capture never hides an outside assignment")',
              "unsafe structural assignment regression",
          )
          test_path.write_text(tests, encoding="utf-8")
          PY

          git show \
            3a0c1e0118db85cd7522ed51df7e471a584b0dae:.github/workflows/morphhdl-native-streamfifo-structure.yml \
            > .github/workflows/morphhdl-native-streamfifo-structure.yml
          git rm -f .github/workflows/increment-53-source-finalize.yml
          git rm -f .github/workflows/increment-53-repair-carrier.yml
          git rm -f --ignore-unmatch docs/morphhdl/increment-53-focused-diagnostic.log
          git diff --check

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Prove focused repair on both supported Scala versions
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl/scripts/check-native-streamfifo-structure-boundary.sh
          for scala_version in 2.12.18 2.13.12; do
            /tmp/morphhdl-mill "morph[$scala_version].testOnly" \
              morphhdl.ParameterizedStreamFifoDepthTests \
              morphhdl.HierarchyParameterBindingTests \
              morphhdl.NativeIntNestedSymbolicControlFlowTests
          done

      - name: Publish permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(morphhdl): retain native StreamFifo address geometry [inc53-repair-carried]"
          git push origin HEAD:agent/increment-53-native-streamfifo-repair

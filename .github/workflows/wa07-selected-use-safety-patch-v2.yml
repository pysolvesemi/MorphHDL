name: WA-07 selected-use safety patch v2

on:
  push:
    branches:
      - agent/wa-07-unified-expression-inlining
    paths:
      - ".github/workflows/wa07-selected-use-safety-patch-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wa07-selected-use-safety-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - name: Check out WA-07 branch
        uses: actions/checkout@v4
        with:
          ref: agent/wa-07-unified-expression-inlining
          fetch-depth: 0

      - name: Build corrected patch payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path(".github/workflows/wa07-selected-use-safety-patch.yml")
          text = workflow.read_text(encoding="utf-8")
          begin_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n\n          git diff --check"
          begin = text.index(begin_marker) + len(begin_marker)
          end = text.index(end_marker, begin)
          script = dedent(text[begin:end])

          old_start = script.index("existing_test_check = dedent(")
          old_end_marker = (
              "guard = guard.replace(existing_test_check, expanded_test_check, 1)\n"
          )
          old_end = script.index(old_end_marker, old_start) + len(old_end_marker)
          replacement = '''selection_check = (
              '    failures.extend(require_markers(\\n'
              '        paths["selection_tests"].relative_to(root), texts["selection_tests"],\\n'
              '        REQUIRED_SELECTION_TEST_MARKERS, "WA07-SELECTION-TEST-MISSING",\\n'
              '    ))\\n'
          )
          pipeline_check_anchor = (
              '    failures.extend(require_markers(\\n'
              '        paths["pipeline_tests"].relative_to(root), texts["pipeline_tests"],\\n'
              '        REQUIRED_PIPELINE_MARKERS, "WA07-PIPELINE-TEST-MISSING",\\n'
              '    ))\\n'
          )
          if pipeline_check_anchor not in guard:
              raise SystemExit("WA-07 pipeline-test guard anchor is missing")
          guard = guard.replace(
              pipeline_check_anchor,
              selection_check + pipeline_check_anchor,
              1,
          )
          '''
          script = script[:old_start] + replacement + script[old_end:]

          state_start = script.index("old_state = dedent(")
          state_end_marker = "guard = guard.replace(old_state, new_state, 1)\n"
          state_end = script.index(state_end_marker, state_start) + len(state_end_marker)
          state_replacement = '''old_state = (
              '    if not wa07_checked:\\n'
              '        failures.append(f"{path}: WA07-INCOMPLETE: implemented WA-07 must be checked")\\n'
              '    elif "**Status:** `COMPLETED`" not in wa07_body:\\n'
              '        failures.append(f"{path}: WA07-STATUS: checked WA-07 must be COMPLETED")\\n'
              '    if wa08_checked:\\n'
              '        failures.append(f"{path}: WA07-SCOPE: WA-07 must not complete WA-08")\\n'
              '    if "**Status:** `READY`" not in wa08_body:\\n'
              '        failures.append(f"{path}: WA07-NEXT-STATUS: WA-08 must be READY")\\n'
          )
          new_state = (
              '    if wa08_checked:\\n'
              '        failures.append(f"{path}: WA07-SCOPE: WA-07 must not complete WA-08")\\n'
              '    if wa07_checked:\\n'
              '        if "**Status:** `COMPLETED`" not in wa07_body:\\n'
              '            failures.append(\\n'
              '                f"{path}: WA07-STATUS: checked WA-07 must be COMPLETED"\\n'
              '            )\\n'
              '        if "**Status:** `READY`" not in wa08_body:\\n'
              '            failures.append(\\n'
              '                f"{path}: WA07-NEXT-STATUS: completed WA-07 requires READY WA-08"\\n'
              '            )\\n'
              '    else:\\n'
              '        if "**Status:** `IN PROGRESS`" not in wa07_body:\\n'
              '            failures.append(\\n'
              '                f"{path}: WA07-STATUS: open WA-07 must be IN PROGRESS"\\n'
              '            )\\n'
              '        if "**Status:** `BLOCKED`" not in wa08_body:\\n'
              '            failures.append(\\n'
              '                f"{path}: WA07-NEXT-STATUS: in-progress WA-07 requires BLOCKED WA-08"\\n'
              '            )\\n'
          )
          if old_state not in guard:
              raise SystemExit("WA-07 guard roadmap-state block is missing")
          guard = guard.replace(old_state, new_state, 1)
          '''
          script = script[:state_start] + state_replacement + script[state_end:]

          self_start = script.index("old_self_test = dedent(")
          self_end_marker = (
              "guard = guard.replace(old_self_test, new_self_test, 1)\n"
          )
          self_end = script.index(self_end_marker, self_start) + len(self_end_marker)
          self_replacement = '''old_self_test = (
              '    if roadmap_failures(Path("roadmap.md"), roadmap, pv):\\n'
              '        raise AssertionError("valid WA-07 completion state was rejected")\\n'
              '    if not roadmap_failures(\\n'
              '        Path("roadmap.md"),\\n'
              '        roadmap.replace("- [x] **WA-07", "- [ ] **WA-07"),\\n'
              '        pv,\\n'
              '    ):\\n'
              '        raise AssertionError("unchecked implemented WA-07 was not rejected")\\n'
              '    if not roadmap_failures(\\n'
              '        Path("roadmap.md"),\\n'
              '        roadmap.replace("**Status:** `READY`.", "**Status:** `BLOCKED` by WA-07."),\\n'
              '        pv,\\n'
              '    ):\\n'
              '        raise AssertionError("blocked WA-08 after completed WA-07 was not rejected")\\n'
          )
          new_self_test = (
              '    if roadmap_failures(Path("roadmap.md"), roadmap, pv):\\n'
              '        raise AssertionError("valid WA-07 completion state was rejected")\\n'
              '    implementation = roadmap.replace(\\n'
              '        "- [x] **WA-07 — Expressions**\\\\n\\\\n  **Status:** `COMPLETED`.",\\n'
              '        "- [ ] **WA-07 — Expressions**\\\\n\\\\n  **Status:** `IN PROGRESS`.",\\n'
              '    ).replace(\\n'
              '        "**Status:** `READY`.",\\n'
              '        "**Status:** `BLOCKED` by WA-07.",\\n'
              '    )\\n'
              '    if roadmap_failures(Path("roadmap.md"), implementation, pv):\\n'
              '        raise AssertionError("valid WA-07 implementation state was rejected")\\n'
              '    if not roadmap_failures(\\n'
              '        Path("roadmap.md"),\\n'
              '        roadmap.replace("**Status:** `READY`.", "**Status:** `BLOCKED` by WA-07."),\\n'
              '        pv,\\n'
              '    ):\\n'
              '        raise AssertionError("blocked WA-08 after completed WA-07 was not rejected")\\n'
              '    if not roadmap_failures(\\n'
              '        Path("roadmap.md"),\\n'
              '        implementation.replace(\\n'
              '            "**Status:** `IN PROGRESS`.",\\n'
              '            "**Status:** `COMPLETED`.",\\n'
              '        ),\\n'
              '        pv,\\n'
              '    ):\\n'
              '        raise AssertionError("unchecked completed WA-07 state was not rejected")\\n'
          )
          if old_self_test not in guard:
              raise SystemExit("WA-07 guard roadmap self-test block is missing")
          guard = guard.replace(old_self_test, new_self_test, 1)
          '''
          script = script[:self_start] + self_replacement + script[self_end:]

          boundary_anchor = "for temporary in (\n"
          boundary_patch = '''boundary_path = "morphhdl-passes/scripts/test-boundary-guard.sh"
          boundary = read(boundary_path)
          boundary_start_marker = "expect_success \\\\\\n  'WA-08 handoff is accepted after WA-07 and PV-58 are checked'"
          boundary_start = boundary.index(boundary_start_marker)
          boundary_end = boundary.index("\\n\\ntmp_repo=", boundary_start)
          state_aware_boundary = """if grep -Eq '^- \\[[xX]\\] \\*\\*WA-07 ' \\
  "${repo_root}/morphhdl-passes/morphhdl-ir-wire-assignment-passes-todo.md"; then
  expect_success \\
    'WA-08 handoff is accepted after WA-07 and PV-58 are checked' \\
    run_checker agent/wa-08-final-handoff "${wa08_manifest}"
else
  expect_failure \\
    'WA-08 handoff remains blocked while WA-07 implementation is open' \\
    run_checker agent/wa-08-final-handoff "${wa08_manifest}"
fi"""
          boundary = (
              boundary[:boundary_start]
              + state_aware_boundary
              + boundary[boundary_end:]
          )
          write(boundary_path, boundary)

          '''
          if boundary_anchor not in script:
              raise SystemExit("temporary cleanup insertion point is missing")
          script = script.replace(
              boundary_anchor,
              boundary_patch + boundary_anchor,
              1,
          )

          deletion_marker = (
              '    ".github/workflows/wa07-selected-use-safety-patch.yml",\n'
          )
          if deletion_marker not in script:
              raise SystemExit("temporary workflow deletion marker is missing")
          script = script.replace(
              deletion_marker,
              deletion_marker
              + '    ".github/workflows/wa07-selected-use-safety-patch-v2.yml",\n',
              1,
          )

          Path("/tmp/wa07_selected_use_patch.py").write_text(
              script,
              encoding="utf-8",
          )
          compile(script, "/tmp/wa07_selected_use_patch.py", "exec")
          PY

      - name: Apply selected-use safety hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/wa07_selected_use_patch.py

      - name: Run every static pass contract
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl-passes/scripts/test-boundary-guard.sh
          for script in \
            check-wa02-adapter-boundary.py \
            check-wa03-gates.py \
            check-wa04-pass.py \
            check-wa05-pass.py \
            check-wa06-pipeline.py \
            check-wa07-expression-pass.py; do
            python3 "morphhdl-passes/scripts/${script}" --self-test
            python3 "morphhdl-passes/scripts/${script}"
          done
          python3 morphhdl-passes/scripts/validate_wire_assignment_equivalence.py --self-test

      - name: Test Scala 2.12 contracts and transformations
        working-directory: morphhdl-passes
        shell: bash
        run: sbt -batch ++2.12.18 test

      - name: Test Scala 2.13 contracts and transformations
        working-directory: morphhdl-passes
        shell: bash
        run: sbt -batch ++2.13.12 test

      - name: Push the exact tested commit
        shell: bash
        run: git push origin HEAD:agent/wa-07-unified-expression-inlining

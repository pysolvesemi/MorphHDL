name: Increment 59i reviewed source staging

on:
  push:
    branches: [recovery/increment-59i-history-20260914]
    paths:
      - .github/workflows/increment-59i-stage-source.yml
      - .github/recovery/59i-source/**

# The job stages only exact blobs and commits, never workflow-bearing trees
# or remote refs. The authorized connector creates the two reviewed trees.
permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Reconstruct, run all original source gates, and prepare exact blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/59i-stage-evidence"
          python3 -B .github/recovery/59i-source/test_stage_database.py
          python3 -B .github/recovery/59i-source/stage_database.py prepare \
            --repository "$GITHUB_WORKSPACE" \
            --destination "$RUNNER_TEMP/59i-reviewed-source" \
            --payload-dir "$GITHUB_WORKSPACE/.github/recovery/59i-source" \
            --output "$RUNNER_TEMP/59i-stage-evidence" \
            2>&1 | tee "$RUNNER_TEMP/59i-stage-evidence/prepare.log"
      - name: Export exact tree requests for authorized connector publication
        uses: actions/upload-artifact@v4
        with:
          name: increment-59i-tree-requests-1541077c
          path: ${{ runner.temp }}/59i-stage-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Verify connector-created trees and stage exact commit objects
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B .github/recovery/59i-source/stage_database.py commits \
            --repository "$GITHUB_WORKSPACE" \
            --destination "$RUNNER_TEMP/59i-reviewed-source" \
            --payload-dir "$GITHUB_WORKSPACE/.github/recovery/59i-source" \
            --output "$RUNNER_TEMP/59i-stage-evidence" \
            2>&1 | tee "$RUNNER_TEMP/59i-stage-evidence/commits.log"
      - name: Preserve exact object receipts and source-gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59i-staged-source-1541077c
          path: ${{ runner.temp }}/59i-stage-evidence
          if-no-files-found: error
          retention-days: 14

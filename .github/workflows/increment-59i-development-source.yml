name: Increment 59i development source history

on:
  push:
    branches: ['agent/increment-59i-*']
    paths: ['.github/workflows/increment-59i-development-source.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve only Git source objects and declared refs
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-59i-development-source"
          mkdir -p "$output"
          git rev-parse HEAD > "$output/head.txt"
          git rev-parse refs/remotes/origin/parameterized-verilog > "$output/integration-head.txt"
          git bundle create "$output/source-history.bundle" HEAD refs/remotes/origin/parameterized-verilog
          git bundle verify "$output/source-history.bundle" > "$output/verify.log" 2>&1
          git bundle list-heads "$output/source-history.bundle" > "$output/refs.txt"
          sha256sum "$output/source-history.bundle" > "$output/sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: increment-59i-development-source
          path: target/increment-59i-development-source
          if-no-files-found: error
          retention-days: 7

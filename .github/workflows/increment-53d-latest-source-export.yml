name: Export latest Increment 53d typed source

on:
  push:
    branches:
      - agent/increment-53d-typed-elabint-pivot
    paths:
      - .github/workflows/increment-53d-latest-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-typed-elabint-pivot
          fetch-depth: 0
          submodules: false
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="${RUNNER_TEMP}/morphhdl-inc53d-latest.tgz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: morphhdl-inc53d-latest-source
          path: ${{ runner.temp }}/morphhdl-inc53d-latest.tgz
          if-no-files-found: error
          retention-days: 2

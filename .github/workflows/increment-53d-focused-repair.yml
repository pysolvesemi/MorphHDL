name: Apply focused Increment 53d repair

on:
  push:
    branches:
      - agent/increment-53d-native-streamwidth-adapter
    paths:
      - .github/workflows/increment-53d-focused-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Increment 53d feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-native-streamwidth-adapter
          fetch-depth: 0

      - name: Apply exact MorphHDL-owned repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          plugin = Path("morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala")
          text = plugin.read_text(encoding="utf-8")
          for kind in ("UInt", "Bits", "SInt"):
              old = (
                  f'        case Apply(fun, List(bitCount))\n'
                  f'            if inNativeRuntimeContext && terminalName(fun) == "{kind}" =>\n'
                  f'          rewriteBitVectorFactory(tree, fun, bitCount, "compiler{kind}")\n'
              )
              new = (
                  f'        case Apply(fun, List(bitCount))\n'
                  f'            if terminalName(fun) == "{kind}" &&\n'
                  f'              (inNativeRuntimeContext || firstTrackedInteger(bitCount).nonEmpty) =>\n'
                  f'          rewriteBitVectorFactory(tree, fun, bitCount, "compiler{kind}")\n'
              )
              if text.count(old) != 1:
                  raise SystemExit(f"compiler {kind} replacement anchor count was {text.count(old)}")
              text = text.replace(old, new, 1)
          plugin.write_text(text, encoding="utf-8")

          test = Path("morphhdl/src/test/scala/morphhdl/ParameterizedStreamWidthAdapterTests.scala")
          text = test.read_text(encoding="utf-8")
          component_marker = "\n  def component(): Top =\n"
          if text.count(component_marker) != 1:
              raise SystemExit(f"component marker count was {text.count(component_marker)}")
          parent_shell = '''

          /**
            * Valid parent shell for the independent-root rejection proof. The native
            * adapter still receives the two unrelated symbolic packed-width roots in
            * the child; the parent exists only to satisfy ordinary SpinalHDL hierarchy
            * construction and fully connect the child IO.
            */
          final class IndependentRootTop(
              inputWidth: HdlInt,
              outputWidth: HdlInt
          ) extends Component {
            setDefinitionName("NativeStreamWidthAdapterIndependentRootTop")

            val io = new Bundle {
              val input = slave(Stream(morphhdl.frontend.Bits(inputWidth bits)))
              val output = master(Stream(morphhdl.frontend.Bits(outputWidth bits)))
            }

            val adapter = formalComponent.parameter(
              inputWidth,
              "INPUT_WIDTH",
              minimum = BigInt(9),
              maximum = BigInt(16)
            ) { inputWitness =>
              new IndependentRootLeaf(inputWitness, outputWidth bits)
            }
            adapter.setName("adapter")

            adapter.io.input.valid := io.input.valid
            adapter.io.input.payload := io.input.payload
            io.input.ready := adapter.io.input.ready

            io.output.valid := adapter.io.output.valid
            io.output.payload := adapter.io.output.payload
            adapter.io.output.ready := io.output.ready
          }
          '''
          text = text.replace(component_marker, parent_shell + component_marker, 1)

          test_name = '  test("a native adapter invocation rejects an unproven second symbolic root") {'
          start = text.find(test_name)
          end_marker = "\n  private def hasWidth("
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("independent-root test block markers missing")
          new_test = '''  test("a native adapter invocation rejects an unproven second symbolic root") {
            withTemporaryDirectory { directory =>
              val generationConfig = config(directory)
              generationConfig.netlistFileName = "native_stream_width_adapter_independent.v"
              val first = HdlInt.param("FIRST_WIDTH", default = 12, min = 9, max = 16)
              val second = HdlInt.param("SECOND_WIDTH", default = 12, min = 9, max = 16)
              val result = MorphVerilog.tryGenerate(generationConfig) {
                // The second independent symbolic width is attached to a different
                // exact Data identity. The active INPUT_WIDTH boundary must reject it
                // instead of matching the equal concrete default.
                new IndependentRootTop(first, second)
              }
              result match {
                case Left(failure) =>
                  assert(
                    failure.detail.contains("MORPH-FRONTEND-NATIVE-WIDTH-FUNCTION-ROOT-AMBIGUOUS") ||
                      failure.detail.contains("MORPH-FRONTEND-NATIVE-INT-EXPRESSION-OPERAND-UNPROVEN"),
                    failure.detail
                  )
                case Right(report) =>
                  fail(s"Expected independent-width provenance rejection, received $report")
              }
            }
          }
          '''
          text = text[:start] + new_test + text[end:]
          test.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/increment-53d-focused-repair.yml
          git diff --check
          if git diff --name-only | grep -Eq '^(core|lib|idslplugin)/'; then
            echo "Increment 53d must not modify native SpinalHDL source" >&2
            exit 1
          fi
          git config user.name "MorphHDL Increment Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala
          git add morphhdl/src/test/scala/morphhdl/ParameterizedStreamWidthAdapterTests.scala
          git add .github/workflows/increment-53d-focused-repair.yml
          git commit -m "fix: retain StreamWidthAdapter symbolic payload shapes"
          git push origin HEAD:agent/increment-53d-native-streamwidth-adapter

name: Display controller offline Mill 0.11.11 export

on:
  pull_request:
    branches:
      - agent/display-controller-toolchain-base

permissions:
  contents: read

jobs:
  mill-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact public toolchain branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify no Display Controller product source is present
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 81abd25518551b8a452ecf038e409331e646f726)" = "81abd25518551b8a452ecf038e409331e646f726"
          ! git grep -n -E 'DisplayControllerCore|RTL-P1-01' -- ':!:.github/workflows/display-controller-offline-toolchain.yml'

      - name: Download and authenticate Mill 0.11.11
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/rtl-p1-01-mill
          rm -rf "${out}"
          mkdir -p "${out}"
          curl --fail --location --retry 5 --retry-delay 2 \
            https://github.com/com-lihaoyi/mill/releases/download/0.11.11/0.11.11 \
            --output "${out}/mill-0.11.11"
          chmod 0755 "${out}/mill-0.11.11"
          "${out}/mill-0.11.11" --version | tee "${out}/version.txt"
          grep -F 'Mill Build Tool version 0.11.11' "${out}/version.txt"
          sha256sum "${out}/mill-0.11.11" "${out}/version.txt" > "${out}/SHA256SUMS"

      - name: Upload exact Mill launcher
        uses: actions/upload-artifact@v4
        with:
          name: rtl-p1-01-mill-0.11.11
          path: /tmp/rtl-p1-01-mill
          if-no-files-found: error
          retention-days: 7

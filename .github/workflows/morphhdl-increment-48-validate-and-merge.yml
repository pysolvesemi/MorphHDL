name: Validate and merge Increment 48

on:
  pull_request:
    branches: [parameterized-verilog]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  validate-and-merge:
    if: github.event.pull_request.head.ref == 'agent/increment-48-completion'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      SBT_TEST_PARALLEL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-48-completion
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Verify the permanent implementation is present
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin parameterized-verilog agent/increment-48-completion
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/increment-48-completion)"
          test "$(git merge-base HEAD origin/parameterized-verilog)" = "$(git rev-parse origin/parameterized-verilog)"
          test -f morphplugin/src/main/scala/morphhdl/compiler/MorphHdlPlugin.scala
          test -f morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNaturalSymbolicConditionalComponent.scala
          test -f morphplugin/src/main/resources/scalac-plugin.xml
          test -f frontend/src/main/scala/morphhdl/frontend/NaturalSymbolicConditional.scala
          test -f morphhdl/src/test/scala/morphhdl/NaturalSymbolicConditionalTests.scala
          test -f morphhdl/scripts/check-natural-symbolic-conditional-boundary.sh
          grep -Fq -- '- [ ] **Increment 48 — Natural symbolic conditionals for explicit `HdlInt`/`HdlBool`**' docs/morphhdl/parameterized-verilog-todo.md
          test ! -e .github/increment48
          test ! -e tmp-increment48-completion-trigger.txt
          test ! -e tmp-tool-probe.txt
          test ! -e tmp-increment48-retrigger.txt
          test "$(git diff --name-only origin/parameterized-verilog...HEAD -- core/src/main/scala lib/src/main/scala idslplugin/src/main/scala | wc -l)" -eq 0
          mapfile -t changed < <(git diff --name-only origin/parameterized-verilog...HEAD)
          bash morphhdl/scripts/check-natural-symbolic-conditional-boundary.sh "${changed[@]}"
          git diff --check origin/parameterized-verilog...HEAD

      - name: Install strict Verilog validators
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
          iverilog -V
          yosys -V

      - name: Validate Increment 48 on Scala 2.12.18
        run: >-
          sbt --batch --no-server
          '++2.12.18'
          'morphplugin/compile'
          'frontend/compile'
          'morph/testOnly morphhdl.NaturalSymbolicConditionalTests'

      - name: Validate Increment 48 on Scala 2.13.12
        run: >-
          sbt --batch --no-server
          '++2.13.12'
          'morphplugin/compile'
          'frontend/compile'
          'morph/testOnly morphhdl.NaturalSymbolicConditionalTests'

      - name: Run inherited preservation regressions
        run: >-
          sbt --batch --no-server
          '++2.12.18'
          'morph/testOnly
          morphhdl.StructuralGenerateControlTests
          morphhdl.GenericProcessLoweringTests
          morphhdl.MorphSingleSourceVerilogTests
          morphhdl.NativeLibraryReuseTests
          morphhdl.NativeSymbolicMemoryTests
          morphhdl.ParameterizedStreamFifoDepthTests'

      - name: Wait for all independent checks on this implementation head
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          deadline=$((SECONDS + 5400))
          while (( SECONDS < deadline )); do
            json=$(gh api "repos/pysolvesemi/MorphHDL/commits/${sha}/check-runs?per_page=100")
            blocking=$(jq '[.check_runs[]
              | select(.name != "validate-and-merge")
              | select(.name != "validate-and-merge / validate-and-merge")
              | select(.status != "completed" or (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length' <<<"${json}")
            failed=$(jq '[.check_runs[]
              | select(.name != "validate-and-merge")
              | select(.name != "validate-and-merge / validate-and-merge")
              | select(.status == "completed")
              | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure")] | length' <<<"${json}")
            if (( failed > 0 )); then
              jq -r '.check_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure") | "FAILED: \(.name) \(.html_url)"' <<<"${json}"
              exit 1
            fi
            if (( blocking == 0 )); then
              jq -r '.check_runs[] | "CHECK: \(.name) status=\(.status) conclusion=\(.conclusion)"' <<<"${json}"
              exit 0
            fi
            sleep 30
          done
          echo "Timed out waiting for independent checks on ${sha}" >&2
          exit 1

      - name: Mark roadmap complete and remove temporary Increment 48 machinery
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('docs/morphhdl/parameterized-verilog-todo.md')
          text = path.read_text()
          old = '- [ ] **Increment 48 — Natural symbolic conditionals for explicit `HdlInt`/`HdlBool`**'
          new = '- [x] **Increment 48 — Natural symbolic conditionals for explicit `HdlInt`/`HdlBool`**'
          if old not in text:
              raise SystemExit('Increment 48 unchecked roadmap entry missing')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/morphhdl-increment-48-*.yml
          git add -- docs/morphhdl/parameterized-verilog-todo.md
          git add -u -- .github/workflows
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Complete Increment 48 roadmap and remove recovery workflows'
          git push origin HEAD:agent/increment-48-completion

      - name: Mark ready and squash merge the validated PR
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          gh pr ready 79 --repo pysolvesemi/MorphHDL || true
          result=$(gh api \
            --method PUT \
            repos/pysolvesemi/MorphHDL/pulls/79/merge \
            -f merge_method=squash \
            -f sha="${sha}" \
            -f commit_title='Increment 48: natural symbolic conditionals' \
            -f commit_message='Commit the permanent MorphHDL-owned typed symbolic conditional transformation, dual-Scala contracts, strict Verilog-2001 validation, cleanup, and completed roadmap state.')
          jq -e '.merged == true' <<<"${result}"
          jq -r '.sha' <<<"${result}"

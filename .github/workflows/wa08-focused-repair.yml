name: WA-08 focused repair

on:
  push:
    branches:
      - agent/wa-08-production-handoff

permissions:
  contents: write

concurrency:
  group: wa08-focused-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out WA-08 branch
        uses: actions/checkout@v4
        with:
          ref: agent/wa-08-production-handoff
          fetch-depth: 0

      - name: Apply reviewed profile and signature repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"{path}: expected exactly one reviewed replacement, found {count}"
                  )
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          adapters = (
              "morphhdl-passes/src/main/scala/morphhdl/passes/adapter/CanonicalIrPassAdapter.scala",
              "morphhdl/src/main/scala/morphhdl/passes/adapter/CanonicalIrPassAdapter.scala",
          )
          for path in adapters:
              replace_once(
                  path,
                  "handoff.profile == CanonicalIrProfile.SimpleWireAssignmentsV1,",
                  "handoff.profile == CanonicalIrHandoff.productionProfile,",
              )

          replace_once(
              "morphhdl-passes/src/test/scala/morphhdl/passes/adapter/CanonicalIrPassAdapterSpec.scala",
              "handoff.profile shouldBe CanonicalIrProfile.SimpleWireAssignmentsV1",
              "handoff.profile shouldBe CanonicalIrProfile.PureWireExpressionsV1",
          )

          replace_once(
              "morphhdl/src/test/scala/morphhdl/MorphCanonicalIrHandoffTests.scala",
              "assert(report.handoff.profile == CanonicalIrProfile.SimpleWireAssignmentsV1)\n      assert(report.handoff.completeFacets == CanonicalIrHandoff.productionFacets)",
              "assert(report.handoff.profile == CanonicalIrProfile.PureWireExpressionsV1)\n      assert(report.handoff.completeFacets == CanonicalIrHandoff.productionFacets)\n      assert(report.handoff.completeFacets.contains(CanonicalIrFacet.PureExpressions))",
          )

          registry_path = Path(
              "morphhdl-passes/tests/formal_model/wire_assignment_ir/expected-signatures.json"
          )
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          key = "morphhdl-passes/scripts/check-boundary.sh"
          previous = registry["files"].get(key)
          expected_previous = "0ab78917546654ac537dc345cfee8e0bfb29c5d08e9090f7b513069a6422322d"
          if previous != expected_previous:
              raise RuntimeError(
                  f"unexpected prior signature for {key}: {previous!r}"
              )
          registry["files"][key] = (
              "80102a44dda083f465953bf46ee0e0b8adb53119c7df19a75f05d6f65dbc1278"
          )
          registry_path.write_text(
              json.dumps(registry, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          Path(".github/workflows/wa08-focused-repair.yml").unlink()
          PY

          python3 morphhdl-passes/scripts/validate_wire_assignment_equivalence.py --self-test
          git diff --check

      - name: Commit focused repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix WA-08 pure-profile qualification failures"
          git push origin HEAD:agent/wa-08-production-handoff

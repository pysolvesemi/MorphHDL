name: Increment 52 apply reviewed closure from PR

on:
  pull_request:
    branches:
      - parameterized-verilog
    paths:
      - .github/workflows/increment-52-apply-closure-pr.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-52-apply-closure-pr
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

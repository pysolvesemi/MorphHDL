name: Increment 59a recursive synthesis probe
on:
  push:
    branches: [agent/increment-59a-recursive-verilog-module]
permissions:
  contents: read
jobs:
  probe:
    if: startsWith(github.event.head_commit.message, 'Probe bounded self-recursion')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Synthesize and prove finite Verilog-2001 self-recursion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-artifacts
          cd probe-artifacts
          yosys -V | tee tool-versions.txt
          verilator --version | tee -a tool-versions.txt
          iverilog -V >> tool-versions.txt 2>&1
          cat > power.v <<'VERILOG'
          module Power #(parameter integer N=5)(input wire [7:0] x, output wire [7:0] y);
            generate
              if (N==0) begin : g_base
                assign y=8'd1;
              end else begin : g_step
                wire [7:0] previous;
                Power #(.N(N-1)) recursive(.x(x), .y(previous));
                assign y=x*previous;
              end
            endgenerate
          endmodule
          VERILOG
          python3 - <<'PY'
          from pathlib import Path
          for n in range(9):
              Path(f'top{n}.v').write_text(f'module Top{n}(input wire [7:0] x, output wire [7:0] y); Power #(.N({n})) dut(.x(x),.y(y)); endmodule\n')
              terms = ['wire [7:0] p0; assign p0=8\'d1;']
              for i in range(1,n+1):
                  terms.append(f'wire [7:0] p{i}; assign p{i}=p{i-1}*x;')
              Path(f'miter{n}.v').write_text(f'module Miter{n}(input wire [7:0] x, output wire mismatch); wire [7:0] y; Power #(.N({n})) dut(.x(x),.y(y)); '+ ' '.join(terms)+f' assign mismatch=(y != p{n}); endmodule\n')
          PY
          for n in {0..8}; do
            iverilog -g2001 -s Top$n -o top$n.vvp power.v top$n.v
            verilator --lint-only --language 1364-2001 -Wno-fatal --top-module Top$n power.v top$n.v > verilator$n.log 2>&1
            timeout 120 yosys -Q -ql synth$n.log -p "read_verilog -defer power.v top$n.v; hierarchy -simcheck -top Top$n; synth -top Top$n -flatten; check -assert; select -assert-none t:Power; write_json synth$n.json"
            timeout 120 yosys -Q -ql formal$n.log -p "read_verilog -defer power.v miter$n.v; hierarchy -simcheck -top Miter$n; proc; flatten; opt; check -assert; sat -verify -prove mismatch 0 -set-def-inputs -show x,y"
            echo "PASS: self-recursion N=$n parsing, lint, full synthesis and SAT equivalence"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          for n in range(9):
              modules=json.loads(Path(f'synth{n}.json').read_text())['modules']
              assert list(modules)==[f'Top{n}'], modules.keys()
              cells=modules[f'Top{n}']['cells']
              assert all(c['type'].startswith('$_') for c in cells.values()), cells
              assert not any(m.get('attributes',{}).get('blackbox','0').strip('0') for m in modules.values())
              print(f'N={n}: one flattened module, {len(cells)} mapped primitive cells, no unresolved/self-recursive cells')
          print('RECURSIVE SYNTHESIS PREFLIGHT PASS')
          PY
      - name: Inspect exact structural relocation boundaries
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = {
              'morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala': ['canonicalOf(', 'BlackBox', 'childRanges', 'instanceRange', 'private def planBlock'],
              'morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogHierarchy.scala': ['blackBox', 'rewriteBlackBox', 'isBlackBox'],
              'core/src/main/scala/spinal/core/internals/ParameterizedBlackBoxGeneric.scala': ['def recordsOf', 'IntegerGeneric', 'def record'],
              'morphruntime/src/main/scala/spinal/core/ParameterizedStructure.scala': ['STRUCTURAL-BLACKBOX', 'def projectedChildEvaluationOf'],
              'morphhdl/src/main/scala/spinal/core/internals/MorphHdlCanonicalIrProducer.scala': ['BlackBox', 'canonicalOf']
          }
          for name, patterns in targets.items():
              print('\n=== '+name+' ===')
              lines=Path(name).read_text().splitlines()
              selected=set()
              for i,line in enumerate(lines):
                  if any(pattern in line for pattern in patterns):
                      selected.update(range(max(0,i-12), min(len(lines),i+35)))
              for i in sorted(selected):
                  print(f'{i+1}: {lines[i]}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-59a-recursive-synthesis-preflight
          path: probe-artifacts
          if-no-files-found: error

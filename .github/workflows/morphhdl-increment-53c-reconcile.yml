name: MorphHDL Increment 53c proof reconciliation

on:
  push:
    branches:
      - agent/increment-53c-reconcile-20260828
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: morphhdl-increment-53c-proof-reconciliation
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: pysolvesemi/MorphHDL
      FEATURE_BRANCH: agent/increment-53c-native-axi4-slave-factory-offsets
      RECONCILE_BRANCH: agent/increment-53c-reconcile-20260828
      BASE_BRANCH: parameterized-verilog
      ORIGINAL_WORKFLOW: .github/workflows/morphhdl-native-axi4-slave-factory-offsets.yml
      FORMAL_WORKFLOW: .github/workflows/morphhdl-native-axi4-slave-factory-formal-v2.yml
      PR_NUMBER: "108"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/increment-53c-reconcile-20260828

      - name: Reconcile exact proof, roadmap closure, and merge state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          feature = os.environ["FEATURE_BRANCH"]
          reconcile = os.environ["RECONCILE_BRANCH"]
          base = os.environ["BASE_BRANCH"]
          pr_number = int(os.environ["PR_NUMBER"])
          token = os.environ["GH_TOKEN"]
          original_path = os.environ["ORIGINAL_WORKFLOW"]
          formal_path = os.environ["FORMAL_WORKFLOW"]
          required = {
              original_path: {
                  "Native AXI4 factory proof Scala 2.12.18",
                  "Native AXI4 factory proof Scala 2.13.12",
              },
              formal_path: {
                  "Concrete-witness AXI4 proof Scala 2.12.18",
                  "Concrete-witness AXI4 proof Scala 2.13.12",
              },
          }
          temporary_paths = [
              ".github/workflows/morphhdl-increment-53c-autoclose.yml",
              ".github/workflows/morphhdl-increment-53c-autoclose-v2.yml",
              "morphhdl/src/test/resources/increment-53c-formal-closure.txt",
              "morphhdl/src/test/resources/increment-53c-formal-closure-v2.txt",
          ]
          proof_paths = [
              "morphruntime/src/main/scala/spinal/core/ExternalNativeAxi4SlaveFactoryParameterization.scala",
              "morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeAxi4SlaveFactoryParameterizationComponent.scala",
              "morphplugin/src/main/scala/morphhdl/compiler/MorphHdlPlugin.scala",
              "morphhdl/src/test/scala/morphhdl/NativeAxi4SlaveFactoryParameterizedOffsetTests.scala",
              "morphhdl/src/test/scala/morphhdl/NativeAxi4SlaveFactoryFormalEquivalenceV2Tests.scala",
              ".github/workflows/morphhdl-native-axi4-slave-factory-offsets.yml",
              ".github/workflows/morphhdl-native-axi4-slave-factory-formal-v2.yml",
          ]

          def api(method, path, payload=None, allow_404=False):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "MorphHDL-Increment-53c-reconciler",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      if response.status == 204:
                          return None
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  if allow_404 and error.code == 404:
                      return None
                  raise RuntimeError(
                      f"GitHub API {method} {path} failed with {error.code}: {body}"
                  )

          def git(*args, check=True):
              command = ["git", *args]
              print("+", " ".join(command), flush=True)
              result = subprocess.run(command, text=True, capture_output=True)
              if result.stdout:
                  print(result.stdout, end="", flush=True)
              if result.stderr:
                  print(result.stderr, end="", flush=True)
              if check and result.returncode != 0:
                  raise RuntimeError(
                      f"command failed ({result.returncode}): {' '.join(command)}"
                  )
              return result

          def runs_for_sha(sha):
              encoded = urllib.parse.quote(sha, safe="")
              return api(
                  "GET",
                  f"/repos/{repo}/actions/runs?head_sha={encoded}&per_page=100",
              ).get("workflow_runs", [])

          def validate_sha_once(sha):
              runs = runs_for_sha(sha)
              latest = {}
              for run in runs:
                  path = run.get("path")
                  if path not in required:
                      continue
                  previous = latest.get(path)
                  if previous is None or run.get("created_at", "") > previous.get("created_at", ""):
                      latest[path] = run
              if set(latest) != set(required):
                  return False, {"reason": "missing workflows", "runs": latest}
              if any(run.get("status") != "completed" for run in latest.values()):
                  return False, {"reason": "workflows pending", "runs": latest}
              evidence = {}
              for path, names in required.items():
                  run = latest[path]
                  jobs = api(
                      "GET",
                      f"/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100",
                  ).get("jobs", [])
                  by_name = {job.get("name"): job for job in jobs}
                  missing = sorted(names - set(by_name))
                  failed = sorted(
                      name for name in names
                      if name in by_name and by_name[name].get("conclusion") != "success"
                  )
                  evidence[path] = {
                      "run_id": run.get("id"),
                      "run_conclusion": run.get("conclusion"),
                      "jobs": {
                          name: by_name.get(name, {}).get("conclusion")
                          for name in sorted(names)
                      },
                  }
                  if missing:
                      return False, {
                          "reason": f"missing named jobs in {path}: {missing}",
                          "evidence": evidence,
                      }
                  if failed:
                      return False, {
                          "reason": f"failed named jobs in {path}: {failed}",
                          "evidence": evidence,
                      }
              return True, evidence

          def wait_for_exact_sha(sha, minutes=55):
              deadline = time.time() + minutes * 60
              last = None
              while time.time() < deadline:
                  passed, detail = validate_sha_once(sha)
                  last = detail
                  if passed:
                      print("validated exact proof SHA", sha, json.dumps(detail, indent=2))
                      return detail
                  reason = detail.get("reason", "unknown") if isinstance(detail, dict) else str(detail)
                  if reason.startswith("failed named jobs"):
                      raise RuntimeError(
                          f"exact-head proof failed for {sha}: {json.dumps(detail, indent=2)}"
                      )
                  print("waiting for exact proof SHA", sha, reason, flush=True)
                  time.sleep(20)
              raise RuntimeError(
                  f"timed out waiting for exact proof SHA {sha}: {json.dumps(last, indent=2)}"
              )

          def latest_joint_proven_sha(minutes=55):
              deadline = time.time() + minutes * 60
              last = []
              encoded = urllib.parse.quote(feature, safe="")
              while time.time() < deadline:
                  runs = api(
                      "GET",
                      f"/repos/{repo}/actions/runs?branch={encoded}&per_page=100",
                  ).get("workflow_runs", [])
                  candidates = []
                  for run in runs:
                      if run.get("path") == formal_path:
                          candidates.append((run.get("created_at", ""), run.get("head_sha")))
                  seen = set()
                  for _, sha in sorted(candidates, reverse=True):
                      if not sha or sha in seen:
                          continue
                      seen.add(sha)
                      passed, detail = validate_sha_once(sha)
                      last.append({"sha": sha, "detail": detail})
                      if passed:
                          print("selected jointly proven SHA", sha, json.dumps(detail, indent=2))
                          return sha, detail
                  print("waiting for a jointly proven feature SHA", flush=True)
                  time.sleep(20)
              raise RuntimeError(
                  "no jointly proven feature SHA appeared: " + json.dumps(last[-10:], indent=2)
              )

          def assert_pr_source_boundary():
              page = 1
              changed = []
              while True:
                  files = api(
                      "GET",
                      f"/repos/{repo}/pulls/{pr_number}/files?per_page=100&page={page}",
                  )
                  changed.extend(item.get("filename", "") for item in files)
                  if len(files) < 100:
                      break
                  page += 1
              forbidden = [
                  path for path in changed
                  if path.startswith(("core/src/main/", "lib/src/main/", "idslplugin/src/main/"))
              ]
              if forbidden:
                  raise RuntimeError(
                      "Increment 53c modified forbidden native production sources: "
                      + ", ".join(forbidden)
                  )
              print("native source boundary confirmed across", len(changed), "PR files")

          def mark_roadmap_and_remove_temporary():
              roadmap = pathlib.Path("docs/morphhdl/parameterized-verilog-todo.md")
              lines = roadmap.read_text().splitlines()
              indices = [
                  index for index, line in enumerate(lines)
                  if line.lstrip().startswith("- [") and "**Increment 53c" in line
              ]
              if len(indices) != 1:
                  raise RuntimeError(
                      f"expected one Increment 53c checklist line, found {len(indices)}"
                  )
              index = indices[0]
              if "- [ ]" in lines[index]:
                  lines[index] = lines[index].replace("- [ ]", "- [x]", 1)
              elif "- [x]" not in lines[index]:
                  raise RuntimeError("malformed Increment 53c checklist: " + lines[index])
              roadmap.write_text("\n".join(lines) + "\n")
              for raw in temporary_paths:
                  path = pathlib.Path(raw)
                  if path.exists():
                      path.unlink()

          def ensure_proof_files_from(sha):
              missing = []
              for raw in proof_paths:
                  path = pathlib.Path(raw)
                  if path.exists():
                      continue
                  result = git("show", f"{sha}:{raw}", check=False)
                  if result.returncode != 0:
                      missing.append(raw)
                      continue
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(result.stdout)
              if missing:
                  raise RuntimeError(
                      "proven feature SHA lacks required files: " + ", ".join(missing)
                  )

          def commit_if_needed(message):
              git("add", "-A")
              staged = git("diff", "--cached", "--quiet", check=False)
              if staged.returncode == 0:
                  return None
              git("diff", "--cached", "--check")
              git("commit", "-m", message)
              return git("rev-parse", "HEAD").stdout.strip()

          def merge_open_original(pr):
              git("fetch", "origin", base, feature)
              git("checkout", "-B", feature, f"origin/{feature}")
              if git("merge-base", "--is-ancestor", f"origin/{base}", "HEAD", check=False).returncode != 0:
                  git("merge", "--no-edit", f"origin/{base}")
                  git("push", "origin", f"HEAD:{feature}")
              code_sha = git("rev-parse", "HEAD").stdout.strip()
              evidence = wait_for_exact_sha(code_sha)
              assert_pr_source_boundary()
              mark_roadmap_and_remove_temporary()
              final_sha = commit_if_needed(
                  "Close Increment 53c after dual-Scala AXI4 formal proof"
              ) or code_sha
              if final_sha != code_sha:
                  changed = git("diff", "--name-only", code_sha, final_sha).stdout.splitlines()
                  allowed = set(temporary_paths + ["docs/morphhdl/parameterized-verilog-todo.md"])
                  unexpected = sorted(set(changed) - allowed)
                  if unexpected:
                      raise RuntimeError(
                          "closure commit changed non-closure files: " + ", ".join(unexpected)
                      )
                  git("push", "origin", f"HEAD:{feature}")

              latest_pr = api("GET", f"/repos/{repo}/pulls/{pr_number}")
              if latest_pr.get("head", {}).get("sha") != final_sha:
                  raise RuntimeError(
                      f"PR head moved before merge: expected {final_sha}, got "
                      f"{latest_pr.get('head', {}).get('sha')}"
                  )
              if latest_pr.get("draft"):
                  mutation = {
                      "query": "mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft}}}",
                      "variables": {"id": latest_pr["node_id"]},
                  }
                  response = api("POST", "/graphql", mutation)
                  if response.get("errors"):
                      raise RuntimeError("failed to mark PR ready: " + json.dumps(response))

              result = api(
                  "PUT",
                  f"/repos/{repo}/pulls/{pr_number}/merge",
                  {
                      "commit_title": "Increment 53c: parameterize native Axi4SlaveFactory offsets (#108)",
                      "commit_message": (
                          "Reuse the untouched SpinalHDL Axi4SlaveFactory while preserving "
                          "direct and derived symbolic offsets. Exact-head dual-Scala focused, "
                          "strict-tool, independent concrete-witness proofs and mutation control "
                          "passed before roadmap closure."
                      ),
                      "sha": final_sha,
                      "merge_method": "squash",
                  },
              )
              if not result.get("merged"):
                  raise RuntimeError("guarded merge declined: " + json.dumps(result))
              return {
                  "mode": "original-pr-closure",
                  "code_sha": code_sha,
                  "final_head_sha": final_sha,
                  "merge_sha": result.get("sha"),
                  "evidence": evidence,
              }

          def reconcile_already_merged(pr):
              proven_sha, evidence = latest_joint_proven_sha()
              assert_pr_source_boundary()
              git("fetch", "origin", base, feature)
              git("checkout", "-B", reconcile, f"origin/{base}")
              ensure_proof_files_from(proven_sha)
              mark_roadmap_and_remove_temporary()
              final_sha = commit_if_needed(
                  "Reconcile Increment 53c proof closure after PR #108"
              )
              if final_sha is None:
                  return {
                      "mode": "already-merged-clean",
                      "proven_sha": proven_sha,
                      "base_sha": git("rev-parse", "HEAD").stdout.strip(),
                      "evidence": evidence,
                  }
              git("push", "--force-with-lease", "origin", f"HEAD:{reconcile}")

              existing = api(
                  "GET",
                  f"/repos/{repo}/pulls?state=open&head=pysolvesemi:{urllib.parse.quote(reconcile, safe='')}&base={urllib.parse.quote(base, safe='')}",
              )
              if existing:
                  cleanup_pr = existing[0]
              else:
                  cleanup_pr = api(
                      "POST",
                      f"/repos/{repo}/pulls",
                      {
                          "title": "Reconcile Increment 53c proof closure",
                          "head": reconcile,
                          "base": base,
                          "body": (
                              "PR #108 was already merged while its proof workflows were in flight. "
                              "This minimal follow-up preserves the independently proven AXI4 witness "
                              "files, marks Increment 53c complete, and removes temporary closure machinery."
                          ),
                      },
                  )
              cleanup_number = cleanup_pr["number"]
              result = api(
                  "PUT",
                  f"/repos/{repo}/pulls/{cleanup_number}/merge",
                  {
                      "commit_title": f"Reconcile Increment 53c proof closure (#{cleanup_number})",
                      "commit_message": (
                          "Exact dual-Scala native AXI4 focused jobs and independent concrete-witness "
                          "formal jobs passed before this roadmap and temporary-file reconciliation."
                      ),
                      "sha": final_sha,
                      "merge_method": "squash",
                  },
              )
              if not result.get("merged"):
                  raise RuntimeError("cleanup merge declined: " + json.dumps(result))
              return {
                  "mode": "post-merge-reconciliation",
                  "proven_sha": proven_sha,
                  "cleanup_pr": cleanup_number,
                  "cleanup_head_sha": final_sha,
                  "cleanup_merge_sha": result.get("sha"),
                  "evidence": evidence,
              }

          git("config", "user.name", "OpenAI MorphHDL Agent")
          git("config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          pr = api("GET", f"/repos/{repo}/pulls/{pr_number}")
          if pr.get("merged"):
              result = reconcile_already_merged(pr)
          elif pr.get("state") == "open":
              result = merge_open_original(pr)
          else:
              raise RuntimeError(
                  "PR #108 is closed without a merge: " + json.dumps(pr, indent=2)
              )

          result["completed_at_epoch"] = int(time.time())
          pathlib.Path("/tmp/increment-53c-reconciliation-result.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          try:
              api(
                  "POST",
                  f"/repos/{repo}/issues/{pr_number}/comments",
                  {
                      "body": (
                          "Increment 53c guarded reconciliation completed.\n\n"
                          "```json\n" + json.dumps(result, indent=2, sort_keys=True) + "\n```"
                      )
                  },
              )
          except Exception as error:
              print("warning: could not post final evidence comment:", error)
          PY

      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53c-reconciliation-evidence
          path: /tmp/increment-53c-reconciliation-result.json
          if-no-files-found: warn
          retention-days: 14

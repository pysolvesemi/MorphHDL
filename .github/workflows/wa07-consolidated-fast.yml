name: WA-07 consolidated fast validation

on:
  push:
    branches:
      - agent/wa-07-unified-expression-inlining
    paths:
      - ".github/workflows/wa07-consolidated-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wa-07-unified-expression-inlining
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@v1
      - name: Run static guards against an uncommitted closure-state copy
        shell: bash
        run: |
          set -euo pipefail
          cp morphhdl-passes/morphhdl-ir-wire-assignment-passes-todo.md /tmp/wa07-roadmap.md
          python3 - <<'PY'
          from pathlib import Path
          path = Path("morphhdl-passes/morphhdl-ir-wire-assignment-passes-todo.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "- [ ] **WA-07 — Unified pass control and unnamed expression-assignment elimination**",
              "- [x] **WA-07 — Unified pass control and unnamed expression-assignment elimination**",
              1,
          ).replace("**Status:** `IN PROGRESS`.", "**Status:** `COMPLETED`.", 1)
          text = text.replace("**Status:** `BLOCKED`.", "**Status:** `READY`.", 1)
          path.write_text(text, encoding="utf-8")
          PY
          for script in \
            check-wa02-adapter-boundary.py \
            check-wa03-gates.py \
            check-wa04-pass.py \
            check-wa05-pass.py \
            check-wa06-pipeline.py \
            check-wa07-global-pass-control.py \
            check-wa07-pass.py \
            check-wa07-expression-pass.py; do
            python3 "morphhdl-passes/scripts/${script}" --self-test
            python3 "morphhdl-passes/scripts/${script}"
          done
          python3 morphhdl-passes/scripts/validate_wire_assignment_equivalence.py --self-test
          mv /tmp/wa07-roadmap.md morphhdl-passes/morphhdl-ir-wire-assignment-passes-todo.md
          git diff --exit-code -- morphhdl-passes/morphhdl-ir-wire-assignment-passes-todo.md
      - name: Scala 2.12 contracts and transforms
        working-directory: morphhdl-passes
        run: sbt -batch ++2.12.18 test
      - name: Scala 2.13 contracts and transforms
        working-directory: morphhdl-passes
        run: sbt -batch ++2.13.12 test

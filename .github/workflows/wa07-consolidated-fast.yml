name: WA-07 consolidated fast validation

on:
  push:
    branches:
      - agent/wa-07-unified-expression-inlining
    paths:
      - ".github/workflows/wa07-consolidated-fast.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wa-07-unified-expression-inlining
          fetch-depth: 0
      - name: Repair implementation-versus-closure roadmap guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changed = []
          guard = Path("morphhdl-passes/scripts/check-wa06-pipeline.py")
          text = guard.read_text(encoding="utf-8")
          old = '''    if not wa07_checked or "**Status:** `COMPLETED`" not in wa07_body:
              failures.append(f"{path}: WA06-SUCCESSOR: completed WA-07 must retain WA-06")
          if wa08_checked or "**Status:** `READY`" not in wa08_body:
              failures.append(f"{path}: WA06-NEXT-STATUS: WA-08 must remain open and READY")
          '''
          new = '''    if wa07_checked:
              if "**Status:** `COMPLETED`" not in wa07_body:
                  failures.append(f"{path}: WA06-SUCCESSOR: checked WA-07 must be COMPLETED")
              if wa08_checked or "**Status:** `READY`" not in wa08_body:
                  failures.append(f"{path}: WA06-NEXT-STATUS: completed WA-07 requires open READY WA-08")
          else:
              if "**Status:** `IN PROGRESS`" not in wa07_body:
                  failures.append(f"{path}: WA06-SUCCESSOR: open WA-07 must be IN PROGRESS")
              if wa08_checked or "**Status:** `BLOCKED`" not in wa08_body:
                  failures.append(f"{path}: WA06-NEXT-STATUS: in-progress WA-07 requires open BLOCKED WA-08")
          '''
          if old in text:
              guard.write_text(text.replace(old, new, 1), encoding="utf-8")
              changed.append(str(guard))
          elif new not in text:
              raise SystemExit("WA-06 successor guard replacement point is missing")

          roadmap = Path("morphhdl-passes/morphhdl-ir-wire-assignment-passes-todo.md")
          text = roadmap.read_text(encoding="utf-8")
          first = "One configuration flag enables all passes in the fixed order above; false disables the entire pass pipeline."
          second = "RHS expressions are copied once per receiver"
          if first not in text:
              marker = "Product code has one all-or-none `enabled` flag. `false` executes no pass;\n`true` executes all three in the fixed order above."
              if marker not in text:
                  raise SystemExit("global-control roadmap insertion point is missing")
              text = text.replace(marker, marker + "\n\n" + first, 1)
          if second not in text:
              marker = "The exact temporary declaration and sole assignment are removed."
              if marker not in text:
                  raise SystemExit("expression-copy roadmap insertion point is missing")
              text = text.replace(
                  marker,
                  second + "; each copy preserves the removed assignment's packed type fence.\n\n" + marker,
                  1,
              )
          roadmap.write_text(text, encoding="utf-8")
          if str(roadmap) not in changed:
              changed.append(str(roadmap))

          Path("/tmp/wa07-fast-changed.txt").write_text("\n".join(changed), encoding="utf-8")
          PY
          mapfile -t changed < /tmp/wa07-fast-changed.txt
          actual=()
          for path in "${changed[@]}"; do
            if ! git diff --quiet -- "${path}"; then actual+=("${path}"); fi
          done
          if (( ${#actual[@]} )); then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -- "${actual[@]}"
            git commit -m "WA-07: make inherited roadmap guard closure-state aware"
            git pull --rebase origin agent/wa-07-unified-expression-inlining
            git push origin HEAD:agent/wa-07-unified-expression-inlining
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@v1
      - name: Run every static pass-workspace guard
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            check-wa02-adapter-boundary.py \
            check-wa03-gates.py \
            check-wa04-pass.py \
            check-wa05-pass.py \
            check-wa06-pipeline.py \
            check-wa07-global-pass-control.py \
            check-wa07-pass.py \
            check-wa07-expression-pass.py; do
            test -f "morphhdl-passes/scripts/${script}"
            python3 "morphhdl-passes/scripts/${script}" --self-test
            python3 "morphhdl-passes/scripts/${script}"
          done
          python3 morphhdl-passes/scripts/validate_wire_assignment_equivalence.py --self-test
      - name: Scala 2.12 contracts and transforms
        working-directory: morphhdl-passes
        run: sbt -batch ++2.12.18 test
      - name: Scala 2.13 contracts and transforms
        working-directory: morphhdl-passes
        run: sbt -batch ++2.13.12 test

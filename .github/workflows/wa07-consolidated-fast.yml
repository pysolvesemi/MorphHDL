name: WA-07 consolidated fast validation

on:
  push:
    branches:
      - agent/wa-07-unified-expression-inlining
    paths:
      - ".github/workflows/wa07-consolidated-fast.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wa-07-unified-expression-inlining
          fetch-depth: 0
      - name: Make the inherited WA-06 roadmap guard closure-state aware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("morphhdl-passes/scripts/check-wa06-pipeline.py")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'    if not wa07_checked or "\*\*Status:\*\* `COMPLETED`" not in wa07_body:\n'
              r'        failures\.append\(f"\{path\}: WA06-SUCCESSOR: completed WA-07 must retain WA-06"\)\n'
              r'    if wa08_checked or "\*\*Status:\*\* `READY`" not in wa08_body:\n'
              r'        failures\.append\(f"\{path\}: WA06-NEXT-STATUS: WA-08 must remain open and READY"\)\n'
          )
          replacement = '''    if wa07_checked:
              if "**Status:** `COMPLETED`" not in wa07_body:
                  failures.append(f"{path}: WA06-SUCCESSOR: checked WA-07 must be COMPLETED")
              if wa08_checked or "**Status:** `READY`" not in wa08_body:
                  failures.append(f"{path}: WA06-NEXT-STATUS: completed WA-07 requires open READY WA-08")
          else:
              if "**Status:** `IN PROGRESS`" not in wa07_body:
                  failures.append(f"{path}: WA06-SUCCESSOR: open WA-07 must be IN PROGRESS")
              if wa08_checked or "**Status:** `BLOCKED`" not in wa08_body:
                  failures.append(f"{path}: WA06-NEXT-STATUS: in-progress WA-07 requires open BLOCKED WA-08")
          '''
          updated, count = pattern.subn(replacement, text, count=1)
          if count == 0 and "in-progress WA-07 requires open BLOCKED WA-08" not in text:
              raise SystemExit("unable to locate the WA-06 successor-state block")
          if count:
              path.write_text(updated, encoding="utf-8")
          PY
          if ! git diff --quiet -- morphhdl-passes/scripts/check-wa06-pipeline.py; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add morphhdl-passes/scripts/check-wa06-pipeline.py
            git commit -m "WA-07: distinguish implementation and closure roadmap states"
            git pull --rebase origin agent/wa-07-unified-expression-inlining
            git push origin HEAD:agent/wa-07-unified-expression-inlining
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@v1
      - name: Run every static pass-workspace guard
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            check-wa02-adapter-boundary.py \
            check-wa03-gates.py \
            check-wa04-pass.py \
            check-wa05-pass.py \
            check-wa06-pipeline.py \
            check-wa07-global-pass-control.py \
            check-wa07-pass.py \
            check-wa07-expression-pass.py; do
            python3 "morphhdl-passes/scripts/${script}" --self-test
            python3 "morphhdl-passes/scripts/${script}"
          done
          python3 morphhdl-passes/scripts/validate_wire_assignment_equivalence.py --self-test
      - name: Scala 2.12 contracts and transforms
        working-directory: morphhdl-passes
        run: sbt -batch ++2.12.18 test
      - name: Scala 2.13 contracts and transforms
        working-directory: morphhdl-passes
        run: sbt -batch ++2.13.12 test

name: Apply Increment 31 contract checker fix

on:
  push:
    branches:
      - agent/increment-31-generic-expressions
    paths:
      - .github/workflows/agent-increment-31-contract-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-31-generic-expressions
          fetch-depth: 0

      - name: Align strict contract checker with Increment 31
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("morphhdl/scripts/check-contracts.sh")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "require_property frontend.symbolic_width_logic equal-schema-leaf-wire-and-unconditional-register":
                  "require_property frontend.symbolic_width_logic ordinary-assignment-mux-arithmetic-concat-fixed-slice-domain-invariant-narrowing-resize",
              "require_property frontend.single_source_literal_bitvector_ports reject-untagged":
                  "require_property frontend.single_source_literal_bitvector_ports reject-when-no-symbolic-schema",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one contract line {old!r}, found {count}")
              text = text.replace(old, new)

          anchor = "require_property implementation.single_source_symbolic_data_shapes true\n"
          addition = (
              anchor
              + "require_property implementation.single_source_generic_expressions true\n"
              + "require_property implementation.single_source_native_stream_m2s_pipe true\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one capability anchor, found {text.count(anchor)}")
          text = text.replace(anchor, addition)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git diff -- morphhdl/scripts/check-contracts.sh

      - name: Install strict Verilog-2001 validation tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog verilator yosys

      - name: Validate the complete reviewed contract suite
        shell: bash
        run: |
          ./morphhdl/scripts/check-contracts.sh --require-tools

      - name: Commit tested checker fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/agent-increment-31-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            morphhdl/scripts/check-contracts.sh \
            .github/workflows/agent-increment-31-contract-fix.yml
          git diff --cached --check
          git commit -m "Align strict contracts with Increment 31"
          git push origin HEAD:agent/increment-31-generic-expressions

name: RTL-P1-01 exact MorphHDL toolchain export

on:
  push:
    branches:
      - agent/rtl-p1-01-toolchain-export
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - name: Check out exact export branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact MorphHDL source ancestry and public-only delta
        shell: bash
        run: |
          set -euo pipefail
          base=81abd25518551b8a452ecf038e409331e646f726
          test "$(git merge-base HEAD "${base}")" = "${base}"
          mapfile -t changed < <(git diff --name-only "${base}" HEAD | sort -u)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/rtl-p1-01-toolchain-export.yml'

      - name: Build exact Scala 2.12 MorphHDL classpath
        shell: bash
        env:
          SBT_TEST_PARALLEL: '0'
        run: |
          set -euo pipefail
          export COURSIER_CACHE=/tmp/rtl-p1-01-coursier
          sbt -batch -Dsbt.supershell=false \
            'idslpayload/Compile/packageBin' \
            'idslplugin/Compile/packageBin' \
            'sim/Compile/packageBin' \
            'paramrtl/Compile/packageBin' \
            'core/Compile/packageBin' \
            'frontend/Compile/packageBin' \
            'verilogBackend/Compile/packageBin' \
            'lib/Compile/packageBin' \
            'morph/Compile/packageBin'

      - name: Export self-contained compiler, runtime classpath, and exact source
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/rtl-p1-01-morphhdl-toolchain
          rm -rf "${out}"
          mkdir -p "${out}/jars" "${out}/source"

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          out = Path('/tmp/rtl-p1-01-morphhdl-toolchain')
          candidates = []
          candidates.extend(root.glob('*/target/scala-2.12/*.jar'))
          candidates.extend(root.glob('backends/*/target/scala-2.12/*.jar'))
          for cache in (
              Path('/tmp/rtl-p1-01-coursier'),
              Path('/sbt/.cache/coursier'),
              Path('/sbt/.ivy2/cache'),
              Path('/root/.cache/coursier'),
              Path('/root/.ivy2/cache'),
          ):
              if cache.exists():
                  candidates.extend(cache.rglob('*.jar'))

          selected = {}
          for path in sorted({p.resolve() for p in candidates if p.is_file()}, key=str):
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest in selected:
                  continue
              target = out / 'jars' / f'{digest[:16]}-{path.name}'
              target.write_bytes(data)
              selected[digest] = {
                  'source': str(path),
                  'path': str(target.relative_to(out)),
                  'bytes': len(data),
                  'sha256': digest,
              }

          names = [Path(row['source']).name.casefold() for row in selected.values()]
          required_exact = {
              'scala-library-2.12.18.jar',
              'scala-compiler-2.12.18.jar',
              'scala-reflect-2.12.18.jar',
          }
          missing = sorted(required_exact - set(names))
          if missing:
              raise SystemExit('missing required compiler jars: ' + ','.join(missing))

          requirements = {
              'idsl plugin': lambda name: 'idsl-plugin' in name or 'idslplugin' in name,
              'core package': lambda name: 'spinalhdl-core' in name,
              'lib package': lambda name: 'spinalhdl-lib' in name,
              'morph orchestration package': lambda name: 'morphhdl' in name and ('orchestration' in name or name.startswith('morphhdl_')),
          }
          for description, predicate in requirements.items():
              if not any(predicate(name) for name in names):
                  raise SystemExit(f'missing {description} jar; observed project jars=' + ','.join(sorted(name for name in names if 'spinal' in name or 'morph' in name)))

          manifest = {
              'schema': 'rtl-p1-01-morphhdl-toolchain-export/v1',
              'source_parent_commit': '81abd25518551b8a452ecf038e409331e646f726',
              'scala_version': '2.12.18',
              'jar_count': len(selected),
              'jars': sorted(selected.values(), key=lambda row: row['path']),
          }
          (out / 'manifest.json').write_text(
              json.dumps(manifest, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          (out / 'classpath.txt').write_text(
              ':'.join(row['path'] for row in manifest['jars']) + '\n',
              encoding='utf-8',
          )
          print('EXPORT_JAR_COUNT', len(selected))
          print('EXPORT_PROJECT_JARS')
          for name in sorted(name for name in names if 'spinal' in name or 'morph' in name):
              print(name)
          PY

          git archive --format=tar 81abd25518551b8a452ecf038e409331e646f726 \
            | gzip -n > "${out}/source/MorphHDL-81abd25518551b8a452ecf038e409331e646f726.tar.gz"
          sha256sum "${out}/manifest.json" "${out}/classpath.txt" "${out}/source/"*.tar.gz \
            > "${out}/SHA256SUMS"
          find "${out}" -type f -printf '%P %s bytes\n' | sort

      - name: Upload exact reusable toolchain
        uses: actions/upload-artifact@v4
        with:
          name: rtl-p1-01-morphhdl-toolchain-81abd255
          path: /tmp/rtl-p1-01-morphhdl-toolchain
          if-no-files-found: error
          retention-days: 7

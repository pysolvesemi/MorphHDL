name: Increment 41 apply trigger

on:
  pull_request:
    branches:
      - parameterized-verilog

permissions:
  contents: write

concurrency:
  group: increment-41-apply-trigger
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/increment-41-external-expression-hierarchy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-41-external-expression-hierarchy
          fetch-depth: 0
      - name: Merge repaired base and apply external-lowering checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin parameterized-verilog
          git merge --no-ff --no-commit origin/parameterized-verilog
          awk '
            /^H4sICI/ { capture = 1 }
            capture && /^PATCH_B64$/ { exit }
            capture { print }
          ' .github/workflows/increment-41-apply-checkpoint.yml > /tmp/increment41.patch.gz.b64
          base64 --decode /tmp/increment41.patch.gz.b64 | gzip --decompress > /tmp/increment41.patch
          git apply --index --3way /tmp/increment41.patch
          rm \
            .github/workflows/increment-41-apply-checkpoint.yml \
            .github/workflows/increment-41-apply-trigger.yml
          git add -A
          git commit -m 'Increment 41: externalize expression and hierarchy lowering'
          git push origin HEAD:agent/increment-41-external-expression-hierarchy

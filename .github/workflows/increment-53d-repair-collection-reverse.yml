name: Increment 53d collection reverse repair

on:
  push:
    branches:
      - agent/increment-53d-native-streamwidth-adapter
    paths:
      - .github/workflows/increment-53d-repair-collection-reverse.yml
      - morphhdl/scripts/apply-increment-53d-collection-reverse-repair.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-native-streamwidth-adapter
          fetch-depth: 0
      - name: Apply reviewed MorphHDL-only repair
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/apply-increment-53d-collection-reverse-repair.py
          git diff --check
          bash morphhdl/scripts/check-native-stream-width-adapter-boundary.sh
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name "MorphHDL Increment Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala \
            morphhdl/src/test/scala/morphhdl/ExternalNativeIntShadowExpressionTests.scala
          if git diff --cached --quiet; then
            echo "Increment 53d receiver repair already applied"
            exit 0
          fi
          git commit -m "fix(morphhdl): classify native Int calls by exact receiver provenance"
          git push origin HEAD:agent/increment-53d-native-streamwidth-adapter

name: MorphHDL native StreamFifo parameter structure

# Increment 53 proves that the real spinal.lib.StreamFifo implementation emits
# one parameterized definition for DEPTH values 1, 3, 5 and 8 while preserving
# the native depth-one, power-of-two and non-power-of-two structures.
on:
  push:
    branches:
      - main
      - parameterized-verilog
  pull_request:
    branches:
      - main
      - parameterized-verilog
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morphhdl-native-streamfifo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundary:
    name: Native StreamFifo source boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove native overload, pointer wiring and sidecar absence
        shell: bash
        run: bash morphhdl/scripts/check-native-streamfifo-structure-boundary.sh

  contracts:
    name: Native StreamFifo proof Scala ${{ matrix.scala_version }}
    needs: source-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    strategy:
      fail-fast: false
      matrix:
        scala_version:
          - "2.12.18"
          - "2.13.12"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Validate real native StreamFifo and inherited contracts
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morph[${{ matrix.scala_version }}].testOnly \
            morphhdl.ParameterizedStreamFifoDepthTests \
            morphhdl.BackendSyncMergeIsolationTests \
            morphhdl.CapturedAssignmentNormalizationTests \
            morphhdl.FormalParameterIdentityTests \
            morphhdl.FormalParameterClonePropagationTests \
            morphhdl.HierarchyParameterBindingTests \
            morphhdl.MorphSingleSourceVerilogTests \
            morphhdl.integration.ExternalSpinalVerilogBaselineTests

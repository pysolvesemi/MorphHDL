name: Sync and clean Increment 53d branch

on:
  push:
    branches:
      - agent/increment-53d-native-streamwidth-adapter
    paths:
      - .github/workflows/increment-53d-fix-publisher.yml

permissions:
  contents: write

jobs:
  sync-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Increment 53d branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-native-streamwidth-adapter
          fetch-depth: 0

      - name: Merge the latest parameterized-verilog and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin parameterized-verilog
          git merge --no-edit origin/parameterized-verilog
          rm -f \
            .github/increment-53d-revalidate.txt \
            .github/workflows/increment-53d-current-workspace-export.yml \
            .github/workflows/increment-53d-target-diagnostic.yml \
            .github/workflows/increment-53d-fix-publisher.yml
          git add -A
          git diff --cached --check
          git commit -m "chore: sync Increment 53d and remove diagnostics"
          git push origin HEAD:agent/increment-53d-native-streamwidth-adapter

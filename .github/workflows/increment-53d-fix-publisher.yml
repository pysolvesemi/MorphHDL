name: Publish Increment 53d symbolic Resize fix

on:
  push:
    branches:
      - agent/increment-53d-native-streamwidth-adapter
    paths:
      - .github/workflows/increment-53d-fix-publisher.yml

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out Increment 53d branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-native-streamwidth-adapter
          fetch-depth: 0

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Lower exact retained Resize slices symbolically
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/increment-53d-symbolic-resize.patch
          git apply --check /tmp/increment-53d-symbolic-resize.patch
          git apply /tmp/increment-53d-symbolic-resize.patch
          git diff --check

      - name: Validate the native StreamWidthAdapter witness
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.ParameterizedStreamWidthAdapterTests

      - name: Validate the native source boundary
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl/scripts/check-native-stream-width-adapter-boundary.sh

      - name: Commit the validated symbolic Resize fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala
          git diff --cached --check
          git commit -m "fix: lower retained native Resize slices symbolically"
          git push origin HEAD:agent/increment-53d-native-streamwidth-adapter

name: Increment 53d fixture shadowing repair

on:
  push:
    branches:
      - agent/increment-53d-native-streamwidth-adapter
    paths:
      - .github/workflows/increment-53d-test-shadow-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-native-streamwidth-adapter
          fetch-depth: 0
      - name: Repair Scala 2.12 local-name shadowing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("morphhdl/src/test/scala/morphhdl/ParameterizedStreamWidthAdapterTests.scala")
          text = path.read_text()
          old = '''      val config = config(directory)
      config.netlistFileName = "native_stream_width_adapter_independent.v"
      val result = MorphVerilog.tryGenerate(config) {
'''
          new = '''      val spinalConfig = config(directory)
      spinalConfig.netlistFileName = "native_stream_width_adapter_independent.v"
      val result = MorphVerilog.tryGenerate(spinalConfig) {
'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one fixture shadowing anchor")
          path.write_text(text.replace(old, new))
          PY
          git diff --check
      - name: Commit fixture repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MorphHDL Increment Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morphhdl/src/test/scala/morphhdl/ParameterizedStreamWidthAdapterTests.scala
          git commit -m "test(morphhdl): avoid StreamWidthAdapter config shadowing"
          git push origin HEAD:agent/increment-53d-native-streamwidth-adapter

name: Increment 53d fixture shadowing repair

on:
  push:
    branches:
      - agent/increment-53d-native-streamwidth-adapter
    paths:
      - .github/workflows/increment-53d-test-shadow-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-native-streamwidth-adapter
          fetch-depth: 0
      - name: Repair Scala 2.12 local-name shadowing
        shell: bash
        run: |
          set -euo pipefail
          file=morphhdl/src/test/scala/morphhdl/ParameterizedStreamWidthAdapterTests.scala
          test "$(grep -c 'val config = config(directory)' "$file")" -eq 1
          test "$(grep -c 'config.netlistFileName = "native_stream_width_adapter_independent.v"' "$file")" -eq 1
          test "$(grep -c 'MorphVerilog.tryGenerate(config)' "$file")" -eq 1
          sed -i 's/val config = config(directory)/val spinalConfig = config(directory)/' "$file"
          sed -i 's/config.netlistFileName = "native_stream_width_adapter_independent.v"/spinalConfig.netlistFileName = "native_stream_width_adapter_independent.v"/' "$file"
          sed -i 's/MorphVerilog.tryGenerate(config)/MorphVerilog.tryGenerate(spinalConfig)/' "$file"
          git diff --check
      - name: Commit fixture repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MorphHDL Increment Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morphhdl/src/test/scala/morphhdl/ParameterizedStreamWidthAdapterTests.scala
          git commit -m "test(morphhdl): avoid StreamWidthAdapter config shadowing"
          git push origin HEAD:agent/increment-53d-native-streamwidth-adapter

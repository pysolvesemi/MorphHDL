      - name: Apply corrected patch and preserve diagnostics on failure
        shell: bash
        run: |
          set +e
          python3 /tmp/apply-increment59-existing-only-v3.py >/tmp/increment59-patch.log 2>&1
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            cp /tmp/increment59-patch.log .github/increment59-bootstrap-v3-diagnostic.txt
            printf '\nexit_status=%s\n' "$status" >>.github/increment59-bootstrap-v3-diagnostic.txt
            rm -f .github/workflows/increment-59-bootstrap-v3.yml
            git config user.name "MorphHDL Increment Agent"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Record Increment 59 bootstrap v3 diagnostic"
            git push origin HEAD:agent/increment-59-typed-blackbox-generics
            exit 1
          fi
          cat /tmp/increment59-patch.log

      - name: Regenerate and validate source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/check-native-source-preservation.py \
            --generate-template morphhdl/contracts/increment-55-native-change-review.json \
            --output morphhdl/contracts/native-source-preservation.json \
            --force
          python3 -m py_compile morphhdl/scripts/check-increment-59-blackbox-generics.py
          python3 morphhdl/scripts/check-increment-59-blackbox-generics.py --self-test
          python3 morphhdl/scripts/check-increment-59-blackbox-generics.py --repo-root .
          python3 morphhdl/scripts/check-native-source-preservation.py \
            --review-policy morphhdl/contracts/increment-55-native-change-review.json \
            --manifest morphhdl/contracts/native-source-preservation.json
          git diff --check

      - name: Commit implementation integration
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/increment-59-bootstrap.yml \
            .github/workflows/increment-59-bootstrap-v3.yml \
            .github/increment59-bootstrap-diagnostic.txt \
            .github/increment59-bootstrap-v2-diagnostic.txt \
            .github/increment59-bootstrap-v3-diagnostic.txt
          git config user.name "MorphHDL Increment Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Implement Increment 59 typed BlackBox generic binding"
          git push origin HEAD:agent/increment-59-typed-blackbox-generics

name: Increment 40 targeted repair

on:
  push:
    branches:
      - agent/increment-40-external-symbolic-width
    paths:
      - .github/workflows/increment-40-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Increment 40 branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-40-external-symbolic-width
          fetch-depth: 0

      - name: Apply exact external-width repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          width_path = Path("core/src/main/scala/spinal/core/ParameterizedWidth.scala")
          width_text = width_path.read_text(encoding="utf-8")
          old_hard_type = '''  def HardType[T <: Data](dataType: => T): spinal.core.HardType[T] = {
            val template = dataType
            lazy val result: spinal.core.HardType[T] =
              new spinal.core.HardType[T](cloneOf(template))
            template match {
              case bundle: Bundle => bundle.hardtype = result
              case _ =>
            }
            result
          }
          '''
          new_hard_type = '''  def HardType[T <: Data](dataType: => T): spinal.core.HardType[T] = {
            val template = dataType
            new spinal.core.HardType[T](cloneOf(template))
          }
          '''
          if width_text.count(old_hard_type) != 1:
              raise SystemExit("expected exactly one recursive ParameterizedWidth.HardType block")
          width_path.write_text(width_text.replace(old_hard_type, new_hard_type), encoding="utf-8")

          counter_path = Path("lib/src/main/scala/spinal/lib/Counter.scala")
          counter_text = counter_path.read_text(encoding="utf-8")
          replacements = {
              "case Some(bitCount) => UInt(bitCount)":
                  "case Some(bitCount) => ParameterizedWidth.UInt(bitCount)",
              "val step = UInt(bitCount)":
                  "val step = ParameterizedWidth.UInt(bitCount)",
          }
          for old, new in replacements.items():
              if counter_text.count(old) != 1:
                  raise SystemExit(f"expected exactly one Counter occurrence: {old}")
              counter_text = counter_text.replace(old, new)
          counter_path.write_text(counter_text, encoding="utf-8")
          PY

          git diff --check
          git diff -- core/src/main/scala/spinal/core/ParameterizedWidth.scala lib/src/main/scala/spinal/lib/Counter.scala

      - name: Commit repair to Increment 40 branch
        shell: bash
        run: |
          git config user.name "MorphHDL Increment Agent"
          git config user.email "agent@users.noreply.github.com"
          git add core/src/main/scala/spinal/core/ParameterizedWidth.scala lib/src/main/scala/spinal/lib/Counter.scala
          git commit -m "Fix external symbolic width boundary regressions"
          git push origin HEAD:agent/increment-40-external-symbolic-width

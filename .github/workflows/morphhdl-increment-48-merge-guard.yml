name: Merge guard for Increment 48

on:
  pull_request:
    branches: [parameterized-verilog]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: increment-48-merge-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge-guard:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/increment-48-natural-symbolic-conditionals'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      SBT_TEST_PARALLEL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-48-natural-symbolic-conditionals
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Install strict Verilog validator
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Wait for the validated final roadmap commit
        id: final_head
        shell: bash
        run: |
          set -euo pipefail
          repo='${{ github.repository }}'
          pr='${{ github.event.pull_request.number }}'
          for attempt in $(seq 1 120); do
            state=$(gh api "repos/${repo}/pulls/${pr}" --jq .state)
            if [[ "${state}" == 'closed' ]]; then
              merged=$(gh api "repos/${repo}/pulls/${pr}" --jq .merged)
              if [[ "${merged}" == 'true' ]]; then
                echo 'already_merged=true' >> "${GITHUB_OUTPUT}"
                exit 0
              fi
              echo 'Pull request closed without merge' >&2
              exit 1
            fi

            git fetch origin parameterized-verilog agent/increment-48-natural-symbolic-conditionals
            git reset --hard origin/agent/increment-48-natural-symbolic-conditionals
            if grep -qE '^- \[x\] \*\*Increment 48\b' docs/morphhdl/parameterized-verilog-todo.md && \
               [[ -f frontend/src/main/scala/morphhdl/frontend/NaturalSymbolicConditional.scala ]] && \
               [[ -f morphhdl/src/test/scala/morphhdl/NaturalSymbolicConditionalTests.scala ]] && \
               [[ ! -e .github/increment48/implement.py ]] && \
               [[ ! -e .github/workflows/morphhdl-increment-48-implementation.yml ]] && \
               [[ ! -e .github/workflows/morphhdl-increment-48-complete.yml ]] && \
               [[ ! -e .github/workflows/morphhdl-increment-48-offline-export.yml ]]; then
              echo 'already_merged=false' >> "${GITHUB_OUTPUT}"
              echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "Waiting for validated Increment 48 publication (${attempt}/120)"
            sleep 30
          done
          echo 'Timed out waiting for the validated Increment 48 roadmap commit' >&2
          exit 1

      - name: Revalidate exact final head on Scala 2.12.18
        if: steps.final_head.outputs.already_merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sbt --batch --no-server \
            '++2.12.18' \
            'morph/testOnly morphhdl.NaturalSymbolicConditionalTests'

      - name: Revalidate exact final head on Scala 2.13.12
        if: steps.final_head.outputs.already_merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sbt --batch --no-server \
            '++2.13.12' \
            'morph/testOnly morphhdl.NaturalSymbolicConditionalTests'

      - name: Revalidate final ownership and witness boundary
        if: steps.final_head.outputs.already_merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only origin/parameterized-verilog...HEAD -- core/src/main/scala lib/src/main/scala | wc -l)" -eq 0
          test -x morphhdl/scripts/check-natural-symbolic-conditional-boundary.sh
          mapfile -t final_paths < <(git diff --name-only origin/parameterized-verilog...HEAD)
          morphhdl/scripts/check-natural-symbolic-conditional-boundary.sh "${final_paths[@]}"
          ! grep -RInE 'implicit[[:space:]]+(def|val|object).*HdlBool.*Boolean|implicit[[:space:]]+conversion.*HdlBool' \
            frontend/src/main/scala idslplugin/src/main/scala
          git diff --check origin/parameterized-verilog...HEAD

      - name: Remove the merge guard and any stale temporary markers
        if: steps.final_head.outputs.already_merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/morphhdl-increment-48-merge-guard.yml \
            tmp-tool-probe.txt \
            tmp-tool-probe-2.txt \
            tmp-increment48-completion-trigger.txt
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/morphhdl/parameterized-verilog-todo.md')
          text = path.read_text()
          if '- [x] **Increment 48' not in text:
              raise SystemExit('Increment 48 is not checked')
          path.write_text(text)
          PY
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "${path}" in
              .github/workflows/morphhdl-increment-48-merge-guard.yml|tmp-tool-probe.txt|tmp-tool-probe-2.txt|tmp-increment48-completion-trigger.txt)
                ;;
              *)
                echo "Unexpected merge-guard cleanup path: ${path}" >&2
                exit 1
                ;;
            esac
          done
          if ((${#changed[@]})); then
            for path in "${changed[@]}"; do
              git add -- "${path}"
            done
            git diff --cached --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Remove Increment 48 merge guard'
            git push origin HEAD:agent/increment-48-natural-symbolic-conditionals
          fi

      - name: Verify clean final diff and squash merge
        if: steps.final_head.outputs.already_merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          repo='${{ github.repository }}'
          pr='${{ github.event.pull_request.number }}'
          git fetch origin parameterized-verilog agent/increment-48-natural-symbolic-conditionals
          git reset --hard origin/agent/increment-48-natural-symbolic-conditionals
          grep -qE '^- \[x\] \*\*Increment 48\b' docs/morphhdl/parameterized-verilog-todo.md
          test ! -e .github/workflows/morphhdl-increment-48-merge-guard.yml
          test ! -e .github/increment48/implement.py
          test ! -e .github/workflows/morphhdl-increment-48-implementation.yml
          test ! -e .github/workflows/morphhdl-increment-48-complete.yml
          test ! -e .github/workflows/morphhdl-increment-48-offline-export.yml
          test ! -e tmp-tool-probe.txt
          test ! -e tmp-tool-probe-2.txt
          test ! -e tmp-increment48-completion-trigger.txt
          test "$(git diff --name-only origin/parameterized-verilog...HEAD -- core/src/main/scala lib/src/main/scala | wc -l)" -eq 0
          git diff --check origin/parameterized-verilog...HEAD

          head_sha=$(git rev-parse HEAD)
          remote_head=$(gh api "repos/${repo}/pulls/${pr}" --jq .head.sha)
          test "${head_sha}" = "${remote_head}"
          gh pr ready "${pr}" --repo "${repo}" || true
          gh api --method PUT "repos/${repo}/pulls/${pr}/merge" \
            -f sha="${head_sha}" \
            -f merge_method='squash' \
            -f commit_title='Increment 48: natural symbolic conditionals' \
            -f commit_message='Typed natural symbolic branch capture with dual-Scala, strict Verilog-2001, regression, preservation and diagnostic validation.'
          test "$(gh api "repos/${repo}/pulls/${pr}" --jq .merged)" = 'true'

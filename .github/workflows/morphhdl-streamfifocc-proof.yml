name: MorphHDL StreamFifoCC CDC and formal proof

on:
  push:
    branches:
      - main
      - parameterized-verilog
  pull_request:
    branches:
      - main
      - parameterized-verilog
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morphhdl-streamfifocc-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: StreamFifoCC CDC and formal Scala ${{ matrix.scala_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
      MORPHDL_RUN_STREAMFIFOCC_CDC_PROOF: '1'
      MORPHDL_RUN_STREAMFIFOCC_FORMAL_EQUIVALENCE: '1'
      MORPHDL_STREAMFIFOCC_CDC_WORKSPACE: ${{ github.workspace }}/streamfifocc-artifacts/scala-${{ matrix.scala_version }}/cdc
      MORPHDL_STREAMFIFOCC_FORMAL_WORKSPACE: ${{ github.workspace }}/streamfifocc-artifacts/scala-${{ matrix.scala_version }}/formal
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Run focused tool-backed proofs
        shell: bash
        run: |
          set -euo pipefail
          command -v iverilog
          command -v vvp
          command -v verilator
          command -v yosys
          command -v sby
          command -v yices-smt2
          yosys -Q -p 'help abc' >/tmp/morphhdl-yosys-abc-help.txt 2>&1
          grep -q ABC /tmp/morphhdl-yosys-abc-help.txt
          mkdir -p \
            "$MORPHDL_STREAMFIFOCC_CDC_WORKSPACE" \
            "$MORPHDL_STREAMFIFOCC_FORMAL_WORKSPACE"
          sbt -batch "++${{ matrix.scala_version }}" \
            "morph/testOnly morphhdl.NativeStreamFifoCCCdcProofTests morphhdl.NativeStreamFifoCCFormalEquivalenceTests"

      - name: Retain proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamfifocc-proof-scala-${{ matrix.scala_version }}
          path: streamfifocc-artifacts/scala-${{ matrix.scala_version }}
          if-no-files-found: error
          retention-days: 14

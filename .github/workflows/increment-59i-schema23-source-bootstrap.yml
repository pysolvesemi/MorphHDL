name: Increment 59i schema23 exact source bootstrap

on:
  push:
    branches: [recovery/increment-59i-history-20260914]
    paths:
      - .github/workflows/increment-59i-schema23-source-bootstrap.yml
      - .github/recovery/59i-schema23-source-bootstrap/**

permissions:
  contents: write

concurrency:
  group: increment-59i-schema23-source-bootstrap
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_PARENT: 0fb1136c9476d579d94b0e214c977248e71c23aa
      EXPECTED_FEATURE: 9c88f5f75921e28aff329e3cff2d40132315e861
      EXPECTED_FEATURE_TREE: 79df0c9df93f30ffcd94e4fe140b2b2f7e865c80
      EXPECTED_SOURCE: b99750e40561c55d4fd4a0a6adda05d84788fff2
      EXPECTED_SOURCE_TREE: fca34123d00c58cd494402989652955feaec790c
      EXPECTED_SEAL: 66db511841a31f8ee16e211838393c7e564ced35
      EXPECTED_SEAL_TREE: 278d2d49706e6da39d275683fcd09f049b1772ff
      EXPECTED_TARGET: db54d01e5b21c7664f7a0de3795f061d77a3d259
      EXPECTED_TARGET_TREE: ed73aee1ca0c667a1c32b181d95c431c22ea3719
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: true
      - name: Authenticate exact refs and publish exact schema23 source objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP:?}/59i-schema23-bootstrap"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse "$EXPECTED_FEATURE^{tree}")" = "$EXPECTED_FEATURE_TREE"
          test "$(git rev-parse "$EXPECTED_TARGET^{tree}")" = "$EXPECTED_TARGET_TREE"
          feature=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/agent/increment-59i-combined-reduction-closure" --jq .object.sha)
          target=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/parameterized-verilog" --jq .object.sha)
          recovery=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/recovery/increment-59i-history-20260914" --jq .object.sha)
          pr_state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/177" --jq .state)
          pr_draft=$(gh api "repos/$GITHUB_REPOSITORY/pulls/177" --jq .draft)
          pr_merged=$(gh api "repos/$GITHUB_REPOSITORY/pulls/177" --jq '.merged_at // ""')
          pr_head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/177" --jq .head.sha)
          pr_base=$(gh api "repos/$GITHUB_REPOSITORY/pulls/177" --jq .base.ref)
          test "$feature" = "$EXPECTED_FEATURE"
          test "$target" = "$EXPECTED_TARGET"
          test "$recovery" = "$GITHUB_SHA"
          test "$pr_state" = open
          test "$pr_draft" = true
          test -z "$pr_merged"
          test "$pr_head" = "$EXPECTED_FEATURE"
          test "$pr_base" = parameterized-verilog
          git diff --name-only HEAD^ HEAD > "$evidence/bootstrap-paths.txt"
          diff -u <(printf '%s\n' \
            .github/recovery/59i-schema23-source-bootstrap/increment-59i-runtime-successor-source.yml \
            .github/recovery/59i-schema23-source-bootstrap/schema23-exact.bundle \
            .github/workflows/increment-59i-schema23-source-bootstrap.yml) \
            "$evidence/bootstrap-paths.txt"
          payload=.github/recovery/59i-schema23-source-bootstrap/schema23-exact.bundle
          workflow=.github/recovery/59i-schema23-source-bootstrap/increment-59i-runtime-successor-source.yml
          test "$(git hash-object "$payload")" = ad18c0cda52e87f2546618cdfa6671307fdbd460
          test "$(git hash-object "$workflow")" = 62f64d68e45f292aa1f8d73afd4257a247e3ef1d
          test "$(wc -c < "$payload")" = 32318
          test "$(sha256sum "$payload" | cut -d' ' -f1)" = ed02d4c773158706ca394849414cc5e967a296fcccb660b6504ef018ada71f00
          git bundle verify "$payload" | tee "$evidence/bundle-verify.txt"
          git fetch "$payload" HEAD:refs/schema23/seal
          test "$(git rev-parse refs/schema23/seal)" = "$EXPECTED_SEAL"
          test "$(git rev-parse "$EXPECTED_SEAL^")" = "$EXPECTED_SOURCE"
          test "$(git rev-parse "$EXPECTED_SOURCE^")" = "$EXPECTED_FEATURE"
          test "$(git rev-parse "$EXPECTED_SEAL^{tree}")" = "$EXPECTED_SEAL_TREE"
          test "$(git rev-parse "$EXPECTED_SOURCE^{tree}")" = "$EXPECTED_SOURCE_TREE"
          test "$(git diff --name-only "$EXPECTED_FEATURE" "$EXPECTED_SOURCE" | wc -l)" = 17
          test "$(git diff --name-only "$EXPECTED_SOURCE" "$EXPECTED_SEAL" | wc -l)" = 2
          git show "$EXPECTED_SEAL:morphhdl/contracts/increment-59i-production-successor.json" > "$RUNNER_TEMP/schema23-contract.json"
          test "$(wc -c < "$RUNNER_TEMP/schema23-contract.json")" = 7633209
          test "$(sha256sum "$RUNNER_TEMP/schema23-contract.json" | cut -d' ' -f1)" = a75b745a546f8248d8ecb7413ecec8e9081f3e7158190d4f2e02a9ce3608fc33
          printf 'feature=%s\ntarget=%s\nrecovery=%s\npr_state=%s\npr_draft=%s\npr_head=%s\npr_base=%s\n' \
            "$feature" "$target" "$recovery" "$pr_state" "$pr_draft" "$pr_head" "$pr_base" > "$evidence/live-refs.txt"
          object_branch=recovery/increment-59i-schema23-objects-66db5118
          object_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$object_branch" --jq .object.sha 2>/dev/null || true)
          if test -z "$object_sha"; then
            git push origin "$EXPECTED_SEAL:refs/heads/$object_branch"
          else
            test "$object_sha" = "$EXPECTED_SEAL"
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$object_branch" --jq .object.sha)" = "$EXPECTED_SEAL"
          printf 'seal=%s\nobject_branch=%s\n' "$EXPECTED_SEAL" "$object_branch" > "$evidence/object-publication.txt"
          printf 'INCREMENT_59I_SCHEMA23_OBJECT_BOOTSTRAP_PASS seal=%s\n' "$EXPECTED_SEAL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-59i-schema23-source-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/59i-schema23-bootstrap/
          if-no-files-found: error
          retention-days: 30

name: Increment 33 diagnostic capture

on:
  push:
    branches:
      - agent/increment-33-structural-generate-control

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message != 'Record Increment 33 diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - name: Check out Increment 33 branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-33-structural-generate-control
          fetch-depth: 0

      - name: Capture exact Scala 2.12 baseline test failure
        shell: bash
        run: |
          set +e
          raw=/tmp/increment-33-baseline-tests.log
          summary=morphhdl/increment-33-diagnostics.txt
          sbt -batch ++2.12.18 \
            idslplugin/test \
            paramrtl/test \
            frontend/test \
            verilogBackend/test \
            morph/test \
            "core/testOnly spinal.core.internals.SpinalVerilogPhasePlanTests spinal.core.internals.ParameterizedVerilogTests spinal.core.internals.ParameterizedDataShapeTests" \
            >"$raw" 2>&1
          status=$?
          {
            echo "Increment 33 exact baseline test transcript (last 600 lines)"
            echo "FINAL_STATUS=$status"
            echo
            sed -r 's/\x1B\[[0-9;]*[mK]//g' "$raw" | tail -n 600
          } >"$summary"
          exit 0

      - name: Commit diagnostic output
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "MorphHDL Increment Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -f morphhdl/increment-33-diagnostics.txt
          if git diff --cached --quiet; then
            echo "Diagnostic output is unchanged."
            exit 0
          fi
          git commit -m "Record Increment 33 diagnostics"
          git push origin HEAD:agent/increment-33-structural-generate-control

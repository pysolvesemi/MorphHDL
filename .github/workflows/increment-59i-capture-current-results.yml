name: Increment 59i capture current continuation results

on:
  push:
    branches: ['agent/increment-59i-combined-reduction-closure']
    paths:
      - '.github/workflows/increment-59i-capture-current-results.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  capture:
    name: Record terminal continuation evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: agent/increment-59i-combined-reduction-closure
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Poll exact workflows and summarize retained artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-current-results"
          mkdir -p "$out"
          python3 - <<'PY'
          from __future__ import annotations
          import io, json, os, re, time, urllib.request, zipfile
          from pathlib import Path

          repository = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          token = os.environ['GH_TOKEN']
          out = Path('target/increment-59i-current-results')
          workflows = {
              'Local-enable successor v7': 'increment-59i-local-enable-successor-v7.yml',
              'Nested-Vec widening probe': 'increment-59i-nested-vec-widening-development.yml',
              'Composite saturation probe': 'increment-59i-composite-saturation-development.yml',
          }

          def get(url: str, accept: str = 'application/vnd.github+json') -> bytes:
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': accept,
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=90) as response:
                  return response.read()

          def latest(path: str) -> dict:
              url = (f'https://api.github.com/repos/{repository}/actions/workflows/{path}/runs'
                     f'?branch={branch}&per_page=10')
              runs = json.loads(get(url))['workflow_runs']
              if not runs:
                  raise RuntimeError('no workflow run found for ' + path)
              # The newest run is the source of truth; stale success cannot mask it.
              return runs[0]

          values = {name: latest(path) for name, path in workflows.items()}
          for _ in range(80):
              pending = [name for name, value in values.items()
                         if value['status'] != 'completed']
              if not pending:
                  break
              time.sleep(15)
              values = {name: latest(path) for name, path in workflows.items()}
          else:
              raise RuntimeError('continuation workflows did not reach terminal status')

          summaries = {}
          for name, run in values.items():
              artifacts_url = (f'https://api.github.com/repos/{repository}/actions/runs/'
                               f'{run["id"]}/artifacts?per_page=100')
              artifacts = json.loads(get(artifacts_url))['artifacts']
              lines = []
              for artifact in artifacts:
                  if artifact.get('expired'):
                      continue
                  raw = get(artifact['archive_download_url'], 'application/octet-stream')
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                      for member in archive.namelist():
                          if not member.endswith(('.log', '.md', 'mode.txt', 'head.txt',
                                                  'pushed-head.txt', 'validated-head.txt')):
                              continue
                          text = archive.read(member).decode(errors='replace')
                          for line in text.splitlines():
                              if (re.search(r'Total number of tests run:|All tests passed|TESTS FAILED|'
                                            r'\*\*\* FAILED \*\*\*|Starting commit:|transaction mode:|'
                                            r'local-enable .* review PASS|source mutations PASS', line)
                                  or line.startswith('[error]')):
                                  lines.append(f'{member}: {line.strip()}')
              # Stable de-duplication and a strict bound prevent log dumps in Git.
              summaries[name] = list(dict.fromkeys(lines))[-80:]

          record = {}
          for name, run in values.items():
              record[name] = {
                  'id': run['id'],
                  'head_sha': run['head_sha'],
                  'status': run['status'],
                  'conclusion': run['conclusion'],
                  'created_at': run['created_at'],
                  'updated_at': run['updated_at'],
                  'summary': summaries[name],
              }
          (out / 'runs.json').write_text(json.dumps(record, indent=2) + '\n')

          markdown = [
              '# Increment 59i — current continuation results', '',
              'This is a terminal run snapshot only. Increment 59i remains unchecked, draft and unmerged.', '',
          ]
          for name, value in record.items():
              markdown += [f'## {name}', '',
                           f'- Run: `{value["id"]}`',
                           f'- Head: `{value["head_sha"]}`',
                           f'- Conclusion: **{value["conclusion"]}**',
                           f'- Updated: `{value["updated_at"]}`', '']
              if value['summary']:
                  markdown += ['```text', *value['summary'], '```', '']
              else:
                  markdown += ['No matching bounded test/failure summary lines were present in retained artifacts.', '']
          markdown += [
              'No queued, skipped, interrupted or failed result is treated as passing evidence.',
              'The nested-Vec and saturation runs are test-only probes and cannot modify production.', '',
          ]
          (out / 'increment-59i-current-results.md').write_text('\n'.join(markdown))
          PY

      - name: Commit result snapshot over the exact current branch head
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-current-results"
          git fetch origin "$BRANCH"
          current=$(git rev-parse FETCH_HEAD)
          git checkout --detach "$current"
          path=docs/morphhdl/increment-59i-current-continuation-results.md
          mkdir -p "$(dirname "$path")"
          cp "$out/increment-59i-current-results.md" "$path"
          git add "$path"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo "$current" > "$out/result-head.txt"
            exit 0
          fi
          git commit -m '59i: record terminal local-enable and probe results'
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$current"
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD > "$out/result-head.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-59i-current-results-${{ github.sha }}
          path: target/increment-59i-current-results
          if-no-files-found: error
          retention-days: 21

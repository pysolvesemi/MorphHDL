name: Increment 41 tested repair

on:
  pull_request:
    branches:
      - parameterized-verilog
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/increment-41-repair-v2.yml

permissions:
  contents: write

concurrency:
  group: increment-41-tested-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/increment-41-external-expression-hierarchy'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Increment 41 branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-41-external-expression-hierarchy
          fetch-depth: 0

      - name: Apply locally validated repair
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply-i41.py <<'PY'
          from pathlib import Path
          import re
          import shutil
          import sys

          root = Path(sys.argv[1]).resolve()

          def replace_once(path, old, new, label):
              target = root / path
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              target.write_text(text.replace(old, new, 1))

          def regex_once(path, pattern, replacement, label):
              target = root / path
              updated, count = re.subn(
                  pattern,
                  replacement,
                  target.read_text(),
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              target.write_text(updated)

          morph = Path("morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalParameterizedVerilog.scala")
          replace_once(
              morph,
              '''  private final case class PortSchema(
                    name: String,
                    direction: String,
                    dataClass: String,
                    concreteWidth: Int,
                    retained: Option[ElaborationIntegerExpression]
                )

                private final case class ComponentSchema(
                    ports: Vector[PortSchema],
                    parameters: Vector[ElaborationIntegerParameter]
                )
              ''',
              '''  private final case class ParameterSchema(
                    name: String,
                    default: BigInt,
                    minimum: BigInt,
                    maximum: BigInt
                )

                private final case class ExpressionSchema(
                    verilog: String,
                    default: BigInt,
                    minimum: BigInt,
                    maximum: BigInt,
                    parameters: Vector[ParameterSchema]
                )

                private final case class PortSchema(
                    name: String,
                    direction: String,
                    dataClass: String,
                    concreteWidth: Int,
                    retained: Option[ExpressionSchema]
                )

                private final case class ComponentSchema(
                    ports: Vector[PortSchema],
                    parameters: Vector[ParameterSchema]
                )
              ''',
              "schema types",
          )
          replace_once(
              morph,
              '''    val components = componentGraph(top)
                val groups = components.groupBy(componentName)
              ''',
              '''    val components = componentGraph(top)
                val hasAnyParameterizedMetadata = components.exists { component =>
                  ParameterizedWidth.parametersOf(component).nonEmpty ||
                  ParameterizedMemory.parametersOf(component).nonEmpty ||
                  ParameterizedStructure.parametersOf(component).nonEmpty ||
                  ParameterizedProcess.parametersOf(component).nonEmpty
                }
                if (!hasAnyParameterizedMetadata) {
                  top.getOrdredNodeIo.toVector.filterNot(_.isSuffix).collectFirst {
                    case port: BitVector => port
                  } match {
                    case Some(port) =>
                      fail(
                        "SPINAL-PARAMETERIZED-VERILOG-UNTAGGED-PORT",
                        s"top-level bit-vector port '${port.getName()}' has no retained symbolic width",
                        ParameterizedWidth.sourceLocationOf(port)
                      )
                    case None =>
                      fail(
                        "SPINAL-PARAMETERIZED-VERILOG-NO-SYMBOLIC-PORTS",
                        s"component '${componentName(top)}' has no retained symbolic parameter metadata"
                      )
                  }
                }
                val groups = components.groupBy(componentName)
              ''',
              "metadata guard",
          )
          target = root / morph
          target.write_text(
              target.read_text().replace(
                  "SPINAL-PARAMETERIZED-VERILOG-EXTERNAL-CANONICAL-SCHEMA-CONFLICT",
                  "SPINAL-PARAMETERIZED-VERILOG-HIERARCHY-CANONICAL-SCHEMA-CONFLICT",
              )
          )
          regex_once(
              morph,
              r'''  private def componentSchema\(component: Component\): ComponentSchema = \{.*?\n  \}\n\n  private def requiresRewrite''',
              '''  private def parameterSchema(
                    parameter: ElaborationIntegerParameter
                ): ParameterSchema =
                  ParameterSchema(
                    parameter.name,
                    parameter.default,
                    parameter.minimum,
                    parameter.maximum
                  )

                private def expressionSchema(
                    expression: ElaborationIntegerExpression
                ): ExpressionSchema =
                  ExpressionSchema(
                    expression.verilog,
                    expression.default,
                    expression.minimum,
                    expression.maximum,
                    expression.parameters.map(parameterSchema).distinct.sortBy(_.name)
                  )

                private def componentSchema(component: Component): ComponentSchema = {
                  val ports = component.getOrdredNodeIo.toVector.filterNot(_.isSuffix).map { port =>
                    val name = Option(port.getName()).filter(_.nonEmpty).getOrElse {
                      fail(
                        "SPINAL-PARAMETERIZED-VERILOG-EXTERNAL-PORT-NAME-MISSING",
                        s"component '${componentName(component)}' has one unnamed native port"
                      )
                    }
                    PortSchema(
                      name = name,
                      direction =
                        if (port.isInput) "input"
                        else if (port.isOutput) "output"
                        else if (port.isInOut) "inout"
                        else "directionless",
                      dataClass = port.getClass.getName,
                      concreteWidth = port.getBitsWidth,
                      retained = ParameterizedWidth.expressionOf(port).map(expressionSchema)
                    )
                  }.sortBy(port => (port.direction, port.name, port.dataClass))
                  ports.groupBy(_.name).collectFirst {
                    case (name, values) if values.size != 1 => name
                  }.foreach { name =>
                    fail(
                      "SPINAL-PARAMETERIZED-VERILOG-EXTERNAL-PORT-IDENTITY-AMBIGUOUS",
                      s"component '${componentName(component)}' has multiple native ports named '$name'"
                    )
                  }
                  ComponentSchema(
                    ports,
                    ParameterizedWidth.parametersOf(component).map(parameterSchema).distinct.sortBy(_.name)
                  )
                }

                private def requiresRewrite''',
              "component schema",
          )
          regex_once(
              morph,
              r'''  private def requiresRewrite\(component: Component\): Boolean =\n    ParameterizedWidth\.parametersOf\(component\)\.nonEmpty \|\|\n      ParameterizedMemory\.parametersOf\(component\)\.nonEmpty \|\|\n      ParameterizedStructure\.parametersOf\(component\)\.nonEmpty \|\|\n      ParameterizedProcess\.parametersOf\(component\)\.nonEmpty \|\|\n      component\.children\.exists \{ child =>\n        ParameterizedWidth\.parametersOf\(child\)\.nonEmpty \|\|\n          ParameterizedMemory\.parametersOf\(child\)\.nonEmpty \|\|\n          ParameterizedStructure\.parametersOf\(child\)\.nonEmpty \|\|\n          ParameterizedProcess\.parametersOf\(child\)\.nonEmpty\n      \}''',
              '''  private def requiresRewrite(component: Component): Boolean =
                  ParameterizedWidth.parametersOf(component).nonEmpty ||
                    ParameterizedMemory.parametersOf(component).nonEmpty ||
                    ParameterizedProcess.parametersOf(component).nonEmpty ||
                    component.children.exists { child =>
                      ParameterizedWidth.parametersOf(child).nonEmpty ||
                        ParameterizedMemory.parametersOf(child).nonEmpty
                    }''',
              "rewrite boundary",
          )
          replace_once(
              morph,
              '''  private def fail(code: String, detail: String): Nothing =
                  ParameterizedVerilogException.fail(code, detail)
              ''',
              '''  private def fail(
                    code: String,
                    detail: String,
                    sourceLocation: Option[String] = None
                ): Nothing =
                  ParameterizedVerilogException.fail(code, detail, sourceLocation)
              ''',
              "source-aware diagnostic",
          )

          fallback = Path("morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala")
          replace_once(
              fallback,
              '''    withHierarchy
                    .split("\\n", -1)
                    .map(line => rewriteDeclarationLine(line, widthsByName))
                    .mkString("\\n")
              ''',
              '''    val rewritten = withHierarchy
                    .split("\\n", -1)
                    .map(line => rewriteDeclarationLine(line, widthsByName))
                    .mkString("\\n")
                  canonicalizeDeclarations(component, rewritten)
              ''',
              "canonicalization call",
          )
          replace_once(
              fallback,
              '''        namedDeclarations.get(parameter.name).foreach { signal =>
                      fail(
                        if (signal.isIo)
                          "SPINAL-PARAMETERIZED-VERILOG-PARAMETER-PORT-NAME-COLLISION"
                        else "SPINAL-PARAMETERIZED-VERILOG-PARAMETER-SIGNAL-NAME-COLLISION",
                        s"parameter '${parameter.name}' collides with signal '${signal.getName()}' of component '${component.definitionName}'"
                      )
                    }
              ''',
              '''        namedDeclarations.get(parameter.name).foreach { signal =>
                      fail(
                        if (signal.isIo)
                          "SPINAL-PARAMETERIZED-VERILOG-PARAMETER-PORT-NAME-COLLISION"
                        else "SPINAL-PARAMETERIZED-VERILOG-PARAMETER-SIGNAL-NAME-COLLISION",
                        s"parameter '${parameter.name}' collides with signal '${signal.getName()}' of component '${component.definitionName}'",
                        ParameterizedWidth.sourceLocationOf(signal)
                      )
                    }
              ''',
              "collision source",
          )
          canonicalizer = r'''
            private final case class NamedDeclaration(
                name: String,
                kind: Int,
                line: String
            )

            private def canonicalizeDeclarations(
                component: Component,
                verilog: String
            ): String = {
              val lines = verilog.split("\n", -1).toVector
              val moduleIndex = lines.indexWhere(_.trim.startsWith("module "))
              if (moduleIndex < 0) {
                fail(
                  "SPINAL-PARAMETERIZED-VERILOG-EXTERNAL-MODULE-HEADER-MISSING",
                  s"native module '${component.definitionName}' has no module declaration"
                )
              }
              val portStart = {
                val parameterEnd = lines.indexWhere(_.trim == ") (", moduleIndex)
                if (parameterEnd >= 0) parameterEnd + 1
                else if (lines(moduleIndex).trim.endsWith("(")) moduleIndex + 1
                else {
                  fail(
                    "SPINAL-PARAMETERIZED-VERILOG-EXTERNAL-PORT-HEADER-UNSUPPORTED",
                    s"native module '${component.definitionName}' has an unsupported ANSI port header"
                  )
                }
              }
              val portEnd = lines.indexWhere(_.trim == ");", portStart)
              if (portEnd < 0) {
                fail(
                  "SPINAL-PARAMETERIZED-VERILOG-EXTERNAL-PORT-HEADER-UNSUPPORTED",
                  s"native module '${component.definitionName}' has no bounded ANSI port list"
                )
              }

              val graphPorts = component.getOrdredNodeIo.toVector.filterNot(_.isSuffix)
              val portNames = graphPorts.map(_.getName()).toSet
              val emittedPorts = lines.slice(portStart, portEnd).filter(_.trim.nonEmpty).map { line =>
                val matches = portNames.filter(name => declarationMentions(line, name))
                if (matches.size != 1) {
                  fail(
                    "SPINAL-PARAMETERIZED-VERILOG-EXTERNAL-PORT-IDENTITY-AMBIGUOUS",
                    s"native ANSI port line '${line.trim}' maps to ${matches.size} graph ports"
                  )
                }
                matches.head -> line
              }
              val byPort = emittedPorts.groupBy(_._1)
              byPort.collectFirst {
                case (name, values) if values.size != 1 => name
              }.foreach { name =>
                fail(
                  "SPINAL-PARAMETERIZED-VERILOG-EXTERNAL-PORT-IDENTITY-AMBIGUOUS",
                  s"native module '${component.definitionName}' emits port '$name' more than once"
                )
              }
              if (byPort.keySet != portNames) {
                val missing = (portNames -- byPort.keySet).toVector.sorted
                val unexpected = (byPort.keySet -- portNames).toVector.sorted
                fail(
                  "SPINAL-PARAMETERIZED-VERILOG-EXTERNAL-PORT-IDENTITY-MISMATCH",
                  s"native module '${component.definitionName}' port mapping differs from the graph; missing=${missing.mkString("[", ", ", "]")}, unexpected=${unexpected.mkString("[", ", ", "]")}"
                )
              }
              val orderedPorts = graphPorts.sortBy { port =>
                val direction = if (port.isInput) 0 else if (port.isOutput) 1 else 2
                (direction, port.getName())
              }
              val canonicalPorts = orderedPorts.zipWithIndex.map { case (port, index) =>
                normalizePackedSpacing(
                  setTerminalComma(byPort(port.getName()).head._2, index == orderedPorts.size - 1),
                  port.getName()
                )
              }

              val declarationKinds = mutable.LinkedHashMap.empty[String, Int]
              component.dslBody.walkDeclarations {
                case signal: BaseType if !signal.isIo && !signal.isSuffix =>
                  Option(signal.getName()).filter(_.nonEmpty).foreach { name =>
                    declarationKinds.getOrElseUpdate(name, 0)
                  }
                case memory: Mem[_] =>
                  Option(memory.getName()).filter(_.nonEmpty).foreach { name =>
                    declarationKinds.getOrElseUpdate(name, 1)
                  }
                case _ =>
              }
              val bodyDeclarations = lines.zipWithIndex.flatMap { case (line, index) =>
                if (!isDeclarationLine(line)) None
                else {
                  val matches = declarationKinds.keys.filter(name => declarationMentions(line, name)).toVector
                  matches match {
                    case Vector(name) =>
                      Some(index -> NamedDeclaration(
                        name,
                        declarationKinds(name),
                        normalizePackedSpacing(line, name)
                      ))
                    case Vector() => None
                    case _ =>
                      fail(
                        "SPINAL-PARAMETERIZED-VERILOG-EXTERNAL-DECLARATION-IDENTITY-AMBIGUOUS",
                        s"native declaration line '${line.trim}' maps to multiple graph declarations: ${matches.sorted.mkString(", ")}"
                      )
                  }
                }
              }
              bodyDeclarations.groupBy(_._2.name).collectFirst {
                case (name, values) if values.size != 1 => name
              }.foreach { name =>
                fail(
                  "SPINAL-PARAMETERIZED-VERILOG-EXTERNAL-DECLARATION-IDENTITY-AMBIGUOUS",
                  s"native module '${component.definitionName}' emits declaration '$name' more than once"
                )
              }

              val result = ArrayBuffer.empty[String]
              result ++= lines
              result.remove(portStart, portEnd - portStart)
              result.insertAll(portStart, canonicalPorts)
              val declarationSlots = bodyDeclarations.map(_._1).sorted
              val sortedDeclarations = bodyDeclarations.map(_._2).sortBy(value => (value.kind, value.name))
              declarationSlots.zip(sortedDeclarations).foreach { case (slot, declaration) =>
                result(slot) = declaration.line
              }
              result.mkString("\n")
            }

            private def isDeclarationLine(line: String): Boolean = {
              val trimmed = line.trim
              trimmed.startsWith("input ") || trimmed.startsWith("output ") ||
                trimmed.startsWith("inout ") || trimmed.startsWith("wire ") ||
                trimmed.startsWith("reg ") || trimmed.startsWith("logic ")
            }

            private def declarationMentions(line: String, name: String): Boolean = {
              val quoted = Pattern.quote(name)
              ("\\b" + quoted + "\\b(?=\\s*(?:\\[[^\\]]+\\])?\\s*(?:[,;]|/\\*|$))").r
                .findFirstIn(line)
                .nonEmpty
            }

            private def normalizePackedSpacing(line: String, name: String): String = {
              val pattern = ("(\\[[^\\]]+\\])\\s+(" + Pattern.quote(name) + ")").r
              pattern.replaceFirstIn(line, matched => matched.group(1) + " " + matched.group(2))
            }

            private def setTerminalComma(line: String, terminal: Boolean): String = {
              val trimmed = line.reverse.dropWhile(_.isWhitespace).reverse
              val trailing = line.substring(trimmed.length)
              val withoutComma = if (trimmed.endsWith(",")) trimmed.dropRight(1) else trimmed
              withoutComma + (if (terminal) "" else ",") + trailing
            }

          '''
          replace_once(
              fallback,
              "  private final class Analysis(\n",
              canonicalizer + "  private final class Analysis(\n",
              "canonicalization helpers",
          )

          hierarchy = Path("morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogHierarchy.scala")
          replace_once(
              hierarchy,
              '''    val instances = component.children.toVector.map { child =>
                    if (child.isInstanceOf[BlackBox]) {
                      fail(
                        "SPINAL-PARAMETERIZED-VERILOG-HIERARCHY-BLACKBOX-UNSUPPORTED",
                        s"component '${component.definitionName}' contains BlackBox child '${child.getName()}'; Increment 32 covers ordinary Component hierarchy only"
                      )
                    }
                    val canonical = canonicalOf(child)
                    analyzeInstance(component, child, canonical, assignments.toVector, pc)
                  }
              ''',
              '''    val instances = component.children.toVector.flatMap { child =>
                    val canonical = canonicalOf(child)
                    val hasSymbolicInterface =
                      ParameterizedWidth.parametersOf(child).nonEmpty ||
                        ParameterizedWidth.parametersOf(canonical).nonEmpty
                    if (!hasSymbolicInterface) Vector.empty
                    else {
                      if (child.isInstanceOf[BlackBox]) {
                        fail(
                          "SPINAL-PARAMETERIZED-VERILOG-HIERARCHY-BLACKBOX-UNSUPPORTED",
                          s"component '${component.definitionName}' contains BlackBox child '${child.getName()}'; Increment 32 covers ordinary Component hierarchy only"
                        )
                      }
                      Vector(analyzeInstance(component, child, canonical, assignments.toVector, pc))
                    }
                  }
              ''',
              "fixed child boundary",
          )

          for name in ("ParameterizedVerilogTests.scala", "ParameterizedDataShapeTests.scala"):
              source = root / "core/src/test/scala/spinal/core/internals" / name
              destination = root / "morphhdl/src/test/scala/spinal/core/internals" / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
              source.unlink()

          tests = root / "morphhdl/src/test/scala/spinal/core/internals/ParameterizedVerilogTests.scala"
          text = tests.read_text()
          text = text.replace(
              "import spinal.core._\n",
              "import spinal.core._\n\nimport morphhdl.integration.ExternalSpinalVerilog\n",
          )
          text = text.replace(
              "SpinalVerilog(parameterizedConfig(directory)) {",
              "generateParameterized(parameterizedConfig(directory)) {",
          )
          old = '''    SpinalVerilog(config) {
                    new Component {
                      setDefinitionName("DirectWidthWire")
                      val din = if (reversePorts) null else in(ParameterizedWidth.UInt(bitCount))
                      val dout = out(ParameterizedWidth.UInt(bitCount))
                      val finalDin = if (reversePorts) in(ParameterizedWidth.UInt(bitCount)) else din
                      dout := finalDin
                    }
                  }
              '''
          new = '''    val component = () => new Component {
                    setDefinitionName("DirectWidthWire")
                    val din = if (reversePorts) null else in(ParameterizedWidth.UInt(bitCount))
                    val dout = out(ParameterizedWidth.UInt(bitCount))
                    val finalDin = if (reversePorts) in(ParameterizedWidth.UInt(bitCount)) else din
                    dout := finalDin
                  }
                  if (parameterized) generateParameterized(config)(component())
                  else SpinalVerilog(config)(component())
              '''
          if old not in text:
              raise RuntimeError("ParameterizedVerilogTests generation helper changed")
          text = text.replace(old, new, 1)
          marker = "  private def parameterizedConfig(\n"
          helper = '''  private def generateParameterized[T <: Component](
                    config: SpinalConfig
                )(component: => T): SpinalReport[T] =
                  ExternalSpinalVerilog.transform(config)(component) { pc =>
                    MorphHdlExternalParameterizedVerilog.rewrite(pc)
                  }.nativeReport

              '''
          if marker not in text:
              raise RuntimeError("ParameterizedVerilogTests config helper missing")
          tests.write_text(text.replace(marker, helper + marker, 1))

          tests = root / "morphhdl/src/test/scala/spinal/core/internals/ParameterizedDataShapeTests.scala"
          text = tests.read_text()
          text = text.replace(
              "import spinal.lib.{Flow, Stream}\n",
              "import spinal.lib.{Flow, Stream}\n\nimport morphhdl.integration.ExternalSpinalVerilog\n",
          )
          text = text.replace(
              "SpinalVerilog(parameterizedConfig(directory)) {",
              "generateParameterized(parameterizedConfig(directory)) {",
          )
          marker = "  private def parameterizedConfig(directory: Path): SpinalConfig =\n"
          helper = '''  private def generateParameterized[T <: Component](
                    config: SpinalConfig
                )(component: => T): SpinalReport[T] =
                  ExternalSpinalVerilog.transform(config)(component) { pc =>
                    MorphHdlExternalParameterizedVerilog.rewrite(pc)
                  }.nativeReport

              '''
          if marker not in text:
              raise RuntimeError("ParameterizedDataShapeTests config helper missing")
          tests.write_text(text.replace(marker, helper + marker, 1))

          workflow = root / ".github/workflows/morphhdl-external-symbolic-width.yml"
          text = workflow.read_text()
          old = '''          /tmp/morphhdl-mill core[${{ matrix.scala_version }}].testOnly \\
                    spinal.core.internals.ParameterizedVerilogTests \\
                    spinal.core.internals.ParameterizedDataShapeTests
                  /tmp/morphhdl-mill frontend[${{ matrix.scala_version }}].testOnly \\
              '''
          if old not in text:
              raise RuntimeError("external symbolic-width core test block changed")
          text = text.replace(
              old,
              '''          /tmp/morphhdl-mill frontend[${{ matrix.scala_version }}].testOnly \\
              ''',
              1,
          )
          old = '''          /tmp/morphhdl-mill morph[${{ matrix.scala_version }}].testOnly \\
                    morphhdl.MorphSingleSourceVerilogTests \\
                    morphhdl.NativeLibraryReuseTests \\
                    morphhdl.NativeSymbolicMemoryTests
              '''
          new = '''          /tmp/morphhdl-mill morph[${{ matrix.scala_version }}].testOnly \\
                    spinal.core.internals.ParameterizedVerilogTests \\
                    spinal.core.internals.ParameterizedDataShapeTests \\
                    morphhdl.MorphSingleSourceVerilogTests \\
                    morphhdl.NativeLibraryReuseTests \\
                    morphhdl.NativeSymbolicMemoryTests
              '''
          if old not in text:
              raise RuntimeError("external symbolic-width morph test block changed")
          workflow.write_text(text.replace(old, new, 1))

          workflow = root / ".github/workflows/morphhdl-mill.yml"
          text = workflow.read_text()
          old = '''          /tmp/morphhdl-mill core[${{ matrix.scala_version }}].testOnly \\
                    spinal.core.internals.SpinalVerilogPhasePlanTests \\
                    spinal.core.internals.ParameterizedVerilogTests \\
                    spinal.core.internals.ParameterizedDataShapeTests
              '''
          new = '''          /tmp/morphhdl-mill core[${{ matrix.scala_version }}].testOnly \\
                    spinal.core.internals.SpinalVerilogPhasePlanTests
              '''
          if old not in text:
              raise RuntimeError("Mill core test block changed")
          workflow.write_text(text.replace(old, new, 1))

          workflow = root / ".github/workflows/morphhdl-baseline.yml"
          text = workflow.read_text()
          old = '''            morph/test \\
                    "core/testOnly spinal.core.internals.SpinalVerilogPhasePlanTests spinal.core.internals.ParameterizedVerilogTests spinal.core.internals.ParameterizedDataShapeTests"
              '''
          new = '''            morph/test \\
                    "core/testOnly spinal.core.internals.SpinalVerilogPhasePlanTests"
              '''
          if old not in text:
              raise RuntimeError("baseline core test block changed")
          workflow.write_text(text.replace(old, new, 1))

          snapshot = root / ".github/workflows/increment-41-source-snapshot.yml"
          if snapshot.exists():
              snapshot.unlink()
          PY
          python /tmp/apply-i41.py .
          rm -f \
            .github/workflows/increment-41-repair.yml \
            .github/workflows/increment-41-repair-v2.yml \
            .github/workflows/increment-41-source-snapshot.yml
          git diff --check

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0-mill.sh \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Run focused Scala 2.12.18 regressions
        shell: bash
        env:
          XDG_CACHE_HOME: /tmp/morphhdl-cache
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morph[2.12.18].testOnly \
            spinal.core.internals.ParameterizedVerilogTests \
            spinal.core.internals.ParameterizedDataShapeTests \
            morphhdl.MorphSingleSourceVerilogTests \
            morphhdl.StructuralGenerateControlTests \
            morphhdl.HierarchyParameterBindingTests \
            morphhdl.GenericExpressionAndStreamTests \
            morphhdl.GenericProcessLoweringTests \
            morphhdl.NativeSymbolicMemoryTests
          /tmp/morphhdl-mill core[2.12.18].testOnly \
            spinal.core.internals.SpinalVerilogPhasePlanTests

      - name: Run focused Scala 2.13.12 regressions
        shell: bash
        env:
          XDG_CACHE_HOME: /tmp/morphhdl-cache
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            spinal.core.internals.ParameterizedVerilogTests \
            spinal.core.internals.ParameterizedDataShapeTests \
            morphhdl.MorphSingleSourceVerilogTests \
            morphhdl.StructuralGenerateControlTests \
            morphhdl.HierarchyParameterBindingTests \
            morphhdl.GenericExpressionAndStreamTests \
            morphhdl.GenericProcessLoweringTests \
            morphhdl.NativeSymbolicMemoryTests
          /tmp/morphhdl-mill core[2.13.12].testOnly \
            spinal.core.internals.SpinalVerilogPhasePlanTests

      - name: Commit and push tested repair
        shell: bash
        run: |

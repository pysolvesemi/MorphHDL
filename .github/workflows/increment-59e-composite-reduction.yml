name: Increment 59e composite balanced reductions

on:
  push:
    branches: ['agent/increment-59e-*', 'agent/increment-59d-*', parameterized-verilog]
    paths:
      - '.github/workflows/increment-59e-composite-reduction.yml'
      - 'core/src/**'
      - 'lib/src/**'
      - 'morphruntime/src/**'
      - 'morphhdl/**'
      - 'morphir/**'
      - 'frontend/**'
      - 'build.sbt'
      - 'build.mill'
  pull_request:
    branches: [parameterized-verilog]
    paths:
      - '.github/workflows/increment-59e-composite-reduction.yml'
      - 'core/src/**'
      - 'lib/src/**'
      - 'morphruntime/src/**'
      - 'morphhdl/**'
      - 'morphir/**'
      - 'frontend/**'
      - 'build.sbt'
      - 'build.mill'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-59e-composite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Composite reductions Scala ${{ matrix.scala }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scala: ['2.12.18', '2.13.12']
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      COURSIER_REPOSITORIES: https://repo.maven.apache.org/maven2
      COURSIER_CACHE: /sbt/.cache/coursier/v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Preserve source and validate native boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/increment-59e/bootstrap
          git rev-parse HEAD > target/increment-59e/head.txt
          git archive HEAD | gzip > target/increment-59e/source.tar.gz
          python3 morphhdl/scripts/check-native-source-preservation.py
          python3 morphhdl/scripts/check-increment-58-retirement.py
          python3 morphhdl/scripts/check-production-retirement.py
          python3 morphhdl/scripts/check-typed-native-source-overlay.py
      - name: Bootstrap the repository-pinned SBT launcher
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^sbt.version=//p' project/build.properties)
          test "$version" = '1.10.0'
          dir="$GITHUB_WORKSPACE/target/increment-59e/bootstrap"
          base="https://repo.maven.apache.org/maven2/org/scala-sbt/sbt-launch/$version/sbt-launch-$version.jar"
          curl --fail --location --retry 5 --retry-all-errors "$base" -o "$dir/sbt-launch.jar"
          curl --fail --location --retry 5 --retry-all-errors "$base.sha1" -o "$dir/sbt-launch.jar.sha1"
          python3 - <<'PY'
          import hashlib, re
          from pathlib import Path
          root = Path('target/increment-59e/bootstrap')
          expected = (root / 'sbt-launch.jar.sha1').read_text().strip()
          assert re.fullmatch('[0-9a-fA-F]{40}', expected)
          assert hashlib.sha1((root / 'sbt-launch.jar').read_bytes()).hexdigest() == expected.lower()
          PY
          printf '[repositories]\nlocal\nmaven-central: https://repo.maven.apache.org/maven2\n' > "$dir/repositories"
      - name: Run composite and inherited safety contracts; generate independent native references twice
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-59e"
          bootstrap="$output/bootstrap"
          java -Xmx3G -Dsbt.log.noformat=true -Dsbt.supershell=false \
            -Dsbt.boot.directory=/sbt/.sbt/boot -Dsbt.global.base=/sbt/.sbt \
            -Dsbt.ivy.home=/sbt/.ivy2 -Duser.home=/sbt \
            -Dsbt.repository.config="$bootstrap/repositories" -Dsbt.override.build.repos=true \
            -jar "$bootstrap/sbt-launch.jar" "++${{ matrix.scala }}" \
            'morph/Test/testOnly spinal.core.internals.TypedBalancedReductionCompositeTests spinal.core.internals.TypedBalancedReductionCompositeCallbackPolicyTests spinal.core.internals.TypedBalancedReductionCallbackPolicyTests spinal.core.internals.TypedBalancedReductionPublicationSafetyTests spinal.core.internals.TypedBalancedReductionPublicationTests spinal.core.internals.TypedBalancedReductionStageReplayTests spinal.core.internals.TypedBalancedReductionClosedGraphTests spinal.core.internals.TypedBalancedReductionOperatorReplayTests spinal.core.internals.TypedBalancedReductionCaptureTests spinal.core.internals.TypedBalancedReductionCaptureSafetyTests spinal.core.internals.TypedBalancedReductionPlanTests morphhdl.ReduceBalancedTreeNativeContractTests spinal.core.NativeCloneShapeContractTests spinal.core.TypedVecShapeTests spinal.core.TypedElaborationPrimitiveTests spinal.core.PackedVecIdentityAdversarialTests' \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionCompositeArtifactWriter $output/a" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionCompositeArtifactWriter $output/b" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionPublicationArtifactWriter $output/inherited-59b/a" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionPublicationArtifactWriter $output/inherited-59b/b" \
            > "$output/sbt.log" 2>&1 || { tail -n 160 "$output/sbt.log"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          names = ['TypedBalancedReductionCompositeTests', 'TypedBalancedReductionCompositeCallbackPolicyTests',
                   'TypedBalancedReductionCallbackPolicyTests',
                   'TypedBalancedReductionPublicationSafetyTests', 'TypedBalancedReductionPublicationTests',
                   'TypedBalancedReductionStageReplayTests', 'TypedBalancedReductionClosedGraphTests',
                   'TypedBalancedReductionOperatorReplayTests', 'TypedBalancedReductionCaptureTests',
                   'TypedBalancedReductionCaptureSafetyTests', 'TypedBalancedReductionPlanTests',
                   'ReduceBalancedTreeNativeContractTests', 'NativeCloneShapeContractTests',
                   'TypedVecShapeTests', 'TypedElaborationPrimitiveTests', 'PackedVecIdentityAdversarialTests']
          for name in names:
              files = list(Path('morphhdl/target').rglob('*' + name + '.xml'))
              assert len(files) == 1, (name, files)
              suite = ET.parse(files[0]).getroot()
              assert int(suite.get('tests', '0')) > 0, (name, suite.attrib)
              assert all(int(suite.get(key, '0')) == 0 for key in ('failures', 'errors', 'skipped')), (name, suite.attrib)
              print(name, suite.attrib)
          PY
      - name: Prove the reused composite candidate with strict tools and actual RTL mutations
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-59e"
          python3 morphhdl/scripts/check-increment-59b-publication.py "$output/inherited-59b/a" "$output/inherited-59b/b"
          python3 morphhdl/scripts/check-increment-59e-composite-reduction.py "$output/a" "$output/b"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('target/increment-59e/a/evidence.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Composite reductions: ' + str(len(result['configurations'])) +
                        ' parameter specializations, independently elaborated native references, exact port geometry, '
                        'Verilog-2001 Icarus/Verilator, Yosys synthesis, reset entry and temporal induction; ' +
                        str(len(result['mutations'])) + ' actual candidate mutations produced counterexamples.\n')
          PY
      - name: Print failing tool diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          logs = sorted(Path('target/increment-59e/a/checks').rglob('*.log'), key=lambda p: p.stat().st_mtime)
          for path in logs[-4:]:
              print('\nHDL LOG:', path)
              print('\n'.join(path.read_text(errors='replace').splitlines()[-100:]))
          PY
      - name: Retain source-bound proof and mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59e-composite-${{ matrix.scala }}
          path: |
            target/increment-59e
            morphhdl/target/test-reports
          if-no-files-found: error
          retention-days: 30

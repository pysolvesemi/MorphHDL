name: WA-07 single-flag cleanup

on:
  push:
    branches:
      - agent/wa-07-unified-expression-alias-pass
    paths:
      - ".github/workflows/wa07-single-flag-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wa-07-unified-expression-alias-pass
          fetch-depth: 0
      - run: python3 morphhdl-passes/scripts/wa07-single-flag-cleanup.py

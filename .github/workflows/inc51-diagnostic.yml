name: Increment 51 focused diagnostics

on:
  pull_request:
    branches:
      - parameterized-verilog
    paths:
      - .github/workflows/inc51-diagnostic.yml
  push:
    branches:
      - agent/increment-51-native-int-branch-capture
    paths:
      - .github/workflows/inc51-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/spinalhdl/docker:latest
    strategy:
      fail-fast: false
      matrix:
        scala_version: ["2.12.18", "2.13.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run focused proof and preserve full log
        id: proof
        shell: bash
        run: |
          set +e
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill
          /tmp/morphhdl-mill morph[${{ matrix.scala_version }}].testOnly \
            morphhdl.NativeIntSymbolicConditionalTests \
            > inc51-${{ matrix.scala_version }}.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -n 300 inc51-${{ matrix.scala_version }}.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: inc51-diagnostic-${{ matrix.scala_version }}-${{ github.sha }}
          path: inc51-${{ matrix.scala_version }}.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail after artifact upload
        shell: bash
        run: test "${{ steps.proof.outputs.exit_code }}" -eq 0

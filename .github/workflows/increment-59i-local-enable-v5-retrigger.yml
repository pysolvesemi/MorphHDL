name: Increment 59i retrigger local-enable successor v5

on:
  push:
    branches: ['agent/increment-59i-combined-reduction-closure']
    paths:
      - '.github/workflows/increment-59i-local-enable-v5-retrigger.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch v5 at exact latest branch head
    runs-on: ubuntu-latest
    steps:
      - name: Verify and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: agent/increment-59i-combined-reduction-closure
          EXPECTED: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPOSITORY/git/ref/heads/$BRANCH" | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')
          test "$actual" = "$EXPECTED"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/increment-59i-local-enable-successor-v5.yml/dispatches" \
            -d "{\"ref\":\"$BRANCH\"}"
          echo "Dispatched local-enable v5 for $EXPECTED"

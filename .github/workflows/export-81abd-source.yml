name: Export pinned MorphHDL source

on:
  pull_request:
    branches: [parameterized-verilog]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/export-81abd-source'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/export-81abd-source
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Check out the exact pinned source and install an uncommitted export task
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 81abd25518551b8a452ecf038e409331e646f726
          test "$(git rev-parse HEAD)" = "81abd25518551b8a452ecf038e409331e646f726"

          cat > project/ExportClasspathBundle.scala <<'SCALA'
          import sbt._
          import sbt.Keys._

          object ExportClasspathBundle extends AutoPlugin {
            object autoImport {
              val exportClasspathBundle = taskKey[File]("Export a self-contained compile/runtime classpath bundle")
            }
            import autoImport._
            override def trigger = allRequirements
            override lazy val projectSettings: Seq[Def.Setting[_]] = Seq(
              exportClasspathBundle := {
                val projectId = thisProjectRef.value.project
                val out = (ThisBuild / baseDirectory).value / "export-classpath" / projectId
                IO.delete(out)
                IO.createDirectory(out)
                val external = (Compile / externalDependencyClasspath).value.map(_.data)
                val scalaJars = scalaInstance.value.allJars.toSeq
                (external ++ scalaJars).filter(_.isFile).distinct.foreach { jar =>
                  IO.copyFile(jar, out / jar.getName, preserveLastModified = true)
                }
                val packaged = (Compile / packageBin).value
                IO.copyFile(packaged, out / s"${projectId}.jar", preserveLastModified = true)
                out
              }
            )
          }
          SCALA
          sed -i 's/^          //' project/ExportClasspathBundle.scala

      - name: Package exact source and self-contained classpath
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/MorphHDL-81abd.tar.gz HEAD
          sha256sum /tmp/MorphHDL-81abd.tar.gz > /tmp/MorphHDL-81abd.tar.gz.sha256

          sbt --batch --no-server \
            'idslpayload/exportClasspathBundle' \
            'idslplugin/exportClasspathBundle' \
            'sim/exportClasspathBundle' \
            'core/exportClasspathBundle' \
            'lib/exportClasspathBundle' \
            'morph/exportClasspathBundle'

          test -f export-classpath/idslpayload/idslpayload.jar
          test -f export-classpath/idslplugin/idslplugin.jar
          test -f export-classpath/sim/sim.jar
          test -f export-classpath/core/core.jar
          test -f export-classpath/lib/lib.jar
          test -f export-classpath/morph/morph.jar
          find export-classpath -type f -name '*.jar' -print0 | sort -z | xargs -0 sha256sum \
            > /tmp/MorphHDL-81abd-classpath.sha256
          tar -czf /tmp/MorphHDL-81abd-classpath.tar.gz export-classpath
          sha256sum /tmp/MorphHDL-81abd-classpath.tar.gz \
            > /tmp/MorphHDL-81abd-classpath.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MorphHDL-81abd-exact-offline-bundle
          path: |
            /tmp/MorphHDL-81abd.tar.gz
            /tmp/MorphHDL-81abd.tar.gz.sha256
            /tmp/MorphHDL-81abd-classpath.tar.gz
            /tmp/MorphHDL-81abd-classpath.tar.gz.sha256
            /tmp/MorphHDL-81abd-classpath.sha256
          if-no-files-found: error

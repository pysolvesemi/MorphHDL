name: Increment 53 exact closure

on:
  push:
    branches:
      - agent/increment-53-native-streamfifo-clean

permissions:
  contents: write

concurrency:
  group: increment-53-exact-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closure:
    if: "${{ !contains(github.event.head_commit.message, '[inc53-exact-closure]') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out Increment 53 head
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53-native-streamfifo-clean
          fetch-depth: 0

      - name: Apply reviewed generic source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/increment-53-memory-policy-repair.yml"
          )
          lines = workflow.read_text().splitlines()
          start = next(
              index
              for index, line in enumerate(lines)
              if line.strip() == "python3 - <<'PY'"
          )
          end = next(
              index
              for index in range(start + 1, len(lines))
              if lines[index].strip() == "PY"
          )
          body = lines[start + 1:end]
          indent = min(
              len(line) - len(line.lstrip())
              for line in body
              if line.strip()
          )
          script = "\n".join(
              line[indent:] if line.strip() else ""
              for line in body
          ) + "\n"

          def replace_definitions(text, start_marker, end_marker, definitions):
              section_start = text.find(start_marker)
              section_end = text.find(end_marker, section_start)
              if section_start < 0 or section_end < 0:
                  raise SystemExit(
                      f"Increment 53 repair section changed: {start_marker}"
                  )
              replacement = "".join(
                  f"{name} = {value!r}\n" for name, value in definitions
              ) + "\n"
              return text[:section_start] + replacement + text[section_end:]

          # The focused diagnostic proved walkStatements on both supported
          # Scala versions. This includes nested assignments without the leaf
          # iterator's incomplete ownership view.
          script = script.replace(
              "component.dslBody.walkLeafStatements",
              "component.dslBody.walkStatements",
          )

          # The repair script is generated from a Python string. Preserve the
          # two backslashes required by the emitted Scala regex literal.
          script = script.replace(
              'replaceAll("\\\\s+", " ")',
              'replaceAll("\\\\\\\\s+", " ")',
          )

          # Replace only the obsolete whitespace-sensitive hierarchy anchor.
          start_marker = "output_anchor = '''"
          end_marker = "hierarchy_path.write_text(hierarchy)"
          patch_start = script.find(start_marker)
          patch_end = script.find(end_marker, patch_start)
          if patch_start < 0 or patch_end < 0:
              raise SystemExit("Increment 53 hierarchy repair anchors changed")

          robust_hierarchy = '''output_message = (
              "uses a sliced, indexed, converted or expression-wrapped "
              "child-output connection; direct full packed connections are required"
          )
          if "directConcreteOutputAdapter(assignment.source, port)" not in hierarchy:
              hierarchy_lines = hierarchy.splitlines(keepends=True)
              message_indexes = [
                  index
                  for index, line in enumerate(hierarchy_lines)
                  if output_message in line
              ]
              if len(message_indexes) != 1:
                  raise SystemExit(
                      f"expected one child-output diagnostic, found {len(message_indexes)}"
                  )
              message_index = message_indexes[0]
              else_candidates = [
                  index
                  for index in range(message_index)
                  if hierarchy_lines[index].strip() == "} else {"
              ]
              if not else_candidates:
                  raise SystemExit("child-output fallback branch not found")
              else_index = else_candidates[-1]
              branch_indent = hierarchy_lines[else_index][
                  : len(hierarchy_lines[else_index])
                  - len(hierarchy_lines[else_index].lstrip())
              ]
              newline = chr(10)
              replacement = [
                  branch_indent + "} else if (" + newline,
                  branch_indent + "  allowConcreteInternal &&" + newline,
                  branch_indent + "  assignment.target == assignment.finalTarget &&" + newline,
                  branch_indent + "  assignment.finalTarget.component == parent &&" + newline,
                  branch_indent + "  directConcreteOutputAdapter(assignment.source, port)" + newline,
                  branch_indent + ") {" + newline,
                  branch_indent + "  Vector(LiteralBinding(port.getBitsWidth))" + newline,
                  branch_indent + "} else {" + newline,
              ]
              hierarchy_lines[else_index:else_index + 1] = replacement
              hierarchy = "".join(hierarchy_lines)

          '''
          script = script[:patch_start] + robust_hierarchy + script[patch_end:]

          constructor_anchor = "\n".join((
              "      sharedAddress = readAddress == writeAddress,",
              "      readAddressWidth,",
          )) + "\n"
          constructor_replacement = "\n".join((
              "      sharedAddress = readAddress == writeAddress,",
              "      independentDontCare = independentDontCare,",
              "      readAddressWidth,",
          )) + "\n"
          script = replace_definitions(
              script,
              "constructor_anchor = '''",
              'if "independentDontCare = independentDontCare" not in memory:',
              (
                  ("constructor_anchor", constructor_anchor),
                  ("constructor_replacement", constructor_replacement),
              ),
          )

          blocks_anchor = "\n".join((
              "    if (memoryBlocks.size != 1) {",
              "      fail(",
              '        "SPINAL-PARAMETERIZED-VERILOG-MEMORY-PROCESS-NOT-FOUND",',
              '        s"normal Verilog emission contains ${memoryBlocks.size} clocked processes for memory \'${plan.memoryName}\'; expected exactly one",',
              "        plan.sourceLocation",
              "      )",
              "    }",
          )) + "\n"
          blocks_replacement = "\n".join((
              "    val acceptedMemoryBlocks =",
              "      memoryBlocks.size == 1 ||",
              "        independentDontCareProcessesAreComplete(lines, memoryBlocks, plan)",
              "    if (!acceptedMemoryBlocks) {",
              "      val expected =",
              '        if (plan.independentDontCare) "one combined process or one proven read process plus one proven write process"',
              '        else "exactly one process"',
              "      fail(",
              '        "SPINAL-PARAMETERIZED-VERILOG-MEMORY-PROCESS-NOT-FOUND",',
              '        s"normal Verilog emission contains ${memoryBlocks.size} clocked processes for memory \'${plan.memoryName}\'; expected $expected",',
              "        plan.sourceLocation",
              "      )",
              "    }",
          )) + "\n"
          script = replace_definitions(
              script,
              "blocks_anchor = '''",
              'if "val acceptedMemoryBlocks" not in memory:',
              (
                  ("blocks_anchor", blocks_anchor),
                  ("blocks_replacement", blocks_replacement),
              ),
          )

          indexed_anchor = "\n".join((
              "  private def containsIndexedReference(value: String, name: String): Boolean =",
              '    ("(?<![A-Za-z0-9_$])" + Pattern.quote(name) + "\\\\s*\\\\[").r',
              "      .findFirstIn(value)",
              "      .nonEmpty",
          )) + "\n"
          indexed_replacement = indexed_anchor + "\n" + "\n".join((
              "  private def containsIndexedAccess(",
              "      value: String,",
              "      name: String,",
              "      index: String",
              "  ): Boolean =",
              '    ("(?<![A-Za-z0-9_$])" + Pattern.quote(name) + "\\\\s*\\\\[\\\\s*" +',
              '      Pattern.quote(index) + "\\\\s*\\\\]").r',
              "      .findFirstIn(value)",
              "      .nonEmpty",
          )) + "\n"
          script = replace_definitions(
              script,
              "indexed_anchor = '''",
              'if "private def containsIndexedAccess(" not in memory:',
              (
                  ("indexed_anchor", indexed_anchor),
                  ("indexed_replacement", indexed_replacement),
              ),
          )

          Path("/tmp/inc53-source-repair.py").write_text(script)
          PY
          python3 /tmp/inc53-source-repair.py

          # The earlier generated repair admitted independent-address dontCare
          # after stable naming but left the original unconditional rejection in
          # place. Remove that one obsolete guard and fail closed if the final
          # source does not contain the complete reviewed policy.
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogMemories.scala"
          )
          text = path.read_text()
          obsolete = '''    if (read.readUnderWrite ne readFirst) {
              fail(
                "SPINAL-PARAMETERIZED-VERILOG-MEMORY-COLLISION-POLICY-UNSUPPORTED",
                s"memory '${memory.getName()}' must select readUnderWrite = readFirst",
                source
              )
            }
          '''
          if obsolete in text:
              text = text.replace(obsolete, "", 1)

          required = (
              "independentDontCare: Boolean",
              "val independentDontCare =",
              "independentDontCare = independentDontCare",
              "val acceptedMemoryBlocks =",
              "private def independentDontCareProcessesAreComplete(",
              "private def containsIndexedAccess(",
          )
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(
                  "Increment 53 memory repair is incomplete: " + ", ".join(missing)
              )
          if obsolete in text:
              raise SystemExit("obsolete unconditional readUnderWrite rejection remains")
          path.write_text(text)
          PY

          git diff --check

      - name: Check Increment 53 source boundaries
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl/scripts/check-native-streamfifo-structure-boundary.sh
          bash morphhdl/scripts/check-external-formalization-boundary.sh
          bash morphhdl/scripts/check-external-memory-boundary.sh
          bash morphhdl/scripts/check-native-int-nested-control-flow-boundary.sh

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Prove Increment 53 on Scala 2.13.12
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.NativeSymbolicMemoryTests \
            morphhdl.HierarchyParameterBindingTests \
            morphhdl.NativeIntNestedSymbolicControlFlowTests \
            morphhdl.ParameterizedStreamFifoDepthTests

      - name: Prove Increment 53 on Scala 2.12.18
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morph[2.12.18].testOnly \
            morphhdl.NativeSymbolicMemoryTests \
            morphhdl.HierarchyParameterBindingTests \
            morphhdl.NativeIntNestedSymbolicControlFlowTests \
            morphhdl.ParameterizedStreamFifoDepthTests

      - name: Publish proved repair and close Increment 53
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          roadmap = Path("docs/morphhdl/parameterized-verilog-todo.md")
          text = roadmap.read_text()
          text, count = re.subn(
              r"(?m)^- \[ \] (\*\*Increment 53\b.*)$",
              r"- [x] \1",
              text,
              count=1,
          )
          if count != 1 and not re.search(
              r"(?m)^- \[x\] \*\*Increment 53\b",
              text,
          ):
              raise SystemExit("Increment 53 roadmap checkbox anchor changed")
          roadmap.write_text(text)

          evidence = Path(
              "docs/morphhdl/increment-53-native-streamfifo-closure.md"
          )
          evidence.write_text(
              "# Increment 53 closure\n\n"
              "The real native `spinal.lib.StreamFifo` is retained as one "
              "parameterized Verilog-2001 definition for depths 1, 3, 5 and 8.\n\n"
              "The exact closing head passed the focused Scala 2.12.18 and "
              "2.13.12 memory, hierarchy, nested symbolic-control-flow and "
              "native StreamFifo suites, including simulation and synthesis.\n\n"
              "The implementation removes the FIFO-specific sidecar and "
              "emitted-name reconstruction, preserves strict negative "
              "diagnostics, and keeps the native StreamFifo algorithm and "
              "parameter-controlled alternatives.\n"
          )
          PY

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name pysolvesemi
          git config user.email pysolvesemi@gmail.com

          rm -f .github/increment-53-final-trigger.txt
          git rm -f --ignore-unmatch \
            .github/workflows/increment-53-final-workflow-bootstrap.yml \
            .github/workflows/increment-53-memory-policy-repair.yml \
            .github/workflows/increment-53-repair-bootstrap.yml \
            .github/workflows/increment-53-source-repair.yml \
            docs/morphhdl/increment-53-focused-diagnostic.log

          git add -A
          git diff --cached --check
          git commit -m "Increment 53: complete native StreamFifo parameterization [inc53-exact-closure] [inc53-source-repair] [inc53-final-repair]"
          git push origin HEAD:"$GITHUB_REF_NAME"

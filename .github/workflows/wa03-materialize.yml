name: WA-03 source materialization

on:
  push:
    branches:
      - agent/wa-03-alias-equivalence-gates
    paths:
      - ".wa03-bootstrap/**"
      - ".github/workflows/wa03-materialize.yml"

permissions:
  contents: write

concurrency:
  group: wa03-source-materialization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    name: Materialize reviewed WA-03 sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staged branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and replace staging payload
        shell: bash
        run: |
          set -euo pipefail

          test -s .wa03-bootstrap/part-00
          test -s .wa03-bootstrap/part-01
          test -s .wa03-bootstrap/part-02
          test -s .wa03-bootstrap/part-03
          cat .wa03-bootstrap/part-* > /tmp/wa03-sources.tar.xz
          xz --test /tmp/wa03-sources.tar.xz
          tar -tJf /tmp/wa03-sources.tar.xz
          tar -xJf /tmp/wa03-sources.tar.xz -C .

          test -s morphhdl-passes/scripts/check-wa03-gates.py
          test -s morphhdl-passes/scripts/validate_wire_assignment_equivalence.py
          test -s morphhdl-passes/src/main/scala/morphhdl/passes/safety/WireAliasSafetyGate.scala
          test -s morphhdl-passes/src/test/scala/morphhdl/passes/safety/WireAliasSafetyGateSpec.scala

          chmod +x \
            morphhdl-passes/scripts/check-wa03-gates.py \
            morphhdl-passes/scripts/validate_wire_assignment_equivalence.py

          rm -rf .wa03-bootstrap
          rm -f .github/workflows/wa03-materialize.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Materialize WA-03 safety and proof sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"

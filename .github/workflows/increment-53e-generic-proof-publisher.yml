name: Increment 53e generic SpinalHDL proof publisher

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write

jobs:
  validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0

      - name: Prepare checkout
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Apply graph and provenance repairs
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            morphhdl/scripts/apply-increment-53e-address-role-repair.py \
            morphhdl/scripts/apply-increment-53e-implicit-child-width-formals.py \
            morphhdl/scripts/apply-increment-53e-canonical-implicit-formal-identity.py \
            morphhdl/scripts/apply-increment-53e-modular-literal-proof.py \
            morphhdl/scripts/apply-increment-53e-materialized-auto-resize-proof.py \
            morphhdl/scripts/apply-increment-53e-unfixed-literal-width-inference.py \
            morphhdl/scripts/apply-increment-53e-width-equivalence-proof.py \
            morphhdl/scripts/apply-increment-53e-generic-domain-proof.py
          do
            if test -f "$script"; then python3 "$script"; fi
          done
          git diff --check
          if git diff --quiet origin/parameterized-verilog -- \
            core/src/main lib/src/main idslplugin/src/main; then
            echo 'Native SpinalHDL production trees remain unchanged.'
          else
            echo 'Increment 53e modified a native SpinalHDL production tree.' >&2
            git diff --stat origin/parameterized-verilog -- \
              core/src/main lib/src/main idslplugin/src/main >&2
            exit 1
          fi
          ! grep -R -E \
            'StreamFifo|StreamFifoCC|pushToPopGray|popToPushGray|Stream\.scala|CrossClock\.scala' \
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedDomainEquivalence.scala \
            morphhdl/src/test/scala/spinal/core/internals/ExternalParameterizedDomainEquivalenceTests.scala

      - name: Install pinned Mill and proof tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill
          apt-get update
          apt-get install -y --no-install-recommends git iverilog yosys z3 python3
          rm -rf /tmp/sby
          git clone --depth 1 https://github.com/YosysHQ/sby.git /tmp/sby
          ln -sf /tmp/sby/sbysrc/sby.py /usr/local/bin/sby
          chmod +x /tmp/sby/sbysrc/sby.py
          iverilog -V
          yosys -V
          z3 -version
          sby -h >/dev/null

      - name: Validate both Scala lanes
        shell: bash
        run: |
          set -euo pipefail
          for lane in 2.12.18 2.13.12; do
            /tmp/morphhdl-mill "morph[$lane].testOnly" \
              spinal.core.internals.ExternalParameterizedDomainEquivalenceTests \
              morphhdl.ParameterizedStreamFifoCCTests \
              morphhdl.NativeStreamFifoCCImplementationProofTests \
              morphhdl.NativeStreamFifoCCFormalEquivalenceTests \
              morphhdl.NativeStreamFifoFormalEquivalenceTests \
              2>&1 | tee "/tmp/increment-53e-$lane.log"
          done

      - name: Run solver-backed independent-clock equivalence
        shell: bash
        env:
          MORPHDL_RUN_STREAMFIFOCC_FORMAL_EQUIVALENCE: '1'
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill 'morph[2.12.18].testOnly' \
            morphhdl.NativeStreamFifoCCFormalEquivalenceTests \
            2>&1 | tee /tmp/increment-53e-formal.log

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53e-generic-proof-evidence
          path: |
            /tmp/increment-53e-2.12.18.log
            /tmp/increment-53e-2.13.12.log
            /tmp/increment-53e-formal.log
          if-no-files-found: ignore

      - name: Publish passing implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/morphhdl/parameterized-verilog-todo.md')
          value = path.read_text()
          old = '- [ ] **Increment 53e — Native StreamFifoCC parameterization without source edits**'
          new = '- [x] **Increment 53e — Native StreamFifoCC parameterization without source edits**'
          if old in value:
              value = value.replace(old, new, 1)
          elif new not in value:
              raise SystemExit('Increment 53e roadmap entry not found')
          path.write_text(value)
          PY
          rm -f .github/workflows/increment-53e-address-resize-fix.yml
          rm -f .github/workflows/increment-53e-generic-proof-publisher.yml
          rm -f morphhdl/scripts/apply-increment-53e-address-role-repair.py
          rm -f morphhdl/scripts/apply-increment-53e-implicit-child-width-formals.py
          rm -f morphhdl/scripts/apply-increment-53e-canonical-implicit-formal-identity.py
          rm -f morphhdl/scripts/apply-increment-53e-modular-literal-proof.py
          rm -f morphhdl/scripts/apply-increment-53e-materialized-auto-resize-proof.py
          rm -f morphhdl/scripts/apply-increment-53e-unfixed-literal-width-inference.py
          rm -f morphhdl/scripts/apply-increment-53e-width-equivalence-proof.py
          rm -f morphhdl/scripts/apply-increment-53e-generic-domain-proof.py
          rm -f morphhdl/scripts/apply-increment-53e-buffercc-shape-repair.py
          git add -A
          git diff --cached --check
          git commit -m 'Increment 53e: generic native StreamFifoCC parameterization'
          git push origin HEAD:agent/increment-53e-native-streamfifocc-parameterization

name: Publish reviewed Increment 48 implementation

on:
  pull_request:
    branches: [parameterized-verilog]
    types: [synchronize]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-increment-48-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.ref == 'agent/increment-48-natural-symbolic-conditionals'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-48-natural-symbolic-conditionals
          fetch-depth: 0

      - name: Apply reviewed implementation atomically
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' > /tmp/increment48.patch.gz.b64
          base64 --decode /tmp/increment48.patch.gz.b64 | gzip --decompress > /tmp/increment48.patch
          git apply --check --whitespace=error-all /tmp/increment48.patch
          git apply --index --whitespace=error-all /tmp/increment48.patch
          git rm .github/workflows/morphhdl-increment-48-offline-export.yml
          git diff --cached --check
          test -f morphplugin/src/main/scala/morphhdl/compiler/MorphHdlCompilerPlugin.scala
          test -f frontend/src/main/scala/morphhdl/frontend/NaturalSymbolicConditional.scala
          test -f .github/workflows/morphhdl-natural-conditionals.yml
          test ! -e .github/workflows/morphhdl-increment-48-offline-export.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Increment 48: add natural symbolic conditionals'
          git push origin HEAD:agent/increment-48-natural-symbolic-conditionals

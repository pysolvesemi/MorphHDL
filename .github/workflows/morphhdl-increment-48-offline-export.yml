name: Increment 48 offline source export

on:
  pull_request:
    branches: [parameterized-verilog]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/increment-48-natural-symbolic-conditionals'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-48-natural-symbolic-conditionals
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Install temporary classpath export task
        shell: bash
        run: |
          set -euo pipefail
          cat > project/ExportClasspathBundle.scala <<'SCALA'
          import sbt._
          import sbt.Keys._

          object ExportClasspathBundle extends AutoPlugin {
            object autoImport {
              val exportClasspathBundle = taskKey[File]("Export a self-contained compile classpath bundle")
            }
            import autoImport._
            override def trigger = allRequirements
            override lazy val projectSettings: Seq[Def.Setting[_]] = Seq(
              exportClasspathBundle := {
                val projectId = thisProjectRef.value.project
                val out = (ThisBuild / baseDirectory).value / "export-classpath" / projectId
                IO.delete(out)
                IO.createDirectory(out)
                val external = (Compile / externalDependencyClasspath).value.map(_.data)
                val scalaJars = scalaInstance.value.allJars.toSeq
                (external ++ scalaJars).filter(_.isFile).distinct.foreach { jar =>
                  IO.copyFile(jar, out / jar.getName, preserveLastModified = true)
                }
                val packaged = (Compile / packageBin).value
                IO.copyFile(packaged, out / s"${projectId}.jar", preserveLastModified = true)
                out
              }
            )
          }
          SCALA
          sed -i 's/^          //' project/ExportClasspathBundle.scala

      - name: Package exact branch source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/MorphHDL-increment48-base.tar.gz HEAD
          sha256sum /tmp/MorphHDL-increment48-base.tar.gz > /tmp/MorphHDL-increment48-base.tar.gz.sha256

      - name: Export Scala 2.12 classpaths
        shell: bash
        run: |
          set -euo pipefail
          rm -rf export-classpath
          sbt --batch --no-server \
            '++2.12.18' \
            'idslpayload/exportClasspathBundle' \
            'idslplugin/exportClasspathBundle' \
            'sim/exportClasspathBundle' \
            'paramrtl/exportClasspathBundle' \
            'core/exportClasspathBundle' \
            'lib/exportClasspathBundle' \
            'frontend/exportClasspathBundle' \
            'verilogBackend/exportClasspathBundle' \
            'morph/exportClasspathBundle'
          tar -czf /tmp/MorphHDL-increment48-classpath-2.12.tar.gz export-classpath
          sha256sum /tmp/MorphHDL-increment48-classpath-2.12.tar.gz > /tmp/MorphHDL-increment48-classpath-2.12.tar.gz.sha256

      - name: Export Scala 2.13 classpaths
        shell: bash
        run: |
          set -euo pipefail
          rm -rf export-classpath
          sbt --batch --no-server \
            '++2.13.12' \
            'idslpayload/exportClasspathBundle' \
            'idslplugin/exportClasspathBundle' \
            'sim/exportClasspathBundle' \
            'paramrtl/exportClasspathBundle' \
            'core/exportClasspathBundle' \
            'lib/exportClasspathBundle' \
            'frontend/exportClasspathBundle' \
            'verilogBackend/exportClasspathBundle' \
            'morph/exportClasspathBundle'
          tar -czf /tmp/MorphHDL-increment48-classpath-2.13.tar.gz export-classpath
          sha256sum /tmp/MorphHDL-increment48-classpath-2.13.tar.gz > /tmp/MorphHDL-increment48-classpath-2.13.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MorphHDL-increment48-base-source
          path: |
            /tmp/MorphHDL-increment48-base.tar.gz
            /tmp/MorphHDL-increment48-base.tar.gz.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: MorphHDL-increment48-classpath-2.12
          path: |
            /tmp/MorphHDL-increment48-classpath-2.12.tar.gz
            /tmp/MorphHDL-increment48-classpath-2.12.tar.gz.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: MorphHDL-increment48-classpath-2.13
          path: |
            /tmp/MorphHDL-increment48-classpath-2.13.tar.gz
            /tmp/MorphHDL-increment48-classpath-2.13.tar.gz.sha256
          if-no-files-found: error

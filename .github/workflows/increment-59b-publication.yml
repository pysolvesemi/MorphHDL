name: Increment 59b parameterized balanced publication

on:
  push:
    branches: ['agent/increment-59b-*']
    paths:
      - '.github/workflows/increment-59b-publication.yml'
      - 'morphhdl/src/**'
      - 'morphhdl/scripts/check-increment-59b-publication.py'
      - 'morphhdl/scripts/check-increment-59b-operator-replay.py'
      - 'build.sbt'
      - 'build.mill'
      - 'core/src/**'
      - 'lib/src/**'
      - 'morphruntime/src/**'
  pull_request:
    branches: [parameterized-verilog]
    paths:
      - '.github/workflows/increment-59b-publication.yml'
      - 'morphhdl/src/**'
      - 'morphhdl/scripts/check-increment-59b-publication.py'
      - 'morphhdl/scripts/check-increment-59b-operator-replay.py'
      - 'build.sbt'
      - 'build.mill'
      - 'core/src/**'
      - 'lib/src/**'
      - 'morphruntime/src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-59b-publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref || github.ref_name, 'agent/increment-59b-')
    name: Parameterized publication Scala ${{ matrix.scala }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scala: ['2.12.18', '2.13.12']
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      COURSIER_REPOSITORIES: https://repo.maven.apache.org/maven2
      COURSIER_CACHE: /sbt/.cache/coursier/v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Preserve exact-head evidence and validate native boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/increment-59b-publication/bootstrap
          git rev-parse HEAD > target/increment-59b-publication/head.txt
          git archive HEAD | gzip > target/increment-59b-publication/source.tar.gz
          python3 morphhdl/scripts/check-native-source-preservation.py
          python3 morphhdl/scripts/check-increment-58-retirement.py
          python3 morphhdl/scripts/check-native-source-preservation.py \
            --generate-template morphhdl/contracts/increment-55-native-change-review.json \
            --output target/increment-59b-publication/native.json
          cmp morphhdl/contracts/native-source-preservation.json target/increment-59b-publication/native.json
      - name: Bootstrap the repository-pinned SBT launcher
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^sbt.version=//p' project/build.properties)
          test "$version" = '1.10.0'
          dir="$GITHUB_WORKSPACE/target/increment-59b-publication/bootstrap"
          base="https://repo.maven.apache.org/maven2/org/scala-sbt/sbt-launch/$version/sbt-launch-$version.jar"
          curl --fail --location --retry 5 --retry-all-errors "$base" -o "$dir/sbt-launch.jar"
          curl --fail --location --retry 5 --retry-all-errors "$base.sha1" -o "$dir/sbt-launch.jar.sha1"
          python3 - <<'PY'
          import hashlib, re
          from pathlib import Path
          root = Path('target/increment-59b-publication/bootstrap')
          expected = (root / 'sbt-launch.jar.sha1').read_text().strip()
          assert re.fullmatch('[0-9a-fA-F]{40}', expected)
          assert hashlib.sha1((root / 'sbt-launch.jar').read_bytes()).hexdigest() == expected.lower()
          PY
          printf '[repositories]\nlocal\nmaven-central: https://repo.maven.apache.org/maven2\n' > "$dir/repositories"
      - name: Exercise the public helper and generate one candidate plus independent native references
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-59b-publication"
          bootstrap="$output/bootstrap"
          java -Xmx3G -Dsbt.log.noformat=true -Dsbt.supershell=false \
            -Dsbt.boot.directory=/sbt/.sbt/boot -Dsbt.global.base=/sbt/.sbt \
            -Dsbt.ivy.home=/sbt/.ivy2 -Duser.home=/sbt \
            -Dsbt.repository.config="$bootstrap/repositories" -Dsbt.override.build.repos=true \
            -jar "$bootstrap/sbt-launch.jar" "++${{ matrix.scala }}" \
            'morph/Test/testOnly spinal.core.internals.TypedBalancedReductionPublicationTests spinal.core.internals.TypedBalancedReductionCallbackPolicyTests spinal.core.internals.TypedBalancedReductionPublicationSafetyTests spinal.core.FiniteAffineVecReadTests' \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionPublicationArtifactWriter $output/a" \
            "morph/Test/runMain spinal.core.internals.TypedBalancedReductionPublicationArtifactWriter $output/b" \
            > "$output/sbt.log" 2>&1 || { tail -n 100 "$output/sbt.log"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name, count in [('TypedBalancedReductionPublicationTests',4), ('TypedBalancedReductionCallbackPolicyTests',12), ('TypedBalancedReductionPublicationSafetyTests',7), ('FiniteAffineVecReadTests',8)]:
              files = list(Path('morphhdl/target').rglob('*' + name + '.xml'))
              assert len(files) == 1, (name, files)
              suite = ET.parse(files[0]).getroot()
              assert int(suite.get('tests','0')) == count, (name, suite.attrib)
              assert all(int(suite.get(key,'0')) == 0 for key in ('failures','errors','skipped')), (name,suite.attrib)
              print(name, suite.attrib)
          PY
      - name: Prove all 32 WIDTH and COUNT specializations and detect changed candidate operands and Vec binding
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-59b-publication"
          python3 morphhdl/scripts/check-increment-59b-publication.py "$output/a" "$output/b"
          printf '%s\n' 'One parameterized public-helper artifact: 32 WIDTH/COUNT specializations, independent native references, strict Verilog-2001 tools, independent arithmetic and enabled pipeline simulation, reset-entry proofs, unbounded temporal induction and genuine counterexamples for mutated candidate operands and cross-Vec source binding.' >> "$GITHUB_STEP_SUMMARY"
      - name: Print actual failing test and HDL diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in sorted(Path('morphhdl/target').rglob('*Balanced*.xml')):
              try:
                  suite = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in suite.iter('testcase'):
                  for node in case:
                      if node.tag in ('failure','error'):
                          message = node.get('message', '').replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                          print('::error title=' + case.get('name','test') + '::' + message)
                          print('\nFAILED:', case.get('classname'), case.get('name'))
                          print(node.attrib)
                          print((node.text or '')[:6000])
          logs = sorted(Path('target/increment-59b-publication/a/checks').rglob('*.log'), key=lambda p:p.stat().st_mtime)
          for path in logs[-3:]:
              print('\nHDL LOG:', path)
              print('\n'.join(path.read_text(errors='replace').splitlines()[-100:]))
          PY
      - name: Retain exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59b-publication-${{ matrix.scala }}
          path: |
            target/increment-59b-publication
            morphhdl/target/test-reports
          if-no-files-found: error
          retention-days: 30

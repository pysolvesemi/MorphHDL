name: WA-07 roadmap closure Windows

on:
  push:
    branches:
      - agent/wa-07-unified-expression-inlining
    paths:
      - ".github/workflows/wa07-close-windows.yml"

permissions:
  contents: write

jobs:
  close:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wa-07-unified-expression-inlining
          fetch-depth: 0
      - name: Mark WA-07 complete and WA-08 ready
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          path = Path("morphhdl-passes/morphhdl-ir-wire-assignment-passes-todo.md")
          text = path.read_text(encoding="utf-8")
          if "- [x] **WA-07 — Unified pass control and unnamed expression-assignment elimination**" not in text:
              old = "- [ ] **WA-07 — Unified pass control and unnamed expression-assignment elimination**"
              if old not in text:
                  raise SystemExit("WA-07 roadmap entry not found")
              text = text.replace(old, old.replace("[ ]", "[x]"), 1)
              wa07_start = text.index("- [x] **WA-07")
              wa08_start = text.index("- [ ] **WA-08", wa07_start)
              before = text[:wa07_start]
              wa07 = text[wa07_start:wa08_start]
              after = text[wa08_start:]
              if "**Status:** `IN PROGRESS`." not in wa07:
                  raise SystemExit("WA-07 status is not IN PROGRESS")
              wa07 = wa07.replace("**Status:** `IN PROGRESS`.", "**Status:** `COMPLETED`.", 1)
              text = before + wa07 + after
          wa08_start = text.index("- [ ] **WA-08")
          wa08 = text[wa08_start:]
          if "**Status:** `BLOCKED`." in wa08:
              text = text[:wa08_start] + wa08.replace("**Status:** `BLOCKED`.", "**Status:** `READY`.", 1)
          elif "**Status:** `READY`." not in wa08:
              raise SystemExit("WA-08 status is neither BLOCKED nor READY")
          path.write_text(text, encoding="utf-8")
          '@ | Set-Content -Encoding utf8 wa07_close.py
          python wa07_close.py
          git diff --check
          if (-not (git diff --quiet -- morphhdl-passes/morphhdl-ir-wire-assignment-passes-todo.md)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add morphhdl-passes/morphhdl-ir-wire-assignment-passes-todo.md
            git commit -m "WA-07: mark unified expression pass complete"
            git pull --rebase origin agent/wa-07-unified-expression-inlining
            git push origin HEAD:agent/wa-07-unified-expression-inlining
          }

name: Validate and publish generic Increment 53d across all SpinalHDL sources

on:
  push:
    branches:
      - agent/increment-53d-generic-definition-boundary
    paths:
      - .github/workflows/increment-53d-generic-all-spinal-publisher.yml
      - morphhdl/scripts/apply-increment-53d-generic-all-spinal.py

permissions:
  contents: write

jobs:
  repair-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out exact Increment 53d branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-generic-definition-boundary
          fetch-depth: 0

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Build component-independent source transformation
        shell: bash
        run: |
          set -euo pipefail
          repair=/tmp/increment-53d-generic-all-spinal
          git worktree add --detach "$repair" origin/parameterized-verilog
          mkdir -p "$repair/morphhdl/scripts"
          for version in v4 v8 v9 v10; do
            git show \
              "origin/agent/increment-53d-generic-native-definition-boundary:morphhdl/scripts/apply-increment-53d-generic-boundary-${version}.py" \
              > "$repair/morphhdl/scripts/apply-increment-53d-generic-boundary-${version}.py"
          done
          cp morphhdl/scripts/apply-increment-53d-generic-all-spinal.py \
            "$repair/morphhdl/scripts/apply-increment-53d-generic-all-spinal.py"
          (
            cd "$repair"
            python3 morphhdl/scripts/apply-increment-53d-generic-all-spinal.py
            git diff --check
          )
          for path in \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala \
            morphhdl/src/test/scala/morphhdl/GenericNativeDefinitionBoundaryTests.scala \
            morphhdl/scripts/check-native-stream-width-adapter-boundary.sh \
            docs/morphhdl/increment-53d-native-streamwidth-adapter.md; do
            cp "$repair/$path" "$path"
          done
          git diff --check
          git diff --stat
          grep -F 'case Bind(name: TermName, body) =>' \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala
          if grep -Fq \
            'normalizedPath.endsWith("/lib/src/main/scala/spinal/lib/Stream.scala")' \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala; then
            echo 'Generic phase eligibility still names Stream.scala' >&2
            exit 1
          fi

      - name: Compile complete upstream tree on Scala 2.13.12
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morphplugin[2.13.12].compile
          /tmp/morphhdl-mill morph[2.13.12].test.compile

      - name: Validate generic and inherited contracts on Scala 2.13.12
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.GenericNativeDefinitionBoundaryTests \
            morphhdl.ParameterizedStreamWidthAdapterTests \
            morphhdl.ParameterizedStreamFifoDepthTests \
            morphhdl.BackendSyncMergeIsolationTests \
            morphhdl.CapturedAssignmentNormalizationTests \
            morphhdl.NativeIntSymbolicConditionalTests \
            morphhdl.NativeIntNestedSymbolicControlFlowTests \
            morphhdl.NativeMemAutoProvenanceTests \
            morphhdl.ExternalNativeIntFormalizationTests \
            morphhdl.ExternalNativeIntShadowExpressionTests \
            morphhdl.ExternalNativeIntShadowProvenanceTests \
            morphhdl.FormalParameterIdentityTests \
            morphhdl.FormalParameterClonePropagationTests \
            morphhdl.HierarchyParameterBindingTests \
            morphhdl.MorphSingleSourceVerilogTests \
            morphhdl.integration.ExternalSpinalVerilogBaselineTests

      - name: Compile complete upstream tree on Scala 2.12.18
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morphplugin[2.12.18].compile
          /tmp/morphhdl-mill morph[2.12.18].test.compile

      - name: Validate generic and inherited contracts on Scala 2.12.18
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morph[2.12.18].testOnly \
            morphhdl.GenericNativeDefinitionBoundaryTests \
            morphhdl.ParameterizedStreamWidthAdapterTests \
            morphhdl.ParameterizedStreamFifoDepthTests \
            morphhdl.BackendSyncMergeIsolationTests \
            morphhdl.CapturedAssignmentNormalizationTests \
            morphhdl.NativeIntSymbolicConditionalTests \
            morphhdl.NativeIntNestedSymbolicControlFlowTests \
            morphhdl.NativeMemAutoProvenanceTests \
            morphhdl.ExternalNativeIntFormalizationTests \
            morphhdl.ExternalNativeIntShadowExpressionTests \
            morphhdl.ExternalNativeIntShadowProvenanceTests \
            morphhdl.FormalParameterIdentityTests \
            morphhdl.FormalParameterClonePropagationTests \
            morphhdl.HierarchyParameterBindingTests \
            morphhdl.MorphSingleSourceVerilogTests \
            morphhdl.integration.ExternalSpinalVerilogBaselineTests

      - name: Validate source ownership and publish production files
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl/scripts/check-native-stream-width-adapter-boundary.sh
          git diff --quiet HEAD -- core lib idslplugin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala \
            morphhdl/src/test/scala/morphhdl/GenericNativeDefinitionBoundaryTests.scala \
            morphhdl/scripts/check-native-stream-width-adapter-boundary.sh \
            docs/morphhdl/increment-53d-native-streamwidth-adapter.md
          git diff --cached --check
          git commit -m "fix: generalize native definition boundaries across SpinalHDL"
          git push origin HEAD:agent/increment-53d-generic-definition-boundary

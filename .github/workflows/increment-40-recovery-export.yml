name: Increment 40 recovery export

on:
  push:
    branches:
      - agent/increment-40-external-symbolic-width
  pull_request:
    branches:
      - parameterized-verilog
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/morphhdl-increment-40-current.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: morphhdl-increment-40-current
          path: /tmp/morphhdl-increment-40-current.tar.gz
          if-no-files-found: error
          retention-days: 1

  diagnose-contract-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Generate and diagnose Scala 2.12 contract RTL
        shell: bash
        run: |
          set +e
          root="${GITHUB_WORKSPACE}/target/morphhdl/increment-40-diagnostic"
          run1="${root}/run-1"
          run2="${root}/run-2"
          mkdir -p "${run1}" "${run2}"
          summary="${root}/summary.txt"
          : > "${summary}"

          echo "head=$(git rev-parse HEAD)" | tee -a "${summary}"
          sbt -batch ++2.12.18 \
            "morph/Test/runMain morphhdl.MorphContractFixtureGenerator --output-dir ${run1}" \
            >"${root}/generate-run-1.log" 2>&1
          run1_status=$?
          echo "run1_status=${run1_status}" | tee -a "${summary}"

          sbt -batch ++2.12.18 \
            "morph/Test/runMain morphhdl.MorphContractFixtureGenerator --output-dir ${run2} --reverse-construction-order" \
            >"${root}/generate-run-2.log" 2>&1
          run2_status=$?
          echo "run2_status=${run2_status}" | tee -a "${summary}"

          echo "=== run-1 inventory ===" >> "${summary}"
          find "${run1}" -mindepth 1 -maxdepth 1 -printf '%f %y\n' 2>&1 | sort >> "${summary}"
          echo "=== run-2 inventory ===" >> "${summary}"
          find "${run2}" -mindepth 1 -maxdepth 1 -printf '%f %y\n' 2>&1 | sort >> "${summary}"

          echo "=== run-1 versus run-2 ===" >> "${summary}"
          diff -ru "${run1}" "${run2}" >"${root}/run-order.diff" 2>&1
          run_order_status=$?
          echo "run_order_status=${run_order_status}" | tee -a "${summary}"

          echo "=== generated versus contracts ===" >> "${summary}"
          contract_status=0
          for expected in morphhdl/examples/contracts/*.v
          do
            filename="$(basename "${expected}")"
            actual="${run1}/${filename}"
            if [ ! -f "${actual}" ]
            then
              echo "MISSING ${filename}" | tee -a "${summary}"
              contract_status=1
              continue
            fi
            if cmp -s "${actual}" "${expected}"
            then
              echo "MATCH ${filename}" >> "${summary}"
            else
              echo "DIFF ${filename}" | tee -a "${summary}"
              diff -u "${expected}" "${actual}" >"${root}/contract-${filename}.diff" 2>&1
              contract_status=1
            fi
          done
          echo "contract_status=${contract_status}" | tee -a "${summary}"

          count() {
            label="$1"
            command="$2"
            value="$(bash -lc "${command}" 2>/dev/null)"
            echo "${label}=${value}" | tee -a "${summary}"
          }

          if [ -f "${run1}/parameterized_wire.v" ]; then
            count parameterized_wire_parameter_count "grep -Ec '^[[:space:]]*parameter integer WIDTH = 8$' '${run1}/parameterized_wire.v'"
            count parameterized_wire_width_port_count "grep -Ec '\\[WIDTH-1:0\\] (din|dout)' '${run1}/parameterized_wire.v'"
            count parameterized_wire_assign_count "grep -Fc 'assign dout = din;' '${run1}/parameterized_wire.v'"
          fi
          if [ -f "${run1}/symbolic_data_shapes.v" ]; then
            count symbolic_shape_parameter_count "grep -Ec '^[[:space:]]*parameter integer WIDTH = 8$' '${run1}/symbolic_data_shapes.v'"
            count symbolic_shape_range_count "grep -Ec '\\[WIDTH-1:0\\]' '${run1}/symbolic_data_shapes.v'"
            count symbolic_shape_clocked_count "grep -Ec '^[[:space:]]*always @\\(posedge clk\\)' '${run1}/symbolic_data_shapes.v'"
          fi
          for filename in derived_width.v single_port_memory.v parameterized_counter.v simple_dual_port_memory.v synchronous_stream_fifo.v
          do
            if [ -f "${run1}/${filename}" ]; then
              count "${filename%.v}_clog2_function_count" "grep -Fc 'function integer clog2;' '${run1}/${filename}'"
            fi
          done
          if [ -f "${run1}/derived_width.v" ]; then
            count derived_width_lane_clog2_count "grep -Fc 'clog2(LANES, 0)' '${run1}/derived_width.v'"
          fi
          if [ -f "${run1}/single_port_memory.v" ]; then
            count single_port_depth_clog2_count "grep -Fc 'clog2(DEPTH, 1)' '${run1}/single_port_memory.v'"
          fi
          if [ -f "${run1}/parameterized_counter.v" ]; then
            count counter_limit_clog2_count "grep -Fc 'clog2(LIMIT, 1)' '${run1}/parameterized_counter.v'"
          fi
          if [ -f "${run1}/simple_dual_port_memory.v" ]; then
            count simple_dual_port_depth_clog2_count "grep -Fc 'clog2(DEPTH, 1)' '${run1}/simple_dual_port_memory.v'"
          fi
          if [ -f "${run1}/synchronous_stream_fifo.v" ]; then
            count fifo_depth_clog2_count "grep -Fc 'clog2(DEPTH, 1)' '${run1}/synchronous_stream_fifo.v'"
            count fifo_occupancy_clog2_count "grep -Fc 'clog2(DEPTH + 1, 1)' '${run1}/synchronous_stream_fifo.v'"
          fi

          echo "=== generator run-1 tail ===" >> "${summary}"
          tail -n 100 "${root}/generate-run-1.log" >> "${summary}" 2>&1
          echo "=== generator run-2 tail ===" >> "${summary}"
          tail -n 100 "${root}/generate-run-2.log" >> "${summary}" 2>&1

          echo "diagnostic_complete=1" | tee -a "${summary}"
          exit 0

      - name: Upload contract diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morphhdl-increment-40-contract-diagnostic
          path: target/morphhdl/increment-40-diagnostic
          if-no-files-found: error
          retention-days: 1

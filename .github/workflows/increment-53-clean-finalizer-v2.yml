name: Increment 53 clean exact-head finalizer v2

on:
  push:
    branches:
      - agent/increment-53-native-streamfifo-clean
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: increment-53-clean-exact-head-finalizer-v2
  cancel-in-progress: false

jobs:
  validate-clean-and-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BRANCH: agent/increment-53-native-streamfifo-clean
      XDG_CACHE_HOME: /tmp/morphhdl-cache
      TOOL_IMAGE: ghcr.io/spinalhdl/docker:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53-native-streamfifo-clean
          fetch-depth: 0

      - name: Wait for the reconstructed source head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MorphHDL Increment Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          ready=0
          for _ in $(seq 1 720); do
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"

            active_bootstrap="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$BRANCH&per_page=100" \
                --jq '[.workflow_runs[] | select(.name == "Increment 53 clean bootstrap" and .status != "completed")] | length'
            )"

            if [[ ! -e .github/workflows/increment-53-clean-bootstrap.yml ]] && \
               grep -Fq -- '- [x] **Increment 53 — Native StreamFifo parameter structure without source edits**' \
                 docs/morphhdl/parameterized-verilog-todo.md && \
               [[ "$active_bootstrap" == 0 ]]; then
              ready=1
              break
            fi
            sleep 10
          done

          [[ "$ready" == 1 ]] || {
            echo 'Clean Increment 53 bootstrap did not reach a completed source state.' >&2
            exit 2
          }

          test ! -e lib/src/main/scala/spinal/lib/ParameterizedStreamFifoDepth.scala
          ! grep -R --line-number --fixed-strings 'rewriteParameterizedStreamFifoDepth' \
            morphhdl/src/main/scala frontend/src/main/scala lib/src/main/scala
          git diff --check

      - name: Run source-preservation boundaries
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl/scripts/check-native-streamfifo-structure-boundary.sh
          bash morphhdl/scripts/check-native-source-guard.sh

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0-mill.sh \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Run complete dual-Scala repository matrix
        shell: bash
        run: |
          set -euo pipefail
          for scala_version in 2.12.18 2.13.12; do
            docker run --rm \
              -e XDG_CACHE_HOME=/tmp/morphhdl-cache \
              -v "$GITHUB_WORKSPACE:/workspace" \
              -v /tmp/morphhdl-mill:/tmp/morphhdl-mill:ro \
              -w /workspace \
              "$TOOL_IMAGE" \
              bash -lc "
                set -euo pipefail
                git config --global --add safe.directory /workspace
                /tmp/morphhdl-mill idslplugin[$scala_version].test
                /tmp/morphhdl-mill paramrtl[$scala_version].test
                /tmp/morphhdl-mill frontend[$scala_version].test
                /tmp/morphhdl-mill verilogBackend[$scala_version].test
                /tmp/morphhdl-mill morph[$scala_version].test
                /tmp/morphhdl-mill core[$scala_version].testOnly spinal.core.internals.SpinalVerilogPhasePlanTests
              "
          done

      - name: Re-run focused Increment 53 and inherited contracts
        shell: bash
        run: |
          set -euo pipefail
          for scala_version in 2.12.18 2.13.12; do
            docker run --rm \
              -e XDG_CACHE_HOME=/tmp/morphhdl-cache \
              -v "$GITHUB_WORKSPACE:/workspace" \
              -v /tmp/morphhdl-mill:/tmp/morphhdl-mill:ro \
              -w /workspace \
              "$TOOL_IMAGE" \
              bash -lc "
                set -euo pipefail
                git config --global --add safe.directory /workspace
                /tmp/morphhdl-mill -i 'morph[$scala_version].testOnly' \
                  morphhdl.ParameterizedStreamFifoDepthTests \
                  morphhdl.NativeIntSymbolicConditionalTests \
                  morphhdl.NativeIntNestedSymbolicControlFlowTests \
                  morphhdl.AutomaticNativeMemDepthProvenanceTests
              "
          done

      - name: Publish an orchestration-free exact head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            morphhdl/.increment-status/clean-bootstrap-requested.txt \
            morphhdl/.increment-status/clean-pr-requested.txt \
            morphhdl/.increment-status/clean-final-trigger.txt
          rm -rf morphhdl/.increment-status/increment-53-clean
          rm -f .github/workflows/increment-53-clean-bootstrap.yml
          rm -f .github/workflows/increment-53-clean-supervisor.yml
          rm -f .github/workflows/increment-53-clean-finalizer.yml
          rm -f .github/workflows/increment-53-clean-finalizer-v2.yml
          find morphhdl/scripts -maxdepth 1 -type f -name '*increment-53*.py' -delete

          test ! -e lib/src/main/scala/spinal/lib/ParameterizedStreamFifoDepth.scala
          ! grep -R --line-number --fixed-strings 'rewriteParameterizedStreamFifoDepth' \
            morphhdl/src/main/scala frontend/src/main/scala lib/src/main/scala
          git diff --check
          bash morphhdl/scripts/check-native-streamfifo-structure-boundary.sh
          bash morphhdl/scripts/check-native-source-guard.sh

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: publish orchestration-free Increment 53 head'
            git pull --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"
          fi

          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          [[ -n "$pr_number" ]] || { echo 'Clean Increment 53 PR not found' >&2; exit 3; }
          gh pr ready "$pr_number" --repo "$GITHUB_REPOSITORY"

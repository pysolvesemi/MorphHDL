name: Increment 59i widening captures development

on:
  push:
    branches: ['agent/increment-59i-combined-reduction-closure']
    paths:
      - '.github/workflows/increment-59i-widening-captures-development.yml'
      - 'morphhdl/repair-59i-widening-captures/**'
      - 'morphhdl/repair-59i-composite-widening-publication/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-59i-widening-captures-development
  cancel-in-progress: true

jobs:
  qualify:
    name: Prove widening publication and capture composition
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      BRANCH: agent/increment-59i-combined-reduction-closure
      COURSIER_REPOSITORIES: https://repo.maven.apache.org/maven2
      COURSIER_CACHE: /sbt/.cache/coursier/v1
      JAVA_TOOL_OPTIONS: '-Xmx5G -XX:ActiveProcessorCount=4'
      SBT_TEST_PARALLEL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Apply exact read-only composition candidate
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-widening-captures"
          mkdir -p "$out"
          predecessor=$(git rev-parse HEAD)
          test "$predecessor" = "${{ github.sha }}"
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$predecessor"
          printf '%s\n' "$predecessor" > "$out/predecessor.txt"

          python3 -m py_compile \
            morphhdl/repair-59i-composite-widening-publication/apply.py \
            morphhdl/repair-59i-composite-widening-publication/allow-audited-bundle-construction.py \
            morphhdl/repair-59i-widening-captures/apply.py \
            morphhdl/repair-59i-widening-captures/finish-composition.py

          python3 morphhdl/repair-59i-composite-widening-publication/apply.py \
            | tee "$out/application.log"
          python3 morphhdl/repair-59i-composite-widening-publication/allow-audited-bundle-construction.py \
            | tee -a "$out/application.log"

          python3 - <<'PY' 2>&1 | tee -a "$out/application.log"
          import importlib.util
          from pathlib import Path

          path = Path("morphhdl/repair-59i-widening-captures/apply.py")
          spec = importlib.util.spec_from_file_location("increment_59i_widening_captures", path)
          if spec is None or spec.loader is None:
              raise RuntimeError("cannot load the exact widening-capture transaction")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          replay = module.COMPOSITE.read_text()
          if replay.count("private[internals] def cloneShape") != 1:
              raise RuntimeError("publication prototype did not expose exactly one certified cloneShape")
          module.EXPECTED_BLOBS[module.COMPOSITE] = module.git_blob(module.COMPOSITE.read_bytes())

          def replace_once(old: str, new: str, label: str) -> None:
              if module.TEST_SOURCE.count(old) != 1:
                  raise RuntimeError(label + " no longer has one exact anchor")
              module.TEST_SOURCE = module.TEST_SOURCE.replace(old, new, 1)

          replace_once(
              "math.max(math.max(left, 3) + 1, right) + 1",
              "scala.math.max(scala.math.max(left, 3) + 1, right) + 1",
              "widening-capture expected-width namespace")
          replace_once(
              "  def typedWidth(value: BaseType): ElabInt =\n    ElabInt.fromExpression(ParameterizedWidth.expressionOf(value)\n      .getOrElse(ElabInt.literal(value.getBitsWidth).expression))",
              "  def typedWidth(value: BaseType): ElabInt =\n    ElabInt.widthOf(value)",
              "widening-capture exact typed-width query")
          replace_once(
              "  val reduced = values.reduceBalancedTree(\n    (a: BalancedCapturedWideningValue, b: BalancedCapturedWideningValue) =>\n      BalancedCapturedWideningFixture.combine(a, b, bias, factor))",
              "  val reduced = {\n    val capturedBias = bias\n    val capturedFactor = factor\n    values.reduceBalancedTree(\n      (a: BalancedCapturedWideningValue, b: BalancedCapturedWideningValue) =>\n        BalancedCapturedWideningFixture.combine(a, b, capturedBias, capturedFactor))\n  }",
              "public widening-capture lambda boundary")
          replace_once(
              "      val callback = (a: BalancedCapturedWideningValue, b: BalancedCapturedWideningValue) =>\n        BalancedCapturedWideningFixture.combine(a, b, bias, factor)",
              "      val callback = {\n        val capturedBias = bias\n        val capturedFactor = factor\n        (a: BalancedCapturedWideningValue, b: BalancedCapturedWideningValue) =>\n          BalancedCapturedWideningFixture.combine(a, b, capturedBias, capturedFactor)\n      }",
              "focused widening-capture lambda boundary")
          replace_once(
              "        val callback = (a: BalancedCapturedWideningPair, b: BalancedCapturedWideningPair) => {\n          val left = (a.right +^ bias) +^ b.left\n          val right = (a.right +^ bias) +^ b.right\n          val result = BalancedCapturedWideningPair(BalancedCapturedWideningFixture.typedWidth(left))\n          result.left := left\n          result.right := right\n          result\n        }",
              "        val callback = {\n          val capturedBias = bias\n          (a: BalancedCapturedWideningPair, b: BalancedCapturedWideningPair) => {\n            val left = (a.right +^ capturedBias) +^ b.left\n            val right = (a.right +^ capturedBias) +^ b.right\n            val result = BalancedCapturedWideningPair(BalancedCapturedWideningFixture.typedWidth(left))\n            result.left := left\n            result.right := right\n            result\n          }\n        }",
              "cross-field widening-capture lambda boundary")
          replace_once(
              "    val config = SpinalConfig(targetDirectory = directory.toString,\n      headerWithDate = false, headerWithRepoHash = false, bitVectorWidthMax = 8192)",
              "    val config = SpinalConfig(targetDirectory = directory.toString,\n      headerWithDate = false, bitVectorWidthMax = 8192)",
              "widening-capture MorphVerilog configuration")

          module.main()
          print("59i widening-capture extension applied after exact publication prototype")
          PY

          python3 morphhdl/repair-59i-widening-captures/finish-composition.py \
            | tee -a "$out/application.log"

          git add -N -- \
            morphhdl/src/test/scala/spinal/core/internals/TypedBalancedReductionCompositeWideningPublicationTests.scala \
            morphhdl/src/test/scala/spinal/core/internals/TypedBalancedReductionCompositeWideningConstructionPolicyTests.scala \
            morphhdl/src/test/scala/spinal/core/internals/TypedBalancedReductionCompositeWideningCaptureTests.scala
          git diff --check

          cat > "$out/expected-files.txt" <<'EOF'
          core/src/main/scala/spinal/core/ElabInt.scala
          morphhdl/repair-59i-composite-widening-publication-proof/TypedBalancedReductionCompositeWideningProofArtifacts.scala
          morphhdl/src/main/scala/spinal/core/internals/TypedBalancedReductionBackend.scala
          morphhdl/src/main/scala/spinal/core/internals/TypedBalancedReductionCertifiedCallbackPolicy.scala
          morphhdl/src/main/scala/spinal/core/internals/TypedBalancedReductionCompositeCallbackPolicy.scala
          morphhdl/src/main/scala/spinal/core/internals/TypedBalancedReductionCompositeLeafReplay.scala
          morphhdl/src/main/scala/spinal/core/internals/TypedBalancedReductionCompositeReplay.scala
          morphhdl/src/main/scala/spinal/core/internals/TypedBalancedReductionOperatorReplay.scala
          morphhdl/src/test/scala/spinal/core/internals/TypedBalancedReductionCompositeWideningCaptureTests.scala
          morphhdl/src/test/scala/spinal/core/internals/TypedBalancedReductionCompositeWideningConstructionPolicyTests.scala
          morphhdl/src/test/scala/spinal/core/internals/TypedBalancedReductionCompositeWideningPublicationTests.scala
          morphhdl/src/test/scala/spinal/core/internals/TypedBalancedReductionCompositeWideningTests.scala
          EOF
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > "$out/actual-files.txt"
          sort -u "$out/expected-files.txt" > "$out/expected-files.sorted.txt"
          diff -u "$out/expected-files.sorted.txt" "$out/actual-files.txt"
          git diff --stat | tee "$out/diff-stat.txt"
          git diff --binary > "$out/candidate.diff"

      - name: Bootstrap pinned SBT
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-widening-captures"
          version=$(sed -n 's/^sbt.version=//p' project/build.properties)
          test "$version" = '1.10.0'
          curl --fail --location --retry 5 --retry-all-errors \
            "https://repo.maven.apache.org/maven2/org/scala-sbt/sbt-launch/$version/sbt-launch-$version.jar" \
            -o "$out/sbt-launch.jar"
          printf '[repositories]\nlocal\nmaven-central: https://repo.maven.apache.org/maven2\n' > "$out/repositories"
          cat > "$out/sbt.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-widening-captures"
          scala="$1"
          shift
          java -Xmx4G -Dsbt.log.noformat=true -Dsbt.supershell=false \
            -Dsbt.boot.directory=/sbt/.sbt/boot -Dsbt.global.base=/sbt/.sbt \
            -Dsbt.ivy.home=/sbt/.ivy2 -Duser.home=/sbt \
            -Dsbt.repository.config="$out/repositories" -Dsbt.override.build.repos=true \
            -jar "$out/sbt-launch.jar" "++$scala" "$@"
          SH
          chmod +x "$out/sbt.sh"

      - name: Compile and run both Scala lanes
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-widening-captures"
          suites='spinal.core.internals.TypedBalancedReductionCompositeWideningCaptureTests spinal.core.internals.TypedBalancedReductionCompositeWideningPublicationTests spinal.core.internals.TypedBalancedReductionCompositeWideningConstructionPolicyTests spinal.core.internals.TypedBalancedReductionCompositeWideningTests spinal.core.internals.TypedBalancedReductionCompositeCaptureTests spinal.core.internals.TypedBalancedReductionCompositeTests spinal.core.internals.TypedBalancedReductionCompositeSaturationTests spinal.core.internals.TypedBalancedReductionCompositeCallbackPolicyTests spinal.core.internals.TypedBalancedReductionCombinedTests spinal.core.internals.TypedBalancedReductionNestedResultTests spinal.core.internals.TypedBalancedReductionOperatorReplayTests spinal.core.internals.TypedBalancedReductionClosedGraphTests'
          for scala in 2.12.18 2.13.12; do
            log="$out/tests-$scala.log"
            status=0
            "$out/sbt.sh" "$scala" \
              'morph/Test/compile' \
              "morph/Test/testOnly $suites" > "$log" 2>&1 || status=$?
            tail -n 500 "$log"
            test "$status" -eq 0
            grep -q 'All tests passed' "$log"
            ! grep -q '\*\*\* FAILED \*\*\*' "$log"
          done
          mkdir -p "$out/test-reports"
          find morphhdl/target -type f -name '*.xml' -exec cp {} "$out/test-reports/" \; 2>/dev/null || true
          sha256sum $(cat "$out/expected-files.txt") > "$out/source-sha256.txt"

      - name: Print exact failing test diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          failures = 0
          for report in sorted(Path("morphhdl/target").rglob("*.xml")):
              try:
                  root = ET.parse(report).getroot()
              except ET.ParseError:
                  continue
              suite = root.get("name", report.name)
              for case in root.iter("testcase"):
                  problem = case.find("failure")
                  kind = "failure"
                  if problem is None:
                      problem = case.find("error")
                      kind = "error"
                  if problem is None:
                      continue
                  failures += 1
                  print("=" * 96)
                  print(f"{kind.upper()}: {suite} :: {case.get('name', '<unnamed>')}")
                  message = problem.get("message", "")
                  if message:
                      print("MESSAGE:", message)
                  detail = (problem.text or "").strip()
                  if detail:
                      print(detail[:16000])
          print("=" * 96)
          print("Exact failing test cases:", failures)
          PY

      - name: Seal the read-only candidate
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-widening-captures"
          predecessor=$(cat "$out/predecessor.txt")
          git diff --check
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$predecessor"
          printf '%s\n' 'Development candidate qualified but intentionally not published.' \
            > "$out/candidate-not-published.txt"

      - name: Upload exact qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59i-widening-captures-${{ github.sha }}
          path: target/increment-59i-widening-captures
          if-no-files-found: error
          retention-days: 21

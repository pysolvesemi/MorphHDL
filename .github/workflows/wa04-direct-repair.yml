name: WA-04 direct bridge repair

on:
  push:
    branches:
      - agent/wa-04-unnamed-simple-wire-elimination
    paths:
      - ".github/workflows/wa04-direct-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bridge repair
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > /tmp/wa04-patch.py
          python3 /tmp/wa04-patch.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            morphhdl-passes/examples/UnnamedWireAliasNativeBridge.scala \
            morphhdl-passes/tests/formal_model/wire_assignment_ir/expected-signatures.json
          git commit -m "WA-04: repair witness bridge compilation and metadata gate"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Increment 47 source export

on:
  pull_request:
    branches:
      - parameterized-verilog
    paths:
      - .github/workflows/increment-47-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-47-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Package exact branch source
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='morphhdl-increment-47-source.tar.gz' \
            -czf morphhdl-increment-47-source.tar.gz .
          sha256sum morphhdl-increment-47-source.tar.gz \
            > morphhdl-increment-47-source.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: morphhdl-increment-47-source-${{ github.sha }}
          path: |
            morphhdl-increment-47-source.tar.gz
            morphhdl-increment-47-source.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

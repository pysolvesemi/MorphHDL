name: Increment 35 frontend regression fix

on:
  push:
    branches:
      - agent/increment-35-native-symbolic-memories

permissions:
  contents: write

concurrency:
  group: increment-35-frontend-regression-fix
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out increment branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-35-native-symbolic-memories
          fetch-depth: 0

      - name: Replace the stale derived-width rejection test
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          path = Path('frontend/src/test/scala/morphhdl/frontend/HdlIntTests.scala')
          text = path.read_text(encoding='utf-8')
          old = base64.b64decode('').decode('utf-8')
          new = base64.b64decode('').decode('utf-8')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale derived-width test, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0-mill.sh \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Validate the frontend suite on Scala 2.12 and 2.13
        shell: bash
        run: |
          /tmp/morphhdl-mill frontend[2.12.18].testOnly morphhdl.frontend.HdlIntTests
          /tmp/morphhdl-mill frontend[2.13.12].testOnly morphhdl.frontend.HdlIntTests

      - name: Commit the validated regression update
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/increment-35-frontend-regression-fix.yml
          git add -A
          git diff --cached --check
          git commit -m "Update derived symbolic width regression"
          git push origin HEAD:agent/increment-35-native-symbolic-memories

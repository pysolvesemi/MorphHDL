name: Increment 53e generic rebuild and formal closure v16

on:
  push:
    branches:
      - agent/increment-53b-local-enum-parameters

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: increment-53e-generic-rebuild-v16
  cancel-in-progress: true

jobs:
  rebuild-prove-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    timeout-minutes: 420
    env:
      SOURCE_BRANCH: agent/increment-53e-native-streamfifocc-parameterization
      FINAL_BRANCH: agent/increment-53e-generic-rebuild-final-v16
      TARGET_BRANCH: parameterized-verilog
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53b-local-enum-parameters
          fetch-depth: 0

      - name: Configure tools and fetch current source/target
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! command -v gh >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
            apt-get update
            apt-get install -y gh jq
          fi
          git fetch --prune origin "$TARGET_BRANCH" --tags
          target_sha=$(git rev-parse "origin/$TARGET_BRANCH")
          tag_sha=$(git rev-parse refs/tags/increment-53e-verified^{} 2>/dev/null || true)
          if [[ -n "$tag_sha" && "$tag_sha" == "$target_sha" ]] && \
             git show "origin/$TARGET_BRANCH:docs/morphhdl/parameterized-verilog-todo.md" | grep -Fq -- \
               '- [x] **Increment 53e — Native StreamFifoCC parameterization without source edits**'; then
            echo 'ALREADY_CLOSED=1' >> "$GITHUB_ENV"
            git switch -C "$FINAL_BRANCH" "origin/$TARGET_BRANCH"
          else
            echo 'ALREADY_CLOSED=0' >> "$GITHUB_ENV"
            git fetch origin "$SOURCE_BRANCH"
            git switch -C "$FINAL_BRANCH" "origin/$SOURCE_BRANCH"
          fi

      - name: Reconcile and materialize generic implementation
        if: env.ALREADY_CLOSED == '0'
        shell: bash
        run: |
          set -euo pipefail
          target="origin/$TARGET_BRANCH"
          if ! git merge --no-edit "$target"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ ${#conflicts[@]} -ne 1 || \
                  "${conflicts[0]}" != docs/morphhdl/parameterized-verilog-todo.md ]]; then
              printf 'Unexpected merge conflicts:\n%s\n' "${conflicts[*]}" >&2
              exit 1
            fi
            git checkout --theirs docs/morphhdl/parameterized-verilog-todo.md
            git add docs/morphhdl/parameterized-verilog-todo.md
            git commit --no-edit
          fi
          git checkout "$target" -- core/src/main lib/src/main idslplugin/src/main

          run_if_missing() {
            local sentinel=$1 file=$2 script=$3
            if ! grep -Fq "$sentinel" "$file"; then
              test -f "$script"
              python3 "$script"
            fi
          }
          run_if_missing \
            'private sealed trait MemoryAddressRole' \
            morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogMemories.scala \
            morphhdl/scripts/apply-increment-53e-address-role-repair.py
          run_if_missing \
            'def promoteImplicitPackedFormals' \
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogHierarchy.scala \
            morphhdl/scripts/apply-increment-53e-implicit-child-width-formals.py
          if grep -Fq '::$definitionName::$key' \
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogHierarchy.scala; then
            python3 morphhdl/scripts/apply-increment-53e-canonical-implicit-formal-identity.py
          fi
          run_if_missing \
            'def isProvenModularUIntUpdate' \
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala \
            morphhdl/scripts/apply-increment-53e-modular-literal-proof.py
          run_if_missing \
            'val materializedAutoResize' \
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedAutoResize.scala \
            morphhdl/scripts/apply-increment-53e-materialized-auto-resize-proof.py
          run_if_missing \
            'def adaptiveLiteralBinaryWidth' \
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala \
            morphhdl/scripts/apply-increment-53e-unfixed-literal-width-inference.py
          if [[ -f morphhdl/scripts/apply-increment-53e-generic-spinal-engine-v4.py ]]; then
            python3 morphhdl/scripts/apply-increment-53e-generic-spinal-engine-v4.py
          fi

          test -x morphhdl/scripts/check-generic-native-parameterization-engine.sh
          bash morphhdl/scripts/check-generic-native-parameterization-engine.sh
          git diff --check
          if git diff --name-only "$target" -- \
            core/src/main lib/src/main idslplugin/src/main | grep -q .; then
            echo 'Increment 53e changed native SpinalHDL production source.' >&2
            exit 1
          fi

      - name: Remove temporary materializers before proof
        if: env.ALREADY_CLOSED == '0'
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \
            -name 'increment-53e-*.yml' -delete
          find morphhdl/scripts -maxdepth 1 -type f \
            -name 'apply-increment-53e-*.py' -delete
          bash morphhdl/scripts/check-generic-native-parameterization-engine.sh
          grep -Fq -- \
            '- [x] **Increment 53e — Native StreamFifoCC parameterization without source edits**' \
            docs/morphhdl/parameterized-verilog-todo.md
          test -f morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedDomainEquivalence.scala
          test -f morphhdl/src/test/scala/spinal/core/internals/ExternalParameterizedDomainEquivalenceTests.scala
          test -f morphhdl/src/test/scala/morphhdl/ParameterizedStreamFifoCCTests.scala
          test -f morphhdl/src/test/scala/morphhdl/NativeStreamFifoCCImplementationProofTests.scala
          test -f morphhdl/src/test/scala/morphhdl/NativeStreamFifoCCFormalEquivalenceTests.scala
          test -f .github/workflows/morphhdl-native-streamfifocc-parameterization.yml
          test -f .github/workflows/morphhdl-native-streamfifocc-formal-equivalence.yml
          git diff --check

      - name: Install pinned build and formal toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill
          apt-get update
          apt-get install -y yosys iverilog verilator make python3 git curl jq
          if ! command -v sby >/dev/null 2>&1; then
            rm -rf /tmp/sby
            git clone --depth 1 https://github.com/YosysHQ/sby.git /tmp/sby
            make -C /tmp/sby install PREFIX=/usr/local
          fi
          if ! command -v yices-smt2 >/dev/null 2>&1; then
            if ! apt-get install -y yices2; then
              asset=$(curl --fail --silent --show-error \
                https://api.github.com/repos/SRI-CSL/yices2/releases/latest | \
                jq -r '.assets[] | select(.name | test("x86_64.*linux.*static.*tar.gz"; "i")) | .browser_download_url' | head -n1)
              [[ -n "$asset" && "$asset" != null ]]
              curl --fail --location --retry 5 "$asset" --output /tmp/yices.tar.gz
              rm -rf /tmp/yices && mkdir -p /tmp/yices
              tar -xzf /tmp/yices.tar.gz -C /tmp/yices --strip-components=1
              install -m 0755 /tmp/yices/bin/yices-smt2 /usr/local/bin/yices-smt2
            fi
          fi
          yosys -V
          sby -h >/dev/null
          yices-smt2 --version
          yosys -Q -p 'help abc' >/dev/null

      - name: Run generic domain and independent-clock proofs on both Scala lines
        shell: bash
        run: |
          set -euo pipefail
          suite=morphhdl/src/test/scala/morphhdl/NativeStreamFifoCCImplementationProofTests.scala
          while read -r variable; do
            case "$variable" in
              *WORKSPACE*)
                directory="/tmp/${variable,,}"
                mkdir -p "$directory"
                export "$variable=$directory"
                ;;
              *) export "$variable=1" ;;
            esac
          done < <(grep -oE 'MORPHDL_[A-Z0-9_]+' "$suite" | sort -u)
          for scala in 2.12.18 2.13.12; do
            /tmp/morphhdl-mill "morph[$scala].testOnly" \
              spinal.core.internals.ExternalParameterizedDomainEquivalenceTests \
              morphhdl.ParameterizedStreamFifoCCTests \
              morphhdl.NativeStreamFifoCCImplementationProofTests
          done

      - name: Run complete MorphHDL regressions on both Scala lines
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill 'morph[2.12.18].test'
          /tmp/morphhdl-mill 'morph[2.13.12].test'

      - name: Run native concrete-witness formal equivalence and mutation proof
        shell: bash
        run: |
          set -euo pipefail
          suite=morphhdl/src/test/scala/morphhdl/NativeStreamFifoCCFormalEquivalenceTests.scala
          while read -r variable; do
            case "$variable" in
              *WORKSPACE*)
                directory="/tmp/${variable,,}"
                mkdir -p "$directory"
                export "$variable=$directory"
                ;;
              *) export "$variable=1" ;;
            esac
          done < <(grep -oE 'MORPHDL_[A-Z0-9_]+' "$suite" | sort -u)
          /tmp/morphhdl-mill 'morph[2.12.18].testOnly' \
            morphhdl.NativeStreamFifoCCFormalEquivalenceTests
          /tmp/morphhdl-mill 'morph[2.13.12].testOnly' \
            morphhdl.NativeStreamFifoCCFormalEquivalenceTests

      - name: Commit, publish, merge exact proven tree, and tag
        if: env.ALREADY_CLOSED == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="origin/$TARGET_BRANCH"
          if git diff --name-only "$target" -- \
            core/src/main lib/src/main idslplugin/src/main | grep -q .; then
            echo 'Final proven tree changes native production source.' >&2
            exit 1
          fi
          mapfile -t changed < <(git diff --name-only "$target")
          for path in "${changed[@]}"; do
            case "$path" in
              morphplugin/*|morphruntime/*|morphhdl/*|frontend/*|docs/morphhdl/*|.github/workflows/morphhdl-*) ;;
              *) echo "Unexpected Increment 53e path: $path" >&2; exit 1 ;;
            esac
          done
          git add -A
          git diff --cached --check
          git commit -m 'Increment 53e: generic native StreamFifoCC parameterization'
          candidate_sha=$(git rev-parse HEAD)
          candidate_tree=$(git rev-parse HEAD^{tree})
          base_sha=$(git rev-parse "$target")
          git push --force-with-lease origin HEAD:"$FINAL_BRANCH"

          number=$(gh pr list --head "$FINAL_BRANCH" --base "$TARGET_BRANCH" \
            --state open --json number --jq '.[0].number // empty')
          if [[ -z "$number" ]]; then
            url=$(gh pr create \
              --head "$FINAL_BRANCH" --base "$TARGET_BRANCH" \
              --title 'Increment 53e: generic native StreamFifoCC parameterization' \
              --body-file - <<'EOF'
Parameterizes the exact untouched native `spinal.lib.StreamFifoCC`. Native SpinalHDL production sources remain unchanged and no alternate FIFO/CDC implementation is introduced.

The compiler/runtime/backend mechanism is generic across native SpinalHDL and uses typed compiler structure, exact graph identity, retained provenance, and exhaustive bounded-domain proof. Component names, signal names, source filenames, rendered expression text, and equal concrete witnesses are not proof or dispatch keys.

Before publication this exact tree passed both Scala lines, full MorphHDL regressions, independent-clock simulation/synthesis, depths 4/8/16, both buffered-reset modes, independently elaborated native witnesses, solver-backed sequential equivalence, and a mutation that must fail.
EOF
            )
            number=${url##*/}
          fi
          [[ $(gh pr view "$number" --json headRefOid --jq .headRefOid) == "$candidate_sha" ]]
          git fetch origin "$TARGET_BRANCH"
          [[ $(git rev-parse "origin/$TARGET_BRANCH") == "$base_sha" ]] || {
            echo 'Target advanced after self-contained proof; refusing stale merge.' >&2
            exit 1
          }
          gh pr merge "$number" --squash --delete-branch
          merge_sha=$(gh pr view "$number" --json mergedAt,mergeCommit \
            --jq 'select(.mergedAt != null) | .mergeCommit.oid')
          [[ -n "$merge_sha" ]]
          git fetch origin "$TARGET_BRANCH" --tags
          [[ $(git rev-parse "origin/$TARGET_BRANCH") == "$merge_sha" ]]
          [[ $(git rev-parse "$merge_sha^{tree}") == "$candidate_tree" ]]
          git tag -f -a increment-53e-verified "$merge_sha" \
            -m 'Increment 53e generic native StreamFifoCC parameterization verified'
          git push --force origin refs/tags/increment-53e-verified
          printf 'Increment 53e merged through PR #%s at %s\n' "$number" "$merge_sha"

      - name: Confirm already closed target
        if: env.ALREADY_CLOSED == '1'
        run: echo 'Increment 53e target and verification tag already agree.'

      - name: Upload all proof workspaces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53e-generic-rebuild-closure-v16
          path: |
            /tmp/morphhdl_*
            /tmp/MORPHDL_*
          if-no-files-found: ignore

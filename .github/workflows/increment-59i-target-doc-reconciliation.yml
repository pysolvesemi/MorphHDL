name: Increment 59i exact schema-21 target reconciliation

on:
  push:
    branches: [recovery/increment-59i-history-20260914]
    paths:
      - .github/workflows/increment-59i-target-doc-reconciliation.yml
      - .github/recovery/59i-target-doc-reconciliation/**

permissions:
  contents: read
  actions: read

concurrency:
  group: increment-59i-target-documentation-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
      EXPECTED_FEATURE: e98e9d034ab91a791377e212bc0e4b37d8c44716
      EXPECTED_TARGET: db54d01e5b21c7664f7a0de3795f061d77a3d259
      EXPECTED_ARTIFACT: 10925708881
      EXPECTED_ARTIFACT_DIGEST: 50f9214f575834217f59e33888d23795e4610ad8f504459966c7972db39ffd76
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 90eb789ab8a955ffd4d3ef6a4dff575350aff771
          path: qualified
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Authenticate live refs and original successful source artifact
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP:?}/59i-target-doc"
          mkdir -p "$evidence"
          test "$(git -C controller rev-parse HEAD)" = "$GITHUB_SHA"
          feature=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/agent/increment-59i-combined-reduction-closure" --jq .object.sha)
          target=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/parameterized-verilog" --jq .object.sha)
          recovery=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/recovery/increment-59i-history-20260914" --jq .object.sha)
          test "$feature" = "$EXPECTED_FEATURE"
          test "$target" = "$EXPECTED_TARGET"
          test "$recovery" = "$GITHUB_SHA"
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/177")
          test "$(jq -r .state <<<"$pr")" = open
          test "$(jq -r .draft <<<"$pr")" = true
          test "$(jq -r .merged <<<"$pr")" = false
          test "$(jq -r .head.sha <<<"$pr")" = "$EXPECTED_FEATURE"
          test "$(jq -r .base.ref <<<"$pr")" = parameterized-verilog
          test "$(jq -r .base.sha <<<"$pr")" = "$EXPECTED_TARGET"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/36289367772")
          test "$(jq -r .status <<<"$run")" = completed
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_sha <<<"$run")" = 2273acb47960d83a4f0e4d708bd6a7fd2a231a6b
          test "$(jq -r .path <<<"$run")" = .github/workflows/increment-59i-runtime-successor-source.yml
          test "$(jq -r .run_attempt <<<"$run")" = 1
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT")
          test "$(jq -r .workflow_run.id <<<"$artifact")" = 36289367772
          test "$(jq -r .workflow_run.head_sha <<<"$artifact")" = 2273acb47960d83a4f0e4d708bd6a7fd2a231a6b
          test "$(jq -r .digest <<<"$artifact")" = "sha256:$EXPECTED_ARTIFACT_DIGEST"
          test "$(jq -r .expired <<<"$artifact")" = false
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT/zip" > "$evidence/source.zip"
          test "$(sha256sum "$evidence/source.zip" | cut -d' ' -f1)" = "$EXPECTED_ARTIFACT_DIGEST"
          printf 'feature=%s\ntarget=%s\nrecovery=%s\n' "$feature" "$target" "$recovery" > "$evidence/current-live-refs.txt"
      - name: Run rejection controls and exact current-target audit
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP:?}/59i-target-doc"
          export SOURCE_ARTIFACT="$evidence/source.zip"
          python3 -B controller/.github/recovery/59i-target-doc-reconciliation/test_audit.py \
            2>&1 | tee "$evidence/unit-tests.log"
          python3 -B controller/.github/recovery/59i-target-doc-reconciliation/audit.py \
            --repo "$GITHUB_WORKSPACE/qualified" \
            --artifact "$evidence/source.zip" \
            --output "$evidence/reconciliation.json" \
            2>&1 | tee "$evidence/audit.log"
          git -C qualified diff --exit-code
          git -C qualified diff --cached --exit-code
          test -z "$(git -C qualified status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-59i-schema21-target-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/59i-target-doc/
          if-no-files-found: error
          retention-days: 30

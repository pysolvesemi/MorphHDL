name: Increment 59i exact schema-15 target reconciliation

on:
  push:
    branches: [recovery/increment-59i-history-20260914]
    paths:
      - .github/workflows/increment-59i-target-doc-reconciliation.yml
      - .github/recovery/59i-target-doc-reconciliation/**

permissions:
  contents: read
  actions: read

concurrency:
  group: increment-59i-target-documentation-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
      EXPECTED_FEATURE: c654f43c24d86ca99c056dd4cb74b7a18d9f41e3
      EXPECTED_TARGET: 09880c538c4cf83022f4a1bb1dd16b43ea81a751
      EXPECTED_ARTIFACT: 10778797876
      EXPECTED_ARTIFACT_DIGEST: 57be92bb60064434df805f39718aedfc52224a8056aff3b95940dcfa4612b5a5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c48bad51b9857570e65fbd7c1be5dec465a3e8fa
          path: qualified
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Authenticate live refs and original successful source artifact
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP:?}/59i-target-doc"
          mkdir -p "$evidence"
          test "$(git -C controller rev-parse HEAD)" = "$GITHUB_SHA"
          feature=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/agent/increment-59i-combined-reduction-closure" --jq .object.sha)
          target=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/parameterized-verilog" --jq .object.sha)
          test "$feature" = "$EXPECTED_FEATURE"
          test "$target" = "$EXPECTED_TARGET"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/35896802730")
          test "$(jq -r .status <<<"$run")" = completed
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_sha <<<"$run")" = 2714f1d151cf4a649a706017ba7772309b2d127b
          test "$(jq -r .path <<<"$run")" = .github/workflows/increment-59i-runtime-successor-source.yml
          test "$(jq -r .run_attempt <<<"$run")" = 1
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT")
          test "$(jq -r .workflow_run.id <<<"$artifact")" = 35896802730
          test "$(jq -r .workflow_run.head_sha <<<"$artifact")" = 2714f1d151cf4a649a706017ba7772309b2d127b
          test "$(jq -r .digest <<<"$artifact")" = "sha256:$EXPECTED_ARTIFACT_DIGEST"
          test "$(jq -r .expired <<<"$artifact")" = false
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT/zip" > "$evidence/source.zip"
          test "$(sha256sum "$evidence/source.zip" | cut -d' ' -f1)" = "$EXPECTED_ARTIFACT_DIGEST"
          printf 'feature=%s\ntarget=%s\n' "$feature" "$target" > "$evidence/current-live-refs.txt"
      - name: Run rejection controls and exact current-target audit
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP:?}/59i-target-doc"
          export SOURCE_ARTIFACT="$evidence/source.zip"
          python3 -B controller/.github/recovery/59i-target-doc-reconciliation/test_audit.py \
            2>&1 | tee "$evidence/unit-tests.log"
          python3 -B controller/.github/recovery/59i-target-doc-reconciliation/audit.py \
            --repo "$GITHUB_WORKSPACE/qualified" \
            --artifact "$evidence/source.zip" \
            --output "$evidence/reconciliation.json" \
            2>&1 | tee "$evidence/audit.log"
          git -C qualified diff --exit-code
          git -C qualified diff --cached --exit-code
          test -z "$(git -C qualified status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-59i-schema15-target-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/59i-target-doc/
          if-no-files-found: error
          retention-days: 30

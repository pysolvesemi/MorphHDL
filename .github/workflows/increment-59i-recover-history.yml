name: Increment 59i recovery bundle

on:
  push:
    branches: [recovery/increment-59i-history-20260914]
    paths: [.github/workflows/increment-59i-recover-history.yml]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Recover exact archived seal with full history
        uses: actions/checkout@v4
        with:
          ref: 7fa6daa6f22db7b3d459130a5021b5cc905de49d
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Verify checkpoint identities and package Git objects
        shell: bash
        run: |
          set -euo pipefail
          export RECOVERY_PAYLOAD="$RUNNER_TEMP/59i-recovery"
          echo "RECOVERY_PAYLOAD=$RECOVERY_PAYLOAD" >> "$GITHUB_ENV"
          mkdir -p "$RECOVERY_PAYLOAD"
          test "$(git rev-parse HEAD)" = 7fa6daa6f22db7b3d459130a5021b5cc905de49d
          test "$(git rev-parse HEAD^{tree})" = e501c7356ba43c194d9a1de88399f309e6253a80
          test "$(git rev-parse HEAD^)" = bdfa5e06f0310cc9dcc64c42dc80a2f61c2475e9
          test "$(git rev-parse HEAD^^)" = 954d9b2763b064dba60af71ad8fa509a9d7cada8
          git diff --exit-code
          git diff --cached --exit-code
          git update-ref refs/heads/recovery-59i-sealed-checkpoint HEAD
          git update-ref refs/heads/recovery-59i-target-snapshot 3b547ae5622ae212c17f6e67cc96924127a46a41
          git show-ref > "$RECOVERY_PAYLOAD/refs.txt"
          git cat-file commit HEAD > "$RECOVERY_PAYLOAD/seal-commit.txt"
          git cat-file commit HEAD^ > "$RECOVERY_PAYLOAD/source-commit.txt"
          git ls-tree -r HEAD > "$RECOVERY_PAYLOAD/sealed-tree.txt"
          git submodule status --recursive > "$RECOVERY_PAYLOAD/submodules.txt"
          git bundle create "$RECOVERY_PAYLOAD/MorphHDL.bundle" --all
          git bundle verify "$RECOVERY_PAYLOAD/MorphHDL.bundle" > "$RECOVERY_PAYLOAD/bundle-verification.txt" 2>&1
          git submodule foreach --recursive 'git bundle create "$RECOVERY_PAYLOAD/submodule-$(printf %s "$displaypath" | sha256sum | cut -c1-16).bundle" --all HEAD'
          (cd "$RECOVERY_PAYLOAD" && sha256sum *.bundle > SHA256SUMS)
      - name: Run unchanged live successor verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 -B morphhdl/scripts/check-increment-59i-production-successor.py 2>&1 | tee "$RECOVERY_PAYLOAD/unchanged-successor-verification.log"
      - name: Preserve recovery archive even when a source gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59i-full-history-7fa6daa6
          path: ${{ runner.temp }}/59i-recovery
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

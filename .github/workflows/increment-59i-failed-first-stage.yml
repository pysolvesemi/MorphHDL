name: Increment 59i reviewed failed-first repair staging

on:
  push:
    branches: [recovery/increment-59i-history-20260914]
    paths:
      - .github/workflows/increment-59i-failed-first-stage.yml
      - .github/recovery/59i-failed-first-v2/**

# Immutable object staging and dispatch only; the connector publishes refs.
permissions:
  contents: write
  actions: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Restore exact sealed candidate and execute source preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PAYLOAD="$GITHUB_WORKSPACE/.github/recovery/59i-failed-first-v2"
          export BUNDLE="$RUNNER_TEMP/59i-failed-first.bundle"
          python3 - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          root = Path(os.environ['PAYLOAD'])
          names = ['part-01.b64', 'part-02.b64', 'part-03-0.b64', 'part-03-1.b64', 'part-03-2.b64', 'part-04.b64']
          raw = base64.b64decode(b''.join((root / name).read_bytes() for name in names), validate=True)
          assert hashlib.sha256(raw).hexdigest() == '2e5c4a7d11dcb55436985b267fd4c5044fd85f10812eb7d5a9807379025a13bb'
          Path(os.environ['BUNDLE']).write_bytes(raw)
          PY
          mkdir -p "$RUNNER_TEMP/59i-failed-first-evidence"
          python3 -B "$PAYLOAD/stage.py" prepare \
            --repository "$GITHUB_WORKSPACE" \
            --destination "$RUNNER_TEMP/59i-failed-first-source" \
            --output "$RUNNER_TEMP/59i-failed-first-evidence" --bundle "$BUNDLE" \
            2>&1 | tee "$RUNNER_TEMP/59i-failed-first-evidence/prepare.log"
      - name: Retain exact connector tree requests
        uses: actions/upload-artifact@v4
        with:
          name: increment-59i-failed-first-trees-ddf61ef2-${{ github.run_attempt }}
          path: ${{ runner.temp }}/59i-failed-first-evidence
          if-no-files-found: error
          retention-days: 21
      - name: Verify published objects and dispatch only five previously failed workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B .github/recovery/59i-failed-first-v2/stage.py publish \
            --repository "$GITHUB_WORKSPACE" \
            --destination "$RUNNER_TEMP/59i-failed-first-source" \
            --output "$RUNNER_TEMP/59i-failed-first-evidence" \
            --bundle "$RUNNER_TEMP/59i-failed-first.bundle" \
            2>&1 | tee "$RUNNER_TEMP/59i-failed-first-evidence/publication.log"
      - name: Retain every source and dispatch result, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59i-failed-first-staged-ddf61ef2-${{ github.run_attempt }}
          path: ${{ runner.temp }}/59i-failed-first-evidence
          if-no-files-found: error
          retention-days: 21

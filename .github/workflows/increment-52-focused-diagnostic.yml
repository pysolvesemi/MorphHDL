name: Increment 52 focused diagnostic

on:
  push:
    branches:
      - agent/increment-52-post-merge-diagnostic
    paths:
      - .github/workflows/increment-52-focused-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnostic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-52-post-merge-diagnostic
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Run focused contracts and publish result
        shell: bash
        run: |
          set +e
          : > /tmp/increment52-focused.log
          bash morphhdl/scripts/check-native-int-nested-control-flow-boundary.sh \
            >> /tmp/increment52-focused.log 2>&1
          status=$?
          for scala_version in 2.12.18 2.13.12; do
            if [ "$status" -eq 0 ]; then
              /tmp/morphhdl-mill frontend[$scala_version].testOnly \
                morphhdl.frontend.HdlIntTests \
                >> /tmp/increment52-focused.log 2>&1
              status=$?
            fi
            if [ "$status" -eq 0 ]; then
              /tmp/morphhdl-mill morph[$scala_version].testOnly \
                morphhdl.NativeIntNestedSymbolicControlFlowTests \
                morphhdl.NativeIntSymbolicConditionalTests \
                morphhdl.NaturalSymbolicConditionalTests \
                >> /tmp/increment52-focused.log 2>&1
              status=$?
            fi
          done

          {
            echo "status=$status"
            echo "head=$(git rev-parse HEAD)"
            echo "--- last 300 lines ---"
            tail -n 300 /tmp/increment52-focused.log
          } > .github/increment-52-focused-diagnostic.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/increment-52-focused-diagnostic.txt
          git commit -m "Record Increment 52 focused diagnostic status $status"
          git push origin HEAD:agent/increment-52-post-merge-diagnostic
          exit 0

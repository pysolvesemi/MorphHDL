name: Bisect Increment 53d compound-depth regression

on:
  push:
    branches:
      - agent/increment-53d-native-streamwidth-adapter
    paths:
      - .github/workflows/increment-53d-full-suite-diagnostic.yml

permissions:
  contents: read

jobs:
  bisect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out complete Increment 53d history
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-native-streamwidth-adapter
          fetch-depth: 0

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Bisect the focused compound-depth contract
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/increment-53d-bisect-test.sh <<'SH'
          #!/usr/bin/env bash
          set +e
          sha=$(git rev-parse --short=12 HEAD)
          log="/tmp/increment-53d-bisect-${sha}.log"
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.ParameterizedStreamFifoDepthTests \
            >"$log" 2>&1
          status=$?
          echo "===== BISECT $sha STATUS $status ====="
          grep -E "compound bounded depth|TEST FAILED|tests failed|STRUCTURAL-CONTINUOUS-ASSIGNMENT-DOMINANCE|\[error\]" \
            "$log" | tail -n 80 || true
          exit "$status"
          SH
          chmod +x /tmp/increment-53d-bisect-test.sh

          good=$(git merge-base HEAD origin/parameterized-verilog)
          echo "BISECT_GOOD=$good"
          echo "BISECT_BAD=$(git rev-parse HEAD)"
          git bisect start HEAD "$good"
          set +e
          git bisect run /tmp/increment-53d-bisect-test.sh
          result=$?
          set -e
          echo "===== BISECT RESULT ====="
          git status --short --branch
          git bisect log
          culprit=$(git rev-parse HEAD)
          echo "BISECT_CULPRIT=$culprit"
          git show --stat --oneline --decorate --no-renames "$culprit"
          git show --format=fuller --no-ext-diff --no-renames "$culprit" -- \
            frontend/src/main/scala/morphhdl/frontend/NativeIntShadow.scala \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala \
            morphruntime/src/main/scala/spinal/core/ExternalNativeIntCompilerRuntime.scala \
            morphruntime/src/main/scala/spinal/core/ExternalNativeIntShadowRegistry.scala \
            morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala \
            | tail -n 1000
          git bisect reset
          exit "$result"

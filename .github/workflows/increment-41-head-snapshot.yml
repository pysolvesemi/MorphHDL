name: Increment 41 declaration-boundary repair

on:
  pull_request:
    branches:
      - parameterized-verilog
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/increment-41-head-snapshot.yml

permissions:
  contents: write

concurrency:
  group: increment-41-declaration-boundary-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/increment-41-external-expression-hierarchy'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact Increment 41 branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-41-external-expression-hierarchy
          fetch-depth: 0

      - name: Apply declaration-boundary repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala")
          text = path.read_text()

          old = '''    val rewrittenDeclarations = withHierarchy
                .split("\\\\n", -1)
                .map(line => rewriteDeclarationLine(line, widthsByName))
                .mkString("\\n")
              canonicalizeDeclarations(component, rewrittenDeclarations)
          '''
          new = '''    val rewrittenDeclarations = withHierarchy
                .split("\\\\n", -1)
                .map(line => rewriteDeclarationLine(line, widthsByName))
                .mkString("\\n")
              if (isCanonicalDirectSurface(component))
                canonicalizeDeclarations(component, rewrittenDeclarations)
              else rewrittenDeclarations
          '''
          if text.count(old) != 1:
              raise RuntimeError(f"expected one unconditional canonicalization call, found {text.count(old)}")
          text = text.replace(old, new, 1)

          marker = '''  private def canonicalizeDeclarations(
          '''
          predicate = '''  /**
                * Preserve the declaration canonicalization contract of the original
                * direct-assignment bridge without reordering ordinary native expression,
                * process, hierarchy or library output. The direct surface contains only
                * whole-leaf assignments (and at most its native unconditional register
                * path); every richer graph must retain the native emitter's declaration
                * order so a concrete witness remains byte-identical after concretization.
                */
              private def isCanonicalDirectSurface(component: Component): Boolean = {
                val assignments = ArrayBuffer.empty[DataAssignmentStatement]
                var unsupported =
                  component.children.nonEmpty ||
                    ParameterizedMemory.parametersOf(component).nonEmpty ||
                    ParameterizedProcess.parametersOf(component).nonEmpty ||
                    ParameterizedStructure.parametersOf(component).nonEmpty

                component.dslBody.walkLeafStatements {
                  case _: BaseType =>
                  case assignment: DataAssignmentStatement => assignments += assignment
                  case _ => unsupported = true
                }
                component.dslBody.walkStatements {
                  case _: TreeStatement => unsupported = true
                  case _                =>
                }

                !unsupported && assignments.nonEmpty && assignments.forall { assignment =>
                  (assignment.target, assignment.source) match {
                    case (target: BaseType, _: BaseType) =>
                      assignment.finalTarget == target &&
                        assignment.parentScope == target.rootScopeStatement
                    case _ => false
                  }
                }
              }

          '''
          if text.count(marker) != 1:
              raise RuntimeError(f"expected one declaration canonicalizer, found {text.count(marker)}")
          text = text.replace(marker, predicate + marker, 1)

          old = '''    result.mkString("\\\\n")
          '''
          new = '''    val normalized =
                if (
                  portEnd + 2 < result.size &&
                  result(portEnd + 1).trim.isEmpty &&
                  result(portEnd + 2).trim.isEmpty
                ) result.patch(portEnd + 1, Nil, 1)
                else result
              normalized.mkString("\\n")
          '''
          if text.count(old) != 1:
              raise RuntimeError(f"expected one malformed module reassembly, found {text.count(old)}")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala

      - name: Run focused dual-Scala regressions in the project container
        shell: bash
        run: |
          set -euo pipefail
          rm -rf increment-41-diagnostics
          mkdir -p increment-41-diagnostics
          docker run --rm \
            --entrypoint bash \
            -v "$PWD:/work" \
            -w /work \
            -e XDG_CACHE_HOME=/tmp/morphhdl-cache \
            ghcr.io/spinalhdl/docker:latest \
            -lc '
              set -euo pipefail
              curl --fail --location --retry 3 \
                https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0-mill.sh \
                --output /tmp/morphhdl-mill
              chmod +x /tmp/morphhdl-mill
              for scala_version in 2.12.18 2.13.12; do
                /tmp/morphhdl-mill frontend[$scala_version].testOnly \
                  morphhdl.frontend.HdlIntTests
                /tmp/morphhdl-mill morph[$scala_version].testOnly \
                  spinal.core.internals.ParameterizedVerilogTests \
                  spinal.core.internals.ParameterizedDataShapeTests \
                  morphhdl.MorphSingleSourceVerilogTests \
                  morphhdl.StructuralGenerateControlTests \
                  morphhdl.HierarchyParameterBindingTests \
                  morphhdl.GenericExpressionAndStreamTests \
                  morphhdl.GenericProcessLoweringTests \
                  morphhdl.NativeLibraryReuseTests \
                  morphhdl.NativeSymbolicMemoryTests
                /tmp/morphhdl-mill core[$scala_version].testOnly \
                  spinal.core.internals.SpinalVerilogPhasePlanTests
              done
            ' 2>&1 | tee increment-41-diagnostics/focused-dual-scala.log

      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-41-declaration-boundary-diagnostics
          path: increment-41-diagnostics
          if-no-files-found: error
          retention-days: 1

      - name: Commit validated repair and remove temporary controllers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf increment-41-diagnostics
          rm -f \
            .github/workflows/increment-41-head-snapshot.yml \
            .github/workflows/increment-41-repair.yml \
            .github/workflows/increment-41-repair-v2.yml
          git config user.name pysolvesemi
          git config user.email pysolvesemi@gmail.com
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Fix Increment 41 declaration lowering boundary"
          git push origin HEAD:agent/increment-41-external-expression-hierarchy

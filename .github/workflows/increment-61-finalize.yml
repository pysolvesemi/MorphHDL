name: Increment 61 self-contained finalization

on:
  push:
    branches: ['agent/increment-61-one-file-per-component']
    paths: ['.github/workflows/increment-61-finalize.yml']
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: increment-61-self-contained-finalization
  cancel-in-progress: false

jobs:
  prepare:
    name: Seal exact candidate source
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      head: ${{ steps.publish.outputs.head }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Cancel superseded branch orchestration runs
        shell: bash
        run: |
          set -euo pipefail
          branch='agent/increment-61-one-file-per-component'
          current="$GITHUB_RUN_ID"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?branch=$branch&per_page=100" \
            --jq '.workflow_runs[] | select((.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending") and (.id|tostring) != env.GITHUB_RUN_ID) | .id' \
            | while read -r run; do
                test -n "$run" || continue
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/cancel" >/dev/null 2>&1 || true
              done

      - name: Compose exact Increment 61 review with sealed predecessor audits
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-finalize-source
          mkdir -p "$output"
          git rev-parse HEAD > "$output/staging-head.txt"
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path

          contract_path = Path('morphhdl/contracts/increment-61-source-review.json')
          checker_path = Path('morphhdl/scripts/check-increment-61-source-review.py')
          overlay_path = Path('morphhdl/scripts/check-typed-native-source-overlay.py')
          workflow_paths = {
              '.github/workflows/increment-61-resume-audit-composition.yml',
              '.github/workflows/increment-61-full-compatibility.yml',
              '.github/workflows/increment-61-protected-completion.yml',
              '.github/workflows/increment-61-finalize.yml',
          }
          wrapper = '''#!/usr/bin/env python3
          """Compose Increment 61 exact review with the sealed predecessor overlay audit."""
          from __future__ import annotations

          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          REVIEW = ROOT / "morphhdl/scripts/check-increment-61-source-review.py"
          HISTORICAL = "morphhdl/scripts/check-typed-native-source-overlay.py"


          def main() -> None:
              subprocess.run([sys.executable, str(REVIEW)], cwd=ROOT, check=True)
              base = subprocess.check_output(
                  [sys.executable, str(REVIEW), "--print-base"], cwd=ROOT, text=True
              ).strip()
              with tempfile.TemporaryDirectory(prefix="morphhdl-increment-61-overlay-") as temporary:
                  worktree = Path(temporary) / "predecessor"
                  subprocess.run(
                      ["git", "worktree", "add", "--detach", str(worktree), base],
                      cwd=ROOT,
                      check=True,
                      stdout=subprocess.DEVNULL,
                  )
                  try:
                      subprocess.run(
                          [sys.executable, str(worktree / HISTORICAL)],
                          cwd=worktree,
                          check=True,
                      )
                  finally:
                      subprocess.run(
                          ["git", "worktree", "remove", "--force", str(worktree)],
                          cwd=ROOT,
                          check=True,
                          stdout=subprocess.DEVNULL,
                      )
              print("Increment 61 exact source and sealed predecessor typed-overlay audits PASS")


          if __name__ == "__main__":
              main()
          '''
          wrapper = '\n'.join(line[10:] if line.startswith('          ') else line for line in wrapper.splitlines()) + '\n'

          contract = json.loads(contract_path.read_text())
          assert contract['schema'] == 1 and contract['increment'] == '61'
          base = contract['base_commit']
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          sha = lambda data: hashlib.sha256(data).hexdigest()

          overlay_path.write_text(wrapper)
          overlay_path.chmod(0o755)
          before = subprocess.check_output(['git', 'show', f'{base}:{overlay_path.as_posix()}'])
          reviewed = [entry for entry in contract['reviewed_files'] if entry['path'] != overlay_path.as_posix()]
          reviewed.append({
              'after_sha256': sha(overlay_path.read_bytes()),
              'before_sha256': sha(before),
              'mode': '100755',
              'path': overlay_path.as_posix(),
              'status': 'modified',
          })
          contract['reviewed_files'] = sorted(reviewed, key=lambda entry: entry['path'])
          audit = set(contract['audit_paths']) | workflow_paths
          audit.discard(overlay_path.as_posix())
          contract['audit_paths'] = sorted(audit)
          contract_path.write_text(json.dumps(contract, indent=2, sort_keys=False) + '\n')

          checker = checker_path.read_text()
          updated, count = re.subn(
              r'CONTRACT_SHA256 = "[0-9a-f]{64}"',
              f'CONTRACT_SHA256 = "{sha(contract_path.read_bytes())}"',
              checker,
              count=1,
          )
          assert count == 1
          checker_path.write_text(updated)
          PY
          chmod +x morphhdl/scripts/check-typed-native-source-overlay.py
          git add \
            morphhdl/contracts/increment-61-source-review.json \
            morphhdl/scripts/check-increment-61-source-review.py \
            morphhdl/scripts/check-typed-native-source-overlay.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit \
              -m '61: seal self-contained final qualification' \
              -m 'Authenticate the finalizer and compose the complete current Increment 61 review with unchanged historical audits at the exact pre-Increment-61 source. No production behavior changes.'
          fi
          python3 morphhdl/scripts/check-increment-61-source-review.py | tee "$output/source-review.log"
          python3 morphhdl/scripts/check-increment-61-source-review.py --self-test | tee "$output/source-review-self-test.log"
          python3 morphhdl/scripts/check-typed-native-source-overlay.py | tee "$output/overlay-composition.log"
          python3 morphhdl/scripts/check-native-source-preservation.py | tee "$output/native-source.log"
          base=$(python3 morphhdl/scripts/check-increment-61-source-review.py --print-base)
          predecessor="$output/predecessor"
          git worktree add --detach "$predecessor" "$base"
          trap 'git worktree remove --force "$predecessor"' EXIT
          (
            cd "$predecessor"
            python3 morphhdl/scripts/check-increment-60g-source-scope.py
            python3 morphhdl/scripts/check-increment-60g-source-scope.py --self-test
            python3 morphhdl/scripts/check-increment-60f-equivalence-closure.py --source-only
            python3 morphhdl/scripts/check-increment-58-retirement.py
            python3 morphhdl/scripts/check-production-retirement.py
          ) | tee "$output/predecessor-audits.log"

      - name: Publish exact candidate source
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-finalize-source
          original=$(cat "$output/staging-head.txt")
          remote=$(git ls-remote origin refs/heads/agent/increment-61-one-file-per-component | cut -f1)
          test "$remote" = "$original"
          if test "$(git rev-parse HEAD)" != "$original"; then
            git push origin HEAD:refs/heads/agent/increment-61-one-file-per-component
          fi
          head=$(git rev-parse HEAD)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "$head" > "$output/head.txt"
          git rev-parse 'HEAD^{tree}' > "$output/tree.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-61-finalize-source-${{ github.run_id }}
          path: target/increment-61-finalize-source
          if-no-files-found: error
          retention-days: 30

  qualify:
    needs: prepare
    name: Candidate complete qualification Scala ${{ matrix.scala }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        scala: ['2.12.18', '2.13.12']
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      SCALA_VERSION: ${{ matrix.scala }}
      SBT_TEST_PARALLEL: '0'
      JAVA_TOOL_OPTIONS: '-Xmx6G -XX:ActiveProcessorCount=4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify exact candidate identity and complete source contracts
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-finalize
          mkdir -p "$output"
          test "$(git rev-parse HEAD)" = '${{ needs.prepare.outputs.head }}'
          git rev-parse HEAD > "$output/head.txt"
          for tool in python3 iverilog vvp verilator yosys; do command -v "$tool"; done
          python3 morphhdl/scripts/check-increment-61-source-review.py > "$output/source-review.log"
          python3 morphhdl/scripts/check-typed-native-source-overlay.py > "$output/overlay-review.log"
          python3 morphhdl/scripts/check-native-source-preservation.py > "$output/native-review.log"

      - name: Run complete MorphHDL regression
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-finalize
          sbt -batch "++$SCALA_VERSION" 'morph/Test/test' \
            > "$output/full-test.log" 2>&1 || { tail -n 500 "$output/full-test.log"; exit 1; }
          python3 - "$output/full-test-counts.json" <<'PY'
          from pathlib import Path
          import json, sys
          import xml.etree.ElementTree as ET
          reports = sorted(Path('morphhdl/target').rglob('TEST-*.xml'))
          assert reports, 'no test reports found'
          value = {'report_files': len(reports), 'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          for report in reports:
              root = ET.parse(report).getroot()
              for key in ('tests', 'failures', 'errors', 'skipped'):
                  value[key] += int(float(root.get(key, '0')))
          assert value['tests'] > 0 and value['failures'] == value['errors'] == value['skipped'] == 0, value
          open(sys.argv[1], 'w').write(json.dumps(value, indent=2) + '\n')
          print(value)
          PY

      - name: Generate and qualify split and consolidated Increment 61 artifacts
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-finalize
          sbt -batch "++$SCALA_VERSION" \
            'morph/Test/testOnly morphhdl.Increment61PerComponentPublicationTests' \
            "morph/Test/runMain morphhdl.Increment61PerComponentPublicationArtifacts $output/generated-a" \
            "morph/Test/runMain morphhdl.Increment61PerComponentPublicationArtifacts $output/generated-b" \
            > "$output/increment-61.log" 2>&1 || { tail -n 350 "$output/increment-61.log"; exit 1; }
          diff -ru "$output/generated-a" "$output/generated-b" > "$output/fresh-generation.diff"
          split="$output/generated-a/split"
          combined="$output/generated-a/consolidated/Increment61Top.v"
          files=("$split/Increment61Leaf.v" "$split/Increment61Top.v")
          test "$(cat "$split/Increment61Top.lst")" = $'Increment61Leaf.v\nIncrement61Top.v'
          iverilog -g2001 -s Increment61Top -o "$output/split.vvp" "${files[@]}"
          iverilog -g2001 -s Increment61Top -o "$output/combined.vvp" "$combined"
          verilator --lint-only --language 1364-2001 --top-module Increment61Top "${files[@]}"
          verilator --lint-only --language 1364-2001 --top-module Increment61Top "$combined"
          yosys -q -p "read_verilog -noautowire ${files[*]}; hierarchy -check -top Increment61Top; proc; memory; flatten; opt; check -assert; stat" > "$output/split-yosys.log"
          yosys -q -p "read_verilog -noautowire $combined; hierarchy -check -top Increment61Top; proc; memory; flatten; opt; check -assert; stat" > "$output/combined-yosys.log"
          for widths in '1 1' '5 5' '7 13' '32 3'; do
            read -r left right <<<"$widths"
            work="$output/equiv-${left}-${right}"
            cat > "$work.ys" <<YOSYS
          read_verilog -noautowire ${files[*]}
          chparam -set LEFT_WIDTH $left -set RIGHT_WIDTH $right Increment61Top
          hierarchy -check -top Increment61Top
          proc
          memory
          flatten
          opt
          rename Increment61Top gold
          design -stash gold
          design -reset
          read_verilog -noautowire $combined
          chparam -set LEFT_WIDTH $left -set RIGHT_WIDTH $right Increment61Top
          hierarchy -check -top Increment61Top
          proc
          memory
          flatten
          opt
          rename Increment61Top gate
          design -stash gate
          design -reset
          design -copy-from gold -as gold gold
          design -copy-from gate -as gate gate
          equiv_make gold gate equiv
          prep -top equiv
          equiv_simple
          equiv_status -assert
          YOSYS
            yosys -q -s "$work.ys" > "$work.log"
          done
          if iverilog -g2001 -s Increment61Top -o /dev/null "$split/Increment61Top.v" > "$output/missing.log" 2>&1; then
            echo 'missing child unexpectedly compiled' >&2; exit 1
          fi
          cat "$split/Increment61Leaf.v" "$split/Increment61Leaf.v" > "$output/duplicate-leaf.v"
          if iverilog -g2001 -s Increment61Top -o /dev/null "$output/duplicate-leaf.v" "$split/Increment61Top.v" > "$output/duplicate.log" 2>&1; then
            echo 'duplicate child unexpectedly compiled' >&2; exit 1
          fi
          python3 - "$split" "$output" <<'PY'
          from pathlib import Path
          import re, shutil, sys
          split, output = map(Path, sys.argv[1:])
          expected = {'Increment61Leaf.v': 'Increment61Leaf', 'Increment61Top.v': 'Increment61Top'}
          pattern = re.compile(r'(?m)^\s*module\s+([A-Za-z_][A-Za-z0-9_$]*)\b')
          def check(root):
              for name, module in expected.items():
                  found = pattern.findall((root / name).read_text())
                  if found != [module]: raise RuntimeError((name, module, found))
          check(split)
          wrong = output / 'wrong-file'
          wrong.mkdir()
          shutil.copyfile(split / 'Increment61Leaf.v', wrong / 'Increment61Top.v')
          shutil.copyfile(split / 'Increment61Top.v', wrong / 'Increment61Leaf.v')
          try: check(wrong)
          except RuntimeError as error: (output / 'wrong-file.log').write_text(str(error) + '\n')
          else: raise RuntimeError('wrong-file mutation was not detected')
          PY

      - name: Run inherited 60d signedness qualification
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-finalize/60d
          mkdir -p "$output/a/baseline" "$output/b/baseline"
          sbt -batch "++$SCALA_VERSION" \
            'morph/Test/testOnly spinal.core.internals.PureSIntCastTests spinal.core.internals.SignedDeclarationPublicationTests spinal.core.internals.TypedSignednessAuthorityTests spinal.core.internals.TypedSignednessResumeTests morphhdl.MorphSingleSourceVerilogTests morphhdl.MorphCanonicalIrHandoffTests morphhdl.TypedBlackBoxGenericBindingTests' \
            "morph/Test/runMain nativeapplication.PureSIntCastArtifactWriter $output/a" \
            "morph/Test/runMain nativeapplication.PureSIntCastArtifactWriter $output/b" \
            > "$output/sbt.log" 2>&1 || { tail -n 350 "$output/sbt.log"; exit 1; }
          diff -ru "$output/a" "$output/b" > "$output/determinism.diff"
          python3 morphhdl/scripts/check-increment-60f-equivalence-closure.py --skip-source --inherited-track 60d "$output/a" \
            > "$output/proof.log" 2>&1 || { tail -n 300 "$output/proof.log"; exit 1; }

      - name: Run inherited 60g default signed-Verilog qualification
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-finalize/60g
          mkdir -p "$output/inherited/pure/baseline"
          sbt -batch "++$SCALA_VERSION" \
            "morph/Test/runMain spinal.core.SignednessBoundaryArtifactWriter $output/inherited/boundaries" \
            "morph/Test/runMain nativeapplication.PureSIntCastArtifactWriter $output/inherited/pure" \
            "morph/Test/runMain nativeapplication.SignednessCompatibilityArtifactWriter $output/inherited/compatibility" \
            "morph/Test/runMain nativeapplication.DefaultSignedVerilogArtifactWriter $output/a" \
            "morph/Test/runMain nativeapplication.DefaultSignedVerilogArtifactWriter $output/b" \
            "morph/Test/runMain morphhdl.MorphContractFixtureGenerator --output-dir $output/public" \
            > "$output/generation.log" 2>&1 || { tail -n 350 "$output/generation.log"; exit 1; }
          python3 morphhdl/scripts/check-increment-60g-default-rollout.py snapshot \
            "$output/a" "$output/b" "$output/inherited" "$output/manifest.json" --scala "$SCALA_VERSION"
          sbt -batch "++$SCALA_VERSION" \
            'morph/Test/testOnly spinal.core.internals.SignednessCompatibilityTests spinal.core.internals.ParameterizedVerilogStructuralLexicalTests' \
            > "$output/tests.log" 2>&1 || { tail -n 300 "$output/tests.log"; exit 1; }
          python3 morphhdl/scripts/check-increment-60g-default-rollout.py qualify \
            "$output/a" "$output/inherited" "$output/proof" --skip-inherited-source \
            > "$output/proof.log" 2>&1 || { tail -n 350 "$output/proof.log"; exit 1; }
          mkdir -p "$output/cross"
          cp -a "$output/a" "$output/cross/rtl"
          cp "$output/manifest.json" "$output/cross/manifest.json"
          for source in "$output"/public/*.v; do
            cmp "$source" "morphhdl/examples/contracts/$(basename "$source")"
          done

      - name: Record deterministic candidate inventory
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-finalize
          git rev-parse HEAD > "$output/head.txt"
          find "$output/generated-a" "$output/60g/cross" -type f -print0 | sort -z | xargs -0 sha256sum > "$output/generated.sha256"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-61-finalize-candidate-${{ matrix.scala }}-${{ github.run_id }}
          path: |
            target/increment-61-finalize
            morphhdl/target/test-reports
          if-no-files-found: error
          retention-days: 30

  cross:
    needs: [prepare, qualify]
    name: Candidate cross-Scala determinism
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: increment-61-finalize-candidate-*-${{ github.run_id }}
          path: target/increment-61-finalize-cross
      - name: Compare complete generated publication and inherited default bytes
        shell: bash
        run: |
          set -euo pipefail
          root=target/increment-61-finalize-cross
          left="$root/increment-61-finalize-candidate-2.12.18-${{ github.run_id }}/target/increment-61-finalize"
          right="$root/increment-61-finalize-candidate-2.13.12-${{ github.run_id }}/target/increment-61-finalize"
          test "$(cat "$left/head.txt")" = '${{ needs.prepare.outputs.head }}'
          test "$(cat "$right/head.txt")" = '${{ needs.prepare.outputs.head }}'
          diff -ru "$left/generated-a" "$right/generated-a" > "$root/increment-61-cross-scala.diff"
          python3 morphhdl/scripts/check-increment-60g-default-rollout.py compare \
            "$left/60g/cross" "$right/60g/cross" \
            > "$root/increment-60g-cross-scala.log"
          echo '${{ needs.prepare.outputs.head }}' > "$root/head.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: increment-61-finalize-cross-${{ github.run_id }}
          path: target/increment-61-finalize-cross
          if-no-files-found: error
          retention-days: 30

  complete:
    needs: [prepare, qualify, cross]
    name: Record documentation-only completion head
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      head: ${{ steps.publish.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head }}
          fetch-depth: 0
          persist-credentials: true
      - name: Mark Increment 61 complete and bind the qualification record
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-finalize-completion
          mkdir -p "$output"
          git rev-parse HEAD > "$output/candidate-head.txt"
          test "$(cat "$output/candidate-head.txt")" = '${{ needs.prepare.outputs.head }}'
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, re
          from pathlib import Path

          candidate = '${{ needs.prepare.outputs.head }}'
          run_id = '${{ github.run_id }}'
          roadmap_path = Path('docs/morphhdl/parameterized-verilog-todo.md')
          record_path = Path('docs/morphhdl/increment-61-one-file-per-component.md')
          contract_path = Path('morphhdl/contracts/increment-61-source-review.json')
          checker_path = Path('morphhdl/scripts/check-increment-61-source-review.py')

          roadmap = roadmap_path.read_text()
          pending = '- [ ] **Increment 61 — Parameterized `oneFilePerComponent` publication**'
          complete = '- [x] **Increment 61 — Parameterized `oneFilePerComponent` publication**'
          if pending in roadmap:
              assert roadmap.count(pending) == 1
              roadmap = roadmap.replace(pending, complete, 1)
          else:
              assert roadmap.count(complete) == 1
          roadmap_path.write_text(roadmap)

          record = record_path.read_text().rstrip()
          for marker in ('## Qualified implementation completion candidate', '## Final Increment 61 qualification'):
              if marker in record:
                  record = record.split(marker, 1)[0].rstrip()
          record += f'''\n\n## Final Increment 61 qualification\n\nCandidate implementation head `{candidate}` passed the self-contained finalization\nworkflow run `{run_id}` on both Scala 2.12.18 and 2.13.12. Each lane ran the\ncomplete MorphHDL test inventory, focused Increment 61 publication tests, two\nindependent artifact generations, strict Icarus/Verilator/Yosys checks, four\nsplit-versus-consolidated parameter-specialization equivalence proofs, live\nmissing/duplicate/wrong-file mutations, and inherited Increment 60d/60g signedness\nqualification. Cross-Scala generated Verilog and default signed-Verilog bytes were\nidentical.\n\nThe next commit changes only this completion record, the roadmap checkbox and their\nexact source-review hashes. That final documentation head is independently rerun on\nboth Scala lanes before the exact-SHA merge.\n\nThe Scala and actual generated-Verilog examples above are the Increment 61\ncompletion demonstration. This increment changes publication boundaries and source\nmanifests; it does not introduce a second parameter model or alter the logic of the\nexisting consolidated parameterized Verilog.\n'''
          record_path.write_text(record + '\n')

          sha = lambda data: hashlib.sha256(data).hexdigest()
          contract = json.loads(contract_path.read_text())
          by_path = {entry['path']: entry for entry in contract['reviewed_files']}
          for path in (roadmap_path, record_path):
              assert path.as_posix() in by_path
              by_path[path.as_posix()]['after_sha256'] = sha(path.read_bytes())
          contract['reviewed_files'] = sorted(by_path.values(), key=lambda entry: entry['path'])
          contract_path.write_text(json.dumps(contract, indent=2, sort_keys=False) + '\n')
          checker = checker_path.read_text()
          updated, count = re.subn(
              r'CONTRACT_SHA256 = "[0-9a-f]{64}"',
              f'CONTRACT_SHA256 = "{sha(contract_path.read_bytes())}"',
              checker,
              count=1,
          )
          assert count == 1
          checker_path.write_text(updated)
          PY
          git add \
            docs/morphhdl/increment-61-one-file-per-component.md \
            docs/morphhdl/parameterized-verilog-todo.md \
            morphhdl/contracts/increment-61-source-review.json \
            morphhdl/scripts/check-increment-61-source-review.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit \
              -m '61: record fully qualified completion' \
              -m 'Mark Increment 61 complete only after complete dual-Scala regression, dedicated publication/tool/equivalence/mutation gates, inherited 60d/60g proof and cross-Scala byte determinism. The resulting documentation-only head is requalified before merge.'
          fi
          python3 morphhdl/scripts/check-increment-61-source-review.py | tee "$output/source-review.log"
          python3 morphhdl/scripts/check-typed-native-source-overlay.py | tee "$output/overlay-review.log"

      - name: Publish exact completion head
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-finalize-completion
          candidate=$(cat "$output/candidate-head.txt")
          remote=$(git ls-remote origin refs/heads/agent/increment-61-one-file-per-component | cut -f1)
          test "$remote" = "$candidate"
          if test "$(git rev-parse HEAD)" != "$candidate"; then
            git push origin HEAD:refs/heads/agent/increment-61-one-file-per-component
          fi
          head=$(git rev-parse HEAD)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "$head" > "$output/head.txt"
          git rev-parse 'HEAD^{tree}' > "$output/tree.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-61-finalize-completion-${{ github.run_id }}
          path: target/increment-61-finalize-completion
          if-no-files-found: error
          retention-days: 30

  final:
    needs: complete
    name: Final documentation-head requalification Scala ${{ matrix.scala }}
    runs-on: ubuntu-latest
    timeout-minutes: 220
    strategy:
      fail-fast: false
      matrix:
        scala: ['2.12.18', '2.13.12']
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      SCALA_VERSION: ${{ matrix.scala }}
      SBT_TEST_PARALLEL: '0'
      JAVA_TOOL_OPTIONS: '-Xmx6G -XX:ActiveProcessorCount=4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.complete.outputs.head }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Verify exact completed source and complete regression
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-final-head
          mkdir -p "$output"
          test "$(git rev-parse HEAD)" = '${{ needs.complete.outputs.head }}'
          git rev-parse HEAD > "$output/head.txt"
          grep -Fq -- '- [x] **Increment 61 — Parameterized `oneFilePerComponent` publication**' docs/morphhdl/parameterized-verilog-todo.md
          python3 morphhdl/scripts/check-increment-61-source-review.py > "$output/source-review.log"
          python3 morphhdl/scripts/check-increment-61-source-review.py --self-test > "$output/source-review-self-test.log"
          python3 morphhdl/scripts/check-typed-native-source-overlay.py > "$output/overlay-review.log"
          python3 morphhdl/scripts/check-native-source-preservation.py > "$output/native-review.log"
          sbt -batch "++$SCALA_VERSION" 'morph/Test/test' \
            > "$output/full-test.log" 2>&1 || { tail -n 500 "$output/full-test.log"; exit 1; }
          sbt -batch "++$SCALA_VERSION" \
            'morph/Test/testOnly morphhdl.Increment61PerComponentPublicationTests' \
            "morph/Test/runMain morphhdl.Increment61PerComponentPublicationArtifacts $output/generated" \
            > "$output/increment-61.log" 2>&1 || { tail -n 350 "$output/increment-61.log"; exit 1; }
          split="$output/generated/split"
          combined="$output/generated/consolidated/Increment61Top.v"
          files=("$split/Increment61Leaf.v" "$split/Increment61Top.v")
          iverilog -g2001 -s Increment61Top -o "$output/split.vvp" "${files[@]}"
          iverilog -g2001 -s Increment61Top -o "$output/combined.vvp" "$combined"
          verilator --lint-only --language 1364-2001 --top-module Increment61Top "${files[@]}"
          verilator --lint-only --language 1364-2001 --top-module Increment61Top "$combined"
          yosys -q -p "read_verilog -noautowire ${files[*]}; hierarchy -check -top Increment61Top; proc; memory; flatten; opt; check -assert" > "$output/split-yosys.log"
          yosys -q -p "read_verilog -noautowire $combined; hierarchy -check -top Increment61Top; proc; memory; flatten; opt; check -assert" > "$output/combined-yosys.log"
          python3 - "$output/test-counts.json" <<'PY'
          from pathlib import Path
          import json, sys
          import xml.etree.ElementTree as ET
          reports = sorted(Path('morphhdl/target').rglob('TEST-*.xml'))
          assert reports
          value = {'report_files': len(reports), 'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          for report in reports:
              root = ET.parse(report).getroot()
              for key in ('tests', 'failures', 'errors', 'skipped'):
                  value[key] += int(float(root.get(key, '0')))
          assert value['tests'] > 0 and value['failures'] == value['errors'] == value['skipped'] == 0, value
          open(sys.argv[1], 'w').write(json.dumps(value, indent=2) + '\n')
          print(value)
          PY
          find "$output/generated" -type f -print0 | sort -z | xargs -0 sha256sum > "$output/generated.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-61-final-head-${{ matrix.scala }}-${{ github.run_id }}
          path: |
            target/increment-61-final-head
            morphhdl/target/test-reports
          if-no-files-found: error
          retention-days: 30

  merge:
    needs: [complete, final]
    name: Exact-SHA merge and merge-tree verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      FINAL_HEAD: ${{ needs.complete.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.complete.outputs.head }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          pattern: increment-61-final-head-*-${{ github.run_id }}
          path: target/increment-61-final-merge
      - name: Verify both final lanes and prepare PR evidence
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-final-merge
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"
          for scala in 2.12.18 2.13.12; do
            root="$output/increment-61-final-head-$scala-${{ github.run_id }}/target/increment-61-final-head"
            test "$(cat "$root/head.txt")" = "$FINAL_HEAD"
            python3 - "$root/test-counts.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          assert value['tests'] > 0
          assert value['failures'] == value['errors'] == value['skipped'] == 0
          print(value)
          PY
          done
          left="$output/increment-61-final-head-2.12.18-${{ github.run_id }}/target/increment-61-final-head/generated"
          right="$output/increment-61-final-head-2.13.12-${{ github.run_id }}/target/increment-61-final-head/generated"
          diff -ru "$left" "$right" > "$output/final-cross-scala.diff"
          python3 morphhdl/scripts/check-increment-61-source-review.py > "$output/source-review.log"
          grep -Fq -- '- [x] **Increment 61 — Parameterized `oneFilePerComponent` publication**' docs/morphhdl/parameterized-verilog-todo.md
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/179 --jq .head.sha)" = "$FINAL_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/179 --jq .base.ref)" = 'parameterized-verilog'
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/179 --jq .state)" = 'open'
          cat > "$output/final-pr-section.md" <<EOF
          ## Final self-contained qualification

          Final head: \`$FINAL_HEAD\`

          GitHub Actions run \`${{ github.run_id }}\` passed:

          - complete MorphHDL regression on Scala 2.12.18 and 2.13.12 at the implementation head;
          - focused per-component publication tests and independent repeated generation;
          - strict Icarus, Verilator and Yosys checks;
          - four split-versus-consolidated parameter-specialization equivalence proofs;
          - missing, duplicate and wrong-file publication mutations;
          - inherited Increment 60d and 60g signedness qualification;
          - cross-Scala byte determinism;
          - complete dual-Scala regression and publication/tool checks again at this exact documentation-only final head.

          The roadmap checkbox and completion record are bound to this exact reviewed source.
          EOF
          gh pr view 179 --json body --jq .body > "$output/pr-body.md"
          python3 - "$output/pr-body.md" "$output/final-pr-section.md" <<'PY'
          from pathlib import Path
          import sys
          body, section = map(Path, sys.argv[1:])
          text = body.read_text()
          marker = '## Final self-contained qualification'
          if marker in text: text = text.split(marker, 1)[0].rstrip() + '\n\n'
          body.write_text(text + section.read_text())
          PY
          gh pr edit 179 --body-file "$output/pr-body.md"
          gh pr ready 179 || true

      - name: Merge exact final head and verify resulting tree
        shell: bash
        run: |
          set -euo pipefail
          output=target/increment-61-final-merge
          for attempt in $(seq 1 60); do
            state=$(gh api repos/$GITHUB_REPOSITORY/pulls/179 --jq .mergeable_state)
            case "$state" in
              clean|unstable|has_hooks) break ;;
              dirty|blocked) echo "PR merge blocked: $state" >&2; exit 1 ;;
              *) sleep 10 ;;
            esac
          done
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/179/merge" \
            -f sha="$FINAL_HEAD" -f merge_method=merge > "$output/merge.json"
          python3 - "$output/merge.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          assert value.get('merged') is True, value
          print(value)
          PY
          merge_head=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha"])' "$output/merge.json")
          echo "$merge_head" > "$output/merge-head.txt"
          git fetch origin parameterized-verilog
          test "$(git rev-parse origin/parameterized-verilog)" = "$merge_head"
          git merge-base --is-ancestor "$FINAL_HEAD" "$merge_head"
          final_tree=$(git rev-parse "$FINAL_HEAD^{tree}")
          merge_tree=$(git rev-parse "$merge_head^{tree}")
          test "$final_tree" = "$merge_tree"
          echo "$final_tree" > "$output/final-tree.txt"
          echo "$merge_tree" > "$output/merge-tree.txt"
          gh pr comment 179 --body "Increment 61 completed and merged after self-contained exact-head qualification. Final head: \`$FINAL_HEAD\`; merge commit: \`$merge_head\`; merge tree matches the fully qualified final tree."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-61-final-merge-${{ github.run_id }}
          path: target/increment-61-final-merge
          if-no-files-found: error
          retention-days: 30

name: MorphHDL native Int shadow expressions

# Stable required-check name; the contract is negative after Increment 53g.
on:
  push:
    branches: [main, parameterized-verilog]
  pull_request:
    branches: [main, parameterized-verilog]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morphhdl-native-int-expressions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundary:
    name: Native Int expression source boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prove expression-shadow retirement
        run: |
          python3 morphhdl/scripts/check-production-retirement.py --self-test
          bash morphhdl/scripts/check-native-int-shadow-expression-boundary.sh

  contracts:
    name: Native Int expression proof Scala ${{ matrix.scala_version }}
    needs: source-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Exercise typed expressions and predicates
        run: >-
          sbt -batch "++${{ matrix.scala_version }}"
          "morph/testOnly morphhdl.TypedElaborationValueTests"

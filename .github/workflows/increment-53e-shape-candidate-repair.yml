name: Increment 53e shape candidate repair

on:
  push:
    branches:
      - agent/increment-53e-streamfifo-cc-parameterization

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-streamfifo-cc-parameterization
          fetch-depth: 0

      - name: Require symbolic candidates to match the concrete leaf width
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/increment-53e-bootstrap-v2.yml')
          value = path.read_text()
          old = '.exists(_.parameters.nonEmpty) =>'
          new = '''.exists { width =>
                              width.parameters.nonEmpty &&
                              width.default == BigInt(prototype.getBitsWidth) &&
                              width.minimum >= 1 &&
                              width.maximum >= width.minimum
                            } =>'''
          count = value.count(old)
          if count != 1:
              raise SystemExit(f'expected one unconstrained symbolic candidate, found {count}')
          path.write_text(value.replace(old, new, 1))
          PY

      - name: Publish repaired bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/increment-53e-shape-candidate-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/increment-53e-bootstrap-v2.yml .github/workflows/increment-53e-shape-candidate-repair.yml
          git diff --cached --check
          git commit -m 'Increment 53e: reject mismatched symbolic assignment shapes'
          git push origin HEAD:agent/increment-53e-streamfifo-cc-parameterization

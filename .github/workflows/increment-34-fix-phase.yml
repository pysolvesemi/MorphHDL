name: Increment 34 PhaseVerilog fix

on:
  push:
    branches:
      - agent/increment-34-generic-processes

permissions:
  contents: write

concurrency:
  group: increment-34-fix-phase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicated tuple closer
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('core/src/main/scala/spinal/core/internals/PhaseVerilog.scala')
          text = path.read_text()
          before = "              }\n              )\n          )\n"
          after = "              }\n          )\n"
          if text.count(before) != 1:
              raise RuntimeError('expected exactly one duplicated PhaseVerilog tuple closer')
          path.write_text(text.replace(before, after, 1))
          PY
          rm -f .github/workflows/increment-34-fix-phase.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close parameterized Verilog result tuple"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0-mill.sh \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill
          if ! command -v iverilog >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y iverilog
          fi

      - name: Run Increment 34 focused regression
        shell: bash
        run: |
          set -euo pipefail
          if ! /tmp/morphhdl-mill morph[2.12.18].testOnly \
            morphhdl.GenericProcessLoweringTests \
            morphhdl.StructuralGenerateControlTests \
            morphhdl.GenericExpressionAndStreamTests \
            > /tmp/increment-34-test.log 2>&1; then
            grep -E '(\[error\]|(^|[[:space:]])error:|Exception|FAILED|Compilation failed|not found:|type mismatch|overloaded method)' \
              /tmp/increment-34-test.log | tail -n 200 > /tmp/increment-34-diagnostic.log || true
            if [[ ! -s /tmp/increment-34-diagnostic.log ]]; then
              tail -n 200 /tmp/increment-34-test.log > /tmp/increment-34-diagnostic.log
            fi
            cat /tmp/increment-34-diagnostic.log
            diagnostic="$(cat /tmp/increment-34-diagnostic.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error file=.github/workflows/increment-34-fix-phase.yml,line=1::$diagnostic"
            exit 1
          fi
          cat /tmp/increment-34-test.log

      - name: Upload focused regression log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: increment-34-phase-fix-log
          path: /tmp/increment-34-test.log
          if-no-files-found: ignore

name: Increment 59 typed BlackBox generic gates

on:
  push:
    branches:
      - parameterized-verilog
      - 'agent/increment-59-*'
  pull_request:
    branches:
      - parameterized-verilog

permissions:
  contents: read

concurrency:
  group: increment-59-blackbox-generics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Source, audit, and scope contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact head with complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Resolve comparison base
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
          elif [[ "$REF_NAME" == parameterized-verilog ]]; then
            base="$BEFORE"
          else
            git fetch --no-tags origin parameterized-verilog
            base="$(git rev-parse origin/parameterized-verilog)"
          fi
          test -n "$base"
          test "$(git rev-parse --verify "$base^{commit}")" = "$base"
          git merge-base --is-ancestor "$base" HEAD
          printf 'sha=%s\n' "$base" >> "$GITHUB_OUTPUT"

      - name: Validate Increment 59 source contracts
        shell: bash
        env:
          BASE_COMMIT: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          python3 -m py_compile \
            morphhdl/scripts/check-increment-59-blackbox-generics.py \
            morphhdl/scripts/check-native-source-preservation.py \
            morphhdl/scripts/check-production-retirement.py \
            morphhdl/scripts/check-typed-layering-ir.py
          python3 morphhdl/scripts/check-increment-59-blackbox-generics.py --self-test
          python3 morphhdl/scripts/check-increment-59-blackbox-generics.py --repo-root .
          python3 morphhdl/scripts/check-native-source-preservation.py --self-test
          python3 morphhdl/scripts/check-native-source-preservation.py
          python3 morphhdl/scripts/check-production-retirement.py
          python3 morphhdl/scripts/check-typed-layering-ir.py

          scope=morphhdl/contracts/increment-59-source-scope.txt
          todo=docs/morphhdl/parameterized-verilog-todo.md
          test -s "$scope"
          test "$(cat "$scope")" = "$(LC_ALL=C sort -u "$scope")"
          if grep -Eq '^[[:space:]]*$|^#|^/' "$scope"; then
            printf '%s\n' 'Increment 59 scope must contain only sorted repository-relative paths' >&2
            exit 1
          fi
          while IFS= read -r path; do test -e "$path"; done < "$scope"
          test "$(grep -Ec '^- \[( |x)\] \*\*Increment 59 — Typed BlackBox parameter and generic binding\*\*$' "$todo")" = 1
          grep -Fqx '  **Dependencies:** Increment 58 implemented and merged.' "$todo"

          test ! -e .github/increment59-source-validation.txt
          test ! -e .github/workflows/increment-59-export.yml
          test ! -e .github/workflows/increment-59-bootstrap-v5.yml
          test ! -e .github/workflows/increment-59-finalize.yml
          test ! -e .github/workflows/increment-59-finalize-v2.yml

          actual="$(git diff --no-renames --name-only --diff-filter=ACMRTD \
            "$BASE_COMMIT"...HEAD \
            | awk '$0 != "docs/morphhdl/parameterized-verilog-todo.md"' \
            | LC_ALL=C sort -u)"
          expected="$(cat "$scope")"
          if [[ "$actual" != "$expected" ]]; then
            printf '%s\n' 'Unexpected Increment 59 file inventory' >&2
            printf '%s\n' '--- expected ---' "$expected" >&2
            printf '%s\n' '--- actual ---' "$actual" >&2
            exit 1
          fi
          git diff --check "$BASE_COMMIT"...HEAD

  dual-scala:
    name: Dual-Scala compile, focused tests, and inherited suites ${{ matrix.scala_version }}
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Compile production and test sources
        run: sbt -batch "++${{ matrix.scala_version }}" compile Test/compile

      - name: Run focused typed BlackBox and compatibility tests
        run: |
          sbt -batch "++${{ matrix.scala_version }}" \
            "morph/testOnly morphhdl.TypedBlackBoxGenericBindingTests morphhdl.NativeTypedLibraryCallSurfaceTests morphhdl.MorphSingleSourceVerilogTests"
          sbt -batch "++${{ matrix.scala_version }}" \
            "tester/testOnly spinal.lib.CounterTester spinal.lib.SpinalSimStreamFifoTester spinal.lib.SpinalSimStreamFifoCCTester spinal.lib.SpinalSimStreamWidthAdapterTester"

      - name: Run complete affected suites
        run: |
          sbt -batch "++${{ matrix.scala_version }}" frontend/test
          sbt -batch "++${{ matrix.scala_version }}" morphir/test
          sbt -batch "++${{ matrix.scala_version }}" morph/test

  strict-formal:
    name: Strict Verilog-2001 and formal closure ${{ matrix.scala_version }}
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
      MORPHDL_RUN_TYPED_BLACKBOX_FORMAL_EQUIVALENCE: '1'
      MORPHDL_TYPED_BLACKBOX_FORMAL_WORKSPACE: ${{ github.workspace }}/formal-artifacts/scala-${{ matrix.scala_version }}/typed-blackbox
      MORPHDL_RUN_STREAMFIFOCC_CDC_PROOF: '1'
      MORPHDL_RUN_TYPED_VEC_FORMAL_EQUIVALENCE: '1'
      MORPHDL_RUN_TYPED_PRIMITIVE_CLOSURE_FORMAL_EQUIVALENCE: '1'
      MORPHDL_RUN_STREAMFIFO_FORMAL_EQUIVALENCE: '1'
      MORPHDL_RUN_NATIVE_LIBRARY_MIGRATION_FORMAL_EQUIVALENCE: '1'
      MORPHDL_RUN_NATIVE_AXI4_FORMAL_EQUIVALENCE: '1'
      MORPHDL_RUN_STREAMFIFOCC_FORMAL_EQUIVALENCE: '1'
      MORPHDL_STREAMFIFOCC_CDC_WORKSPACE: ${{ github.workspace }}/formal-artifacts/scala-${{ matrix.scala_version }}/streamfifocc-cdc
      MORPHDL_TYPED_VEC_FORMAL_WORKSPACE: ${{ github.workspace }}/formal-artifacts/scala-${{ matrix.scala_version }}/vec
      MORPHDL_TYPED_PRIMITIVE_FORMAL_WORKSPACE: ${{ github.workspace }}/formal-artifacts/scala-${{ matrix.scala_version }}/closure
      MORPHDL_STREAMFIFO_FORMAL_WORKSPACE: ${{ github.workspace }}/formal-artifacts/scala-${{ matrix.scala_version }}/streamfifo
      MORPHDL_NATIVE_LIBRARY_MIGRATION_FORMAL_WORKSPACE: ${{ github.workspace }}/formal-artifacts/scala-${{ matrix.scala_version }}/library-migration
      MORPHDL_NATIVE_AXI4_FORMAL_WORKSPACE: ${{ github.workspace }}/formal-artifacts/scala-${{ matrix.scala_version }}/axi4
      MORPHDL_STREAMFIFOCC_FORMAL_WORKSPACE: ${{ github.workspace }}/formal-artifacts/scala-${{ matrix.scala_version }}/streamfifocc-depth-width
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Verify strict and formal toolchains
        shell: bash
        run: |
          set -euo pipefail
          command -v iverilog
          command -v vvp
          command -v verilator
          command -v yosys
          command -v sby
          command -v yices-smt2
          yosys_version="$(yosys -V)"
          grep -Eq '^Yosys 0\.41([ +]|$)' <<<"$yosys_version"
          sby -h 2>&1 | grep -q 'usage: sby'

      - name: Generate and validate representative typed BlackBox RTL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/morphhdl/typed-blackbox
          sbt -batch "++${{ matrix.scala_version }}" \
            "morph/Test/runMain morphhdl.TypedBlackBoxGenericArtifactGenerator parameterized ${GITHUB_WORKSPACE}/target/morphhdl/typed-blackbox/typed_blackbox.v"
          python3 morphhdl/scripts/check-increment-59-blackbox-generics.py \
            --artifact target/morphhdl/typed-blackbox/typed_blackbox.v

          cat > target/morphhdl/typed-blackbox/external_stubs.v <<'VERILOG'
          module TypedExternalLeaf #(
            parameter LABEL = "",
            parameter integer WIDTH = 8,
            parameter integer DEPTH = 4,
            parameter integer DOUBLE_WIDTH = 16,
            parameter CONCRETE_ENABLE = 1'b1,
            parameter ENABLED = 1'b1
          ) (
            input  wire [WIDTH-1:0] din,
            output wire [WIDTH-1:0] dout
          );
            assign dout = ENABLED ? din : {WIDTH{1'b0}};
          endmodule

          module TypedParameterOnlyExternal #(
            parameter integer LATENCY = 2
          ) (
            input  wire [7:0] din,
            output wire [7:0] dout
          );
            assign dout = din;
          endmodule
          VERILOG

          iverilog -g2001 -Wall -Wimplicit \
            -s TypedBlackBoxGenericTop \
            -o target/morphhdl/typed-blackbox/default.vvp \
            target/morphhdl/typed-blackbox/external_stubs.v \
            target/morphhdl/typed-blackbox/typed_blackbox.v
          iverilog -g2001 -Wall -Wimplicit \
            -P TypedBlackBoxGenericTop.WIDTH=11 \
            -P TypedBlackBoxGenericTop.LATENCY=3 \
            -P TypedBlackBoxGenericTop.ENABLE=0 \
            -s TypedBlackBoxGenericTop \
            -o target/morphhdl/typed-blackbox/override.vvp \
            target/morphhdl/typed-blackbox/external_stubs.v \
            target/morphhdl/typed-blackbox/typed_blackbox.v
          verilator --lint-only --language 1364-2001 -Wall -Wno-fatal \
            --top-module TypedBlackBoxGenericTop \
            target/morphhdl/typed-blackbox/external_stubs.v \
            target/morphhdl/typed-blackbox/typed_blackbox.v
          yosys -q -p "read_verilog -noautowire target/morphhdl/typed-blackbox/external_stubs.v target/morphhdl/typed-blackbox/typed_blackbox.v; hierarchy -check -top TypedBlackBoxGenericTop; proc; opt; check -assert; synth -top TypedBlackBoxGenericTop; check -assert"
          yosys -q -p "read_verilog -noautowire target/morphhdl/typed-blackbox/external_stubs.v target/morphhdl/typed-blackbox/typed_blackbox.v; chparam -set WIDTH 11 -set LATENCY 3 -set ENABLE 0 TypedBlackBoxGenericTop; hierarchy -check -top TypedBlackBoxGenericTop; proc; opt; check -assert; synth -top TypedBlackBoxGenericTop; check -assert"

      - name: Run focused and inherited formal equivalence gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${MORPHDL_TYPED_BLACKBOX_FORMAL_WORKSPACE}"
          grep -Eqi 'formal|sby|yosys|equiv' \
            morphhdl/src/test/scala/morphhdl/TypedBlackBoxGenericBindingTests.scala
          sbt -batch "++${{ matrix.scala_version }}" \
            "morph/testOnly morphhdl.TypedBlackBoxGenericBindingTests"
          sbt -batch "++${{ matrix.scala_version }}" \
            "morph/testOnly morphhdl.NativeLibraryMigrationFormalEquivalenceTests morphhdl.NativeAxi4SlaveFactoryFormalEquivalenceTests morphhdl.TypedStreamWidthAdapterFormalEquivalenceTests morphhdl.TypedParameterizedVecFormalEquivalenceTests morphhdl.TypedPrimitiveClosureFormalEquivalenceTests morphhdl.NativeStreamFifoFormalEquivalenceTests morphhdl.NativeStreamFifoCCFormalEquivalenceTests"
          sbt -batch "++${{ matrix.scala_version }}" \
            "tester/testOnly spinal.lib.CounterFormalTester spinal.tester.scalatest.FormalFifoCCTester"

      - name: Retain formal and strict artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59-formal-scala-${{ matrix.scala_version }}
          path: |
            formal-artifacts/scala-${{ matrix.scala_version }}
            target/morphhdl/typed-blackbox
          if-no-files-found: error
          retention-days: 14

  determinism:
    name: Deterministic typed and concrete publication ${{ matrix.scala_version }}
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Prove replay and concrete preservation
        run: |
          sbt -batch "++${{ matrix.scala_version }}" \
            'morph/testOnly morphhdl.TypedBlackBoxGenericBindingTests morphhdl.MorphVerilogTests -- -z "repeated successful runs are byte-identical"'
          sbt -batch "++${{ matrix.scala_version }}" \
            'morph/testOnly morphhdl.MorphSingleSourceVerilogTests morphhdl.StreamFifoCompatibilityTests'
          git diff --exit-code -- .

  closure:
    name: Increment 59 canonical closure
    if: always()
    needs:
      - source-contract
      - dual-scala
      - strict-formal
      - determinism
    runs-on: ubuntu-latest
    steps:
      - name: Require every final gate
        env:
          SOURCE: ${{ needs.source-contract.result }}
          DUAL: ${{ needs.dual-scala.result }}
          FORMAL: ${{ needs.strict-formal.result }}
          DETERMINISM: ${{ needs.determinism.result }}
        run: |
          test "$SOURCE" = success
          test "$DUAL" = success
          test "$FORMAL" = success
          test "$DETERMINISM" = success

name: Increment 59i sync current target for development

on:
  push:
    branches: ['agent/increment-59i-combined-reduction-closure']
    paths:
      - '.github/workflows/increment-59i-sync-current-target.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-59i-sync-current-target
  cancel-in-progress: false

jobs:
  sync:
    name: Merge exact current target into draft 59i branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: agent/increment-59i-combined-reduction-closure
      TARGET_HEAD: 2ebaa2ef5561eab35aa0ba9caced5c5a314d59f6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          submodules: recursive

      - name: Merge and publish exact target ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git fetch origin parameterized-verilog
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET_HEAD"
          if git merge-base --is-ancestor "$TARGET_HEAD" HEAD; then
            echo "target already present"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff -X ours "$TARGET_HEAD" \
            -m 'Merge current parameterized-verilog into Increment 59i development'
          test "$(git rev-parse HEAD^1)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD^2)" = "$TARGET_HEAD"
          git merge-base --is-ancestor "$TARGET_HEAD" HEAD
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check HEAD^1 HEAD
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git push origin "HEAD:refs/heads/$BRANCH"

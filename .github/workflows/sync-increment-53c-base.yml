name: Sync Increment 53c with parameterized-verilog

on:
  push:
    branches:
      - agent/increment-53c-native-axi4-slave-factory-offsets

permissions:
  contents: write

jobs:
  sync:
    name: Merge latest parameterized-verilog dependency state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Increment 53c branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53c-native-axi4-slave-factory-offsets
          fetch-depth: 0

      - name: Merge base and reconcile roadmap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags origin parameterized-verilog
          git merge --no-commit --no-ff -X ours origin/parameterized-verilog

          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/morphhdl/parameterized-verilog-todo.md")
          text = path.read_text(encoding="utf-8")

          old_graph = """- Increment 53b depends only on the merged Increment 53. Increments 53a and 53b
            may execute independently.
          - Increment 53c depends on the merged Increment 53b and may overlap Increment
            53a once Increment 53b is merged.
          - Increment 54 requires the merged Increments 53a and 53c. Increments 54
            through 58 then form a strict sequential closure chain.
          """
          new_graph = """- Increment 53b depends only on the merged Increment 53. Increments 53a and 53b
            may execute independently.
          - Increment 53b.1 is a corrective enum-naming closure and depends only on
            the merged Increment 53b.
          - Increment 53c depends on the merged Increment 53b and may overlap
            Increments 53a and 53b.1 once Increment 53b is merged.
          - Increment 54 requires the merged Increments 53a, 53b.1 and 53c.
            Increments 54 through 58 then form a strict sequential closure chain.
          """
          if old_graph not in text:
              raise SystemExit("expected Increment 53 dependency graph was not found")
          text = text.replace(old_graph, new_graph, 1)

          marker = "- [x] **Increment 53c — Native AXI4 Slave Factory parameterized offsets**\n"
          if marker not in text:
              raise SystemExit("Increment 53c roadmap marker was not found")
          if "**Increment 53b.1 — SCREAMING_SNAKE_CASE SpinalEnum localparam names**" in text:
              raise SystemExit("Increment 53b.1 unexpectedly already exists in the 53c roadmap side")

          increment_53b1 = """- [x] **Increment 53b.1 — SCREAMING_SNAKE_CASE SpinalEnum localparam names**

            **Dependencies:** Increment 53b implemented and merged.

            Refine only the MorphHDL-owned module-local enum publication naming from
            Increment 53b. Convert each resolved enum type and element identifier to
            deterministic SCREAMING_SNAKE_CASE before joining them: split lowercase-or-
            digit to uppercase boundaries, split acronym-to-word boundaries, preserve
            existing underscores and digits, and uppercase with locale-independent
            rules. For example, Scala `Inc53bFormalState.IDLE` must become Verilog
            `INC53B_FORMAL_STATE_IDLE`, and `AXI4ReadState.waitResp` must become
            `AXI4_READ_STATE_WAIT_RESP`. Apply the same base name to retained one-hot
            `_OH_ID` bit-index helpers without changing their semantics. Never add a
            component, module, instance or hierarchy prefix. Fail closed when distinct
            source identifiers such as `FooBar` and `Foo_Bar` canonicalize to the same
            module-local name, even when their encoded values happen to match. Keep
            ordinary `SpinalVerilog` macro output and every upstream-owned SpinalHDL
            production source unchanged. Re-run deterministic Verilog-2001 lint and
            synthesis plus macro-versus-localparam sequential formal equivalence on
            Scala 2.12.18 and 2.13.12.

          """
          text = text.replace(marker, increment_53b1 + marker, 1)

          old_increment_54 = "  **Dependencies:** Increments 53a and 53c implemented and merged.\n"
          new_increment_54 = "  **Dependencies:** Increments 53a, 53b.1 and 53c implemented and merged.\n"
          if old_increment_54 not in text:
              raise SystemExit("expected Increment 54 dependencies were not found")
          text = text.replace(old_increment_54, new_increment_54, 1)

          if text.count("**Increment 53b.1 —") != 1:
              raise SystemExit("Increment 53b.1 roadmap entry is not unique")
          if text.count("**Increment 53c —") != 1:
              raise SystemExit("Increment 53c roadmap entry is not unique")
          if "<<<<<<<" in text or ">>>>>>>" in text or "=======" in text:
              raise SystemExit("roadmap contains unresolved merge markers")

          path.write_text(text, encoding="utf-8")
          PY

          test -f morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalEnumLocalizer.scala
          grep -Fq 'toScreamingSnake(nativeName)' \
            morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalEnumLocalizer.scala
          grep -Fq 'INC53B1_AXI4_READ_STATE_WAIT_RESP' \
            morphhdl/src/test/scala/morphhdl/SpinalEnumLocalParameterTests.scala
          grep -Fq '**Increment 53b.1 — SCREAMING_SNAKE_CASE SpinalEnum localparam names**' \
            docs/morphhdl/parameterized-verilog-todo.md
          grep -Fq '**Increment 53c — Native AXI4 Slave Factory parameterized offsets**' \
            docs/morphhdl/parameterized-verilog-todo.md

          git rm .github/workflows/sync-increment-53c-base.yml
          git add -A
          git diff --cached --check
          git commit -m 'Merge latest parameterized-verilog into Increment 53c'
          git push origin HEAD:agent/increment-53c-native-axi4-slave-factory-offsets

name: Increment 61 split-barrier recovery v7

on:
  push:
    branches: ['agent/increment-61-controller']
    paths:
      - '.github/workflows/increment-61-recovery-v7.yml'
      - 'tools/increment-61-controller.py'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: increment-61-split-barrier-recovery-v7
  cancel-in-progress: false

env:
  FEATURE_BRANCH: agent/increment-61-one-file-per-component
  TARGET_BRANCH: parameterized-verilog
  PR_NUMBER: '179'
  GH_TOKEN: ${{ github.token }}
  COURSIER_REPOSITORIES: https://repo.maven.apache.org/maven2
  COURSIER_CACHE: /sbt/.cache/coursier/v1
  JAVA_TOOL_OPTIONS: '-Xmx5G -XX:ActiveProcessorCount=4'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    outputs:
      already_merged: ${{ steps.state.outputs.merged }}
      closeout_head: ${{ steps.final.outputs.head }}
      existing_merge_head: ${{ steps.state.outputs.merge_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-61-controller
          path: controller
          fetch-depth: 1
          persist-credentials: false

      - name: Let the one-time v6 retry reach a terminal state
        shell: bash
        run: |
          set -euo pipefail
          python3 controller/tools/increment-61-controller.py wait-run \
            --branch agent/increment-61-controller \
            --name 'Increment 61 guarded finalizer retry v6' \
            --output target/increment-61-v7/v6.json

      - name: Read the authoritative PR state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          python3 controller/tools/increment-61-controller.py pr \
            --number "$PR_NUMBER" --output target/increment-61-v7/pr-before.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value=json.load(open('target/increment-61-v7/pr-before.json'))
          print('merged=' + ('true' if value.get('merged') else 'false'))
          print('head=' + value['head']['sha'])
          print('merge_head=' + (value.get('merge_commit_sha') or ''))
          PY

      - uses: actions/checkout@v4
        if: steps.state.outputs.merged != 'true'
        with:
          ref: agent/increment-61-one-file-per-component
          path: feature
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Verify the repaired feature source
        if: steps.state.outputs.merged != 'true'
        working-directory: feature
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/increment-61-fix-compat-ceiling.yml
          test ! -e .github/workflows/increment-61-fix-compat-ceiling-v2.yml
          test "$(grep -c 'bitVectorWidthMax = 8192' morphhdl/src/test/scala/morphhdl/Increment61CompatibilityMatrix.scala)" = 1
          python3 morphhdl/scripts/check-increment-61-source-review.py
          python3 morphhdl/scripts/check-increment-61-source-review.py --self-test
          git diff --exit-code

      - name: Independently run the repaired compatibility matrix on both Scala lanes
        if: steps.state.outputs.merged != 'true'
        working-directory: feature
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-61-v7/local-matrix"
          mkdir -p "$output"
          version=$(sed -n 's/^sbt.version=//p' project/build.properties)
          test "$version" = '1.10.0'
          curl --fail --location --retry 5 --retry-all-errors \
            "https://repo.maven.apache.org/maven2/org/scala-sbt/sbt-launch/$version/sbt-launch-$version.jar" \
            -o "$output/sbt-launch.jar"
          printf '[repositories]\nlocal\nmaven-central: https://repo.maven.apache.org/maven2\n' > "$output/repositories"
          for scala in 2.12.18 2.13.12; do
            java -Xmx4G -Dsbt.log.noformat=true -Dsbt.supershell=false \
              -Dsbt.boot.directory=/sbt/.sbt/boot -Dsbt.global.base=/sbt/.sbt \
              -Dsbt.ivy.home=/sbt/.ivy2 -Duser.home=/sbt \
              -Dsbt.repository.config="$output/repositories" -Dsbt.override.build.repos=true \
              -jar "$output/sbt-launch.jar" "++$scala" \
              'morph/Test/testOnly morphhdl.Increment61CompatibilityMatrixTests' \
              > "$output/scala-$scala.log" 2>&1 || { tail -n 300 "$output/scala-$scala.log"; exit 1; }
          done

      - name: Detect whether closeout was already published
        if: steps.state.outputs.merged != 'true'
        id: closeout_state
        working-directory: feature
        shell: bash
        run: |
          set -euo pipefail
          if grep -qE '^- \[x\] \*\*Increment 61\b' docs/morphhdl/parameterized-verilog-todo.md; then
            grep -q '^## Increment 61 completion evidence$' docs/morphhdl/increment-61-one-file-per-component.md
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Require a fresh green implementation head before closeout
        if: steps.state.outputs.merged != 'true' && steps.closeout_state.outputs.complete != 'true'
        working-directory: feature
        shell: bash
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          python3 ../controller/tools/increment-61-controller.py gate \
            --branch "$FEATURE_BRANCH" --head "$head" --stage pre-closeout-v7 \
            --output "$GITHUB_WORKSPACE/target/increment-61-v7/pre-closeout"

      - name: Generate actual split Verilog for the completion record
        if: steps.state.outputs.merged != 'true' && steps.closeout_state.outputs.complete != 'true'
        working-directory: feature
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/increment-61-v7/completion"
          mkdir -p "$output"
          version=$(sed -n 's/^sbt.version=//p' project/build.properties)
          test "$version" = '1.10.0'
          test -s "$GITHUB_WORKSPACE/target/increment-61-v7/local-matrix/sbt-launch.jar"
          cp "$GITHUB_WORKSPACE/target/increment-61-v7/local-matrix/sbt-launch.jar" "$output/sbt-launch.jar"
          cp "$GITHUB_WORKSPACE/target/increment-61-v7/local-matrix/repositories" "$output/repositories"
          java -Xmx4G -Dsbt.log.noformat=true -Dsbt.supershell=false \
            -Dsbt.boot.directory=/sbt/.sbt/boot -Dsbt.global.base=/sbt/.sbt \
            -Dsbt.ivy.home=/sbt/.ivy2 -Duser.home=/sbt \
            -Dsbt.repository.config="$output/repositories" -Dsbt.override.build.repos=true \
            -jar "$output/sbt-launch.jar" '++2.12.18' \
            "morph/Test/runMain morphhdl.Increment61PerComponentPublicationArtifacts $output/generated" \
            > "$output/generation.log" 2>&1 || { tail -n 300 "$output/generation.log"; exit 1; }
          test -s "$output/generated/split/Increment61Leaf.v"
          test -s "$output/generated/split/Increment61Top.v"
          test "$(cat "$output/generated/split/Increment61Top.lst")" = $'Increment61Leaf.v\nIncrement61Top.v'

      - name: Publish completion evidence and close the roadmap item
        if: steps.state.outputs.merged != 'true' && steps.closeout_state.outputs.complete != 'true'
        working-directory: feature
        shell: bash
        run: |
          set -euo pipefail
          before=$(git rev-parse HEAD)
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          docs=Path('docs/morphhdl/increment-61-one-file-per-component.md')
          roadmap=Path('docs/morphhdl/parameterized-verilog-todo.md')
          contract=Path('morphhdl/contracts/increment-61-source-review.json')
          checker=Path('morphhdl/scripts/check-increment-61-source-review.py')
          generated=Path('../target/increment-61-v7/completion/generated/split').resolve()
          # The workspace-level target is outside the checkout path.
          if not generated.exists():
              generated=Path('/__w/MorphHDL/MorphHDL/target/increment-61-v7/completion/generated/split')
          leaf=(generated/'Increment61Leaf.v').read_text().rstrip()
          top=(generated/'Increment61Top.v').read_text().rstrip()
          scala='''import morphhdl.MorphVerilog
          import morphhdl.frontend.HdlInt
          import spinal.core.SpinalConfig

          val report = MorphVerilog(
            SpinalConfig(
              targetDirectory = "rtl",
              oneFilePerComponent = true
            )
          ) {
            new Increment61Top(
              HdlInt.param("LEFT_WIDTH", default = 5, min = 1, max = 32),
              HdlInt.param("RIGHT_WIDTH", default = 5, min = 1, max = 32)
            )
          }

          assert(report.generatedSourcesPaths.map(java.nio.file.Paths.get(_).getFileName.toString) ==
            Vector("Increment61Leaf.v", "Increment61Top.v"))'''
          marker='## Increment 61 completion evidence'
          section=f'''\n\n{marker}\n\nThe completed implementation keeps the ordinary MorphHDL/SpinalHDL construction surface and changes only publication configuration. The Verilog below is copied from the qualified artifact writer.\n\n### MorphHDL Scala source\n\n```scala\n{scala}\n```\n\n### Actual generated `Increment61Leaf.v`\n\n```verilog\n{leaf}\n```\n\n### Actual generated `Increment61Top.v`\n\n```verilog\n{top}\n```\n\n### Actual generated source manifest\n\n```text\nIncrement61Leaf.v\nIncrement61Top.v\n```\n'''
          current=docs.read_text()
          if marker in current:
              current=current.split(marker,1)[0].rstrip()
          docs.write_text(current.rstrip()+section)

          text=roadmap.read_text()
          text,count=re.subn(r'(?m)^(- \[) (\] \*\*Increment 61\b)',r'\1x\2',text,count=1)
          if count != 1:
              raise SystemExit('Increment 61 unchecked roadmap entry was not found exactly once')
          roadmap.write_text(text)

          value=json.loads(contract.read_text())
          by_path={entry['path']:entry for entry in value['reviewed_files']}
          by_path[docs.as_posix()]['after_sha256']=hashlib.sha256(docs.read_bytes()).hexdigest()
          roadmap_hash=hashlib.sha256(roadmap.read_bytes()).hexdigest()
          roadmap_entry=by_path[roadmap.as_posix()]
          if 'after_sha256_integrated' in roadmap_entry:
              roadmap_entry['after_sha256_integrated']=roadmap_hash
          else:
              roadmap_entry['after_sha256']=roadmap_hash
          contract.write_text(json.dumps(value,indent=2)+'\n')
          seal=hashlib.sha256(contract.read_bytes()).hexdigest()
          source=checker.read_text()
          source,count=re.subn(r'CONTRACT_SHA256 = "[0-9a-f]{64}"',f'CONTRACT_SHA256 = "{seal}"',source,count=1)
          if count != 1:
              raise SystemExit('Increment 61 source-review seal was not found exactly once')
          checker.write_text(source)
          PY
          git diff --check
          git add \
            docs/morphhdl/increment-61-one-file-per-component.md \
            docs/morphhdl/parameterized-verilog-todo.md \
            morphhdl/contracts/increment-61-source-review.json \
            morphhdl/scripts/check-increment-61-source-review.py
          git diff --cached --check
          remote=$(git ls-remote origin "refs/heads/$FEATURE_BRANCH" | cut -f1)
          test "$remote" = "$before"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m '61: record qualified completion evidence' \
            -m 'Mark Increment 61 complete only after its implementation head passes the exact dual-Scala publication, compatibility, inherited regression, baseline, Mill and source-preservation gates. Record actual generated split Verilog and reseal exact-source review.'
          python3 morphhdl/scripts/check-increment-61-source-review.py
          python3 morphhdl/scripts/check-increment-61-source-review.py --self-test
          git push origin "HEAD:refs/heads/$FEATURE_BRANCH"

      - name: Publish the exact closeout head
        if: steps.state.outputs.merged != 'true'
        id: final
        working-directory: feature
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin "$FEATURE_BRANCH"
          head=$(git rev-parse "origin/$FEATURE_BRANCH")
          test "$(git rev-parse HEAD)" = "$head"
          grep -qE '^- \[x\] \*\*Increment 61\b' docs/morphhdl/parameterized-verilog-todo.md
          grep -q '^## Increment 61 completion evidence$' docs/morphhdl/increment-61-one-file-per-component.md
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-61-v7-prepare
          path: target/increment-61-v7
          if-no-files-found: error
          retention-days: 30

  merge:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.already_merged != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      merge_head: ${{ steps.merged.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-61-controller
          path: controller
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.closeout_head }}
          path: feature
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate exact closeout source
        working-directory: feature
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.prepare.outputs.closeout_head }}'
          python3 morphhdl/scripts/check-increment-61-source-review.py
          python3 morphhdl/scripts/check-increment-61-source-review.py --self-test
          grep -qE '^- \[x\] \*\*Increment 61\b' docs/morphhdl/parameterized-verilog-todo.md
          grep -q '^## Increment 61 completion evidence$' docs/morphhdl/increment-61-one-file-per-component.md

      - name: Require every gate on the closeout SHA
        working-directory: feature
        shell: bash
        run: |
          set -euo pipefail
          python3 ../controller/tools/increment-61-controller.py gate \
            --branch "$FEATURE_BRANCH" --head '${{ needs.prepare.outputs.closeout_head }}' \
            --stage closeout-v7 --output "$GITHUB_WORKSPACE/target/increment-61-v7/closeout"

      - name: Mark ready and merge only the qualified head
        id: merged
        shell: bash
        run: |
          set -euo pipefail
          python3 controller/tools/increment-61-controller.py merge \
            --number "$PR_NUMBER" --head '${{ needs.prepare.outputs.closeout_head }}' \
            --output target/increment-61-v7/merge.json
          sha=$(python3 -c 'import json; print(json.load(open("target/increment-61-v7/merge.json"))["sha"])')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-61-v7-merge
          path: target/increment-61-v7
          if-no-files-found: error
          retention-days: 30

  postmerge:
    needs: [prepare, merge]
    if: always() && needs.prepare.result == 'success' && (needs.prepare.outputs.already_merged == 'true' || needs.merge.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-61-controller
          path: controller
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve the authoritative merged target head
        id: state
        shell: bash
        run: |
          set -euo pipefail
          python3 controller/tools/increment-61-controller.py pr \
            --number "$PR_NUMBER" --output target/increment-61-v7/pr-merged.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value=json.load(open('target/increment-61-v7/pr-merged.json'))
          if not value.get('merged'):
              raise SystemExit('PR #179 is not merged before post-merge qualification')
          print('sha=' + value['merge_commit_sha'])
          PY

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.state.outputs.sha }}
          path: target-branch
          fetch-depth: 0
          persist-credentials: false

      - name: Verify merged source and target identity
        working-directory: target-branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ steps.state.outputs.sha }}'
          remote=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$remote" = '${{ steps.state.outputs.sha }}'
          python3 morphhdl/scripts/check-increment-61-source-review.py
          python3 morphhdl/scripts/check-increment-61-source-review.py --self-test
          grep -qE '^- \[x\] \*\*Increment 61\b' docs/morphhdl/parameterized-verilog-todo.md
          grep -q '^## Increment 61 completion evidence$' docs/morphhdl/increment-61-one-file-per-component.md

      - name: Require the complete post-merge gate set
        working-directory: target-branch
        shell: bash
        run: |
          set -euo pipefail
          python3 ../controller/tools/increment-61-controller.py gate \
            --branch "$TARGET_BRANCH" --head '${{ steps.state.outputs.sha }}' \
            --stage post-merge-v7 --output "$GITHUB_WORKSPACE/target/increment-61-v7/post-merge"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-61-v7-postmerge
          path: target/increment-61-v7
          if-no-files-found: error
          retention-days: 30

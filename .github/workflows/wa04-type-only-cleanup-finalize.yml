name: Final WA-04 type-only cleanup repair

on:
  push:
    branches:
      - agent/wa-04-unnamed-simple-wire-elimination
    paths:
      - ".github/workflows/wa04-type-only-cleanup-finalize.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out WA-04 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep type normalization while preserving ordinary aliases for WA-04
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          bridge = Path("morphhdl-passes/examples/UnnamedWireAliasNativeBridge.scala")
          text = bridge.read_text(encoding="utf-8")
          old = "      nativeAliasPasses.drop(1).reverse.foreach(index => phases.remove(index))\n      phase.foreach { value =>\n        val insertionIndex = phases.indexWhere(_.isInstanceOf[PhaseSimplifyNodes])\n"
          new = "      val postWidthTypeCleanupIndex = nativeAliasPasses(1)\n      phases.update(\n        postWidthTypeCleanupIndex,\n        new PhaseRemoveIntermediateUnnameds(true)\n      )\n      nativeAliasPasses.drop(2).reverse.foreach(index => phases.remove(index))\n      phase.foreach { value =>\n        val insertionIndex = phases.indexWhere(_.isInstanceOf[PhaseSimplifyNodes])\n"
          if text.count(old) != 1:
              raise SystemExit("WA-04 expected the remove-both-full-cleanups phase plan exactly once")
          bridge.write_text(text.replace(old, new), encoding="utf-8")

          signatures_path = Path(
              "morphhdl-passes/tests/formal_model/wire_assignment_ir/expected-signatures.json"
          )
          signatures = json.loads(signatures_path.read_text(encoding="utf-8"))
          for relative in signatures["files"]:
              signatures["files"][relative] = hashlib.sha256(Path(relative).read_bytes()).hexdigest()
          signatures_path.write_text(
              json.dumps(signatures, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          rm .github/workflows/wa04-type-only-cleanup-finalize.yml

          python3 morphhdl-passes/scripts/check-wa03-gates.py --self-test
          python3 morphhdl-passes/scripts/check-wa03-gates.py
          python3 morphhdl-passes/scripts/check-wa04-pass.py --self-test
          python3 morphhdl-passes/scripts/check-wa04-pass.py
          python3 morphhdl-passes/scripts/validate_wire_assignment_equivalence.py --self-test
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "WA-04: retain only type-node cleanup before pass"
          git push origin "HEAD:${GITHUB_REF_NAME}"

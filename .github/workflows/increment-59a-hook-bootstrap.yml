name: Increment 59a hook bootstrap

on:
  push:
    branches:
      - agent/increment-59a-recursive-verilog-module

permissions:
  contents: write

jobs:
  install-validation-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-59a-recursive-verilog-module
          fetch-depth: 0

      - name: Install bounded recursion validation hook
        shell: bash
        env:
          TARGET: morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalParameterizedVerilog.scala
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; import os; p=Path(os.environ["TARGET"]); t=p.read_text(encoding="utf-8"); old="    val components = componentGraph(top)\n    components.foreach(ParameterizedMemory.discover)\n"; new=old+"    BoundedRecursiveModuleValidation.validate(components)\n"; assert t.count(old)==1, "publication hook anchor is not unique"; p.write_text(t.replace(old,new,1),encoding="utf-8")'
          rm .github/workflows/increment-59a-hook-bootstrap.yml
          git diff --check

      - name: Commit validation hook
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MorphHDL Increment Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add morphhdl/src/main/scala/spinal/core/internals/MorphHdlExternalParameterizedVerilog.scala .github/workflows/increment-59a-hook-bootstrap.yml
          git commit -m 'Invoke bounded recursive module validation'
          git push origin HEAD:agent/increment-59a-recursive-verilog-module

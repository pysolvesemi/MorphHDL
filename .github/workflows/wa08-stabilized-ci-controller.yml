name: Evaluate stabilized WA-08 exact-head CI

on:
  push:
    branches:
      - agent/wa-08-production-handoff

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: wa08-stabilized-ci-controller
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          ref: agent/wa-08-production-handoff
          fetch-depth: 0

      - name: Evaluate every workflow on the stabilized trigger
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import os
          import subprocess
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          root = Path.cwd()
          trigger = subprocess.check_output(
              ["git", "log", "--all",
               "--grep=^Trigger final WA-08 stabilized exact-head qualification$",
               "-1", "--format=%H"], cwd=root, text=True
          ).strip()
          if not trigger:
              raise RuntimeError("stabilized WA-08 trigger commit is missing")

          required = {
              "Increment 59c named field vectors",
              "Increment 59g native register bridge qualification",
              "Increment 60c signed declarations",
              "Increment 60d pure SInt casts",
              "Increment 60e signedness boundaries",
              "Increment 60f equivalence closure",
              "Increment 60g default signed Verilog",
              "Increment 62 WA-08 inherited workflow closure",
              "MorphHDL IR pass workspace",
              "MorphHDL baseline",
              "MorphHDL Mill",
              "MorphHDL native source guard",
          }
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "MorphHDL-WA08-stabilized-controller",
          }
          endpoint = (
              "https://api.github.com/repos/" + os.environ["GH_REPOSITORY"] +
              "/actions/runs?" + urllib.parse.urlencode({
                  "head_sha": trigger,
                  "event": "pull_request",
                  "per_page": 100,
              })
          )
          deadline = time.time() + 2400
          runs = []
          while True:
              with urllib.request.urlopen(
                  urllib.request.Request(endpoint, headers=headers), timeout=30
              ) as response:
                  runs = json.load(response).get("workflow_runs", [])
              active = [run for run in runs if run.get("status") != "completed"]
              names = {run.get("name") for run in runs}
              if not active and required <= names and len(runs) >= 45:
                  break
              if time.time() >= deadline:
                  break
              time.sleep(20)

          by_name = {}
          for run in runs:
              name = run.get("name")
              current = by_name.get(name)
              if current is None or run.get("run_attempt", 1) >= current.get("run_attempt", 1):
                  by_name[name] = {
                      key: run.get(key)
                      for key in ("id", "name", "status", "conclusion", "html_url",
                                  "head_sha", "run_attempt", "created_at", "updated_at")
                  }
          missing = sorted(required - set(by_name))
          active = sorted(
              name for name, run in by_name.items()
              if run["status"] != "completed"
          )
          failed = sorted(
              name for name, run in by_name.items()
              if run["status"] == "completed" and
                 run["conclusion"] not in ("success", "skipped", "neutral")
          )
          all_failed = sorted(
              run.get("name") for run in runs
              if run.get("status") == "completed" and
                 run.get("conclusion") not in ("success", "skipped", "neutral")
          )
          report = {
              "trigger": trigger,
              "run_count": len(runs),
              "required": sorted(required),
              "missing": missing,
              "active": active,
              "failed_required": failed,
              "all_failed": all_failed,
              "runs": by_name,
          }
          Path("/tmp/wa08-stabilized-ci-result.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          green = not missing and not active and not failed and not all_failed and len(runs) >= 45
          Path("/tmp/wa08-stabilized-ci-green").write_text("yes\n" if green else "no\n")
          PY

      - name: Restore exact tested head when green
        shell: bash
        run: |
          set -euo pipefail
          trigger="$(git log --all --grep='^Trigger final WA-08 stabilized exact-head qualification$' -1 --format=%H)"
          if test "$(cat /tmp/wa08-stabilized-ci-green)" = yes; then
            lease="$(git rev-parse HEAD)"
            git push --force-with-lease=refs/heads/agent/wa-08-production-handoff:"$lease" \
              origin "$trigger":refs/heads/agent/wa-08-production-handoff
          else
            cp /tmp/wa08-stabilized-ci-result.json docs/morphhdl/wa08-stabilized-ci-failures.json
            rm -f .github/workflows/wa08-stabilized-ci-controller.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --check
            git commit -m "Record stabilized WA-08 workflow failures"
            git push origin HEAD:agent/wa-08-production-handoff
            exit 1
          fi

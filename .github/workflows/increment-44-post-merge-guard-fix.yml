name: Increment 44 post-merge guard repin

on:
  push:
    branches:
      - agent/increment-44-post-merge-guard-fix
  pull_request:
    branches:
      - parameterized-verilog

permissions:
  contents: write

concurrency:
  group: increment-44-post-merge-guard-repin
  cancel-in-progress: true

jobs:
  repin:
    name: Repin preservation manifest to merged Increment 44
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-44-post-merge-guard-fix
          fetch-depth: 0

      - name: Repin approved commit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          target_commit=8a14d1660c551d0b01fa02f9b601aa68cda2fe03
          target_tree=$(git rev-parse "${target_commit}^{tree}")
          manifest=morphhdl/contracts/native-source-preservation.json
          workflow=.github/workflows/increment-44-post-merge-guard-fix.yml

          TARGET_COMMIT="$target_commit" TARGET_TREE="$target_tree" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("morphhdl/contracts/native-source-preservation.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["approved_state"]["commit"] = os.environ["TARGET_COMMIT"]
          data["approved_state"]["tree"] = os.environ["TARGET_TREE"]
          data["approved_state"]["description"] = (
              "Reviewed native-source state at the squashed Increment 44 merge, "
              "with Counter.scala restored and only the approved Increment 37 FIFO delta retained"
          )
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

          git diff --check
          git rm -f --ignore-unmatch -- "$workflow"
          git add -- "$manifest"

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Repin Increment 44 preservation after squash merge"
          git push origin HEAD:agent/increment-44-post-merge-guard-fix

name: Apply Increment 44 reviewed source fix

on:
  pull_request:
    branches:
      - parameterized-verilog

permissions:
  contents: write

concurrency:
  group: apply-increment-44-reviewed-source-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-44-native-counter-stream-flow-reuse
          fetch-depth: 0
      - name: Verify, apply and publish reviewed source fix
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent/increment-44-source-fix.patch.b64.* > /tmp/increment-44-source-fix.patch.b64
          base64 --decode /tmp/increment-44-source-fix.patch.b64 > /tmp/increment-44-source-fix.patch
          echo 'b233936dfb7e43e3cf2c9cea58e00e1d7235995aa1585376b8400a9eea277680  /tmp/increment-44-source-fix.patch' | sha256sum --check
          git apply --check /tmp/increment-44-source-fix.patch
          git apply --index /tmp/increment-44-source-fix.patch
          git show origin/parameterized-verilog:.github/workflows/morphhdl-external-symbolic-width.yml > .github/workflows/morphhdl-external-symbolic-width.yml
          rm -f .github/agent/increment-44-fix.patch.b64.*
          rm -f .github/agent/increment-44-source-fix.patch.b64.*
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix Increment 44 native library reuse failures'
          git push origin HEAD:agent/increment-44-native-counter-stream-flow-reuse

name: Apply Increment 44 focused fix

on:
  push:
    branches:
      - agent/increment-44-native-counter-stream-flow-reuse
    paths:
      - .github/workflows/morphhdl-external-symbolic-width.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed fix and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent/increment-44-fix.patch.b64.* | base64 --decode > /tmp/increment-44-fix.patch
          echo '8f4601b33667364af0d48558ac3caff74d795f8dab139ce5055a77dad7a1e0eb  /tmp/increment-44-fix.patch' | sha256sum --check
          git apply --index /tmp/increment-44-fix.patch
          git show 11c877d0dc11b13178bb391ffc3bf1ac951dd76c:.github/workflows/morphhdl-external-symbolic-width.yml > .github/workflows/morphhdl-external-symbolic-width.yml
          rm -f .github/agent/increment-44-fix.patch.b64.*
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete Increment 44 native library reuse lowering'
          git push origin HEAD:agent/increment-44-native-counter-stream-flow-reuse

name: Increment 44 source snapshot

on:
  pull_request:
    branches:
      - parameterized-verilog

permissions:
  contents: read

concurrency:
  group: increment-44-source-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-44-native-counter-stream-flow-reuse
          fetch-depth: 0
      - name: Package exact branch checkout
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > increment-44-source-head.txt
          tar --exclude=.git --exclude=increment-44-source.tar.gz -czf increment-44-source.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: increment-44-source-${{ github.sha }}
          path: |
            increment-44-source.tar.gz
            increment-44-source-head.txt
          if-no-files-found: error
          retention-days: 1

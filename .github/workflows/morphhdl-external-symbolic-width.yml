name: MorphHDL external symbolic width

on:
  push:
    branches:
      - main
      - parameterized-verilog
  pull_request:
    branches:
      - main
      - parameterized-verilog
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morphhdl-external-symbolic-width-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  proof:
    name: External width proof Scala ${{ matrix.scala_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    strategy:
      fail-fast: false
      matrix:
        scala_version:
          - "2.12.18"
          - "2.13.12"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate the native-source boundary
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f morphhdl/contracts/typed-native-source-overlay.json ]]; then
            python3 morphhdl/scripts/check-typed-native-source-overlay.py
          else
            git diff --exit-code \
              8c4241396cd718a36227dcd89a2e6a29d9077f11 HEAD -- \
              core/src/main/scala/spinal/core/BaseType.scala \
              core/src/main/scala/spinal/core/Bits.scala \
              core/src/main/scala/spinal/core/SInt.scala \
              core/src/main/scala/spinal/core/UInt.scala
          fi

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0-mill.sh \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Validate external width and data-shape contracts
        shell: bash
        run: |
          /tmp/morphhdl-mill frontend[${{ matrix.scala_version }}].testOnly \
            morphhdl.frontend.HdlIntTests
          /tmp/morphhdl-mill morph[${{ matrix.scala_version }}].testOnly \
            spinal.core.internals.ParameterizedVerilogTests \
            spinal.core.internals.ParameterizedDataShapeTests \
            morphhdl.MorphSingleSourceVerilogTests \
            morphhdl.NativeLibraryReuseTests \
            morphhdl.NativeSymbolicMemoryTests \
            morphhdl.ParameterizedStreamFifoDepthTests

  primitive-formals:
    name: Typed primitive formal bindings Scala ${{ matrix.scala_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    env:
      SBT_TEST_PARALLEL: '0'
      MORPHDL_RUN_TYPED_PRIMITIVE_CLOSURE_FORMAL_EQUIVALENCE: '1'
      MORPHDL_TYPED_PRIMITIVE_FORMAL_WORKSPACE: ${{ github.workspace }}/target/typed-primitive-formals/proofs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Retain source and require formal tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/typed-primitive-formals
          git rev-parse HEAD > target/typed-primitive-formals/head.txt
          git rev-parse 'HEAD^{tree}' > target/typed-primitive-formals/tree.txt
          for tool in yosys sby yices-smt2; do command -v "$tool"; done
          yosys -V
          yices-smt2 --version
      - name: Prove canonical child definitions with actual bindings and mutation control
        shell: bash
        run: |
          set -euo pipefail
          sbt -batch '++${{ matrix.scala_version }}' \
            'morph/testOnly morphhdl.TypedPrimitiveClosureFormalEquivalenceTests' \
            > target/typed-primitive-formals/tests.log 2>&1 || { tail -n 250 target/typed-primitive-formals/tests.log; exit 1; }
          python3 - <<'PYCODE'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path('morphhdl/target/test-reports/TEST-morphhdl.TypedPrimitiveClosureFormalEquivalenceTests.xml')
          suite = ET.parse(path).getroot()
          expected = {
              'formal witnesses are independent native elaborations sharing one typed definition',
              'typed primitive closure is formally equivalent with a genuine mutation control',
          }
          cases = suite.findall('testcase')
          assert len(cases) == 2 and {c.get('name') for c in cases} == expected
          assert suite.get('tests') == '2'
          assert all(suite.get(k) == '0' for k in ('failures', 'errors', 'skipped'))
          assert not any(list(suite.iter(k)) for k in ('failure', 'error', 'skipped'))
          PYCODE
      - name: Retain both test reports and every solver workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typed-primitive-formals-${{ matrix.scala_version }}
          path: |
            target/typed-primitive-formals
            morphhdl/target/test-reports/TEST-morphhdl.TypedPrimitiveClosureFormalEquivalenceTests.xml
          if-no-files-found: error
          retention-days: 30

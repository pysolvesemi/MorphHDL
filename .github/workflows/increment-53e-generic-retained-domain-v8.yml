name: Increment 53e focused generic publication

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write

concurrency:
  group: increment-53e-generic-closure
  cancel-in-progress: true

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0

      - name: Prepare checkout
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin parameterized-verilog
          git rev-parse HEAD > /tmp/repair-base.sha

      - name: Materialize generic graph-provenance implementation
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            morphhdl/scripts/apply-increment-53e-address-role-repair.py
            morphhdl/scripts/apply-increment-53e-implicit-child-width-formals.py
            morphhdl/scripts/apply-increment-53e-canonical-implicit-formal-identity.py
            morphhdl/scripts/apply-increment-53e-modular-literal-proof.py
            morphhdl/scripts/apply-increment-53e-materialized-auto-resize-proof.py
            morphhdl/scripts/apply-increment-53e-unfixed-literal-width-inference.py
            morphhdl/scripts/apply-increment-53e-full-domain-width-equivalence.py
            morphhdl/scripts/apply-increment-53e-generic-retained-domain-v2.py
            morphhdl/scripts/apply-increment-53e-generic-retained-domain-v4.py
            morphhdl/scripts/apply-increment-53e-generic-root-schema-equivalence.py
            morphhdl/scripts/apply-increment-53e-generic-retained-expression-evaluator.py
            morphhdl/scripts/apply-increment-53e-generic-comment-cleanup.py
          )
          for script in "${scripts[@]}"; do
            test ! -f "$script" || python3 "$script"
          done
          git diff --check

      - name: Enforce reusable repair boundary
        shell: bash
        run: |
          set -euo pipefail
          base=$(cat /tmp/repair-base.sha)
          test -z "$(git diff --name-only "$base" -- core/src/main lib/src/main idslplugin/src/main)"
          git diff --unified=0 "$base" -- morphhdl/src/main morphruntime/src/main morphplugin/src/main > /tmp/repair.diff
          python3 - <<'PY'
          import re
          from pathlib import Path
          lines=Path('/tmp/repair.diff').read_text().splitlines(); code=[]; block=False
          for line in lines:
              if not line.startswith('+') or line.startswith('+++'): continue
              s=line[1:]; out=[]; i=0
              while i < len(s):
                  if block:
                      j=s.find('*/',i)
                      if j < 0: i=len(s)
                      else: block=False; i=j+2
                  else:
                      b=s.find('/*',i); c=s.find('//',i)
                      if c >= 0 and (b < 0 or c < b): out.append(s[i:c]); i=len(s)
                      elif b >= 0: out.append(s[i:b]); block=True; i=b+2
                      else: out.append(s[i:]); i=len(s)
              code.append(''.join(out))
          executable='\n'.join(code)
          Path('/tmp/repair-code.txt').write_text(executable)
          forbidden=re.compile(r'(?<![A-Za-z0-9_])(?:StreamFifoCC|StreamFifo|BufferCC|pushToPopGray|popToPushGray)(?![A-Za-z0-9_])|Stream\.scala|CrossClock\.scala')
          bad=sorted(set(forbidden.findall(executable)))
          if bad: raise SystemExit('component-specific reusable repair: '+', '.join(bad))
          PY
          grep -q 'RetainedWidthExpressionParser' morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala
          grep -q 'sameRootSchema' morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala
          grep -q 'definitionExpressionRoot' morphruntime/src/main/scala/spinal/core/ExternalNativeIntShadowRegistry.scala

      - name: Install Mill
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe -o /tmp/mill
          chmod +x /tmp/mill

      - name: Compile complete MorphHDL test corpus on Scala 2.12.18
        shell: bash
        run: |
          set -euo pipefail
          /tmp/mill 'morph[2.12.18].test.compile' 2>&1 | tee /tmp/compile-2.12.log

      - name: Focused native contract on Scala 2.12.18
        shell: bash
        run: |
          set -euo pipefail
          /tmp/mill 'morph[2.12.18].testOnly' morphhdl.ParameterizedStreamFifoCCTests 2>&1 | tee /tmp/focused-2.12.log

      - name: Compile complete MorphHDL test corpus on Scala 2.13.12
        shell: bash
        run: |
          set -euo pipefail
          /tmp/mill 'morph[2.13.12].test.compile' 2>&1 | tee /tmp/compile-2.13.log

      - name: Focused native contract on Scala 2.13.12
        shell: bash
        run: |
          set -euo pipefail
          /tmp/mill 'morph[2.13.12].testOnly' morphhdl.ParameterizedStreamFifoCCTests 2>&1 | tee /tmp/focused-2.13.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53e-focused-generic-publication-evidence
          path: |
            /tmp/repair.diff
            /tmp/repair-code.txt
            /tmp/compile-2.12.log
            /tmp/focused-2.12.log
            /tmp/compile-2.13.log
            /tmp/focused-2.13.log
          if-no-files-found: ignore

      - name: Publish passing implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/increment-53e-address-resize-fix.yml
          rm -f .github/workflows/increment-53e-generic-retained-domain-v*.yml
          rm -f .github/workflows/increment-53e-gated-finalize*.yml
          rm -f morphhdl/scripts/apply-increment-53e-*.py
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only origin/parameterized-verilog -- core/src/main lib/src/main idslplugin/src/main)"
          git commit -m 'Increment 53e: generic retained expression equivalence'
          git push origin HEAD:agent/increment-53e-native-streamfifocc-parameterization

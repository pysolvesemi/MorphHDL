name: Offline MorphHDL toolchain export

on:
  push:
    branches:
      - agent/offline-toolchain-export
    paths:
      - .github/workflows/offline-toolchain-export.yml
  pull_request:
    branches:
      - agent/offline-toolchain-base
    paths:
      - .github/workflows/offline-toolchain-export.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-morphhdl-toolchain-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Resolve and compile the exact pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          sbt -batch \
            'idslpayload/Compile/compile' \
            'idslplugin/Compile/packageBin' \
            'sim/Compile/compile' \
            'core/Compile/compile' \
            'lib/Compile/compile' \
            'paramrtl/Compile/compile' \
            'frontend/Compile/compile' \
            'verilogBackend/Compile/compile' \
            'morph/Compile/compile'

      - name: Cache exact downstream SBT and plugin runtime
        shell: bash
        run: |
          set -euo pipefail
          probe=$(mktemp -d)
          mkdir -p "${probe}/project"
          printf '%s\n' 'sbt.version=1.10.2' > "${probe}/project/build.properties"
          printf '%s\n' 'addSbtPlugin("org.scalameta" % "sbt-scalafmt" % "2.4.6")' > "${probe}/project/plugins.sbt"
          printf '%s\n' 'ThisBuild / scalaVersion := "2.12.18"' > "${probe}/build.sbt"
          (
            cd "${probe}"
            sbt -batch about
          )
          test -s "${HOME}/.sbt/boot/scala-2.12.19/org.scala-sbt/sbt/1.10.2/sbt-1.10.2.jar"

      - name: Build a portable offline bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="${GITHUB_WORKSPACE}/offline-bundle"
          rm -rf "${bundle}"
          mkdir -p "${bundle}/workspace" "${bundle}/home" "${bundle}/bin"

          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='offline-bundle' \
            -C "${GITHUB_WORKSPACE}" -cf - . \
            | tar -C "${bundle}/workspace" -xf -

          for item in .cache/coursier .ivy2 .sbt; do
            if [[ -e "${HOME}/${item}" ]]; then
              mkdir -p "${bundle}/home/$(dirname "${item}")"
              cp -a "${HOME}/${item}" "${bundle}/home/${item}"
            fi
          done

          sbt_path=$(command -v sbt)
          cp -a "${sbt_path}" "${bundle}/bin/sbt"
          printf '%s\n' "${sbt_path}" > "${bundle}/sbt-original-path.txt"

          launcher=$(find "$(dirname "$(dirname "$(readlink -f "${sbt_path}")")")" \
            -type f -name 'sbt-launch.jar' -print -quit)
          test -n "${launcher}"
          cp -a "${launcher}" "${bundle}/bin/sbt-launch.jar"
          sha256sum "${bundle}/bin/sbt-launch.jar" \
            > "${bundle}/bin/sbt-launch.jar.sha256"

          cat > "${bundle}/run-offline-sbt.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          root=$(cd "$(dirname "$0")" && pwd)
          export HOME="${root}/home"
          export COURSIER_CACHE="${HOME}/.cache/coursier"
          exec java \
            -Dsbt.offline=true \
            -Dsbt.override.build.repos=false \
            -Dsbt.boot.directory="${HOME}/.sbt/boot" \
            -Dsbt.global.base="${HOME}/.sbt/1.0" \
            -Dsbt.ivy.home="${HOME}/.ivy2" \
            -Dcoursier.cache="${COURSIER_CACHE}" \
            -jar "${root}/bin/sbt-launch.jar" "$@"
          EOF
          chmod +x "${bundle}/run-offline-sbt.sh"

          tar -C "${GITHUB_WORKSPACE}" -czf morphhdl-offline-toolchain.tar.gz offline-bundle
          sha256sum morphhdl-offline-toolchain.tar.gz > morphhdl-offline-toolchain.tar.gz.sha256
          du -h morphhdl-offline-toolchain.tar.gz
          cat morphhdl-offline-toolchain.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: morphhdl-offline-toolchain-81abd255
          path: |
            morphhdl-offline-toolchain.tar.gz
            morphhdl-offline-toolchain.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

name: Increment 52 renderer formatting recovery

on:
  push:
    branches:
      - agent/increment-52-nested-control-flow-clean

permissions:
  contents: write

concurrency:
  group: increment-52-renderer-format
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Increment 52 branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-52-nested-control-flow-clean
          fetch-depth: 0

      - name: Normalize merged renderer block
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 <<'PY'
          import base64
          from pathlib import Path

          path = Path("morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogStructural.scala")
          text = path.read_text()
          start = text.index("  private def renderIf(")
          end = text.index("  private def renderCase(", start)
          replacement = base64.b64decode(
              ""
          ).decode()
          path.write_text(text[:start] + replacement + text[end:])
          PY
          rm .github/workflows/increment-52-format-recovery.yml
          git add -A
          git diff --cached --check
          git commit -m "Normalize merged Increment 52 renderer formatting"
          git push origin HEAD:agent/increment-52-nested-control-flow-clean

name: Increment 59a roadmap bootstrap

on:
  push:
    branches:
      - agent/increment-59a-recursive-verilog-module

permissions:
  contents: write

jobs:
  define-roadmap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-59a-recursive-verilog-module
          fetch-depth: 0

      - name: Define approved successor increments
        shell: bash
        env:
          ROADMAP_SECTION_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('docs/morphhdl/parameterized-verilog-todo.md')
          text = path.read_text(encoding='utf-8')
          anchor = '## Completion target\n'
          section = base64.b64decode(os.environ['ROADMAP_SECTION_B64']).decode('utf-8')
          if text.count(anchor) != 1:
              raise SystemExit('roadmap completion target is not unique')
          if 'Increment 59a — Bounded recursive Verilog module generation and proof' in text:
              raise SystemExit('Increment 59a already exists')
          if 'Increment 59b — Typed parameterized Vec reduceBalancedTree' in text:
              raise SystemExit('Increment 59b already exists')
          path.write_text(text.replace(anchor, section + anchor, 1), encoding='utf-8')
          PY
          rm .github/workflows/increment-59a-roadmap-bootstrap.yml
          git diff --check

      - name: Commit roadmap definition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MorphHDL Increment Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/morphhdl/parameterized-verilog-todo.md .github/workflows/increment-59a-roadmap-bootstrap.yml
          git commit -m 'Define Increments 59a and 59b roadmap'
          git push origin HEAD:agent/increment-59a-recursive-verilog-module

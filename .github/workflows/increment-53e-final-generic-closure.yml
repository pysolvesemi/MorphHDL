name: Increment 53e final generic closure

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: increment-53e-final-generic-closure
  cancel-in-progress: true

jobs:
  close:
    if: ${{ hashFiles('.morphhdl/increment-53e-final-ready') != '' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    timeout-minutes: 240
    env:
      MORPHDL_RUN_STREAMFIFOCC_PROOF: "1"
      MORPHDL_STREAMFIFOCC_PROOF_WORKSPACE: /tmp/increment-53e-proof
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0

      - name: Prepare stable feature checkout
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin parameterized-verilog agent/increment-53e-native-streamfifocc-parameterization
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/increment-53e-native-streamfifocc-parameterization)"
          git merge --no-edit origin/parameterized-verilog
          git rev-parse HEAD > /tmp/increment-53e-materialization-base.sha

      - name: Materialize the generic implementation
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            morphhdl/scripts/apply-increment-53e-address-role-repair.py
            morphhdl/scripts/apply-increment-53e-implicit-child-width-formals.py
            morphhdl/scripts/apply-increment-53e-canonical-implicit-formal-identity.py
            morphhdl/scripts/apply-increment-53e-modular-literal-proof.py
            morphhdl/scripts/apply-increment-53e-materialized-auto-resize-proof.py
            morphhdl/scripts/apply-increment-53e-unfixed-literal-width-inference.py
            morphhdl/scripts/apply-increment-53e-full-domain-width-equivalence.py
            morphhdl/scripts/apply-increment-53e-generic-retained-domain-v2.py
            morphhdl/scripts/apply-increment-53e-generic-retained-domain-v4.py
            morphhdl/scripts/apply-increment-53e-generic-root-schema-equivalence.py
            morphhdl/scripts/apply-increment-53e-generic-retained-expression-evaluator.py
            morphhdl/scripts/apply-increment-53e-generic-native-runtime-selection.py
            morphhdl/scripts/apply-increment-53e-generic-native-compiler-selection.py
            morphhdl/scripts/apply-increment-53e-generic-comment-cleanup.py
            morphhdl/scripts/apply-increment-53e-proof-api-alignment.py
            morphhdl/scripts/apply-increment-53e-proof-api-alignment-v2.py
          )
          for script in "${scripts[@]}"; do
            if test -f "$script"; then
              echo "Applying $script"
              python3 "$script"
            fi
          done
          git diff --check

      - name: Enforce genericity and source preservation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only origin/parameterized-verilog -- core/src/main lib/src/main idslplugin/src/main)"
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala'),
              Path('morphruntime/src/main/scala/spinal/core/ExternalNativeIntShadowRegistry.scala'),
              Path('morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala'),
              Path('morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogHierarchy.scala'),
              Path('morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogMemories.scala'),
          ]
          forbidden = re.compile(
              r'(?<![A-Za-z0-9_])(?:StreamFifoCC|StreamFifo|BufferCC|pushToPopGray|popToPushGray)(?![A-Za-z0-9_])'
              r'|/lib/src/main/scala/spinal/lib/(?:Stream|CrossClock)\.scala'
          )
          failures = []
          for path in paths:
              if not path.exists():
                  continue
              text = path.read_text()
              text = re.sub(r'/\*.*?\*/', '', text, flags=re.S)
              text = re.sub(r'//.*', '', text)
              found = sorted(set(forbidden.findall(text)))
              if found:
                  failures.append(f'{path}: {found}')
          if failures:
              raise SystemExit(
                  'component-specific recognition remains in the reusable engine:\n' +
                  '\n'.join(failures)
              )
          PY
          grep -q 'contains("/lib/src/main/scala/spinal/")' \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala
          grep -q 'argumentName: String' \
            morphruntime/src/main/scala/spinal/core/ExternalNativeIntShadowRegistry.scala
          grep -q 'RetainedWidthExpressionParser' \
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala
          grep -q 'provesEquivalentOnCompleteRetainedDomain' \
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala
          grep -q 'new spinal.lib.StreamFifoCC' \
            morphhdl/src/test/scala/morphhdl/NativeStreamFifoCCProofTests.scala

      - name: Install pinned Mill
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            -o /tmp/mill
          chmod +x /tmp/mill

      - name: Compile and validate Scala 2.12.18
        shell: bash
        run: |
          set -o pipefail
          /tmp/mill 'morph[2.12.18].test.compile' \
            2>&1 | tee /tmp/increment-53e-compile-2.12.log
          /tmp/mill 'morph[2.12.18].testOnly' \
            morphhdl.ParameterizedStreamFifoCCTests \
            morphhdl.NativeStreamFifoFormalEquivalenceTests \
            2>&1 | tee /tmp/increment-53e-contract-2.12.log

      - name: Compile and validate Scala 2.13.12
        shell: bash
        run: |
          set -o pipefail
          /tmp/mill 'morph[2.13.12].test.compile' \
            2>&1 | tee /tmp/increment-53e-compile-2.13.log
          /tmp/mill 'morph[2.13.12].testOnly' \
            morphhdl.ParameterizedStreamFifoCCTests \
            morphhdl.NativeStreamFifoFormalEquivalenceTests \
            2>&1 | tee /tmp/increment-53e-contract-2.13.log

      - name: Run independent-clock, synthesis and formal proof on Scala 2.12.18
        shell: bash
        run: |
          set -o pipefail
          rm -rf /tmp/increment-53e-proof
          mkdir -p /tmp/increment-53e-proof
          /tmp/mill 'morph[2.12.18].testOnly' \
            morphhdl.NativeStreamFifoCCProofTests \
            2>&1 | tee /tmp/increment-53e-proof-2.12.log

      - name: Run independent-clock, synthesis and formal proof on Scala 2.13.12
        shell: bash
        run: |
          set -o pipefail
          rm -rf /tmp/increment-53e-proof
          mkdir -p /tmp/increment-53e-proof
          /tmp/mill 'morph[2.13.12].testOnly' \
            morphhdl.NativeStreamFifoCCProofTests \
            2>&1 | tee /tmp/increment-53e-proof-2.13.log

      - name: Install permanent canonical workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/morphhdl-native-streamfifocc-parameterization.yml <<'YAML'
          name: MorphHDL native StreamFifoCC parameterization

          on:
            push:
              branches:
                - parameterized-verilog
                - agent/increment-53e-native-streamfifocc-parameterization
            pull_request:
              branches:
                - parameterized-verilog

          permissions:
            contents: read

          jobs:
            contract:
              runs-on: ubuntu-latest
              container:
                image: ghcr.io/spinalhdl/docker:latest
              timeout-minutes: 180
              strategy:
                fail-fast: false
                matrix:
                  scala: ["2.12.18", "2.13.12"]
              steps:
                - uses: actions/checkout@v4
                - name: Preserve native SpinalHDL sources
                  shell: bash
                  run: |
                    set -euo pipefail
                    git diff --exit-code morphhdl-baseline-2026-08-12 -- \
                      core/src/main lib/src/main idslplugin/src/main
                - name: Install pinned Mill
                  shell: bash
                  run: |
                    set -euo pipefail
                    curl --fail --location --retry 5 --retry-all-errors \
                      https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
                      -o /tmp/mill
                    chmod +x /tmp/mill
                - name: Compile complete MorphHDL test corpus
                  shell: bash
                  run: /tmp/mill 'morph[${{ matrix.scala }}].test.compile'
                - name: Run native StreamFifoCC contract
                  shell: bash
                  run: |
                    /tmp/mill 'morph[${{ matrix.scala }}].testOnly' \
                      morphhdl.ParameterizedStreamFifoCCTests

            proof:
              runs-on: ubuntu-latest
              container:
                image: ghcr.io/spinalhdl/docker:latest
              timeout-minutes: 240
              strategy:
                fail-fast: false
                matrix:
                  scala: ["2.12.18", "2.13.12"]
              env:
                MORPHDL_RUN_STREAMFIFOCC_PROOF: "1"
                MORPHDL_STREAMFIFOCC_PROOF_WORKSPACE: /tmp/increment-53e-proof
              steps:
                - uses: actions/checkout@v4
                - name: Install pinned Mill
                  shell: bash
                  run: |
                    set -euo pipefail
                    curl --fail --location --retry 5 --retry-all-errors \
                      https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
                      -o /tmp/mill
                    chmod +x /tmp/mill
                - name: Run independent-clock and formal proof
                  shell: bash
                  run: |
                    rm -rf /tmp/increment-53e-proof
                    mkdir -p /tmp/increment-53e-proof
                    /tmp/mill 'morph[${{ matrix.scala }}].testOnly' \
                      morphhdl.NativeStreamFifoCCProofTests
          YAML

      - name: Close roadmap and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/morphhdl/parameterized-verilog-todo.md')
          text = path.read_text()
          open_line = '- [ ] **Increment 53e — Native StreamFifoCC parameterization without source edits**'
          closed_line = '- [x] **Increment 53e — Native StreamFifoCC parameterization without source edits**'
          if closed_line not in text:
              if text.count(open_line) != 1:
                  raise SystemExit('Increment 53e roadmap marker is missing or ambiguous')
              text = text.replace(open_line, closed_line, 1)
          path.write_text(text)
          PY
          rm -f .morphhdl/increment-53e-final-ready
          rm -f .github/workflows/increment-53e-*.yml
          rm -f morphhdl/scripts/apply-increment-53e-*.py
          rm -rf morphhdl/diagnostics
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only origin/parameterized-verilog -- core/src/main lib/src/main idslplugin/src/main)"

      - name: Publish clean feature head
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'Increment 53e: generic native StreamFifoCC parameterization'
          git push origin HEAD:agent/increment-53e-native-streamfifocc-parameterization
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open or update Increment 53e pull request
        shell: bash
        env:
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          head = 'agent/increment-53e-native-streamfifocc-parameterization'
          base = 'parameterized-verilog'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'User-Agent': 'MorphHDL-Increment-53e',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          query = urllib.parse.urlencode({
              'state': 'open',
              'head': f'pysolvesemi:{head}',
              'base': base,
              'per_page': 100,
          })
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/pulls?{query}',
              headers=headers,
          )
          with urllib.request.urlopen(request) as response:
              pulls = json.load(response)
          body = {
              'title': 'Increment 53e: generic native StreamFifoCC parameterization',
              'head': head,
              'base': base,
              'body': (
                  'Uses the exact untouched spinal.lib.StreamFifoCC. '
                  'The compiler/runtime and width-equivalence mechanisms are '
                  'generic graph/provenance rules with no StreamFifo, '
                  'StreamFifoCC, BufferCC, source-file, or signal-name '
                  'recognition. Includes dual-Scala compilation, independent '
                  'asynchronous-clock simulation, synthesis, concrete native '
                  'witness equivalence at depths 4/8/16 in both reset modes, '
                  'and a mutation negative control.'
              ),
          }
          if pulls:
              number = pulls[0]['number']
              patch = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/pulls/{number}',
                  data=json.dumps({'title': body['title'], 'body': body['body']}).encode(),
                  headers=headers,
                  method='PATCH',
              )
              with urllib.request.urlopen(patch) as response:
                  json.load(response)
          else:
              create = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/pulls',
                  data=json.dumps(body).encode(),
                  headers=headers,
                  method='POST',
              )
              with urllib.request.urlopen(create) as response:
                  json.load(response)
          PY

      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53e-final-generic-closure-evidence
          path: |
            /tmp/increment-53e-compile-2.12.log
            /tmp/increment-53e-contract-2.12.log
            /tmp/increment-53e-compile-2.13.log
            /tmp/increment-53e-contract-2.13.log
            /tmp/increment-53e-proof-2.12.log
            /tmp/increment-53e-proof-2.13.log
            /tmp/increment-53e-proof
          if-no-files-found: ignore

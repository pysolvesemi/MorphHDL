name: WA-04 native phase contract fix

on:
  push:
    branches:
      - agent/wa-04-unnamed-simple-wire-elimination
    paths:
      - ".github/workflows/wa04-phase-contract-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Phase netlist-impact contract and refresh signature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source = Path("morphhdl-passes/examples/UnnamedWireAliasNativeBridge.scala")
          text = source.read_text(encoding="utf-8")
          marker = "  override def impl(pc: PhaseContext): Unit = {"
          replacement = (
              "  override def hasNetlistImpact: Boolean = true\n\n"
              "  override def impl(pc: PhaseContext): Unit = {"
          )
          if "override def hasNetlistImpact: Boolean = true" not in text:
              if text.count(marker) != 1:
                  raise SystemExit("unable to identify the unique native phase implementation")
              text = text.replace(marker, replacement, 1)
              source.write_text(text, encoding="utf-8")

          registry = Path("morphhdl-passes/tests/formal_model/wire_assignment_ir/expected-signatures.json")
          value = json.loads(registry.read_text(encoding="utf-8"))
          relative = source.as_posix()
          value["files"][relative] = hashlib.sha256(source.read_bytes()).hexdigest()
          registry.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morphhdl-passes/examples/UnnamedWireAliasNativeBridge.scala \
            morphhdl-passes/tests/formal_model/wire_assignment_ir/expected-signatures.json
          git diff --cached --check
          git commit -m "WA-04: satisfy native Phase netlist-impact contract"
          git push origin "HEAD:${GITHUB_REF_NAME}"

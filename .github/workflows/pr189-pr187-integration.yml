name: PR189 integration with merged PR187

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  actions: read

concurrency:
  group: pr189-pr187-integration-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: '1'
  SBT_TEST_PARALLEL: '0'
  JAVA_TOOL_OPTIONS: '-Xmx2g -XX:ActiveProcessorCount=2'
  JVM_OPTS: '-Xmx4g -Xss2m -XX:ActiveProcessorCount=2'

jobs:
  source:
    name: Compose and seal both qualified source reviews without publishing refs
    if: >-
      github.event.review.state == 'commented' &&
      github.event.review.user.login == github.repository_owner && github.actor == github.repository_owner &&
      github.repository == 'pysolvesemi/MorphHDL' && github.event.pull_request.number == 189 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/cdc-independent-parameter-consumers' &&
      github.event.pull_request.base.ref == 'parameterized-verilog' &&
      github.event.review.commit_id == github.event.pull_request.head.sha &&
      (github.event.review.body == format('pr189:prepare-pr187:{0}', github.event.pull_request.head.sha) ||
       startsWith(github.event.review.body, format('pr189:seal-pr187:{0}:', github.event.pull_request.head.sha)))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      EXPECTED_INPUT: ${{ github.event.pull_request.head.sha }}
      EVIDENCE: /tmp/pr189-pr187-source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate exact parents and any previously checked source handoff
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process'),crypto=require('crypto');
            const left='1fb79c663b3db9e6a162fd48c08632c24f63c73e',target='f5049ae2abfe5a47cd1fac3574ea08d630bd183f';
            const head=process.env.EXPECTED_INPUT,body=context.payload.review.body;
            const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();
            const {data:pr}=await github.rest.pulls.get({...context.repo,pull_number:189});
            const {data:ref}=await github.rest.git.getRef({...context.repo,ref:'heads/parameterized-verilog'});
            if(pr.state!=='open'||pr.merged||pr.head.sha!==head||ref.object.sha!==target||git('rev-parse','HEAD')!==head)throw new Error('PR head or target moved');
            fs.mkdirSync(process.env.EVIDENCE,{recursive:true});
            if(body==='pr189:prepare-pr187:'+head){
              const runs=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{...context.repo,head_sha:left,event:'workflow_dispatch',created:'>=2026-09-17T15:45:00Z',per_page:100});
              if(runs.length!==48||new Set(runs.map(r=>r.path)).size!==48||runs.some(r=>r.head_sha!==left||r.conclusion!=='success'))throw new Error('Original 48-workflow qualification is incomplete');
              const {data:compact}=await github.rest.actions.getJobForWorkflowRun({...context.repo,job_id:105274220444});
              if(compact.head_sha!==left||compact.conclusion!=='success'||!compact.steps.some(s=>s.name==='Execute both unchanged full-compact command blocks from their authenticated definition'&&s.conclusion==='success'))throw new Error('Original compact qualification is incomplete');
              fs.writeFileSync(process.env.EVIDENCE+'/qualified-parents.json',JSON.stringify({head,left,target,runs,compact},null,2));
              core.exportVariable('INTEGRATION_MODE','prepare');
            }else{
              const match=body.match(/^pr189:seal-pr187:([0-9a-f]{40}):(\d+)$/);
              if(!match||match[1]!==head)throw new Error('Malformed source publication receipt selector');
              const runId=Number(match[2]);
              const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:runId});
              if(run.conclusion!=='success'||run.path!=='.github/workflows/pr189-pr187-integration.yml'||run.head_branch!==pr.head.ref)throw new Error('Preparation run was not successful');
              const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:runId,per_page:100});
              if(!jobs.some(j=>j.conclusion==='success'&&j.steps?.some(s=>s.name==='Compose source adapters and execute every source rejection group'&&s.conclusion==='success')))throw new Error('Missing actual source checks');
              const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{...context.repo,run_id:runId,per_page:100});
              const selected=artifacts.filter(a=>a.name==='pr189-pr187-source-'+run.head_sha+'-'+run.run_attempt&&!a.expired);
              if(selected.length!==1)throw new Error('Ambiguous source artifact');
              const a=selected[0],{data:bytes}=await github.rest.actions.downloadArtifact({...context.repo,artifact_id:a.id,archive_format:'zip'});
              const zip=Buffer.from(bytes),digest='sha256:'+crypto.createHash('sha256').update(zip).digest('hex');
              if(a.digest!==digest)throw new Error('Source artifact digest changed');
              const file=process.env.EVIDENCE+'/preparation.zip';fs.writeFileSync(file,zip);
              const result=JSON.parse(cp.execFileSync('python3',['-c','import json,sys,zipfile\nz=zipfile.ZipFile(sys.argv[1])\nnames=["source-pass.json","source-handoff.json"]\nassert all(z.getinfo(n).file_size<200000 for n in names)\nprint(json.dumps([json.loads(z.read(n)) for n in names]))',file],{encoding:'utf8'}));
              const [receipt,handoff]=result;
              if(receipt.input!==run.head_sha||receipt.target!==target||receipt.left!==left||receipt.source_groups!==23||receipt.compiler_sources_unchanged!==true||handoff.input!==run.head_sha||handoff.source_tree!==receipt.source_tree||git('rev-parse','HEAD^{tree}')!==receipt.source_tree||git('show','-s','--format=%P','HEAD')!==run.head_sha)throw new Error('Published source does not match actual checked source');
              core.exportVariable('CHECKED_SOURCE_TREE',receipt.source_tree);
              core.exportVariable('INTEGRATION_MODE','seal');
            }
      - name: Compose source adapters and execute every source rejection group
        env:
          GH_OBJECT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 repro/cdc-independent-parameters/prepare_pr187_integration.py \
            --mode "$INTEGRATION_MODE" 2>&1 | tee "$EVIDENCE/prepare.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr189-pr187-source-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: /tmp/pr189-pr187-source/
          if-no-files-found: error
          retention-days: 30

  qualify:
    name: Dispatch combined pre-merge qualification once after exact-source success
    if: >-
      github.event.review.state == 'commented' &&
      github.event.review.user.login == github.repository_owner && github.actor == github.repository_owner &&
      github.repository == 'pysolvesemi/MorphHDL' && github.event.pull_request.number == 189 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/cdc-independent-parameter-consumers' &&
      github.event.pull_request.base.ref == 'parameterized-verilog' &&
      github.event.review.commit_id == github.event.pull_request.head.sha &&
      startsWith(github.event.review.body, format('pr189:qualify-pr187:{0}:', github.event.pull_request.head.sha))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    outputs:
      head: ${{ steps.dispatch.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate sealed commit and dispatch only missing exact-head workflows
        id: dispatch
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process'),crypto=require('crypto');
            const head=context.payload.pull_request.head.sha,target='f5049ae2abfe5a47cd1fac3574ea08d630bd183f',left='1fb79c663b3db9e6a162fd48c08632c24f63c73e';
            const branch='agent/cdc-independent-parameter-consumers',dir='/tmp/pr189-pr187-qualification';fs.mkdirSync(dir,{recursive:true});
            const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();
            const match=context.payload.review.body.match(/^pr189:qualify-pr187:([0-9a-f]{40}):(\d+)$/);
            if(!match||match[1]!==head||git('rev-parse','HEAD')!==head)throw new Error('Wrong qualification selector');
            async function guard(){
              const {data:p}=await github.rest.pulls.get({...context.repo,pull_number:189});
              const {data:r}=await github.rest.git.getRef({...context.repo,ref:'heads/parameterized-verilog'});
              if(p.state!=='open'||p.merged||p.head.sha!==head||p.head.ref!==branch||r.object.sha!==target)throw new Error('PR or target moved');
            }
            await guard();
            const runId=Number(match[2]),{data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:runId});
            if(run.conclusion!=='success'||run.path!=='.github/workflows/pr189-pr187-integration.yml'||run.head_branch!==branch)throw new Error('Missing passed seal run');
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:runId,per_page:100});
            if(!jobs.some(j=>j.conclusion==='success'&&j.steps?.some(s=>s.name==='Compose source adapters and execute every source rejection group'&&s.conclusion==='success')))throw new Error('Missing source payload');
            const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{...context.repo,run_id:runId,per_page:100});
            const selected=artifacts.filter(a=>a.name==='pr189-pr187-source-'+run.head_sha+'-'+run.run_attempt&&!a.expired);
            if(selected.length!==1)throw new Error('Ambiguous seal artifact');
            const a=selected[0],{data:data}=await github.rest.actions.downloadArtifact({...context.repo,artifact_id:a.id,archive_format:'zip'});
            const zip=Buffer.from(data);if(a.digest!=='sha256:'+crypto.createHash('sha256').update(zip).digest('hex'))throw new Error('Seal ZIP mismatch');
            fs.writeFileSync(dir+'/seal.zip',zip);
            const receipt=JSON.parse(cp.execFileSync('python3',['-c','import json,sys,zipfile\nz=zipfile.ZipFile(sys.argv[1])\nassert z.getinfo("source-pass.json").file_size<200000\nprint(z.read("source-pass.json").decode())',dir+'/seal.zip'],{encoding:'utf8'}));
            if(receipt.input!==run.head_sha||receipt.candidate!==head||receipt.tree!==git('rev-parse','HEAD^{tree}')||receipt.target!==target||receipt.left!==left||receipt.source_groups!==23||receipt.compiler_sources_unchanged!==true||git('show','-s','--format=%P','HEAD')!==run.head_sha)throw new Error('Wrong exact sealed candidate');
            for(const script of ['check-increment-62-wa08-source-overlay.py','check-increment-61-source-review.py','check-native-source-preservation.py','check-lane-when-source-scope.py']){
              cp.execFileSync('python3',['morphhdl/scripts/'+script],{stdio:'inherit',timeout:600000});
            }
            const {data:historyBytes}=await github.rest.actions.downloadArtifact({...context.repo,artifact_id:10506340324,archive_format:'zip'});
            const history=Buffer.from(historyBytes);
            if(crypto.createHash('sha256').update(history).digest('hex')!=='261fa1461fad1b32cadd6a9dff3251fe8e455164405a9195dc17a700d184c5a9')throw new Error('Original full inventory changed');
            fs.writeFileSync(dir+'/original-full.zip',history);
            const old=JSON.parse(cp.execFileSync('python3',['-c','import json,sys,zipfile\nz=zipfile.ZipFile(sys.argv[1])\nprint(json.dumps([json.loads(z.read(n)) for n in ("full-dispatch.json","applicability.json")]))',dir+'/original-full.zip'],{encoding:'utf8'}));
            if(old[0].head!==left||old[0].dispatched.length!==48||old[1].not_applicable.length!==11)throw new Error('Original inventory is not closed');
            const names=new Set(old[0].dispatched.map(r=>r.path));names.add('.github/workflows/lane-when-expression-diagnostic.yml');
            if(names.size!==49)throw new Error('Combined standard workflow inventory differs');
            for(const item of old[1].not_applicable){
              if(item.qualification_pass!==false||names.has(item.path)||git('rev-parse','HEAD:'+item.path)!==item.blob||git('rev-parse',target+':'+item.path)!==item.blob)throw new Error('Historical routing exclusion changed');
            }
            const definitions=await github.paginate(github.rest.actions.listRepoWorkflows,{...context.repo,per_page:100});
            const existing=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{...context.repo,head_sha:head,event:'workflow_dispatch',per_page:100});
            const rows=[];
            for(const path of [...names].sort()){
              await guard();
              const definition=definitions.filter(w=>w.path===path&&w.state==='active');
              if(definition.length!==1||!/^  workflow_dispatch:/m.test(git('show','HEAD:'+path)))throw new Error('Missing dispatchable workflow: '+path);
              const already=existing.filter(r=>r.path===path&&r.head_sha===head&&r.head_branch===branch);
              if(already.length>1)throw new Error('Duplicate existing runs: '+path);
              const row={path,workflow_id:definition[0].id,reused_run:already[0]?.id,requested_at:new Date().toISOString()};
              if(!already.length)await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:definition[0].id,ref:branch,...(path.endsWith('/cdc-independent-parameter-consumers.yml')?{inputs:{mode:'checks'}}:{})});
              rows.push(row);fs.writeFileSync(dir+'/full-dispatch.json',JSON.stringify({head,target,pre_merge:true,post_merge_ci:false,workflows:rows,not_applicable:old[1].not_applicable},null,2));
              core.info((already.length?'REUSED_EXISTING_RUN ':'PRE_MERGE_DISPATCHED ')+path);
            }
            await guard();core.setOutput('head',head);
            core.info('PRE_MERGE_QUALIFICATION_DISPATCH_COMPLETE count=49; dispatch is not a passing result. No merge or post-merge CI is authorized by this controller.');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr189-pr187-qualification-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: /tmp/pr189-pr187-qualification/
          if-no-files-found: error
          retention-days: 30

  compact:
    name: Combined-source compact timeout and record behavioral qualification
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      EXPECTED_HEAD: ${{ needs.qualify.outputs.head }}
      EVIDENCE: /tmp/pr189-pr187-compact
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.qualify.outputs.head }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Execute unchanged compact and record compiler checks plus all source groups
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,subprocess,textwrap
          from pathlib import Path
          ref='05e8f46b76c39017958b98c36b04475493446cef'
          path='.github/workflows/pr189-compact-timeout.yml'
          def git(*args):return subprocess.check_output(['git',*args],text=True,timeout=120).strip()
          assert git('rev-parse','HEAD')==os.environ['EXPECTED_HEAD']
          assert git('rev-parse',ref+':'+path)=='4c4d1ed908df6ab4c150d736b7cef57b9918241a'
          source=git('show',ref+':'+path);marker='\n  full-compact-current:\n'
          assert source.count(marker)==1
          blocks=re.findall(r'^        run: \|\n((?:          [^\n]*\n|\n)+)',source.split(marker,1)[1]+'\n',re.M)
          assert len(blocks)==2
          evidence=Path(os.environ['EVIDENCE']);evidence.mkdir(parents=True,exist_ok=True)
          for index,block in enumerate(blocks,1):
              command=textwrap.dedent(block)
              (evidence/('original-command-'+str(index)+'.sh')).write_text(command)
              subprocess.run(['bash','-e','-o','pipefail','-c',command],check=True)
          assert git('rev-parse','HEAD')==os.environ['EXPECTED_HEAD']
          subprocess.run(['git','diff','--exit-code'],check=True)
          subprocess.run(['git','diff','--cached','--exit-code'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr189-pr187-compact-${{ needs.qualify.outputs.head }}-${{ github.run_attempt }}
          path: /tmp/pr189-pr187-compact/
          if-no-files-found: error
          retention-days: 30

# No automatic merge, target update, force push or post-merge workflow run.
# The final reviewed merge must preserve its qualified tree and use [skip ci].

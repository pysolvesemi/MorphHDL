name: PR189 integration with merged PR187

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  actions: read

concurrency:
  group: pr189-pr187-integration-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect exact qualified parents and merge conflicts without publishing
    if: >-
      github.event.review.state == 'commented' &&
      github.event.review.user.login == github.repository_owner && github.actor == github.repository_owner &&
      github.repository == 'pysolvesemi/MorphHDL' && github.event.pull_request.number == 189 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/cdc-independent-parameter-consumers' &&
      github.event.pull_request.base.ref == 'parameterized-verilog' &&
      github.event.review.commit_id == github.event.pull_request.head.sha &&
      github.event.review.body == format('pr189:inspect-pr187:{0}', github.event.pull_request.head.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record both original qualified sources and the exact integration conflicts
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_INPUT: ${{ github.event.pull_request.head.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr189-pr187-review"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,tarfile,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr189-pr187-review'
          left='1fb79c663b3db9e6a162fd48c08632c24f63c73e'
          right='f5049ae2abfe5a47cd1fac3574ea08d630bd183f'
          base='27af65abbee0d2334d6be7a6e4e2408b8af32fd9'
          control='.github/workflows/pr189-pr187-integration.yml'
          def git(*args):
              return subprocess.check_output(['git',*args],timeout=120)
          def get(path):
              request=urllib.request.Request('https://api.github.com/repos/pysolvesemi/MorphHDL/'+path,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=60) as response: return json.load(response)
          head=git('rev-parse','HEAD').decode().strip()
          assert head==os.environ['EXPECTED_INPUT']
          assert git('show','-s','--format=%P',head).decode().strip()==left
          assert git('diff','--name-only',left,head).decode().splitlines()==[control]
          assert not git('status','--porcelain')
          pr=get('pulls/189'); target=get('git/ref/heads/parameterized-verilog'); merged=get('pulls/187')
          assert pr['state']=='open' and not pr['merged'] and pr['head']['sha']==head
          assert target['object']['sha']==right and merged['merged'] and merged['merge_commit_sha']==right
          assert git('merge-base',left,right).decode().strip()==base
          runs=get('actions/runs?head_sha='+left+'&event=workflow_dispatch&created=%3E%3D2026-09-17T15%3A45%3A00Z&per_page=100')
          assert runs['total_count']==48 and len(runs['workflow_runs'])==48
          assert len({row['path'] for row in runs['workflow_runs']})==48
          assert all(row['head_sha']==left and row['conclusion']=='success' for row in runs['workflow_runs'])
          compact=get('actions/jobs/105274220444')
          assert compact['conclusion']=='success' and compact['head_sha']==left
          assert any(s['name']=='Execute both unchanged full-compact command blocks from their authenticated definition' and s['conclusion']=='success' for s in compact['steps'])
          result=subprocess.run(['git','merge-tree','--write-tree','--messages',left,right],capture_output=True,timeout=120)
          assert result.returncode in (0,1)
          (out/'merge-tree.txt').write_bytes(result.stdout+result.stderr)
          (out/'full-runs.json').write_text(json.dumps(runs,indent=2)+'\n')
          (out/'compact-job.json').write_text(json.dumps(compact,indent=2)+'\n')
          paths=set()
          for commit in (left,right):
              paths.update(git('diff','--name-only',base,commit).decode().splitlines())
          extra={'build.sbt','build.mill','docs/morphhdl/parameterized-verilog-todo.md'}
          for label,commit in (('base',base),('pr189',left),('pr187',right)):
              names=git('ls-tree','-r','--name-only',commit).decode().splitlines()
              selected=[p for p in names if p in paths or p in extra or p.endswith('AGENTS.md') or
                  p.startswith(('.github/workflows/','morphhdl/scripts/','morphhdl/contracts/','morphhdl-passes/scripts/'))]
              with (out/(label+'-review.tar')).open('wb') as handle:
                  subprocess.run(['git','archive','--format=tar',commit,'--',*selected],stdout=handle,check=True,timeout=120)
              (out/(label+'-changes.patch')).write_bytes(git('diff','--binary',base,commit))
          identity={'input':head,'qualified_pr189':left,'qualified_target':right,'common_base':base,
                    'merge_conflicts':result.returncode==1,'full48_pass':True,'compact_pass':True,
                    'remote_ref_written':False,'qualification_dispatched':False}
          (out/'identity.json').write_text(json.dumps(identity,indent=2)+'\n')
          print(json.dumps(identity,indent=2)); print(result.stdout.decode())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr189-pr187-review-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pr189-pr187-review/
          if-no-files-found: error
          retention-days: 30

# This inspection cannot publish a merge or start a duplicate workflow fleet.
# Final merge must preserve the qualified tree and use [skip ci].

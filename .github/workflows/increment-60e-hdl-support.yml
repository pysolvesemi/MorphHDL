name: Increment 60e HDL support
on:
  push:
    branches: ['agent/increment-60e-signedness-boundaries']
    paths: ['.github/workflows/increment-60e-hdl-support.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain immutable HDL support files and repository objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/increment-60e-support
          git bundle create target/increment-60e-support/repository.bundle HEAD
          python3 - <<'PY'
          from pathlib import Path
          import tarfile
          with tarfile.open('target/increment-60e-support/hdl-support.tar.gz', 'w:gz') as archive:
              for name in ('/opt/share/yosys', '/opt/share/verilator', '/usr/share/yosys', '/usr/share/verilator', '/usr/local/share/yosys', '/usr/local/share/verilator'):
                  p = Path(name)
                  if p.exists():
                      archive.add(p, arcname=str(p).lstrip('/'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: increment-60e-hdl-support
          path: target/increment-60e-support
          retention-days: 7

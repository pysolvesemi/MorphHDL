name: Increment 53e classify definitive closure

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write

concurrency:
  group: increment-53e-definitive-classifier
  cancel-in-progress: true

jobs:
  classify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0

      - name: Classify or confirm success
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          diagnostic=morphhdl/diagnostics/increment-53e-definitive-latest.txt
          if ! test -f "$diagnostic"; then
            rm -f .github/workflows/increment-53e-definitive-classifier.yml
            git add -A
            git commit -m 'Increment 53e: remove successful result classifier'
            git push origin HEAD:agent/increment-53e-native-streamfifocc-parameterization
            exit 0
          fi

          code=UNKNOWN
          if grep -Eqi 'Conclusion: skipped|did not complete|not found' "$diagnostic"; then
            code=WORKFLOW_CONTROL
          elif grep -Eqi 'CONFLICT|merge conflict|Automatic merge failed' "$diagnostic"; then
            code=MERGE_CONFLICT
          elif grep -Eqi 'apply-increment-53e-generic-native-runtime-selection-v2\.py|generic-native-runtime-selection-v2' "$diagnostic"; then
            code=RUNTIME_MATERIALIZATION
          elif grep -Eqi 'apply-increment-53e-generic-native-compiler-selection-v2\.py|generic-native-compiler-selection-v2' "$diagnostic"; then
            code=COMPILER_MATERIALIZATION
          elif grep -Eqi 'ExternalNativeIntShadowRegistry\.scala.*(error|\[error\])' "$diagnostic"; then
            code=RUNTIME_COMPILE
          elif grep -Eqi 'MorphHdlNativeIntShadowExpressionComponent\.scala.*(error|\[error\])' "$diagnostic"; then
            code=COMPILER_COMPILE
          elif grep -Eqi 'NativeStreamFifoCCProofTests\.scala.*(error|\[error\])' "$diagnostic"; then
            code=PROOF_COMPILE
          elif grep -Eqi 'component-specific recognition remains|genericity|source preservation' "$diagnostic"; then
            code=GENERICITY_GUARD
          elif grep -Eqi 'STREAMFIFOCC_TIMEOUT|STREAMFIFOCC_DATA_MISMATCH|asynchronous simulation failed|Icarus compile failed' "$diagnostic"; then
            code=SIMULATION
          elif grep -Eqi 'formal equivalence failed|Equivalence.*failed|unproven|equiv_status' "$diagnostic"; then
            code=FORMAL
          elif grep -Eqi 'ParameterizedStreamFifoCCTests|SPINAL-PARAMETERIZED|MorphVerilogException' "$diagnostic"; then
            code=FOCUSED_CONTRACT
          elif grep -Eqi 'NativeStreamFifoFormalEquivalenceTests' "$diagnostic"; then
            code=STREAMFIFO_REGRESSION
          fi
          mkdir -p .morphhdl
          printf '%s\n' "$code" > .morphhdl/increment-53e-definitive-classification
          rm -f .github/workflows/increment-53e-definitive-classifier.yml
          git add -A
          git diff --cached --check
          git commit -m "[53e-definitive:$code] Classify Increment 53e closure"
          git push origin HEAD:agent/increment-53e-native-streamfifocc-parameterization

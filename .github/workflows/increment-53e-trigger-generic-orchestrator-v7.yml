name: Increment 53e trigger generic closure v7

on:
  push:
    branches:
      - agent/increment-53e-streamfifo-cc-parameterization

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the generic Increment 53e orchestrator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run increment-53e-generic-orchestrator-v6.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref agent/increment-53e-streamfifo-cc-parameterization

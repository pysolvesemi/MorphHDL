name: Increment 53e StreamFifoCC process diagnostic

on:
  push:
    branches:
      - agent/increment-53e-streamfifo-cc-parameterization

jobs:
  diagnose:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    timeout-minutes: 90
    env:
      MORPHDL_STREAMFIFOCC_DEBUG_DIR: /tmp/morphhdl-streamfifocc-debug
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-streamfifo-cc-parameterization
          fetch-depth: 0

      - name: Reconcile the latest base and recover reviewed patches
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags origin \
            parameterized-verilog:refs/remotes/origin/parameterized-verilog \
            agent/increment-53d-native-streamfifocc-parameterization:refs/remotes/origin/agent/increment-53d-native-streamfifocc-parameterization
          git merge --no-edit origin/parameterized-verilog
          git show \
            origin/agent/increment-53d-native-streamfifocc-parameterization:.github/workflows/increment-53d-streamfifocc-bootstrap.yml \
            > /tmp/reviewed.yml
          git show \
            origin/agent/increment-53d-native-streamfifocc-parameterization:morphhdl/src/test/scala/morphhdl/ParameterizedStreamFifoCCDepthTests.scala \
            > morphhdl/src/test/scala/morphhdl/ParameterizedStreamFifoCCDepthTests.scala
          git show \
            4a379f6c64f67889ca432e01ac7d51a41077941a:.github/workflows/increment-53e-bootstrap-v2.yml \
            > /tmp/increment-53e-reviewed-bootstrap.yml
          git show \
            aa346fe80eb795834eab557797d252a07d798698:.github/workflows/increment-53e-range-bootstrap.yml \
            > /tmp/increment-53e-range-bootstrap.yml
          git show \
            3959b78bf31d857d1518594ba704a4c37067a1a0:.github/workflows/increment-53e-ast-diagnostic.yml \
            > /tmp/increment-53e-autoresize-bootstrap.yml
          git show \
            7a21b113e74925ffdee7d77a29093cb9fa69cb4a:.github/workflows/increment-53e-ast-diagnostic.yml \
            > /tmp/increment-53e-identity-bootstrap.yml
          test -s /tmp/reviewed.yml
          test -s /tmp/increment-53e-reviewed-bootstrap.yml
          test -s /tmp/increment-53e-range-bootstrap.yml
          test -s /tmp/increment-53e-autoresize-bootstrap.yml
          test -s /tmp/increment-53e-identity-bootstrap.yml

      - name: Apply the reviewed identity patch with a robust method boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('/tmp/increment-53e-identity-bootstrap.yml').read_text()
          begin_marker = "          cat > /tmp/apply53e-autoresize-identity.py <<'PY'\n"
          end_marker = "\n          PY\n          python3 /tmp/apply53e-autoresize-identity.py"
          begin = workflow.index(begin_marker) + len(begin_marker)
          end = workflow.index(end_marker, begin)
          patch = textwrap.dedent(workflow[begin:end])
          brittle = "stable_end_marker = '''  private def compact(\n'''"
          robust = "stable_end_marker = '  private def compact('"
          if patch.count(brittle) != 1:
              raise SystemExit(
                  f'expected one brittle stableName boundary, found {patch.count(brittle)}'
              )
          patch = patch.replace(brittle, robust, 1)
          exec(
              compile(
                  patch,
                  'increment-53e-reviewed-identity-repair',
                  'exec',
              ),
              {'__name__': '__main__'},
          )
          PY

      - name: Instrument native RAM process classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              'morphhdl/src/main/scala/spinal/core/internals/'
              'ParameterizedVerilogMemories.scala'
          )
          value = path.read_text()
          start_marker = '  private def independentDontCareProcessesAreComplete(\n'
          end_marker = '  private def alwaysBlocks('
          start = value.index(start_marker)
          end = value.index(end_marker, start)
          diagnostic = '''  private def independentDontCareProcessesAreComplete(
              lines: Vector[String],
              blocks: Vector[LineRange],
              plan: MemoryPlan
            ): Boolean = {
              if (!plan.independentDontCare || blocks.size != 2) return false
              val texts = blocks.map { block =>
                lines.slice(block.start, block.endInclusive + 1).mkString("\\n")
              }
              Console.err.println(
                "MORPHDL-INC53E-PROCESS-PLAN " +
                  s"memory=${plan.memoryName} readTarget=${plan.readTarget} " +
                  s"readAddress=${plan.readAddress} writeAddress=${plan.writeAddress} " +
                  s"writeData=${plan.writeData} readClock=${plan.readClock} " +
                  s"writeClock=${plan.writeClock}"
              )
              texts.zipWithIndex.foreach { case (text, index) =>
                val header =
                  lines(blocks(index).start).replaceAll("\\\\s+", " ").trim
                val readTarget = containsIdentifier(text, plan.readTarget)
                val readAccess =
                  containsIndexedAccess(text, plan.memoryName, plan.readAddress)
                val writeData = containsIdentifier(text, plan.writeData)
                val writeAccess =
                  containsIndexedAccess(text, plan.memoryName, plan.writeAddress)
                Console.err.println(
                  "MORPHDL-INC53E-PROCESS-BLOCK " +
                    s"index=$index header=$header readTarget=$readTarget " +
                    s"readAccess=$readAccess writeData=$writeData " +
                    s"writeAccess=$writeAccess\\n$text"
                )
              }
              val readBlocks = texts.zipWithIndex.collect {
                case (text, index)
                    if containsIdentifier(text, plan.readTarget) &&
                      containsIndexedAccess(text, plan.memoryName, plan.readAddress) =>
                  index
              }
              val writeBlocks = texts.zipWithIndex.collect {
                case (text, index)
                    if containsIdentifier(text, plan.writeData) &&
                      containsIndexedAccess(text, plan.memoryName, plan.writeAddress) =>
                  index
              }
              val result =
                if (
                  readBlocks.size != 1 || writeBlocks.size != 1 ||
                  readBlocks.head == writeBlocks.head
                ) false
                else {
                  val readHeader =
                    lines(blocks(readBlocks.head).start)
                      .replaceAll("\\\\s+", " ").trim
                  val writeHeader =
                    lines(blocks(writeBlocks.head).start)
                      .replaceAll("\\\\s+", " ").trim
                  readHeader.startsWith(s"always @(posedge ${plan.readClock})") &&
                  writeHeader.startsWith(s"always @(posedge ${plan.writeClock})")
                }
              Console.err.println(
                "MORPHDL-INC53E-PROCESS-RESULT " +
                  s"readBlocks=${readBlocks.mkString(",")} " +
                  s"writeBlocks=${writeBlocks.mkString(",")} result=$result"
              )
              result
            }

          '''
          path.write_text(value[:start] + diagnostic + value[end:])
          PY

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Run the exact native StreamFifoCC witness
        shell: bash
        run: |
          set -o pipefail
          /tmp/morphhdl-mill 'morph[2.12.18].testOnly' \
            morphhdl.ParameterizedStreamFifoCCDepthTests \
            2>&1 | tee /tmp/increment-53e-process-diagnostic.log

      - name: Upload process diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53e-process-diagnostic-evidence
          path: |
            /tmp/increment-53e-process-diagnostic.log
            /tmp/morphhdl-streamfifocc-debug
          if-no-files-found: ignore

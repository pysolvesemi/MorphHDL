name: PR189 reviewed source-seal preparation
on:
  push:
    branches: [agent/cdc-independent-parameter-consumers]
    paths: [.github/workflows/pr189-review-seal-preparation.yml]
permissions:
  contents: read
jobs:
  prepare-reviewed-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare exact reviewed objects without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, re, subprocess, urllib.request
          root = pathlib.Path.cwd()
          start = os.environ['EXPECTED_HEAD']
          original = '47cd9a2f03c3e6705b24e87ea82f66bd31dbcd7e'
          base = '7f355a859e7e88ca343e1ff82f261fb47b3311d0'
          helper = 'morphhdl/scripts/check-increment-62-wa08-source-overlay.py'
          contract = 'morphhdl/contracts/increment-62-wa08-source-overlay.json'
          transient = '.github/workflows/pr189-review-seal-preparation.yml'
          workflow = '.github/workflows/cdc-independent-parameter-consumers.yml'
          test_path = 'repro/cdc-independent-parameters/test_source_review.py'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def api(path, payload):
              request = urllib.request.Request('https://api.github.com/repos/pysolvesemi/MorphHDL/' + path,
                  data=json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          def create_commit(parent, message, contents, removed=()):
              parent_tree = git('rev-parse', parent + '^{tree}')
              entries = []
              for path, content in contents.items():
                  blob = api('git/blobs', {'content': content, 'encoding': 'utf-8'})['sha']
                  raw = content.encode()
                  assert blob == hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob})
              entries.extend({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None} for path in removed)
              tree = api('git/trees', {'base_tree': parent_tree, 'tree': entries})['sha']
              commit = api('git/commits', {'message': message, 'tree': tree, 'parents': [parent]})['sha']
              subprocess.run(['git', 'fetch', '--no-tags', 'origin', commit], check=True)
              return commit
          assert git('rev-parse', 'HEAD') == start
          assert git('diff', '--name-only', original, start).splitlines() == [transient]
          assert not git('status', '--porcelain')
          manifest_raw = (root / contract).read_bytes()
          assert hashlib.sha256(manifest_raw).hexdigest() == '84b14f56e54a729a1e83dc8c1bc0902c78f7b758ff3cc4d5f1310d13e4c2c365'
          manifest = json.loads(manifest_raw)
          old_entries = {entry['path']: dict(entry) for entry in manifest['files']}
          helper_raw = (root / helper).read_bytes()
          normalized = re.sub(rb'^CONTRACT_SHA256 = "[^"]+"$', b'CONTRACT_SHA256 = "MANIFEST_HASH"', helper_raw, count=1, flags=re.M)
          assert hashlib.sha256(normalized).hexdigest() == manifest['helper_normalized_sha256']
          text = (root / workflow).read_text()
          needle = '          git diff --exit-code ' + base + ' -- core morphruntime morphhdl frontend\n'
          assert text.count(needle) == 1
          replacement = ('          python3 ' + helper + '\n' +
              '          # Only the two sealed review-metadata files may differ from the baseline.\n' +
              '          git diff --exit-code ' + base + ' -- core morphruntime morphhdl frontend \\\n' +
              "            ':(exclude)" + helper + "' \\\n" +
              "            ':(exclude)" + contract + "'\n" +
              '          python3 ' + test_path + '\n')
          text = text.replace(needle, replacement)
          test_text = '''#!/usr/bin/env python3
          """Reject changed CDC review inputs; keep the baseline compiler check strict."""
          import importlib.util
          import subprocess
          import tempfile
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          HELPER = "morphhdl/scripts/check-increment-62-wa08-source-overlay.py"
          CONTRACT = "morphhdl/contracts/increment-62-wa08-source-overlay.json"
          BASE = "7f355a859e7e88ca343e1ff82f261fb47b3311d0"
          REVIEWED = (
              ".github/workflows/cdc-independent-parameter-consumers.yml",
              "repro/cdc-independent-parameters/.gitignore",
              "repro/cdc-independent-parameters/build.sbt",
              "repro/cdc-independent-parameters/check_baseline.py",
              "repro/cdc-independent-parameters/export_tools.py",
              "repro/cdc-independent-parameters/project/build.properties",
              "repro/cdc-independent-parameters/src/main/scala/CdcIndependentParametersRepro.scala",
              "repro/cdc-independent-parameters/test_source_review.py",
          )
          spec = importlib.util.spec_from_file_location("cdc_source_overlay", ROOT / HELPER)
          overlay = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(overlay)

          def baseline_unchanged(root):
              result = subprocess.run(["git", "diff", "--quiet", BASE, "--",
                  "core", "morphruntime", "morphhdl", "frontend",
                  ":(exclude)" + HELPER, ":(exclude)" + CONTRACT], cwd=root)
              if result.returncode not in (0, 1):
                  raise RuntimeError("baseline Git comparison failed")
              return result.returncode == 0

          def rejected(root, label):
              try:
                  overlay.verify(root)
              except RuntimeError as error:
                  if "WA-08 source overlay:" not in str(error):
                      raise
              else:
                  raise AssertionError("accepted unreviewed input: " + label)

          def main():
              count = 0
              with tempfile.TemporaryDirectory(prefix="cdc-source-review-") as temporary:
                  fixture = Path(temporary) / "repo"
                  subprocess.run(["git", "worktree", "add", "--quiet", "--detach", str(fixture), "HEAD"], cwd=ROOT, check=True)
                  try:
                      value = overlay.verify(fixture)
                      assert set(REVIEWED) <= {entry["path"] for entry in value["files"]}
                      assert baseline_unchanged(fixture)
                      for path in REVIEWED + (HELPER, CONTRACT):
                          file = fixture / path
                          original = file.read_bytes()
                          try:
                              file.write_bytes(original + b"\\n# unreviewed mutation\\n")
                              rejected(fixture, path)
                              count += 1
                          finally:
                              file.write_bytes(original)
                      victim = fixture / "core/src/main/scala/spinal/core/Bits.scala"
                      original = victim.read_bytes()
                      try:
                          victim.write_bytes(original + b"\\n// compiler mutation\\n")
                          assert not baseline_unchanged(fixture), "compiler delta was excluded"
                          rejected(fixture, str(victim))
                          count += 1
                      finally:
                          victim.write_bytes(original)
                      unknown = fixture / "repro/cdc-independent-parameters/src/main/scala/Unreviewed.scala"
                      try:
                          unknown.write_text("// new unreviewed source\\n")
                          rejected(fixture, str(unknown))
                          count += 1
                      finally:
                          unknown.unlink()
                      overlay.verify(fixture)
                      assert baseline_unchanged(fixture)
                  finally:
                      subprocess.run(["git", "worktree", "remove", "--force", str(fixture)], cwd=ROOT, check=True)
              print("CDC_SOURCE_REVIEW_PASS rejected=" + str(count))

          if __name__ == "__main__":
              main()
          '''
          source = create_commit(start, 'Fix PR189 baseline scope and add source-review mutation regressions',
              {workflow: text, test_path: test_text}, removed=(transient,))
          subprocess.run(['git', 'checkout', '--detach', source], check=True)
          allowed = {workflow, test_path, 'repro/cdc-independent-parameters/.gitignore',
              'repro/cdc-independent-parameters/build.sbt', 'repro/cdc-independent-parameters/check_baseline.py',
              'repro/cdc-independent-parameters/export_tools.py', 'repro/cdc-independent-parameters/project/build.properties',
              'repro/cdc-independent-parameters/src/main/scala/CdcIndependentParametersRepro.scala'}
          assert set(git('diff', '--name-only', base, source).splitlines()) == allowed
          for path in sorted(allowed):
              assert path not in old_entries
              assert not git('ls-tree', manifest['base'], '--', path)
              raw = (root / path).read_bytes()
              manifest['files'].append({'path': path, 'mode': '100644', 'before_sha256': None,
                  'after_sha256': hashlib.sha256(raw).hexdigest()})
          manifest['files'].sort(key=lambda entry: entry['path'])
          assert {entry['path']: entry for entry in manifest['files'] if entry['path'] in old_entries} == old_entries
          manifest['final_source_commit'] = source
          sealed = json.dumps(manifest, indent=2) + '\n'
          seal_hash = hashlib.sha256(sealed.encode()).hexdigest()
          updated_helper, count = re.subn(r'^CONTRACT_SHA256 = "[^"]+"$',
              'CONTRACT_SHA256 = "' + seal_hash + '"', helper_raw.decode(), count=1, flags=re.M)
          assert count == 1
          assert re.sub(rb'^CONTRACT_SHA256 = "[^"]+"$', b'CONTRACT_SHA256 = "MANIFEST_HASH"',
              updated_helper.encode(), count=1, flags=re.M) == normalized
          final = create_commit(source, 'Seal exact PR189 CDC baseline review inputs without weakening guards',
              {contract: sealed, helper: updated_helper})
          subprocess.run(['git', 'checkout', '--detach', final], check=True)
          del os.environ['GH_TOKEN']
          commands = [
              ['python3', helper],
              ['python3', test_path],
              ['python3', 'morphhdl/scripts/test-increment-62-wa08-source-overlay.py'],
              ['python3', 'morphhdl/scripts/test-wa07b-inherited-review.py'],
              ['python3', 'morphhdl/scripts/check-increment-60g-source-scope.py'],
              ['python3', 'morphhdl/scripts/check-increment-60f-equivalence-closure.py', '--source-only'],
              ['python3', 'morphhdl/scripts/check-increment-59c-source-review.py'],
              ['python3', 'morphhdl/scripts/check-increment-59g-source-review.py'],
          ]
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr189-seal-evidence'
          evidence.mkdir(exist_ok=True)
          report = {'source': source, 'final': final, 'tree': git('rev-parse', 'HEAD^{tree}'),
              'manifest_sha256': seal_hash, 'old_entries_unchanged': len(old_entries),
              'new_reviewed_files': sorted(allowed), 'results': []}
          for index, command in enumerate(commands):
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              (evidence / ('check-%02d.log' % index)).write_text(result.stdout)
              print('CHECK', command, 'EXIT', result.returncode, flush=True)
              print(result.stdout[-6000:], flush=True)
              report['results'].append({'command': command, 'exit': result.returncode})
          assert not git('status', '--porcelain'), git('status', '--porcelain')
          (evidence / 'report.json').write_text(json.dumps(report, indent=2) + '\n')
          print('PREPARED_REVIEWED_OBJECTS ' + json.dumps(report), flush=True)
          assert all(item['exit'] == 0 for item in report['results']), 'candidate validation failed; branch was not moved'
          print('PR189_SEAL_CANDIDATE_PASS ' + final, flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr189-seal-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/pr189-seal-evidence/
          if-no-files-found: warn
          retention-days: 14

name: Increment 53d StreamFifoCC bootstrap

on:
  push:
    branches:
      - agent/increment-53d-native-streamfifocc-parameterization

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    container: ghcr.io/spinalhdl/docker:latest
    env:
      MORPHDL_STREAMFIFOCC_DEBUG_DIR: /tmp/morphhdl-streamfifocc-debug
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Activate StreamFifoCC and retain native runtime helper ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala")
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              text = text.replace(old, new)

          replace_once(
              ''') && decoded(value.name) == "StreamFifo" =>''',
              ''') && Set("StreamFifo", "StreamFifoCC").contains(decoded(value.name)) =>''',
              "native FIFO class gate",
          )
          replace_once(
              '''    private var nativeStreamFifoStaticBooleans = Set.empty[TermName]\n''',
              '''    private var nativeStreamFifoStaticBooleans = Set.empty[TermName]\n    private var nativeStreamFifoRuntimeHelpers = false\n''',
              "native runtime helper state",
          )
          replace_once(
              '''    private def selectedHelperMethod(name: String): Tree =\n      if (inNativeStreamFifo) helperMethod(name) else frontendHelperMethod(name)\n\n    private def selectedConditionalHelperMethod(name: String): Tree =\n      if (inNativeStreamFifo) helperMethod(name)\n      else frontendConditionalHelperMethod(name)\n''',
              '''    private def selectedHelperMethod(name: String): Tree =\n      if (nativeStreamFifoRuntimeHelpers) helperMethod(name)\n      else frontendHelperMethod(name)\n\n    private def selectedConditionalHelperMethod(name: String): Tree =\n      if (nativeStreamFifoRuntimeHelpers) helperMethod(name)\n      else frontendConditionalHelperMethod(name)\n''',
              "native helper selection",
          )
          replace_once(
              '''          val previousLine = nativeStreamFifoDepthLine\n          val previousBooleans = nativeStreamFifoStaticBooleans\n''',
              '''          val previousLine = nativeStreamFifoDepthLine\n          val previousBooleans = nativeStreamFifoStaticBooleans\n          val previousRuntimeHelpers = nativeStreamFifoRuntimeHelpers\n''',
              "native helper save",
          )
          replace_once(
              '''          nativeStreamFifoStaticBooleans = parameters.collect {\n            case parameter\n                if NativeStreamFifoStaticBooleanNames(decoded(parameter.name)) =>\n              parameter.name\n          }.toSet\n          try super.transform(value)\n''',
              '''          nativeStreamFifoStaticBooleans = parameters.collect {\n            case parameter\n                if NativeStreamFifoStaticBooleanNames(decoded(parameter.name)) =>\n              parameter.name\n          }.toSet\n          nativeStreamFifoRuntimeHelpers = true\n          try super.transform(value)\n''',
              "native helper activation",
          )
          replace_once(
              '''            nativeStreamFifoDepthLine = previousLine\n            nativeStreamFifoStaticBooleans = previousBooleans\n''',
              '''            nativeStreamFifoDepthLine = previousLine\n            nativeStreamFifoStaticBooleans = previousBooleans\n            nativeStreamFifoRuntimeHelpers = previousRuntimeHelpers\n''',
              "native helper restore",
          )

          path.write_text(text)
          PY

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Run the native StreamFifoCC diagnostic witness
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill 'morph[2.12.18].testOnly' morphhdl.ParameterizedStreamFifoCCDepthTests

      - name: Upload diagnostic RTL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53d-streamfifocc-diagnostic
          path: /tmp/morphhdl-streamfifocc-debug
          if-no-files-found: ignore

      - name: Commit the proven generic activation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/increment-53d-streamfifocc-bootstrap.yml
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala
          git add .github/workflows/increment-53d-streamfifocc-bootstrap.yml
          git diff --cached --check
          git commit -m "Increment 53d: activate native StreamFifoCC symbolic depth"
          git push origin "HEAD:${GITHUB_REF_NAME}"

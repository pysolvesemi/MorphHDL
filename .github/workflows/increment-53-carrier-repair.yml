name: Increment 53 native carrier repair

on:
  push:
    branches:
      - agent/increment-53-native-streamfifo-clean

permissions:
  contents: write

concurrency:
  group: increment-53-carrier-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-prove-and-push:
    if: "${{ !contains(github.event.head_commit.message, '[inc53-carrier-fix]') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out the exact Increment 53 branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53-native-streamfifo-clean
          fetch-depth: 0

      - name: Preserve the native witness width and retained prototype shape
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime = Path("morphruntime/src/main/scala/spinal/core/ExternalNativeIntCompilerRuntime.scala")
          text = runtime.read_text()
          old = "\n".join([
              "    val domainWidth = if (expression.maximum == 0) 1 else expression.maximum.bitLength",
              "    val carrierWidth = math.max(prototype.getBitsWidth, domainWidth)",
              "    val result = UInt(carrierWidth bits)",
              "    result.setName(stableName)",
              "    result := U(BigInt(value), carrierWidth bits)",
              "    ExternalParameterizedValueRegistry.attach(",
          ])
          new = "\n".join([
              "    val carrierWidth = prototype.getBitsWidth",
              "    if (carrierWidth < 1)",
              "      throw new IllegalStateException(",
              "        \"compilerUIntValueLike requires a positive-width UInt prototype\"",
              "      )",
              "    if (ParameterizedWidth.expressionOf(prototype).isEmpty)",
              "      throw new ParameterizedVerilogException(",
              "        \"MORPH-FRONTEND-NATIVE-INT-CARRIER-PROTOTYPE-UNRETAINED\"",
              "        \"a symbolic native Int hardware carrier requires one exact UInt prototype with retained symbolic width\"",
              "        Some(rendered(file, line))",
              "      )",
              "    val result = ParameterizedWidth.copyShape(",
              "      prototype,",
              "      UInt(carrierWidth bits)",
              "    )",
              "    result.setName(stableName)",
              "    result := U(BigInt(value), carrierWidth bits)",
              "    ExternalParameterizedValueRegistry.attach(",
          ])
          if old in text:
              runtime.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("Increment 53 runtime carrier block no longer matches the reviewed head")

          plugin = Path("morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala")
          text = plugin.read_text()
          anchor = "\n".join([
              "    private def nativeValueCarrier(",
              "        value: Rewrite,",
              "        prototype: Tree,",
              "        original: Tree,",
              "        role: String",
              "    ): Tree = {",
          ])
          helper = "\n".join([
              "    private def nativeValuePrototype(tree: Tree): Tree = tree match {",
              "      case Apply(Select(left, _), List(right))",
              "          if looksNativeHardware(left) || looksNativeHardware(right) =>",
              "        if (looksNativeHardware(left)) nativeValuePrototype(left)",
              "        else nativeValuePrototype(right)",
              "      case TypeApply(value, _) if looksNativeHardware(value) =>",
              "        nativeValuePrototype(value)",
              "      case Typed(value, _) if looksNativeHardware(value) =>",
              "        nativeValuePrototype(value)",
              "      case _ => tree",
              "    }",
              "",
          ])
          if helper not in text:
              if anchor not in text:
                  raise SystemExit("Increment 53 native carrier anchor no longer matches the reviewed head")
              text = text.replace(anchor, helper + "\n" + anchor, 1)
          old_call = "          transform(prototype),"
          new_call = "          transform(nativeValuePrototype(prototype)),"
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          elif new_call not in text:
              raise SystemExit("Increment 53 prototype call no longer matches the reviewed head")
          plugin.write_text(text)
          PY
          git diff --check
          git diff -- morphruntime/src/main/scala/spinal/core/ExternalNativeIntCompilerRuntime.scala \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Prove the real native StreamFifo contract on Scala 2.13.12
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.ParameterizedStreamFifoDepthTests

      - name: Commit the proved carrier repair
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "pysolvesemi"
          git config user.email "pysolvesemi@gmail.com"
          git add \
            morphruntime/src/main/scala/spinal/core/ExternalNativeIntCompilerRuntime.scala \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala
          if git diff --cached --quiet; then
            echo "Carrier repair is already present."
            exit 0
          fi
          git commit -m "fix(morphhdl): preserve symbolic native UInt carrier shape [inc53-carrier-fix]"
          git push origin HEAD:"$GITHUB_REF_NAME"

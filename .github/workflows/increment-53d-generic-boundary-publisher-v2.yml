name: Complete Increment 53d generic native definition boundary v2

on:
  push:
    branches:
      - agent/increment-53d-generic-native-definition-boundary
    paths:
      - .github/workflows/increment-53d-generic-boundary-publisher-v2.yml

permissions:
  contents: write

jobs:
  repair-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-generic-native-definition-boundary
          fetch-depth: 0

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Apply component-independent compiler architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          plugin = Path(
              "morphplugin/src/main/scala/morphhdl/compiler/"
              "MorphHdlNativeIntShadowExpressionComponent.scala"
          )
          text = plugin.read_text(encoding="utf-8")

          eligible_start = text.index(
              "  private def eligible(unit: CompilationUnit): Boolean = {"
          )
          content_start = text.index(
              '    val content = Option(unit.source).map(_.content.mkString).getOrElse("")',
              eligible_start,
          )
          eligible_end = text.index("\n\n  private def helperMethod", content_start)
          eligibility = dedent('''
              val content = Option(unit.source).map(_.content.mkString).getOrElse("")
              val upstreamSpinalComponentSource =
                normalizedPath.contains("/core/src/main/scala/spinal/") ||
                  normalizedPath.contains("/lib/src/main/scala/spinal/")
              !normalizedPath.contains("/frontend/src/main/scala/") &&
                !normalizedPath.contains("/morphplugin/src/main/scala/") &&
                (
                  content.contains("NativeIntShadow") ||
                  content.contains("shadowInt") ||
                  upstreamSpinalComponentSource
                )
            }
          ''').lstrip()
          eligibility = ''.join(
              "    " + line if line.strip() else line
              for line in eligibility.splitlines(True)
          )
          text = text[:content_start] + eligibility.rstrip() + text[eligible_end:]

          helper_start = text.index("    private def withoutNativeStreamFifoContext")
          helper_end = text.index("    private def trackedInteger", helper_start)
          helper = dedent('''
              /**
                * Native symbolic runtime capture is owned by the exact named Scala
                * definition that opens it. A nested named definition has an
                * independent elaboration lifetime and must never inherit constructor
                * or native-width capture state from its lexical owner. Anonymous
                * function bodies stay within the owning definition because they are
                * part of that definition's executable body.
                */
              private def withoutEnclosingNativeRuntimeContext[A](body: => A): A = {
                val previousStreamFifoDataTypeName = nativeStreamFifoDataTypeName
                val previousStreamFifoDepthName = nativeStreamFifoDepthName
                val previousStreamFifoDepthReference = nativeStreamFifoDepthReference
                val previousStreamFifoDepthLine = nativeStreamFifoDepthLine
                val previousStreamFifoStaticBooleans = nativeStreamFifoStaticBooleans
                val previousWidthFunctionStaticBooleans = nativeWidthFunctionStaticBooleans
                val previousWidthFunctionDepth = nativeWidthFunctionDepth

                nativeStreamFifoDataTypeName = None
                nativeStreamFifoDepthName = None
                nativeStreamFifoDepthReference = None
                nativeStreamFifoDepthLine = 1
                nativeStreamFifoStaticBooleans = Set.empty
                nativeWidthFunctionStaticBooleans = Set.empty
                nativeWidthFunctionDepth = 0

                try body
                finally {
                  nativeStreamFifoDataTypeName = previousStreamFifoDataTypeName
                  nativeStreamFifoDepthName = previousStreamFifoDepthName
                  nativeStreamFifoDepthReference = previousStreamFifoDepthReference
                  nativeStreamFifoDepthLine = previousStreamFifoDepthLine
                  nativeStreamFifoStaticBooleans = previousStreamFifoStaticBooleans
                  nativeWidthFunctionStaticBooleans = previousWidthFunctionStaticBooleans
                  nativeWidthFunctionDepth = previousWidthFunctionDepth
                }
              }

          ''').lstrip()
          helper = ''.join(
              "    " + line if line.strip() else line
              for line in helper.splitlines(True)
          )
          text = text[:helper_start] + helper + text[helper_end:]

          override_marker = "    override def transform(tree: Tree): Tree = tree match {\n"
          independent = dedent('''
              private def transformIndependentNativeDefinition(
                  definition: DefDef
              ): Tree = {
                val roots = nativeWidthRoots(definition.rhs)
                if (roots.nonEmpty) transformNativeWidthFunction(definition, roots)
                else withScope(super.transform(definition))
              }

          ''').lstrip()
          independent = ''.join(
              "    " + line if line.strip() else line
              for line in independent.splitlines(True)
          )
          if text.count(override_marker) != 1:
              raise SystemExit("expected one transformer override marker")
          text = text.replace(override_marker, independent + override_marker, 1)

          cases_start = text.index(
              "      case definition: DefDef\n"
              "          if inNativeStreamFifo && decoded(definition.name) != \"<init>\" =>"
          )
          cases_end = text.index("      case definition: DefDef =>", cases_start)
          generic_case = dedent('''
                case definition: DefDef if decoded(definition.name) != "<init>" =>
                  // Every named definition owns an independent symbolic-capture
                  // lifetime. Clear any enclosing native context before discovering
                  // and opening the direct width-function boundary owned by this
                  // definition itself.
                  if (inNativeRuntimeContext)
                    withoutEnclosingNativeRuntimeContext {
                      transformIndependentNativeDefinition(definition)
                    }
                  else transformIndependentNativeDefinition(definition)
          ''').lstrip()
          generic_case = ''.join(
              "      " + line if line.strip() else line
              for line in generic_case.splitlines(True)
          )
          text = text[:cases_start] + generic_case + text[cases_end:]

          forbidden = (
              "withoutNativeStreamFifoContext",
              "if inNativeStreamFifo && decoded(definition.name)",
              'normalizedPath.endsWith("/lib/src/main/scala/spinal/lib/Stream.scala")',
          )
          for fragment in forbidden:
              if fragment in text:
                  raise SystemExit(
                      f"component-specific boundary fragment remains: {fragment}"
                  )
          for fragment in (
              "withoutEnclosingNativeRuntimeContext",
              "transformIndependentNativeDefinition",
              "upstreamSpinalComponentSource",
              'normalizedPath.contains("/core/src/main/scala/spinal/")',
              'normalizedPath.contains("/lib/src/main/scala/spinal/")',
          ):
              if fragment not in text:
                  raise SystemExit(f"generic architecture fragment is missing: {fragment}")
          plugin.write_text(text, encoding="utf-8")

          regression = Path(
              "morphhdl/src/test/scala/morphhdl/"
              "GenericNativeDefinitionBoundaryTests.scala"
          )
          regression.write_text(dedent('''
              package morphhdl

              import java.nio.charset.StandardCharsets
              import java.nio.file.{Files, Path, Paths}

              import org.scalatest.funsuite.AnyFunSuite

              /**
                * Compiler-architecture regression. Native library blocks are
                * functional witnesses only; no component or file name participates
                * in named-definition lifetime ownership.
                */
              class GenericNativeDefinitionBoundaryTests extends AnyFunSuite {
                private val relativePlugin = Paths.get(
                  "morphplugin/src/main/scala/morphhdl/compiler/" +
                    "MorphHdlNativeIntShadowExpressionComponent.scala"
                )

                private def repositoryRoot: Path = {
                  val start = Paths.get(System.getProperty("user.dir")).toAbsolutePath
                  var current: Path = start
                  while (
                    current != null &&
                      !Files.isRegularFile(current.resolve(relativePlugin))
                  ) {
                    current = current.getParent
                  }
                  assert(current != null, s"Could not locate repository root above $start")
                  current
                }

                private def source: String =
                  new String(
                    Files.readAllBytes(repositoryRoot.resolve(relativePlugin)),
                    StandardCharsets.UTF_8
                  )

                test("all upstream SpinalHDL component sources use one generic eligibility rule") {
                  val value = source
                  assert(value.contains("val upstreamSpinalComponentSource"))
                  assert(value.contains("/core/src/main/scala/spinal/"))
                  assert(value.contains("/lib/src/main/scala/spinal/"))
                  assert(
                    !value.contains(
                      "normalizedPath.endsWith(\\\"/lib/src/main/scala/spinal/lib/Stream.scala\\\")"
                    )
                  )
                }

                test("every named definition uses one component-independent capture lifetime") {
                  val value = source
                  assert(value.contains("private def withoutEnclosingNativeRuntimeContext"))
                  assert(value.contains("if (inNativeRuntimeContext)"))
                  assert(value.contains("transformIndependentNativeDefinition(definition)"))
                  assert(!value.contains("if inNativeStreamFifo && decoded(definition.name)"))
                  assert(!value.contains("withoutNativeStreamFifoContext"))
                }

                test("the generic reset covers every current native runtime context family") {
                  val value = source
                  val start = value.indexOf(
                    "private def withoutEnclosingNativeRuntimeContext"
                  )
                  val end = value.indexOf("private def trackedInteger", start)
                  assert(start >= 0 && end > start)
                  val helper = value.substring(start, end)
                  Vector(
                    "nativeStreamFifoDataTypeName",
                    "nativeStreamFifoDepthName",
                    "nativeStreamFifoDepthReference",
                    "nativeStreamFifoDepthLine",
                    "nativeStreamFifoStaticBooleans",
                    "nativeWidthFunctionDepth",
                    "nativeWidthFunctionStaticBooleans"
                  ).foreach { state =>
                    assert(helper.contains(state), s"generic reset omitted $state")
                  }
                  assert(helper.contains("nativeStreamFifoDepthReference = None"))
                  assert(helper.contains("nativeWidthFunctionDepth = 0"))
                  assert(
                    helper.contains("nativeWidthFunctionStaticBooleans = Set.empty")
                  )
                }

                test("each isolated definition rediscovers only its own direct width roots") {
                  val value = source
                  val start = value.indexOf(
                    "private def transformIndependentNativeDefinition"
                  )
                  val end = value.indexOf("override def transform", start)
                  assert(start >= 0 && end > start)
                  val helper = value.substring(start, end)
                  assert(helper.contains("nativeWidthRoots(definition.rhs)"))
                  assert(helper.contains("transformNativeWidthFunction(definition, roots)"))
                  assert(helper.contains("withScope(super.transform(definition))"))
                }
              }
          ''').lstrip(), encoding="utf-8")

          workflow = Path(".github/workflows/morphhdl-native-stream-width-adapter.yml")
          workflow_text = workflow.read_text(encoding="utf-8")
          anchor = "            morphhdl.ParameterizedStreamWidthAdapterTests \\\n"
          suite = "            morphhdl.GenericNativeDefinitionBoundaryTests \\\n"
          if suite not in workflow_text:
              if workflow_text.count(anchor) != 1:
                  raise SystemExit("53d workflow test insertion point is ambiguous")
              workflow_text = workflow_text.replace(anchor, anchor + suite, 1)
              workflow.write_text(workflow_text, encoding="utf-8")

          guard = Path("morphhdl/scripts/check-native-stream-width-adapter-boundary.sh")
          guard_text = guard.read_text(encoding="utf-8")
          marker = 'grep -Fq \'terminalName(fun) == "widthOf"\' "$plugin"\n'
          checks = dedent('''
              grep -Fq 'val upstreamSpinalComponentSource' "$plugin"
              grep -Fq '/core/src/main/scala/spinal/' "$plugin"
              grep -Fq '/lib/src/main/scala/spinal/' "$plugin"
              grep -Fq 'private def withoutEnclosingNativeRuntimeContext' "$plugin"
              grep -Fq 'if (inNativeRuntimeContext)' "$plugin"
              grep -Fq 'transformIndependentNativeDefinition(definition)' "$plugin"

              if grep -Fq 'withoutNativeStreamFifoContext' "$plugin"; then
                echo "Named-definition isolation must not use a StreamFifo-only helper" >&2
                exit 1
              fi
              if grep -Fq 'if inNativeStreamFifo && decoded(definition.name)' "$plugin"; then
                echo "Named-definition isolation must be component-independent" >&2
                exit 1
              fi
              if grep -Fq 'normalizedPath.endsWith("/lib/src/main/scala/spinal/lib/Stream.scala")' "$plugin"; then
                echo "Native instrumentation eligibility must not be limited to Stream.scala" >&2
                exit 1
              fi
          ''').lstrip()
          if "Native instrumentation eligibility must not be limited" not in guard_text:
              if guard_text.count(marker) != 1:
                  raise SystemExit("source-boundary insertion point is ambiguous")
              guard_text = guard_text.replace(marker, marker + checks, 1)
              guard.write_text(guard_text, encoding="utf-8")

          doc = Path("docs/morphhdl/increment-53d-native-streamwidth-adapter.md")
          doc_text = doc.read_text(encoding="utf-8")
          section = dedent('''

              ## Generic native definition-lifetime closure

              The remaining ownership repair is compiler-wide rather than tied to
              `StreamFifo`, `StreamFifoCC`, `StreamWidthAdapter`, or any emitted module
              name. MorphHDL treats every non-constructor Scala `DefDef` as an
              independent native symbolic-capture lifetime. When such a definition is
              nested inside any active constructor or native-width context, the complete
              enclosing context is snapshotted and cleared; the nested definition then
              discovers only its own direct `widthOf(Data)` roots and opens a fresh
              boundary when needed. The enclosing state is restored afterward.

              The compiler phase is eligible for every upstream SpinalHDL component
              source under native `core` and `lib`, in addition to explicitly marked
              application sources. This removes the former `Stream.scala` file exception
              and makes the same lexical ownership rule available automatically to other
              and future SpinalHDL components. Component-specific provenance discovery
              retained from earlier increments may establish a context, but it cannot
              alter the generic named-definition lifetime rule.

              Dual-Scala architecture checks reject a component-named `DefDef` guard or
              file-specific eligibility exception. Native StreamWidthAdapter and
              compound-depth StreamFifo remain independent functional witnesses, while
              the inherited native-Int, memory, hierarchy, process, and concrete-baseline
              matrix checks that broad source eligibility is a semantic no-op when no
              symbolic provenance is present.
          ''').rstrip() + "\n"
          if "## Generic native definition-lifetime closure" not in doc_text:
              doc.write_text(doc_text.rstrip() + section, encoding="utf-8")
          PY

          git diff --check
          git diff --stat
          grep -n -A28 -B4 'withoutEnclosingNativeRuntimeContext' \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala
          grep -n -A18 -B4 'transformIndependentNativeDefinition' \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala

      - name: Validate generic architecture and inherited contracts on Scala 2.13.12
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.GenericNativeDefinitionBoundaryTests \
            morphhdl.ParameterizedStreamWidthAdapterTests \
            morphhdl.ParameterizedStreamFifoDepthTests \
            morphhdl.BackendSyncMergeIsolationTests \
            morphhdl.CapturedAssignmentNormalizationTests \
            morphhdl.NativeIntSymbolicConditionalTests \
            morphhdl.NativeIntNestedSymbolicControlFlowTests \
            morphhdl.NativeMemAutoProvenanceTests \
            morphhdl.ExternalNativeIntFormalizationTests \
            morphhdl.ExternalNativeIntShadowExpressionTests \
            morphhdl.ExternalNativeIntShadowProvenanceTests \
            morphhdl.FormalParameterIdentityTests \
            morphhdl.FormalParameterClonePropagationTests \
            morphhdl.HierarchyParameterBindingTests \
            morphhdl.MorphSingleSourceVerilogTests \
            morphhdl.integration.ExternalSpinalVerilogBaselineTests

      - name: Validate generic architecture and inherited contracts on Scala 2.12.18
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morph[2.12.18].testOnly \
            morphhdl.GenericNativeDefinitionBoundaryTests \
            morphhdl.ParameterizedStreamWidthAdapterTests \
            morphhdl.ParameterizedStreamFifoDepthTests \
            morphhdl.BackendSyncMergeIsolationTests \
            morphhdl.CapturedAssignmentNormalizationTests \
            morphhdl.NativeIntSymbolicConditionalTests \
            morphhdl.NativeIntNestedSymbolicControlFlowTests \
            morphhdl.NativeMemAutoProvenanceTests \
            morphhdl.ExternalNativeIntFormalizationTests \
            morphhdl.ExternalNativeIntShadowExpressionTests \
            morphhdl.ExternalNativeIntShadowProvenanceTests \
            morphhdl.FormalParameterIdentityTests \
            morphhdl.FormalParameterClonePropagationTests \
            morphhdl.HierarchyParameterBindingTests \
            morphhdl.MorphSingleSourceVerilogTests \
            morphhdl.integration.ExternalSpinalVerilogBaselineTests

      - name: Validate native-source and generic-boundary contracts
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl/scripts/check-native-stream-width-adapter-boundary.sh

      - name: Publish validated repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/increment-53d-generic-boundary-publisher.yml \
            .github/workflows/increment-53d-generic-boundary-publisher-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: make native definition capture component-independent"
          git push origin HEAD:agent/increment-53d-generic-native-definition-boundary

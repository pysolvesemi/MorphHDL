name: WA-08 Increment 62 atomic repair v2

on:
  push:
    branches:
      - agent/wa-08-production-handoff

permissions:
  contents: write

concurrency:
  group: wa08-increment62-atomic-repair-v2
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest WA-08 branch
        uses: actions/checkout@v4
        with:
          ref: agent/wa-08-production-handoff
          fetch-depth: 0

      - name: Rebuild reviewed overlay atomically
        shell: bash
        run: |
          set -euo pipefail
          source_anchor=dd1850bc021627a5e3ff8370cbbf214bfced4e88
          original=.github/workflows/wa08-increment62-atomic-repair.yml
          helper=morphhdl/scripts/check-wa08-inherited-source-overlay.py

          if [ -f "$original" ]; then
            git checkout "$source_anchor" -- \
              morphhdl/scripts/check-wa07b-inherited-review.py \
              morphhdl/scripts/check-increment-60g-source-scope.py
            rm -f \
              morphhdl/contracts/wa08-inherited-source-overlay.json \
              "$helper" \
              .github/workflows/increment-62-wa08-workflow-closure.yml
            awk '
              /python3 - <<'\''PY'\''/ { capture=1; next }
              capture && /^          PY$/ { exit }
              capture { sub(/^          /, ""); print }
            ' "$original" > /tmp/wa08-increment62-repair.py
            test -s /tmp/wa08-increment62-repair.py
            python3 /tmp/wa08-increment62-repair.py
          else
            test -f "$helper"
          fi

          python3 - <<'PY'
          from pathlib import Path
          path = Path("morphhdl/scripts/check-wa08-inherited-source-overlay.py")
          text = path.read_text(encoding="utf-8")
          old = '''    result = set(paths)
    for entry in contract["files"]:
        path = entry["path"]
        result.discard(path)
        before = optional_revision_bytes(root, entry["before_revision"], path)
'''
          new = '''    result = set(paths)
    for entry in contract["files"]:
        path = entry["path"]
        if path not in result:
            continue
        result.discard(path)
        before = optional_revision_bytes(root, entry["before_revision"], path)
'''
          count = text.count(old)
          if count == 1:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise RuntimeError(f"unexpected inherited_inventory implementation: {count}")
          PY

          rm -f \
            .github/workflows/wa08-sync-latest-base.yml \
            .github/workflows/wa08-increment62-atomic-repair-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement Increment 62 WA-08 inherited workflow overlay"

      - name: Validate before publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/check-wa08-inherited-source-overlay.py --verify
          python3 morphhdl/scripts/check-wa08-inherited-source-overlay.py --self-test
          python3 morphhdl/scripts/check-wa07b-inherited-review.py
          python3 morphhdl/scripts/check-increment-60f-equivalence-closure.py --source-only
          python3 morphhdl/scripts/check-increment-60g-source-scope.py
          git diff --exit-code
          git diff --cached --exit-code

      - name: Push exact repaired head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/wa-08-production-handoff

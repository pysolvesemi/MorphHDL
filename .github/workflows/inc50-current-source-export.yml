name: Increment 50 current source export

on:
  pull_request:
    branches:
      - parameterized-verilog
    paths:
      - .github/workflows/inc50-current-source-export.yml
  push:
    branches:
      - agent/increment-50-native-int-expressions
    paths:
      - .github/workflows/inc50-current-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-50-native-int-expressions
          fetch-depth: 0
      - name: Archive exact head
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/inc50-current.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/inc50-current.tar.gz" > "$RUNNER_TEMP/inc50-current.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: inc50-current-${{ github.sha }}
          path: |
            ${{ runner.temp }}/inc50-current.tar.gz
            ${{ runner.temp }}/inc50-current.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

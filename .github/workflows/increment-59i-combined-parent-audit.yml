name: Increment 59i exact combined-parent audit

on:
  push:
    branches: ['agent/increment-59i-combined-reduction-closure']
    paths:
      - '.github/workflows/increment-59i-combined-parent-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-59i-combined-parent-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Exact merge tree and independent parent reviews
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      TARGET_HEAD: 2ebaa2ef5561eab35aa0ba9caced5c5a314d59f6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Locate and reproduce the exact target merge
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-combined-parent-audit"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/head.txt"
          git merge-base --is-ancestor "$TARGET_HEAD" HEAD
          mapfile -t matches < <(
            for commit in $(git rev-list --merges HEAD); do
              read -r -a parents <<<"$(git show -s --format=%P "$commit")"
              if [ "${#parents[@]}" -eq 2 ] && [ "${parents[1]}" = "$TARGET_HEAD" ]; then
                printf '%s\n' "$commit"
              fi
            done
          )
          test "${#matches[@]}" -eq 1
          merge="${matches[0]}"
          first=$(git rev-parse "$merge^1")
          second=$(git rev-parse "$merge^2")
          test "$second" = "$TARGET_HEAD"
          printf '%s\n' "$merge" > "$out/merge-head.txt"
          printf '%s\n' "$first" > "$out/feature-parent.txt"
          printf '%s\n' "$second" > "$out/target-parent.txt"
          git rev-parse "$merge^{tree}" > "$out/merge-tree.txt"

          replay="$RUNNER_TEMP/increment-59i-merge-replay"
          git worktree add --detach "$replay" "$first"
          (
            cd "$replay"
            git config user.name '59i merge replay'
            git config user.email 'merge-replay@example.invalid'
            git merge --no-ff --no-commit -X ours "$TARGET_HEAD"
            test -z "$(git diff --name-only --diff-filter=U)"
            git write-tree > "$out/replayed-tree.txt"
          )
          diff -u "$out/merge-tree.txt" "$out/replayed-tree.txt"
          git worktree remove --force "$replay"

          # Before local-enable promotion, no production source may have changed
          # after the exact target merge. Review/workflow documentation may.
          if git diff --no-renames --name-only "$merge" HEAD | grep -E '(^|/)src/main/' > "$out/post-merge-production.txt"; then
            cat "$out/post-merge-production.txt"
            exit 1
          fi

      - name: Verify the pre-target 59i parent with its original reviewers
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-combined-parent-audit"
          first=$(cat "$out/feature-parent.txt")
          feature="$RUNNER_TEMP/increment-59i-feature-parent"
          git worktree add --detach "$feature" "$first"
          (
            cd "$feature"
            python3 morphhdl/scripts/check-increment-59i-source-review.py
            python3 morphhdl/scripts/check-increment-59i-source-review.py --self-test
            python3 morphhdl/scripts/test-increment-59i-review-composition.py
            python3 morphhdl/scripts/check-increment-59i-widening-source-review.py
            test ! -f morphhdl/scripts/test-increment-59i-widening-source-review.py || \
              python3 morphhdl/scripts/test-increment-59i-widening-source-review.py
            python3 morphhdl/scripts/check-increment-59g-source-review.py
            python3 morphhdl/scripts/check-increment-59h-source-review.py
            python3 morphhdl/scripts/test-increment-59h-inherited-source-scope.py
            python3 morphhdl/scripts/check-wa07b-inherited-review.py
            python3 morphhdl/scripts/test-wa07b-inherited-review.py
            python3 morphhdl/scripts/check-native-source-preservation.py
            python3 morphhdl/scripts/check-typed-native-source-overlay.py
          ) 2>&1 | tee "$out/feature-parent-audits.log"
          git worktree remove --force "$feature"

      - name: Verify the exact signed-Verilog target parent independently
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-combined-parent-audit"
          target="$RUNNER_TEMP/increment-59i-target-parent"
          git worktree add --detach "$target" "$TARGET_HEAD"
          (
            cd "$target"
            python3 morphhdl/scripts/check-increment-60g-source-scope.py
            python3 morphhdl/scripts/check-increment-60g-source-scope.py --self-test
            python3 morphhdl/scripts/check-increment-60g-default-rollout.py self-test
            python3 morphhdl/scripts/check-increment-60f-equivalence-closure.py --source-only
            python3 morphhdl/scripts/test-increment-60f-inherited-source-scope.py
            python3 morphhdl/scripts/test-increment-59f-source-scope.py
            python3 morphhdl/scripts/test-increment-59c-inherited-source-scope.py
            python3 morphhdl/scripts/check-increment-59h-source-review.py
            python3 morphhdl/scripts/test-increment-59h-inherited-source-scope.py
            python3 morphhdl/scripts/check-increment-59g-source-review.py
            python3 morphhdl/scripts/check-wa07b-inherited-review.py
            python3 morphhdl/scripts/test-wa07b-inherited-review.py
            python3 morphhdl/scripts/check-increment-60f-artifacts.py self-test
            python3 morphhdl/scripts/check-native-source-preservation.py
            python3 morphhdl/scripts/check-typed-native-source-overlay.py
          ) 2>&1 | tee "$out/target-parent-audits.log"
          git worktree remove --force "$target"

      - name: Record exact combined source identity
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/increment-59i-combined-parent-audit"
          git status --porcelain > "$out/status.txt"
          test ! -s "$out/status.txt"
          git ls-tree -r --full-tree HEAD | sha256sum > "$out/head-tree-list.sha256"
          git diff --no-renames --name-status "$(cat "$out/feature-parent.txt")" HEAD > "$out/feature-to-head.txt"
          git diff --no-renames --name-status "$TARGET_HEAD" HEAD > "$out/target-to-head.txt"

      - name: Upload exact audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-59i-combined-parent-audit-${{ github.sha }}
          path: target/increment-59i-combined-parent-audit
          if-no-files-found: error
          retention-days: 14

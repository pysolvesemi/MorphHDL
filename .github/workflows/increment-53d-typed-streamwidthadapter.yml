name: Increment 53d typed StreamWidthAdapter

on:
  push:
    branches:
      - agent/increment-53d-typed-streamwidthadapter-clean
      - parameterized-verilog
  pull_request:
    branches:
      - parameterized-verilog
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-53d-typed-streamwidthadapter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Typed architecture and exact source scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact permanent Increment 53d delta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${GITHUB_REF_NAME}" = "parameterized-verilog" ]; then
            base="$(git rev-parse HEAD^)"
          else
            git fetch origin parameterized-verilog
            base="$(git merge-base HEAD origin/parameterized-verilog)"
          fi

          actual="$(git diff --name-only "$base"...HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/increment-53d-typed-streamwidthadapter.yml \
            core/src/main/scala/spinal/core/BitVector.scala \
            core/src/main/scala/spinal/core/Bits.scala \
            core/src/main/scala/spinal/core/ElabInt.scala \
            core/src/main/scala/spinal/core/ParameterizedWidth.scala \
            core/src/main/scala/spinal/core/SInt.scala \
            core/src/main/scala/spinal/core/UInt.scala \
            core/src/main/scala/spinal/core/core.scala \
            docs/morphhdl/increment-53d-typed-native-change-manifest.md \
            docs/morphhdl/parameterized-verilog-todo.md \
            docs/morphhdl/typed-elaboration-architecture.md \
            frontend/src/main/scala/morphhdl/frontend/HdlInt.scala \
            lib/src/main/scala/spinal/lib/Stream.scala \
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala \
            morphhdl/src/test/scala/morphhdl/ParameterizedStreamWidthAdapterTests.scala \
            morphhdl/src/test/scala/morphhdl/TypedElaborationControlTests.scala \
            morphhdl/src/test/scala/morphhdl/TypedParameterizedFactoryDirectionTests.scala \
            morphhdl/src/test/scala/morphhdl/TypedStreamWidthAdapterFormalEquivalenceTests.scala \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlPlugin.scala \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlTypedElaborationControlComponent.scala \
            morphruntime/src/main/scala/spinal/core/ElabControl.scala | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected Increment 53d file inventory" >&2
            echo "--- expected ---" >&2
            printf '%s\n' "$expected" >&2
            echo "--- actual ---" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi

          if printf '%s\n' "$actual" | grep -E '(\.patch(\.gz\.b64)?$|apply-increment-53d|publisher|diagnostic|status\.md$)'; then
            echo "Temporary patch/publisher/diagnostic artifact entered the clean delta" >&2
            exit 1
          fi
          git diff --check "$base"...HEAD

      - name: Verify typed implementation invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          stream = Path("lib/src/main/scala/spinal/lib/Stream.scala").read_text()
          start = stream.index("object StreamWidthAdapter {")
          end = stream.index("//padding=true allow", start)
          adapter = stream[start:end]
          for token in (
              "val inputWidth: ElabInt = widthOfExpr(input.payload)",
              "val outputWidth: ElabInt = widthOfExpr(output.payload)",
              "ElabInt.requireSingleSymbolicRoot",
              "val factorExpr",
              "constantInt(\"StreamWidthAdapter downsize factor\")",
              "constantInt(\"StreamWidthAdapter upsize factor\")",
          ):
              assert token in adapter, token
          for forbidden in (
              "NativeIntShadow",
              "withWidthFunctionBoundary",
              "rewriteParameterizedStreamWidthAdapter",
              "MorphStreamWidthAdapter",
          ):
              assert forbidden not in adapter, forbidden

          factories = {
              "Bits.scala": "ParameterizedWidth.attach(Bits(), width)",
              "UInt.scala": "ParameterizedWidth.attach(UInt(), width)",
              "SInt.scala": "ParameterizedWidth.attach(SInt(), width)",
          }
          for name, token in factories.items():
              text = Path("core/src/main/scala/spinal/core", name).read_text()
              assert token in text, (name, token)

          carrier = Path("core/src/main/scala/spinal/core/ElabInt.scala").read_text()
          assert "final class ElabInt" in carrier
          assert "final class ElabBool" in carrier
          assert "def elabEq" in carrier
          assert "def elabNe" in carrier
          assert "def requireSingleSymbolicRoot" in carrier
          assert "implicit def" not in carrier

          bridge = Path(
              "morphplugin/src/main/scala/morphhdl/compiler/"
              "MorphHdlTypedElaborationControlComponent.scala"
          ).read_text()
          assert "TypedIntegerBinding" in bridge
          assert "TypedBooleanBinding" in bridge
          assert "NativeIntShadow" not in bridge
          assert "StreamWidthAdapter" not in bridge
          assert "StreamFifo" not in bridge

          fixture = Path(
              "morphhdl/src/test/scala/morphhdl/"
              "ParameterizedStreamWidthAdapterTests.scala"
          ).read_text()
          assert "equalWidth: ElabInt" in fixture
          assert "downWidth: ElabInt" in fixture
          assert "upWidth: ElabInt" in fixture
          assert "NativeIntShadow" not in fixture
          assert "formalComponent" not in fixture
          assert "SPINAL-ELAB-INT-INDEPENDENT-ROOTS-UNSUPPORTED" in fixture

          formal = Path(
              "morphhdl/src/test/scala/morphhdl/"
              "TypedStreamWidthAdapterFormalEquivalenceTests.scala"
          ).read_text()
          assert "equiv_status -assert" in formal
          assert "mutation produces a genuine counterexample" in formal
          PY

  sbt-full:
    name: SBT complete suite Scala ${{ matrix.scala_version }}
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version:
          - "2.12.18"
          - "2.13.12"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Compile all production and test sources
        shell: bash
        run: sbt -batch "++${{ matrix.scala_version }}" compile Test/compile
      - name: Run complete MorphHDL test suite
        shell: bash
        run: sbt -batch "++${{ matrix.scala_version }}" "morph/test"

  mill-full:
    name: Mill complete suite Scala ${{ matrix.scala_version }}
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    strategy:
      fail-fast: false
      matrix:
        scala_version:
          - "2.12.18"
          - "2.13.12"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Mill
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/mill
          chmod +x /tmp/mill
      - name: Run complete MorphHDL test suite
        shell: bash
        run: /tmp/mill morph[${{ matrix.scala_version }}].test

  typed-without-native-shadow:
    name: Typed adapter without native-Int shadow Scala ${{ matrix.scala_version }}
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version:
          - "2.12.18"
          - "2.13.12"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Disable legacy native-Int shadow registration in this proof workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path(
              "morphplugin/src/main/scala/morphhdl/compiler/MorphHdlPlugin.scala"
          )
          text = path.read_text()
          needle = "      new MorphHdlNativeIntShadowExpressionComponent(global),\n"
          assert text.count(needle) == 1
          path.write_text(text.replace(needle, "", 1))
          PY
          git diff --check
      - name: Compile and run direct typed regressions
        shell: bash
        run: |
          sbt -batch "++${{ matrix.scala_version }}" compile Test/compile
          sbt -batch "++${{ matrix.scala_version }}" \
            "morph/testOnly morphhdl.TypedElaborationControlTests morphhdl.TypedParameterizedFactoryDirectionTests morphhdl.ParameterizedStreamWidthAdapterTests"

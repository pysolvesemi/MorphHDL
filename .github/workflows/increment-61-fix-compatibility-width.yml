name: Increment 61 reseal compatibility width ceiling

on:
  push:
    branches:
      - agent/increment-61-one-file-per-component
    paths:
      - '.github/workflows/increment-61-fix-compatibility-width.yml'

permissions:
  contents: write

concurrency:
  group: increment-61-reseal-compatibility-width
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reseal exact source review and remove the temporary helper
        shell: bash
        run: |
          set -euo pipefail
          expected_parent=dee20b8b211f2e65b1e4c90aeb247d4b74f29bf0
          original=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$expected_parent"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          matrix = Path('morphhdl/src/test/scala/morphhdl/Increment61CompatibilityMatrix.scala')
          contract = Path('morphhdl/contracts/increment-61-source-review.json')
          checker = Path('morphhdl/scripts/check-increment-61-source-review.py')

          matrix_text = matrix.read_text()
          marker = 'bitVectorWidthMax = 8192,'
          if matrix_text.count(marker) != 1:
              raise SystemExit('compatibility width-ceiling marker is missing or duplicated')

          matrix_sha = hashlib.sha256(matrix.read_bytes()).hexdigest()
          data = json.loads(contract.read_text())
          matches = [
              entry for entry in data['reviewed_files']
              if entry['path'] == 'morphhdl/src/test/scala/morphhdl/Increment61CompatibilityMatrix.scala'
          ]
          if len(matches) != 1:
              raise SystemExit('compatibility matrix review entry is not unique')
          matches[0]['after_sha256'] = matrix_sha
          contract.write_text(json.dumps(data, indent=2) + '\n')

          contract_sha = hashlib.sha256(contract.read_bytes()).hexdigest()
          checker_text = checker.read_text()
          checker_text, count = re.subn(
              r'CONTRACT_SHA256 = "[0-9a-f]{64}"',
              f'CONTRACT_SHA256 = "{contract_sha}"',
              checker_text,
              count=1
          )
          if count != 1:
              raise SystemExit('contract digest replacement precondition failed')
          checker.write_text(checker_text)

          print('matrix_sha256=' + matrix_sha)
          print('contract_sha256=' + contract_sha)
          PY

          git rm .github/workflows/increment-61-fix-compatibility-width.yml
          git add \
            morphhdl/contracts/increment-61-source-review.json \
            morphhdl/scripts/check-increment-61-source-review.py
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m '61: qualify the complete symbolic width domain' \
            -m 'Raise only the Increment 61 compatibility fixture bitVectorWidthMax to 8192 so its declared legal nested-field domain, which reaches 4998 bits, is exercised rather than artificially narrowed. Reseal the exact source-review contract; production publication logic is unchanged.'

          python3 morphhdl/scripts/check-increment-61-source-review.py
          python3 morphhdl/scripts/check-increment-61-source-review.py --self-test

          remote=$(git ls-remote origin refs/heads/agent/increment-61-one-file-per-component | cut -f1)
          test "$remote" = "$original"
          git push origin HEAD:refs/heads/agent/increment-61-one-file-per-component

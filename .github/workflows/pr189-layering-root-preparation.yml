name: PR189 layering root repair preparation
on:
  push:
    branches: [agent/cdc-independent-parameter-consumers]
    paths: [.github/workflows/pr189-layering-root-preparation.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'pysolvesemi/MorphHDL'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare exact patch, run source gates, publish Git objects only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, hashlib, json, os, re, subprocess, urllib.request
          from pathlib import Path
          root = Path.cwd()
          expected = '4d05c36cd393eeefcd0aa57e5a4da2522656683b'
          prep = '.github/workflows/pr189-layering-root-preparation.yml'
          out = root / 'target/pr189-layering-preparation'
          out.mkdir(parents=True, exist_ok=True)
          def git(*args):
              return subprocess.check_output(['git', *args], cwd=root)
          parent = git('rev-parse', 'HEAD^').decode().strip()
          assert parent == expected, (parent, expected)
          assert git('diff', '--name-only', parent, 'HEAD').decode().splitlines() == [prep]
          preparation = git('rev-parse', 'HEAD').decode().strip()
          old = subprocess.run(['python3', 'morphhdl/scripts/check-typed-layering-ir.py'], cwd=root,
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          (out/'original-failure.log').write_text(old.stdout)
          assert old.returncode != 0 and 'unscanned production roots: repro/cdc-independent-parameters/src/main' in old.stdout, old.stdout
          print('ORIGINAL_FAILURE_REPRODUCED', flush=True)
          lc = 'morphhdl/contracts/increment-54-typed-layering-ir.contract'
          lh = 'morphhdl/scripts/check-typed-layering-ir.py'
          oc = 'morphhdl/contracts/increment-62-wa08-source-overlay.json'
          oh = 'morphhdl/scripts/check-increment-62-wa08-source-overlay.py'
          cw = '.github/workflows/cdc-independent-parameter-consumers.yml'
          sr = 'repro/cdc-independent-parameters/test_source_review.py'
          test = 'repro/cdc-independent-parameters/test_layering_root.py'
          def replace(path, before, after):
              p = root/path
              text = p.read_text()
              assert text.count(before) == 1, (path, before, text.count(before))
              p.write_text(text.replace(before, after, 1))
          original = json.loads((root/lc).read_text())
          value = copy.deepcopy(original)
          new_root = 'repro/cdc-independent-parameters/src/main'
          assert new_root not in value['production_source_roots']
          value['production_source_roots'] = sorted(value['production_source_roots'] + [new_root])
          changed_rules = []
          for rule in value['forbidden_source_rules']:
              if 'repro/independent-parameters/src/main/' in rule['path_prefixes']:
                  assert new_root+'/' not in rule['path_prefixes']
                  rule['path_prefixes'] = sorted(rule['path_prefixes'] + [new_root+'/'])
                  changed_rules.append(rule['id'])
          assert changed_rules, 'no all-source rules extended'
          (root/lc).write_text(json.dumps(value, indent=2)+'\n')
          digest = hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode()).hexdigest()
          replace(lh, 'EXPECTED_CONTRACT_SHA256 = "0bede059b85d46778134d389947e092e5f1b9953458825a33aaa9fd743fcaa47"',
              'EXPECTED_CONTRACT_SHA256 = "'+digest+'"')
          replace(cw, '# Only the two sealed review-metadata files may differ from the baseline.',
              '# Only these four independently sealed audit-metadata files may differ from the baseline.')
          replace(cw, "' :(exclude)PLACEHOLDER'".replace(' :', ':'), '') if False else None
          replace(cw, "            ':(exclude)morphhdl/contracts/increment-62-wa08-source-overlay.json'\n",
              "            ':(exclude)morphhdl/contracts/increment-62-wa08-source-overlay.json' \\\n"+
              "            ':(exclude)morphhdl/contracts/increment-54-typed-layering-ir.contract' \\\n"+
              "            ':(exclude)morphhdl/scripts/check-typed-layering-ir.py'\n")
          replace(cw, '          python3 repro/cdc-independent-parameters/test_source_review.py\n',
              '          python3 repro/cdc-independent-parameters/test_source_review.py\n'+
              '          python3 morphhdl/scripts/check-typed-layering-ir.py\n'+
              '          python3 repro/cdc-independent-parameters/test_layering_root.py\n')
          replace(sr, 'REVIEWED = (\n', 'LAYERING_HELPER = "'+lh+'"\nLAYERING_CONTRACT = "'+lc+'"\nREVIEWED = (\n    LAYERING_HELPER,\n    LAYERING_CONTRACT,\n    "'+test+'",\n')
          replace(sr, '":(exclude)" + HELPER, ":(exclude)" + CONTRACT], cwd=root)',
              '":(exclude)" + HELPER, ":(exclude)" + CONTRACT,\n        ":(exclude)" + LAYERING_HELPER, ":(exclude)" + LAYERING_CONTRACT], cwd=root)')
          (root/test).write_text('''#!/usr/bin/env python3
          """The CDC reproducer is scanned, not excluded, by the closed layering guard."""
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          HELPER = "morphhdl/scripts/check-typed-layering-ir.py"
          CONTRACT = "morphhdl/contracts/increment-54-typed-layering-ir.contract"
          SOURCE = "repro/cdc-independent-parameters/src/main"

          def check(root, expected=None):
              result = subprocess.run(["python3", str(root / HELPER)], cwd=root,
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              if expected is None:
                  assert result.returncode == 0, result.stdout
              else:
                  assert result.returncode != 0 and expected in result.stdout, result.stdout

          def main():
              manifest = json.loads((ROOT / CONTRACT).read_text())
              assert SOURCE in manifest["production_source_roots"]
              broad = [rule for rule in manifest["forbidden_source_rules"]
                       if "repro/independent-parameters/src/main/" in rule["path_prefixes"]]
              assert broad and all(SOURCE + "/" in rule["path_prefixes"] for rule in broad)
              with tempfile.TemporaryDirectory(prefix="cdc-layering-root-") as temporary:
                  fixture = Path(temporary) / "repo"
                  subprocess.run(["git", "worktree", "add", "--quiet", "--detach", str(fixture), "HEAD"], cwd=ROOT, check=True)
                  try:
                      check(fixture)
                      bad = fixture / SOURCE / "scala/LayeringRejected.scala"
                      try:
                          bad.write_text("object Forbidden { val registry = ExternalParameterizedMemoryRegistry }\\n")
                          check(fixture, "obsolete-parameterized-sidecar-symbol")
                      finally:
                          bad.unlink(missing_ok=True)
                      try:
                          bad.write_text("package spinal.core\\nfinal class ElabInt\\n")
                          check(fixture, "elab-int-owner")
                      finally:
                          bad.unlink(missing_ok=True)
                      unknown = fixture / "repro/unreviewed-cdc-root/src/main/scala/Unknown.scala"
                      try:
                          unknown.parent.mkdir(parents=True)
                          unknown.write_text("object Unknown {}\\n")
                          check(fixture, "unscanned production roots: repro/unreviewed-cdc-root/src/main")
                      finally:
                          unknown.unlink(missing_ok=True)
                          for directory in [unknown.parent, unknown.parent.parent, unknown.parent.parent.parent, unknown.parent.parent.parent.parent]:
                              directory.rmdir()
                      check(fixture)
                  finally:
                      subprocess.run(["git", "worktree", "remove", "--force", str(fixture)], cwd=ROOT, check=True)
              print("CDC_LAYERING_ROOT_PASS rejected=3")

          if __name__ == "__main__":
              main()
          ''')
          # This preparatory workflow is not part of the proposed final tree.
          (root/prep).unlink()
          git('config', 'user.name', 'MorphHDL continuation')
          git('config', 'user.email', 'morphhdl-continuation@example.invalid')
          git('add', '--', lc, lh, cw, sr, test, prep)
          git('diff', '--cached', '--check')
          git('commit', '-m', 'Review CDC layering root and retain closed-source negative controls')
          source = git('rev-parse', 'HEAD').decode().strip()
          manifest = json.loads((root/oc).read_text())
          before_entries = copy.deepcopy(manifest['files'])
          entries = {entry['path']: entry for entry in manifest['files']}
          reviewed = [lc, lh, cw, sr, test]
          for path in reviewed:
              if path not in entries:
                  assert not git('ls-tree', manifest['base'], '--', path), path
                  entries[path] = {'path': path, 'mode': '100644', 'before_sha256': None, 'after_sha256': ''}
              entries[path]['after_sha256'] = hashlib.sha256((root/path).read_bytes()).hexdigest()
          manifest['files'] = [entries[path] for path in sorted(entries)]
          manifest['final_source_commit'] = source
          helper = (root/oh).read_bytes()
          normalized = re.sub(rb'^CONTRACT_SHA256 = "[^"]+"$', b'CONTRACT_SHA256 = "MANIFEST_HASH"', helper, count=1, flags=re.M)
          assert hashlib.sha256(normalized).hexdigest() == manifest['helper_normalized_sha256']
          for entry in before_entries:
              if entry['path'] not in reviewed:
                  assert entries[entry['path']] == entry, entry['path']
          raw = (json.dumps(manifest, indent=2)+'\n').encode()
          (root/oc).write_bytes(raw)
          new_helper, count = re.subn(rb'^CONTRACT_SHA256 = "[^"]+"$',
              b'CONTRACT_SHA256 = "'+hashlib.sha256(raw).hexdigest().encode()+b'"', helper, count=1, flags=re.M)
          assert count == 1
          (root/oh).write_bytes(new_helper)
          git('add', '--', oc, oh)
          git('commit', '-m', 'Seal exact CDC layering-root repair without changing validation algorithms')
          final = git('rev-parse', 'HEAD').decode().strip()
          git('diff', '--check')
          commands = [
              ['python3', 'morphhdl/scripts/check-native-source-preservation.py'],
              ['python3', 'morphhdl/scripts/check-increment-58-retirement.py'],
              ['python3', lh], ['python3', lh, '--self-test'],
              ['bash', 'morphhdl/scripts/check-typed-vec-boundary.sh'],
              ['python3', oh], ['python3', sr], ['python3', test],
              ['python3', 'morphhdl/scripts/check-increment-59c-source-review.py', '--self-test'],
              ['python3', 'morphhdl/scripts/check-increment-59c-source-review.py'],
              ['python3', 'morphhdl/scripts/test-increment-59c-inherited-source-scope.py'],
              ['python3', 'morphhdl/scripts/check-increment-59c-named-field-vectors.py', '--self-test'],
              ['python3', 'morphhdl/scripts/check-increment-59c-nested-register-writes.py', '--self-test'],
              ['python3', 'morphhdl/scripts/test-increment-62-wa08-source-overlay.py'],
          ]
          for index, command in enumerate(commands):
              print('CHECK', index, ' '.join(command), flush=True)
              result = subprocess.run(command, cwd=root, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              (out/('%02d.log' % index)).write_text(result.stdout)
              print(result.stdout, flush=True)
              assert result.returncode == 0, (command, result.returncode)
          assert not git('diff', '--name-only') and not git('diff', '--cached', '--name-only')
          (out/'repair.patch').write_bytes(git('diff', expected, final))
          # Upload ONLY exact repository Git objects. Never move a ref, merge a PR,
          # expose the token, upload home files, or enable an unreviewed source gate.
          endpoint = 'https://api.github.com/repos/pysolvesemi/MorphHDL/git/'
          def post(kind, value):
              request = urllib.request.Request(endpoint+kind, data=json.dumps(value).encode(), method='POST', headers={
                  'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          def upload(commit):
              previous = git('rev-parse', commit+'^').decode().strip()
              paths = git('diff', '--no-renames', '--name-only', '-z', previous, commit).decode().strip('\0').split('\0')
              tree_entries = []
              for path in paths:
                  entry = git('ls-tree', commit, '--', path).decode().strip()
                  if not entry:
                      tree_entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  else:
                      mode, kind, sha = entry.split('\t')[0].split()
                      assert kind == 'blob'
                      text = git('show', commit+':'+path).decode('utf-8')
                      blob = post('blobs', {'content': text, 'encoding': 'utf-8'})
                      assert blob['sha'] == sha, path
                      tree_entries.append({'path': path, 'mode': mode, 'type': kind, 'sha': sha})
              tree = post('trees', {'base_tree': git('rev-parse', previous+'^{tree}').decode().strip(), 'tree': tree_entries})
              assert tree['sha'] == git('rev-parse', commit+'^{tree}').decode().strip()
              fields = git('show', '-s', '--format=%an%x00%ae%x00%aI%x00%cn%x00%ce%x00%cI', commit).decode().strip().split('\0')
              message = git('cat-file', 'commit', commit).split(b'\n\n',1)[1].decode()
              remote = post('commits', {'tree': tree['sha'], 'parents': [previous], 'message': message,
                  'author': dict(zip(['name','email','date'], fields[:3])),
                  'committer': dict(zip(['name','email','date'], fields[3:]))})
              assert remote['sha'] == commit, (remote['sha'], commit)
          upload(source)
          upload(final)
          summary = {'preparation_head': preparation, 'source_head': source, 'tested_head': final,
              'tree': git('rev-parse', final+'^{tree}').decode().strip(), 'extended_rules': changed_rules,
              'sealed_files': len(manifest['files']), 'commands_passed': len(commands), 'branch_updated': False}
          (out/'summary.json').write_text(json.dumps(summary, indent=2)+'\n')
          print('PR189_PREPARED_RESULT='+json.dumps(summary), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr189-layering-preparation-${{ github.sha }}
          path: target/pr189-layering-preparation/
          if-no-files-found: error
          retention-days: 14

name: PR189 compact timeout targeted repair

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  # Cleanup must not queue behind the exact superseded run it needs to stop.
  group: ${{ startsWith(github.event.review.body, 'pr189:cancel-superseded:') && 'pr189-compact-cleanup' || 'pr189-compact-timeout' }}-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SBT_TEST_PARALLEL: '0'
  JAVA_TOOL_OPTIONS: '-Xmx2g -XX:ActiveProcessorCount=2'
  JVM_OPTS: '-Xmx4g -Xss2m -XX:ActiveProcessorCount=2'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  cancel-superseded-run:
    name: Cancel only the exact superseded compact candidate
    if: >-
      github.event.action == 'submitted' && github.event.review.state == 'commented' &&
      github.event.review.user.login == github.repository_owner && github.actor == github.repository_owner &&
      github.event.pull_request.number == 189 && github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/cdc-independent-parameter-consumers' &&
      github.event.pull_request.base.ref == 'parameterized-verilog' &&
      github.event.review.commit_id == github.event.pull_request.head.sha &&
      github.event.review.body == format('pr189:cancel-superseded:{0}', github.event.pull_request.head.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run_id = 35135638145;
            const expected_head = '16738974cca6c549925453ef5127ea0e1485f9f2';
            const branch = 'agent/cdc-independent-parameter-consumers';
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id});
            if (run.head_sha !== expected_head || run.head_branch !== branch ||
                run.path !== '.github/workflows/pr189-compact-timeout.yml') {
              throw new Error('Refuse to cancel an unrelated workflow run');
            }
            if (run.status === 'completed') {
              core.info(`ALREADY_COMPLETED ${run_id} ${run.conclusion}`);
            } else {
              try {
                await github.rest.actions.cancelWorkflowRun({...context.repo, run_id});
                core.info(`CANCEL_REQUESTED ${run_id} ${expected_head}`);
              } catch (error) {
                const {data: latest} = await github.rest.actions.getWorkflowRun({...context.repo, run_id});
                if (latest.status !== 'completed') throw error;
                core.info(`COMPLETED_DURING_CANCELLATION ${run_id} ${latest.conclusion}`);
              }
            }
      - name: Extract bounded diagnostic context from the completed predecessor log
        uses: actions/github-script@v7
        with:
          script: |
            const job_id = 104917054262;
            const {data: job} = await github.rest.actions.getJobForWorkflowRun({...context.repo, job_id});
            if (job.run_id !== 35132618002 || job.head_sha !== 'bfe60684049cf263e011d45f3a651b6c00fd7422' ||
                job.status !== 'completed') throw new Error('Diagnostic source is not the pinned completed job');
            const {data} = await github.rest.actions.downloadJobLogsForWorkflowRun({...context.repo, job_id});
            const text = typeof data === 'string' ? data : Buffer.from(data).toString('utf8');
            const lines = text.split('\n');
            const selected = new Set();
            lines.forEach((line, index) => {
              if (/\*\*\* FAILED \*\*\*|NoClassDefFoundError|ClassNotFoundException/.test(line)) {
                for (let i = Math.max(0,index-3); i <= Math.min(lines.length-1,index+50); i++) selected.add(i);
              }
            });
            if (!selected.size) throw new Error('No failure context found in the pinned log');
            const excerpts = [...selected].sort((a,b)=>a-b).slice(0,200).map(i => `${i+1}: ${lines[i]}`).join('\n');
            core.info('PINNED_FAILURE_EXCERPTS_BEGIN\n' + excerpts + '\nPINNED_FAILURE_EXCERPTS_END');

  compact-candidate:
    name: Exact compact declaration, timer and affected compiler checks
    if: >-
      github.event.action == 'submitted' && github.event.review.state == 'commented' &&
      github.event.review.user.login == github.repository_owner && github.actor == github.repository_owner &&
      github.event.pull_request.number == 189 && github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/cdc-independent-parameter-consumers' &&
      github.event.pull_request.base.ref == 'parameterized-verilog' &&
      github.event.review.commit_id == github.event.pull_request.head.sha &&
      github.event.review.body == format('pr189:compact-timeout:{0}', github.event.pull_request.head.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    permissions:
      contents: write
    env:
      EXPECTED_INPUT: ${{ github.event.pull_request.head.sha }}
      EVIDENCE: /tmp/pr189-compact-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
      - name: Construct only the exact reviewed candidate and preserve its identity
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_INPUT"
          git rev-parse HEAD 'HEAD^{tree}' > "$EVIDENCE/input-identity.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 repro/cdc-independent-parameters/prepare_compact_timeout.py 2>&1 | tee "$EVIDENCE/preparation.log"
          git rev-parse HEAD 'HEAD^{tree}' > "$EVIDENCE/candidate-identity.txt"
          git diff --binary "$EXPECTED_INPUT" HEAD > "$EVIDENCE/candidate.patch"
          git bundle create "$EVIDENCE/candidate.bundle" HEAD "^$EXPECTED_INPUT"
      - name: Authenticate clean candidate bytes before compiling any fixture
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          python3 morphhdl/scripts/check-increment-62-wa08-source-overlay.py 2>&1 | tee "$EVIDENCE/early-wa08.log"
          python3 morphhdl/scripts/check-native-source-preservation.py 2>&1 | tee "$EVIDENCE/early-native.log"
          python3 morphhdl/scripts/check-increment-61-source-review.py 2>&1 | tee "$EVIDENCE/early-successor.log"
          java -version 2>&1 | tee "$EVIDENCE/java-version.txt"
          iverilog -V > "$EVIDENCE/iverilog-version.txt" 2>&1
          yosys -V > "$EVIDENCE/yosys-version.txt"
      - name: Recheck the failed 59h mutation boundary before compiler regressions
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/test-increment-59h-inherited-source-scope.py \
            2>&1 | tee "$EVIDENCE/early-59h.log"
          grep -Fx '59h current-source controls PASS: two positives and 28 exact rejections; unchanged 59c historical controls separately scoped' "$EVIDENCE/early-59h.log"
          test "$(git rev-parse HEAD)" = "$(head -n1 "$EVIDENCE/candidate-identity.txt")"
          git diff --exit-code
          git diff --cached --exit-code
      # Keep every existing compiler, simulation and late source-mutation gate.
      # The extra fail-fast check above prevents a known audit defect from being
      # discovered only after both long inherited compiler regression suites.
      - name: Scala 2.12.18 native generation and exact construction rejections
        run: |
          set -euo pipefail
          destination="$EVIDENCE/scala-2.12.18"
          mkdir -p "$destination"
          cd repro/cdc-independent-parameters
          sbt -batch -no-colors '++2.12.18!' \
            "runMain spinal.core.CompactTimeoutGenerate $destination/first" \
            "runMain spinal.core.CompactTimeoutGenerate $destination/repeat" \
            "runMain spinal.core.CompactTimeoutSafety $destination/safety" \
            "runMain spinal.core.CdcConsumerSuccess $destination/consumers" \
            "runMain spinal.core.CdcConsumerSuccess $destination/consumers-repeat" \
            "runMain spinal.core.CdcConsumerSafety $destination/consumer-safety" \
            2>&1 | tee "$destination/compiler.log"
          grep -F 'COMPACT_TIMEOUT_SAFETY_PASS controls=9' "$destination/compiler.log"
          grep -F 'COMPACT_PHYSICAL_WIDTH_REJECTION_PASS' "$destination/compiler.log"
      - name: Scala 2.12.18 same-artifact timer, geometry and record simulation and synthesis
        run: |
          set -euo pipefail
          destination="$EVIDENCE/scala-2.12.18"
          cd repro/cdc-independent-parameters
          python3 check_compact_timeout.py "$destination/first" "$destination/repeat" "$destination/validation" \
            2>&1 | tee "$destination/timer-validation.log"
          python3 check_consumers.py "$destination/consumers" "$destination/consumers-repeat" "$destination/consumer-validation" \
            2>&1 | tee "$destination/consumer-validation.log"
      - name: Scala 2.13.12 native generation and exact construction rejections
        run: |
          set -euo pipefail
          destination="$EVIDENCE/scala-2.13.12"
          mkdir -p "$destination"
          cd repro/cdc-independent-parameters
          sbt -batch -no-colors '++2.13.12!' \
            "runMain spinal.core.CompactTimeoutGenerate $destination/first" \
            "runMain spinal.core.CompactTimeoutGenerate $destination/repeat" \
            "runMain spinal.core.CompactTimeoutSafety $destination/safety" \
            "runMain spinal.core.CdcConsumerSuccess $destination/consumers" \
            "runMain spinal.core.CdcConsumerSuccess $destination/consumers-repeat" \
            "runMain spinal.core.CdcConsumerSafety $destination/consumer-safety" \
            2>&1 | tee "$destination/compiler.log"
          grep -F 'COMPACT_TIMEOUT_SAFETY_PASS controls=9' "$destination/compiler.log"
          grep -F 'COMPACT_PHYSICAL_WIDTH_REJECTION_PASS' "$destination/compiler.log"
      - name: Scala 2.13.12 same-artifact simulation and synthesis and cross-Scala determinism
        run: |
          set -euo pipefail
          destination="$EVIDENCE/scala-2.13.12"
          cd repro/cdc-independent-parameters
          python3 check_compact_timeout.py "$destination/first" "$destination/repeat" "$destination/validation" \
            2>&1 | tee "$destination/timer-validation.log"
          python3 check_consumers.py "$destination/consumers" "$destination/consumers-repeat" "$destination/consumer-validation" \
            2>&1 | tee "$destination/consumer-validation.log"
          diff -ru "$EVIDENCE/scala-2.12.18/first" "$EVIDENCE/scala-2.13.12/first"
          diff -ru "$EVIDENCE/scala-2.12.18/consumers" "$EVIDENCE/scala-2.13.12/consumers"
      - name: Scala 2.12.18 affected core and Morph regression suites
        run: |
          set -euo pipefail
          sbt -batch -no-colors '++2.12.18' core/Test/test morph/Test/test \
            2>&1 | tee "$EVIDENCE/scala-2.12.18/affected-regressions.log"
      - name: Scala 2.13.12 affected core and Morph regression suites
        run: |
          set -euo pipefail
          sbt -batch -no-colors '++2.13.12' core/Test/test morph/Test/test \
            2>&1 | tee "$EVIDENCE/scala-2.13.12/affected-regressions.log"
          test "$(git rev-parse HEAD)" = "$(head -n1 "$EVIDENCE/candidate-identity.txt")"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Recheck every affected source guard and live rejection control
        run: |
          set -euo pipefail
          checks=(
            'git diff --check'
            'python3 morphhdl/scripts/check-increment-62-wa08-source-overlay.py'
            'python3 morphhdl/scripts/check-increment-62-wa08-source-overlay.py --self-test'
            'python3 morphhdl/scripts/check-increment-61-source-review.py'
            'python3 morphhdl/scripts/check-increment-61-source-review.py --self-test'
            'python3 morphhdl/scripts/check-native-source-preservation.py'
            'python3 morphhdl/scripts/check-native-source-preservation.py --self-test'
            'python3 morphhdl/scripts/check-typed-native-source-overlay.py'
            'python3 morphhdl/scripts/check-increment-58-retirement.py'
            'python3 morphhdl/scripts/check-production-retirement.py'
            'python3 morphhdl/scripts/check-typed-layering-ir.py'
            'python3 morphhdl/scripts/check-typed-layering-ir.py --self-test'
            'bash morphhdl/scripts/check-typed-vec-boundary.sh'
            'python3 repro/cdc-independent-parameters/test_layering_root.py'
            'python3 morphhdl/scripts/check-increment-60g-source-scope.py'
            'python3 morphhdl/scripts/test-increment-59h-inherited-source-scope.py'
            'python3 morphhdl/scripts/test-increment-59c-inherited-source-scope.py'
            'python3 morphhdl/scripts/check-increment-60f-equivalence-closure.py --source-only'
          )
          failures=0
          index=0
          : > "$EVIDENCE/source-results.tsv"
          for check in "${checks[@]}"; do
            index=$((index + 1))
            if bash -e -o pipefail -c "$check" > "$EVIDENCE/source-$index.log" 2>&1; then
              printf 'PASS\t%s\n' "$check" >> "$EVIDENCE/source-results.tsv"
            else
              failures=$((failures + 1))
              printf 'FAIL\t%s\n' "$check" >> "$EVIDENCE/source-results.tsv"
            fi
            cat "$EVIDENCE/source-$index.log"
          done
          test "$index" = 18
          test "$failures" = 0
          test "$(git rev-parse HEAD)" = "$(head -n1 "$EVIDENCE/candidate-identity.txt")"
          git diff --exit-code
          git diff --cached --exit-code
          printf '%s\n' 'PR189_COMPACT_TARGETED_PASS' > "$EVIDENCE/targeted-pass.txt"
      - name: Publish only the passing candidate to the unchanged existing branch
        run: |
          set -euo pipefail
          test "$(cat "$EVIDENCE/targeted-pass.txt")" = PR189_COMPACT_TARGETED_PASS
          branch='agent/cdc-independent-parameter-consumers'
          actual=$(git ls-remote --exit-code origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$EXPECTED_INPUT"
          git merge-base --is-ancestor "$EXPECTED_INPUT" HEAD
          for commit in $(git rev-list "$EXPECTED_INPUT..HEAD"); do
            git show -s --format=%B "$commit" | grep -F '[skip ci]'
          done
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > "$EVIDENCE/published-head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr189-compact-candidate-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: /tmp/pr189-compact-evidence/
          if-no-files-found: error
          retention-days: 30

# Only affected qualification is selected. No full workflow/formal dispatch,
# ready transition, target update, new branch or merge is performed here.

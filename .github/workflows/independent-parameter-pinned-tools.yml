name: Independent parameter pinned verification tools
on:
  push:
    branches: [agent/independent-parameter-domain-composition]
    paths: ['.github/workflows/independent-parameter-pinned-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - name: Package the existing pinned verification toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/tools/bin evidence/tools/share evidence/tools/lib
          yosys -V | tee evidence/versions.txt
          grep -Eq '^Yosys 0\.41([ +]|$)' evidence/versions.txt
          verilator --version | tee -a evidence/versions.txt
          bin="$(dirname "$(command -v yosys)")"
          for tool in yosys yosys-abc yosys-smtbmc; do
            source="$(command -v "$tool")"
            cp -L "$source" "evidence/tools/bin/$tool"
          done
          data="$(yosys-config --datdir 2>/dev/null || true)"
          if [ ! -d "$data" ]; then
            for candidate in "$bin/../share/yosys" /usr/local/share/yosys /usr/share/yosys; do
              if [ -d "$candidate" ]; then data="$candidate"; break; fi
            done
          fi
          test -d "$data"
          cp -a "$data" evidence/tools/share/yosys
          for tool in yosys yosys-abc; do
            ldd "$(command -v "$tool")" | awk '/=> \/.* \(/{print $3}' | while read -r lib; do
              case "$(basename "$lib")" in libc.so.*|libm.so.*|libstdc++*|libgcc_s*|libpthread*|libdl*|librt*) ;;
                *) cp -L "$lib" evidence/tools/lib/;;
              esac
            done
          done
          tar -C evidence -czf evidence/pinned-yosys-tools.tar.gz tools
          rm -rf evidence/tools
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-parameter-pinned-tools-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

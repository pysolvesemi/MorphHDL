name: WIRE-TRUNC-01 pinned targeted launcher 17434bd69a92

on:
  push:
    branches: ['ci/wire-trunc-01-17434bd69a92']
    paths: ['.github/workflows/wire-trunc-01-targeted-17434bd69a92.yml']

permissions:
  contents: read
  actions: write

concurrency:
  group: wire-trunc-01-dispatch-17434bd69a92
  cancel-in-progress: false

# Control-only branch: never merge it into the feature or integration branch.
# The complete inherited active workflow push-trigger inventory was reviewed at
# base 09880c538c4cf83022f4a1bb1dd16b43ea81a751, workflows tree
# f24abe62065ad82b0edf74b73ebdb1c7e5b54a62. No inherited push trigger matches
# this exact ci/ branch. Only this file differs from that audited integration.
# No repository code is checked out/executed with this Actions-write token.
# The sole permitted mutation is the allowlisted workflow_dispatch POST below.

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Validate exact identities and dispatch only the affected wire workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          REPO = 'pysolvesemi/MorphHDL'
          BASE = '09880c538c4cf83022f4a1bb1dd16b43ea81a751'
          BRANCH = 'agent/wire-trunc-01-assignment-absorption'
          HEAD = '17434bd69a92cafc630c1ecc8893c5e40e05055c'
          TREE = '13e0dac9b8d29eef80f8fd380ca1b9bd087a0be1'
          CONTROL = 'ci/wire-trunc-01-17434bd69a92'
          CONTROL_FILE = '.github/workflows/wire-trunc-01-targeted-17434bd69a92.yml'
          WORKFLOW = 362756881
          WORKFLOW_PATH = '.github/workflows/cdc-wire-fixed-point.yml'
          PAYLOAD = {'ref': BRANCH}
          API = 'https://api.github.com/repos/' + REPO
          ledger = {'schema': 1, 'repository': REPO, 'pr': 193, 'base': BASE,
                    'head': HEAD, 'tree': TREE, 'branch': BRANCH,
                    'workflow_id': WORKFLOW, 'workflow_path': WORKFLOW_PATH,
                    'payload': PAYLOAD, 'controller_sha': os.environ['GITHUB_SHA'],
                    'controller_run': os.environ['GITHUB_RUN_ID'], 'requests': []}

          def request(path, method='GET', data=None):
              assert path.startswith('/') and not path.startswith('//')
              if method != 'GET':
                  assert method == 'POST' and path == f'/actions/workflows/{WORKFLOW}/dispatches'
                  assert data == PAYLOAD
              assert method == 'GET' or data is not None
              body = None if data is None else json.dumps(data).encode()
              req = Request(API + path, data=body, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json'})
              with urlopen(req, timeout=30) as response:
                  raw = response.read()
                  ledger['requests'].append({'method': method, 'path': path,
                                              'status': response.status})
                  if method == 'POST':
                      assert response.status == 204
                  return json.loads(raw) if raw else None

          def validate():
              pr = request('/pulls/193')
              assert pr['state'] == 'open' and not pr['merged']
              assert pr['head']['repo']['full_name'] == REPO
              assert pr['head']['ref'] == BRANCH and pr['head']['sha'] == HEAD
              assert pr['base']['repo']['full_name'] == REPO
              assert pr['base']['ref'] == 'parameterized-verilog' and pr['base']['sha'] == BASE
              assert request('/git/ref/heads/' + BRANCH)['object']['sha'] == HEAD
              assert request('/git/ref/heads/parameterized-verilog')['object']['sha'] == BASE
              assert request('/git/commits/' + HEAD)['tree']['sha'] == TREE
              workflow = request('/actions/workflows/' + str(WORKFLOW))
              assert workflow['id'] == WORKFLOW and workflow['path'] == WORKFLOW_PATH
              assert workflow['state'] == 'active'

          def matching_runs():
              rows = []
              for page in range(1, 11):
                  query = urlencode({'head_sha': HEAD, 'branch': BRANCH,
                                     'per_page': 100, 'page': page})
                  result = request('/actions/runs?' + query)
                  assert result['total_count'] < 1000
                  batch = result['workflow_runs']
                  rows.extend(batch)
                  if len(batch) < 100:
                      break
              else:
                  raise AssertionError('run inventory exceeded the bounded complete scan')
              return [row for row in rows if row['workflow_id'] == WORKFLOW
                      and row['head_sha'] == HEAD and row['head_branch'] == BRANCH]

          try:
              assert os.environ['GITHUB_REPOSITORY'] == REPO
              assert os.environ['GITHUB_REF'] == 'refs/heads/' + CONTROL
              assert os.environ['GITHUB_EVENT_NAME'] == 'push'
              commit = request('/git/commits/' + os.environ['GITHUB_SHA'])
              assert [parent['sha'] for parent in commit['parents']] == [BASE]
              difference = request('/compare/' + BASE + '...' + os.environ['GITHUB_SHA'])
              assert difference['status'] == 'ahead' and difference['ahead_by'] == 1
              assert [item['filename'] for item in difference['files']] == [CONTROL_FILE]
              assert difference['files'][0]['status'] == 'added'
              validate()
              existing = matching_runs()
              if existing:
                  assert all(row['event'] == 'workflow_dispatch' for row in existing)
                  assert any(row['status'] != 'completed' or row['conclusion'] == 'success'
                             for row in existing), 'failed source needs triage, not duplicate dispatch'
                  ledger['outcome'] = 'reused_existing_run'
              else:
                  validate()
                  request(f'/actions/workflows/{WORKFLOW}/dispatches', 'POST', PAYLOAD)
                  ledger['outcome'] = 'dispatch_accepted'
                  for attempt in range(12):
                      existing = matching_runs()
                      if existing:
                          break
                      time.sleep(3)
                  assert len(existing) == 1, 'cannot authenticate one exact-head dispatched run'
                  assert existing[0]['event'] == 'workflow_dispatch'
              ledger['runs'] = [{'id': row['id'], 'url': row['html_url'],
                                  'head_sha': row['head_sha'], 'event': row['event'],
                                  'status': row['status'], 'conclusion': row['conclusion']}
                                 for row in existing]
              print(json.dumps({key: value for key, value in ledger.items() if key != 'requests'}, indent=2))
          except Exception as error:
              ledger['error'] = str(error)
              raise
          finally:
              Path('wire-trunc-01-dispatch-ledger.json').write_text(json.dumps(ledger, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wire-trunc-01-dispatch-17434bd69a92-${{ github.run_id }}-${{ github.run_attempt }}
          path: wire-trunc-01-dispatch-ledger.json
          if-no-files-found: error
          retention-days: 30

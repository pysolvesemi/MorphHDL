name: WA-04 witness phase-order repair

on:
  push:
    branches:
      - agent/wa-04-unnamed-simple-wire-elimination
    paths:
      - ".github/workflows/wa04-phase-order-fix.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out WA-04 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore fixed observation interface and repair phase ordering
        shell: bash
        run: |
          set -euo pipefail

          git checkout 87a317abf8ba48ae3772e015bafe9d20049664a5 -- \
            morphhdl-passes/examples/ParameterizedStreamFifo.scala \
            morphhdl-passes/tests/formal/wire_assignment_ir/manifest.json \
            morphhdl-passes/tests/formal/wire_assignment_ir/parameterized_witness_tb.v

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          bridge = Path("morphhdl-passes/examples/UnnamedWireAliasNativeBridge.scala")
          text = bridge.read_text(encoding="utf-8")
          old = "nativeAliasPasses.drop(1).reverse.foreach(index => phases.remove(index))"
          new = "nativeAliasPasses.drop(2).reverse.foreach(index => phases.remove(index))"
          if text.count(old) != 1:
              raise SystemExit("WA-04 phase-plan replacement target is not unique")
          bridge.write_text(text.replace(old, new), encoding="utf-8")

          signatures_path = Path(
              "morphhdl-passes/tests/formal_model/wire_assignment_ir/expected-signatures.json"
          )
          signatures = json.loads(signatures_path.read_text(encoding="utf-8"))
          for relative in signatures["files"]:
              payload = Path(relative).read_bytes()
              signatures["files"][relative] = hashlib.sha256(payload).hexdigest()
          signatures_path.write_text(
              json.dumps(signatures, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          rm .github/workflows/wa04-phase-order-fix.yml

          python3 morphhdl-passes/scripts/check-wa03-gates.py --self-test
          python3 morphhdl-passes/scripts/check-wa03-gates.py
          python3 morphhdl-passes/scripts/check-wa04-pass.py --self-test
          python3 morphhdl-passes/scripts/check-wa04-pass.py
          python3 morphhdl-passes/scripts/validate_wire_assignment_equivalence.py --self-test

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "WA-04: retain width cleanup before alias pass"
          git push origin "HEAD:${GITHUB_REF_NAME}"

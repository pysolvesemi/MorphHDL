name: Increment 53e classify closure failure

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write

concurrency:
  group: increment-53e-classify-failure
  cancel-in-progress: true

jobs:
  classify:
    if: ${{ github.actor == 'github-actions[bot]' && !contains(github.event.head_commit.message, '[53e-classified:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0

      - name: Classify diagnostic
        shell: bash
        run: |
          set -euo pipefail
          diagnostic=morphhdl/diagnostics/increment-53e-final-latest.txt
          test -f "$diagnostic" || exit 0
          code=UNKNOWN
          if grep -qi 'Conclusion: skipped' "$diagnostic"; then
            code=SKIPPED
          elif grep -Eqi 'CONFLICT|merge conflict|Automatic merge failed' "$diagnostic"; then
            code=MERGE_CONFLICT
          elif grep -qi 'generic-native-runtime-selection.py' "$diagnostic"; then
            code=RUNTIME_MATERIALIZATION
          elif grep -qi 'generic-native-compiler-selection.py' "$diagnostic"; then
            code=COMPILER_MATERIALIZATION
          elif grep -Eqi 'ExternalNativeIntShadowRegistry\.scala:.*(error|\[error\])' "$diagnostic"; then
            code=RUNTIME_COMPILE
          elif grep -Eqi 'MorphHdlNativeIntShadowExpressionComponent\.scala:.*(error|\[error\])' "$diagnostic"; then
            code=COMPILER_COMPILE
          elif grep -Eqi 'NativeStreamFifoCCProofTests\.scala:.*(error|\[error\])' "$diagnostic"; then
            code=PROOF_COMPILE
          elif grep -Eqi 'STREAMFIFOCC_TIMEOUT|STREAMFIFOCC_DATA_MISMATCH|asynchronous simulation failed' "$diagnostic"; then
            code=SIMULATION
          elif grep -Eqi 'formal equivalence failed|Equivalence.*failed|unproven|equiv_status' "$diagnostic"; then
            code=FORMAL
          elif grep -Eqi 'ParameterizedStreamFifoCCTests|SPINAL-PARAMETERIZED|MorphVerilogException' "$diagnostic"; then
            code=FOCUSED_CONTRACT
          fi
          mkdir -p .morphhdl
          printf '%s\n' "$code" > .morphhdl/increment-53e-classification
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .morphhdl/increment-53e-classification
          git commit -m "[53e-classified:$code] Classify Increment 53e closure failure"
          git push origin HEAD:agent/increment-53e-native-streamfifocc-parameterization

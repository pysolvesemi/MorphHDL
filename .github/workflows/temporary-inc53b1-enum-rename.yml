name: Temporary Increment 53b.1 enum rename

on:
  push:
    branches:
      - agent/increment-53b1-enum-screaming-snake-localparams

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Increment 53b.1 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename roadmap item and fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/rename-inc53c-enum-to-inc53b1.py

          git config user.name "MorphHDL Increment Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/morphhdl/parameterized-verilog-todo.md \
            morphhdl/src/test/scala/morphhdl/SpinalEnumLocalParameterTests.scala
          if git diff --cached --quiet; then
            echo "Increment 53b.1 rename is already applied"
            exit 0
          fi
          git commit -m "docs(test): reserve Increment 53b.1 for enum naming"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Increment 61 apply 60f inventory composition repair v3

on:
  push:
    branches:
      - agent/increment-61-one-file-per-component
    paths:
      - '.github/workflows/increment-61-apply-60f-inventory-composition.yml'

permissions:
  contents: write

concurrency:
  group: increment-61-apply-60f-inventory-composition-v3
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'pysolvesemi/MorphHDL' && github.ref == 'refs/heads/agent/increment-61-one-file-per-component'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply checksum-bound workflow-only repair and remove publisher
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/increment-61-one-file-per-component
          expected_parent=a3096a9ada9c3cea6345b0d59eb4ada1c7d2e2a9
          workflow=.github/workflows/increment-60f-equivalence-closure.yml
          publisher=.github/workflows/increment-61-apply-60f-inventory-composition.yml
          archive="$RUNNER_TEMP/increment-61-60f-inventory.patch.gz"
          patch="$RUNNER_TEMP/increment-61-60f-inventory.patch"

          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object "$workflow")" = 848b0a7273dc8e3917bf0b2af06c2f70eaa710e3

          payload=''
          printf '%s' "$payload" | base64 -d > "$archive"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = 56970bc84555553bb0152cc4418eeda387130210f517b8792a7bf259506b0e7a
          gzip -dc "$archive" > "$patch"
          test "$(sha256sum "$patch" | cut -d' ' -f1)" = 71493155b158c9036facba70187b678c0d9811dfbaa31609f454950f90672619
          git apply --check "$patch"
          git apply "$patch"

          git rm -- "$publisher"
          grep -q 'Require complete inherited and Increment 61 test inventories' "$workflow"
          grep -q 'Increment 61 successor inventory: 20 tests / 2 suites' "$workflow"
          test "$(grep -c 'Require complete test inventories with no skipped formal cases' "$workflow" || true)" -eq 0
          git diff --check
          git add "$workflow"
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/increment-60f-equivalence-closure.yml\n.github/workflows/increment-61-apply-60f-inventory-composition.yml'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '61: compose inherited 60f regression inventory' \
            -m 'Validate the frozen inherited 60f test inventory on the exact predecessor source tree, validate Increment 61 successor suites independently on the current head, and compose their evidence without widening historical source-review spans. Production Scala and generated RTL are unchanged.'

          remote=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$branch"

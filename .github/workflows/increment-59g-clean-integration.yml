name: Clean 59g integration recovery

on:
  push:
    branches: ['agent/increment-59g-source-validation']
    paths: ['.github/workflows/increment-59g-clean-integration.yml']

permissions:
  contents: write
  actions: read

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Recover exact source and the immutable reviewed repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/59g-final-source"
          mkdir -p "$work" target/59g-clean-evidence
          git show 1d566b9f7eca21d1d4685aa4512659154f57e88e:.github/workflows/increment-59g-clean-integration.yml > "$work/reviewed.yml"
          curl --fail --location --retry 3 --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/pysolvesemi/MorphHDL/actions/artifacts/10016353631/zip \
            -o "$work/source.zip"
          echo "f1edb0e40597f55033cd0ff78453e89b38662239a666bc5980779504b94aa9d9  $work/source.zip" | sha256sum -c -
          unzip -q "$work/source.zip" -d "$work/archive"
          git bundle verify "$work/archive/repository.bundle"
          git fetch "$work/archive/repository.bundle" refs/heads/export-59g-clean
          test "$(git rev-parse FETCH_HEAD)" = fa981aa4187b9a9d6b8e099d2343c105ae7aa200
          test "$(git rev-parse FETCH_HEAD^{tree})" = 70feae023da6fd410f1f796fdf0e0dc05ffb78ec
          git config user.name 'MorphHDL 59g integration'
          git config user.email '59g-integration@users.noreply.github.com'
          git checkout --detach FETCH_HEAD
          git merge --no-edit 0e614d5f0642770c3114b42488bdaf7a9e8b785d
          python3 - <<'PY'
          import os, textwrap
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'59g-final-source/reviewed.yml'
          value=path.read_text()
          marker='          import difflib, hashlib, json, subprocess\n'
          assert value.count(marker)==1
          start=value.index(marker)
          end=value.index('          PY\n',start)
          code=textwrap.dedent(value[start:end])
          assert "expected={" in code and "sha256((root/name).read_bytes()).hexdigest()==sha" in code
          exec(compile(code,str(path)+':reviewed-python','exec'))
          PY
          git add -- morphhdl/scripts/check-increment-59c-source-review.py \
            morphhdl/scripts/check-increment-59g-source-review.py \
            morphhdl/contracts/increment-59g-source-review.json
          test "$(git diff --cached --name-only | wc -l)" = 3
          git commit -m 'Preserve verified merged sibling source in the 59c inventory audit'
          tree=$(git rev-parse HEAD^{tree})
          candidate=$(git rev-parse HEAD)
          publication=$(printf '%s\n' 'Retain clean source-qualified 59g integration on staging only' | git commit-tree "$tree" -p '${{ github.sha }}' -p "$candidate")
          git checkout --detach "$publication"
          test "$(git rev-parse HEAD^{tree})" = "$tree"
          test ! -e .github/workflows/increment-59g-clean-integration.yml
          git diff --check 0e614d5f0642770c3114b42488bdaf7a9e8b785d HEAD
          git rev-parse HEAD > target/59g-clean-evidence/head.txt
          git rev-parse HEAD^{tree} > target/59g-clean-evidence/tree.txt
      - name: Verify complete source inventories and rejection controls
        shell: bash
        run: |
          set -euo pipefail
          output=target/59g-clean-evidence
          python3 morphhdl/scripts/check-increment-59g-source-review.py --self-test | tee "$output/register-spans.log"
          python3 morphhdl/scripts/check-increment-59h-source-review.py --self-test | tee "$output/owner-spans.log"
          python3 morphhdl/scripts/check-increment-60f-equivalence-closure.py --source-only > "$output/source-audit.log" 2>&1 || { tail -n 40 "$output/source-audit.log"; exit 1; }
          python3 morphhdl/scripts/check-increment-60f-artifacts.py self-test | tee "$output/inventory.log"
          python3 morphhdl/scripts/test-increment-59g-source-review.py > "$output/register-current-controls.log" 2>&1 || { tail -n 50 "$output/register-current-controls.log"; exit 1; }
          python3 morphhdl/scripts/test-increment-59h-inherited-source-scope.py > "$output/owner-current-controls.log" 2>&1 || { tail -n 50 "$output/owner-current-controls.log"; exit 1; }
          bash morphhdl/scripts/check-native-streamfifocc-boundary.sh --self-test | tee "$output/boundary.log"
          python3 morphhdl/scripts/check-increment-59g-register-bridges.py --self-test | tee "$output/bridge-model.log"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Publish only to staging without force
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/agent/increment-59g-source-validation | cut -f1)" = '${{ github.sha }}'
          git push origin HEAD:refs/heads/agent/increment-59g-source-validation
          git rev-parse HEAD > target/59g-clean-evidence/published-head.txt
      - name: Preserve exact source and diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/59g-clean-evidence
          git status --short > target/59g-clean-evidence/status.txt
          git archive HEAD | gzip > target/59g-clean-evidence/source.tar.gz
          git update-ref refs/heads/export-59g-clean HEAD
          git bundle create target/59g-clean-evidence/repository.bundle refs/heads/export-59g-clean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-59g-clean-integration
          path: target/59g-clean-evidence
          retention-days: 14
          if-no-files-found: error

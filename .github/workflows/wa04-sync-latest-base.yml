name: WA-04 sync latest parameterized-verilog

on:
  push:
    branches:
      - agent/wa-04-unnamed-simple-wire-elimination
    paths:
      - ".github/workflows/wa04-sync-latest-base.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out WA-04 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge latest base, refresh proof digests, and self-clean
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin parameterized-verilog
          git merge --no-ff --no-commit origin/parameterized-verilog

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          signatures_path = Path(
              "morphhdl-passes/tests/formal_model/wire_assignment_ir/expected-signatures.json"
          )
          signatures = json.loads(signatures_path.read_text(encoding="utf-8"))
          for relative in signatures["files"]:
              path = Path(relative)
              if not path.is_file():
                  raise SystemExit(f"missing signed proof file after base merge: {relative}")
              signatures["files"][relative] = hashlib.sha256(path.read_bytes()).hexdigest()
          signatures_path.write_text(
              json.dumps(signatures, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          rm .github/workflows/wa04-sync-latest-base.yml

          python3 morphhdl-passes/scripts/check-wa03-gates.py --self-test
          python3 morphhdl-passes/scripts/check-wa03-gates.py
          python3 morphhdl-passes/scripts/check-wa04-pass.py --self-test
          python3 morphhdl-passes/scripts/check-wa04-pass.py
          python3 morphhdl-passes/scripts/validate_wire_assignment_equivalence.py --self-test
          git diff --check

          git add -A
          git commit -m "WA-04: merge latest parameterized-verilog base"
          git push origin "HEAD:${GITHUB_REF_NAME}"

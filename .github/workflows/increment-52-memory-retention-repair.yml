name: Increment 52 memory retention repair

on:
  push:
    branches:
      - agent/increment-52-nested-control-flow-clean

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-52-nested-control-flow-clean
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve captured memories through native lowering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            Path('frontend/src/main/scala/spinal/core/ParameterizedStructure.scala'): (
              '    memoryPorts.foreach(port => port.isVital = true)\n',
              '    memories.foreach(_.preventAsBlackBox())\n    memoryPorts.foreach(port => port.isVital = true)\n',
            ),
            Path('frontend/src/main/scala/spinal/core/ParameterizedProcess.scala'): (
              '    memoryPorts.foreach(port => port.isVital = true)\n',
              '    memories.foreach(_.preventAsBlackBox())\n    memoryPorts.foreach(port => port.isVital = true)\n',
            ),
          }

          for path, (old, new) in replacements.items():
            text = path.read_text()
            if new in text:
              continue
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{path}: expected exactly one retention anchor, found {count}')
            path.write_text(text.replace(old, new, 1))
          PY

      - name: Prove source boundary
        shell: bash
        run: bash morphhdl/scripts/check-native-int-nested-control-flow-boundary.sh

      - name: Install pinned Mill
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Validate Increment 52 on Scala 2.12.18
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morph[2.12.18].testOnly morphhdl.NativeIntNestedSymbolicControlFlowTests

      - name: Validate Increment 52 on Scala 2.13.12
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morph[2.13.12].testOnly morphhdl.NativeIntNestedSymbolicControlFlowTests

      - name: Commit validated repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/increment-52-memory-retention-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/main/scala/spinal/core/ParameterizedStructure.scala \
                  frontend/src/main/scala/spinal/core/ParameterizedProcess.scala \
                  .github/workflows/increment-52-memory-retention-repair.yml
          git commit -m 'fix: preserve captured memories through native lowering'
          git push origin HEAD:agent/increment-52-nested-control-flow-clean

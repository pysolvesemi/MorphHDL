name: MorphHDL native source guard

on:
  push:
    branches:
      - main
      - parameterized-verilog
      - 'agent/increment-53d-*'
  pull_request:
    branches:
      - main
      - parameterized-verilog
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morphhdl-native-source-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Native source preservation and typed overlay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test legacy and typed guard failure detection
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/check-native-source-preservation.py --self-test
          if [ -f morphhdl/contracts/typed-native-source-overlay.json ]; then
            python3 morphhdl/scripts/check-typed-native-source-overlay.py --self-test
          fi

      - name: Verify reviewed native-source state
        shell: bash
        run: |
          set -euo pipefail
          overlay=morphhdl/contracts/typed-native-source-overlay.json
          if [ ! -f "$overlay" ]; then
            python3 morphhdl/scripts/check-native-source-preservation.py
            exit 0
          fi

          base="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('morphhdl/contracts/typed-native-source-overlay.json').read_text())['base']['commit'])
          PY
          )"
          worktree="${RUNNER_TEMP}/morphhdl-native-pre-typed"
          rm -rf "$worktree"
          git worktree add --detach "$worktree" "$base"
          trap 'git worktree remove --force "$worktree" >/dev/null 2>&1 || true' EXIT
          python3 "$worktree/morphhdl/scripts/check-native-source-preservation.py" \
            --repo-root "$worktree"
          python3 morphhdl/scripts/check-typed-native-source-overlay.py

name: MorphHDL native source guard

# Stable required-check name. Increment 53g replaces positive preservation of
# legacy native-Int machinery with a fail-closed production-retirement guard.
on:
  push:
    branches:
      - main
      - parameterized-verilog
      - 'agent/increment-53d-*'
      - 'agent/increment-53e-*'
      - 'agent/increment-53g-*'
  pull_request:
    branches: [main, parameterized-verilog]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morphhdl-native-source-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Native source preservation and typed overlay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Syntax-check and self-test the retirement boundary
        run: |
          python3 -m py_compile \
            morphhdl/scripts/check-production-retirement.py \
            morphhdl/scripts/check-native-source-preservation.py
          python3 morphhdl/scripts/check-production-retirement.py --self-test
      - name: Verify the reviewed production state
        run: python3 morphhdl/scripts/check-production-retirement.py

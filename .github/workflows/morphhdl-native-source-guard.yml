name: MorphHDL native source guard

# Stable required-check name. Increment 58 keeps the exact approved native
# delta and frozen Increment 53g boundary conjunctive with legacy retirement
# and the typed pre-emission canonical-handoff contract.
on:
  push:
    branches:
      - main
      - parameterized-verilog
      - 'agent/increment-*'
  pull_request:
    branches: [main, parameterized-verilog]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morphhdl-native-source-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Native source preservation and typed overlay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Syntax-check and self-test the exact native boundary
        shell: bash
        run: |
          set -euo pipefail
          test -x morphhdl/scripts/check-native-streamfifocc-boundary.sh
          test -x morphhdl/scripts/check-native-streamfifocc-width-formal-boundary.sh
          python3 -m py_compile \
            morphhdl/scripts/check-increment-58-retirement.py \
            morphhdl/scripts/check-production-retirement.py \
            morphhdl/scripts/check-native-source-preservation.py \
            morphhdl/scripts/check-typed-native-source-overlay.py
          bash -n morphhdl/scripts/check-native-streamfifocc-boundary.sh
          bash -n morphhdl/scripts/check-native-streamfifocc-width-formal-boundary.sh
          python3 morphhdl/scripts/check-increment-58-retirement.py --self-test
          python3 morphhdl/scripts/check-production-retirement.py --self-test
          python3 morphhdl/scripts/check-native-source-preservation.py --self-test
          python3 morphhdl/scripts/check-typed-native-source-overlay.py --self-test
          bash morphhdl/scripts/check-native-streamfifocc-boundary.sh --self-test
          bash morphhdl/scripts/check-native-streamfifocc-width-formal-boundary.sh --self-test
      - name: Verify the reviewed production state
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/check-increment-58-retirement.py
          python3 morphhdl/scripts/check-production-retirement.py
          python3 morphhdl/scripts/check-native-source-preservation.py
          python3 morphhdl/scripts/check-typed-native-source-overlay.py
          bash morphhdl/scripts/check-native-streamfifocc-boundary.sh --check
          bash morphhdl/scripts/check-native-streamfifocc-width-formal-boundary.sh --check

          candidate_dir="$(mktemp -d)"
          candidate_manifest="$candidate_dir/native-source-preservation.json"
          python3 morphhdl/scripts/check-native-source-preservation.py \
            --generate-template morphhdl/contracts/increment-55-native-change-review.json \
            --output "$candidate_manifest"
          if ! cmp -s \
            morphhdl/contracts/native-source-preservation.json \
            "$candidate_manifest"; then
            printf '%s\n' \
              'Reviewed native policy does not reproduce the committed canonical manifest' >&2
            diff -u \
              morphhdl/contracts/native-source-preservation.json \
              "$candidate_manifest" || true
            exit 1
          fi

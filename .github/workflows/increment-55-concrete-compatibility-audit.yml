name: Increment 55 concrete compatibility and approved-native-change audit

on:
  push:
    branches:
      - parameterized-verilog
      - 'agent/increment-55-*'
  pull_request:
    branches:
      - parameterized-verilog

permissions:
  contents: read

concurrency:
  group: increment-55-concrete-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Route exact Increment 55 revision
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.route.outputs.run }}
      base: ${{ steps.route.outputs.base }}
    steps:
      - name: Check out exact head with complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Select the immutable comparison base
        id: route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          run=false
          base=''
          workflow=.github/workflows/increment-55-concrete-compatibility-audit.yml

          if [[ "$EVENT_NAME" == pull_request ]]; then
            if ! git cat-file -e "$PR_BASE:$workflow" 2>/dev/null; then
              base="$PR_BASE"
              run=true
            fi
          elif [[ "$EVENT_NAME" == push && "$REF_NAME" == agent/increment-55-* ]]; then
            git fetch --no-tags origin parameterized-verilog
            base="$(git merge-base HEAD origin/parameterized-verilog)"
            run=true
          elif [[ "$EVENT_NAME" == push && "$REF_NAME" == parameterized-verilog ]]; then
            if [[ ! "$BEFORE" =~ ^[0-9a-f]{40}$ || "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
              printf '%s\n' 'parameterized-verilog push has no immutable prior revision' >&2
              exit 1
            fi
            if ! git cat-file -e "$BEFORE:$workflow" 2>/dev/null; then
              base="$BEFORE"
              run=true
            fi
          fi

          if [[ "$run" == true ]]; then
            test -n "$base"
            test "$(git rev-parse --verify "$base^{commit}")" = "$base"
            git merge-base --is-ancestor "$base" HEAD
          fi
          printf 'run=%s\n' "$run" >> "$GITHUB_OUTPUT"
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"

  source-contract:
    name: Approved native change and exact source contract
    needs: route
    if: needs.route.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact head with complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate approved native changes and retirement boundaries
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            morphhdl/scripts/check-native-source-preservation.py \
            morphhdl/scripts/check-typed-native-source-overlay.py \
            morphhdl/scripts/check-production-retirement.py \
            morphhdl/scripts/check-jvm-binary-compatibility.py \
            morphhdl/scripts/check-binary-compatibility.sh \
            morphhdl/scripts/check-concrete-spinalverilog-parity.sh
          do
            test -x "$path"
          done

          python3 -m py_compile \
            morphhdl/scripts/check-native-source-preservation.py \
            morphhdl/scripts/check-typed-native-source-overlay.py \
            morphhdl/scripts/check-production-retirement.py \
            morphhdl/scripts/check-typed-layering-ir.py \
            morphhdl/scripts/check-jvm-binary-compatibility.py
          bash -n morphhdl/scripts/check-binary-compatibility.sh
          bash -n morphhdl/scripts/check-concrete-spinalverilog-parity.sh
          bash -n morphhdl/scripts/check-native-int-shadow-provenance-boundary.sh
          bash -n morphhdl/scripts/check-external-formalization-boundary.sh
          bash -n morphhdl/scripts/check-typed-primitive-closure-boundary.sh
          bash -n morphhdl/scripts/check-external-memory-boundary.sh
          bash -n morphhdl/scripts/check-native-stream-width-adapter-boundary.sh
          bash -n morphhdl/scripts/check-native-streamfifo-structure-boundary.sh
          bash -n morphhdl/scripts/check-typed-vec-boundary.sh
          bash -n morphhdl/scripts/check-external-structural-process-boundary.sh
          bash -n morphhdl-passes/scripts/test-boundary-guard.sh
          bash -n morphhdl-passes/scripts/check-boundary.sh

          python3 morphhdl/scripts/check-native-source-preservation.py --self-test
          python3 morphhdl/scripts/check-typed-native-source-overlay.py --self-test
          python3 morphhdl/scripts/check-production-retirement.py --self-test
          python3 morphhdl/scripts/check-typed-layering-ir.py --self-test
          bash morphhdl/scripts/check-binary-compatibility.sh --self-test

          python3 morphhdl/scripts/check-native-source-preservation.py
          python3 morphhdl/scripts/check-typed-native-source-overlay.py
          python3 morphhdl/scripts/check-production-retirement.py
          python3 morphhdl/scripts/check-typed-layering-ir.py
          bash morphhdl/scripts/check-native-int-shadow-provenance-boundary.sh
          bash morphhdl/scripts/check-external-formalization-boundary.sh
          bash morphhdl/scripts/check-typed-primitive-closure-boundary.sh
          bash morphhdl/scripts/check-external-memory-boundary.sh
          bash morphhdl/scripts/check-native-stream-width-adapter-boundary.sh
          bash morphhdl/scripts/check-native-streamfifo-structure-boundary.sh
          bash morphhdl/scripts/check-typed-vec-boundary.sh
          bash morphhdl/scripts/check-external-structural-process-boundary.sh
          bash morphhdl-passes/scripts/test-boundary-guard.sh

      - name: Verify the sealed exact Increment 55 delta
        shell: bash
        env:
          BASE_COMMIT: ${{ needs.route.outputs.base }}
        run: |
          set -euo pipefail
          scope=morphhdl/contracts/increment-55-source-scope.txt
          sentinel='# INCREMENT-55-SOURCE-SCOPE-UNSEALED'
          todo=docs/morphhdl/parameterized-verilog-todo.md
          test -s "$scope"
          if grep -Fqx "$sentinel" "$scope"; then
            printf '%s\n' 'Increment 55 source scope is not sealed' >&2
            exit 1
          fi
          test "$(cat "$scope")" = "$(LC_ALL=C sort -u "$scope")"
          if grep -Eq '^[[:space:]]*$|^#|^/' "$scope"; then
            printf '%s\n' \
              'Increment 55 source scope must contain only repository-relative paths' >&2
            exit 1
          fi
          while IFS= read -r path; do
            test -e "$path" || git cat-file -e "HEAD:$path" 2>/dev/null || {
              # Deleted files are valid exact-scope entries.
              git log --all -1 --format='%H' -- "$path" | grep -q .
            }
          done < "$scope"
          test "$(grep -Ec '^- \[( |x)\] \*\*Increment 55 — Concrete compatibility and approved-native-change audit\*\*$' "$todo")" = 1

          check_non_native_whitespace() {
            local range="$1"
            local path
            local -a paths=()
            while IFS= read -r -d '' path; do
              case "$path" in
                core/src/main/*|\
                idslpayload/src/main/*|\
                idslplugin/src/main/*|\
                lib/src/main/*|\
                scalaplugin/src/main/*|\
                sim/src/main/*|\
                tester/src/main/*)
                  ;;
                *)
                  paths+=("$path")
                  ;;
              esac
            done < <(git diff --no-renames --name-only \
              --diff-filter=ACMRTD -z "$range")
            if (( ${#paths[@]} > 0 )); then
              git diff --check "$range" -- "${paths[@]}"
            fi
          }

          base="$BASE_COMMIT"
          test -n "$base"
          test "$(git rev-parse --verify "$base^{commit}")" = "$base"
          git merge-base --is-ancestor "$base" HEAD
          TODO_PATH="$todo" python3 - <<'PY'
          import os
          import subprocess

          base = os.environ["BASE_COMMIT"]
          path = os.environ["TODO_PATH"]
          unchecked = (
              b"- [ ] **Increment 55 \xe2\x80\x94 Concrete compatibility and "
              b"approved-native-change audit**"
          )
          checked = unchecked.replace(b"[ ]", b"[x]", 1)

          def blob(revision):
              return subprocess.run(
                  ["git", "show", f"{revision}:{path}"],
                  check=True,
                  stdout=subprocess.PIPE,
              ).stdout

          before = blob(base)
          after = blob("HEAD")
          valid_checkbox_transition = (
              before.count(unchecked) == 1
              and after.count(checked) == 1
              and before.replace(unchecked, checked, 1) == after
          )
          if before != after and not valid_checkbox_transition:
              raise SystemExit(
                  "roadmap delta must be empty or exactly the Increment 55 checkbox transition"
              )
          PY
          actual="$(git diff --no-renames --name-only --diff-filter=ACMRTD \
            "$base"...HEAD \
            | awk '$0 != "docs/morphhdl/parameterized-verilog-todo.md"' \
            | LC_ALL=C sort -u)"
          expected="$(cat "$scope")"
          if [[ "$actual" != "$expected" ]]; then
            printf '%s\n' 'Unexpected Increment 55 file inventory' >&2
            printf '%s\n' '--- expected ---' "$expected" >&2
            printf '%s\n' '--- actual ---' "$actual" >&2
            exit 1
          fi
          check_non_native_whitespace "$base...HEAD"

  compatibility:
    name: Binary source and concrete SpinalVerilog parity Scala ${{ matrix.scala_version }}
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - name: Check out exact head with complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify compatibility gate entry points
        shell: bash
        run: |
          set -euo pipefail
          test -x morphhdl/scripts/check-binary-compatibility.sh
          test -x morphhdl/scripts/check-concrete-spinalverilog-parity.sh
          test -x morphhdl/scripts/check-jvm-binary-compatibility.py
          bash -n morphhdl/scripts/check-binary-compatibility.sh
          bash -n morphhdl/scripts/check-concrete-spinalverilog-parity.sh
          python3 -m py_compile morphhdl/scripts/check-jvm-binary-compatibility.py

      - name: Prove JVM binary compatibility with the selected upstream baseline
        shell: bash
        run: >-
          bash morphhdl/scripts/check-binary-compatibility.sh
          --scala-version "${{ matrix.scala_version }}"

      - name: Prove source binary-linkage and ordinary SpinalVerilog parity
        shell: bash
        run: >-
          bash morphhdl/scripts/check-concrete-spinalverilog-parity.sh
          --scala "${{ matrix.scala_version }}"

  sbt-full:
    name: SBT full compatibility and JAR retirement Scala ${{ matrix.scala_version }}
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Compile every production and test source
        run: sbt -batch "++${{ matrix.scala_version }}" compile Test/compile

      - name: Run complete canonical IR MorphHDL and native simulation suites
        run: |
          sbt -batch "++${{ matrix.scala_version }}" morphir/test
          sbt -batch "++${{ matrix.scala_version }}" morph/test
          sbt -batch "++${{ matrix.scala_version }}" \
            "tester/testOnly spinal.lib.CounterTester spinal.lib.SpinalSimStreamFifoTester spinal.lib.SpinalSimStreamWidthAdapterTester"

      - name: Package production modules and prove retired classes absent
        shell: bash
        run: |
          set -euo pipefail
          sbt -batch "++${{ matrix.scala_version }}" \
            frontend/package idslplugin/package morphir/package morphruntime/package morphplugin/package morph/package
          mapfile -t jars < <(find frontend idslplugin morphir morphruntime morphplugin morphhdl \
            -regextype posix-extended -type f \
            -regex '.*/target/scala-[^/]+/[^/]+\.jar' | LC_ALL=C sort -u)
          test "${#jars[@]}" -ge 6
          arguments=()
          for jar in "${jars[@]}"; do
            arguments+=(--jar "$jar")
          done
          python3 morphhdl/scripts/check-production-retirement.py \
            --require-jar "${arguments[@]}"
          python3 morphhdl/scripts/check-typed-layering-ir.py \
            --require-jar "${arguments[@]}"

  mill-full:
    name: Mill full compatibility suite Scala ${{ matrix.scala_version }}
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Mill
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/mill
          chmod +x /tmp/mill

      - name: Run complete canonical IR MorphHDL and native simulation suites
        run: |
          /tmp/mill morphir[${{ matrix.scala_version }}].test
          /tmp/mill morph[${{ matrix.scala_version }}].test
          /tmp/mill tester[${{ matrix.scala_version }}].testOnly \
            spinal.lib.CounterTester \
            spinal.lib.SpinalSimStreamFifoTester \
            spinal.lib.SpinalSimStreamWidthAdapterTester

  focused-compatibility:
    name: Focused concrete and typed compatibility Scala ${{ matrix.scala_version }}
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Run canonical schema validation and normalization tests
        run: >-
          sbt -batch "++${{ matrix.scala_version }}"
          "morphir/testOnly morphhdl.ir.v1.CanonicalIrV1Spec"

      - name: Run compiler ownership and symbolic-equality safety tests
        run: >-
          sbt -batch "++${{ matrix.scala_version }}"
          "morphplugin/testOnly morphhdl.compiler.MorphHdlTypedElaborationControlComponentTests morphhdl.compiler.MorphHdlFrontendSymbolicEqualitySafetyComponentTests"

      - name: Run typed carriers native compatibility and frontend bridges
        run: |
          sbt -batch "++${{ matrix.scala_version }}" \
            "morph/testOnly spinal.core.TypedElaborationPrimitiveTests spinal.core.TypedExactDomainControlTests spinal.core.TypedExactDomainSafetyTests spinal.core.TypedProjectionOwnershipTests spinal.core.TypedPrimitiveClosureTests spinal.core.FiniteMemIdentityAdversarialTests spinal.core.internals.ParameterizedVerilogTests morphhdl.TypedElaborationValueTests morphhdl.TypedElaborationControlTests morphhdl.TypedParameterizedFactoryDirectionTests morphhdl.GenericExpressionAndStreamTests morphhdl.GenericProcessLoweringTests morphhdl.NativeSymbolicMemoryTests morphhdl.TypedParameterizedVecTests morphhdl.StreamFifoCompatibilityTests morphhdl.NativeLibraryReuseTests"
          sbt -batch "++${{ matrix.scala_version }}" \
            "frontend/testOnly morphhdl.frontend.HdlIntTests morphhdl.frontend.CombinationalIfFrontendTests morphhdl.frontend.SynchronousRegisterFrontendTests"

  v2001-simulation-synthesis:
    name: V2001 lint simulation and synthesis Scala ${{ matrix.scala_version }}
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Verify the strict Verilog-2001 toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v verilator
          command -v iverilog
          command -v vvp
          command -v yosys
          verilator --version
          iverilog -V
          yosys -V

      - name: Exercise retained parameterized designs through all V2001 tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/morphhdl/phase-inventory
          sbt -batch "++${{ matrix.scala_version }}" \
            "core/Test/runMain spinal.core.internals.ValidationParityInventoryWriter --output ${GITHUB_WORKSPACE}/target/morphhdl/phase-inventory/validation-phase-ids.txt"
          bash morphhdl/scripts/check-contracts.sh \
            --require-tools \
            --live-phase-ids target/morphhdl/phase-inventory/validation-phase-ids.txt
          sbt -batch "++${{ matrix.scala_version }}" \
            "morph/testOnly spinal.core.TypedPrimitiveClosureTests morphhdl.ParameterizedStreamWidthAdapterTests morphhdl.TypedParameterizedVecTests morphhdl.TypedCounterAllOnesTests morphhdl.ParameterizedStreamFifoDepthTests morphhdl.StreamFifoCompatibilityTests morphhdl.NativeSymbolicMemoryTests morphhdl.GenericProcessLoweringTests"

  formal:
    name: Inherited formal equivalence and mutation Scala ${{ matrix.scala_version }}
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
      MORPHDL_RUN_TYPED_VEC_FORMAL_EQUIVALENCE: '1'
      MORPHDL_RUN_TYPED_PRIMITIVE_CLOSURE_FORMAL_EQUIVALENCE: '1'
      MORPHDL_RUN_STREAMFIFO_FORMAL_EQUIVALENCE: '1'
      MORPHDL_TYPED_VEC_FORMAL_WORKSPACE: ${{ github.workspace }}/formal-artifacts/scala-${{ matrix.scala_version }}/vec
      MORPHDL_TYPED_PRIMITIVE_FORMAL_WORKSPACE: ${{ github.workspace }}/formal-artifacts/scala-${{ matrix.scala_version }}/closure
      MORPHDL_STREAMFIFO_FORMAL_WORKSPACE: ${{ github.workspace }}/formal-artifacts/scala-${{ matrix.scala_version }}/streamfifo
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Verify pinned formal toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v yosys
          command -v sby
          command -v yices-smt2
          command -v iverilog
          command -v verilator
          yosys_version="$(yosys -V)"
          grep -Eq '^Yosys 0\.41([ +]|$)' <<<"$yosys_version"
          sby_help="$(sby -h 2>&1)"
          grep -q 'usage: sby' <<<"$sby_help"
          yosys -Q -p 'help abc' >/tmp/morphhdl-yosys-abc-help.txt 2>&1
          grep -q ABC /tmp/morphhdl-yosys-abc-help.txt

      - name: Prove adapter Vec primitive FIFO and Counter equivalence with mutations
        run: |
          sbt -batch "++${{ matrix.scala_version }}" \
            "morph/testOnly morphhdl.TypedStreamWidthAdapterFormalEquivalenceTests morphhdl.TypedParameterizedVecFormalEquivalenceTests morphhdl.TypedPrimitiveClosureFormalEquivalenceTests morphhdl.NativeStreamFifoFormalEquivalenceTests"
          sbt -batch "++${{ matrix.scala_version }}" \
            "tester/testOnly spinal.lib.CounterFormalTester"

      - name: Retain proof statuses and mutation counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-55-formal-scala-${{ matrix.scala_version }}
          path: formal-artifacts/scala-${{ matrix.scala_version }}
          if-no-files-found: error
          retention-days: 14

  determinism:
    name: Parameterized and concrete emission determinism Scala ${{ matrix.scala_version }}
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    strategy:
      fail-fast: false
      matrix:
        scala_version: ['2.12.18', '2.13.12']
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Prove byte-identical replay and concrete-path preservation
        run: |
          sbt -batch "++${{ matrix.scala_version }}" \
            'morph/testOnly morphhdl.MorphVerilogTests -- -z "repeated successful runs are byte-identical"'
          sbt -batch "++${{ matrix.scala_version }}" \
            'morph/testOnly morphhdl.ParameterizedStreamWidthAdapterTests -- -z "covering all three native modes"'
          sbt -batch "++${{ matrix.scala_version }}" \
            'morph/testOnly morphhdl.ParameterizedStreamFifoDepthTests -- -z "one native StreamFifo definition preserves depths"'
          sbt -batch "++${{ matrix.scala_version }}" \
            'morph/testOnly morphhdl.SpinalEnumLocalParameterTests -- -z "SCREAMING_SNAKE_CASE enum-qualified"'
          sbt -batch "++${{ matrix.scala_version }}" \
            'morph/testOnly morphhdl.MorphSingleSourceVerilogTests morphhdl.StreamFifoCompatibilityTests'

  closure:
    name: Increment 55 canonical closure
    if: always() && needs.route.outputs.run == 'true'
    needs:
      - route
      - source-contract
      - compatibility
      - sbt-full
      - mill-full
      - focused-compatibility
      - v2001-simulation-synthesis
      - formal
      - determinism
    runs-on: ubuntu-latest
    steps:
      - name: Require every canonical gate
        env:
          SOURCE: ${{ needs.source-contract.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          SBT: ${{ needs.sbt-full.result }}
          MILL: ${{ needs.mill-full.result }}
          FOCUSED: ${{ needs.focused-compatibility.result }}
          V2001: ${{ needs.v2001-simulation-synthesis.result }}
          FORMAL: ${{ needs.formal.result }}
          DETERMINISM: ${{ needs.determinism.result }}
        run: |
          test "$SOURCE" = success
          test "$COMPATIBILITY" = success
          test "$SBT" = success
          test "$MILL" = success
          test "$FOCUSED" = success
          test "$V2001" = success
          test "$FORMAL" = success
          test "$DETERMINISM" = success

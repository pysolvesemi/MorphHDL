name: PR36 open-source EDA tools export

on:
  push:
    branches:
      - agent/offline-toolchain-export
    paths:
      - .github/workflows/pr36-eda-tools-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install exact open-source validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys yosys-abc
          iverilog -V | head -2
          verilator --version
          yosys -V

      - name: Build compact portable rootfs bundle
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/pr36-eda
          root="${work}/rootfs"
          rm -rf "${work}"
          mkdir -p "${root}" "${work}/meta"

          required=(
            /usr/bin/iverilog
            /usr/bin/vvp
            /usr/bin/verilator
            /usr/bin/verilator_bin
            /usr/bin/verilator_coverage
            /usr/bin/verilator_coverage_bin
            /usr/bin/verilator_gantt
            /usr/bin/verilator_profcfunc
            /usr/bin/yosys
            /usr/bin/yosys-abc
            /usr/bin/yosys-config
            /usr/share/iverilog
            /usr/share/verilator
            /usr/share/yosys
            /usr/lib/x86_64-linux-gnu/ivl
          )

          copy_path() {
            local source=$1
            [[ -e "${source}" || -L "${source}" ]] || return 0
            local target="${root}${source}"
            mkdir -p "$(dirname "${target}")"
            cp -a "${source}" "${target}"
          }

          for path in "${required[@]}"; do
            copy_path "${path}"
          done

          : > "${work}/meta/libraries.txt"
          for binary in \
            /usr/bin/iverilog /usr/bin/vvp /usr/bin/verilator_bin \
            /usr/bin/verilator_coverage_bin /usr/bin/yosys /usr/bin/yosys-abc; do
            [[ -x "${binary}" ]] || continue
            ldd "${binary}" \
              | awk '/=> \/|^\// {for(i=1;i<=NF;i++) if($i ~ /^\//) print $i}' \
              >> "${work}/meta/libraries.txt" || true
          done
          sort -u -o "${work}/meta/libraries.txt" "${work}/meta/libraries.txt"
          while IFS= read -r library; do
            copy_path "${library}"
            if [[ -L "${library}" ]]; then
              target=$(readlink -f "${library}")
              copy_path "${target}"
            fi
          done < "${work}/meta/libraries.txt"

          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' \
            iverilog verilator yosys yosys-abc > "${work}/meta/packages.txt"
          tar -C "${work}" -czf "${work}/pr36-open-source-eda-rootfs.tar.gz" rootfs meta
          sha256sum "${work}/pr36-open-source-eda-rootfs.tar.gz" \
            > "${work}/pr36-open-source-eda-rootfs.tar.gz.sha256"
          du -h "${work}/pr36-open-source-eda-rootfs.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: pr36-open-source-eda-ubuntu-24.04
          path: |
            /tmp/pr36-eda/pr36-open-source-eda-rootfs.tar.gz
            /tmp/pr36-eda/pr36-open-source-eda-rootfs.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

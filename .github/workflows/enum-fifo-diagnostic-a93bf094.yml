name: Enum cleanup inherited FIFO diagnostic

on:
  push:
    branches: [agent/control-enum-fifo-diagnostic-a93bf094]
    paths: [.github/workflows/enum-fifo-diagnostic-a93bf094.yml]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a93bf094ed830c704526dce2cacc06b339a2a6b6
          fetch-depth: 1
      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a93bf094ed830c704526dce2cacc06b339a2a6b6"
          test "$(git rev-parse HEAD^{tree})" = "300b730326883eb0b6bcd75508627fe9a07ef3d4"
      - uses: actions/cache/restore@v3
        with:
          path: |
            **/
          key: Linux-compiled-a93bf094ed830c704526dce2cacc06b339a2a6b6
          fail-on-cache-miss: true
      - name: Apply semantics-preserving GHDL implication lowering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("core/src/main/scala/spinal/core/internals/ComponentEmitterVhdl.scala")
          text = path.read_text()
          old = '''              val concatOperator = if (assertStatement.kind == AssertStatementKind.COVER) ":" else "->"
              val preCond = if (scopeCond.length > 0) s"$scopeCond $concatOperator " else ""
              val cond = emitExpression(assertStatement.cond)
              val trigger = if (multiclock) " @" + getTrigger(component, group.clockDomain) else ""
              val abort = getAbort(component, group.clockDomain)
              val statement = assertStatement.kind match {
                case AssertStatementKind.ASSERT => s"assert (always $preCond$cond$abort)$trigger"
                case AssertStatementKind.ASSUME => s"assume (always $preCond$cond)$trigger"
                case AssertStatementKind.COVER  => s"cover {$preCond$cond}$trigger"
              }
          '''
          new = '''              val cond = emitExpression(assertStatement.cond)
              val guardedCond =
                if (scopeCond.nonEmpty) s"((not ($scopeCond)) or ($cond))" else cond
              val coveredCond =
                if (scopeCond.nonEmpty) s"$scopeCond : $cond" else cond
              val trigger = if (multiclock) " @" + getTrigger(component, group.clockDomain) else ""
              val abort = getAbort(component, group.clockDomain)
              val statement = assertStatement.kind match {
                case AssertStatementKind.ASSERT => s"assert (always $guardedCond$abort)$trigger"
                case AssertStatementKind.ASSUME => s"assume (always $guardedCond)$trigger"
                case AssertStatementKind.COVER  => s"cover {$coveredCond}$trigger"
              }
          '''
          if text.count(old) != 1:
              raise SystemExit("emitter patch anchor mismatch")
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- core/src/main/scala/spinal/core/internals/ComponentEmitterVhdl.scala
      - name: Verify repaired exact GHDL case
        id: reproduce
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          sbt ++2.12.18 'tester/testOnly spinal.tester.scalatest.FormalFifoTester -- -z "formalpsl_StreamFifo_depth.7-withAsyncRead.false-withBypass.false-forFMax.false-allowExtraMsb.false-backend.GhdlFormalBackend"' 2>&1 | tee /tmp/enum-fifo-diagnostic.log
      - name: Capture formal engine diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/enum-fifo-diagnostic
          cp /tmp/enum-fifo-diagnostic.log /tmp/enum-fifo-diagnostic/ || true
          git diff > /tmp/enum-fifo-diagnostic/emitter.patch
          if [ -d simWorkspace ]; then
            find simWorkspace -type f -print | sort > /tmp/enum-fifo-diagnostic/files.txt
            cp -a simWorkspace /tmp/enum-fifo-diagnostic/
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enum-fifo-emitter-repair-a93bf094
          path: /tmp/enum-fifo-diagnostic
          retention-days: 7
      - name: Preserve repair result
        if: always()
        shell: bash
        run: |
          test "${{ steps.reproduce.outcome }}" = success

name: Publish Increment 53d generic native boundary repair

# Re-run after the generic width-root classifier self-check repair.
on:
  push:
    branches:
      - agent/increment-53d-generic-native-boundary-repair
    paths:
      - .github/workflows/increment-53d-generic-native-boundary-repair.yml

permissions:
  contents: write

jobs:
  repair-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/spinalhdl/docker@sha256:7666918d726d498af9979dc004012a9baa1c758be8d1a63c615a000ac06db793
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
      MORPHDL_NATIVE_AXI4_ARTIFACT_DIR: /tmp/morphhdl-native-axi4-artifacts
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-generic-native-boundary-repair
          fetch-depth: 0

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Apply component-agnostic native definition semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/apply-increment-53d-generic-native-boundary-repair.py
          python3 morphhdl/scripts/apply-increment-53d-width-root-classification.py
          git diff --check
          git diff --stat
          grep -n -A44 -B4 'withoutEnclosingNativeRuntimeContext' \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala
          grep -n -A48 -B4 'nativeWidthRootScan' \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala
          grep -n -A28 -B4 'transformIndependentNativeDefinition' \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala

      - name: Validate generic and inherited contracts on Scala 2.13.12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${MORPHDL_NATIVE_AXI4_ARTIFACT_DIR}"
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.GenericNativeDefinitionBoundaryTests \
            morphhdl.ParameterizedStreamWidthAdapterTests \
            morphhdl.ParameterizedStreamFifoDepthTests \
            morphhdl.NativeAxi4SlaveFactoryParameterizedOffsetTests \
            morphhdl.SpinalEnumLocalParameterTests \
            morphhdl.BackendSyncMergeIsolationTests \
            morphhdl.CapturedAssignmentNormalizationTests \
            morphhdl.NativeIntSymbolicConditionalTests \
            morphhdl.NativeIntNestedSymbolicControlFlowTests \
            morphhdl.NativeMemAutoProvenanceTests \
            morphhdl.ExternalNativeIntFormalizationTests \
            morphhdl.ExternalNativeIntShadowExpressionTests \
            morphhdl.ExternalNativeIntShadowProvenanceTests \
            morphhdl.FormalParameterIdentityTests \
            morphhdl.FormalParameterClonePropagationTests \
            morphhdl.HierarchyParameterBindingTests \
            morphhdl.MorphSingleSourceVerilogTests \
            morphhdl.integration.ExternalSpinalVerilogBaselineTests

      - name: Validate generic and inherited contracts on Scala 2.12.18
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${MORPHDL_NATIVE_AXI4_ARTIFACT_DIR}"
          mkdir -p "${MORPHDL_NATIVE_AXI4_ARTIFACT_DIR}"
          /tmp/morphhdl-mill morph[2.12.18].testOnly \
            morphhdl.GenericNativeDefinitionBoundaryTests \
            morphhdl.ParameterizedStreamWidthAdapterTests \
            morphhdl.ParameterizedStreamFifoDepthTests \
            morphhdl.NativeAxi4SlaveFactoryParameterizedOffsetTests \
            morphhdl.SpinalEnumLocalParameterTests \
            morphhdl.BackendSyncMergeIsolationTests \
            morphhdl.CapturedAssignmentNormalizationTests \
            morphhdl.NativeIntSymbolicConditionalTests \
            morphhdl.NativeIntNestedSymbolicControlFlowTests \
            morphhdl.NativeMemAutoProvenanceTests \
            morphhdl.ExternalNativeIntFormalizationTests \
            morphhdl.ExternalNativeIntShadowExpressionTests \
            morphhdl.ExternalNativeIntShadowProvenanceTests \
            morphhdl.FormalParameterIdentityTests \
            morphhdl.FormalParameterClonePropagationTests \
            morphhdl.HierarchyParameterBindingTests \
            morphhdl.MorphSingleSourceVerilogTests \
            morphhdl.integration.ExternalSpinalVerilogBaselineTests

      - name: Validate generic source and native-library boundaries
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl/scripts/check-native-stream-width-adapter-boundary.sh
          python3 morphhdl/scripts/check-native-source-preservation.py \
            --manifest morphhdl/contracts/native-source-preservation.json
          if git diff --name-only origin/parameterized-verilog...HEAD -- core lib idslplugin | grep -q .; then
            echo 'Generic Increment 53d repair modified upstream-owned SpinalHDL sources' >&2
            git diff --name-status origin/parameterized-verilog...HEAD -- core lib idslplugin >&2
            exit 1
          fi
          plugin=morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala
          ! grep -Fq 'withoutNativeStreamFifoContext' "$plugin"
          ! grep -Fq 'if inNativeStreamFifo && decoded(definition.name)' "$plugin"
          ! grep -Fq 'normalizedPath.endsWith("/lib/src/main/scala/spinal/lib/Stream.scala")' "$plugin"
          grep -Fq 'content.contains("widthOf")' "$plugin"
          grep -Fq 'withoutEnclosingNativeRuntimeContext' "$plugin"
          grep -Fq 'transformIndependentNativeDefinition(definition)' "$plugin"
          grep -Fq 'private def nativeWidthRootScan' "$plugin"
          grep -Fq 'if (stable.nonEmpty && unstable.nonEmpty)' "$plugin"
          grep -Fq 'else unstable += current' "$plugin"

      - name: Commit validated production repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            morphhdl/scripts/apply-increment-53d-generic-native-boundary-repair.py \
            morphhdl/scripts/apply-increment-53d-width-root-classification.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Publisher must not modify workflow files with its restricted token' >&2
            git diff --cached --name-status >&2
            exit 1
          fi
          git commit -m "fix: generalize native definition capture isolation"
          git push origin HEAD:agent/increment-53d-generic-native-boundary-repair

name: Apply remaining clean Increment 52 delta

on:
  push:
    branches:
      - agent/increment-52-nested-control-flow-clean
    paths:
      - .github/workflows/increment-52-remaining-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-52-remaining-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-52-nested-control-flow-clean
          fetch-depth: 0

      - name: Apply remaining production delta and remove every delivery file
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/inc52-remaining.patch.gz.b64
          patch="$RUNNER_TEMP/inc52-remaining.patch"
          base64 --decode "$payload" | gzip -dc > "$patch"
          echo "e1c0974d4d00ec94ecacb828721a65128646c35d37fe62248f0c19c2a2fbdeec  $patch" | sha256sum --check
          git apply --check "$patch"
          git apply "$patch"
          rm -f \
            "$payload" \
            .github/inc52-clean.patch.gz.b64 \
            .github/workflows/increment-52-clean-apply.yml \
            .github/workflows/increment-52-remaining-apply.yml

          git config user.name "pysolvesemi"
          git config user.email "pysolvesemi@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete Increment 52 production implementation"
          git push origin HEAD:agent/increment-52-nested-control-flow-clean

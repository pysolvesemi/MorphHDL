name: Increment 59i exact 60f gate repair and failed-only dispatch
on:
  push:
    branches: [recovery/increment-59i-history-20260914]
    paths:
      - .github/workflows/increment-59i-60f-gates-stage.yml
      - .github/recovery/59i-60f-gates/**
permissions:
  contents: write
  actions: write
concurrency:
  group: increment-59i-60f-gates-90b7fc8f
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Reproduce exact reviewed repair and execute all source guards
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/59i-60f-gates-evidence"
          python3 -B .github/recovery/59i-60f-gates/test_secure_artifact.py 2>&1 | tee "$RUNNER_TEMP/59i-60f-gates-evidence/transport-tests.log"
          python3 -B .github/recovery/59i-60f-gates/secure_artifact.py prepare \
            --repository "$GITHUB_WORKSPACE" \
            --destination "$RUNNER_TEMP/59i-60f-gates-source" \
            --output "$RUNNER_TEMP/59i-60f-gates-evidence" \
            2>&1 | tee "$RUNNER_TEMP/59i-60f-gates-evidence/prepare.log"
      - uses: actions/upload-artifact@v4
        with:
          name: increment-59i-60f-gates-tree-requests-90b7fc8f-${{ github.run_attempt }}
          path: ${{ runner.temp }}/59i-60f-gates-evidence
          if-no-files-found: error
          retention-days: 21
      - name: Stage exact commits and dispatch only failed 60f workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B .github/recovery/59i-60f-gates/secure_artifact.py publish \
            --repository "$GITHUB_WORKSPACE" \
            --destination "$RUNNER_TEMP/59i-60f-gates-source" \
            --output "$RUNNER_TEMP/59i-60f-gates-evidence" \
            2>&1 | tee "$RUNNER_TEMP/59i-60f-gates-evidence/publication.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-59i-60f-gates-staged-90b7fc8f-${{ github.run_attempt }}
          path: ${{ runner.temp }}/59i-60f-gates-evidence
          if-no-files-found: error
          retention-days: 21

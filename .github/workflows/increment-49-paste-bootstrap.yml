name: Increment 49 reviewed paste bootstrap

on:
  push:
    branches:
      - agent/increment-49-native-int-provenance
    paths:
      - .github/workflows/increment-49-paste-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-49-reviewed-patch-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/increment-49-native-int-provenance

      - name: Apply exact reviewed Increment 49 patch
        shell: bash
        run: |
          set -euo pipefail
          patch_url='https://paste.c-net.org/morphhdl-inc49-pr85-payload-20260822-b9f4'
          curl --fail --silent --show-error --location "${patch_url}" --output /tmp/increment-49-reviewed.patch
          test -s /tmp/increment-49-reviewed.patch
          mapfile -t patch_paths < <(git apply --numstat /tmp/increment-49-reviewed.patch | awk '{print $3}')
          test "${#patch_paths[@]}" -gt 0

          if git apply --reverse --check /tmp/increment-49-reviewed.patch; then
            echo 'Reviewed Increment 49 implementation is already present.'
          else
            git apply --check /tmp/increment-49-reviewed.patch
            git apply /tmp/increment-49-reviewed.patch
          fi

          rm -rf .github/increment-49-payload
          rm -f \
            .github/increment-49-ci-trigger \
            .github/workflows/increment-49-bootstrap-final.yml \
            .github/workflows/increment-49-paste-bootstrap.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${patch_paths[@]}"
          git add -u -- .github || true
          if git diff --cached --quiet; then
            echo 'No publication changes remain.'
            exit 0
          fi
          git diff --cached --check
          if git diff --cached --name-only | grep -E '^(core|lib|idslplugin)/src/'; then
            echo 'Increment 49 unexpectedly modifies upstream-owned native source.' >&2
            exit 1
          fi
          if git diff --cached -- docs/morphhdl/parameterized-verilog-todo.md | grep -q '^+.*\[x\].*Increment 49'; then
            echo 'Increment 49 roadmap checkbox must remain unchecked for first validation.' >&2
            exit 1
          fi
          git commit -m 'Implement Increment 49 native Int provenance propagation'
          git push origin HEAD:agent/increment-49-native-int-provenance

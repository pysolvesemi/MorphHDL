name: Increment 53e generic proof publish merge audit v3

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: increment-53e-generic-proof-v3
  cancel-in-progress: true

jobs:
  validate-publish-merge-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      FEATURE: agent/increment-53e-native-streamfifocc-parameterization
      TARGET: parameterized-verilog
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0

      - name: Prepare authenticated checkout
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Apply generic graph and bounded-expression proof
        shell: bash
        run: |
          set -euo pipefail
          required=(
            morphhdl/src/test/scala/morphhdl/NativeStreamFifoCCProofFixtures.scala
            morphhdl/src/test/scala/morphhdl/NativeStreamFifoCCImplementationProofTests.scala
            morphhdl/src/test/scala/morphhdl/NativeStreamFifoCCFormalEquivalenceTests.scala
            morphhdl/support/increment-53e/ExternalParameterizedDomainEquivalence.scala.template
            morphhdl/support/increment-53e/ExternalParameterizedDomainEquivalenceTests.scala.template
            morphhdl/support/increment-53e/morphhdl-native-streamfifocc-formal-equivalence.yml.template
            morphhdl/scripts/apply-increment-53e-generic-domain-proof-v2.py
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required Increment 53e file: $path" >&2; exit 1; }
          done
          for script in \
            morphhdl/scripts/apply-increment-53e-address-role-repair.py \
            morphhdl/scripts/apply-increment-53e-implicit-child-width-formals.py \
            morphhdl/scripts/apply-increment-53e-canonical-implicit-formal-identity.py \
            morphhdl/scripts/apply-increment-53e-modular-literal-proof.py \
            morphhdl/scripts/apply-increment-53e-materialized-auto-resize-proof.py \
            morphhdl/scripts/apply-increment-53e-unfixed-literal-width-inference.py \
            morphhdl/scripts/apply-increment-53e-width-equivalence-proof.py \
            morphhdl/scripts/apply-increment-53e-generic-domain-proof.py \
            morphhdl/scripts/apply-increment-53e-generic-domain-proof-v2.py
          do
            if test -f "$script"; then python3 "$script"; fi
          done
          git diff --check

      - name: Enforce genericity and untouched SpinalHDL production sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET"
          git diff --quiet origin/$TARGET -- \
            core/src/main lib/src/main idslplugin/src/main || {
              echo 'Increment 53e modified native SpinalHDL production sources.' >&2
              git diff --stat origin/$TARGET -- \
                core/src/main lib/src/main idslplugin/src/main >&2
              exit 1
            }
          generic=morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedDomainEquivalence.scala
          ! grep -E \
            'spinal\.lib|StreamFifo|StreamFifoCC|pushToPopGray|popToPushGray|Stream\.scala|CrossClock\.scala' \
            "$generic"
          grep -q 'MaximumAssignments' "$generic"
          grep -q 'provePositiveEquality' "$generic"
          grep -q 'evaluateRetainedExpression' "$generic"
          grep -q 'isProvenCompleteDomainWidthEquivalence' \
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala
          grep -q 'evaluateDefinitionExpressionAtParameters' \
            morphruntime/src/main/scala/spinal/core/ExternalNativeIntShadowRegistry.scala

      - name: Install pinned build and proof tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill
          apt-get update
          apt-get install -y --no-install-recommends git gh iverilog yosys z3 python3
          rm -rf /tmp/sby
          git clone --depth 1 https://github.com/YosysHQ/sby.git /tmp/sby
          ln -sf /tmp/sby/sbysrc/sby.py /usr/local/bin/sby
          chmod +x /tmp/sby/sbysrc/sby.py
          iverilog -V
          yosys -V
          z3 -version
          sby -h >/dev/null
          gh --version

      - name: Validate implementation on both Scala lanes
        shell: bash
        run: |
          set -euo pipefail
          for lane in 2.12.18 2.13.12; do
            /tmp/morphhdl-mill "morph[$lane].testOnly" \
              spinal.core.internals.ExternalParameterizedDomainEquivalenceTests \
              morphhdl.ParameterizedStreamFifoCCTests \
              morphhdl.NativeStreamFifoCCImplementationProofTests \
              morphhdl.NativeStreamFifoCCFormalEquivalenceTests \
              morphhdl.NativeStreamFifoFormalEquivalenceTests \
              2>&1 | tee "/tmp/increment-53e-premerge-$lane.log"
          done

      - name: Prove concrete native witnesses before publication
        shell: bash
        env:
          MORPHDL_RUN_STREAMFIFOCC_FORMAL_EQUIVALENCE: '1'
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill 'morph[2.12.18].testOnly' \
            morphhdl.NativeStreamFifoCCFormalEquivalenceTests \
            2>&1 | tee /tmp/increment-53e-premerge-formal.log

      - name: Publish the clean feature commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          roadmap = Path('docs/morphhdl/parameterized-verilog-todo.md')
          value = roadmap.read_text()
          old = '- [ ] **Increment 53e — Native StreamFifoCC parameterization without source edits**'
          new = '- [x] **Increment 53e — Native StreamFifoCC parameterization without source edits**'
          if old in value:
              value = value.replace(old, new, 1)
          elif new not in value:
              raise SystemExit('Increment 53e roadmap entry not found')
          roadmap.write_text(value)
          source = Path(
              'morphhdl/support/increment-53e/'
              'morphhdl-native-streamfifocc-formal-equivalence.yml.template'
          )
          target = Path(
              '.github/workflows/'
              'morphhdl-native-streamfifocc-formal-equivalence.yml'
          )
          target.write_text(source.read_text())
          PY
          rm -f .github/workflows/increment-53e-address-resize-fix.yml
          rm -f .github/workflows/increment-53e-generic-proof-publisher.yml
          rm -f .github/workflows/increment-53e-generic-proof-publisher-v2.yml
          rm -f .github/workflows/increment-53e-generic-proof-publisher-v3.yml
          rm -f .github/workflows/increment-53e-pr-finalizer-v2.yml
          rm -f .github/workflows/increment-53e-pr-finalizer-v3.yml
          rm -f .github/workflows/increment-53e-gated-finalize.yml
          rm -f .github/workflows/increment-53e-gated-finalize-v2.yml
          rm -f .github/workflows/increment-53e-gated-finalize-v3.yml
          rm -rf morphhdl/support/increment-53e
          rm -f morphhdl/scripts/apply-increment-53e-address-role-repair.py
          rm -f morphhdl/scripts/apply-increment-53e-implicit-child-width-formals.py
          rm -f morphhdl/scripts/apply-increment-53e-canonical-implicit-formal-identity.py
          rm -f morphhdl/scripts/apply-increment-53e-modular-literal-proof.py
          rm -f morphhdl/scripts/apply-increment-53e-materialized-auto-resize-proof.py
          rm -f morphhdl/scripts/apply-increment-53e-unfixed-literal-width-inference.py
          rm -f morphhdl/scripts/apply-increment-53e-width-equivalence-proof.py
          rm -f morphhdl/scripts/apply-increment-53e-generic-domain-proof.py
          rm -f morphhdl/scripts/apply-increment-53e-generic-domain-proof-v2.py
          rm -f morphhdl/scripts/apply-increment-53e-equivalent-provenance-copy.py
          rm -f morphhdl/scripts/apply-increment-53e-retained-expression-evaluator.py
          git add -A
          git diff --cached --check
          git commit -m 'Increment 53e: generic native StreamFifoCC parameterization'
          git push origin HEAD:$FEATURE
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open the Increment 53e pull request
        id: pr
        shell: bash
        env:
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          set -euo pipefail
          number=$(gh pr list \
            --repo "$REPOSITORY" --head "$FEATURE" --base "$TARGET" \
            --state open --json number,headRefOid \
            --jq '.[] | select(.headRefOid == env.PUBLISHED_SHA) | .number' | head -1)
          if test -z "$number"; then
            gh pr create \
              --repo "$REPOSITORY" \
              --head "$FEATURE" \
              --base "$TARGET" \
              --title 'Increment 53e: generic native StreamFifoCC parameterization' \
              --body 'Uses the exact native spinal.lib.StreamFifoCC with untouched SpinalHDL production sources. The parameter proof is generic: complete bounded domains, retained expression semantics, no FIFO/component/source-name exceptions. Validation covers Scala 2.12/2.13, Verilog-2001 lint, synthesis, asynchronous simulation, independent native witnesses, solver-backed equivalence, and a mutation counterexample.'
            number=$(gh pr list \
              --repo "$REPOSITORY" --head "$FEATURE" --base "$TARGET" \
              --state open --json number --jq '.[0].number')
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Merge only the already-proven published head
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          set -euo pipefail
          actual=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefOid --jq .headRefOid)
          test "$actual" = "$PUBLISHED_SHA"
          gh pr merge "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --squash \
            --delete-branch

      - name: Check out the exact merged target head
        id: merged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET"
          target_sha=$(git rev-parse origin/$TARGET)
          git checkout --detach "$target_sha"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"
          grep -Fq -- \
            '- [x] **Increment 53e — Native StreamFifoCC parameterization without source edits**' \
            docs/morphhdl/parameterized-verilog-todo.md
          test -f .github/workflows/morphhdl-native-streamfifocc-formal-equivalence.yml
          test ! -e .github/workflows/increment-53e-generic-proof-publisher-v3.yml
          bash morphhdl/scripts/check-native-streamfifocc-parameterization-boundary.sh

      - name: Re-run both Scala lanes on the merged commit
        shell: bash
        run: |
          set -euo pipefail
          for lane in 2.12.18 2.13.12; do
            /tmp/morphhdl-mill "morph[$lane].testOnly" \
              spinal.core.internals.ExternalParameterizedDomainEquivalenceTests \
              morphhdl.ParameterizedStreamFifoCCTests \
              morphhdl.NativeStreamFifoCCImplementationProofTests \
              morphhdl.NativeStreamFifoCCFormalEquivalenceTests \
              morphhdl.NativeStreamFifoFormalEquivalenceTests \
              2>&1 | tee "/tmp/increment-53e-postmerge-$lane.log"
          done

      - name: Re-prove concrete witnesses on the merged commit
        shell: bash
        env:
          MORPHDL_RUN_STREAMFIFOCC_FORMAL_EQUIVALENCE: '1'
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill 'morph[2.12.18].testOnly' \
            morphhdl.NativeStreamFifoCCFormalEquivalenceTests \
            2>&1 | tee /tmp/increment-53e-postmerge-formal.log

      - name: Upload pre-merge and post-merge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53e-generic-proof-merge-audit-v3
          path: |
            /tmp/increment-53e-premerge-2.12.18.log
            /tmp/increment-53e-premerge-2.13.12.log
            /tmp/increment-53e-premerge-formal.log
            /tmp/increment-53e-postmerge-2.12.18.log
            /tmp/increment-53e-postmerge-2.13.12.log
            /tmp/increment-53e-postmerge-formal.log
          if-no-files-found: ignore

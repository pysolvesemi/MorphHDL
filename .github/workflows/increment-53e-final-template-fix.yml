name: Increment 53e fix final workflow template

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write

concurrency:
  group: increment-53e-final-template-fix
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0

      - name: Replace nested workflow template safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/increment-53e-final-generic-closure.yml')
          text = path.read_text()
          start = text.index("          cat > .github/workflows/morphhdl-native-streamfifocc-parameterization.yml <<'YAML'\n")
          end_marker = "          YAML\n\n      - name: Close roadmap and remove temporary machinery"
          end = text.index(end_marker, start)
          replacement = '''          cat > .github/workflows/morphhdl-native-streamfifocc-parameterization.yml <<'YAML'
          name: MorphHDL native StreamFifoCC parameterization

          on:
            push:
              branches:
                - parameterized-verilog
                - agent/increment-53e-native-streamfifocc-parameterization
            pull_request:
              branches:
                - parameterized-verilog

          permissions:
            contents: read

          jobs:
            contract:
              runs-on: ubuntu-latest
              container:
                image: ghcr.io/spinalhdl/docker:latest
              timeout-minutes: 240
              steps:
                - uses: actions/checkout@v4
                - name: Preserve native SpinalHDL sources
                  shell: bash
                  run: |
                    set -euo pipefail
                    git diff --exit-code morphhdl-baseline-2026-08-12 -- \
                      core/src/main lib/src/main idslplugin/src/main
                - name: Install pinned Mill
                  shell: bash
                  run: |
                    set -euo pipefail
                    curl --fail --location --retry 5 --retry-all-errors \
                      https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
                      -o /tmp/mill
                    chmod +x /tmp/mill
                - name: Compile and test Scala 2.12.18
                  shell: bash
                  run: |
                    /tmp/mill 'morph[2.12.18].test.compile'
                    /tmp/mill 'morph[2.12.18].testOnly' \
                      morphhdl.ParameterizedStreamFifoCCTests
                - name: Compile and test Scala 2.13.12
                  shell: bash
                  run: |
                    /tmp/mill 'morph[2.13.12].test.compile'
                    /tmp/mill 'morph[2.13.12].testOnly' \
                      morphhdl.ParameterizedStreamFifoCCTests

            proof:
              runs-on: ubuntu-latest
              container:
                image: ghcr.io/spinalhdl/docker:latest
              timeout-minutes: 300
              env:
                MORPHDL_RUN_STREAMFIFOCC_PROOF: "1"
                MORPHDL_STREAMFIFOCC_PROOF_WORKSPACE: /tmp/increment-53e-proof
              steps:
                - uses: actions/checkout@v4
                - name: Install pinned Mill
                  shell: bash
                  run: |
                    set -euo pipefail
                    curl --fail --location --retry 5 --retry-all-errors \
                      https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
                      -o /tmp/mill
                    chmod +x /tmp/mill
                - name: Prove Scala 2.12.18 output
                  shell: bash
                  run: |
                    rm -rf /tmp/increment-53e-proof
                    mkdir -p /tmp/increment-53e-proof
                    /tmp/mill 'morph[2.12.18].testOnly' \
                      morphhdl.NativeStreamFifoCCProofTests
                - name: Prove Scala 2.13.12 output
                  shell: bash
                  run: |
                    rm -rf /tmp/increment-53e-proof
                    mkdir -p /tmp/increment-53e-proof
                    /tmp/mill 'morph[2.13.12].testOnly' \
                      morphhdl.NativeStreamFifoCCProofTests
          YAML

      - name: Close roadmap and remove temporary machinery'''
          text = text[:start] + replacement + text[end + len(end_marker):]
          guard_old = "    if: ${{ hashFiles('.morphhdl/increment-53e-final-ready') != '' }}"
          guard_new = "    if: ${{ contains(github.event.head_commit.message, '[53e-final-ready]') }}"
          text = text.replace(guard_old, guard_new)
          path.write_text(text)
          Path('.morphhdl').mkdir(exist_ok=True)
          Path('.morphhdl/increment-53e-final-ready').write_text('ready\n')
          Path('.github/workflows/increment-53e-final-template-fix.yml').unlink()
          PY
          git add -A
          git diff --cached --check
          git commit -m '[53e-final-ready] Fix Increment 53e canonical workflow template'
          git push origin HEAD:agent/increment-53e-native-streamfifocc-parameterization

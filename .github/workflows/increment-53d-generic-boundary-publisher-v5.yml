name: Complete Increment 53d generic native definition boundary v5

on:
  push:
    branches:
      - agent/increment-53d-generic-native-definition-boundary
    paths:
      - .github/workflows/increment-53d-generic-boundary-publisher-v5.yml

permissions:
  contents: write

jobs:
  repair-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-generic-native-definition-boundary
          fetch-depth: 0

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Scope patch-script edits to the production transformer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script = Path("morphhdl/scripts/apply-increment-53d-generic-boundary-v4.py")
          value = script.read_text(encoding="utf-8")
          start = value.index("for old, new, label in (\n")
          end = value.index("\nfor forbidden in (", start)
          loop = value[start:end]
          loop = loop.replace(
              "if text.count(old) != 1:",
              "if transform_region.count(old) != 1:",
          ).replace(
              "text = text.replace(old, new, 1)",
              "transform_region = transform_region.replace(old, new, 1)",
          )
          scoped = (
              'transform_start = text.index("    override def transform(tree: Tree): Tree = tree match {\\n")\n'
              'transform_end = text.index("\\n    }\\n  }\\n\\n  override def newPhase", transform_start)\n'
              'transform_region = text[transform_start:transform_end]\n\n'
              + loop
              + '\ntext = text[:transform_start] + transform_region + text[transform_end:]\n'
          )
          script.write_text(value[:start] + scoped + value[end:], encoding="utf-8")
          PY
          python3 morphhdl/scripts/apply-increment-53d-generic-boundary-v4.py
          git diff --check
          git diff --stat
          grep -n -A35 -B4 'withoutEnclosingNativeRuntimeContext' \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala
          grep -n -A48 -B4 'nativeWidthRootAvailableAtEntry' \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala
          grep -n -A18 -B6 'case conditional: If if inNativeRewriteContext' \
            morphplugin/src/main/scala/morphhdl/compiler/MorphHdlNativeIntShadowExpressionComponent.scala

      - name: Compile all upstream SpinalHDL core and lib sources on Scala 2.13.12
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morph[2.13.12].test.compile

      - name: Validate generic architecture and inherited contracts on Scala 2.13.12
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morph[2.13.12].testOnly \
            morphhdl.GenericNativeDefinitionBoundaryTests \
            morphhdl.ParameterizedStreamWidthAdapterTests \
            morphhdl.ParameterizedStreamFifoDepthTests \
            morphhdl.BackendSyncMergeIsolationTests \
            morphhdl.CapturedAssignmentNormalizationTests \
            morphhdl.NativeIntSymbolicConditionalTests \
            morphhdl.NativeIntNestedSymbolicControlFlowTests \
            morphhdl.NativeMemAutoProvenanceTests \
            morphhdl.ExternalNativeIntFormalizationTests \
            morphhdl.ExternalNativeIntShadowExpressionTests \
            morphhdl.ExternalNativeIntShadowProvenanceTests \
            morphhdl.FormalParameterIdentityTests \
            morphhdl.FormalParameterClonePropagationTests \
            morphhdl.HierarchyParameterBindingTests \
            morphhdl.MorphSingleSourceVerilogTests \
            morphhdl.integration.ExternalSpinalVerilogBaselineTests

      - name: Compile and validate the same contracts on Scala 2.12.18
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill morph[2.12.18].test.compile
          /tmp/morphhdl-mill morph[2.12.18].testOnly \
            morphhdl.GenericNativeDefinitionBoundaryTests \
            morphhdl.ParameterizedStreamWidthAdapterTests \
            morphhdl.ParameterizedStreamFifoDepthTests \
            morphhdl.BackendSyncMergeIsolationTests \
            morphhdl.CapturedAssignmentNormalizationTests \
            morphhdl.NativeIntSymbolicConditionalTests \
            morphhdl.NativeIntNestedSymbolicControlFlowTests \
            morphhdl.NativeMemAutoProvenanceTests \
            morphhdl.ExternalNativeIntFormalizationTests \
            morphhdl.ExternalNativeIntShadowExpressionTests \
            morphhdl.ExternalNativeIntShadowProvenanceTests \
            morphhdl.FormalParameterIdentityTests \
            morphhdl.FormalParameterClonePropagationTests \
            morphhdl.HierarchyParameterBindingTests \
            morphhdl.MorphSingleSourceVerilogTests \
            morphhdl.integration.ExternalSpinalVerilogBaselineTests

      - name: Validate native-source and generic-boundary contracts
        shell: bash
        run: |
          set -euo pipefail
          bash morphhdl/scripts/check-native-stream-width-adapter-boundary.sh

      - name: Publish exact validated repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/increment-53d-generic-boundary-publisher.yml \
            .github/workflows/increment-53d-generic-boundary-publisher-v2.yml \
            .github/workflows/increment-53d-generic-boundary-publisher-v3.yml \
            .github/workflows/increment-53d-generic-boundary-publisher-v4.yml \
            .github/workflows/increment-53d-generic-boundary-publisher-v5.yml \
            morphhdl/scripts/apply-increment-53d-generic-boundary-v4.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: make native definition capture component-independent"
          git push origin HEAD:agent/increment-53d-generic-native-definition-boundary

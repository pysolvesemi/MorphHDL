name: 59g merged-source inventory recovery

on:
  push:
    branches: ['agent/increment-59g-source-validation']
    paths: ['.github/workflows/increment-59g-field-inventory-recovery.yml']

permissions:
  contents: write
  actions: read

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Restore the exact combined source outside the checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          recovery="$RUNNER_TEMP/59g-field-recovery"
          mkdir -p "$recovery" target/59g-field-evidence
          curl --fail --location --retry 3 --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/pysolvesemi/MorphHDL/actions/artifacts/10016353631/zip \
            -o "$recovery/source.zip"
          echo "f1edb0e40597f55033cd0ff78453e89b38662239a666bc5980779504b94aa9d9  $recovery/source.zip" | sha256sum -c -
          unzip -q "$recovery/source.zip" -d "$recovery/archive"
          git bundle verify "$recovery/archive/repository.bundle"
          git fetch "$recovery/archive/repository.bundle" refs/heads/export-59g-clean
          test "$(git rev-parse FETCH_HEAD)" = fa981aa4187b9a9d6b8e099d2343c105ae7aa200
          test "$(git rev-parse FETCH_HEAD^{tree})" = 70feae023da6fd410f1f796fdf0e0dc05ffb78ec
          git config user.name 'MorphHDL 59g integration'
          git config user.email '59g-integration@users.noreply.github.com'
          git checkout --detach FETCH_HEAD
          git merge --no-edit '${{ github.sha }}'
          git merge-base --is-ancestor 38eddd226837a48b028094585b5ce5eeae3439cd HEAD
          git merge-base --is-ancestor 5db83983b42c71df4f43d6a7c37c5bd552cd96c5 HEAD
      - name: Bind the field-vector inventory adapter to the exact register review
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import difflib, hashlib, json, subprocess
          from pathlib import Path
          root=Path.cwd()
          base='5db83983b42c71df4f43d6a7c37c5bd552cd96c5'
          old_digest='3b9706cc8d4b06ddf41c885b5f28740f77f779365438c72bcde4e1d0e46dd41c'
          contract=root/'morphhdl/contracts/increment-59g-source-review.json'
          assert hashlib.sha256(contract.read_bytes()).hexdigest()==old_digest
          review=json.loads(contract.read_text());assert review['base']==base
          path='morphhdl/scripts/check-increment-59c-source-review.py'
          p=root/path
          baseline=subprocess.check_output(['git','show',base+':'+path])
          assert p.read_bytes()==baseline
          old='''    if nested is not None:
                  paths = nested.inherited_inventory(root, paths, qualification_base)
              require_production_inventory(paths)
          '''
          new='''    if nested is not None:
                  paths = nested.inherited_inventory(root, paths, qualification_base)
                  register = getattr(nested, "register_source_review", lambda root: None)(root)
                  if register is not None:
                      # The nested inventory has already run the complete register audit.
                      # Its pinned merged baseline owns these unchanged, disjoint siblings.
                      # Filter only this 59c-local view; the outer source-union keeps their
                      # immutable hashes and independent feature/test obligations.
                      historical = subprocess.check_output(
                          ["git", "diff", "--no-renames", "--name-only", qualification_base, register.BASE],
                          cwd=root, text=True).splitlines()
                      siblings = {path for path in historical if re.search(r"(?:^|/)src/main/", path)}
                      siblings -= PRODUCTION_PATHS | nested.PRODUCTION_PATHS | register.PRODUCTION_PATHS
                      paths -= siblings
              require_production_inventory(paths)
          '''
          text=p.read_text();assert text.count(old)==1;p.write_text(text.replace(old,new))
          current=p.read_bytes();a,b=baseline.splitlines(keepends=True),current.splitlines(keepends=True)
          ao,bo=[0],[0]
          for line in a:ao.append(ao[-1]+len(line))
          for line in b:bo.append(bo[-1]+len(line))
          reason='Compose the immutable 59c inventory with merged disjoint production already authenticated by the complete 59g baseline audit; preserve the outer 60f union, exact sibling source hashes, and all historical native/reference obligations.'
          edits=[]
          for tag,i,j,k,l in difflib.SequenceMatcher(None,a,b,autojunk=False).get_opcodes():
              if tag=='equal':continue
              edits.append(dict(id='59c-register-sibling-inventory-'+str(len(edits)+1),reason=reason,before_start=ao[i],before_end=ao[j],after_start=bo[k],after_end=bo[l],before=b''.join(a[i:j]).decode(),after=b''.join(b[k:l]).decode()))
          entry=dict(path=path,change='modified',reason=reason,baseline_sha256=hashlib.sha256(baseline).hexdigest(),edits=edits)
          assert not any(e['path']==path for e in review['files'])
          review['files'].insert(0,entry);contract.write_text(json.dumps(review,indent=2)+'\n')
          p=root/'morphhdl/scripts/check-increment-59g-source-review.py'
          text=p.read_text();assert text.count(old_digest)==1 and text.count('PATHS = (\n')==1
          text=text.replace(old_digest,hashlib.sha256(contract.read_bytes()).hexdigest()).replace('PATHS = (\n','PATHS = (\n    "'+path+'",\n')
          p.write_text(text)
          print('Added the exact 59c adapter span to the 59g review; production source unchanged.')
          PY
          git add -- morphhdl/scripts/check-increment-59c-source-review.py \
            morphhdl/scripts/check-increment-59g-source-review.py \
            morphhdl/contracts/increment-59g-source-review.json
          test "$(git diff --cached --name-only | wc -l)" = 3
          git rm -- .github/workflows/increment-59g-field-inventory-recovery.yml
          git commit -m 'Compose 59c inventory with merged sibling authority; remove recovery workflow'
          git diff --check 5db83983b42c71df4f43d6a7c37c5bd552cd96c5 HEAD
          git rev-parse HEAD > target/59g-field-evidence/head.txt
          git rev-parse HEAD^{tree} > target/59g-field-evidence/tree.txt
      - name: Check complete inherited source authority
        shell: bash
        run: |
          set -euo pipefail
          python3 morphhdl/scripts/check-increment-60f-equivalence-closure.py --source-only \
            > target/59g-field-evidence/source-audit.log 2>&1 || { tail -n 50 target/59g-field-evidence/source-audit.log; exit 1; }
      - name: Preserve the source-checked candidate on staging only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/agent/increment-59g-source-validation | cut -f1)" = '${{ github.sha }}'
          git push origin HEAD:refs/heads/agent/increment-59g-source-validation
          git rev-parse HEAD > target/59g-field-evidence/published-head.txt
      - name: Require all source and artifact rejection controls
        shell: bash
        run: |
          set -euo pipefail
          output=target/59g-field-evidence
          python3 morphhdl/scripts/check-increment-59g-source-review.py --self-test | tee "$output/register-spans.log"
          python3 morphhdl/scripts/check-increment-59h-source-review.py --self-test | tee "$output/owner-spans.log"
          python3 morphhdl/scripts/check-increment-60f-artifacts.py self-test | tee "$output/inventory.log"
          python3 morphhdl/scripts/test-increment-59g-source-review.py > "$output/register-controls.log" 2>&1 || { tail -n 50 "$output/register-controls.log"; exit 1; }
          python3 morphhdl/scripts/test-increment-59h-inherited-source-scope.py > "$output/owner-controls.log" 2>&1 || { tail -n 50 "$output/owner-controls.log"; exit 1; }
          bash morphhdl/scripts/check-native-streamfifocc-boundary.sh --self-test | tee "$output/boundary.log"
          python3 morphhdl/scripts/check-increment-59g-register-bridges.py --self-test | tee "$output/bridge-model.log"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Preserve exact source and diagnostics without credentials
        if: always()
        shell: bash
        run: |
          mkdir -p target/59g-field-evidence
          git status --short > target/59g-field-evidence/status.txt
          git archive HEAD | gzip > target/59g-field-evidence/source.tar.gz
          git update-ref refs/heads/export-59g-field HEAD
          git bundle create target/59g-field-evidence/repository.bundle refs/heads/export-59g-field
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-59g-field-integration
          path: target/59g-field-evidence
          retention-days: 14
          if-no-files-found: error

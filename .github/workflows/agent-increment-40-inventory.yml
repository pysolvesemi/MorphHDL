name: Agent Increment 40 source inventory

on:
  push:
    branches:
      - agent/increment-40-external-symbolic-width
  pull_request:
    branches:
      - parameterized-verilog
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inventory symbolic-width references and native diffs
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ParameterizedBitCount references ==='
          git grep -n 'ParameterizedBitCount' -- '*.scala' || true
          echo '=== ParameterizedWidth references ==='
          git grep -n 'ParameterizedWidth' -- '*.scala' || true
          echo '=== Potential symbolic Spinal factory call sites ==='
          git grep -nE '(Bits|UInt|SInt)\([^)]*[A-Za-z_][A-Za-z0-9_]*[[:space:]]+bits\)' -- \
            'core/src/test/**/*.scala' 'frontend/**/*.scala' 'morphhdl/**/*.scala' 'lib/src/test/**/*.scala' || true
          echo '=== HdlInt imports and parameter declarations in component fixtures ==='
          git grep -nE 'HdlInt|integerParameter|parameter\(' -- \
            'core/src/test/**/*.scala' 'frontend/**/*.scala' 'morphhdl/**/*.scala' 'lib/src/test/**/*.scala' || true
          echo '=== BitCount definition and syntax ==='
          git grep -nE '(^|[^A-Za-z])(case class|class|trait) BitCount|def bits.*BitCount|IntBuilder' -- 'core/src/main/scala/**/*.scala' || true
          echo '=== Native clone and container factories ==='
          git grep -nE 'object cloneOf|object HardType|class HardType|object Reg|def Reg\(|object Vec|def Vec\(|object Stream|def Stream\(|object Flow|def Flow\(' -- \
            'core/src/main/scala/**/*.scala' 'lib/src/main/scala/**/*.scala' || true
          echo '=== Native four-file diff from Increment 0 baseline ==='
          git diff --no-ext-diff --unified=20 \
            8c4241396cd718a36227dcd89a2e6a29d9077f11 HEAD -- \
            core/src/main/scala/spinal/core/BaseType.scala \
            core/src/main/scala/spinal/core/Bits.scala \
            core/src/main/scala/spinal/core/SInt.scala \
            core/src/main/scala/spinal/core/UInt.scala
          echo '=== Relevant project definitions ==='
          grep -nE 'lazy val (core|lib|morph)|dependsOn' build.sbt | head -n 160 || true

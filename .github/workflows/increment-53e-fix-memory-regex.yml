name: Increment 53e repair memory regex escape

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write

concurrency:
  group: increment-53e-memory-regex-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'Apply Increment 53e memory regex repair')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repair exact Scala regex literal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogMemories.scala")
          source = path.read_text(encoding="utf-8")
          old = 'replaceAll("\\s+", " ")'
          new = 'replaceAll("\\\\s+", " ")'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected one invalid regex literal, found {count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogMemories.scala
          git commit -m "Apply Increment 53e memory regex repair"
          git push origin HEAD:${GITHUB_REF_NAME}

name: Increment 59i failed-baseline retry controller

on:
  push:
    branches: [recovery/increment-59i-history-20260914]
    paths:
      - .github/workflows/increment-59i-retry-failed-baseline.yml
      - .github/recovery/59i-failed-ci/retry_baseline.py

permissions:
  contents: write
  actions: write

concurrency:
  group: increment-59i-failed-baseline-68e0edbe
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce exact repair and request only the failed baseline workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/59i-baseline-retry-evidence"
          python3 -B .github/recovery/59i-failed-ci/retry_baseline.py \
            --repository "$GITHUB_WORKSPACE" \
            --destination "$RUNNER_TEMP/59i-baseline-repair" \
            --output "$RUNNER_TEMP/59i-baseline-retry-evidence" \
            --dispatch 2>&1 | tee "$RUNNER_TEMP/59i-baseline-retry-evidence/controller.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment-59i-failed-baseline-68e0edbe-${{ github.run_attempt }}
          path: ${{ runner.temp }}/59i-baseline-retry-evidence
          if-no-files-found: error
          retention-days: 21

name: Lane condition base reconciliation source
on:
  push:
    branches: [agent/lane-when-expression-inlining]
    paths: ['.github/workflows/lane-when-base-reconciliation-export.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Capture both immutable integration parents and complete history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lane-reconcile
          candidate=17f89b14b86545472bee0217b36663ef942540e7
          target=61d1fe0dcac0b52856620944a2d7426fd1390a48
          git rev-parse HEAD 'HEAD^{tree}' > /tmp/lane-reconcile/export-identity.txt
          git rev-parse "$candidate" "$candidate^{tree}" > /tmp/lane-reconcile/candidate-identity.txt
          git rev-parse "$target" "$target^{tree}" > /tmp/lane-reconcile/target-identity.txt
          git bundle create /tmp/lane-reconcile/history.bundle HEAD refs/remotes/origin/parameterized-verilog
          git archive "$candidate" | gzip -n > /tmp/lane-reconcile/candidate.tar.gz
          git archive "$target" | gzip -n > /tmp/lane-reconcile/target.tar.gz
          printf '%s\n' 'Source recovery only. Not compilation, validation, or merge evidence.' > /tmp/lane-reconcile/STATUS.txt
          cd /tmp/lane-reconcile
          sha256sum *.txt *.bundle *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: lane-condition-integration-source
          path: /tmp/lane-reconcile/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

name: Apply Increment 53d resize provenance repair

on:
  push:
    branches:
      - agent/increment-53d-native-streamwidth-adapter
    paths:
      - .github/workflows/increment-53d-resize-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Increment 53d branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-native-streamwidth-adapter
          fetch-depth: 0

      - name: Apply exact Resize provenance repair
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/increment-53d-resize-repair.patch
          git apply --check /tmp/increment-53d-resize-repair.patch
          git apply /tmp/increment-53d-resize-repair.patch
          bash -n morphhdl/scripts/check-native-stream-width-adapter-boundary.sh
          git diff --check
          rm .github/workflows/increment-53d-resize-repair.yml
          git config user.name pysolvesemi
          git config user.email pysolvesemi@gmail.com
          git add morphruntime/src/main/scala/spinal/core/ExternalNativeIntCompilerRuntime.scala \
            morphruntime/src/main/scala/spinal/core/ExternalParameterizedResizeRegistry.scala \
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala \
            morphhdl/scripts/check-native-stream-width-adapter-boundary.sh \
            .github/workflows/increment-53d-resize-repair.yml
          git commit -m 'Increment 53d: retain exact native Resize target provenance'
          git push origin HEAD:agent/increment-53d-native-streamwidth-adapter

name: Increment 53e normalized generic closure

on:
  push:
    branches:
      - agent/increment-53e-native-streamfifocc-parameterization

permissions:
  contents: write

concurrency:
  group: increment-53e-generic-closure
  cancel-in-progress: true

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spinalhdl/docker:latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53e-native-streamfifocc-parameterization
          fetch-depth: 0

      - name: Prepare authenticated checkout
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin parameterized-verilog

      - name: Materialize generic implementation
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            morphhdl/scripts/apply-increment-53e-address-role-repair.py
            morphhdl/scripts/apply-increment-53e-implicit-child-width-formals.py
            morphhdl/scripts/apply-increment-53e-canonical-implicit-formal-identity.py
            morphhdl/scripts/apply-increment-53e-modular-literal-proof.py
            morphhdl/scripts/apply-increment-53e-materialized-auto-resize-proof.py
            morphhdl/scripts/apply-increment-53e-unfixed-literal-width-inference.py
            morphhdl/scripts/apply-increment-53e-full-domain-width-equivalence.py
            morphhdl/scripts/apply-increment-53e-generic-retained-domain-v2.py
            morphhdl/scripts/apply-increment-53e-generic-retained-domain-v4.py
            morphhdl/scripts/apply-increment-53e-generic-comment-cleanup.py
          )
          for script in "${scripts[@]}"; do
            if test -f "$script"; then
              python3 "$script"
            fi
          done
          git diff --check

      - name: Enforce generic engine and native-source boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only origin/parameterized-verilog -- core/src/main lib/src/main idslplugin/src/main)"
          git diff --unified=0 origin/parameterized-verilog -- \
            morphhdl/src/main morphruntime/src/main morphplugin/src/main \
            > /tmp/increment-53e-generic-engine.diff
          python3 - <<'PY'
          import re
          from pathlib import Path

          lines = Path('/tmp/increment-53e-generic-engine.diff').read_text().splitlines()
          code = []
          in_block = False
          for line in lines:
              if not line.startswith('+') or line.startswith('+++'):
                  continue
              value = line[1:]
              out = []
              i = 0
              while i < len(value):
                  if in_block:
                      end = value.find('*/', i)
                      if end < 0:
                          i = len(value)
                      else:
                          in_block = False
                          i = end + 2
                  else:
                      block = value.find('/*', i)
                      single = value.find('//', i)
                      if single >= 0 and (block < 0 or single < block):
                          out.append(value[i:single])
                          i = len(value)
                      elif block >= 0:
                          out.append(value[i:block])
                          in_block = True
                          i = block + 2
                      else:
                          out.append(value[i:])
                          i = len(value)
              code.append(''.join(out))
          executable = '\n'.join(code)
          Path('/tmp/increment-53e-generic-added-code.txt').write_text(executable)
          forbidden = re.compile(
              r'(?<![A-Za-z0-9_])(?:StreamFifoCC|StreamFifo|BufferCC|pushToPopGray|popToPushGray)(?![A-Za-z0-9_])'
              r'|Stream\.scala|CrossClock\.scala'
          )
          matches = sorted(set(forbidden.findall(executable)))
          if matches:
              raise SystemExit(
                  'component-specific engine recognition remains: ' + ', '.join(matches)
              )
          PY
          grep -q 'provesEquivalentOnCompleteRetainedDomain' \
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogNativeFallback.scala
          grep -q 'definitionExpressionRoot' \
            morphruntime/src/main/scala/spinal/core/ExternalNativeIntShadowRegistry.scala

      - name: Install pinned Mill bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0.exe \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill

      - name: Focused native contract on Scala 2.12.18
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill 'morph[2.12.18].testOnly' \
            morphhdl.ParameterizedStreamFifoCCTests \
            2>&1 | tee /tmp/increment-53e-2.12-focused.log

      - name: Focused native contract on Scala 2.13.12
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill 'morph[2.13.12].testOnly' \
            morphhdl.ParameterizedStreamFifoCCTests \
            2>&1 | tee /tmp/increment-53e-2.13-focused.log

      - name: Complete MorphHDL regression on Scala 2.12.18
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill 'morph[2.12.18].test' \
            2>&1 | tee /tmp/increment-53e-2.12-regression.log

      - name: Complete MorphHDL regression on Scala 2.13.12
        shell: bash
        run: |
          set -euo pipefail
          /tmp/morphhdl-mill 'morph[2.13.12].test' \
            2>&1 | tee /tmp/increment-53e-2.13-regression.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-53e-normalized-generic-evidence
          path: |
            /tmp/increment-53e-generic-engine.diff
            /tmp/increment-53e-generic-added-code.txt
            /tmp/increment-53e-2.12-focused.log
            /tmp/increment-53e-2.13-focused.log
            /tmp/increment-53e-2.12-regression.log
            /tmp/increment-53e-2.13-regression.log
          if-no-files-found: ignore

      - name: Publish only after every gate passes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/increment-53e-address-resize-fix.yml
          rm -f .github/workflows/increment-53e-generic-retained-domain-v2.yml
          rm -f .github/workflows/increment-53e-generic-retained-domain-v3.yml
          rm -f .github/workflows/increment-53e-generic-retained-domain-v4.yml
          rm -f .github/workflows/increment-53e-gated-finalize.yml
          rm -f .github/workflows/increment-53e-gated-finalize-v2.yml
          rm -f .github/workflows/increment-53e-gated-finalize-v3.yml
          rm -f morphhdl/scripts/apply-increment-53e-*.py
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only origin/parameterized-verilog -- core/src/main lib/src/main idslplugin/src/main)"
          git commit -m 'Increment 53e: generic native symbolic-width equivalence'
          git push origin HEAD:agent/increment-53e-native-streamfifocc-parameterization

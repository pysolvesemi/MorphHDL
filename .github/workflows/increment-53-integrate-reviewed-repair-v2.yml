name: Increment 53 integrate reviewed repair v2

on:
  push:
    branches:
      - agent/increment-53-native-streamfifo-clean

permissions:
  contents: write

concurrency:
  group: increment-53-integrate-reviewed-repair-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: "${{ !contains(github.event.head_commit.message, '[inc53-integrated-repair]') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-53-native-streamfifo-clean
          fetch-depth: 0

      - name: Run reviewed repair with semantic hierarchy anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/increment-53-integrate-reviewed-repair.yml"
          )
          lines = workflow.read_text().splitlines()
          starts = [
              index for index, line in enumerate(lines)
              if line.strip() == "python3 - <<'PY'"
          ]
          if len(starts) != 1:
              raise SystemExit(
                  f"expected one embedded repair script, found {len(starts)}"
              )
          start = starts[0]
          end = next(
              index for index in range(start + 1, len(lines))
              if lines[index].strip() == "PY"
          )
          body = lines[start + 1:end]
          indent = min(
              len(line) - len(line.lstrip())
              for line in body if line.strip()
          )
          script = "\n".join(
              line[indent:] if line.strip() else "" for line in body
          ) + "\n"

          def replace_definition(text, name, replacement):
              marker = name + " = '''"
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"missing definition {name}")
              payload_start = start + len(marker)
              end = text.find("'''", payload_start)
              if end < 0:
                  raise SystemExit(f"unterminated definition {name}")
              return text[:start] + name + " = '''" + replacement + "'''" + text[end + 3:]

          direct_adapter_branch = """        } else if (
            allowConcreteInternal &&
            assignment.target == assignment.finalTarget &&
            assignment.finalTarget.component == parent &&
            directConcreteOutputAdapter(assignment.source, port)
          ) {
            Vector(LiteralBinding(port.getBitsWidth))
          } else if (
            allowConcreteInternal && assignment.source == port &&
            assignment.finalTarget.component == parent
          ) {
          """
          existing_concrete_branch = """        } else if (
            allowConcreteInternal && assignment.source == port &&
            assignment.finalTarget.component == parent
          ) {
          """
          script = replace_definition(
              script,
              "direct_adapter_branch",
              direct_adapter_branch,
          )
          script = replace_definition(
              script,
              "existing_concrete_branch",
              existing_concrete_branch,
          )
          Path("/tmp/inc53-integrate-reviewed.py").write_text(script)
          PY
          python3 /tmp/inc53-integrate-reviewed.py
          git diff --check

      - name: Publish integrated source repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Reviewed repair is already integrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            morphruntime/src/main/scala/spinal/core/ParameterizedStructure.scala \
            morphhdl/src/main/scala/spinal/core/internals/ExternalParameterizedVerilogHierarchy.scala \
            morphhdl/src/main/scala/spinal/core/internals/ParameterizedVerilogMemories.scala
          git commit -m "fix: integrate reviewed native StreamFifo repair [inc53-integrated-repair]"
          git push origin HEAD:agent/increment-53-native-streamfifo-clean

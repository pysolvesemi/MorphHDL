name: WA-07 signed selection fence

on:
  push:
    branches:
      - agent/wa-07-unified-expression-inlining
    paths:
      - ".github/workflows/wa07-signed-selection-fence.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/spinalhdl/docker:v1.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wa-07-unified-expression-inlining
          fetch-depth: 0

      - name: Apply signed selected-use semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path.cwd()

          def read(relative):
              return (root / relative).read_text(encoding="utf-8")

          def write(relative, text):
              (root / relative).write_text(text, encoding="utf-8")

          source_rel = "morphhdl-passes/src/main/scala/morphhdl/passes/transform/UnnamedWireExpressionEliminationPass.scala"
          source = read(source_rel)
          replacements = [
              (
                  "        receiverWidth,\n        packedType.signedness\n      )\n    )\n  case _ => None\n}",
                  "        receiverWidth,\n        morphhdl.ir.v1.Signedness.Unsigned\n      )\n    )\n  case _ => None\n}",
              ),
              (
                  "        aliasSymbol,\n        packedType.width,\n        packedType.signedness\n      )\n    } else {\n      composedPartSelect(",
                  "        aliasSymbol,\n        packedType.width,\n        morphhdl.ir.v1.Signedness.Unsigned\n      )\n    } else {\n      composedPartSelect(",
              ),
              (
                  "        aliasSymbol,\n        packedType.width,\n        packedType.signedness\n      )\n    } else expression\n  case receiver @ RtlExpr.Ref",
                  "        aliasSymbol,\n        packedType.width,\n        morphhdl.ir.v1.Signedness.Unsigned\n      )\n    } else expression\n  case receiver @ RtlExpr.Ref",
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit("signed selected-use source replacement point is missing or repeated")
              source = source.replace(old, new, 1)
          write(source_rel, source)

          test_rel = "morphhdl-passes/src/test/scala/morphhdl/passes/transform/UnnamedWireExpressionSelectionSafetySpec.scala"
          test = read(test_rel)
          old = "  private def bits(width: Int): PackedType =\n    PackedType(\n      width = IntExpr.Literal(BigInt(width)),\n      signedness = Signedness.Unsigned,\n      valueSemantics = PackedValueSemantics.BitVector\n    )"
          new = "  private def bits(\n      width: Int,\n      signedness: Signedness = Signedness.Unsigned\n  ): PackedType =\n    PackedType(\n      width = IntExpr.Literal(BigInt(width)),\n      signedness = signedness,\n      valueSemantics = PackedValueSemantics.BitVector\n    )"
          if test.count(old) != 1:
              raise SystemExit("selection test bits fixture point is missing")
          test = test.replace(old, new, 1)
          old = "      origin: NameOrigin,\n      visible: Boolean = false\n  ): Declaration ="
          new = "      origin: NameOrigin,\n      visible: Boolean = false,\n      signedness: Signedness = Signedness.Unsigned\n  ): Declaration ="
          if test.count(old) != 1:
              raise SystemExit("selection test declaration fixture point is missing")
          test = test.replace(old, new, 1)
          if test.count("      packedType = Some(bits(width)),") != 1:
              raise SystemExit("selection test packed-type fixture point is missing")
          test = test.replace(
              "      packedType = Some(bits(width)),",
              "      packedType = Some(bits(width, signedness)),",
              1,
          )
          old = "      sinkWidth: Int,\n      rhs: RtlExpr,\n      receiver: RtlExpr\n  ): Design ="
          new = "      sinkWidth: Int,\n      rhs: RtlExpr,\n      receiver: RtlExpr,\n      aliasSignedness: Signedness = Signedness.Unsigned\n  ): Design ="
          if test.count(old) != 1:
              raise SystemExit("selection test design fixture point is missing")
          test = test.replace(old, new, 1)
          old = "              aliasWidth,\n              NameOrigin.Unnamed\n            ),"
          new = "              aliasWidth,\n              NameOrigin.Unnamed,\n              signedness = aliasSignedness\n            ),"
          if test.count(old) != 1:
              raise SystemExit("selection test alias declaration point is missing")
          test = test.replace(old, new, 1)

          added = '''

            test("signed alias full-width part-select keeps unsigned selection semantics") {
              val input = design(
                sourceWidth = 4,
                aliasWidth = 4,
                sinkWidth = 4,
                rhs = add(4),
                receiver = RtlExpr.PartSelect(
                  reference("receiver-signed-full-part", alias),
                  IntExpr.Literal(BigInt(0)),
                  IntExpr.Literal(BigInt(4))
                ),
                aliasSignedness = Signedness.Signed
              )

              val result = UnnamedWireExpressionEliminationPass.run(input, enabled)

              result.status shouldBe PassExecutionStatus.Changed
              outputDriver(result.output).value match {
                case RtlExpr.Resize(
                      _: RtlExpr.Binary,
                      IntExpr.Literal(width),
                      Signedness.Unsigned
                    ) => width shouldBe BigInt(4)
                case other =>
                  fail(s"expected an unsigned full-width selected-use fence, observed $other")
              }
            }

            test("signed alias composed part-select keeps unsigned selection semantics") {
              val input = design(
                sourceWidth = 16,
                aliasWidth = 8,
                sinkWidth = 4,
                rhs = RtlExpr.PartSelect(
                  reference("rhs-signed-source-part", sourceA),
                  IntExpr.Literal(BigInt(2)),
                  IntExpr.Literal(BigInt(8))
                ),
                receiver = RtlExpr.PartSelect(
                  reference("receiver-signed-composed-part", alias),
                  IntExpr.Literal(BigInt(1)),
                  IntExpr.Literal(BigInt(4))
                ),
                aliasSignedness = Signedness.Signed
              )

              val result = UnnamedWireExpressionEliminationPass.run(input, enabled)

              result.status shouldBe PassExecutionStatus.Changed
              outputDriver(result.output).value match {
                case RtlExpr.Resize(
                      RtlExpr.PartSelect(
                        _: RtlExpr.Ref,
                        IntExpr.Literal(offset),
                        IntExpr.Literal(width)
                      ),
                      IntExpr.Literal(fenceWidth),
                      Signedness.Unsigned
                    ) =>
                  offset shouldBe BigInt(3)
                  width shouldBe BigInt(4)
                  fenceWidth shouldBe BigInt(4)
                case other =>
                  fail(s"expected an unsigned composed selected-use fence, observed $other")
              }
            }

            test("signed alias whole-object receiver retains signed assignment semantics") {
              val input = design(
                sourceWidth = 4,
                aliasWidth = 4,
                sinkWidth = 4,
                rhs = add(4),
                receiver = reference("receiver-signed-whole", alias),
                aliasSignedness = Signedness.Signed
              )

              val result = UnnamedWireExpressionEliminationPass.run(input, enabled)

              result.status shouldBe PassExecutionStatus.Changed
              outputDriver(result.output).value match {
                case RtlExpr.Resize(
                      _: RtlExpr.Binary,
                      IntExpr.Literal(width),
                      Signedness.Signed
                    ) => width shouldBe BigInt(4)
                case other =>
                  fail(s"expected a signed whole-object assignment fence, observed $other")
              }
            }
          '''
          if not test.endswith("\n}"):
              raise SystemExit("selection test file ending is unexpected")
          test = test[:-2] + added + "\n}\n"
          write(test_rel, test)

          guard_rel = "morphhdl-passes/scripts/check-wa07-expression-pass.py"
          guard = read(guard_rel)
          marker = '    "selection through a non-direct alias expression fails closed",\n'
          extra = (
              marker
              + '    "signed alias full-width part-select keeps unsigned selection semantics",\n'
              + '    "signed alias composed part-select keeps unsigned selection semantics",\n'
              + '    "signed alias whole-object receiver retains signed assignment semantics",\n'
          )
          if guard.count(marker) != 1:
              raise SystemExit("selection test guard marker is missing")
          write(guard_rel, guard.replace(marker, extra, 1))

          readme_rel = "morphhdl-passes/README.md"
          readme = read(readme_rel)
          old = "The composed result carries an explicit receiver-width and signedness fence.\n"
          new = (
              "The composed result carries an explicit receiver-width fence and unsigned\n"
              "selection semantics, including when the eliminated whole object is signed.\n"
              "A whole-object receiver continues to use the eliminated assignment's original\n"
              "signedness.\n"
          )
          if readme.count(old) != 1:
              raise SystemExit("README selected-use signedness marker is missing")
          write(readme_rel, readme.replace(old, new, 1))

          roadmap_rel = "morphhdl-passes/morphhdl-ir-wire-assignment-passes-todo.md"
          roadmap = read(roadmap_rel)
          old = "  `source[7:0][3:0]` in strict Verilog-2001.\n\n"
          new = (
              "  `source[7:0][3:0]` in strict Verilog-2001. Every accepted bit or\n"
              "  part-select replacement retains unsigned selection semantics; only a\n"
              "  whole-object receiver inherits the removed assignment's signedness.\n\n"
          )
          if roadmap.count(old) != 1:
              raise SystemExit("roadmap selected-use signedness marker is missing")
          write(roadmap_rel, roadmap.replace(old, new, 1))

          (root / ".github/workflows/wa07-signed-selection-fence.yml").unlink()

          registry_rel = "morphhdl-passes/tests/formal_model/wire_assignment_ir/expected-signatures.json"
          registry_path = root / registry_rel
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          for relative in sorted(registry["files"]):
              path = root / relative
              if not path.is_file():
                  raise SystemExit(f"signature target is missing: {relative}")
              registry["files"][relative] = hashlib.sha256(path.read_bytes()).hexdigest()
          registry_path.write_text(
              json.dumps(registry, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git diff --check

      - name: Static contracts
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            check-wa02-adapter-boundary.py \
            check-wa03-gates.py \
            check-wa04-pass.py \
            check-wa05-pass.py \
            check-wa06-pipeline.py \
            check-wa07-expression-pass.py; do
            python3 "morphhdl-passes/scripts/${script}" --self-test
            python3 "morphhdl-passes/scripts/${script}"
          done
          python3 morphhdl-passes/scripts/validate_wire_assignment_equivalence.py --self-test

      - name: Scala 2.12
        working-directory: morphhdl-passes
        shell: bash
        run: sbt -batch ++2.12.18 test

      - name: Scala 2.13
        working-directory: morphhdl-passes
        shell: bash
        run: sbt -batch ++2.13.12 test

      - name: Commit tested tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "WA-07: preserve unsigned selected-use semantics"
          git push origin HEAD:agent/wa-07-unified-expression-inlining

name: Increment 34 bootstrap

on:
  push:
    branches:
      - agent/increment-34-generic-processes

permissions:
  contents: write

concurrency:
  group: increment-34-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/spinalhdl/docker:latest
    env:
      XDG_CACHE_HOME: /tmp/morphhdl-cache
    steps:
      - name: Check out Increment 34 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply reviewed Increment 34 patch
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! command -v patch >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y patch
          fi
          cat .github/inc34-payload/*.b64 > /tmp/increment-34.patch.gz.b64
          echo "76f51872ea0df901f806860cbf9de3c80a11868efc2a2694d76ee9f07fcda56a  /tmp/increment-34.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/increment-34.patch.gz.b64 | gzip -dc > /tmp/increment-34.patch
          echo "00cb50da62d724433553c810ac73455dac15d6e28702c32c50855c9245fc4789  /tmp/increment-34.patch" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('/tmp/increment-34.patch')
          lines = path.read_text().splitlines(True)
          output = []
          index = 0
          header = re.compile(r'^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@(.*)$')

          while index < len(lines):
              match = header.match(lines[index].rstrip('\n'))
              if match is None:
                  output.append(lines[index])
                  index += 1
                  continue

              old_start = int(match.group(1))
              new_start = int(match.group(3))
              suffix = match.group(5)
              header_index = len(output)
              output.append(lines[index])
              index += 1
              body = []

              while (
                  index < len(lines)
                  and not lines[index].startswith('@@ ')
                  and not lines[index].startswith('diff --git ')
              ):
                  line = lines[index]
                  if line == '\n':
                      if index + 1 < len(lines) and (
                          lines[index + 1].startswith('diff --git ')
                          or lines[index + 1].startswith('@@ ')
                      ):
                          index += 1
                          break
                      line = ' \n'
                  body.append(line)
                  index += 1

              old_count = 0
              new_count = 0
              for line in body:
                  if line.startswith('\\ No newline at end of file'):
                      continue
                  if line[0] == ' ':
                      old_count += 1
                      new_count += 1
                  elif line[0] == '-':
                      old_count += 1
                  elif line[0] == '+':
                      new_count += 1
                  else:
                      raise RuntimeError(f'invalid hunk line: {line!r}')

              def coordinate(start, count):
                  return str(start) if count == 1 else f'{start},{count}'

              output[header_index] = (
                  f'@@ -{coordinate(old_start, old_count)} '
                  f'+{coordinate(new_start, new_count)} @@{suffix}\n'
              )
              output.extend(body)

          path.write_text(''.join(output))
          PY
          echo "7aaf2cd26226c89f21a6cbdeb5d878304f2d0cd259f1049faf487fdbae3625a9  /tmp/increment-34.patch" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('/tmp/increment-34.patch').read_text()
          starts = [match.start() for match in re.finditer(r'(?m)^diff --git ', source)]
          starts.append(len(source))
          modified = []
          new_root = Path('/tmp/increment-34-new')

          for start, end in zip(starts, starts[1:]):
              section = source[start:end]
              if '\n--- /dev/null\n' not in section:
                  modified.append(section)
                  continue

              path_match = re.search(r'(?m)^\+\+\+ b/(.+)$', section)
              if path_match is None:
                  raise RuntimeError('new-file patch has no destination path')
              relative = Path(path_match.group(1))
              if relative.is_absolute() or '..' in relative.parts:
                  raise RuntimeError(f'unsafe new-file path: {relative}')

              content = []
              in_hunk = False
              for line in section.splitlines(True):
                  if line.startswith('@@ '):
                      in_hunk = True
                      continue
                  if not in_hunk:
                      continue
                  if line.startswith('+') and not line.startswith('+++'):
                      content.append(line[1:])
                  elif line.startswith('\\ No newline at end of file'):
                      continue
                  elif line.startswith('-'):
                      raise RuntimeError(f'new-file patch deletes content: {relative}')
                  elif line.startswith(' '):
                      content.append(line[1:])

              destination = new_root / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(''.join(content))

          Path('/tmp/increment-34-mod.patch').write_text(''.join(modified))
          PY
          echo "7f970ec11cbcb4281d03abd2dbf7b2d2736badf5bb78df9e153503ae555d6037  /tmp/increment-34-mod.patch" | sha256sum -c -
          echo "c3113bc973346310067c575183940921b35a6b41535e31a93f36cb49297d2843  /tmp/increment-34-new/core/src/main/scala/spinal/core/ParameterizedProcess.scala" | sha256sum -c -
          echo "d1531942e85421dd25d1c493da37eab62b7b68c64779be76339e673628a51aab  /tmp/increment-34-new/core/src/main/scala/spinal/core/internals/ParameterizedVerilogProcesses.scala" | sha256sum -c -
          echo "b52ede60f83592ef756f8ec2a4752b3cadb44ce68d0e17ba7b8267c28021f011  /tmp/increment-34-new/morphhdl/src/test/scala/morphhdl/GenericProcessLoweringTests.scala" | sha256sum -c -
          if ! patch --dry-run --batch --forward --fuzz=3 -p1 \
            < /tmp/increment-34-mod.patch > /tmp/increment-34-apply.log 2>&1; then
            cat /tmp/increment-34-apply.log
            echo "::error file=.github/workflows/increment-34-bootstrap.yml,line=1::$(tr '\n' ' ' </tmp/increment-34-apply.log)"
            exit 1
          fi
          patch --batch --forward --fuzz=3 -p1 < /tmp/increment-34-mod.patch
          while IFS= read -r -d '' generated; do
            relative="${generated#/tmp/increment-34-new/}"
            if [[ -e "$relative" ]]; then
              echo "::error file=$relative,line=1::Increment 34 new-file destination already exists"
              exit 1
            fi
            mkdir -p "$(dirname "$relative")"
            cp "$generated" "$relative"
          done < <(find /tmp/increment-34-new -type f -print0)
          if find . -name '*.rej' -print -quit | grep -q .; then
            find . -name '*.rej' -print
            echo "::error file=.github/workflows/increment-34-bootstrap.yml,line=1::Increment 34 patch left reject files"
            exit 1
          fi
          find . -name '*.orig' -delete
          grep -q 'object ParameterizedProcess' core/src/main/scala/spinal/core/ParameterizedProcess.scala
          grep -q 'object ParameterizedVerilogProcesses' core/src/main/scala/spinal/core/internals/ParameterizedVerilogProcesses.scala
          grep -q 'ParameterizedVerilogProcesses.rewrite' core/src/main/scala/spinal/core/internals/PhaseVerilog.scala
          grep -q 'class GenericProcessLoweringTests' morphhdl/src/test/scala/morphhdl/GenericProcessLoweringTests.scala
          git diff --check
          rm -rf .github/inc34-payload
          rm -f .github/workflows/increment-34-bootstrap.yml

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.1.0/mill-dist-1.1.0-mill.sh \
            --output /tmp/morphhdl-mill
          chmod +x /tmp/morphhdl-mill
          if ! command -v iverilog >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y iverilog
          fi

      - name: Run Increment 34 focused regression
        shell: bash
        run: |
          set -euo pipefail
          if ! /tmp/morphhdl-mill morph[2.12.18].testOnly \
            morphhdl.GenericProcessLoweringTests \
            morphhdl.StructuralGenerateControlTests \
            morphhdl.GenericExpressionAndStreamTests \
            > /tmp/increment-34-test.log 2>&1; then
            tail -n 240 /tmp/increment-34-test.log
            diagnostic="$(tail -n 120 /tmp/increment-34-test.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error file=.github/workflows/increment-34-bootstrap.yml,line=1::$diagnostic"
            exit 1
          fi
          cat /tmp/increment-34-test.log

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: lower generic parameterized processes"
          git push origin "HEAD:${GITHUB_REF_NAME}"

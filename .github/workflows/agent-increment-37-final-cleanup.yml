name: Agent Increment 37 final cleanup

on:
  push:
    branches:
      - agent/increment-37-parameterized-streamfifo-depth

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            docs/morphhdl/.increment-37-pr-sentinel \
            .github/workflows/agent-increment-37-final-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove Increment 37 PR sentinel'
          git push origin HEAD:agent/increment-37-parameterized-streamfifo-depth

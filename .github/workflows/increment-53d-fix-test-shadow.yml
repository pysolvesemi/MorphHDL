name: Repair Increment 53d test configuration shadow

on:
  push:
    branches:
      - agent/increment-53d-native-streamwidth-adapter
    paths:
      - .github/workflows/increment-53d-fix-test-shadow.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-53d-native-streamwidth-adapter
          fetch-depth: 0

      - name: Rename shadowing test-local configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("morphhdl/src/test/scala/morphhdl/ParameterizedStreamWidthAdapterTests.scala")
          text = path.read_text(encoding="utf-8")
          old = '''    withTemporaryDirectory { directory =>
              val config = config(directory)
              config.netlistFileName = "native_stream_width_adapter_independent.v"
              val result = MorphVerilog.tryGenerate(config) {
          '''
          new = '''    withTemporaryDirectory { directory =>
              val generationConfig = config(directory)
              generationConfig.netlistFileName = "native_stream_width_adapter_independent.v"
              val result = MorphVerilog.tryGenerate(generationConfig) {
          '''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          elif new not in text:
              raise SystemExit("Increment 53d test configuration anchor not found")
          PY

          git diff --check
          if git diff --quiet; then
            echo "Test configuration shadow already repaired"
            exit 0
          fi
          if git diff --name-only | grep -Eq '^(core|lib|idslplugin)/'; then
            echo "Increment 53d must not modify native SpinalHDL source" >&2
            exit 1
          fi
          git config user.name "MorphHDL Increment Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morphhdl/src/test/scala/morphhdl/ParameterizedStreamWidthAdapterTests.scala
          git commit -m "test: avoid StreamWidthAdapter config helper shadow"
          git push origin HEAD:agent/increment-53d-native-streamwidth-adapter
